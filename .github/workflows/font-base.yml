name: NAV source font and PNG foundation strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  font-base:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-boot-smoke-v1
        fail-on-cache-miss: true
    - name: Build source font foundation and strict suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"libpng-1.6.58.tar.xz\", \"url\": \"https://downloads.sourceforge.net/libpng/libpng-1.6.58.tar.xz\", \"bytes\": 1070096, \"book_md5\": \"c6c372a9d7754c66e0b77a8d34987a3b\", \"sha256\": \"28eb403f51f0f7405249132cecfe82ea5c0ef97f1b32c5a65828814ae0d34775\"\
        }, {\"filename\": \"freetype-2.14.3.tar.xz\", \"url\": \"https://downloads.sourceforge.net/freetype/freetype-2.14.3.tar.xz\", \"bytes\": 2670220, \"book_md5\": \"5e78e6fdce5a61d3075e4c25e9852f84\", \"sha256\": \"36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f\"}, {\"filename\": \"fontconfig-2.18.3.tar.xz\", \"url\": \"https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.3/fontconfig-2.18.3.tar.xz\", \"bytes\": 1172016, \"book_md5\": \"ce819e229ca6fb7d1be47a192d6681a3\", \"sha256\": \"4f7b554a38cdf78c033f666c8871f3749e14a094f65a07f630c91ed0b43d35e3\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\\
        '\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/font-base.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf\
        \ libpng-1.6.58.tar.xz\\\\ncd libpng-1.6.58\\\\nprintf \"BEGIN_FINAL_PACKAGE libpng-1.6.58\\\\\\\\n\"\\\\n./configure --prefix=/usr --disable-static &&\\\\nmake\\\\nrun_test libpng make -j2 check\\\\nmake install\\\\nprintf \"DONE_FINAL_PACKAGE libpng-1.6.58\\\\\\\\n\"\\\\ncd /sources\\\\nrm -rf -- libpng-1.6.58\\\\ncd /sources\\\\ntar -xf freetype-2.14.3.tar.xz\\\\ncd freetype-2.14.3\\\\nprintf \"BEGIN_FINAL_PACKAGE freetype-2.14.3\\\\\\\\n\"\\\\nsed -ri \"s:.*(AUX_MODULES.*valid):\\\\\\\\1:\" modules.cfg &&\\\\n\\\\nsed -r \"s:.*(#.*SUBPIXEL_RENDERING) .*:\\\\\\\\1:\" \\\\\\\\\\\\n    -i include/freetype/config/ftoption.h   &&\\\\n\\\\n./configure --prefix=/usr            \\\\\\\\\\\\n            --disable-static         \\\\\\\\\\\\n            --enable-freetype-config \\\\\\\\\\\\n            --with-harfbuzz=dynamic  &&\\\\nmake\\\\nprintf \"NAV_FONT_FREETYPE_NO_UPSTREAM_TEST_SUITE\\\\\\\\n\"\\\\nmake install\\\\nprintf \"DONE_FINAL_PACKAGE freetype-2.14.3\\\\\\\\n\"\\\\ncd /sources\\\
        \\nrm -rf -- freetype-2.14.3\\\\ncd /sources\\\\ntar -xf fontconfig-2.18.3.tar.xz\\\\ncd fontconfig-2.18.3\\\\nprintf \"BEGIN_FINAL_PACKAGE fontconfig-2.18.3\\\\\\\\n\"\\\\n./configure --prefix=/usr        \\\\\\\\\\\\n            --sysconfdir=/etc    \\\\\\\\\\\\n            --localstatedir=/var \\\\\\\\\\\\n            --disable-docs       \\\\\\\\\\\\n            --docdir=/usr/share/doc/fontconfig-2.18.3 &&\\\\nmake\\\\nrun_test fontconfig make -j2 check\\\\nmake install\\\\nprintf \"DONE_FINAL_PACKAGE fontconfig-2.18.3\\\\\\\\n\"\\\\ncd /sources\\\\nrm -rf -- fontconfig-2.18.3\\\\nldconfig\\\\npkg-config --modversion libpng freetype2 fontconfig\\\\nfc-cache -fv\\\\nfc-list\\\\nfreetype-config --ftversion\\\\ncat > /tmp/nav-font-link.c <<\\\\\\'C\\\\\\'\\\\n#include <ft2build.h>\\\\n#include FT_FREETYPE_H\\\\n#include <fontconfig/fontconfig.h>\\\\n#include <png.h>\\\\nint main(void){FT_Library l;if(FT_Init_FreeType(&l))return 1;if(!FcInit())return 2;if(!png_access_version_number())return\
        \ 3;FT_Done_FreeType(l);FcFini();return 0;}\\\\nC\\\\ngcc /tmp/nav-font-link.c $(pkg-config --cflags --libs freetype2 fontconfig libpng) -o /tmp/nav-font-link\\\\n/tmp/nav-font-link\\\\nprintf \\\\\\'NAV_FONT_BASE_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'BLFS13.1 libpng and Fontconfig configured suites passed; FreeType has no upstream suite, linked init smoke passed. No fonts or rendered desktop acceptance yet.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_FONT_BASE_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc\
        \ \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/font-base.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\
        \\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/font-base.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build\
        \ failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_FONT','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested font foundation
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-font-base-v1
