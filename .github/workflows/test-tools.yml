name: NAV LFS final test tools stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  test-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested final early libraries checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-early-v1
        fail-on-cache-miss: true
    - name: Build test infrastructure with available upstream suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"flex-2.6.4.tar.gz\", \"url\": \"https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz\", \"bytes\": 1419096, \"book_md5\": \"2882e3179748cc9f9c23ec593d6adc8d\", \"sha256\": \"e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995\"\
        }, {\"filename\": \"tcl8.6.18-src.tar.gz\", \"url\": \"https://downloads.sourceforge.net/tcl/tcl8.6.18-src.tar.gz\", \"bytes\": 11816279, \"book_md5\": \"acfe0c9f7d0c626ecf026e834a888da6\", \"sha256\": \"14f9af32b1767ff718477a8f974ad03c34341097e6b43f4ce54644ee974e268e\"}, {\"filename\": \"expect5.45.4.tar.gz\", \"url\": \"https://prdownloads.sourceforge.net/expect/expect5.45.4.tar.gz\", \"bytes\": 632363, \"book_md5\": \"00fce8de158422f5ccd2666512329bd2\", \"sha256\": \"49a7da83b0bdd9f46d04a04deec19c7767bb9a323e40c4781f89caf760b92c34\"}, {\"filename\": \"dejagnu-1.6.3.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/dejagnu/dejagnu-1.6.3.tar.gz\", \"bytes\": 622059, \"book_md5\": \"68c5208c58236eba447d7d6d1326b821\", \"sha256\": \"87daefacd7958b4a69f88c6856dbd1634261963c414079d0c371f589cd66a2e3\"}, {\"filename\": \"ninja-1.13.2.tar.gz\", \"url\": \"https://github.com/ninja-build/ninja/archive/v1.13.2/ninja-1.13.2.tar.gz\", \"bytes\": 292385, \"book_md5\": \"76c00637fde44909cd7d56f8d73f2042\"\
        , \"sha256\": \"974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17\"}, {\"filename\": \"pkgconf-3.0.5.tar.xz\", \"url\": \"https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.5.tar.xz\", \"bytes\": 426972, \"book_md5\": \"18c528161e6b04ae36dc981af8c4d97e\", \"sha256\": \"3acd3a8a3cce65a8d620321855d92fb602e026cbe8e13ee36bdec58483b59ace\"}, {\"filename\": \"expect-5.45.4-gcc15-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/expect-5.45.4-gcc15-1.patch\", \"bytes\": 12155, \"book_md5\": \"0ca4d6bb8d572fbcdb13cb36cd34833e\", \"sha256\": \"ab5fc0af9e2e0f80d7623c1a3a3dbeb1da3d8c9134276792199df401f9eb2cec\"}, {\"filename\": \"meson-1.12.0.tar.gz\", \"url\": \"https://github.com/mesonbuild/meson/releases/download/1.12.0/meson-1.12.0.tar.gz\", \"bytes\": 2518280, \"book_md5\": \"9f943c267d63016012efcb0f31ecdd7d\", \"sha256\": \"88afe0c20e52030218924ac37d0c81c59b4b5f3ae3752c8c6d7470c7d365886c\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\\
        'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/test-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport NINJAJOBS=2\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/manifests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n \"$@\" 2>&1 | tee \"/nav-build-metadata/tests/$name.log\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf flex-2.6.4.tar.gz\\\\ncd flex-2.6.4\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE flex-2.6.4\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/flex-2.6.4\\\
        \\nmake\\\\nrun_test flex make check\\\\nmake install\\\\nln -sv flex   /usr/bin/lex\\\\nln -sv flex.1 /usr/share/man/man1/lex.1\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE flex-2.6.4\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- flex-2.6.4\\\\ncd /sources\\\\ntar -xf tcl8.6.18-src.tar.gz\\\\ncd tcl8.6.18\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE tcl8.6.18\\\\\\\\n\\\\\\'\\\\nSRCDIR=$(pwd)\\\\ncd unix\\\\n./configure --prefix=/usr           \\\\\\\\\\\\n            --mandir=/usr/share/man \\\\\\\\\\\\n            --disable-rpath\\\\nmake\\\\n\\\\nsed -e \"s|$SRCDIR/unix|/usr/lib|\" \\\\\\\\\\\\n    -e \"s|$SRCDIR|/usr/include|\"  \\\\\\\\\\\\n    -i tclConfig.sh\\\\n\\\\nsed -e \"s|$SRCDIR/unix/pkgs/tdbc1.1.13|/usr/lib/tdbc1.1.13|\" \\\\\\\\\\\\n    -e \"s|$SRCDIR/pkgs/tdbc1.1.13/generic|/usr/include|\"     \\\\\\\\\\\\n    -e \"s|$SRCDIR/pkgs/tdbc1.1.13/library|/usr/lib/tcl8.6|\"  \\\\\\\\\\\\n    -e \"s|$SRCDIR/pkgs/tdbc1.1.13|/usr/include|\"             \\\\\\\\\\\\n    -i pkgs/tdbc1.1.13/tdbcConfig.sh\\\
        \\n\\\\nsed -e \"s|$SRCDIR/unix/pkgs/itcl4.3.7|/usr/lib/itcl4.3.7|\" \\\\\\\\\\\\n    -e \"s|$SRCDIR/pkgs/itcl4.3.7/generic|/usr/include|\"    \\\\\\\\\\\\n    -e \"s|$SRCDIR/pkgs/itcl4.3.7|/usr/include|\"            \\\\\\\\\\\\n    -i pkgs/itcl4.3.7/itclConfig.sh\\\\n\\\\nunset SRCDIR\\\\nrun_test tcl env LC_ALL=C.UTF-8 make test\\\\nmake install \\\\nchmod 644 /usr/lib/libtclstub8.6.a\\\\nchmod -v u+w /usr/lib/libtcl8.6.so\\\\nmake install-private-headers\\\\nln -sfv tclsh8.6 /usr/bin/tclsh\\\\nmv -v /usr/share/man/man3/{Thread,Tcl_Thread}.3\\\\ngrep -E \\\\\\'Failed[[:space:]]+0([[:space:]]|$)\\\\\\' /nav-build-metadata/tests/tcl.log\\\\n! grep -E \\\\\\'Failed[[:space:]]+[1-9]\\\\\\' /nav-build-metadata/tests/tcl.log\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE tcl8.6.18\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- tcl8.6.18\\\\ncd /sources\\\\ntar -xf expect5.45.4.tar.gz\\\\ncd expect5.45.4\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE expect5.45.4\\\\\\\\n\\\\\\'\\\\npython3 -c \\\\\\'from\
        \ pty import spawn; spawn([\"echo\", \"ok\"])\\\\\\'\\\\npatch -Np1 -i ../expect-5.45.4-gcc15-1.patch\\\\n./configure --prefix=/usr           \\\\\\\\\\\\n            --with-tcl=/usr/lib     \\\\\\\\\\\\n            --enable-shared         \\\\\\\\\\\\n            --disable-rpath         \\\\\\\\\\\\n            --mandir=/usr/share/man \\\\\\\\\\\\n            --with-tclinclude=/usr/include\\\\nmake\\\\nrun_test expect make test\\\\nmake install\\\\nln -svf expect5.45.4/libexpect5.45.4.so /usr/lib\\\\n! grep -E \\\\\\'^FAIL:|# of unexpected (failures|successes)[[:space:]]+[1-9]\\\\\\' /nav-build-metadata/tests/expect.log\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE expect5.45.4\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- expect5.45.4\\\\ncd /sources\\\\ntar -xf dejagnu-1.6.3.tar.gz\\\\ncd dejagnu-1.6.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE dejagnu-1.6.3\\\\\\\\n\\\\\\'\\\\nmkdir -v build\\\\ncd       build\\\\n../configure --prefix=/usr\\\\nmakeinfo --html --no-split -o doc/dejagnu.html\
        \ ../doc/dejagnu.texi\\\\nmakeinfo --plaintext       -o doc/dejagnu.txt  ../doc/dejagnu.texi\\\\nrun_test dejagnu make check\\\\nmake install\\\\ninstall -v -dm755  /usr/share/doc/dejagnu-1.6.3\\\\ninstall -v -m644   doc/dejagnu.{html,txt} /usr/share/doc/dejagnu-1.6.3\\\\n! grep -E \\\\\\'^FAIL:|# of unexpected (failures|successes)[[:space:]]+[1-9]\\\\\\' /nav-build-metadata/tests/dejagnu.log\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE dejagnu-1.6.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- dejagnu-1.6.3\\\\ncd /sources\\\\ntar -xf ninja-1.13.2.tar.gz\\\\ncd ninja-1.13.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE ninja-1.13.2\\\\\\\\n\\\\\\'\\\\nsed -i \\\\\\'/int Guess/a \\\\\\\\\\\\n  int   j = 0;\\\\\\\\\\\\n  char* jobs = getenv( \"NINJAJOBS\" );\\\\\\\\\\\\n  if ( jobs != NULL ) j = atoi( jobs );\\\\\\\\\\\\n  if ( j > 0 ) return j;\\\\\\\\\\\\n\\\\\\' src/ninja.cc\\\\npython3 configure.py --bootstrap --verbose\\\\ninstall -vm755 ninja /usr/bin/\\\\ninstall -vDm644 misc/bash-completion\
        \ /usr/share/bash-completion/completions/ninja\\\\ninstall -vDm644 misc/zsh-completion  /usr/share/zsh/site-functions/_ninja\\\\nprintf \\\\\\'NAV_PACKAGE_BOOTSTRAP_ONLY ninja-no-cmake-suite\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE ninja-1.13.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- ninja-1.13.2\\\\ncd /sources\\\\ntar -xf pkgconf-3.0.5.tar.xz\\\\ncd pkgconf-3.0.5\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE pkgconf-3.0.5\\\\\\\\n\\\\\\'\\\\ntar -xf ../meson-1.12.0.tar.gz\\\\nmkdir build\\\\ncd    build\\\\n\\\\npython3 ../meson-1.12.0/meson.py setup --prefix=/usr --buildtype=release ..\\\\nninja\\\\nrun_test pkgconf ninja test\\\\nninja install\\\\nmv /usr/share/doc/pkgconf{,-3.0.5}\\\\nln -sv pkgconf   /usr/bin/pkg-config\\\\nln -sv pkgconf.1 /usr/share/man/man1/pkg-config.1\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE pkgconf-3.0.5\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- pkgconf-3.0.5\\\\n\\\\nldconfig\\\\nprintf \\\\\\'puts [expr {19+23}]\\\\n\\\\\\' | tclsh | grep\
        \ -x 42\\\\nexpect -c \\\\\\'spawn /bin/echo NAV_EXPECT_PTY_OK; expect NAV_EXPECT_PTY_OK; wait\\\\\\'\\\\npkg-config --modversion zlib\\\\nninja --version\\\\nruntest --version\\\\nprintf \\\\\\'NAV_TEST_TOOLS_SMOKE_OK\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 final test infrastructure built; Ninja bootstrap checked, full CMake suite unavailable. Final base incomplete, not bootable desktop.\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_TEST_TOOLS_STAGE_COMPLETE\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath\
        \ /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/test-tools.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/test-tools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n\
        try:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_TEST_TOOLS','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested build infrastructure checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-test-tools-v1
