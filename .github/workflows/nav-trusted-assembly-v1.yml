name: NAV trusted private input assembly review v1
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private
      == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Exact reviewed source bootstrap, no credentials
      run: "set -euo pipefail\nsudo -E python3 - <<'STAGE'\nimport pathlib,os,re,urllib.request,hashlib\n\
        D=pathlib.Path('/mnt/nav-assembly-v1');assert not D.exists();D.mkdir(mode=0o700);os.chown(D,int(os.environ['SUDO_UID']),int(os.environ['SUDO_GID']))\n\
        commit=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',commit)\n\
        assert os.environ['GITHUB_REPOSITORY']=='hardiksayalwork-ai/nav-linux-build'\n\
        assert os.environ['GITHUB_RUN_NUMBER']=='1' and os.environ['GITHUB_RUN_ATTEMPT']=='1'\n\
        class NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*a):return\
        \ None\nop=urllib.request.build_opener(NoRedirect())\npins={'assemble.py':\
        \ '85d39ff9ec6a2856a7a64df20166d403aa60887a896354a5d87c3c40135759d6', 'base_transfer.py':\
        \ '20329ecbb88d4417a06aba42880b09cc4669e70454706325d423127da0f822a3', 'cache-manifest45.json':\
        \ '678ed61b4bdb6eb2cee53cbd2d7b0a2cdebd4d169d59d55c2652cd5fc7b75cc5', 'cache_verify.py':\
        \ '36c19d80ab45a7cffd34fcf09e278c8948678b554e92ae864658a1afd93f2375', 'collector.py':\
        \ '463d8275a103e45a3097c926009d9f8966f0d8e0eea5a13b23baa92fcac466bb', 'compile_ledger.py':\
        \ 'e8d0b9d1a7bd4f2dd4202e6a5a712c94335e2c0b047238c151bdad85dc5e5b16', 'config/nav-test.conf':\
        \ '2de089ab4054cc4ec6091bbae9331cf123e4d634482e111787ca602d7272de2d', 'daemon_owner.py':\
        \ 'ba6d5e650c8c8ed58c494c71120aaf65fc41e1d0552ba06dc4dec01bf1b1f064', 'guest_gate.py':\
        \ 'f3dcce6ab36273d1a1fc6f9fe1deec725186b4426c1775d0af2fb9afc6ecbdaa', 'init.failclosed':\
        \ '46d30f9648482e47423edd771115ec291ad0edbded90bd3d8dfbbfbe65698c5f', 'injection-pinset.json':\
        \ '984ed4d768ce5e1678410aeeadc94255fd8d95baef66c6937f463bf275f02822', 'injection_inputs.py':\
        \ '172c6569d6b3de7d952cb7cd024944808ce775752bbb70bb749bba1d5eb463fb', 'input_gate.py':\
        \ '67be156b81fb45a3405fc53e369455bb44424963a41eb8580df636f80c05d56e', 'manager_authority.py':\
        \ '9867f24266f8197bd31425da027f3947e322fa6d5da6ef91fb54f50feb877f98', 'native_lifecycle.py':\
        \ '1e87b7690fc46bd8e510244daeabcebd05ad25e9d65e3d274a46e3d6ba1665b2', 'nav-login-terminal.py':\
        \ '261a8852585541fe935719691d1f5aa26cdf85cd86a640dd0a1e780df322314f', 'nav-user-session.py':\
        \ '8e857b8f284f96fa4382193ccb6b7c54e15e3e99eb6dd88ff0de2391c52e01db', 'overlay_binding.py':\
        \ '6c8326434564b38818afe2d50ea7891777a367f248a0285d7012e92aae7eeed3', 'policies/nav-test-greeter':\
        \ '9eac23fe0834f8a26fbae3027c242459f9d0fd4904ed5f0e768186ad50cec62b', 'policies/nav-test-user':\
        \ 'ad1606fb1711362f2e14124600f587d520b1fc4834b05484b2a022f590d848ff', 'prompt_literals.py':\
        \ '0d494a890154afa763aabc375e218f91743ee6124edfe39d8530026aa69f2e2e', 'provisioner.py':\
        \ 'ffdab063bfcade3d709e014fcf950ee190acb9c314364c861662c72b2a855634', 'quiesce.py':\
        \ '05e040591bcd8fcb73bb42f1d34fe8e890c4b909284378627693b296ec472a89', 'retention_transport.py':\
        \ 'a4d9fd02e475ddce71664bdb8a841f7d503b8f7ff9e856ed55c3ce019264fb87', 'revised_bundle.py':\
        \ '5d23ca3d1d3e0077fcd84529506c558dc2e98f07966c2f9d0093ba907e9f0889', 'runtime-input-binding.json':\
        \ '0c2ce550bb906c9abb626fe6be94c1c3de47037a93fd126d1055c397896399e5', 'session_cleanup.py':\
        \ '575d5964f8b076dc77a24e2765b2c75afa4adba54001820de2e4c6cd76a08b9d', 'session_discovery.py':\
        \ '7681871d11d495f2b2f89c9d96e67ca5e09b39bcc282be8e38c6775102ca238e', 'teardown.py':\
        \ '66255ca85eadc7a3f90e765426da3b043898037e4fae7b74438147475a2500c5', 'terminal_driver.py':\
        \ '680bb1b3e898948512af5956c5c119c9c48d49cba1e4e1b1281fc276873a9148', 'trusted_bootstrap_builder.py':\
        \ '4ddd1efb0e56fd5df15b9724c8e5d8b7be7391242a17d46413dcb6818e68126f', 'trusted_entry.py':\
        \ '5f5367f0cd97404695022ab4ee8378d82d07eba6c3df923abcd655b548fb47c5', 'trusted_initrd_builder.py':\
        \ '277c1edddad7c6adf723301502fd6b1383795b92859f9a2abd971091f314da8e'}\nfor\
        \ name,sha in pins.items():\n with op.open('https://raw.githubusercontent.com/hardiksayalwork-ai/nav-linux-build/'+commit+'/build/trusted-assembly-v1/'+name,timeout=45)as\
        \ r:\n  assert r.status==200;b=r.read(2097153)\n assert len(b)<=2097152 and\
        \ hashlib.sha256(b).hexdigest()==sha\n p=D/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);os.chown(p,int(os.environ['SUDO_UID']),int(os.environ['SUDO_GID']))\n\
        STAGE\n"
    - name: Fresh owner and exact45 preflight before tool setup
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python3 - <<''CHECK''

        import sys,os

        sys.path.insert(0,''/mnt/nav-assembly-v1'')

        from assemble import fresh_audience,cache_guard

        try:fresh_audience(os.environ[''GH_TOKEN''],''before-tools'');cache_guard(os.environ[''GH_TOKEN''])

        except BaseException:raise SystemExit(''NAV_ASSEMBLY_PREFLIGHT_FAILED_NO_RAW_DIAGNOSTIC'')from
        None

        CHECK

        '
    - name: Host ISO extractor only, bounded disk
      run: 'set -euo pipefail

        sudo apt-get update -qq > /mnt/nav-assembly-v1/host-tools.log 2>&1

        sudo apt-get install -y --no-install-recommends xorriso >> /mnt/nav-assembly-v1/host-tools.log
        2>&1

        test $(df --output=avail -B1 /mnt | tail -1) -ge 4294967296

        '
    - name: ONE exact source assembly and unpublished private readback, no target
        execution
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python3 /mnt/nav-assembly-v1/assemble.py

        '
    - name: Always exact45 postflight, no cache writes/deletes
      if: ${{ always() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python3 - <<''CHECK''

        import sys,os

        sys.path.insert(0,''/mnt/nav-assembly-v1'')

        from assemble import cache_guard

        try:cache_guard(os.environ[''GH_TOKEN''])

        except BaseException:raise SystemExit(''NAV_ASSEMBLY_POSTFLIGHT_FAILED_NO_RAW_DIAGNOSTIC'')from
        None

        print(''NAV_TRUSTED_ASSEMBLY_CACHE_POSTFLIGHT_VERIFIED'')

        CHECK

        '
