name: NAV heif cargo-c combined install-only recovery original hashes no test replay
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-heif-cargoc-recovery
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-aomrepair-root.tar.zst /mnt/nav-recovery-root.tar.zst; do\n test ! -e \"$bundle\"\n sudo install\
        \ -o \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c\
        \ '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n\
        \ printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\"\
        \ proof\n zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\"\
        \ \"$probe/recovered\"\n # Match actions/cache extraction semantics, not only bundle writer access.\n test\
        \ \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n\
        \ relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\"\
        \ -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n\
        \ set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\
        \n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program\
        \ unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_RECOVERY_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_RECOVERY_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_RECOVERY_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_RECOVERY_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_RECOVERY_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_RECOVERY_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore protected corrected AOM checkpoint with x265 and libde265
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-aomrepair-root.tar.zst
        key: nav-blfs13.1-x86_64-aom-static-repair-open-v1
        fail-on-cache-miss: true
    - name: Verify exact corrected AOM root
      shell: bash
      run: 'set -euo pipefail

        printf "d28cadb0d6b7014f6b83f57fa5d136ead9448456bd640d211a31fa676b37e129  /mnt/nav-aomrepair-root.tar.zst\n"
        | sha256sum -c -

        zstd -t /mnt/nav-aomrepair-root.tar.zst

        tar --zstd -xf /mnt/nav-aomrepair-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/aom-repair/AOMREPAIR-TRANSITIONAL-OPEN.json

        '
    - name: Authenticated original archived evidence recovery, all760 payloads byte hash exact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 - <<'ARCHIVE'\nimport os,time,json,urllib.request,urllib.error,email.utils\nTOKEN=os.environ['GH_TOKEN'];assert\
        \ TOKEN\nBASE='https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/'\nclass SafeRedirect(urllib.request.HTTPRedirectHandler):\n\
        \ def redirect_request(self,req,fp,code,msg,headers,newurl):\n  new=super().redirect_request(req,fp,code,msg,headers,newurl)\n\
        \  if new is not None and not newurl.startswith('https://api.github.com/'):new.remove_header('Authorization')\n\
        \  return new\nOPENER=urllib.request.build_opener(SafeRedirect())\ndef api(path):\n assert not path.startswith('/')\
        \ and '://'not in path\n for attempt in range(5):\n  req=urllib.request.Request(BASE+path,headers={'Authorization':'Bearer\
        \ '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Cache-Control':'no-store'})\n\
        \  try:\n   with OPENER.open(req,timeout=120)as r:return r.read()\n  except urllib.error.HTTPError as ex:\n\
        \   if ex.code not in(403,429,500,502,503,504)or attempt==4:raise RuntimeError('GitHub API request failed\
        \ status '+str(ex.code))from None\n   delay=max(30,min(600,int(ex.headers.get('Retry-After','60'))))\n \
        \  if ex.headers.get('X-RateLimit-Remaining')=='0':\n    delay=max(delay,int(ex.headers.get('X-RateLimit-Reset','0'))-int(time.time())+5)\n\
        \   if delay>900:raise RuntimeError('Rate limit reset beyond bounded retry; no save or deletion')from None\n\
        \   print('NAV_AUTHENTICATED_API_RETRY',attempt+1,'delay_seconds',delay,flush=True);time.sleep(delay)\n\
        \ raise RuntimeError('API bounded retries exhausted')\n\nfrom pathlib import Path,PurePosixPath\nimport\
        \ base64,gzip,re,hashlib,collections,json\nr=Path('/mnt/nav-lfs');p=r/'nav-build-metadata/recovery';p.mkdir(parents=True)\n\
        for job,prefix,dest,pin in [(135634333285,'NAV_HEIFSAVE_',r/'nav-build-metadata/libheif','783bcf8fd1868b21e2d58025fa7ae71689f14d16072aafa2f400a8dd0425d672'),(135647228499,'NAV_CARGOC_',r/'nav-build-metadata/cargo-c','cab1f2553d7a3ef147b936f9ff1d2711b643541242a0585cf210b57bf62098b7')]:\n\
        \ raw=api('actions/jobs/'+str(job)+'/logs');text=raw.decode();parts=collections.defaultdict(list)\n for\
        \ line in text.splitlines():\n  m=re.search(r'\\b'+prefix+r'([A-Z0-9_-]+)_GZB64 ([A-Za-z0-9+/=]+)\\s*$',line)\n\
        \  if m:parts[m[1]].append(base64.b64decode(m[2],validate=True))\n manifest=gzip.decompress(b''.join(parts['EXPORT-MANIFEST_JSON']));assert\
        \ hashlib.sha256(manifest).hexdigest()==pin\n m=json.loads(manifest);assert not m['errors'];dest.mkdir(parents=True)\n\
        \ for name,x in m['files'].items():\n  rel=PurePosixPath(x['source']);assert not rel.is_absolute()and '..'not\
        \ in rel.parts\n  b=gzip.decompress(b''.join(parts[name]));assert len(b)==x['bytes']and hashlib.sha256(b).hexdigest()==x['sha256'],name\n\
        \  f=dest/rel;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(b)\n (dest/'export-manifest.original.json').write_bytes(manifest);print('NAV_RECOVERY_ORIGINAL_ARCHIVED_EVIDENCE_EXACT',job,len(m['files']),flush=True)\n\
        \nARCHIVE\n"
    - name: Prepare exact install-only reconstruction stage
      shell: bash
      run: 'python3 - <<''PREPARE_STAGE''

        from pathlib import Path

        Path(''/tmp/nav-source-stage.sh'').write_text(''set -euo pipefail\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\nulimit
        -v 4194304\numask 022\nmkdir -p "$LFS/nav-build-metadata/recovery"\npython3 - <<\''DOWNLOAD\''\nfrom pathlib
        import Path,PurePosixPath\nimport urllib.request,hashlib,tarfile,json\nsrc={\''filename\'': \''libheif-1.23.7.tar.gz\'',
        \''url\'': \''https://github.com/strukturag/libheif/releases/download/v1.23.7/libheif-1.23.7.tar.gz\'',
        \''sha256\'': \''f7483e818503ea6224c8863e4a56ac02c7089021a98472c811c12aa19faf2475\'', \''md5\'': \''01665401e4c9495d90b703ee85732cac\'',
        \''top\'': \''libheif-1.23.7\''}\np=Path(\''/mnt/nav-lfs/sources\'')/src[\''filename\'']\nwith urllib.request.urlopen(src[\''url\''],timeout=120)as
        r:p.write_bytes(r.read())\nassert hashlib.file_digest(p.open(\''rb\''),\''sha256\'').hexdigest()==src[\''sha256\'']\nwith
        tarfile.open(p)as t:\n for m in t.getmembers():\n  q=PurePosixPath(m.name);assert not q.is_absolute()and
        \''..\''not in q.parts and q.parts[0]==src[\''top\'']\n  assert m.isfile()or m.isdir(),m.name\n t.extractall(p.parent,filter=\''data\'')\nPath(\''/mnt/nav-lfs/nav-build-metadata/recovery/heif-source-lock.json\'').write_text(json.dumps(src,indent=2))\n\noriginal={}\nfor
        f in (p.parent/src[\''top\'']).rglob(\''*\''):\n if f.is_file()and not f.is_symlink():original[str(f.relative_to(p.parent/src[\''top\'']))]={\''bytes\'':f.stat().st_size,\''sha256\'':hashlib.file_digest(f.open(\''rb\''),\''sha256\'').hexdigest()}\nPath(\''/mnt/nav-lfs/nav-build-metadata/recovery/heif-downloaded-source-files-sha256.json\'').write_text(json.dumps(original,sort_keys=True,indent=2))\nprint(\''NAV_HEIF_SOURCE_SHA256_OK\'')\nDOWNLOAD\npython3
        - <<\''DOWNLOAD\''\nfrom pathlib import Path,PurePosixPath\nimport urllib.request,hashlib,tarfile,json\np=Path(\''/mnt/nav-lfs/sources/cargo-c-0.10.24.tar.gz\'');url=\''https://github.com/lu-zero/cargo-c/archive/v0.10.24/cargo-c-0.10.24.tar.gz\''\nwith
        urllib.request.urlopen(url,timeout=120)as r:p.write_bytes(r.read())\nassert hashlib.file_digest(p.open(\''rb\''),\''sha256\'').hexdigest()==\''91c6e0be34aa0ad26b7ef21ce21a390c95635e4e6e00b7a6ff07323f9af8550b\''\nwith
        tarfile.open(p)as t:\n for m in t.getmembers():\n  q=PurePosixPath(m.name);assert not q.is_absolute()and
        \''..\''not in q.parts and q.parts[0]==\''cargo-c-0.10.24\'';assert m.isfile()or m.isdir(),m.name\n t.extractall(p.parent,filter=\''data\'')\ns=p.parent/\''cargo-c-0.10.24\'';lock=s/\''Cargo.lock\''\nwith
        urllib.request.urlopen(\''https://github.com/lu-zero/cargo-c/releases/download/v0.10.24/Cargo.lock\'',timeout=120)as
        r:lock.write_bytes(r.read())\nassert hashlib.file_digest(lock.open(\''rb\''),\''sha256\'').hexdigest()==\''0cbf346afe2c77fec7b39f8954b9de0639ced04234764240c8290dbec8d45e82\''\noriginal={str(f.relative_to(s)):{\''bytes\'':f.stat().st_size,\''sha256\'':hashlib.file_digest(f.open(\''rb\''),\''sha256\'').hexdigest()}for
        f in s.rglob(\''*\'')if f.is_file()and not f.is_symlink()};assert original==json.loads(Path(\''/mnt/nav-lfs/nav-build-metadata/cargo-c/original-source-files-sha256.json\'').read_text());print(\''NAV_CARGOC_SOURCE_AND_RELEASE_LOCK_SHA256_OK\'',len(original))\nDOWNLOAD\npython3
        - <<\''PREPARE\''\nfrom pathlib import Path\nimport hashlib\nPath(\''/mnt/nav-lfs/sources/recovery-stage.sh\'').write_text(\''set
        -euo pipefail\\numask 022\\nulimit -v 4194304\\nexport PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin
        LANG=C.UTF-8 MAKEFLAGS=-j2 CARGO_BUILD_JOBS=2\\nunset LC_ALL LANGUAGE\\nchmod 1777 /tmp /var/tmp\\nP=/nav-build-metadata/recovery\\nH=/nav-build-metadata/libheif\\nC=/nav-build-metadata/cargo-c\\nmkdir
        -p "$P" "$H" "$C" /tmp/nav-heif-stage\\npkg-config --modversion libde265 x265 aom > "$P/prerequisite-versions.log"\\n#
        Exact original production source/options. Compile only; no canonical test execution.\\nchown -R tester:tester
        /sources/libheif-1.23.7 "$P"\\nsu tester -c \\\''cmake -S /sources/libheif-1.23.7 -B /sources/libheif-1.23.7/build-production
        -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_BUILD_TYPE=Release -D WITH_GDK_PIXBUF=OFF -D WITH_OpenH264_DECODER=OFF
        -G Ninja\\\'' > "$P/heif-configure.log" 2>&1\\nsu tester -c \\\''cmake --build /sources/libheif-1.23.7/build-production
        -j2\\\'' > "$P/heif-build.log" 2>&1\\nDESTDIR=/tmp/nav-heif-stage cmake --install /sources/libheif-1.23.7/build-production
        > "$P/heif-staged-install.log" 2>&1\\npython3 /sources/recovery-verify.py heif\\n# Copy only the verified
        staged installation into target root.\\ncp -a /tmp/nav-heif-stage/usr/. /usr/\\nldconfig\\npkg-config --modversion
        libheif > "$P/heif-installed-version.log"\\ntest "$(cat "$P/heif-installed-version.log")" = 1.23.7\\nldd
        /usr/lib/libheif.so /usr/bin/heif-enc /usr/bin/heif-dec > "$P/heif-installed-linkage.log" 2>&1\\n! grep
        -q \\\''not found\\\'' "$P/heif-installed-linkage.log"\\nfor lib in libaom.so.3 libde265.so libx265.so;do
        grep -q "$lib" "$P/heif-installed-linkage.log";done\\nmkdir /tmp/nav-heif-installed\\ncc /sources/heif-installed-smoke.c
        $(pkg-config --cflags --libs libheif) -o /tmp/nav-heif-installed/smoke > "$P/heif-smoke-build.log" 2>&1\\n/tmp/nav-heif-installed/smoke
        heic /tmp/nav-heif-installed/out.heic > "$P/heif-installed-heic-lossless.log" 2>&1\\n/tmp/nav-heif-installed/smoke
        avif /tmp/nav-heif-installed/out.avif > "$P/heif-installed-avif-lossless.log" 2>&1\\n# Exact original cargo-c
        release build/lock, no canonical test replay.\\nexport LIBSSH2_SYS_USE_PKG_CONFIG=1 LIBSQLITE3_SYS_USE_PKG_CONFIG=1
        CARGO_HOME=/tmp/nav-cargo-c-home\\nmkdir "$CARGO_HOME"\\nchown -R tester:tester /sources/cargo-c-0.10.24
        "$CARGO_HOME"\\nsu tester -c \\\''export PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin;cd /sources/cargo-c-0.10.24
        && CARGO_BUILD_JOBS=2 CARGO_HOME=/tmp/nav-cargo-c-home LIBSSH2_SYS_USE_PKG_CONFIG=1 LIBSQLITE3_SYS_USE_PKG_CONFIG=1
        cargo build --release --locked\\\'' > "$P/cargoc-build.log" 2>&1\\npython3 /sources/recovery-verify.py cargoc\\ninstall
        -vm755 /sources/cargo-c-0.10.24/target/release/cargo-{capi,cbuild,cinstall,ctest} /usr/bin/ > "$P/cargoc-install.log"
        2>&1\\nunset LIBSSH2_SYS_USE_PKG_CONFIG LIBSQLITE3_SYS_USE_PKG_CONFIG\\nfor n in capi cbuild cinstall ctest;do
        /usr/bin/cargo-$n --version;done > "$P/cargoc-installed-versions.log" 2>&1\\nfor n in capi cbuild cinstall
        ctest;do ldd /usr/bin/cargo-$n;done > "$P/cargoc-installed-linkage.log" 2>&1\\n! grep -q \\\''not found\\\''
        "$P/cargoc-installed-linkage.log"\\npython3 /sources/recovery-verify.py final\\n\'')\nPath(\''/mnt/nav-lfs/sources/recovery-verify.py\'').write_text(\''from
        pathlib import Path\\nimport json,hashlib,os,sys,subprocess,re,shutil,stat\\nP=Path(\\\''/nav-build-metadata/recovery\\\'');H=Path(\\\''/nav-build-metadata/libheif\\\'');C=Path(\\\''/nav-build-metadata/cargo-c\\\'')\\ndef
        sha(f):return hashlib.file_digest(Path(f).open(\\\''rb\\\''),\\\''sha256\\\'').hexdigest()\\ndef exact(root,original):\\n
        for rel,x in original.items():\\n  f=Path(root)/rel;assert f.is_file()and not f.is_symlink()and f.stat().st_size==x[\\\''bytes\\\'']and
        sha(f)==x[\\\''sha256\\\''],rel\\nif sys.argv[1]==\\\''heif\\\'':\\n s=Path(\\\''/sources/libheif-1.23.7\\\'');original=json.loads((H/\\\''original-diagnostics/original-source-files-sha256.json\\\'').read_text());exact(s,original)\\n
        archived=json.loads((H/\\\''original-diagnostics/tooling-files-sha256.json\\\'').read_text());prefix=\\\''sources/libheif-1.23.7/build-production/\\\''\\n
        # Compare compiled runtime outputs before install-time RPATH removal. Other compiler intermediates remain
        non-install evidence.\\n wanted={k:v for k,v in archived.items()if k.startswith(prefix)and (k.split(\\\''/\\\'')[-1].startswith(\\\''libheif.so\\\'')or
        k.split(\\\''/\\\'')[-1]in [\\\''heif-info\\\'',\\\''heif-enc\\\'',\\\''heif-dec\\\'',\\\''heif-thumbnailer\\\''])}\\n
        assert len([k for k,v in wanted.items()if \\\''sha256\\\''in v])==5,wanted\\n for rel,x in wanted.items():\\n  f=Path(\\\''/\\\'')/rel\\n  if
        \\\''symlink\\\''in x:assert f.is_symlink()and os.readlink(f)==x[\\\''symlink\\\''],rel\\n  else:assert
        f.is_file()and f.stat().st_size==x[\\\''bytes\\\'']and sha(f)==x[\\\''sha256\\\''],rel\\n stage=Path(\\\''/tmp/nav-heif-stage\\\'');records={};expected=Path(\\\''/tmp/nav-heif-rpath-expected\\\'');expected.mkdir()\\n
        # The previous original install log is the authoritative installed pathname list.\\n original_paths=re.findall(r\\\''^--
        Installing: (/usr/.*)$\\\'',(H/\\\''install.log\\\'').read_text(),re.M)\\n actual={str(f.relative_to(stage))for
        f in stage.rglob(\\\''*\\\'')if f.is_file()or f.is_symlink()}\\n expected_paths={x.lstrip(\\\''/\\\'')for
        x in original_paths if not x.endswith(\\\''/usr/lib/libheif\\\'')}\\n expected_paths.add(\\\''usr/bin/heif-convert\\\'')\\n
        assert actual==expected_paths,{\\\''only_actual\\\'':sorted(actual-expected_paths),\\\''only_expected\\\'':sorted(expected_paths-actual)}\\n
        known_hashes={x[\\\''sha256\\\'']for x in archived.values()if \\\''sha256\\\''in x}|{x[\\\''sha256\\\'']for
        x in original.values()}\\n for rel in sorted(actual):\\n  f=stage/rel\\n  if f.is_symlink():\\n   assert
