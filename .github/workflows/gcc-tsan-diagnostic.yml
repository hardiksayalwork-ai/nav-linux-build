name: NAV GCC exact TSAN diagnostic only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  gcc-test-group:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'sudo mkdir -p /mnt/nav-gcc-checkpoint

        sudo chown "$(id -u):$(id -g)" /mnt/nav-gcc-checkpoint

        '
    - name: Restore immutable build-only archive
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-gcc-checkpoint
        key: nav-lfs13.1-x86_64-gcc-build-tree-v1
        fail-on-cache-miss: true
    - name: Exact failed TSAN test diagnostics (not acceptance)
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nos.environ[\"NAV_GCC_TEST_GROUP\"]=\"cxx\"\nassert os.environ[\"NAV_GCC_TEST_GROUP\"] in (\"c\",\"cxx\",\"runtime\")\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\npython3 - <<\\'ARCHIVE_VERIFY\\'\\nimport pathlib,json,hashlib\\np=pathlib.Path(\\'/mnt/nav-gcc-checkpoint\\');m=json.loads((p/\\'manifest.json\\').read_text());h=hashlib.sha256()\\nwith (p/\\'root.tar.zst\\').open(\\'rb\\') as f:\\n for b in iter(lambda:f.read(8*1024**2),b\\'\\'):h.update(b)\\nassert m[\\'sha256\\']==h.hexdigest() and m[\\'bytes\\']==(p/\\'root.tar.zst\\').stat().st_size\\nprint(\\'NAV_GCC_TEST_ARCHIVE_SHA256_OK\\\
        ',h.hexdigest(),flush=True)\\nARCHIVE_VERIFY\\nsudo mkdir -p \"$LFS\"\\nzstd -dc /mnt/nav-gcc-checkpoint/root.tar.zst | sudo tar --numeric-owner --same-owner -C \"$LFS\" -xf -\\nsudo python3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-gcc.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests\\\\nstat -c \\\\\\'NAV_GCC_TMP_BEFORE %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\nchmod 1777 /tmp /var/tmp\\\\nstat -c \\\\\\'NAV_GCC_TMP_AFTER %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\ncat > /tmp/nav-nonroot-preflight.sh <<\\\\\\'NONROOT\\\\\\'\\\\nset -euo pipefail\\\\nd=$(mktemp -d)\\\\ntrap \\\\\\'rm -rf \"$d\"\\\\\\' EXIT\\\\nmkfifo \"$d/fifo\"\\\\nprintf \\\\\\'int main(){return 0;}\\\\\\\\n\\\\\\' > \"$d/probe.c\"\\\\ngcc \"$d/probe.c\" -o \"$d/probe\"\\\\n\"$d/probe\"\\\\nprintf \\\\\\'NAV_GCC_NONROOT_TMP_FIFO_COMPILE_RUN_OK\\\\\\\\n\\\\\\'\\\\nNONROOT\\\\nsu tester -c \\\\\\'bash /tmp/nav-nonroot-preflight.sh\\\
        \\\\'\\\\nrm /tmp/nav-nonroot-preflight.sh\\\\n\\\\nsu tester -c \\\\\\'set -eu; python3 -c \"import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\"\\\\\\'\\\\ncat > /tmp/nav-expect-preflight.exp <<\\\\\\'EXPECT\\\\\\'\\\\nset timeout 10\\\\nspawn /usr/bin/echo NAV_EXPECT_NONROOT_OK\\\\nexpect {\\\\n NAV_EXPECT_NONROOT_OK {exit 0}\\\\n timeout {exit 1}\\\\n eof {exit 2}\\\\n}\\\\nEXPECT\\\\nsu tester -c \\\\\\'set -eu; expect /tmp/nav-expect-preflight.exp\\\\\\'\\\\nrm /tmp/nav-expect-preflight.exp\\\\nprintf \\\\\\'NAV_GCC_NONROOT_PTY_PREFLIGHT_OK\\\\\\\\n\\\\\\'\\\\ncd /sources/gcc-16.2.0/build\\\\nulimit -s -H unlimited\\\\nchown -R tester .\\\\n# These are the exact native language targets used by gcc/ check. The runtime\\\\n# group invokes all top-level default check targets except the separately run\\\\n# check-gcc aggregate. No RUNTESTFLAGS filtering is applied to any full group.\\\\npython3 - <<\\\\\\'CHECK_COVERAGE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport re\\\
        \\ns=Path(\\\\\\'gcc/Makefile\\\\\\').read_text();m=re.search(r\\\\\\'^CHECK_TARGETS\\\\\\\\s*=\\\\\\\\s*(.*)$\\\\\\',s,re.M);assert m\\\\nv=set(m[1].split());assert v and v<={\\\\\\'check-c\\\\\\',\\\\\\'check-c++\\\\\\',\\\\\\'check-lto\\\\\\'},v\\\\nprint(\\\\\\'NAV_GCC_DEFAULT_LANGUAGE_TARGETS\\\\\\',sorted(v),flush=True)\\\\nCHECK_COVERAGE\\\\nset +e\\\\nsu tester -c \\\\\\'set -eu; PATH=/usr/bin:/usr/sbin make -C gcc -k check-c++ RUNTESTFLAGS=\"tsan.exp=pthread_cond_clockwait.C\"\\\\\\' > /nav-build-metadata/tests/gcc-check.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/gcc-check.log\\\\nfind gcc/testsuite -name \\\\\\'g++.log\\\\\\' -exec cat {} \\\\\\\\;\\\\nfind gcc/testsuite -name \\\\\\'g++.sum\\\\\\' -exec cat {} \\\\\\\\;\\\\nprintf \\\\\\'NAV_GCC_DIAGNOSTIC_ONLY_NOT_ACCEPTANCE rc=%s\\\\\\\\n\\\\\\' \"$rc\"\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" NAV_GCC_TEST_GROUP=\"$NAV_GCC_TEST_GROUP\" unshare --mount\
        \ --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\n# The host uses /dev/ptmx -> pts/ptmx. A fresh devpts node defaults to\\n# mode0000; prove the old non-root behavior, then use the kernel-doc option.\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\nset +e\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/python3 -c \\'import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\\'\\nold_pty_rc=$?\\nset -e\\nprintf \\'NAV_GCC_ORIGINAL_PTY_STATUS %s\\\\n\\' \"$old_pty_rc\"\\nmount -o remount,gid=5,mode=0620,ptmxmode=0666 \"$LFS/dev/pts\"\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\n\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o\
        \ nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX NAV_GCC_TEST_GROUP=\"$NAV_GCC_TEST_GROUP\" /bin/bash --noprofile --norc /sources/final-gcc.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n\
        try:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n root=pathlib.Path('/mnt/nav-lfs/sources/gcc-16.2.0/build')\n for f in root.rglob('*.sum'):\n  lines=f.read_text(errors='replace').splitlines()\n  print('NAV_GCC_SUMMARY_TAIL',str(f),'\\n'.join(lines[-12:]),flush=True)\n check=pathlib.Path('/mnt/nav-lfs/nav-build-metadata/tests/gcc-check.log')\n if check.exists():\n\
        \  with check.open('rb') as f:\n   f.seek(0,2);f.seek(max(0,f.tell()-12000));print('NAV_GCC_LIVE_LOG_TAIL',f.read().decode(errors='replace'),flush=True)\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_GCC','NAV_FINAL_GCC','NAV_TESTER'])))\nNAV_GUARD\n"
