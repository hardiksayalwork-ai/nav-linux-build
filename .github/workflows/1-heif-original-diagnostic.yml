        \\n   root=E.parse(dest).getroot();assert root.tag==\\'MatchingTests\\',root.tag\\\\n   cases=[{\\'name\\\
        ':x.findtext(\\'Name\\'),\\'tags\\':x.findtext(\\'Tags\\'),\\'source\\':x.findtext(\\'SourceInfo/File\\\
        '),\\'line\\':x.findtext(\\'SourceInfo/Line\\')}for x in root.findall(\\'TestCase\\')];assert len(cases)==len({x[\\\
        'name\\']for x in cases});names[mode]=cases\\\\n  assert {x[\\'name\\']for x in names[\\'default\\']}<={x[\\\
        'name\\']for x in names[\\'all\\']};case_data[t[\\'name\\']]=names\\\\n (out/\\'catch-discovery.json\\').write_text(json.dumps(case_data,indent=2))\\\
        \\n\\\\ndef recount(out):\\\\n out=Path(out);d=json.loads((out/\\'ctest-discovery.json\\').read_text());names=json.loads((out/\\\
        'catch-discovery.json\\').read_text());raw=(out/\\'original-ctest.log\\').read_text();groups=collections.defaultdict(list)\\\
        \\n for l in raw.splitlines():\\\\n  m=re.match(r\\'^\\\\\\\\s*(\\\\\\\\d+): ?(.*)$\\',l)\\\\n  if m:groups[int(m[1])].append(m[2])\\\
        \\n root=E.parse(out/\\'original-ctest-junit.xml\\').getroot();unitnames=[x.attrib[\\'name\\']for x in root.iter(\\\
        'testcase\\')];assert len(unitnames)==len(set(unitnames))==len(d[\\'tests\\']);assert set(unitnames)=={x[\\\
        'name\\']for x in d[\\'tests\\']}\\\\n per={};tot=collections.Counter();unknown=[]\\\\n for i,t in enumerate(d[\\\
        'tests\\'],1):\\\\n  name=t[\\'name\\'];lines=groups[i];(out/(name+\\'-original.log\\')).write_text(\\'\\\
        \\\\\\n\\'.join(lines)+\\'\\\\\\\\n\\');s=summary(lines);s[\\'discovered_default_cases\\']=len(names[name][\\\
        'default\\']);s[\\'discovered_all_including_hidden\\']=len(names[name][\\'all\\']);s[\\'upstream_hidden_names\\\
        ']=sorted({x[\\'name\\']for x in names[name][\\'all\\']}-{x[\\'name\\']for x in names[name][\\'default\\\
        ']})\\\\n  if s[\\'status\\']!=\\'RECOUNTED\\' or s.get(\\'cases\\')!=s[\\'discovered_default_cases\\']:unknown.append({\\\
        'unit\\':name,\\'reason\\':\\'summary or original-discovery count mismatch\\',\\'summary\\':s})\\\\n  else:\\\
        \\n   for k in [\\'cases\\',\\'PASS\\',\\'FAIL\\',\\'SKIP\\',\\'XFAIL\\']:tot[k]+=s[k]\\\\n  s[\\'original_log_sha256\\\
        ']=hashlib.sha256((out/(name+\\'-original.log\\')).read_bytes()).hexdigest();per[name]=s\\\\n audit={\\\
        'classification\\':\\'DIAGNOSTIC ONLY, NOT INSTALL APPROVAL, all skips/xfails/unknowns remain OPEN for source\
        \ classification\\',\\'original_ctest_exit\\':int((out/\\'original-ctest.exit\\').read_text()),\\'registered_CTest_units\\\
        ':len(d[\\'tests\\']),\\'all_original_CTest_unit_names_exact\\':True,\\'canonical_default_cases\\':sum(len(x[\\\
        'default\\'])for x in names.values()),\\'canonical_all_cases_including_upstream_hidden\\':sum(len(x[\\'all\\\
        '])for x in names.values()),\\'upstream_hidden_not_run\\':sum(len(x[\\'all\\'])-len(x[\\'default\\'])for\
        \ x in names.values()),\\'default_execution_case_count_exact\\':not unknown and tot[\\'cases\\']==sum(len(x[\\\
        'default\\'])for x in names.values()),\\'case_totals\\':dict(tot),\\'per_unit\\':per,\\'unknown\\':unknown,\\\
        'source_patches\\':[],\\'test_filters\\':[]}\\\\n (out/\\'recount-audit.json\\').write_text(json.dumps(audit,indent=2));print(json.dumps({k:v\
        \ for k,v in audit.items()if k!=\\'per_unit\\'},sort_keys=True),flush=True)\\\\n\\\\nif __name__==\\'__main__\\\
        ':\\\\n if sys.argv[1]==\\'discover\\':discover(sys.argv[2],sys.argv[3])\\\\n elif sys.argv[1]==\\'recount\\\
        ':recount(sys.argv[2])\\\\n elif sys.argv[1]==\\'selftest\\':\\\\n  a=summary([\\'All tests passed (91 assertions\
        \ in 4 test cases)\\']);assert a[\\'cases\\']==4 and a[\\'PASS\\']==4\\\\n  a=summary([\\'test cases: 4\
        \ | 2 passed | 1 failed | 1 skipped\\',\\'assertions: 8 | 7 passed | 1 failed\\']);assert a[\\'cases\\']==4\
        \ and a[\\'FAIL\\']==1 and a[\\'SKIP\\']==1\\\\n  a=summary([\\'test cases: 3 | 1 passed | 1 skipped | 1\
        \ failed as expected\\',\\'assertions: 9 | 8 passed | 1 failed as expected\\']);assert a[\\'XFAIL\\']==1\\\
        \\n  assert summary([\\'test cases: 2 | 1 passed\\'])[\\'status\\']==\\'UNKNOWN\\'\\\\n  assert summary([\\\
