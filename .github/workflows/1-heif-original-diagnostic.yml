name: NAV libheif1.23.7 original fullvisibility production diagnostic no install
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-heif-original-diagnostic
  cancel-in-progress: false
jobs:
  heif:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-x265-root.tar.zst /mnt/nav-heif-tooling.tar.zst; do\n test ! -e \"$bundle\"\n sudo install\
        \ -o \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c\
        \ '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n\
        \ printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\"\
        \ proof\n zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\"\
        \ \"$probe/recovered\"\n # Match actions/cache extraction semantics, not only bundle writer access.\n test\
        \ \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n\
        \ relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\"\
        \ -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n\
        \ set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\
        \n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program\
        \ unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_HEIF_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_HEIF_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_HEIF_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_HEIF_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_HEIF_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_HEIF_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore verified x265 checkpoint
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-x265-root.tar.zst
        key: nav-blfs13.1-x86_64-x265-open-v1
        fail-on-cache-miss: true
    - name: Verify and extract exact x265 root
      shell: bash
      run: 'set -euo pipefail

        printf "0c96200fd51df490f89d080b7c6bdcf1b5593f962691a03b2ed007dd481a5ef0  /mnt/nav-x265-root.tar.zst\n"
        | sha256sum -c -

        zstd -t /mnt/nav-x265-root.tar.zst

        tar --zstd -xf /mnt/nav-x265-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/x265/X265-TRANSITIONAL-OPEN.json

        '
    - name: Fullvisibility and production original CTest diagnostics, no install or root save
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda :\
        \ int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\n\
        assert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024\
        \ ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs\
        \ LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\nmkdir -p \"$LFS/nav-build-metadata/heif-tooling\"\\npython3\
        \ - <<\\'DOWNLOAD\\'\\nfrom pathlib import Path,PurePosixPath\\nimport urllib.request,hashlib,tarfile,json\\\
        nsrc={\\'filename\\': \\'libheif-1.23.7.tar.gz\\', \\'url\\': \\'https://github.com/strukturag/libheif/releases/download/v1.23.7/libheif-1.23.7.tar.gz\\\
        ', \\'sha256\\': \\'f7483e818503ea6224c8863e4a56ac02c7089021a98472c811c12aa19faf2475\\', \\'md5\\': \\'01665401e4c9495d90b703ee85732cac\\\
        ', \\'top\\': \\'libheif-1.23.7\\'}\\np=Path(\\'/mnt/nav-lfs/sources\\')/src[\\'filename\\']\\nwith urllib.request.urlopen(src[\\\
        'url\\'],timeout=120)as r:p.write_bytes(r.read())\\nassert hashlib.file_digest(p.open(\\'rb\\'),\\'sha256\\\
        ').hexdigest()==src[\\'sha256\\']\\nwith tarfile.open(p)as t:\\n for m in t.getmembers():\\n  q=PurePosixPath(m.name);assert\
        \ not q.is_absolute()and \\'..\\'not in q.parts and q.parts[0]==src[\\'top\\']\\n  assert m.isfile()or m.isdir(),m.name\\\
        n t.extractall(p.parent,filter=\\'data\\')\\nPath(\\'/mnt/nav-lfs/nav-build-metadata/heif-tooling/source-lock.json\\\
        ').write_text(json.dumps(src,indent=2))\\n\\noriginal={}\\nfor f in (p.parent/src[\\'top\\']).rglob(\\'*\\\
        '):\\n if f.is_file()and not f.is_symlink():original[str(f.relative_to(p.parent/src[\\'top\\']))]={\\'bytes\\\
        ':f.stat().st_size,\\'sha256\\':hashlib.file_digest(f.open(\\'rb\\'),\\'sha256\\').hexdigest()}\\nPath(\\\
        '/mnt/nav-lfs/nav-build-metadata/heif-tooling/original-source-files-sha256.json\\').write_text(json.dumps(original,sort_keys=True,indent=2))\\\
        nprint(\\'NAV_HEIF_SOURCE_SHA256_OK\\')\\nDOWNLOAD\\npython3 - <<\\'INNER\\'\\nfrom pathlib import Path\\\
        nPath(\\'/mnt/nav-lfs/sources/heif-stage.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit\
        \ -v 4194304\\\\nexport PATH=/usr/bin:/usr/sbin:/bin:/sbin LANG=C.UTF-8 MAKEFLAGS=-j2\\\\nunset LC_ALL LANGUAGE\\\
        \\nchmod 1777 /tmp /var/tmp\\\\nP=/nav-build-metadata/heif-tooling\\\\nmkdir -p \"$P/full\" \"$P/production\"\
        \\\\npkg-config --modversion libde265 x265 aom > \"$P/prerequisite-versions.log\"\\\\npython3 /sources/heif-recount.py\
        \ selftest > \"$P/recount-selftest.log\"\\\\nchown -R tester:tester /sources/libheif-1.23.7 \"$P\"\\\\n#\
        \ Separate untouched source options: full internal-symbol test coverage, then book-default production visibility.\\\
        \\nsu tester -c \\\\\\'bash /sources/heif-original-scope.sh full\\\\\\'\\\\nsu tester -c \\\\\\'bash /sources/heif-original-scope.sh\
        \ production\\\\\\'\\\\npython3 - <<\\\\\\'UNION\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json\\\\\
        np=Path(\\\\\\'/nav-build-metadata/heif-tooling\\\\\\');a=json.loads((p/\\\\\\'full/recount-audit.json\\\
        \\\\').read_text());b=json.loads((p/\\\\\\'production/recount-audit.json\\\\\\').read_text());x=set(a[\\\
        \\\\'per_unit\\\\\\']);y=set(b[\\\\\\'per_unit\\\\\\']);assert y<=x,{\\\\\\'only_production\\\\\\':sorted(y-x)}\\\
        \\nimport subprocess\\\\ninspection={}\\\\nfor name in [\\\\\\'cairo\\\\\\',\\\\\\'cairo-gobject\\\\\\',\\\
        \\\\'pango\\\\\\',\\\\\\'pangocairo\\\\\\',\\\\\\'glib-2.0\\\\\\',\\\\\\'gobject-introspection-1.0\\\\\\\
        ',\\\\\\'libxml-2.0\\\\\\',\\\\\\'libssh2\\\\\\',\\\\\\'sqlite3\\\\\\',\\\\\\'openssl\\\\\\',\\\\\\'libseccomp\\\
        \\\\',\\\\\\'lcms2\\\\\\',\\\\\\'fontconfig\\\\\\',\\\\\\'gtk4\\\\\\',\\\\\\'gdk-pixbuf-2.0\\\\\\',\\\\\\\
        'librsvg-2.0\\\\\\']:\\\\n r=subprocess.run([\\\\\\'pkg-config\\\\\\',\\\\\\'--modversion\\\\\\',name],capture_output=True,text=True);inspection[name]={\\\
        \\\\'exit\\\\\\':r.returncode,\\\\\\'version_or_error\\\\\\':(r.stdout+r.stderr).strip()}\\\\nfor name in\
        \ [\\\\\\'rustc\\\\\\',\\\\\\'cargo\\\\\\']:\\\\n r=subprocess.run([name,\\\\\\'--version\\\\\\'],capture_output=True,text=True);inspection[name]={\\\
        \\\\'exit\\\\\\':r.returncode,\\\\\\'version_or_error\\\\\\':(r.stdout+r.stderr).strip()}\\\\ninspection[\\\
        \\\\'matching_inherited_audit_paths\\\\\\']=[str(f) for f in Path(\\\\\\'/nav-build-metadata\\\\\\').rglob(\\\
        \\\\'*\\\\\\') if f.is_file()and any(k in f.name.lower()for k in [\\\\\\'cairo\\\\\\',\\\\\\'pango\\\\\\\
        '])]\\\\n(p/\\\\\\'inherited-inspection.json\\\\\\').write_text(json.dumps(inspection,indent=2))\\\\nout={\\\
        \\\\'classification\\\\\\':\\\\\\'DIAGNOSTIC ONLY, NOT INSTALL OR ROOT SAVE; inherited gaps remain OPEN\\\
        \\\\',\\\\\\'version\\\\\\':\\\\\\'1.23.7\\\\\\',\\\\\\'source_patches\\\\\\':[],\\\\\\'fullvisibility\\\
        \\\\':{\\\\\\'registered_units\\\\\\':len(x),\\\\\\'totals\\\\\\':a[\\\\\\'case_totals\\\\\\'],\\\\\\'unknown\\\
        \\\\':a[\\\\\\'unknown\\\\\\'],\\\\\\'ctest_exit\\\\\\':a[\\\\\\'original_ctest_exit\\\\\\']},\\\\\\'production\\\
        \\\\':{\\\\\\'registered_units\\\\\\':len(y),\\\\\\'totals\\\\\\':b[\\\\\\'case_totals\\\\\\'],\\\\\\'unknown\\\
        \\\\':b[\\\\\\'unknown\\\\\\'],\\\\\\'ctest_exit\\\\\\':b[\\\\\\'original_ctest_exit\\\\\\']},\\\\\\'only_fullvisibility_CTest_units\\\
        \\\\':sorted(x-y),\\\\\\'production_exact_subset\\\\\\':True,\\\\\\'test_filters\\\\\\':[],\\\\\\'no_test_repeats\\\
        \\\\':True,\\\\\\'installed\\\\\\':False,\\\\\\'root_saved\\\\\\':False,\\\\\\'jobs\\\\\\':2,\\\\\\'memory_cap_KiB\\\
        \\\\':4194304}\\\\n(p/\\\\\\'HEIF-DIAGNOSTIC-OPEN.json\\\\\\').write_text(json.dumps(out,indent=2));print(\\\
        \\\\'NAV_HEIF_BOTH_ORIGINAL_SCOPES_RECOUNTED \\\\\\'+json.dumps(out),flush=True)\\\\nUNION\\\\n\\')\\nPath(\\\
        '/mnt/nav-lfs/sources/heif-recount.py\\').write_text(\"from pathlib import Path\\\\nimport json,subprocess,os,sys,re,xml.etree.ElementTree\
        \ as E,collections,hashlib\\\\n\\\\ndef summary(lines):\\\\n text=\\'\\\\\\\\n\\'.join(lines);text=re.sub(r\\\
        '\\\\\\\\x1b\\\\\\\\[[0-9;]*m\\',\\'\\',text)\\\\n full=re.findall(r\\'All tests passed \\\\\\\\(([\\\\\\\
        \\d,]+) assertions? in ([\\\\\\\\d,]+) test cases?\\\\\\\\)\\',text)\\\\n rows=re.findall(r\\'^test cases:\\\
        \\\\\\s*(.*)$\\',text,re.M)\\\\n if len(full)+len(rows)!=1:return {\\'status\\':\\'UNKNOWN\\',\\'reason\\\
        ':\\'expected exactly one Catch test-case summary\\',\\'matches\\':len(full)+len(rows)}\\\\n if full:\\\\\
        n  a,c=map(lambda x:int(x.replace(\\',\\',\\'\\')),full[0]);return {\\'status\\':\\'RECOUNTED\\',\\'cases\\\
        ':c,\\'PASS\\':c,\\'FAIL\\':0,\\'SKIP\\':0,\\'XFAIL\\':0,\\'assertions_passed\\':a}\\\\n cells=[s.strip()for\
        \ s in rows[0].split(\\'|\\')];num=lambda x:int(x.replace(\\',\\',\\'\\'))\\\\n if not re.fullmatch(r\\\
        '[\\\\\\\\d,]+\\',cells[0]):return {\\'status\\':\\'UNKNOWN\\',\\'reason\\':\\'non-numeric total\\'}\\\\\
        n out={\\'status\\':\\'RECOUNTED\\',\\'cases\\':num(cells[0]),\\'PASS\\':0,\\'FAIL\\':0,\\'SKIP\\':0,\\\
        'XFAIL\\':0}\\\\n keys={\\'passed\\':\\'PASS\\',\\'failed\\':\\'FAIL\\',\\'skipped\\':\\'SKIP\\',\\'failed\
        \ as expected\\':\\'XFAIL\\'}\\\\n for c in cells[1:]:\\\\n  m=re.fullmatch(r\\'([\\\\\\\\d,]+) (passed|failed|skipped|failed\
        \ as expected)\\',c)\\\\n  if not m:return {\\'status\\':\\'UNKNOWN\\',\\'reason\\':\\'unknown Catch summary\
        \ column\\',\\'column\\':c}\\\\n  out[keys[m[2]]]=num(m[1])\\\\n if out[\\'cases\\']!=sum(out[k]for k in\
        \ keys.values()):return {\\'status\\':\\'UNKNOWN\\',\\'reason\\':\\'case total mismatch\\'}\\\\n ar=re.findall(r\\\
        '^assertions:\\\\\\\\s*(.*)$\\',text,re.M)\\\\n out[\\'assertions_summary\\']=ar\\\\n return out\\\\n\\\\\
        ndef discover(build,out):\\\\n build=Path(build);out=Path(out);out.mkdir(parents=True,exist_ok=True)\\\\\
        n d=json.loads(subprocess.check_output([\\'ctest\\',\\'--test-dir\\',str(build),\\'--show-only=json-v1\\\
        '],text=True));(out/\\'ctest-discovery.json\\').write_text(json.dumps(d,indent=2));case_data={}\\\\n assert\
        \ d[\\'tests\\'],\\'No CTest registrations\\'\\\\n for t in d[\\'tests\\']:\\\\n  cmd=t[\\'command\\'];assert\
        \ len(cmd)==1,cmd\\\\n  assert re.fullmatch(r\\'[A-Za-z0-9_]+\\',t[\\'name\\']),t[\\'name\\']\\\\n  assert\
        \ Path(cmd[0]).resolve().is_relative_to((build/\\'tests\\').resolve()),cmd\\\\n  props={x[\\'name\\']:x[\\\
        'value\\']for x in t[\\'properties\\']};assert not props.get(\\'DISABLED\\'),props;cwd=props.get(\\'WORKING_DIRECTORY\\\
        ',str(build/\\'tests\\'));assert Path(cwd).resolve()==(build/\\'tests\\').resolve(),cwd;env=os.environ.copy()\\\
        \\n  for x in props.get(\\'ENVIRONMENT\\',[]):\\\\n   k,v=x.split(\\'=\\',1);env[k]=v\\\\n  names={}\\\\\
        n  for mode,extra in [(\\'default\\',[]),(\\'all\\',[\\'*\\'])]:\\\\n   dest=out/(t[\\'name\\']+\\'-\\'+mode+\\\
        '-discovery.xml\\');r=subprocess.run(cmd+extra+[\\'--list-tests\\',\\'--reporter\\',\\'xml\\',\\'--out\\\
        ',str(dest)],cwd=cwd,env=env,capture_output=True,text=True,timeout=60);(out/(t[\\'name\\']+\\'-\\'+mode+\\\
