      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        sudo tar --zstd -cf /mnt/nav-heif-tooling.tar.zst -C /mnt/nav-lfs sources/libheif-1.23.7 nav-build-metadata/heif-tooling

        sudo chown "$(id -u):$(id -g)" /mnt/nav-heif-tooling.tar.zst

        zstd -t /mnt/nav-heif-tooling.tar.zst

        test "$(stat -c %s /mnt/nav-heif-tooling.tar.zst)" -le 268435456

        tar --zstd -tf /mnt/nav-heif-tooling.tar.zst > /tmp/heif-tooling-members

