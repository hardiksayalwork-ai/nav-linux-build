name: NAV LFS Python modules Meson Kmod Coreutils audited stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  system-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-python-v1
        fail-on-cache-miss: true
    - name: Build Python modules Meson Kmod and audit Coreutils root user suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"flit_core-4.0.2.tar.gz\", \"url\": \"https://pypi.org/packages/source/f/flit-core/flit_core-4.0.2.tar.gz\", \"bytes\": 53083, \"book_md5\": \"89ebb783230fc8db6c1d2a39644b7085\", \"sha256\": \"b6929defd93884b584d7c87829e0e7b5c26ed6be17b0b873979019314aa841c8\"\
        }, {\"filename\": \"packaging-26.3.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/p/packaging/packaging-26.3.tar.gz\", \"bytes\": 313412, \"book_md5\": \"c6809ec56986682ceffe573b8778a1ce\", \"sha256\": \"94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79\"}, {\"filename\": \"wheel-0.48.0.tar.gz\", \"url\": \"https://pypi.org/packages/source/w/wheel/wheel-0.48.0.tar.gz\", \"bytes\": 66471, \"book_md5\": \"f668e4885de814378b332eceea04a8a0\", \"sha256\": \"94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322\"}, {\"filename\": \"setuptools-84.0.0.tar.gz\", \"url\": \"https://pypi.org/packages/source/s/setuptools/setuptools-84.0.0.tar.gz\", \"bytes\": 1168449, \"book_md5\": \"c6919a4b0862ca30604559e163a6cce9\", \"sha256\": \"f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73\"}, {\"filename\": \"meson-1.12.0.tar.gz\", \"url\": \"https://github.com/mesonbuild/meson/releases/download/1.12.0/meson-1.12.0.tar.gz\", \"bytes\": 2518280,\
        \ \"book_md5\": \"9f943c267d63016012efcb0f31ecdd7d\", \"sha256\": \"88afe0c20e52030218924ac37d0c81c59b4b5f3ae3752c8c6d7470c7d365886c\"}, {\"filename\": \"kmod-34.2.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz\", \"bytes\": 443748, \"book_md5\": \"36f2cc483745e81ede3406fa55e1065a\", \"sha256\": \"5a5d5073070cc7e0c7a7a3c6ec2a0e1780850c8b47b3e3892226b93ffcb9cb54\"}, {\"filename\": \"coreutils-9.11.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/coreutils/coreutils-9.11.tar.xz\", \"bytes\": 6562420, \"book_md5\": \"e52e9857e4aa9ae38ef32f8ed6a27604\", \"sha256\": \"394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3\"}, {\"filename\": \"coreutils-9.11-i18n-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/coreutils-9.11-i18n-1.patch\", \"bytes\": 67821, \"book_md5\": \"900d64d9936516b68613271c9ebc0059\", \"sha256\": \"7c2aecf9ae24b87b019595e382b9f41d2c96de7f95abe95ad8cacc7e2ce1bbcc\"}]}\\')\\nfor r in lock[\\\
        'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/system-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name\
        \ /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf flit_core-4.0.2.tar.gz\\\\ncd flit_core-4.0.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE flit_core-4.0.2\\\\\\\\n\\\\\\'\\\\npip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD\\\\npip3 install --no-index --find-links dist flit_core\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE flit_core-4.0.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- flit_core-4.0.2\\\\ncd /sources\\\\ntar -xf packaging-26.3.tar.gz\\\\ncd packaging-26.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE packaging-26.3\\\\\\\\n\\\\\\'\\\\npip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD\\\\npip3 install --no-index --find-links\
        \ dist packaging\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE packaging-26.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- packaging-26.3\\\\ncd /sources\\\\ntar -xf wheel-0.48.0.tar.gz\\\\ncd wheel-0.48.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE wheel-0.48.0\\\\\\\\n\\\\\\'\\\\npip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD\\\\npip3 install --no-index --find-links dist wheel\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE wheel-0.48.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- wheel-0.48.0\\\\ncd /sources\\\\ntar -xf setuptools-84.0.0.tar.gz\\\\ncd setuptools-84.0.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE setuptools-84.0.0\\\\\\\\n\\\\\\'\\\\npip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD\\\\npip3 install --no-index --find-links dist setuptools\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE setuptools-84.0.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- setuptools-84.0.0\\\\ncd /sources\\\\ntar -xf meson-1.12.0.tar.gz\\\\ncd meson-1.12.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE\
        \ meson-1.12.0\\\\\\\\n\\\\\\'\\\\npip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD\\\\npip3 install --no-index --find-links dist meson\\\\ninstall -vDm644 data/shell-completions/bash/meson /usr/share/bash-completion/completions/meson\\\\ninstall -vDm644 data/shell-completions/zsh/_meson /usr/share/zsh/site-functions/_meson\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE meson-1.12.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- meson-1.12.0\\\\ncd /sources\\\\ntar -xf kmod-34.2.tar.xz\\\\ncd kmod-34.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE kmod-34.2\\\\\\\\n\\\\\\'\\\\nmkdir -p build\\\\ncd       build\\\\n\\\\nmeson setup --prefix=/usr ..    \\\\\\\\\\\\n            --buildtype=release \\\\\\\\\\\\n            -D manpages=false\\\\nninja -j2\\\\nninja install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE kmod-34.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- kmod-34.2\\\\ncd /sources\\\\ntar -xf coreutils-9.11.tar.xz\\\\ncd coreutils-9.11\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE\
        \ coreutils-9.11\\\\\\\\n\\\\\\'\\\\npatch -Np1 -i ../coreutils-9.11-i18n-1.patch\\\\nautoreconf -fv\\\\nautomake -af\\\\nFORCE_UNSAFE_CONFIGURE=1 ./configure \\\\\\\\\\\\n            --prefix=/usr\\\\nmake\\\\nrun_test coreutils-root make NON_ROOT_USERNAME=tester check-root\\\\ngroupadd -g 102 dummy -U tester\\\\nchown -R tester . \\\\nrun_test coreutils-user su tester -c \"PATH=$PATH make -k RUN_EXPENSIVE_TESTS=yes check\" < /dev/null\\\\ngroupdel dummy\\\\nmake install\\\\nmv -v /usr/bin/chroot /usr/sbin\\\\nmv -v /usr/share/man/man1/chroot.1 /usr/share/man/man8/chroot.8\\\\nsed -i \\\\\\'s/\"1\"/\"8\"/\\\\\\' /usr/share/man/man8/chroot.8\\\\npython3 - <<\\\\\\'COREUTILS_AUDIT\\\\\\'\\\\nimport pathlib,re\\\\nfor n,minimum in [(\\\\\\'root\\\\\\',1),(\\\\\\'user\\\\\\',400)]:\\\\n t=pathlib.Path(\\\\\\'/nav-build-metadata/tests/coreutils-\\\\\\'+n+\\\\\\'.log\\\\\\').read_text()\\\\n for key in [\\\\\\'FAIL\\\\\\',\\\\\\'XPASS\\\\\\',\\\\\\'ERROR\\\\\\']:\\\\n  values=re.findall(r\\\
        \\\\'^# \\\\\\'+key+r\\\\\\':\\\\\\\\s+(\\\\\\\\d+)\\\\\\\\s*$\\\\\\',t,re.M)\\\\n  assert values and all(int(v)==0 for v in values),(n,key,values)\\\\n passed=re.findall(r\\\\\\'^# PASS:\\\\\\\\s+(\\\\\\\\d+)\\\\\\\\s*$\\\\\\',t,re.M)\\\\n assert passed and sum(map(int,passed))>=minimum,(n,passed)\\\\n print(\\\\\\'NAV_COREUTILS_SUITE_AUDIT_OK\\\\\\',n,passed)\\\\nCOREUTILS_AUDIT\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE coreutils-9.11\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- coreutils-9.11\\\\nldconfig\\\\npython3 - <<\\\\\\'PYMODULE_SMOKE\\\\\\'\\\\nfrom importlib.metadata import version\\\\nfrom packaging.version import Version\\\\nfrom packaging.requirements import Requirement\\\\nfrom wheel.wheelfile import WheelFile\\\\nimport flit_core,mesonbuild,setuptools,pathlib,zipfile\\\\nassert Version(\\\\\\'1.10\\\\\\')>Version(\\\\\\'1.2\\\\\\')\\\\nassert Requirement(\\\\\\'example>=1.2\\\\\\').specifier.contains(\\\\\\'1.3\\\\\\')\\\\nfor n,v in [(\\\\\\'flit_core\\\\\\',\\\\\\\
        '4.0.2\\\\\\'),(\\\\\\'packaging\\\\\\',\\\\\\'26.3\\\\\\'),(\\\\\\'wheel\\\\\\',\\\\\\'0.48.0\\\\\\'),(\\\\\\'setuptools\\\\\\',\\\\\\'84.0.0\\\\\\'),(\\\\\\'meson\\\\\\',\\\\\\'1.12.0\\\\\\')]:assert version(n)==v,(n,version(n))\\\\nprint(\\\\\\'NAV_PYTHON_MODULES_IMPORT_VERSION_SMOKE_OK\\\\\\')\\\\nPYMODULE_SMOKE\\\\nmkdir -p /tmp/nav-meson-smoke\\\\ncd /tmp/nav-meson-smoke\\\\nprintf \"project(\\\\\\'nav-smoke\\\\\\',\\\\\\'c\\\\\\')\\\\\\\\nexecutable(\\\\\\'nav-smoke\\\\\\',\\\\\\'main.c\\\\\\')\\\\\\\\n\" > meson.build\\\\nprintf \\\\\\'#include <stdio.h>\\\\\\\\nint main(void){puts(\"NAV_MESON_LINK_SMOKE_OK\");return 0;}\\\\\\\\n\\\\\\' > main.c\\\\nmeson setup build --prefix=/usr\\\\nninja -j2 -C build\\\\ntest \"$(./build/nav-smoke)\" = NAV_MESON_LINK_SMOKE_OK\\\\ncd /tmp\\\\nrm -rf /tmp/nav-meson-smoke\\\\nkmod --version\\\\nmodinfo --version\\\\ncat > /tmp/nav-kmod.c <<\\\\\\'KMOD_SMOKE\\\\\\'\\\\n#include <libkmod.h>\\\\nint main(void){struct kmod_ctx *ctx=kmod_new(0,0);if(!ctx)return\
        \ 1;kmod_unref(ctx);return 0;}\\\\nKMOD_SMOKE\\\\ngcc /tmp/nav-kmod.c -o /tmp/nav-kmod $(pkg-config --cflags --libs libkmod)\\\\n/tmp/nav-kmod\\\\nrm /tmp/nav-kmod.c /tmp/nav-kmod\\\\ntest \"$(printf \\\\\\'b\\\\\\\\na\\\\\\\\n\\\\\\' | sort | head -1)\" = a\\\\nprintf \\\\\\'NAV_SYSTEM_TOOLS_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 Python packaging tools Meson Kmod Coreutils installed. Python modules smoke only (no book test instruction); Meson/Kmod suites need packages/raw headers outside LFS, compile/link smoke only. Coreutils root+unprivileged suites strict, optional skips logged. No kernel/boot/desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_SYSTEM_TOOLS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\\
        nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/system-tools.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail;\
        \ test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/system-tools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_COREUTILS','NAV_SYSTEM','NAV_PYTHON','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve audited system tools checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-system-tools-v1
