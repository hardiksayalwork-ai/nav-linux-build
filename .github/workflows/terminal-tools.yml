name: NAV LFS terminal and translation tools tested stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  terminal-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-gcc-v1
        fail-on-cache-miss: true
    - name: Build Ncurses Sed Psmisc Gettext Bison Grep and test
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"ncurses-6.6.tar.gz\", \"url\": \"https://invisible-mirror.net/archives/ncurses/ncurses-6.6.tar.gz\", \"bytes\": 3791150, \"book_md5\": \"dd45bf6854430af403452a7a6a40652c\", \"sha256\": \"355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11\"\
        }, {\"filename\": \"sed-4.10.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/sed/sed-4.10.tar.xz\", \"bytes\": 1732800, \"book_md5\": \"c70dc5372db95c816442ffedf77a0d0f\", \"sha256\": \"b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7\"}, {\"filename\": \"psmisc-23.7.tar.xz\", \"url\": \"https://sourceforge.net/projects/psmisc/files/psmisc/psmisc-23.7.tar.xz\", \"bytes\": 432208, \"book_md5\": \"53eae841735189a896d614cba440eb10\", \"sha256\": \"58c55d9c1402474065adae669511c191de374b0871eec781239ab400b907c327\"}, {\"filename\": \"gettext-1.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gettext/gettext-1.0.tar.xz\", \"bytes\": 10721600, \"book_md5\": \"dc8b2911535929cec1e263706b0a13a1\", \"sha256\": \"71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7\"}, {\"filename\": \"bison-3.8.2.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/bison/bison-3.8.2.tar.xz\", \"bytes\": 2817324, \"book_md5\": \"c28f119f405a2304ff0a7ccdcc629713\", \"sha256\": \"9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2\"\
        }, {\"filename\": \"grep-3.12.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/grep/grep-3.12.tar.xz\", \"bytes\": 1918448, \"book_md5\": \"5d9301ed9d209c4a88c8d3a6fd08b9ac\", \"sha256\": \"2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/terminal-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){ local name=\"$1\";shift; \"$@\" 2>&1 | tee \"/nav-build-metadata/tests/$name.log\"; printf \\\\\\'NAV_PACKAGE_TEST_PASS\
        \ %s\\\\\\\\n\\\\\\' \"$name\"; }\\\\nprintf \\\\\\'int main(){return 0;}\\\\\\\\n\\\\\\' > /tmp/native.c\\\\ncc /tmp/native.c -o /tmp/native\\\\n/tmp/native\\\\nrm /tmp/native.c /tmp/native\\\\nprintf \\\\\\'NAV_INSTALLED_COMPILER_RESTORE_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\ntar -xf ncurses-6.6.tar.gz\\\\ncd ncurses-6.6\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE ncurses-6.6\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr           \\\\\\\\\\\\n            --mandir=/usr/share/man \\\\\\\\\\\\n            --with-shared           \\\\\\\\\\\\n            --without-debug         \\\\\\\\\\\\n            --without-normal        \\\\\\\\\\\\n            --with-cxx-shared       \\\\\\\\\\\\n            --enable-pc-files       \\\\\\\\\\\\n            --with-pkg-config-libdir=/usr/lib/pkgconfig\\\\nmake\\\\nmake DESTDIR=$PWD/dest install\\\\nsed -e \\\\\\'s/^#if.*XOPEN.*$/#if 1/\\\\\\' \\\\\\\\\\\\n    -i dest/usr/include/curses.h\\\\ncp --remove-destination -av dest/* /\\\\nfor lib in\
        \ ncurses form panel menu ; do\\\\n    ln -sfv lib${lib}w.so /usr/lib/lib${lib}.so\\\\n    ln -sfv ${lib}w.pc    /usr/lib/pkgconfig/${lib}.pc\\\\ndone\\\\nln -sfv libncursesw.so /usr/lib/libcurses.so\\\\ncp -v -R doc -T /usr/share/doc/ncurses-6.6\\\\ncat > /tmp/nav-curses.c <<\\\\\\'CURSES\\\\\\'\\\\n#include <curses.h>\\\\n#include <term.h>\\\\n#include <stdlib.h>\\\\nint main(void){int e=0; if(setupterm(\"xterm\",1,&e)!=OK || e!=1)return 1; return tigetnum(\"colors\")<8;}\\\\nCURSES\\\\ncc /tmp/nav-curses.c -lncursesw -o /tmp/nav-curses\\\\n/tmp/nav-curses\\\\ninfocmp xterm > /nav-build-metadata/tests/ncurses-terminfo.log\\\\nrm /tmp/nav-curses.c /tmp/nav-curses\\\\nprintf \\\\\\'NAV_NCURSES_COMPILE_TERMINFO_SMOKE_OK_INTERACTIVE_SUITE_NOT_RUN\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE ncurses-6.6\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- ncurses-6.6\\\\ncd /sources\\\\ntar -xf sed-4.10.tar.xz\\\\ncd sed-4.10\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE sed-4.10\\\\\\\\n\\\
        \\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nmake html\\\\nchown -R tester .\\\\nrun_test sed su tester -c \\\\\\'set -eu; PATH=/usr/bin:/usr/sbin make check\\\\\\'\\\\nmake install\\\\ninstall -vDm644 doc/sed.html -t /usr/share/doc/sed-4.10\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE sed-4.10\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- sed-4.10\\\\ncd /sources\\\\ntar -xf psmisc-23.7.tar.xz\\\\ncd psmisc-23.7\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE psmisc-23.7\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nrun_test psmisc make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE psmisc-23.7\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- psmisc-23.7\\\\ncd /sources\\\\ntar -xf gettext-1.0.tar.xz\\\\ncd gettext-1.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE gettext-1.0\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/gettext-1.0\\\\nmake\\\\nrun_test gettext make check\\\\nmake install\\\
        \\nchmod -v 0755 /usr/lib/preloadable_libintl.so\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gettext-1.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- gettext-1.0\\\\ncd /sources\\\\ntar -xf bison-3.8.2.tar.xz\\\\ncd bison-3.8.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE bison-3.8.2\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2\\\\nmake\\\\nset +e\\\\nmake check > /nav-build-metadata/tests/bison.log 2>&1\\\\ncheck_rc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/bison.log\\\\nif [ \"$check_rc\" -ne 0 ]; then\\\\n printf \\\\\\'NAV_BISON_DIAGNOSTIC_BEGIN\\\\\\\\n\\\\\\'\\\\n for log in tests/testsuite.log tests/testsuite.dir/0270/testsuite.log tests/testsuite.dir/0270/stderr tests/testsuite.dir/0270/expout; do\\\\n  if [ -f \"$log\" ]; then\\\\n   printf \\\\\\'NAV_BISON_DIAGNOSTIC_FILE %s\\\\\\\\n\\\\\\' \"$log\"\\\\n   sed \\\\\\'s/^/NAV_BISON_DIAGNOSTIC /\\\\\\' \"$log\"\\\\n  fi\\\\n done\\\\n printf \\\\\\'NAV_BISON_DIAGNOSTIC_END\\\\\\\\n\\\\\\'\\\\\
        n exit \"$check_rc\"\\\\nfi\\\\nprintf \\\\\\'NAV_PACKAGE_TEST_PASS bison\\\\\\\\n\\\\\\'\\\\n\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE bison-3.8.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- bison-3.8.2\\\\ncd /sources\\\\ntar -xf grep-3.12.tar.xz\\\\ncd grep-3.12\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE grep-3.12\\\\\\\\n\\\\\\'\\\\nsed -i \"s/echo/#echo/\" src/egrep.sh\\\\n./configure --prefix=/usr\\\\nmake\\\\nrun_test grep make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE grep-3.12\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- grep-3.12\\\\nldconfig\\\\ntest \"$(printf \\\\\\'hello nav\\\\\\\\n\\\\\\' | sed \\\\\\'s/hello/source-built/\\\\\\')\" = \\\\\\'source-built nav\\\\\\'\\\\nprintf \\\\\\'nav 42\\\\\\\\n\\\\\\' | grep -Eq \\\\\\'^nav [0-9]+$\\\\\\'\\\\ngettext --version\\\\nbison --version\\\\npstree -V\\\\nprintf \\\\\\'NAV_TERMINAL_TOOLS_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 final GCC plus Ncurses Sed Psmisc Gettext Bison Grep.\
        \ Standard package suites passed; Ncurses compile+terminfo smoke only, interactive suite not run. No boot or desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_TERMINAL_TOOLS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile\
        \ --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/terminal-tools.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/terminal-tools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\\
        n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\\
        n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_NCURSES','NAV_TERMINAL','NAV_INSTALLED','NAV_BISON_DIAGNOSTIC','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested terminal translation tools checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-terminal-tools-v1
