name: NAV LFS Vim tested and GRUB image smoke stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  boot-editor:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-unix-tools-v1
        fail-on-cache-miss: true
    - name: Build Vim full suite and GRUB BIOS x64EFI image smoke
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"vim-9.2.1025.tar.gz\", \"url\": \"https://github.com/vim/vim/archive/v9.2.1025/vim-9.2.1025.tar.gz\", \"bytes\": 20133511, \"book_md5\": \"060c9c0d7e2bdb5e5d80daad596cae02\", \"sha256\": \"cb0dbf701f8550bb54940304fa4d8b875e078db84967e5b36a0eb7ebe8a6d0cc\"\
        }, {\"filename\": \"grub-2.14.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/grub/grub-2.14.tar.xz\", \"bytes\": 7725668, \"book_md5\": \"383f9effad01c235d2535357ff717543\", \"sha256\": \"bc8d3c73535b8838d8c8e2654d73edc4e6ae8c8acdb45d5df5dc9a1547446d43\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/boot-editor.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local\
        \ rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf vim-9.2.1025.tar.gz\\\\ncd vim-9.2.1025\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE vim-9.2.1025\\\\\\\\n\\\\\\'\\\\necho \\\\\\'#define SYS_VIMRC_FILE \"/etc/vimrc\"\\\\\\' >> src/feature.h\\\\n./configure --prefix=/usr\\\\nmake\\\\nchown -R tester .\\\\nsed \\\\\\'/test_plugin_glvs/d\\\\\\' -i src/testdir/Make_all.mak\\\\ncat > /tmp/nav-vim-pty.py\
        \ <<\\\\\\'VIM_PTY\\\\\\'\\\\nimport os,pty,fcntl,termios,struct,errno,sys\\\\npid,fd=pty.fork()\\\\nif pid==0:\\\\n os.execvp(\\\\\\'su\\\\\\',[\\\\\\'su\\\\\\',\\\\\\'tester\\\\\\',\\\\\\'-c\\\\\\',\\\\\\'TERM=xterm-256color LANG=en_US.UTF-8 make -j1 test\\\\\\'])\\\\nfcntl.ioctl(fd,termios.TIOCSWINSZ,struct.pack(\\\\\\'HHHH\\\\\\',24,80,0,0))\\\\ntry:\\\\n while True:\\\\n  try:b=os.read(fd,65536)\\\\n  except OSError as e:\\\\n   if e.errno==errno.EIO:break\\\\n   raise\\\\n  if not b:break\\\\n  sys.stdout.buffer.write(b);sys.stdout.buffer.flush()\\\\nfinally:os.close(fd)\\\\n_,status=os.waitpid(pid,0)\\\\nsys.exit(os.waitstatus_to_exitcode(status))\\\\nVIM_PTY\\\\nrun_test vim python3 /tmp/nav-vim-pty.py\\\\nrm /tmp/nav-vim-pty.py\\\\ngrep -Eq \\\\\\'FAILED:[[:space:]]+0\\\\\\' /nav-build-metadata/tests/vim.log\\\\nmake install\\\\nln -sv vim /usr/bin/vi\\\\nfor L in  /usr/share/man/{,*/}man1/vim.1; do\\\\n    ln -sv vim.1 $(dirname $L)/vi.1\\\\ndone\\\\nln -sv ../vim/vim92/doc\
        \ /usr/share/doc/vim-9.2.1025\\\\ncat > /etc/vimrc << \"EOF\"\\\\n\" Begin /etc/vimrc\\\\n\\\\n\" Ensure defaults are set before customizing settings, not after\\\\nsource $VIMRUNTIME/defaults.vim\\\\nlet skip_defaults_vim=1\\\\n\\\\nset nocompatible\\\\nset backspace=2\\\\nset mouse=\\\\nsyntax on\\\\nif (&term == \"xterm\") || (&term == \"putty\")\\\\n  set background=dark\\\\nendif\\\\n\\\\n\" End /etc/vimrc\\\\nEOF\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE vim-9.2.1025\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- vim-9.2.1025\\\\ncd /sources\\\\ntar -xf grub-2.14.tar.xz\\\\ncd grub-2.14\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE grub-2.14\\\\\\\\n\\\\\\'\\\\nunset {C,CPP,CXX,LD}FLAGS\\\\nsed \\\\\\'s/--image-base/--nonexist-linker-option/\\\\\\' -i configure\\\\n./configure --prefix=/usr     \\\\\\\\\\\\n            --sysconfdir=/etc \\\\\\\\\\\\n            --disable-efiemu  \\\\\\\\\\\\n            --disable-werror\\\\nmake\\\\nmake install\\\\nmake clean\\\\n./configure --prefix=/usr\
        \       \\\\\\\\\\\\n            --sysconfdir=/etc   \\\\\\\\\\\\n            --target=x86_64     \\\\\\\\\\\\n            --with-platform=efi \\\\\\\\\\\\n            --disable-efiemu    \\\\\\\\\\\\n            --disable-werror\\\\nmake\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE grub-2.14\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- grub-2.14\\\\nvim --version\\\\nprintf \\\\\\'nav editor smoke\\\\\\\\n\\\\\\' > /tmp/nav-vim.txt\\\\nvim -Nu NONE -n -es /tmp/nav-vim.txt -c \\\\\\'%s/nav/NAV/\\\\\\' -c wq\\\\ntest \"$(cat /tmp/nav-vim.txt)\" = \\\\\\'NAV editor smoke\\\\\\'\\\\nrm /tmp/nav-vim.txt\\\\ngrub-mkimage -O i386-pc -p /boot/grub -o /tmp/nav-bios.img biosdisk part_gpt part_msdos ext2 normal linux\\\\ngrub-mkimage -O x86_64-efi -p /boot/grub -o /tmp/nav-efi.img part_gpt part_msdos fat ext2 normal linux\\\\ntest -s /tmp/nav-bios.img && test -s /tmp/nav-efi.img\\\\nfile /tmp/nav-bios.img /tmp/nav-efi.img\\\\nrm /tmp/nav-bios.img /tmp/nav-efi.img\\\\nprintf \\\\\\\
        'NAV_BOOT_EDITOR_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 Vim full suite and edit smoke; GRUB BIOS+x64EFI image-generation smoke only, upstream suite not recommended in base LFS. No kernel/boot/desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_BOOT_EDITOR_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101\
        \ \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/boot-editor.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/boot-editor.sh\"\\nsudo chown -hR \"\
        $(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n\
        \ print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_BOOT','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested Vim and GRUB checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-boot-editor-v1
