name: NAV LFS final libc tested stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  final-libc:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore verified native temporary system
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-chapter7-v1
        fail-on-cache-miss: true
    - name: Build final libc and audit critical suite
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"man-pages-6.18.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/docs/man-pages/man-pages-6.18.tar.xz\", \"bytes\": 1902724, \"book_md5\": \"44915a91e4a28161dc421636a193fb3a\", \"sha256\": \"c934fadc8b59748c68227a34f6581d2ddf8282b73cdcd52546c8cd88b74b24d1\"\
        }, {\"filename\": \"iana-etc-20260805.tar.gz\", \"url\": \"https://github.com/Mic92/iana-etc/releases/download/20260805/iana-etc-20260805.tar.gz\", \"bytes\": 610207, \"book_md5\": \"f6d2619cfac3a68f91392e28fe4067c3\", \"sha256\": \"29270860664e324107537f32ea476a333ca52d71b59c74bc06ecc3b0fa9cf490\"}, {\"filename\": \"glibc-2.44.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/glibc/glibc-2.44.tar.xz\", \"bytes\": 20620544, \"book_md5\": \"7677da43ef759c68e005f5d4c37986a6\", \"sha256\": \"37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667\"}, {\"filename\": \"glibc-fhs-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/glibc-fhs-1.patch\", \"bytes\": 2804, \"book_md5\": \"9a5997c3452909b1769918c759eff8a2\", \"sha256\": \"643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d\"}, {\"filename\": \"glibc-2.44-upstream_fixes-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/glibc-2.44-upstream_fixes-1.patch\", \"bytes\"\
        : 175367, \"book_md5\": \"990574184b25aa3029a2444e81865098\", \"sha256\": \"500567ff0a22e295bfe3b55e9b397796f71a19f01e1ff7fb29c9189482ee1809\"}, {\"filename\": \"tzdata2026c.tar.gz\", \"url\": \"https://www.iana.org/time-zones/repository/releases/tzdata2026c.tar.gz\", \"bytes\": 475694, \"book_md5\": \"bff7174205cefab793e3b24271ef2f45\", \"sha256\": \"e4a178a4477f3d0ea77cc31828ff72aa38feff8d61aa13e7e99e142e9d902be4\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-libc.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests\\\
        \\ncd /sources\\\\ntar -xf man-pages-6.18.tar.xz\\\\ncd man-pages-6.18\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE man-pages-6.18\\\\\\\\n\\\\\\'\\\\nrm -v man3/crypt*\\\\nmake -R GIT=false prefix=/usr install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE man-pages-6.18\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- man-pages-6.18\\\\ncd /sources\\\\ntar -xf iana-etc-20260805.tar.gz\\\\ncd iana-etc-20260805\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE iana-etc-20260805\\\\\\\\n\\\\\\'\\\\ncp -v services protocols /etc\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE iana-etc-20260805\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- iana-etc-20260805\\\\ncd /sources\\\\ntar -xf glibc-2.44.tar.xz\\\\ncd glibc-2.44\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE glibc-2.44\\\\\\\\n\\\\\\'\\\\npatch -Np1 -i ../glibc-fhs-1.patch\\\\npatch -Np1 -i ../glibc-2.44-upstream_fixes-1.patch\\\\nmkdir -v build\\\\ncd       build\\\\n../configure --prefix=/usr                   \\\\\\\\\\\\n             --disable-werror                \\\\\\\
        \\\\\\n             --disable-nscd                  \\\\\\\\\\\\n             libc_cv_slibdir=/usr/lib        \\\\\\\\\\\\n             --enable-stack-protector=strong \\\\\\\\\\\\n             --enable-kernel=5.10\\\\nmake\\\\n\\\\n# LFS marks the glibc suite critical. Run the whole suite; only its explicitly\\\\n# documented chroot lchmod failure is accepted without further investigation.\\\\nset +e\\\\nTIMEOUTFACTOR=5 make -k check > /nav-build-metadata/tests/glibc-check.log 2>&1\\\\ncheck_rc=$?\\\\nset -e\\\\ncp tests.sum /nav-build-metadata/tests/glibc-tests.sum\\\\ncat tests.sum\\\\npython3 - \"$check_rc\" <<\\\\\\'AUDIT_GLIBC_TESTS\\\\\\'\\\\nimport sys,pathlib,collections\\\\nrows=pathlib.Path(\\\\\\'tests.sum\\\\\\').read_text().splitlines();counts=collections.Counter(x.split(\\\\\\':\\\\\\',1)[0] for x in rows if \\\\\\':\\\\\\' in x)\\\\nassert counts[\\\\\\'PASS\\\\\\']>4000,(\\\\\\'incomplete suite\\\\\\',counts)\\\\nfail=[x for x in rows if x.startswith((\\\\\\'FAIL:\\\
        \\\\',\\\\\\'XPASS:\\\\\\',\\\\\\'UNRESOLVED:\\\\\\'))]\\\\nknown=[\\\\\\'FAIL: io/tst-lchmod\\\\\\']\\\\nunknown=[x for x in fail if x not in known]\\\\nprint(\\\\\\'NAV_GLIBC_TEST_COUNTS\\\\\\',dict(counts),flush=True)\\\\nprint(\\\\\\'NAV_GLIBC_TEST_KNOWN_CHROOT_FAILURES\\\\\\',fail,flush=True)\\\\nassert not unknown,(\\\\\\'unexpected glibc test failures\\\\\\',unknown)\\\\nassert int(sys.argv[1])==0 or fail,(\\\\\\'nonzero suite without diagnosed failures\\\\\\',sys.argv[1])\\\\nprint(\\\\\\'NAV_GLIBC_CRITICAL_SUITE_ACCEPTED\\\\\\',flush=True)\\\\nAUDIT_GLIBC_TESTS\\\\ntouch /etc/ld.so.conf\\\\nsed \\\\\\'/test-installation/s@$(PERL)@echo not running@\\\\\\' -i ../Makefile\\\\nmake install\\\\nsed \\\\\\'/RTLDLIST=/s@/usr@@g\\\\\\' -i /usr/bin/ldd\\\\nlocaledef -i C -f UTF-8 C.UTF-8\\\\nlocaledef -i cs_CZ -f UTF-8 cs_CZ.UTF-8\\\\nlocaledef -i de_DE -f ISO-8859-1 de_DE\\\\nlocaledef -i de_DE@euro -f ISO-8859-15 de_DE@euro\\\\nlocaledef -i de_DE -f UTF-8 de_DE.UTF-8\\\\nlocaledef\
        \ -i el_GR -f ISO-8859-7 el_GR\\\\nlocaledef -i en_GB -f ISO-8859-1 en_GB\\\\nlocaledef -i en_GB -f UTF-8 en_GB.UTF-8\\\\nlocaledef -i en_HK -f ISO-8859-1 en_HK\\\\nlocaledef -i en_PH -f ISO-8859-1 en_PH\\\\nlocaledef -i en_US -f ISO-8859-1 en_US\\\\nlocaledef -i en_US -f UTF-8 en_US.UTF-8\\\\nlocaledef -i es_ES -f ISO-8859-15 es_ES@euro\\\\nlocaledef -i es_MX -f ISO-8859-1 es_MX\\\\nlocaledef -i fa_IR -f UTF-8 fa_IR\\\\nlocaledef -i fr_FR -f ISO-8859-1 fr_FR\\\\nlocaledef -i fr_FR@euro -f ISO-8859-15 fr_FR@euro\\\\nlocaledef -i fr_FR -f UTF-8 fr_FR.UTF-8\\\\nlocaledef -i is_IS -f ISO-8859-1 is_IS\\\\nlocaledef -i is_IS -f UTF-8 is_IS.UTF-8\\\\nlocaledef -i it_IT -f ISO-8859-1 it_IT\\\\nlocaledef -i it_IT -f ISO-8859-15 it_IT@euro\\\\nlocaledef -i it_IT -f UTF-8 it_IT.UTF-8\\\\nlocaledef -i ja_JP -f EUC-JP ja_JP\\\\nlocaledef -i ja_JP -f UTF-8 ja_JP.UTF-8\\\\nlocaledef -i nl_NL@euro -f ISO-8859-15 nl_NL@euro\\\\nlocaledef -i ru_RU -f KOI8-R ru_RU.KOI8-R\\\\nlocaledef -i ru_RU -f\
        \ UTF-8 ru_RU.UTF-8\\\\nlocaledef -i se_NO -f UTF-8 se_NO.UTF-8\\\\nlocaledef -i ta_IN -f UTF-8 ta_IN.UTF-8\\\\nlocaledef -i tr_TR -f UTF-8 tr_TR.UTF-8\\\\nlocaledef -i zh_CN -f GB18030 zh_CN.GB18030\\\\nlocaledef -i zh_HK -f BIG5-HKSCS zh_HK.BIG5-HKSCS\\\\nlocaledef -i zh_TW -f UTF-8 zh_TW.UTF-8\\\\ncat > /etc/nsswitch.conf << \"EOF\"\\\\n# Begin /etc/nsswitch.conf\\\\n\\\\npasswd: files systemd\\\\ngroup: files systemd\\\\nshadow: files systemd\\\\n\\\\nhosts: mymachines resolve [!UNAVAIL=return] files myhostname dns\\\\nnetworks: files\\\\n\\\\nprotocols: files\\\\nservices: files\\\\nethers: files\\\\nrpc: files\\\\n\\\\n# End /etc/nsswitch.conf\\\\nEOF\\\\ntar -xf ../../tzdata2026c.tar.gz\\\\n\\\\nZONEINFO=/usr/share/zoneinfo\\\\nmkdir -pv $ZONEINFO/{posix,right}\\\\n\\\\nfor tz in etcetera southamerica northamerica europe africa antarctica  \\\\\\\\\\\\n          asia australasia backward; do\\\\n    zic -L /dev/null   -d $ZONEINFO       ${tz}\\\\n    zic -L /dev/null   -d\
        \ $ZONEINFO/posix ${tz}\\\\n    zic -L leapseconds -d $ZONEINFO/right ${tz}\\\\ndone\\\\n\\\\ncp -v zone.tab zone1970.tab iso3166.tab $ZONEINFO\\\\nzic -d $ZONEINFO -p America/New_York\\\\nunset ZONEINFO tz\\\\ncat > /etc/ld.so.conf << \"EOF\"\\\\n# Begin /etc/ld.so.conf\\\\n/usr/local/lib\\\\n/opt/lib\\\\n\\\\nEOF\\\\ncat >> /etc/ld.so.conf << \"EOF\"\\\\n# Add an include directory\\\\ninclude /etc/ld.so.conf.d/*.conf\\\\n\\\\nEOF\\\\nmkdir -pv /etc/ld.so.conf.d\\\\n\\\\n# Portable build default; installer can choose the local timezone later.\\\\nln -sf /usr/share/zoneinfo/UTC /etc/localtime\\\\nldconfig\\\\ngetconf GNU_LIBC_VERSION\\\\nprintf \\\\\\'#include <stdio.h>\\\\\\\\nint main(void){puts(\"NAV_FINAL_LIBC_SMOKE_OK\");return 0;}\\\\\\\\n\\\\\\' > /tmp/nav-final-libc.c\\\\ngcc /tmp/nav-final-libc.c -o /tmp/nav-final-libc\\\\n/tmp/nav-final-libc\\\\nrm -f /tmp/nav-final-libc /tmp/nav-final-libc.c\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE glibc-2.44\\\\\\\\n\\\\\\'\\\\ncd /sources\\\
        \\nrm -rf -- glibc-2.44\\\\nprintf \\\\\\'LFS13.1 final glibc built and critical suite audited; not full final base, kernel boot or desktop.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_FINAL_LIBC_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc\
        \ /sources/final-libc.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/final-libc.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n\
        \   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_GLIBC','NAV_FINAL','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve audited final libc checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-libc-v1
