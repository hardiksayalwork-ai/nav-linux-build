name: NAV LFS init system strict test stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  init-system:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-boot-editor-v1
        fail-on-cache-miss: true
    - name: Build MarkupSafe Jinja2 and systemd full configured suite
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"markupsafe-3.0.3.tar.gz\", \"url\": \"https://pypi.org/packages/source/M/MarkupSafe/markupsafe-3.0.3.tar.gz\", \"bytes\": 80313, \"book_md5\": \"13a73126d25afa72a1ff0daed072f5fe\", \"sha256\": \"722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698\"\
        }, {\"filename\": \"jinja2-3.1.6.tar.gz\", \"url\": \"https://pypi.org/packages/source/J/Jinja2/jinja2-3.1.6.tar.gz\", \"bytes\": 245115, \"book_md5\": \"66d4c25ff43d1deaf9637ccda523dec8\", \"sha256\": \"0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d\"}, {\"filename\": \"systemd-261.2.tar.gz\", \"url\": \"https://github.com/systemd/systemd/archive/v261.2/systemd-261.2.tar.gz\", \"bytes\": 18456346, \"book_md5\": \"e3f04ccc83a28ec5e80c5432bb8329f5\", \"sha256\": \"ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec\"}, {\"filename\": \"systemd-man-pages-261.2.tar.xz\", \"url\": \"https://anduin.linuxfromscratch.org/LFS/systemd-man-pages-261.2.tar.xz\", \"bytes\": 821528, \"book_md5\": \"4c5533c1a2d0921dd4c5b5e6b8902570\", \"sha256\": \"9be13865c9c7f9fecba7b86fc5185aecef00164c87ed68b4f6884283aefebe50\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert\
        \ len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/init-system.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -2000 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE\
        \ %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nprintf \\\\\\'NAV_VIM_PRIOR_SUITE_SUMMARY\\\\\\\\n\\\\\\'\\\\ngrep -aE \\\\\\'Executed|FAILED:|SKIPPED:|Test results:|Test Succeeded\\\\\\' /nav-build-metadata/tests/vim.log | tail -25 | sed \\\\\\'s/^/NAV_VIM_COUNT /\\\\\\'\\\\ncd /sources\\\\ntar -xf markupsafe-3.0.3.tar.gz\\\\ncd markupsafe-3.0.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE markupsafe-3.0.3\\\\\\\\n\\\\\\'\\\\npip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD\\\\npip3 install --no-index --find-links dist Markupsafe\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE markupsafe-3.0.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- markupsafe-3.0.3\\\\ncd /sources\\\\ntar -xf jinja2-3.1.6.tar.gz\\\\ncd jinja2-3.1.6\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE jinja2-3.1.6\\\\\\\\n\\\\\\'\\\\npip3\
        \ wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD\\\\npip3 install --no-index --find-links dist Jinja2\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE jinja2-3.1.6\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- jinja2-3.1.6\\\\ncd /sources\\\\ntar -xf systemd-261.2.tar.gz\\\\ncd systemd-261.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE systemd-261.2\\\\\\\\n\\\\\\'\\\\nsed -e \\\\\\'s/GROUP=\"render\"/GROUP=\"video\"/\\\\\\' \\\\\\\\\\\\n    -e \\\\\\'s/GROUP=\"sgx\", //\\\\\\'               \\\\\\\\\\\\n    -i rules.d/50-udev-default.rules.in\\\\nmkdir -p build\\\\ncd       build\\\\n\\\\nmeson setup ..                \\\\\\\\\\\\n      --prefix=/usr           \\\\\\\\\\\\n      --buildtype=release     \\\\\\\\\\\\n      -D default-dnssec=no    \\\\\\\\\\\\n      -D firstboot=false      \\\\\\\\\\\\n      -D install-tests=false  \\\\\\\\\\\\n      -D ldconfig=false       \\\\\\\\\\\\n      -D sysusers=false       \\\\\\\\\\\\n      -D rpmmacrosdir=no      \\\\\\\\\\\\n      -D homed=disabled\
        \       \\\\\\\\\\\\n      -D man=disabled         \\\\\\\\\\\\n      -D mode=release         \\\\\\\\\\\\n      -D pamconfdir=no        \\\\\\\\\\\\n      -D dev-kvm-mode=0660    \\\\\\\\\\\\n      -D nobody-group=nogroup \\\\\\\\\\\\n      -D sysupdate=disabled   \\\\\\\\\\\\n      -D ukify=disabled       \\\\\\\\\\\\n      -D docdir=/usr/share/doc/systemd-261.2\\\\nninja\\\\nprintf \\\\\\'NAME=\"NAV Linux\"\\\\\\\\nID=nav\\\\\\\\nPRETTY_NAME=\"NAV Linux source build\"\\\\\\\\n\\\\\\' > /etc/os-release\\\\nrun_test systemd env LC_ALL=en_US.UTF-8 unshare -m --propagation unchanged meson test --num-processes 2 --print-errorlogs\\\\ncp meson-logs/testlog.json /nav-build-metadata/tests/systemd.json\\\\nninja install\\\\ntar -xf ../../systemd-man-pages-261.2.tar.xz \\\\\\\\\\\\n    --no-same-owner --strip-components=1     \\\\\\\\\\\\n    -C /usr/share/man\\\\nsystemd-machine-id-setup\\\\nsystemctl preset-all\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE systemd-261.2\\\\\\\\n\\\\\\'\\\\ncd\
        \ /sources\\\\nrm -rf -- systemd-261.2\\\\npython3 - <<\\\\\\'PY_SMOKE\\\\\\'\\\\nimport jinja2,markupsafe\\\\nassert jinja2.Template(\\\\\\'NAV {{ name }}\\\\\\').render(name=\\\\\\'Linux\\\\\\')==\\\\\\'NAV Linux\\\\\\'\\\\nassert str(markupsafe.escape(\\\\\\'<NAV>\\\\\\'))==\\\\\\'&lt;NAV&gt;\\\\\\'\\\\nPY_SMOKE\\\\n/usr/lib/systemd/systemd --version\\\\nudevadm --version\\\\ntest -x /usr/lib/systemd/systemd\\\\ntest -s /etc/machine-id\\\\nprintf \\\\\\'NAV_INIT_SYSTEM_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 MarkupSafe Jinja2 install/template smoke; systemd full configured suite and installed binary smoke. No kernel/boot/desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_INIT_SYSTEM_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\\
        nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/init-system.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile\
        \ --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/init-system.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INIT','NAV_TEST','NAV_VIM','NAV_PACKAGE','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested init system checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-init-system-v1
