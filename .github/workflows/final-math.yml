name: NAV LFS final linker and math tested stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  final-math:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-test-tools-v1
        fail-on-cache-miss: true
    - name: Build final linker and portable math libraries with critical suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"binutils-2.47.tar.xz\", \"url\": \"https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz\", \"bytes\": 29034716, \"book_md5\": \"d772acfbd55a81644e9fe7b8189cd2a5\", \"sha256\": \"154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff\"\
        }, {\"filename\": \"gmp-6.3.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz\", \"bytes\": 2094196, \"book_md5\": \"956dc04e864001a9c22429f761f2c283\", \"sha256\": \"a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898\"}, {\"filename\": \"mpfr-4.2.2.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/mpfr/mpfr-4.2.2.tar.xz\", \"bytes\": 1505596, \"book_md5\": \"7c32c39b8b6e3ae85f25156228156061\", \"sha256\": \"b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01\"}, {\"filename\": \"mpc-1.4.1.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/mpc/mpc-1.4.1.tar.xz\", \"bytes\": 531992, \"book_md5\": \"40c5fba305125279ea46041160e81daf\", \"sha256\": \"91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931\"}, {\"filename\": \"binutils-gprofng-34502.patch\", \"url\": \"https://sourceware.org/git/?p=binutils-gdb.git;a=patch;h=2d570d754422b4990f590829c4bed905a327bc7b\", \"bytes\": 1391, \"sha256\": \"cc4aaa5749b3b6cb3d5296ec1485c667c8e438dbd32b1530025e19cf95896060\"\
        }]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-math.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){ local name=\"$1\";shift; \"$@\" 2>&1 | tee \"/nav-build-metadata/tests/$name.log\"; printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"; }\\\\ncd /sources\\\\ntar -xf binutils-2.47.tar.xz\\\\ncd binutils-2.47\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE binutils-2.47\\\\\\\\n\\\\\\'\\\\npatch -Np1 -i ../binutils-gprofng-34502.patch\\\\nmkdir -v build\\\\ncd       build\\\\n../configure\
        \ --prefix=/usr       \\\\\\\\\\\\n             --sysconfdir=/etc   \\\\\\\\\\\\n             --enable-ld=default \\\\\\\\\\\\n             --enable-plugins    \\\\\\\\\\\\n             --enable-shared     \\\\\\\\\\\\n             --disable-werror    \\\\\\\\\\\\n             --enable-64-bit-bfd \\\\\\\\\\\\n             --enable-new-dtags  \\\\\\\\\\\\n             --with-system-zlib  \\\\\\\\\\\\n             --with-lib-path=/usr/lib \\\\\\\\\\\\n             --enable-default-hash-style=gnu\\\\nmake tooldir=/usr\\\\nset +e\\\\nmake -k check > /nav-build-metadata/tests/binutils.log 2>&1\\\\ncheck_rc=$?\\\\nset -e\\\\nfind . -name \\\\\\'*.sum\\\\\\' -exec cat {} + > /nav-build-metadata/tests/binutils.sum\\\\ncat /nav-build-metadata/tests/binutils.sum\\\\npython3 - \"$check_rc\" <<\\\\\\'AUDIT_BINUTILS\\\\\\'\\\\nimport pathlib,re,sys\\\\ntext=pathlib.Path(\\\\\\'/nav-build-metadata/tests/binutils.sum\\\\\\').read_text()\\\\ncounts={k:sum(map(int,re.findall(r\\\\\\'# of \\\\\\'+k+r\\\
        \\\\'\\\\\\\\s+(\\\\\\\\d+)\\\\\\',text))) for k in [\\\\\\'expected passes\\\\\\',\\\\\\'unexpected failures\\\\\\',\\\\\\'unexpected successes\\\\\\',\\\\\\'unresolved testcases\\\\\\',\\\\\\'untested testcases\\\\\\',\\\\\\'unsupported tests\\\\\\']}\\\\nfail=[x for x in text.splitlines() if x.startswith((\\\\\\'FAIL:\\\\\\',\\\\\\'XPASS:\\\\\\',\\\\\\'UNRESOLVED:\\\\\\'))]\\\\nprint(\\\\\\'NAV_BINUTILS_TEST_COUNTS\\\\\\',counts,flush=True)\\\\nprint(\\\\\\'NAV_BINUTILS_UNEXPECTED_RESULTS\\\\\\',fail,flush=True)\\\\nassert counts[\\\\\\'expected passes\\\\\\']>1000,(\\\\\\'incomplete suite\\\\\\',counts)\\\\nassert not fail and not counts[\\\\\\'unexpected failures\\\\\\'] and not counts[\\\\\\'unexpected successes\\\\\\'] and not counts[\\\\\\'unresolved testcases\\\\\\'],(\\\\\\'unexpected tests\\\\\\',fail)\\\\nassert int(sys.argv[1])==0,(\\\\\\'nonzero suite\\\\\\',sys.argv[1])\\\\nprint(\\\\\\'NAV_BINUTILS_CRITICAL_SUITE_PASS\\\\\\',flush=True)\\\\nAUDIT_BINUTILS\\\\nmake\
        \ tooldir=/usr install\\\\nrm -rfv /usr/lib/lib{bfd,ctf,ctf-nobfd,gprofng,opcodes,sframe}.a \\\\\\\\\\\\n        /usr/share/doc/gprofng/\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE binutils-2.47\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- binutils-2.47\\\\ncd /sources\\\\ntar -xf gmp-6.3.0.tar.xz\\\\ncd gmp-6.3.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE gmp-6.3.0\\\\\\\\n\\\\\\'\\\\nsed -i \\\\\\'/long long t1;/,+1s/()/(...)/\\\\\\' configure\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --enable-cxx     \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/gmp-6.3.0 --host=none-linux-gnu\\\\nmake\\\\nmake html\\\\nrun_test gmp make check\\\\npython3 - <<\\\\\\'AUDIT_MATH\\\\\\'\\\\nimport pathlib,re\\\\ntext=pathlib.Path(\\\\\\'/nav-build-metadata/tests/gmp.log\\\\\\').read_text()\\\\ncounts=[int(x) for x in re.findall(r\\\\\\'# PASS:\\\\\\\\s+(\\\\\\\\d+)\\\\\\',text)]\\\\nassert sum(counts)>=199,(\\\\\\'incomplete critical suite\\\\\\',counts)\\\
        \\nprint(\\\\\\'NAV_GMP_CRITICAL_SUITE_PASS\\\\\\',sum(counts),flush=True)\\\\nAUDIT_MATH\\\\nmake install\\\\nmake install-html\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gmp-6.3.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- gmp-6.3.0\\\\ncd /sources\\\\ntar -xf mpfr-4.2.2.tar.xz\\\\ncd mpfr-4.2.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE mpfr-4.2.2\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr        \\\\\\\\\\\\n            --disable-static     \\\\\\\\\\\\n            --enable-thread-safe \\\\\\\\\\\\n            --docdir=/usr/share/doc/mpfr-4.2.2\\\\nmake\\\\nmake html\\\\nrun_test mpfr make check\\\\npython3 - <<\\\\\\'AUDIT_MATH\\\\\\'\\\\nimport pathlib,re\\\\ntext=pathlib.Path(\\\\\\'/nav-build-metadata/tests/mpfr.log\\\\\\').read_text()\\\\ncounts=[int(x) for x in re.findall(r\\\\\\'# PASS:\\\\\\\\s+(\\\\\\\\d+)\\\\\\',text)]\\\\nassert sum(counts)>=198,(\\\\\\'incomplete critical suite\\\\\\',counts)\\\\nprint(\\\\\\'NAV_MPFR_CRITICAL_SUITE_PASS\\\\\\',sum(counts),flush=True)\\\
        \\nAUDIT_MATH\\\\nmake install\\\\nmake install-html\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE mpfr-4.2.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- mpfr-4.2.2\\\\ncd /sources\\\\ntar -xf mpc-1.4.1.tar.xz\\\\ncd mpc-1.4.1\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE mpc-1.4.1\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/mpc-1.4.1\\\\nmake\\\\nmake html\\\\nrun_test mpc make check\\\\nmake install\\\\nmake install-html\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE mpc-1.4.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- mpc-1.4.1\\\\nldconfig\\\\nprintf \\\\\\'#include <gmpxx.h>\\\\\\\\n#include <iostream>\\\\\\\\nint main(){mpz_class x=19;std::cout<<x+23<<std::endl;}\\\\\\\\n\\\\\\' > /tmp/nav-math.cc\\\\ng++ /tmp/nav-math.cc -lgmpxx -lgmp -o /tmp/nav-math\\\\ntest \"$(/tmp/nav-math)\" = 42\\\\nrm -f /tmp/nav-math /tmp/nav-math.cc\\\\nprintf \\\\\\'NAV_FINAL_MATH_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\\
        'LFS13.1 final Binutils and generic math libraries built with critical suites audited. Final base incomplete, no boot or desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_FINAL_MATH_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc\
        \ /sources/final-math.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/final-math.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 3584\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n\
        \   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_BINUTILS','NAV_GMP','NAV_MPFR','NAV_FINAL','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested final linker and math checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-math-v1
