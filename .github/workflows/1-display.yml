name: NAV source display XKB strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  display:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-mesa-v1
        fail-on-cache-miss: true
    - name: Build display XKB and native X11 smoke
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"libxcvt-0.1.3.tar.xz\", \"url\": \"https://www.x.org/pub/individual/lib/libxcvt-0.1.3.tar.xz\", \"bytes\": 9680, \"book_md5\": \"7fb9c51d33a680f724f34da41768b1d0\", \"sha256\": \"a929998a8767de7dfa36d6da4751cdbeef34ed630714f2f4a767b351f2442e01\"\
        }, {\"filename\": \"font-util-1.4.2.tar.xz\", \"url\": \"https://www.x.org/pub/individual/font/font-util-1.4.2.tar.xz\", \"bytes\": 152764, \"book_md5\": \"42ea8cc91549e43e9251ccbd664e7864\", \"sha256\": \"02e4f8afdcf03cc8372ca9c37aa104b1e36b47722dbc79531be08f0a4c622999\"}, {\"filename\": \"xkbcomp-1.5.0.tar.xz\", \"url\": \"https://www.x.org/pub/individual/app/xkbcomp-1.5.0.tar.xz\", \"bytes\": 247996, \"book_md5\": \"b8128ff6816897bd385ca437cd2886ee\", \"sha256\": \"2ac31f26600776db6d9cd79b3fcd272263faebac7eb85fb2f33c7141b8486060\"}, {\"filename\": \"xkeyboard-config-2.48.tar.xz\", \"url\": \"https://www.x.org/pub/individual/data/xkeyboard-config/xkeyboard-config-2.48.tar.xz\", \"bytes\": 953316, \"book_md5\": \"575106aff79b589abe4aff6c4bff4782\", \"sha256\": \"b77041324f0109f77161ee43743fe04baa485866af8460d31e476ad3f7648fd5\"}, {\"filename\": \"libepoxy-1.5.10.tar.xz\", \"url\": \"https://download.gnome.org/sources/libepoxy/1.5/libepoxy-1.5.10.tar.xz\", \"bytes\": 223528, \"book_md5\"\
        : \"10c635557904aed5239a4885a7c4efb7\", \"sha256\": \"072cda4b59dd098bba8c2363a6247299db1fa89411dc221c8b81b8ee8192e623\"}, {\"filename\": \"xorg-server-21.1.24.tar.xz\", \"url\": \"https://www.x.org/pub/individual/xserver/xorg-server-21.1.24.tar.xz\", \"bytes\": 5072780, \"book_md5\": \"19c2d104a6c9ba85b4896ef75b2d1084\", \"sha256\": \"1a4eb36ca65cc3b1b936566d677a9786e13c11cd5806e951ac55f3f5ce3984af\"}, {\"filename\": \"libxkbcommon-1.13.2.tar.gz\", \"url\": \"https://github.com/lfs-book/libxkbcommon/archive/v1.13.2/libxkbcommon-1.13.2.tar.gz\", \"bytes\": 1243421, \"book_md5\": \"07f838f575d62c267cfc53eaf5ee739b\", \"sha256\": \"e5d5eff0ea09d82c44a96aec75c719b6969fdc602da82e6b1c9aa74cac5fd488\"}, {\"filename\": \"libxkbcommon-1.13.2-upstream_fix-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/blfs/13.1/libxkbcommon-1.13.2-upstream_fix-1.patch\", \"bytes\": 1812, \"book_md5\": null, \"sha256\": \"d978cac5875fed73b7223866a1138718afeba58c1390a412affdcf2cd7744a34\"},\
        \ {\"filename\": \"xcb-util-0.4.1.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/xcb-util-0.4.1.tar.xz\", \"bytes\": 267396, \"book_md5\": \"34d749eab0fd0ffd519ac64798d79847\", \"sha256\": \"5abe3bbbd8e54f0fa3ec945291b7e8fa8cfd3cccc43718f8758430f94126e512\"}, {\"filename\": \"xcb-util-image-0.4.1.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/xcb-util-image-0.4.1.tar.xz\", \"bytes\": 289016, \"book_md5\": \"a67bfac2eff696170259ef1f5ce1b611\", \"sha256\": \"ccad8ee5dadb1271fd4727ad14d9bd77a64e505608766c4e98267d9aede40d3d\"}, {\"filename\": \"xcb-util-keysyms-0.4.1.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/xcb-util-keysyms-0.4.1.tar.xz\", \"bytes\": 259860, \"book_md5\": \"fbdc05f86f72f287ed71b162f1a9725a\", \"sha256\": \"7c260a5294412aed429df1da2f8afd3bd07b7cba3fec772fba15a613a6d5c638\"}, {\"filename\": \"xcb-util-renderutil-0.3.10.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/xcb-util-renderutil-0.3.10.tar.xz\"\
        , \"bytes\": 262028, \"book_md5\": \"193b890e2a89a53c31e2ece3afcbd55f\", \"sha256\": \"3e15d4f0e22d8ddbfbb9f5d77db43eacd7a304029bf25a6166cc63caa96d04ba\"}, {\"filename\": \"xcb-util-wm-0.4.2.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/xcb-util-wm-0.4.2.tar.xz\", \"bytes\": 285152, \"book_md5\": \"581b3a092e3c0c1b4de6416d90b969c3\", \"sha256\": \"62c34e21d06264687faea7edbf63632c9f04d55e72114aa4a57bb95e4f888a0b\"}, {\"filename\": \"xcb-util-cursor-0.1.6.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/xcb-util-cursor-0.1.6.tar.xz\", \"bytes\": 273084, \"book_md5\": \"e85bccd1993992be07232f8b80a814c8\", \"sha256\": \"fdeb8bd127873519be5cc70dcd0d3b5d33b667877200f9925a59fdcad8f7a933\"}, {\"filename\": \"xcb-util-errors-1.0.1.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/xcb-util-errors-1.0.1.tar.xz\", \"bytes\": 268052, \"book_md5\": \"322cf9df283625223933ffcecb4a1cca\", \"sha256\": \"5628c87b984259ad927bacd8a42958319c36bdf4b065887803c9d820fb80f357\"\
        }]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/display.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  test ! -f build/meson-logs/testlog.txt || tail -1000 build/meson-logs/testlog.txt\
        \ | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n tail -80 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\n\\\\nulimit -c 0\\\\nexport MAKEFLAGS=-j2\\\\nexport XORG_PREFIX=/usr\\\\nexport XORG_CONFIG=\\\\\\'--prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static\\\\\\'\\\\nmanifest(){\\\\n python3 - \"$1\" <<\\\\\\'MANIFEST\\\\\\'\\\\nimport json,pathlib,sys\\\\ns=json.loads(pathlib.Path(\\\\\\'build/meson-info/intro-tests.json\\\\\\').read_text())\\\\nassert len(s)>0,sys.argv[1]+\\\\\\' configured\
        \ zero tests\\\\\\'\\\\nprint(\\\\\\'NAV_DISPLAY_TEST_MANIFEST\\\\\\',sys.argv[1],len(s))\\\\nfor t in s:print(\\\\\\'NAV_DISPLAY_TEST\\\\\\',sys.argv[1],t[\\\\\\'name\\\\\\'])\\\\nMANIFEST\\\\n}\\\\ncd /sources\\\\nfor pkg in xcb-util-0.4.1 xcb-util-image-0.4.1 xcb-util-keysyms-0.4.1 xcb-util-renderutil-0.3.10 xcb-util-wm-0.4.2 xcb-util-cursor-0.1.6 xcb-util-errors-1.0.1 font-util-1.4.2 xkbcomp-1.5.0;do\\\\n tar -xf \"$pkg.tar.xz\"\\\\n cd \"$pkg\"\\\\n ./configure $XORG_CONFIG\\\\n make -j2\\\\n chown -R tester:tester .\\\\n run_test \"$pkg\" su tester -c \\\\\\'make -j2 check\\\\\\'\\\\n make install\\\\n cd /sources\\\\n rm -rf \"$pkg\"\\\\ndone\\\\nldconfig\\\\ntar -xf libxcvt-0.1.3.tar.xz\\\\ncd libxcvt-0.1.3\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback\\\\nninja -C build -j2\\\\nninja -C build install\\\\ncvt 1280 720 60\\\\ncd /sources\\\\nrm -rf libxcvt-0.1.3\\\\ntar -xf xkeyboard-config-2.48.tar.xz\\\\ncd xkeyboard-config-2.48\\\\nmeson\
        \ setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback\\\\nninja -C build -j2\\\\n# Bootstrap the runtime database. Its full suite runs below after libxkbcommon.\\\\nninja -C build install\\\\ncd /sources\\\\ntar -xf libepoxy-1.5.10.tar.xz\\\\ncd libepoxy-1.5.10\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true\\\\nninja -C build -j2\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf xorg-server-21.1.24.tar.xz\\\\ncd xorg-server-21.1.24\\\\nmeson setup build --prefix=/usr --localstatedir=/var --buildtype=release --wrap-mode=nofallback -Dglamor=true -Dxkb_output_dir=/var/lib/xkb -Dsecure-rpc=false -Dsuid_wrapper=false -Dxorg=true -Dxvfb=true\\\\nninja -C build -j2\\\\nldconfig\\\\nchown -R tester:tester .\\\\nmanifest xorg-server\\\\nrun_test xorg-server su tester -c \\\\\\'meson test -C build --no-rebuild --print-errorlogs --num-processes 2 --timeout-multiplier 3\\\\\\'\\\\ncp build/meson-logs/testlog.json\
        \ /nav-build-metadata/tests/xorg-server-testlog.json\\\\nninja -C build install\\\\nmkdir -p /etc/X11/xorg.conf.d\\\\nldconfig\\\\ncd /sources\\\\ntar -xf libxkbcommon-1.13.2.tar.gz\\\\ncd libxkbcommon-1.13.2\\\\npatch -Np1 -i ../libxkbcommon-1.13.2-upstream_fix-1.patch\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Denable-docs=false\\\\nninja -C build -j2\\\\nchown -R tester:tester .\\\\nmanifest libxkbcommon\\\\nrun_test libxkbcommon su tester -c \\\\\\'meson test -C build --no-rebuild --print-errorlogs --num-processes 2 --timeout-multiplier 5\\\\\\'\\\\ncp build/meson-logs/testlog.json /nav-build-metadata/tests/libxkbcommon-testlog.json\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources/xkeyboard-config-2.48\\\\nmeson setup --reconfigure build\\\\nninja -C build -j2\\\\nchown -R tester:tester .\\\\nmanifest xkeyboard-config\\\\nrun_test xkeyboard-config su tester -c \\\\\\'meson test -C build --no-rebuild --print-errorlogs --num-processes\
        \ 2 --timeout-multiplier 20\\\\\\'\\\\ncp build/meson-logs/testlog.json /nav-build-metadata/tests/xkeyboard-config-testlog.json\\\\n# Run GLX/EGL loader tests against an actual unprivileged Xvfb process.\\\\ncat > /tmp/nav-x-display-tests.sh <<\\\\\\'DISPLAY_TESTS\\\\\\'\\\\nset -euo pipefail\\\\nexport XDG_RUNTIME_DIR=$(mktemp -d)\\\\nchmod 700 \"$XDG_RUNTIME_DIR\"\\\\nexport LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe\\\\nXvfb -displayfd 3 -screen 0 1280x800x24 -nolisten tcp 3> \"$XDG_RUNTIME_DIR/display\" > \"$XDG_RUNTIME_DIR/xvfb.log\" 2>&1 &\\\\npid=$!\\\\ntrap \\\\\\'kill \"$pid\" 2>/dev/null || true; wait \"$pid\" 2>/dev/null || true; cat \"$XDG_RUNTIME_DIR/xvfb.log\"; rm -rf \"$XDG_RUNTIME_DIR\"\\\\\\' EXIT\\\\nfor n in $(seq 1 100); do test ! -s \"$XDG_RUNTIME_DIR/display\" || break; kill -0 \"$pid\"; sleep 0.1; done\\\\ntest -s \"$XDG_RUNTIME_DIR/display\"\\\\nexport DISPLAY=:$(cat \"$XDG_RUNTIME_DIR/display\")\\\\ncd /sources/libepoxy-1.5.10\\\\nmeson test -C build\
        \ --no-rebuild --print-errorlogs --num-processes 1 --timeout-multiplier 5\\\\n/tmp/nav-x-pixel\\\\nDISPLAY_TESTS\\\\ncat > /tmp/nav-x-pixel.c <<\\\\\\'PIXEL\\\\\\'\\\\n#include <X11/Xlib.h>\\\\n#include <X11/Xutil.h>\\\\n#include <stdio.h>\\\\nint main(void){\\\\n Display*d=XOpenDisplay(NULL);if(!d)return 1;\\\\n int s=DefaultScreen(d);Window w=XCreateSimpleWindow(d,RootWindow(d,s),0,0,160,100,0,0,0);\\\\n GC gc=XCreateGC(d,w,0,NULL);XMapWindow(d,w);XSetForeground(d,gc,0x2878dd);XFillRectangle(d,w,gc,0,0,160,100);XSetForeground(d,gc,0xffffff);XFillRectangle(d,w,gc,20,20,120,60);XSync(d,False);\\\\n XImage*im=XGetImage(d,w,0,0,160,100,AllPlanes,ZPixmap);if(!im)return 2;\\\\n unsigned long pixel=XGetPixel(im,80,50);if(pixel!=0xffffff)return 3;\\\\n FILE*f=fopen(\"/tmp/nav-x-pixel.ppm\",\"wb\");if(!f)return 4;fprintf(f,\"P6\\\\\\\\n160 100\\\\\\\\n255\\\\\\\\n\");\\\\n for(int y=0;y<100;y++)for(int x=0;x<160;x++){unsigned long p=XGetPixel(im,x,y);unsigned char b[3]={p>>16,p>>8,p};fwrite(b,1,3,f);}fclose(f);\\\
        \\n printf(\"NAV_DISPLAY_X11_PIXEL_SMOKE_OK %s depth=%d pixel=%lx\\\\\\\\n\",DisplayString(d),DefaultDepth(d,s),pixel);\\\\n XDestroyImage(im);XFreeGC(d,gc);XDestroyWindow(d,w);XCloseDisplay(d);return 0;\\\\n}\\\\nPIXEL\\\\ngcc /tmp/nav-x-pixel.c -o /tmp/nav-x-pixel $(pkg-config --cflags --libs x11)\\\\ncd /sources/libepoxy-1.5.10\\\\nchown -R tester:tester .\\\\nmanifest libepoxy\\\\nrun_test libepoxy-x11-display su tester -c \\\\\\'bash /tmp/nav-x-display-tests.sh\\\\\\'\\\\ncp build/meson-logs/testlog.json /nav-build-metadata/tests/libepoxy-testlog.json\\\\ncp /tmp/nav-x-pixel.ppm /nav-build-metadata/native-x11-pixel.ppm\\\\nprintf \\\\\\'NAV_DISPLAY_X11_PPM_BASE64 \\\\\\'\\\\nbase64 -w0 /tmp/nav-x-pixel.ppm\\\\nprintf \\\\\\'\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf xkeyboard-config-2.48 libepoxy-1.5.10 xorg-server-21.1.24 libxkbcommon-1.13.2\\\\npkg-config --modversion xorg-server epoxy xkbcommon xkbcommon-x11 xcb-image xcb-keysyms xcb-icccm xcb-cursor\\\\nprintf \\\\\\'Source\
        \ Xorg server/Xvfb with glamor, no suid wrapper, no secure RPC; XKB config/common and XCB utilities. Strict configured nonroot tests. Display loopback/software pixel smoke only. No physical input, rootless logind/PAM, compositor or desktop boot acceptance.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_DISPLAY_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777\
        \ \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/display.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native\
        \ build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/display.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n\
        \ log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested display XKB
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-display-v1
