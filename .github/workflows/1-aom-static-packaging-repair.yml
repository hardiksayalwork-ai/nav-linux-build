name: NAV AOM missing static packaging repair exact payload gate
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-aom-static-packaging-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-x265-root.tar.zst /mnt/nav-aomrepair-root.tar.zst; do\n test ! -e \"$bundle\"\n sudo install\
        \ -o \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c\
        \ '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n\
        \ printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\"\
        \ proof\n zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\"\
        \ \"$probe/recovered\"\n # Match actions/cache extraction semantics, not only bundle writer access.\n test\
        \ \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n\
        \ relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\"\
        \ -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n\
        \ set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\
        \n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program\
        \ unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_AOMREPAIR_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_AOMREPAIR_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_AOMREPAIR_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_AOMREPAIR_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_AOMREPAIR_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_AOMREPAIR_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore verified x265 checkpoint
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-x265-root.tar.zst
        key: nav-blfs13.1-x86_64-x265-open-v1
        fail-on-cache-miss: true
    - name: Verify and extract exact x265 root
      shell: bash
      run: 'set -euo pipefail

        printf "0c96200fd51df490f89d080b7c6bdcf1b5593f962691a03b2ed007dd481a5ef0  /mnt/nav-x265-root.tar.zst\n"
        | sha256sum -c -

        zstd -t /mnt/nav-x265-root.tar.zst

        tar --zstd -xf /mnt/nav-x265-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/x265/X265-TRANSITIONAL-OPEN.json

        '
    - name: Rebuild identical AOM, exact common payload comparison, restore only missing static archive
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda :\
        \ int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\n\
        assert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024\
        \ ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs\
        \ LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\nmkdir -p \"$LFS/nav-build-metadata/aom-repair\"\\npython3\
        \ - <<\\'DOWNLOAD\\'\\nfrom pathlib import Path,PurePosixPath\\nimport urllib.request,hashlib,tarfile,json\\\
        nsrc={\\'filename\\': \\'libaom-3.15.3.tar.gz\\', \\'url\\': \\'https://storage.googleapis.com/aom-releases/libaom-3.15.3.tar.gz\\\
        ', \\'sha256\\': \\'12c01dc731ed7b5a999e28120b45bf58a002ba3435a4ba2cfbc1e084a27c9c04\\', \\'md5\\': \\'6d159812c2ca1f7c9f5dc5c6d9a12e89\\\
        ', \\'top\\': \\'libaom-3.15.3\\'}\\np=Path(\\'/mnt/nav-lfs/sources\\')/src[\\'filename\\']\\nwith urllib.request.urlopen(src[\\\
        'url\\'],timeout=120)as r:p.write_bytes(r.read())\\nassert hashlib.file_digest(p.open(\\'rb\\'),\\'sha256\\\
        ').hexdigest()==src[\\'sha256\\']\\nwith tarfile.open(p)as t:\\n for m in t.getmembers():\\n  q=PurePosixPath(m.name);assert\
        \ not q.is_absolute()and \\'..\\'not in q.parts and q.parts[0]==src[\\'top\\']\\n  assert m.isfile()or m.isdir(),m.name\\\
        n t.extractall(p.parent,filter=\\'data\\')\\nPath(\\'/mnt/nav-lfs/nav-build-metadata/aom-repair/source-lock.json\\\
        ').write_text(json.dumps(src,indent=2))\\nprint(\\'NAV_AOMREPAIR_SOURCE_SHA256_OK\\')\\nDOWNLOAD\\npython3\
        \ - <<\\'INNER\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/aom-repair-stage.sh\\').write_text(\\\
        'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport PATH=/usr/bin:/usr/sbin:/bin:/sbin LANG=C.UTF-8\
        \ MAKEFLAGS=-j2\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\\nP=/nav-build-metadata/aom-repair\\\
        \\nmkdir -p \"$P\"\\\\n{ for package in cairo pango pangocairo libssh2 sqlite3 openssl libgit2; do if pkg-config\
        \ --exists \"$package\";then printf \\\\\\'%s \\\\\\' \"$package\";pkg-config --modversion \"$package\"\
        ;else printf \\\\\\'%s NOT_INSTALLED\\\\\\\\n\\\\\\' \"$package\";fi;done;rustc --version;cargo --version;\
        \ } > \"$P/actual-root-rust-cairo-pango-inspection.log\" 2>&1\\\\ncd /sources/libaom-3.15.3\\\\ncmake -S\
        \ . -B aom-build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=1 -DENABLE_DOCS=no\
        \ > \"$P/configure.log\" 2>&1\\\\ncp aom-build/CMakeCache.txt \"$P/CMakeCache.txt\"\\\\ncmake --build aom-build\
        \ --parallel 2 > \"$P/build.log\" 2>&1\\\\nDESTDIR=/tmp/nav-aom-repair-stage cmake --install aom-build >\
        \ \"$P/stage-install.log\" 2>&1\\\\npython3 - <<\\\\\\'COMPARE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport\
        \ os,json,hashlib,shutil\\\\nroot=Path(\\\\\\'/tmp/nav-aom-repair-stage\\\\\\');common=[];differences=[];missing=[]\\\
        \\nfor f in sorted(root.rglob(\\\\\\'*\\\\\\')):\\\\n if f.is_dir():continue\\\\n rel=f.relative_to(root);target=Path(\\\
        \\\\'/\\\\\\')/rel\\\\n if not target.exists()and not target.is_symlink():missing.append(str(target));continue\\\
        \\n if f.is_symlink():\\\\n  if not target.is_symlink()or os.readlink(f)!=os.readlink(target):differences.append(str(target))\\\
        \\n else:\\\\n  a=hashlib.file_digest(f.open(\\\\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest();z=hashlib.file_digest(target.open(\\\
        \\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest()\\\\n  if a!=z:differences.append(str(target))\\\\n  common.append({\\\
        \\\\'path\\\\\\':str(target),\\\\\\'sha256\\\\\\':z})\\\\np=Path(\\\\\\'/nav-build-metadata/aom-repair\\\
        \\\\');audit={\\\\\\'existing_payload_hashes\\\\\\':common,\\\\\\'differences\\\\\\':differences,\\\\\\\
        'missing\\\\\\':missing,\\\\\\'source_options\\\\\\':\\\\\\'identical original libaom3.15.3, shared1 Release\
        \ docsno, full default build\\\\\\',\\\\\\'canonical_tests_replayed\\\\\\':False,\\\\\\'approved_static_cleanup_exception\\\
        \\\\':\\\\\\'Retain original upstream static archive because installed AOM CMake export requires aom_static\
        \ even for dynamic consumers\\\\\\',\\\\\\'copy_only\\\\\\':\\\\\\'/usr/lib/libaom.a\\\\\\',\\\\\\'classification\\\
        \\\\':\\\\\\'TRANSITIONAL ONLY, inherited examples and OS gaps OPEN\\\\\\'}\\\\n(p/\\\\\\'pre-copy-comparison.json\\\
        \\\\').write_text(json.dumps(audit,indent=2))\\\\nassert not differences,{\\\\\\'STOP_existing_payload_differs\\\
        \\\\':differences}\\\\nassert missing==[\\\\\\'/usr/lib/libaom.a\\\\\\'],missing\\\\nf=root/\\\\\\'usr/lib/libaom.a\\\
        \\\\';audit[\\\\\\'restored_static_bytes\\\\\\']=f.stat().st_size;audit[\\\\\\'restored_static_sha256\\\\\
        \\']=hashlib.file_digest(f.open(\\\\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest();shutil.copy2(f,\\\\\\\
        '/usr/lib/libaom.a\\\\\\');assert hashlib.file_digest(Path(\\\\\\'/usr/lib/libaom.a\\\\\\').open(\\\\\\\
        'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest()==audit[\\\\\\'restored_static_sha256\\\\\\']\\\\n(p/\\\\\\\
        'copy-audit.json\\\\\\').write_text(json.dumps(audit,indent=2));print(\\\\\\'NAV_AOMREPAIR_ONLY_MISSING_STATIC_RESTORED_COMMON_PAYLOADS_EXACT\\\
        \\\\',len(common))\\\\nCOMPARE\\\\nmkdir /tmp/nav-aom-cmake-consumer\\\\ncat > /tmp/nav-aom-cmake-consumer/CMakeLists.txt\
        \ <<\\\\\\'CMAKE\\\\\\'\\\\ncmake_minimum_required(VERSION 3.16)\\\\nproject(nav_aom_consumer C CXX)\\\\\
        nfind_package(AOM REQUIRED CONFIG)\\\\nif(NOT TARGET AOM::aom OR NOT TARGET AOM::aom_static)\\\\n message(FATAL_ERROR\
        \ \"Incomplete upstream AOM exports\")\\\\nendif()\\\\nadd_executable(shared_probe probe.c)\\\\ntarget_link_libraries(shared_probe\
        \ PRIVATE AOM::aom)\\\\nadd_executable(static_probe probe.c)\\\\ntarget_link_libraries(static_probe PRIVATE\
        \ AOM::aom_static)\\\\nset_target_properties(static_probe PROPERTIES LINKER_LANGUAGE CXX)\\\\nCMAKE\\\\\
        ncat > /tmp/nav-aom-cmake-consumer/probe.c <<\\\\\\'C\\\\\\'\\\\n#include <aom/aom_codec.h>\\\\n#include\
        \ <stdio.h>\\\\n#include <string.h>\\\\nint main(void) { const char *v=aom_codec_version_str(); puts(v);\
        \ return strcmp(v,\"v3.15.3\") && strcmp(v,\"3.15.3\"); }\\\\nC\\\\ncmake -S /tmp/nav-aom-cmake-consumer\
        \ -B /tmp/nav-aom-cmake-consumer/build -G Ninja > \"$P/consumer-configure.log\" 2>&1\\\\ncmake --build /tmp/nav-aom-cmake-consumer/build\
        \ --parallel 2 > \"$P/consumer-build.log\" 2>&1\\\\n/tmp/nav-aom-cmake-consumer/build/shared_probe > \"\
        $P/shared-consumer.log\"\\\\n/tmp/nav-aom-cmake-consumer/build/static_probe > \"$P/static-consumer.log\"\
        \\\\nldd /tmp/nav-aom-cmake-consumer/build/shared_probe > \"$P/shared-consumer-linkage.log\"\\\\nldd /tmp/nav-aom-cmake-consumer/build/static_probe\
        \ > \"$P/static-consumer-linkage.log\"\\\\ngrep -q \\\\\\'libaom.so.3 => /usr/lib/libaom.so.3\\\\\\' \"\
        $P/shared-consumer-linkage.log\"\\\\n! grep -q libaom \"$P/static-consumer-linkage.log\"\\\\n! grep -q \\\
        \\\\'not found\\\\\\' \"$P/shared-consumer-linkage.log\" \"$P/static-consumer-linkage.log\"\\\\npython3\
        \ - <<\\\\\\'SMOKE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport subprocess,tempfile,hashlib,json,shutil\\\
        \\np=Path(\\\\\\'/nav-build-metadata/aom-repair\\\\\\');d=Path(tempfile.mkdtemp(prefix=\\\\\\'nav-aom-installed-\\\
        \\\\',dir=\\\\\\'/tmp\\\\\\'))\\\\ndata=bytes((i*7+13)%256 for i in range(16*16))+bytes((i*3+71)%256 for\
        \ i in range(2*8*8));(d/\\\\\\'input.yuv\\\\\\').write_bytes(data)\\\\nwith (p/\\\\\\'installed-lossless-smoke.log\\\
        \\\\').open(\\\\\\'w\\\\\\')as log:\\\\n subprocess.run([\\\\\\'/usr/bin/aomenc\\\\\\',\\\\\\'--codec=av1\\\
        \\\\',\\\\\\'--ivf\\\\\\',\\\\\\'--lossless=1\\\\\\',\\\\\\'--cpu-used=8\\\\\\',\\\\\\'--threads=2\\\\\\\
        ',\\\\\\'--passes=1\\\\\\',\\\\\\'--limit=1\\\\\\',\\\\\\'--width=16\\\\\\',\\\\\\'--height=16\\\\\\',\\\
        \\\\'--fps=1/1\\\\\\',\\\\\\'-o\\\\\\',str(d/\\\\\\'output.ivf\\\\\\'),str(d/\\\\\\'input.yuv\\\\\\')],stdout=log,stderr=subprocess.STDOUT,check=True)\\\
        \\n subprocess.run([\\\\\\'/usr/bin/aomdec\\\\\\',\\\\\\'--codec=av1\\\\\\',\\\\\\'--rawvideo\\\\\\',\\\\\
        \\'--i420\\\\\\',\\\\\\'--output-bit-depth=8\\\\\\',\\\\\\'-o\\\\\\',str(d/\\\\\\'decoded.yuv\\\\\\'),str(d/\\\
        \\\\'output.ivf\\\\\\')],stdout=log,stderr=subprocess.STDOUT,check=True)\\\\nassert (d/\\\\\\'decoded.yuv\\\
        \\\\').read_bytes()==data\\\\n(p/\\\\\\'installed-lossless-pixels.json\\\\\\').write_text(json.dumps({\\\
        \\\\'bytes\\\\\\':len(data),\\\\\\'sha256\\\\\\':hashlib.sha256(data).hexdigest(),\\\\\\'pixel_exact\\\\\
        \\':True},indent=2))\\\\nshutil.rmtree(d)\\\\nSMOKE\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib\
        \ import Path\\\\nimport json,hashlib\\\\np=Path(\\\\\\'/nav-build-metadata/aom-repair\\\\\\');a=json.loads((p/\\\
        \\\\'copy-audit.json\\\\\\').read_text())\\\\nfor x in a[\\\\\\'existing_payload_hashes\\\\\\']:assert hashlib.file_digest(Path(x[\\\
        \\\\'path\\\\\\']).open(\\\\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest()==x[\\\\\\'sha256\\\\\\']\\\\\
        na.update(complete_upstream_CMake_shared_static_consumer_import_link_run=\\\\\\'PASS\\\\\\',installed_shared_lossless384byte_pixels=\\\
