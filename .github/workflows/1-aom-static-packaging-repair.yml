        \ /tmp/nav-aomrepair-members\ngrep -qx './usr/lib/libaom.a' /tmp/nav-aomrepair-members\nsudo mkdir /mnt/nav-aomrepair-replay\n\
        sudo tar --zstd -xf /mnt/nav-aomrepair-root.tar.zst -C /mnt/nav-aomrepair-replay\nsudo python3 - <<'INDEPENDENT'\n\
        from pathlib import Path\nimport os,stat,hashlib,json\n\ndef manifest(root):\n root=Path(root);out={}\n\
        \ for d,dirs,files in os.walk(root,followlinks=False):\n  for p in [Path(d)]+[Path(d)/n for n in files]+[Path(d)/n\
        \ for n in dirs if (Path(d)/n).is_symlink()]:\n   s=p.lstat();x={'type':stat.S_IFMT(s.st_mode),'mode':stat.S_IMODE(s.st_mode),'uid':s.st_uid,'gid':s.st_gid,'mtime':int(s.st_mtime)}\n\
        \   if stat.S_ISREG(s.st_mode):x.update(bytes=s.st_size,sha256=hashlib.file_digest(p.open('rb'),'sha256').hexdigest())\n\
        \   elif stat.S_ISLNK(s.st_mode):x['link']=os.readlink(p)\n   elif not stat.S_ISDIR(s.st_mode):x['rdev']=s.st_rdev\n\
        \   out[str(p.relative_to(root))]=x\n return out\nleft=manifest('/mnt/nav-lfs');right=manifest('/mnt/nav-aomrepair-replay');assert\
        \ left==right,{'only_left':list(set(left)-set(right))[:10],'different':[k for k in set(left)&set(right)if\
        \ left[k]!=right[k]][:10]}\np=Path('/mnt/nav-aomrepair-root.tar.zst');proof={'classification':'TRANSITIONAL\
        \ only, not OS acceptance, inherited gaps OPEN','bundle_bytes':p.stat().st_size,'bundle_sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),'independent_full_replay_manifest_equal':True,'paths':len(left),'manifest_sha256':hashlib.sha256(json.dumps(left,sort_keys=True).encode()).hexdigest(),'audit':json.loads(Path('/mnt/nav-lfs/nav-build-metadata/aom-repair/AOMREPAIR-TRANSITIONAL-OPEN.json').read_text()),'pixels':json.loads(Path('/mnt/nav-lfs/nav-build-metadata/aom-repair/installed-lossless-pixels.json').read_text())}\n\
        Path('/tmp/aomrepair-candidate-proof.json').write_text(json.dumps(proof,sort_keys=True));print('NAV_AOMREPAIR_CANDIDATE_PROOF_JSON\
        \ '+json.dumps(proof,sort_keys=True),flush=True)\nINDEPENDENT\nsudo rm -rf /mnt/nav-aomrepair-replay\n"
