name: NAV LFS final optimized Python audited stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  final-python:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-crypto-tools-v1
        fail-on-cache-miss: true
    - name: Build optimized Python OpenSSL4 compatibility patch and test
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"Python-3.14.7.tar.xz\", \"url\": \"https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz\", \"bytes\": 24053924, \"book_md5\": \"a4c4c2991b4126e227073c2d9445f432\", \"sha256\": \"3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81\"\
        }, {\"filename\": \"Python-3.14.7-openssl_4-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/Python-3.14.7-openssl_4-1.patch\", \"bytes\": 38486, \"book_md5\": \"597d7737df1b4ea4e184c193da523050\", \"sha256\": \"707a0c457192ac2f3b5b8a51481bc5ebd12db22d57c1dbe0256138ee6e070792\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-python.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\ncd /sources\\\\ntar -xf Python-3.14.7.tar.xz\\\\ncd Python-3.14.7\\\\nprintf\
        \ \\\\\\'BEGIN_FINAL_PACKAGE Python-3.14.7\\\\\\\\n\\\\\\'\\\\npatch -Np1 -i ../Python-3.14.7-openssl_4-1.patch\\\\n./configure --prefix=/usr --enable-shared --with-system-expat --enable-optimizations --without-static-libpython\\\\nmake\\\\n# Temporary runner resolver for network tests. It is not part of target image.\\\\nif [ -e /etc/resolv.conf ]; then cp -a /etc/resolv.conf /tmp/nav-resolv.saved; fi\\\\ncp /sources/nav-resolv.conf /etc/resolv.conf\\\\nset +e\\\\nmake test TESTOPTS=\"--timeout 120 -j2 --junit-xml=/nav-build-metadata/tests/python-junit.xml\" > /nav-build-metadata/tests/python.log 2>&1\\\\ncheck_rc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/python.log\\\\nrm -f /etc/resolv.conf /sources/nav-resolv.conf\\\\nif [ -e /tmp/nav-resolv.saved ]; then mv /tmp/nav-resolv.saved /etc/resolv.conf; fi\\\\n# The runner may exit0 with skips; require completed summary and no remaining failures.\\\\npython3 - \"$check_rc\" <<\\\\\\'PYTHON_AUDIT\\\\\\'\\\\nimport pathlib,re,sys,json,xml.etree.ElementTree\
        \ as ET\\\\ntext=pathlib.Path(\\\\\\'/nav-build-metadata/tests/python.log\\\\\\').read_text(errors=\\\\\\'replace\\\\\\')\\\\nprint(\\\\\\'NAV_PYTHON_DIAGNOSTIC_BEGIN\\\\\\',flush=True)\\\\nfor line in text.splitlines()[-600:]:print(\\\\\\'NAV_PYTHON_DIAGNOSTIC\\\\\\',line,flush=True)\\\\nprint(\\\\\\'NAV_PYTHON_DIAGNOSTIC_END\\\\\\',flush=True)\\\\nroot=ET.parse(\\\\\\'/nav-build-metadata/tests/python-junit.xml\\\\\\').getroot()\\\\ntests=list(root.iter(\\\\\\'testcase\\\\\\'));assert len(tests)>46000,(\\\\\\'Python suite too small\\\\\\',len(tests))\\\\nunsupported=[];bad=[]\\\\nfor case in tests:\\\\n for e in list(case):\\\\n  if e.tag not in [\\\\\\'failure\\\\\\',\\\\\\'error\\\\\\']:continue\\\\n  name=case.get(\\\\\\'name\\\\\\',\\\\\\'\\\\\\')\\\\n  detail=\\\\\\'\\\\\\'.join(e.itertext());record={\\\\\\'name\\\\\\':name,\\\\\\'kind\\\\\\':e.tag,\\\\\\'detail\\\\\\':detail}\\\\n  print(\\\\\\'NAV_PYTHON_CASE_DIAGNOSTIC\\\\\\',json.dumps(record),flush=True)\\\\n  if name==\\\
        \\\\'test.test_mmap.LargeMmapTests.test_around_4GB\\\\\\' and e.tag==\\\\\\'error\\\\\\' and \\\\\\'OSError: [Errno 12] Cannot allocate memory\\\\\\' in detail and \\\\\\'test_around_4GB\\\\\\' in detail and \\\\\\'_test_around_boundary(_4G)\\\\\\' in detail:\\\\n   unsupported.append(record)\\\\n  else:bad.append(record)\\\\nassert not bad,(\\\\\\'Unexpected Python failed cases\\\\\\',bad)\\\\nassert len(unsupported)<=2,(\\\\\\'too many mmap occurrences\\\\\\',unsupported)\\\\n# CPython numerator omits resource_denied and adds rerun; validate its formula.\\\\nsummary=re.search(r\\\\\\'Total test files: run=(\\\\\\\\d+)/492([^\\\\\\\\n]*)\\\\\\',text)\\\\nassert summary,text[-4000:]\\\\nfields=dict((k,int(v)) for k,v in re.findall(r\\\\\\'(\\\\\\\\w+)=(\\\\\\\\d+)\\\\\\',summary.group(2)))\\\\nassert int(summary.group(1))==492-fields.get(\\\\\\'resource_denied\\\\\\',0)+fields.get(\\\\\\'rerun\\\\\\',0),summary.group(0)\\\\nassert fields.get(\\\\\\'resource_denied\\\\\\',0)==3 and\
        \ fields.get(\\\\\\'skipped\\\\\\',0)==27,fields\\\\nassert \\\\\\'[492/492\\\\\\' in text,\\\\\\'full initial suite did not complete\\\\\\'\\\\nrc=int(sys.argv[1])\\\\nif unsupported:\\\\n assert rc==2 and \\\\\\'Result: FAILURE then FAILURE\\\\\\' in text,(rc,text[-2000:])\\\\n matches=re.findall(r\\\\\\'^\\\\\\\\d+ tests? failed:\\\\\\\\n((?:[ \\\\\\\\t]+[^\\\\\\\\n]+\\\\\\\\n)+)\\\\\\',text,re.M)\\\\n assert matches and set(matches[-1].split())=={\\\\\\'test_mmap\\\\\\'},matches\\\\n print(\\\\\\'NAV_PYTHON_MMAP4GB_ENVIRONMENT_UNSUPPORTED_NOT_PASSED\\\\\\',flush=True)\\\\nelse:\\\\n assert rc==0 and \\\\\\'Result: SUCCESS\\\\\\' in text\\\\npathlib.Path(\\\\\\'/nav-build-metadata/tests/python-audit.json\\\\\\').write_text(json.dumps({\\\\\\'testcases\\\\\\':len(tests),\\\\\\'environment_unsupported\\\\\\':unsupported,\\\\\\'unexpected_failures\\\\\\':[]},indent=2)+\\\\\\'\\\\\\\\n\\\\\\')\\\\nprint(\\\\\\'NAV_PYTHON_SUITE_AUDIT_OK\\\\\\',len(tests),flush=True)\\\\nPYTHON_AUDIT\\\
        \\nmake install\\\\ncat > /etc/pip.conf <<\\\\\\'PIP\\\\\\'\\\\n[global]\\\\nroot-user-action = ignore\\\\ndisable-pip-version-check = true\\\\nPIP\\\\nldconfig\\\\npython3 - <<\\\\\\'PYTHON_SMOKE\\\\\\'\\\\nimport sys,ssl,sqlite3,decimal,ctypes,pyexpat,threading,hashlib,zlib,bz2,lzma\\\\nassert sys.version_info[:3]==(3,14,7)\\\\nassert ssl.OPENSSL_VERSION.startswith(\\\\\\'OpenSSL 4.0.1\\\\\\')\\\\nassert sqlite3.connect(\\\\\\':memory:\\\\\\').execute(\\\\\\'select 19+23\\\\\\').fetchone()[0]==42\\\\nassert decimal.Decimal(\\\\\\'0.1\\\\\\')+decimal.Decimal(\\\\\\'0.2\\\\\\')==decimal.Decimal(\\\\\\'0.3\\\\\\')\\\\nassert ctypes.CDLL(None).strlen(b\\\\\\'NAV\\\\\\')==3\\\\nfor m in [zlib,bz2,lzma]:assert m.decompress(m.compress(b\\\\\\'nav\\\\\\'))==b\\\\\\'nav\\\\\\'\\\\nprint(\\\\\\'NAV_FINAL_PYTHON_SMOKE_OK\\\\\\',sys.version,ssl.OPENSSL_VERSION,flush=True)\\\\nPYTHON_SMOKE\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE Python-3.14.7\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf Python-3.14.7\\\
        \\nprintf \\\\\\'LFS13.1 final optimized Python3.14.7/OpenSSL4 compatibility patch. Full standard suite audited; mmap4GB may be environment-unsupported under4GiB cap, never passed. Skips retained in logs. No boot or desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_FINAL_PYTHON_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo cp -L /etc/resolv.conf \"$LFS/sources/nav-resolv.conf\"\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t\
        \ tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/final-python.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm\
        \ -f \"$LFS/sources/\"*.patch \"$LFS/sources/\"*.tar.* \"$LFS/sources/final-python.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n\
        \ log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_FINAL','NAV_PYTHON','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested final Python checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-python-v1
