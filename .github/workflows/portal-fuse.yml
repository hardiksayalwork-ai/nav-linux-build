name: NAV Rust debug-source A B diagnostic no save
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-authgeo-open-v1
        fail-on-cache-miss: true
    - name: Build source Rust with original suites inside capped disposable scratch
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1]\
        \ for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count()\
        \ >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 30 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\n\
        p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"\
        $LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/portal-testdeps/AUTHGEO-TRANSITIONAL-OPEN.json\"\\n# Fresh\
        \ precondition before downloads, sparse allocation or any Rust work.\\npython3 - <<\\'PREFLIGHT\\'\\nimport shutil,os\\\
        nfree=shutil.disk_usage(\\'/mnt\\').free\\nprint(\\'NAV_RUST_HOST_FREE_PREFLIGHT\\',free,flush=True)\\nassert free>30*1024**3,\
        \ \\'Rust host free-space precondition not met\\'\\nassert len(os.sched_getaffinity(0))>=2\\n# All child processes\
        \ inherit exactly two CPUs, even test runners that ignore jobs.\\ncpus=sorted(os.sched_getaffinity(0))[:2]\\nprint(\\\
        'NAV_RUST_CPU_SET\\',cpus,flush=True)\\nPREFLIGHT\\nmkdir -p \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\\
        nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\"[{\\\\\"filename\\\\\": \\\\\"libssh2-1.11.1.tar.gz\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7\\\\\", \\\\\"url\\\
        \\\": \\\\\"https://www.libssh2.org/download/libssh2-1.11.1.tar.gz\\\\\"}, {\\\\\"filename\\\\\": \\\\\"libssh2-1.11.1-security_fixes-1.patch\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"919a91a0ef99a97efe1f94e2bed7600ce12fdf5f3e6c978b8eba37fe4526ec5e\\\\\", \\\\\"url\\\
        \\\": \\\\\"https://www.linuxfromscratch.org/patches/blfs/13.1/libssh2-1.11.1-security_fixes-1.patch\\\\\"}, {\\\\\
        \"filename\\\\\": \\\\\"rustc-1.96.0-x86_64-unknown-linux-gnu.tar.xz\\\\\", \\\\\"url\\\\\": \\\\\"https://static.rust-lang.org/dist/2026-05-28/rustc-1.96.0-x86_64-unknown-linux-gnu.tar.xz\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"7d7fa1d0cfb0fab71a956bb78f41107202c17f30ab56c45288e869a37fd9633d\\\\\"}, {\\\\\"filename\\\
        \\\": \\\\\"rust-std-1.96.0-x86_64-unknown-linux-gnu.tar.xz\\\\\", \\\\\"url\\\\\": \\\\\"https://static.rust-lang.org/dist/2026-05-28/rust-std-1.96.0-x86_64-unknown-linux-gnu.tar.xz\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"c09c7c646248f14f473f5f7a029af15ee57c3a9f9bc93dfa72d9621938586b82\\\\\"}, {\\\\\"filename\\\
        \\\": \\\\\"cargo-1.96.0-x86_64-unknown-linux-gnu.tar.xz\\\\\", \\\\\"url\\\\\": \\\\\"https://static.rust-lang.org/dist/2026-05-28/cargo-1.96.0-x86_64-unknown-linux-gnu.tar.xz\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"dee75c3c8f9f600ad75bc0c93249e767d3047845a4dd668327ce43ab039ba266\\\\\"}, {\\\\\"filename\\\
        \\\": \\\\\"rustc-1.97.1-src.tar.xz\\\\\", \\\\\"url\\\\\": \\\\\"https://static.rust-lang.org/dist/rustc-1.97.1-src.tar.xz\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"0ed06fdaffd4722a7702e0b4eebfafc897ab8f513e8e1b247cdd7e5c6df6ded2\\\\\"}]\")\\nfor\
        \ x in lock:\\n p=pathlib.Path(\\'/mnt/nav-lfs/sources\\')/x[\\'filename\\']\\n with urllib.request.urlopen(x[\\'url\\\
        '],timeout=120)as r, p.open(\\'wb\\')as f:\\n  while q:=r.read(1024*1024):f.write(q)\\n assert hashlib.file_digest(p.open(\\\
        'rb\\'),\\'sha256\\').hexdigest()==x[\\'sha256\\'],x[\\'filename\\']\\n print(\\'SOURCE_SHA256_OK\\',x[\\'filename\\\
        '],flush=True)\\npathlib.Path(\\'/mnt/nav-lfs/sources/rust-source-lock.json\\').write_text(json.dumps(lock,indent=2))\\\
        nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/rust-diagnostic.sh\\\
        ').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/usr/bin:/usr/sbin:/bin:/sbin\
        \ LANG=C.UTF-8 CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir\
        \ -p /nav-build-metadata/rust /nav-build-metadata/tests\\\\ncd /sources\\\\ntest \"$(llvm-config --version)\" = 22.1.8\\\
        \\npkg-config --modversion sqlite3 libcurl openssl\\\\nprintf \\\\\\'NAV_RUST_SYSTEM_LLVM \\\\\\'; llvm-config --shared-mode\\\
        \\n# Real libssh2, with the official BLFS security patch. No test-source changes.\\\\ntar -xf libssh2-1.11.1.tar.gz\\\
        \\ncd libssh2-1.11.1\\\\npatch -Np1 -i ../libssh2-1.11.1-security_fixes-1.patch\\\\n./configure --prefix=/usr --disable-docker-tests\
        \ --disable-static\\\\nmake -j2\\\\nchown -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin;\
        \ make -j2 check\\\\\\' > /nav-build-metadata/tests/libssh2.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/libssh2.log\\\
        \\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/rust/libssh2.exit\\\\nfind . -type f \\\\\\\\( -name\
        \ \\\\\\'*.trs\\\\\\' -o -name \\\\\\'test-suite.log\\\\\\' -o -name config.log \\\\\\\\) -exec cp --parents \\\\\\\
        '{}\\\\\\' /nav-build-metadata/rust/ \\\\\\\\;\\\\ntest \"$rc\" = 0\\\\nmake install\\\\nldconfig\\\\npkg-config --modversion\
        \ libssh2\\\\ncd /sources/rust-work\\\\ntest -d lost+found\\\\ncp /sources/rustc-1.97.1-src.tar.xz .\\\\ntar -xf rustc-1.97.1-src.tar.xz\\\
        \\nrm rustc-1.97.1-src.tar.xz\\\\ncd rustc-1.97.1-src\\\\ncp /sources/rust-bootstrap-reviewed.toml bootstrap.toml\\\
        \\ncp bootstrap.toml /nav-build-metadata/rust/\\\\ncp src/stage0 /nav-build-metadata/rust/upstream-stage0.txt\\\\\
        npython3 - <<\\\\\\'BOOTSTRAP_LOCK\\\\\\'\\\\nfrom pathlib import Path\\\\ns=Path(\\\\\\'src/stage0\\\\\\').read_text()\\\
        \\nassert \\\\\\'dist_server=https://static.rust-lang.org\\\\\\' in s\\\\nassert \\\\\\'dist/2026-05-28/rustc-1.96.0-x86_64-unknown-linux-gnu.tar.xz=7d7fa1d0cfb0fab71a956bb78f41107202c17f30ab56c45288e869a37fd9633d\\\
        \\\\' in s\\\\nassert \\\\\\'dist/2026-05-28/rust-std-1.96.0-x86_64-unknown-linux-gnu.tar.xz=c09c7c646248f14f473f5f7a029af15ee57c3a9f9bc93dfa72d9621938586b82\\\
        \\\\' in s\\\\nassert \\\\\\'dist/2026-05-28/cargo-1.96.0-x86_64-unknown-linux-gnu.tar.xz=dee75c3c8f9f600ad75bc0c93249e767d3047845a4dd668327ce43ab039ba266\\\
        \\\\' in s\\\\nprint(\\\\\\'NAV_RUST_UPSTREAM_STAGE0_LOCKS_CONFIRMED\\\\\\')\\\\nBOOTSTRAP_LOCK\\\\npython3 - <<\\\
        \\\\'BOOTSTRAP_BYTES\\\\\\'\\\\nimport hashlib,json\\\\nfrom pathlib import Path\\\\nlock=json.loads(Path(\\\\\\'/sources/rust-source-lock.json\\\
        \\\\').read_text())\\\\nfor x in lock:\\\\n if \\\\\\'1.96.0\\\\\\' in x[\\\\\\'filename\\\\\\']:\\\\n  p=Path(\\\\\
        \\'/sources\\\\\\')/x[\\\\\\'filename\\\\\\'];assert hashlib.file_digest(p.open(\\\\\\'rb\\\\\\'),\\\\\\'sha256\\\\\
        \\').hexdigest()==x[\\\\\\'sha256\\\\\\'],x[\\\\\\'filename\\\\\\']\\\\nprint(\\\\\\'NAV_RUST_BOOTSTRAP_BYTES_VERIFIED\\\
        \\\\')\\\\nBOOTSTRAP_BYTES\\\\nmkdir -p build/cache/2026-05-28\\\\ncp /sources/rustc-1.96.0-x86_64-unknown-linux-gnu.tar.xz\
        \ /sources/rust-std-1.96.0-x86_64-unknown-linux-gnu.tar.xz /sources/cargo-1.96.0-x86_64-unknown-linux-gnu.tar.xz build/cache/2026-05-28/\\\
        \\nexport LIBSSH2_SYS_USE_PKG_CONFIG=1 LIBSQLITE3_SYS_USE_PKG_CONFIG=1\\\\n# Stage0 is only the upstream-pinned bootstrap.\
        \ Source stage2 and shared LLVM\\\\n# are explicit; no prebuilt final compiler or CI LLVM substitutes.\\\\nchown -R\
        \ tester /sources/rust-work\\\\nprintf \\\\\\'NAV_RUST_SOURCE_BUILD_BEGIN\\\\\\\\n\\\\\\'\\\\nset +e\\\\nsu tester\
        \ -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2 LIBSSH2_SYS_USE_PKG_CONFIG=1\
        \ LIBSQLITE3_SYS_USE_PKG_CONFIG=1; ./x.py build --jobs 2\\\\\\' > /nav-build-metadata/tests/rust-build.log 2>&1\\\\\
        nrc=$?\\\\nset -e\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/rust/build.exit\\\\ntail -80\
        \ /nav-build-metadata/tests/rust-build.log\\\\ntest \"$rc\" = 0\\\\nprintf \\\\\\'NAV_RUST_SOURCE_BUILD_COMPLETE\\\
        \\\\\\n\\\\\\'\\\\n# Unchanged original test, targeted diagnostic only. Failure is retained.\\\\nset +e\\\\nsu tester\
        \ -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2 LIBSSH2_SYS_USE_PKG_CONFIG=1\
        \ LIBSQLITE3_SYS_USE_PKG_CONFIG=1; ./x.py test --jobs 2 tests/run-make/embed-source-dwarf --test-args=--nocapture\\\
        \\\\' > /nav-build-metadata/tests/rust-tests.log 2>&1\\\\nrc=$?\\\\nset -e\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"\
        $rc\" > /nav-build-metadata/rust/tests.exit\\\\ntail -100 /nav-build-metadata/tests/rust-tests.log\\\\n# Independent\
        \ A/B probes, not replacements for the original test.\\\\nmkdir -p /sources/rust-work/probes\\\\nprintf \\\\\\'//\
        \ hello\\\\\\\\nfn main() {}\\\\\\\\n\\\\\\' > /sources/rust-work/probes/main.rs\\\\nchown -R tester /sources/rust-work/probes\\\
        \\nset +e\\\\nfor variant in default off thin dynamic; do\\\\n case \"$variant\" in\\\\n  default) flags=;;\\\\n \
        \ off) flags=\\\\\\'-Clto=off\\\\\\';;\\\\n  thin) flags=\\\\\\'-Clto=thin\\\\\\';;\\\\n  dynamic) flags=\\\\\\'-Clto=off\
        \ -Cprefer-dynamic\\\\\\';;\\\\n esac\\\\n su tester -c \"export PATH=/usr/bin:/usr/sbin:/bin:/sbin RUSTC_BOOTSTRAP=1;\
        \ cd /sources/rust-work/probes; /sources/rust-work/rustc-1.97.1-src/build/x86_64-unknown-linux-gnu/stage2/bin/rustc\
        \ main.rs -o probe-$variant -g -Zembed-source=yes -Cdwarf-version=5 $flags\" >> /nav-build-metadata/tests/rust-probes.log\
        \ 2>&1\\\\n probe_rc=$?\\\\n printf \\\\\\'NAV_DEBUG_PROBE_COMPILE %s %s\\\\\\\\n\\\\\\' \"$variant\" \"$probe_rc\"\
        \ >> /nav-build-metadata/tests/rust-probes.log\\\\n if [ \"$probe_rc\" = 0 ]; then\\\\n  llvm-dwarfdump --debug-line\
        \ \"/sources/rust-work/probes/probe-$variant\" > \"/nav-build-metadata/rust/probe-$variant-dwarf.txt\" 2>&1\\\\n \
        \ printf \\\\\\'NAV_DEBUG_PROBE_DWARF %s %s\\\\\\\\n\\\\\\' \"$variant\" \"$?\" >> /nav-build-metadata/tests/rust-probes.log\\\
        \\n fi\\\\ndone\\\\nset -e\\\\ncat /nav-build-metadata/tests/rust-probes.log\\\\npython3 - <<\\\\\\'PROBE_EVIDENCE\\\
        \\\\'\\\\nfrom pathlib import Path\\\\nimport base64\\\\nfor f in Path(\\\\\\'/nav-build-metadata/rust\\\\\\').glob(\\\
        \\\\'probe-*-dwarf.txt\\\\\\'):\\\\n b=f.read_bytes()\\\\n for i in range(0,len(b),3000):print(\\\\\\'NAV_DEBUG_DWARF_\\\
        \\\\'+f.stem.replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\').upper()+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\
        \\nPROBE_EVIDENCE\\\\nprintf \\\\\\'NAV_RUST_DEBUG_DIAGNOSTIC_ONLY_NO_SAVE\\\\\\\\n\\\\\\'\\\\n\\')\\nPath(\\'/mnt/nav-lfs/sources/rust-bootstrap-reviewed.toml\\\
        ').write_text(\\'change-id = 154587\\\\n[llvm]\\\\nlink-shared = true\\\\ntargets = \"X86\"\\\\ndownload-ci-llvm =\
        \ false\\\\nlink-jobs = 1\\\\n[build]\\\\ndescription = \"NAV source build based on BLFS 13.1\"\\\\ndocs = false\\\
        \\njobs = 2\\\\nbuild-stage = 2\\\\ntest-stage = 2\\\\nextended = true\\\\ntools = [\"cargo\", \"clippy\", \"rustdoc\"\
        , \"rustfmt\", \"src\"]\\\\n[install]\\\\nprefix = \"/opt/rustc-1.97.1\"\\\\ndocdir = \"share/doc/rustc-1.97.1\"\\\
        \\n[rust]\\\\nchannel = \"stable\"\\\\nlto = \"thin\"\\\\ncodegen-units = 1\\\\nllvm-bitcode-linker = false\\\\ndownload-rustc\
        \ = false\\\\n[target.x86_64-unknown-linux-gnu]\\\\nllvm-config = \"/usr/bin/llvm-config\"\\\\ncc = \"/usr/bin/gcc\"\
        \\\\ncxx = \"/usr/bin/g++\"\\\\nlinker = \"/usr/bin/gcc\"\\\\n\\')\\nINNER_SCRIPT\\n# Dedicated capped scratch, never\
        \ a root/cache size-limit increase.\\ntest ! -e /mnt/nav-rust-scratch.ext4\\nsudo truncate -s 24G /mnt/nav-rust-scratch.ext4\\\
        nsudo mkfs.ext4 -q -F /mnt/nav-rust-scratch.ext4\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\
        \\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\\
        nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS/sources/rust-work\"\\npython3 -c \\'import shutil; assert shutil.disk_usage(\"\
        /mnt\").free>30*1024**3\\'\\nmount -o loop /mnt/nav-rust-scratch.ext4 \"$LFS/sources/rust-work\"\\ncleanup_rust_scratch()\
        \ { rc=$?; trap - EXIT; rm -rf \"$LFS/sources/rust-work/\"*; umount \"$LFS/sources/rust-work\"; rm -f /mnt/nav-rust-scratch.ext4;\
        \ exit \"$rc\"; }\\ntrap cleanup_rust_scratch EXIT\\nfindmnt \"$LFS/sources/rust-work\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\\
        nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc\
        \ \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif\
        \ [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev\
        \ tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin\
        \ /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm\
        \ /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb\
        \ PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/rust-diagnostic.sh\\\
        nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash\
        \ --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke;\
        \ printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# No checkpoint save in this diagnostic. Namespace exit\
        \ removes all mounts.\\nif findmnt -rn \"$LFS/sources/rust-work\"; then exit 1; fi\\nsudo rm -f /mnt/nav-rust-scratch.ext4\\\
        nprintf \\'NAV_RUST_DISPOSABLE_SCRATCH_REMOVED\\n\\'\\ntest ! -e /mnt/nav-rust-scratch.ext4\\nsudo rm -f \"$LFS/sources/\"\
        *.tar.* \"$LFS/sources/rust-diagnostic.sh\" \"$LFS/sources/rust-bootstrap-reviewed.toml\" \"$LFS/sources/rust-source-lock.json\"\
        \ \"$LFS/sources/libssh2-1.11.1-security_fixes-1.patch\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh\
        \ \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log',\
        \ 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True, preexec_fn=lambda\
        \ : os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:2]))\ntry:\n    while proc.poll() is None:\n        free\
        \ = shutil.disk_usage('/mnt').free\n        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 *\
        \ 1024 ** 2 or time.monotonic() - start > 315 * 60:\n            raise RuntimeError('resource or stage-time safety\
        \ floor reached')\n        print(json.dumps({'elapsed_seconds': round(time.monotonic() - start), 'free_disk_bytes':\
        \ free, 'available_memory_kib': available}), flush=True)\n        time.sleep(20)\n    if proc.returncode:\n      \
        \  raise RuntimeError('source-build failed with status ' + str(proc.returncode))\nfinally:\n    if proc.poll() is\
        \ None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n        except\
        \ subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n    log.close()\n\
        \    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n    print('\\n'.join(lines[-80:]))\n\
        \    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK', 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE',\
        \ 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON', 'NAV_TESTER', 'NAV_KF6', 'Totals:',\
        \ 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE', 'NAV_PORTAL'])))))\n    import base64\n\
        \    for name in ['libssh2', 'rust-build', 'rust-tests', 'rust-probes']:\n        f = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/tests/'\
        \ + name + '.log')\n        if f.exists():\n            data = f.read_bytes()\n            for i in range(0, len(data),\
        \ 3000):\n                print('NAV_RUST_' + name.upper().replace('-', '_') + '_B64', base64.b64encode(data[i:i +\
        \ 3000]).decode(), flush=True)\n    for f in pathlib.Path('/mnt/nav-lfs/nav-build-metadata/rust').glob('probe-*-dwarf.txt'):\n\
        \        data = f.read_bytes()\n        for i in range(0, len(data), 3000):\n            print('NAV_DEBUG_DWARF_'\
        \ + f.stem.replace('-', '_').upper() + '_B64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\n    for f\
        \ in pathlib.Path('/mnt/nav-lfs/nav-build-metadata/rust').glob('*.exit'):\n        print('NAV_RUST_EXIT', f.name,\
        \ f.read_text().strip(), flush=True)\nNAV_GUARD\n"
