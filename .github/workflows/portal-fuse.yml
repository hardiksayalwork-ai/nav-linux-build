{\"filename\": \"gsettings-desktop-schemas-50.1.tar.xz\", \"url\": \"https://download.gnome.org/sources/gsettings-desktop-schemas/50/gsettings-desktop-schemas-50.1.tar.xz\", \"bytes\": 896852, \"sha256\": \"0a2aa25082672585d16fcdab61c7b0e33f035fb87476505c794f29565afa485b\"}, {\"filename\": \"libunistring-1.4.2.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/libunistring/libunistring-1.4.2.tar.xz\", \"bytes\": 2786084, \"sha256\": \"5b46e74377ed7409c5b75e7a96f95377b095623b689d8522620927964a41499c\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/usr/bin:/usr/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE TEST_WITH_VALGRIND\\\\nexport PYTEST_ADDOPTS=\"-ra\"\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/portal-testdeps /nav-build-metadata/tests\\\\ncd /sources\\\\nrun_suite() {\\\\n name=\"$1\"; shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n printf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > \"/nav-build-metadata/portal-testdeps/$name.exit\"\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n NAV_CAPTURE_NAME=\"$name\" python3 - <<\\\\\\'CAPTURE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport os,base64\\\\nn=os.environ[\\\\\\'NAV_CAPTURE_NAME\\\\\\'];b=Path(\\\\\\'/nav-build-metadata/tests/\\\\\\'+n+\\\\\\'.log\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_PORTAL_\\\\\\'+n.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nprint(\\\\\\'NAV_PORTAL_TEST_EXIT\\\\\\',n,Path(\\\\\\'/nav-build-metadata/portal-testdeps/\\\\\\'+n+\\\\\\'.exit\\\\\\').read_text().strip(),flush=True)\\\\nCAPTURE\\\\n}\\\\nmeson_suite() {\\\\n name=\"$1\"; who=\"$2\"\\\\n chown -R tester .\\\\n run_suite \"$name\" su \"$who\" -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin; dbus-run-session -- meson test -C build --num-processes 2 --print-errorlogs\\\\\\'\\\\n mkdir -p \"/nav-build-metadata/portal-testdeps/$name\"\\\\n cp build/meson-logs/testlog.* \"/nav-build-metadata/portal-testdeps/$name/\"\\\\n python3 - \"$name\" <<\\\\\\'MESON_EVIDENCE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,sys,base64\\\\nn=sys.argv[1];b=Path(\\\\\\'build/meson-logs/testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_PORTAL_FULL_\\\\\\'+n.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(l)for l in Path(\\\\\\'build/meson-logs/testlog.json\\\\\\').read_text().splitlines()if l.strip()]\\\\nprint(\\\\\\'NAV_PORTAL_MESON_RESULTS\\\\\\',n,[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nMESON_EVIDENCE\\\\n}\\\\nrun_suite capsh-root sh -c \\\\\\'command -v capsh; capsh --print\\\\\\'\\\\nrun_suite capsh-user su tester -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin; command -v capsh; capsh --print\\\\\\'\\\\n# Real policy libraries first. Shadow is the supported framework on the current\\\\n# no-PAM bootstrap root, not the final NAV face/PAM integration.\\\\ntar -xf duktape-2.7.0.tar.xz\\\\ncd duktape-2.7.0\\\\nsed -i \\\\\\'s/-Os/-O2/\\\\\\' Makefile.sharedlibrary\\\\nmake -f Makefile.sharedlibrary INSTALL_PREFIX=/usr -j2\\\\nmake -f Makefile.sharedlibrary INSTALL_PREFIX=/usr install\\\\nldconfig\\\\nmake -f Makefile.sharedlibrary INSTALL_PREFIX=/usr duk\\\\nrun_suite duktape-smoke ./duk -e \\\\\\'if (JSON.parse(\"{\\\\\\\\\"value\\\\\\\\\":42}\").value !== 42) throw new Error(\"bad JSON\")\\\\\\'\\\\nprintf \\\\\\'Release tarball has no upstream regression suite. Original duk CLI smoke only; Polkit tests separate. Not full-tested Duktape.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/duktape-scope.txt\\\\ncd /sources\\\\ntar -xf polkit-127.tar.gz\\\\ncd polkit-127\\\\ngetent group polkitd || groupadd -g 27 polkitd\\\\nid polkitd || useradd -c \\\\\\'PolicyKit Daemon Owner\\\\\\' -d /etc/polkit-1 -u 27 -g polkitd -s /bin/false polkitd\\\\nmeson setup build --prefix=/usr --sysconfdir=/etc --buildtype=release --wrap-mode=nofallback -Dman=false -Dsession_tracking=logind -Dtests=true -Dauthfw=shadow -Dos_type=lfs\\\\nninja -C build -j2\\\\nmeson_suite polkit tester\\\\nninja -C build install\\\\nldconfig\\\\nprintf \\\\\\'Polkit shadow backend matches current no-PAM root per BLFS. Final face/PAM + Shadow + systemd reconfiguration remains mandatory, not accepted here. Original Polkit tests remain enabled; any namespace skips are OPEN mandatory VM gates.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/polkit-scope.txt\\\\ncd /sources\\\\ntar -xf upower-v1.91.3.tar.bz2\\\\ncd upower-v1.91.3\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dgtk-doc=false -Dman=false -Dpolkit=enabled\\\\nninja -C build -j2\\\\nmeson_suite upower-polkit tester\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf nettle-4.0.tar.gz\\\\ncd nettle-4.0\\\\n./configure --prefix=/usr --disable-static\\\\nmake -j2\\\\nmake -j2 libnettle.a libhogweed.a\\\\nchown -R tester .\\\\nrun_suite nettle su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nmake install\\\\nchmod 755 /usr/lib/libhogweed.so /usr/lib/libnettle.so\\\\nldconfig\\\\ncd /sources\\\\ntar -xf libunistring-1.4.2.tar.xz\\\\ncd libunistring-1.4.2\\\\n./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/libunistring-1.4.2\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suite libunistring su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nfind . -name test-suite.log -exec cp --parents \\\\\\'{}\\\\\\' /nav-build-metadata/portal-testdeps/ \\\\\\';\\\\\\'\\\\nmake install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf gnutls-3.8.13.tar.xz\\\\ncd gnutls-3.8.13\\\\n./configure --prefix=/usr --docdir=/usr/share/doc/gnutls-3.8.13 --with-default-trust-store-pkcs11=\\\\\\'pkcs11:\\\\\\'\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suite gnutls su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nmkdir -p /nav-build-metadata/portal-testdeps/gnutls-original-results\\\\nfind . -name test-suite.log -exec cp --parents \\\\\\'{}\\\\\\' /nav-build-metadata/portal-testdeps/gnutls-original-results/ \\\\\\';\\\\\\'\\\\nmake install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf gsettings-desktop-schemas-50.1.tar.xz\\\\ncd gsettings-desktop-schemas-50.1\\\\nsed -i -r \\\\\\'s:\"(/system):\"/org/gnome\\\\\\\\1:g\\\\\\' schemas/*.in\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback\\\\nninja -C build -j2\\\\nninja -C build install\\\\nprintf \\\\\\'GSettings schemas upstream ships no test suite; schemas build/install only, not regression pass.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/gsettings-scope.txt\\\\ncd /sources\\\\ntar -xf glib-networking-2.80.1.tar.xz\\\\ncd glib-networking-2.80.1\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dlibproxy=disabled\\\\nninja -C build -j2\\\\nmeson_suite glib-networking tester\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf nghttp2-1.70.0.tar.xz\\\\ncd nghttp2-1.70.0\\\\n./configure --prefix=/usr --disable-static --enable-lib-only --docdir=/usr/share/doc/nghttp2-1.70.0\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suite nghttp2 su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nfind . -name test-suite.log -exec cp --parents \\\\\\'{}\\\\\\' /nav-build-metadata/portal-testdeps/ \\\\\\';\\\\\\'\\\\nmake install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf libsoup-3.6.6.tar.xz\\\\ncd libsoup-3.6.6\\\\npatch -Np1 -i ../libsoup-3.6.6-upstream_fixes-1.patch\\\\nsed \\\\\\'s/apiversion/soup_version/\\\\\\' -i docs/reference/meson.build\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true -Dpkcs11_tests=enabled\\\\nninja -C build -j2\\\\nmeson_suite libsoup tester\\\\ncp build/meson-info/intro-buildoptions.json /nav-build-metadata/portal-testdeps/libsoup/\\\\ncp build/meson-logs/meson-log.txt /nav-build-metadata/portal-testdeps/libsoup/\\\\nprintf \\\\\\'Configured tests enabled, GnuTLS PKCS11 enabled. Optional Apache/Kerberos/Samba/Brotli/Autobahn-dependent unconfigured coverage remains OPEN, not a full upstream suite claim. Source Meson options/log retained.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/libsoup-scope.txt\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf geoclue-2.8.2.tar.bz2\\\\ncd geoclue-2.8.2\\\\nmeson setup build --prefix=/usr --sysconfdir=/etc --buildtype=release --wrap-mode=nofallback -Dgtk-doc=false -Dnmea-source=false -D3g-source=false -Dcdma-source=false -Dmodem-gps-source=false -Ddemo-agent=false\\\\nninja -C build -j2\\\\nninja -C build install\\\\nldconfig\\\\nprintf \\\\\\'GeoClue full service+client library built, no upstream test suite exists per BLFS. Optional ModemManager/Avahi/libnotify integration absent. No location API key copied and no real location query executed; no runtime location-service claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/geoclue-scope.txt\\\\ncd /sources\\\\ntar -xf xdg-desktop-portal-1.22.1.tar.xz\\\\ntar -xf gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\\\\ntar -xf libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff.tar.gz\\\\ndiff -qr gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab xdg-desktop-portal-1.22.1/subprojects/gvdb\\\\ndiff -qr libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff xdg-desktop-portal-1.22.1/subprojects/libglnx\\\\ncd xdg-desktop-portal-1.22.1\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=enabled -Ddocumentation=disabled -Dman-pages=disabled -Dgeoclue=enabled -Dsandboxed-image-validation=enabled -Dsandboxed-sound-validation=enabled\\\\nninja -C build -j2\\\\nstat -c \\\\\\'%U %G %a %n\\\\\\' /usr/bin/fusermount3\\\\n# Restore the upstream-installed helper mode cleared by recursive ownership reset.\\\\nchown root:root /usr/bin/fusermount3\\\\nchmod 4755 /usr/bin/fusermount3\\\\nstat -c \\\\\\'%U %G %a %n\\\\\\' /usr/bin/fusermount3\\\\nmeson_suite portal-geoclue tester\\\\nprintf \\\\\\'DIAGNOSTIC no save. Real policy and GeoClue dependencies, original suites all enabled. Any failure or nested/unconfigured skip remains OPEN, no tested-portal/desktop/ISO acceptance.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/authgeo-scope.txt\\\\n\\\\nninja -C build install\\\\nldconfig\\\\npython3 - <<\\\\\\'AUTHGEO_AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,collections,re,shutil\\\\np=Path(\\\\\\'/nav-build-metadata/portal-testdeps\\\\\\');o={\\\\\\'classification\\\\\\':\\\\\\'TRANSITIONAL ONLY, no tested-portal claim. Every failure, skip, xfail and unconfigured optional test stays OPEN. Prior transitional image/testdeps gaps remain OPEN unless specifically closed here.\\\\\\',\\\\\\'meson\\\\\\':{},\\\\\\'autotools\\\\\\':{},\\\\\\'open\\\\\\':[],\\\\\\'nested\\\\\\':{}}\\\\nfor n in [\\\\\\'polkit\\\\\\',\\\\\\'upower-polkit\\\\\\',\\\\\\'glib-networking\\\\\\',\\\\\\'libsoup\\\\\\',\\\\\\'portal-geoclue\\\\\\']:\\\\n rows=[json.loads(l)for l in (p/n/\\\\\\'testlog.json\\\\\\').read_text().splitlines()if l.strip()];c=dict(collections.Counter(r[\\\\\\'result\\\\\\']for r in rows));o[\\\\\\'meson\\\\\\'][n]={\\\\\\'counts\\\\\\':c,\\\\\\'cases\\\\\\':[{\\\\\\'name\\\\\\':r[\\\\\\'name\\\\\\'],\\\\\\'result\\\\\\':r[\\\\\\'result\\\\\\']}for r in rows]}\\\\n if n==\\\\\\'upower-polkit\\\\\\':assert c=={\\\\\\'OK\\\\\\':92},c\\\\n if n==\\\\\\'polkit\\\\\\':assert c=={\\\\\\'SKIP\\\\\\':5},c\\\\n if n==\\\\\\'libsoup\\\\\\':asse