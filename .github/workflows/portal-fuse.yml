name: NAV transitional real policy and location checkpoint gaps OPEN
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-testdeps-open-v1
        fail-on-cache-miss: true
    - name: Build real policy and location chain then preserve all coverage gaps
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"duktape-2.7.0.tar.xz\", \"url\": \"https://duktape.org/duktape-2.7.0.tar.xz\", \"bytes\": 1026524, \"sha256\": \"90f8d2fa8b5567c6899830ddef2c03f3c27960b11aca222fa17aa7ac613c2890\"}, {\"filename\": \"polkit-127.tar.gz\", \"url\": \"https://github.com/polkit-org/polkit/archive/127/polkit-127.tar.gz\", \"bytes\": 472872, \"sha256\": \"9b7bc16f086479dcc626c575976568ba4a85d34297a750d8ab3d2e57f6d8b988\"}, {\"filename\": \"geoclue-2.8.2.tar.bz2\", \"url\": \"https://gitlab.freedesktop.org/geoclue/geoclue/-/archive/2.8.2/geoclue-2.8.2.tar.bz2\", \"bytes\": 115910, \"sha256\": \"d4d65933b704d4c8d4ca9747dc511b883e35099abe534c8560f2aab3017e4cd4\"}, {\"filename\": \"upower-v1.91.3.tar.bz2\", \"url\": \"https://gitlab.freedesktop.org/upower/upower/-/archive/v1.91.3/upower-v1.91.3.tar.bz2\", \"bytes\": 170438, \"sha256\": \"12227b3dcd34c5097bbda25984b192ea0bd5e11dce479358d9ef70415a38e4b6\"}, {\"filename\": \"gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\", \"url\": \"https://gitlab.gnome.org/GNOME/gvdb/-/archive/c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab/gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\", \"bytes\": 26318, \"sha256\": \"14f082f122eb4e495e2ac96f235efb01525ae5d4a1f0fd98148b4f7c7f95ccd2\"}, {\"filename\": \"lib