name: NAV transitional portal checkpoint failures and skips OPEN
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-images-v1
        fail-on-cache-miss: true
    - name: Build and record transitional dependency and portal failures OPEN
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"vala-0.56.19.tar.xz\", \"url\": \"https://download.gnome.org/sources/vala/0.56/vala-0.56.19.tar.xz\", \"bytes\": 4007612, \"sha256\": \"5ad7cbbfcc0de61b403d6797c9ef60455bfbebd8e162aec33b5b0b097adfb9d5\"}, {\"filename\": \"libgudev-238.tar.xz\", \"url\": \"https://download.gnome.org/sources/libgudev/238/libgudev-238.tar.xz\", \"bytes\": 30548, \"sha256\": \"61266ab1afc9d73dbc60a8b2af73e99d2fdff47d99544d085760e4fa667b5dd1\"}, {\"filename\": \"libpcap-1.10.6.tar.gz\", \"url\": \"https://www.tcpdump.org/release/libpcap-1.10.6.tar.gz\", \"bytes\": 987897, \"sha256\": \"872dd11337fe1ab02ad9d4fee047c9da244d695c6ddf34e2ebb733efd4ed8aa9\"}, {\"filename\": \"umockdev-0.19.8.tar.xz\", \"url\": \"https://github.com/martinpitt/umockdev/releases/download/0.19.8/umockdev-0.19.8.tar.xz\", \"bytes\": 499460, \"sha256\": \"9d57c917a32dc696877ab525eb510971a8109899d5b92d986e7bac32573125b0\"}, {\"filename\": \"dbus-python-1.4.0.tar.xz\", \"url\": \"https://dbus.freedesktop.org/releases/dbus-python/dbus-python-1.4.0.tar.xz\", \"bytes\": 168268, \"sha256\": \"c36b28f10ffcc8f1f798aca973bcc132f91f33eb9b6b8904381b4077766043d5\"}, {\"filename\": \"pygobject-3.56.3.tar.gz\", \"url\": \"https://download.gnome.org/sources/pygobject/3.56/pygobject-3.56.3.tar.gz\", \"bytes\": 1411853, \"sha256\": \"12760e4a0e3d04b6eb95e06f7a27e362c826d567ea613373a92c003b6c70d2d6\"}, {\"filename\": \"pycairo-1.29.1.tar.gz\", \"url\": \"https://github.com/pygobject/pycairo/releases/download/v1.29.1/pycairo-1.29.1.tar.gz\", \"bytes\": 666272, \"sha256\": \"4fbd26b4af24c9787d84cf5448e34eb8dca064b732479aaecd03109520eebd5f\"}, {\"filename\": \"python_dbusmock-0.38.1.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/p/python-dbusmock/python_dbusmock-0.38.1.tar.gz\", \"bytes\": 108144, \"sha256\": \"221b65e1c2e48de9fd11bf7e8c165adaf91648f49a11f390d086a498386f2984\"}, {\"filename\": \"gobject-introspection-tests-53e6bc978d5011f22d0a27cca49a94b19816ca7d.tar.gz\", \"url\": \"https://gitlab.gnome.org/GNOME/gobject-introspection-tests/-/archive/53e6bc978d5011f22d0a27cca49a94b19816ca7d/gobject-introspection-tests-53e6bc978d5011f22d0a27cca49a94b19816ca7d.tar.gz\", \"bytes\": 112948, \"sha256\": \"e89df75b85b85d4ff5cf4ab1ca641d5ecdfebb3473851d903b19418b4c336346\"}, {\"filename\": \"pythoncapi-compat-22811c3f0e69908894d2bd724f572b32667f2141.tar.gz\", \"url\": \"https://api.github.com/repos/python/pythoncapi-compat/tarball/22811c3f0e69908894d2bd724f572b32667f2141\", \"bytes\": 52821, \"sha256\": \"cac53774dd7cc2b5e900060a49a7d69591df76974701674fa0eb32fbfac45c1c\"}, {\"filename\": \"libportal-0.9.1.tar.xz\", \"url\": \"https://github.com/flatpak/libportal/releases/download/0.9.1/libportal-0.9.1.tar.xz\", \"bytes\": 108572, \"sha256\": \"de801ee349ed3c255a9af3c01b1a401fab5b3fc1c35eb2fd7dfb35d4b8194d7f\"}, {\"filename\": \"libportal-0.9.1-qt6.9_fixes-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/blfs/13.1/libportal-0.9.1-qt6.9_fixes-1.patch\", \"bytes\": 1918, \"sha256\": \"52fa427c47cf92edcb4f3d800e6f1232dbcb6251dc897954c96ec1db8668d271\"}, {\"filename\": \"setuptools_scm-10.3.4-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/da/f5/54538a1f17ea753c42b0928dc2e62986d463f8c393340b9a1e602f2d4dd9/setuptools_scm-10.3.4-py3-none-any.whl\", \"bytes\": 33366, \"sha256\": \"82f34c3e3084fc2b57d397200637cc13f2338004052d2fee47baa5f0e902464e\"}, {\"filename\": \"vcs_versioning-2.6.0-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/73/1d/ad4064bf12f4503bf61e65d74c93c523672776d25ee0a06aaf42ae09ef3f/vcs_versioning-2.6.0-py3-none-any.whl\", \"bytes\": 123154, \"sha256\": \"f8bebd1302ebc12e67ceb30fc7dd698ec969414b6fa43b30c3f14ac9b1e72c41\"}, {\"filename\": \"upower-v1.91.3.tar.bz2\", \"url\": \"https://gitlab.freedesktop.org/upower/upower/-/archive/v1.91.3/upower-v1.91.3.tar.bz2\", \"bytes\": 170438, \"sha256\": \"12227b3dcd34c5097bbda25984b192ea0bd5e11dce479358d9ef70415a38e4b6\"}, {\"filename\": \"gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\", \"url\": \"https://gitlab.gnome.org/GNOME/gvdb/-/archive/c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab/gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\", \"bytes\": 26318, \"sha256\": \"14f082f122eb4e495e2ac96f235efb01525ae5d4a1f0fd98148b4f7c7f95ccd2\"}, {\"filename\": \"libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff.tar.gz\", \"url\": \"https://gitlab.gnome.org/GNOME/libglnx/-/archive/ff64d52116ae74f0d25e24f089db28921ea171ff/libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff.tar.gz\", \"bytes\": 90219, \"sha256\": \"fcf7670f61f003ae290ed8486814dc89bbe50eebb0bd5f56a77ebccc6ddefc94\"}, {\"filename\": \"xdg-desktop-portal-1.22.1.tar.xz\", \"url\": \"https://github.com/flatpak/xdg-desktop-portal/releases/download/1.22.1/xdg-desktop-portal-1.22.1.tar.xz\", \"bytes\": 1264992, \"sha256\": \"d4879ddb3d65ff1a8f19187497e6f13dc5d267bcac404a5d501218be355753d3\"}, {\"filename\": \"gst-plugins-good-1.28.6.tar.xz\", \"url\": \"https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.6.tar.xz\", \"bytes\": 5999116, \"sha256\": \"b0c620a4b18b6ee931b4c43bbf1760d308666dc37f730a7e7f1ad327e59ce2df\"}, {\"filename\": \"libusb-1.0.30.tar.bz2\", \"url\": \"https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2\", \"bytes\": 656112, \"sha256\": \"fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/usr/bin:/usr/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE TEST_WITH_VALGRIND\\\\nexport PYTEST_ADDOPTS=\"-ra\"\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/portal-testdeps /nav-build-metadata/tests\\\\ncd /sources\\\\npython3 -m pip install --no-index --no-deps --no-build-isolation ./setuptools_scm-*.whl ./vcs_versioning-*.whl\\\\nrun_suite() {\\\\n name=\"$1\"; shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n printf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > \"/nav-build-metadata/portal-testdeps/$name.exit\"\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n NAV_CAPTURE_NAME=\"$name\" python3 - <<\\\\\\'CAPTURE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport os,base64\\\\nn=os.environ[\\\\\\'NAV_CAPTURE_NAME\\\\\\'];b=Path(\\\\\\'/nav-build-metadata/tests/\\\\\\'+n+\\\\\\'.log\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_PORTAL_\\\\\\'+n.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nprint(\\\\\\'NAV_PORTAL_TEST_EXIT\\\\\\',n,Path(\\\\\\'/nav-build-metadata/portal-testdeps/\\\\\\'+n+\\\\\\'.exit\\\\\\').read_text().strip(),flush=True)\\\\nCAPTURE\\\\n}\\\\nmeson_suite() {\\\\n name=\"$1\"; who=\"$2\"\\\\n chown -R tester .\\\\n run_suite \"$name\" su \"$who\" -c \\\\\\'dbus-run-session -- meson test -C build --num-processes 2 --print-errorlogs\\\\\\'\\\\n mkdir -p \"/nav-build-metadata/portal-testdeps/$name\"\\\\n cp build/meson-logs/testlog.* \"/nav-build-metadata/portal-testdeps/$name/\"\\\\n python3 - \"$name\" <<\\\\\\'MESON_EVIDENCE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,sys,base64\\\\nn=sys.argv[1];b=Path(\\\\\\'build/meson-logs/testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_PORTAL_FULL_\\\\\\'+n.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(l)for l in Path(\\\\\\'build/meson-logs/testlog.json\\\\\\').read_text().splitlines()if l.strip()]\\\\nprint(\\\\\\'NAV_PORTAL_MESON_RESULTS\\\\\\',n,[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nMESON_EVIDENCE\\\\n}\\\\ntar -xf vala-0.56.19.tar.xz\\\\ncd vala-0.56.19\\\\n./configure --prefix=/usr --disable-valadoc\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suite vala su tester -c \\\\\\'dbus-run-session -- make -j2 check\\\\\\'\\\\ncp tests/test-suite.log /nav-build-metadata/portal-testdeps/vala-test-suite.log\\\\nmake install\\\\ncd /sources\\\\ntar -xf libpcap-1.10.6.tar.gz\\\\ncd libpcap-1.10.6\\\\n./configure --prefix=/usr\\\\nmake -j2\\\\nsed -i \\\\\\'/INSTALL_DATA.*libpcap.a\\\\\\\\|RANLIB.*libpcap.a/ s/^/#/\\\\\\' Makefile\\\\nmake install\\\\nprintf \\\\\\'libpcap upstream has no test suite. Build and install only, not regression pass.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/libpcap-scope.txt\\\\ncd /sources\\\\ntar -xf pycairo-1.29.1.tar.gz\\\\ncd pycairo-1.29.1\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback\\\\nninja -C build -j2\\\\nmeson_suite pycairo tester\\\\nninja -C build install\\\\ncd /sources\\\\ntar -xf pygobject-3.56.3.tar.gz\\\\ntar -xf gobject-introspection-tests-53e6bc978d5011f22d0a27cca49a94b19816ca7d.tar.gz\\\\ntar -xf pythoncapi-compat-22811c3f0e69908894d2bd724f572b32667f2141.tar.gz\\\\nmv gobject-introspection-tests-53e6bc978d5011f22d0a27cca49a94b19816ca7d pygobject-3.56.3/subprojects/gobject-introspection-tests\\\\nmv python-pythoncapi-compat-22811c3 pygobject-3.56.3/subprojects/pythoncapi-compat\\\\ncd pygobject-3.56.3\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true\\\\nninja -C build -j2\\\\nmeson_suite pygobject tester\\\\nninja -C build install\\\\ncd /sources\\\\ntar -xf dbus-python-1.4.0.tar.xz\\\\ncd dbus-python-1.4.0\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=enabled\\\\nninja -C build -j2\\\\nmeson_suite dbus-python tester\\\\nninja -C build install\\\\ncd /sources\\\\ntar -xf python_dbusmock-0.38.1.tar.gz\\\\ncd python_dbusmock-0.38.1\\\\npython3 -m pip wheel -w dist --no-build-isolation --no-deps --no-cache-dir .\\\\npython3 -m pip install --no-index --no-deps --find-links dist python-dbusmock\\\\nchown -R tester .\\\\ncd /sources\\\\ntar -xf libgudev-238.tar.xz\\\\ncd libgudev-238\\\\n# Initial build resolves the gudev/umockdev test-dependency cycle. Full original tests re-enabled below.\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=disabled -Dintrospection=enabled -Dvapi=enabled\\\\nninja -C build -j2\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf umockdev-0.19.8.tar.xz\\\\ncd umockdev-0.19.8\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback\\\\nninja -C build -j2\\\\nmeson_suite umockdev root\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources/libgudev-238\\\\nmeson configure build -Dtests=enabled\\\\nninja -C build -j2\\\\nmeson_suite libgudev tester\\\\ncd /sources\\\\ntar -xf libusb-1.0.30.tar.bz2\\\\ncd libusb-1.0.30\\\\n./configure --prefix=/usr --disable-static --enable-tests-build\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suit