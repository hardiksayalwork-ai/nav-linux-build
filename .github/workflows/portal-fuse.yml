name: NAV real Polkit and GeoClue portal diagnostic no save
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-testdeps-open-v1
        fail-on-cache-miss: true
    - name: Build real authorization and GeoClue dependencies with original configured tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"duktape-2.7.0.tar.xz\", \"url\": \"https://duktape.org/duktape-2.7.0.tar.xz\", \"bytes\": 1026524, \"sha256\": \"90f8d2fa8b5567c6899830ddef2c03f3c27960b11aca222fa17aa7ac613c2890\"}, {\"filename\": \"polkit-127.tar.gz\", \"url\": \"https://github.com/polkit-org/polkit/archive/127/polkit-127.tar.gz\", \"bytes\": 472872, \"sha256\": \"9b7bc16f086479dcc626c575976568ba4a85d34297a750d8ab3d2e57f6d8b988\"}, {\"filename\": \"geoclue-2.8.2.tar.bz2\", \"url\": \"https://gitlab.freedesktop.org/geoclue/geoclue/-/archive/2.8.2/geoclue-2.8.2.tar.bz2\", \"bytes\": 115910, \"sha256\": \"d4d65933b704d4c8d4ca9747dc511b883e35099abe534c8560f2aab3017e4cd4\"}, {\"filename\": \"upower-v1.91.3.tar.bz2\", \"url\": \"https://gitlab.freedesktop.org/upower/upower/-/archive/v1.91.3/upower-v1.91.3.tar.bz2\", \"bytes\": 170438, \"sha256\": \"12227b3dcd34c5097bbda25984b192ea0bd5e11dce479358d9ef70415a38e4b6\"}, {\"filename\": \"gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\", \"url\": \"https://gitlab.gnome.org/GNOME/gvdb/-/archive/c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab/gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\", \"bytes\": 26318, \"sha256\": \"14f082f122eb4e495e2ac96f235efb01525ae5d4a1f0fd98148b4f7c7f95ccd2\"}, {\"filename\": \"libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff.tar.gz\", \"url\": \"https://gitlab.gnome.org/GNOME/libglnx/-/archive/ff64d52116ae74f0d25e24f089db28921ea171ff/libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff.tar.gz\", \"bytes\": 90219, \"sha256\": \"fcf7670f61f003ae290ed8486814dc89bbe50eebb0bd5f56a77ebccc6ddefc94\"}, {\"filename\": \"xdg-desktop-portal-1.22.1.tar.xz\", \"url\": \"https://github.com/flatpak/xdg-desktop-portal/releases/download/1.22.1/xdg-desktop-portal-1.22.1.tar.xz\", \"bytes\": 1264992, \"sha256\": \"d4879ddb3d65ff1a8f19187497e6f13dc5d267bcac404a5d501218be355753d3\"}, {\"filename\": \"nettle-4.0.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/nettle/nettle-4.0.tar.gz\", \"bytes\": 2630735, \"sha256\": \"3addbc00da01846b232fb3bc453538ea5468da43033f21bb345cb1e9073f5094\"}, {\"filename\": \"gnutls-3.8.13.tar.xz\", \"url\": \"https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz\", \"bytes\": 7275324, \"sha256\": \"ffed8ec1bf09c2426d4f14aae377de4753b53e537d685e604e99a8b16ca9c97e\"}, {\"filename\": \"glib-networking-2.80.1.tar.xz\", \"url\": \"https://download.gnome.org/sources/glib-networking/2.80/glib-networking-2.80.1.tar.xz\", \"bytes\": 290828, \"sha256\": \"b80e2874157cd55071f1b6710fa0b911d5ac5de106a9ee2a4c9c7bee61782f8e\"}, {\"filename\": \"nghttp2-1.70.0.tar.xz\", \"url\": \"https://github.com/nghttp2/nghttp2/releases/download/v1.70.0/nghttp2-1.70.0.tar.xz\", \"bytes\": 2018996, \"sha256\": \"e05cb1388eaca3830aded4ccf20044b6e1ac1a61411dcca11b0437c4285c8bc2\"}, {\"filename\": \"libsoup-3.6.6.tar.xz\", \"url\": \"https://download.gnome.org/sources/libsoup/3.6/libsoup-3.6.6.tar.xz\", \"bytes\": 1572004, \"sha256\": \"51ed0ae06f9d5a40f401ff459e2e5f652f9a510b7730e1359ee66d14d4872740\"}, {\"filename\": \"libsoup-3.6.6-upstream_fixes-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/blfs/13.1/libsoup-3.6.6-upstream_fixes-1.patch\", \"bytes\": 3950, \"sha256\": \"fbb882736209700137e49d6a8d161ffe3b20345da79a9353d9b61fd0cc6ea9bb\"}, {\"filename\": \"gsettings-desktop-schemas-50.1.tar.xz\", \"url\": \"https://download.gnome.org/sources/gsettings-desktop-schemas/50/gsettings-desktop-schemas-50.1.tar.xz\", \"bytes\": 896852, \"sha256\": \"0a2aa25082672585d16fcdab61c7b0e33f035fb87476505c794f29565afa485b\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/usr/bin:/usr/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE TEST_WITH_VALGRIND\\\\nexport PYTEST_ADDOPTS=\"-ra\"\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/portal-testdeps /nav-build-metadata/tests\\\\ncd /sources\\\\nrun_suite() {\\\\n name=\"$1\"; shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n printf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > \"/nav-build-metadata/portal-testdeps/$name.exit\"\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n NAV_CAPTURE_NAME=\"$name\" python3 - <<\\\\\\'CAPTURE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport os,base64\\\\nn=os.environ[\\\\\\'NAV_CAPTURE_NAME\\\\\\'];b=Path(\\\\\\'/nav-build-metadata/tests/\\\\\\'+n+\\\\\\'.log\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_PORTAL_\\\\\\'+n.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nprint(\\\\\\'NAV_PORTAL_TEST_EXIT\\\\\\',n,Path(\\\\\\'/nav-build-metadata/portal-testdeps/\\\\\\'+n+\\\\\\'.exit\\\\\\').read_text().strip(),flush=True)\\\\nCAPTURE\\\\n}\\\\nmeson_suite() {\\\\n name=\"$1\"; who=\"$2\"\\\\n chown -R tester .\\\\n run_suite \"$name\" su \"$who\" -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin; dbus-run-session -- meson test -C build --num-processes 2 --print-errorlogs\\\\\\'\\\\n mkdir -p \"/nav-build-metadata/portal-testdeps/$name\"\\\\n cp build/meson-logs/testlog.* \"/nav-build-metadata/portal-testdeps/$name/\"\\\\n python3 - \"$name\" <<\\\\\\'MESON_EVIDENCE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,sys,base64\\\\nn=sys.argv[1];b=Path(\\\\\\'build/meson-logs/testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_PORTAL_FULL_\\\\\\'+n.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(l)for l in Path(\\\\\\'build/meson-logs/testlog.json\\\\\\').read_text().splitlines()if l.strip()]\\\\nprint(\\\\\\'NAV_PORTAL_MESON_RESULTS\\\\\\',n,[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nMESON_EVIDENCE\\\\n}\\\\nrun_suite capsh-root sh -c \\\\\\'command -v capsh; capsh --print\\\\\\'\\\\nrun_suite capsh-user su tester -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin; command -v capsh; capsh --print\\\\\\'\\\\n# Real policy libraries first. Shadow is the supported framework on the current\\\\n# no-PAM bootstrap root, not the final NAV face/PAM integration.\\\\ntar -xf duktape-2.7.0.tar.xz\\\\ncd duktape-2.7.0\\\\nsed -i \\\\\\'s/-Os/-O2/\\\\\\' Makefile.sharedlibrary\\\\nmake -f Makefile.sharedlibrary INSTALL_PREFIX=/usr -j2\\\\nmake -f Makefile.sharedlibrary INSTALL_PREFIX=/usr install\\\\nldconfig\\\\nmake -f Makefile.sharedlibrary INSTALL_PREFIX=/usr duk\\\\nrun_suite duktape-smoke ./duk -e \\\\\\'if (JSON.parse(\"{\\\\\\\\\"value\\\\\\\\\":42}\").value !== 42) throw new Error(\"bad JSON\"); print(\"upstream CLI smoke only, not regression suite\")\\\\\\'\\\\nprintf \\\\\\'Release tarball has no upstream regression suite. Original duk CLI smoke only; Polkit tests separate. Not full-tested Duktape.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/duktape-scope.txt\\\\ncd /sources\\\\ntar -xf polkit-127.tar.gz\\\\ncd polkit-127\\\\ngetent group polkitd || groupadd -g 27 polkitd\\\\nid polkitd || useradd -c \\\\\\'PolicyKit Daemon Owner\\\\\\' -d /etc/polkit-1 -u 27 -g polkitd -s /bin/false polkitd\\\\nmeson setup build --prefix=/usr --sysconfdir=/etc --buildtype=release --wrap-mode=nofallback -Dman=false -Dsession_tracking=logind -Dtests=true -Dauthfw=shadow -Dos_type=lfs\\\\nninja -C build -j2\\\\nmeson_suite polkit tester\\\\nninja -C build install\\\\nldconfig\\\\nprintf \\\\\\'Polkit shadow backend matches current no-PAM root per BLFS. Final face/PAM + Shadow + systemd reconfiguration remains mandatory, not accepted here. Original Polkit tests remain enabled; any namespace skips are OPEN mandatory VM gates.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/polkit-scope.txt\\\\ncd /sources\\\\ntar -xf upower-v1.91.3.tar.bz2\\\\ncd upower-v1.91.3\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dgtk-doc=false -Dman=false -Dpolkit=enabled\\\\nninja -C build -j2\\\\nmeson_suite upower-polkit tester\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf nettle-4.0.tar.gz\\\\ncd nettle-4.0\\\\n./configure --prefix=/usr --disable-static\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suite nettle su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nmake install\\\\nchmod 755 /usr/lib/libhogweed.so /usr/lib/libnettle.so\\\\nldconfig\\\\ncd /sources\\\\ntar -xf gnutls-3.8.13.tar.xz\\\\ncd gnutls-3.8.13\\\\n./configure --prefix=/usr --docdir=/usr/share/doc/gnutls-3.8.13 --with-default-trust-store-pkcs11=\\\\\\'pkcs11:\\\\\\'\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suite gnutls su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nmkdir -p /nav-build-metadata/portal-testdeps/gnutls-original-results\\\\nfind . -name test-suite.log -exec cp --parents \\\\\\'{}\\\\\\' /nav-build-metadata/portal-testdeps/gnutls-original-results/ \\\\\\';\\\\\\'\\\\nmake install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf gsettings-desktop-schemas-50.1.tar.xz\\\\ncd gsettings-desktop-schemas-50.1\\\\nsed -i -r \\\\\\'s:\"(/system):\"/org/gnome\\\\\\\\1:g\\\\\\' schemas/*.in\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback\\\\nninja -C build -j2\\\\nninja -C build install\\\\nprintf \\\\\\'GSettings schemas upstream ships no test suite; schemas build/install only, not regression pass.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/gsettings-scope.txt\\\\ncd /sources\\\\ntar -xf glib-networking-2.80.1.tar.xz\\\\ncd glib-networking-2.80.1\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dlibproxy=disabled\\\\nninja -C build -j2\\\\nmeson_suite glib-networking tester\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf nghttp2-1.70.0.tar.xz\\\\ncd nghttp2-1.70.0\\\\n./configure --prefix=/usr --disable-static --enable-lib-only --docdir=/usr/share/doc/nghttp2-1.70.0\\\\nmake -j2\\\\nchown -R tester .\\\\nrun_suite nghttp2 su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nfind . -name test-suite.log -exec cp --parents \\\\\\'{}\\\\\\' /nav-build-metadata/portal-testdeps/ \\\\\\';\\\\\\'\\\\nmake install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf libsoup-3.6.6.tar.xz\\\\ncd libsoup-3.6.6\\\\npatch -Np1 -i ../libsoup-3.6.6-upstream_fixes-1.patch\\\\nsed \\\\\\'s/apiversion/soup_version/\\\\\\' -i docs/reference/meson.build\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true -Dpkcs11_tests=enabled\\\\nninja -C build -j2\\\\nmeson_suite libsoup tester\\\\ncp build/meson-info/intro-buildoptions.json /nav-build-metadata/portal-testdeps/libsoup/\\\\ncp build/meson-logs/meson-log.txt /nav-build-metadata/portal-testdeps/libsoup/\\\\nprintf \\\\\\'Configured tests enabled, GnuTLS PKCS11 enabled. Optional Apache/Kerberos/Samba/Brotli/Autobahn-dependent unconfigured coverage remains OPEN, not a full upstream suite claim. Source Meson options/log retained.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/libsoup-scope.txt\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf geoclue-2.8.2.tar.bz2\\\\ncd geoclue-2.8.2\\\\nmeson setup build --prefix=/usr --sysconfdir=/etc --buildtype=release --wrap-mode=nofallback -Dgtk-doc=false -Dnmea-source=false -D3g-source=false -Dcdma-source=false -Dmodem-gps-source=false -Ddemo-agent=false\\\\nninja -C build -j2\\\\nninja -C build install\\\\nldconfig\\\\nprintf \\\\\\'GeoClue full service+client library built, no upstream test suite exists per BLFS. Optional ModemManager/Avahi/libnotify integration absent. No location API key copied and no real location query executed; no runtime location-service claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/geoclue-scope.txt\\\\ncd /sources\\\\ntar -xf xdg-desktop-portal-1.22.1.tar.xz\\\\ntar -xf gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab.tar.gz\\\\ntar -xf libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff.tar.gz\\\\ndiff -qr gvdb-c6f2359cc1d00f16e0a0e2527fa0bc1882b8b5ab xdg-desktop-portal-1.22.1/subprojects/gvdb\\\\ndiff -qr libglnx-ff64d52116ae74f0d25e24f089db28921ea171ff xdg-desktop-portal-1.22.1/subprojects/libglnx\\\\ncd xdg-desktop-portal-1.22.1\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=enabled -Ddocumentation=disabled -Dman-pages=disabled -Dgeoclue=enabled -Dsandboxed-image-validation=enabled -Dsandboxed-sound-validation=enabled\\\\nninja -C build -j2\\\\nmeson_suite portal-geoclue tester\\\\nprintf \\\\\\'DIAGNOSTIC no save. Real policy and GeoClue dependencies, original suites all enabled. Any failure or nested/unconfigured skip remains OPEN, no tested-portal/desktop/ISO acceptance.\\\\\\\\n\\\\\\' > /nav-build-metadata/portal-testdeps/authgeo-scope.txt\\\\n\\')\\nINNER_SCRIPT\\n# Load the ordinary host interfaces; capability absence is not a product pass.\\nsudo modprobe fuse\\nsudo modprobe cuse\\nls -l /dev/fuse /dev/cuse\\nsudo chmod a+rw /dev/fuse /dev/cuse\\ntest -c /dev/fuse\\ntest -c /dev/cuse\\n# No further host namespace-policy changes; runtime gate deferred to booted NAV VM.\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/portal-json.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.whl \"$LFS/sources/\"*.zip \"$LFS/sources/\"*.ttf \"$LFS/sources/\"*.tar.* \"$LFS/sources/portal-json.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\ntry:\n    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start > 315 * 60:\n            raise RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds': round(time.monotonic() - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n        time.sleep(20)\n    if proc.returncode:\n        raise RuntimeError('source-build failed with status ' + str(proc.returncode))\nfinally:\n    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK', 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON', 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE', 'NAV_PORTAL'])))))\nNAV_GUARD\n"
