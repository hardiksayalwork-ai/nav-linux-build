name: NAV giflib strict51of51 original TAP transitional checkpoint
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-git-open-v1
        fail-on-cache-miss: true
    - name: giflib 6.1.3 strict original51of51 TAP install transitional
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1]\
        \ for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count()\
        \ >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\n\
        p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -f \"\
        $LFS/nav-build-metadata/git/GIT-TRANSITIONAL-OPEN.json\"\\npython3 - <<\\'DOWNLOADS\\'\\nfrom pathlib import Path\\\
        nimport urllib.request,hashlib,json\\nlock=json.loads(\"[{\\\\\"filename\\\\\": \\\\\"giflib-6.1.3.tar.gz\\\\\", \\\
        \\\"url\\\\\": \\\\\"https://sourceforge.net/projects/giflib/files/giflib-6.1.3.tar.gz\\\\\", \\\\\"sha256\\\\\":\
        \ \\\\\"b65b66b99f0424b93525f987386f22fc5efb9da2bfc92ad4a532249aaffbab0e\\\\\", \\\\\"md5\\\\\": \\\\\"a70e90ff780e9ebee9cb84b82bbd46a7\\\
        \\\"}]\")\\nfor x in lock:\\n p=Path(\\'/mnt/nav-lfs/sources\\')/x[\\'filename\\']\\n with urllib.request.urlopen(x[\\\
        'url\\'],timeout=120)as r,p.open(\\'wb\\')as f:\\n  while q:=r.read(1024*1024):f.write(q)\\n assert hashlib.file_digest(p.open(\\\
        'rb\\'),\\'sha256\\').hexdigest()==x[\\'sha256\\']\\n print(\\'SOURCE_SHA256_OK\\',x[\\'filename\\'],flush=True)\\\
        nPath(\\'/mnt/nav-lfs/nav-build-metadata/giflib\\').mkdir(exist_ok=True)\\nPath(\\'/mnt/nav-lfs/nav-build-metadata/giflib/source-lock.json\\\
        ').write_text(json.dumps(lock,indent=2))\\nDOWNLOADS\\npython3 - <<\\'INNER\\'\\nfrom pathlib import Path\\nPath(\\\
        '/mnt/nav-lfs/sources/gif-stage.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport\
        \ MAKEFLAGS=-j2 PATH=/usr/bin:/usr/sbin:/bin:/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\
        \\nmkdir -p /nav-build-metadata/giflib\\\\ncd /sources\\\\ntar -xf giflib-6.1.3.tar.gz\\\\ncd giflib-6.1.3\\\\n{ gcc\
        \ --version; ulimit -a; } > /nav-build-metadata/giflib/preflight.log 2>&1\\\\nset +e\\\\nmake -j2 > /nav-build-metadata/giflib/build.log\
        \ 2>&1\\\\nrc=$?\\\\nset -e\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/giflib/build.exit\\\
        \\ntail -70 /nav-build-metadata/giflib/build.log\\\\ntest \"$rc\" = 0\\\\nchown -R tester .\\\\nset +e\\\\nsu tester\
        \ -c \\\\\\'cd /sources/giflib-6.1.3; make -j2 check\\\\\\' > /nav-build-metadata/giflib/tests.log 2>&1\\\\nrc=$?\\\
        \\nset -e\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/giflib/tests.exit\\\\ncat /nav-build-metadata/giflib/tests.log\\\
        \\nset +e\\\\nsu tester -c \\\\\\'cd /sources/giflib-6.1.3; make -C tests -j2 tap\\\\\\' > /nav-build-metadata/giflib/original-tap.log\
        \ 2>&1\\\\ntrc=$?\\\\nset -e\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$trc\" > /nav-build-metadata/giflib/original-tap.exit\\\
        \\ncat /nav-build-metadata/giflib/original-tap.log\\\\ntest \"$rc\" = 0\\\\ntest \"$trc\" = 0\\\\npython3 - <<\\\\\
        \\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport re,json,hashlib\\\\np=Path(\\\\\\'/nav-build-metadata/giflib\\\
        \\\\');t=(p/\\\\\\'original-tap.log\\\\\\').read_text();ch=(p/\\\\\\'tests.log\\\\\\').read_text()\\\\nassert all((p/(n+\\\
        \\\\'.exit\\\\\\')).read_text().strip()==\\\\\\'0\\\\\\' for n in [\\\\\\'build\\\\\\',\\\\\\'tests\\\\\\',\\\\\\\
        'original-tap\\\\\\'])\\\\nassert re.findall(r\\\\\\'(?m)^1\\\\\\\\.\\\\\\\\.(\\\\\\\\d+)$\\\\\\',t)==[\\\\\\'51\\\
        \\\\']\\\\nassert len(re.findall(r\\\\\\'(?m)^ok - \\\\\\',t))==51\\\\nassert not re.search(r\\\\\\'(?im)^not ok|#\
        \ skip|segmentation fault|Bail out|core dumped\\\\\\',t+ch)\\\\nassert \\\\\\'51 tests, 0 failures.\\\\\\' in ch\\\
        \\nassert re.search(r\\\\\\'virtual memory.*4194304\\\\\\',(p/\\\\\\'preflight.log\\\\\\').read_text())\\\\na={\\\\\
        \\'classification\\\\\\':\\\\\\'TRANSITIONAL. All inherited Git/Highway/Rust/image/VM/Valgrind gaps remain OPEN. Not\
        \ OS acceptance.\\\\\\',\\\\\\'original_TAP_pass\\\\\\':51,\\\\\\'original_TAP_plan\\\\\\':51,\\\\\\'fail\\\\\\':0,\\\
        \\\\'skip\\\\\\':0,\\\\\\'jobs\\\\\\':2,\\\\\\'cap_KiB\\\\\\':4194304,\\\\\\'source_patches\\\\\\':[],\\\\\\'inherited_audit\\\
        \\\\':\\\\\\'/nav-build-metadata/git/GIT-TRANSITIONAL-OPEN.json\\\\\\',\\\\\\'diagnostic_run\\\\\\':\\\\\\'44222193853\\\
        \\\\',\\\\\\'logs_sha256\\\\\\':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()for f in p.glob(\\\\\\'*\\\\\\')if\
        \ f.is_file()}}\\\\n(p/\\\\\\'GIFLIB-TRANSITIONAL-OPEN.json\\\\\\').write_text(json.dumps(a,indent=2));print(\\\\\\\
        'NAV_GIFLIB_STRICT_51_51_GATE_OK\\\\\\')\\\\nAUDIT\\\\nmake PREFIX=/usr DOCDIR=/usr/share/doc/giflib-6.1.3 install\
        \ > /nav-build-metadata/giflib/install.log 2>&1\\\\nrm -fv /usr/lib/libgif.a\\\\nldconfig\\\\nldd /usr/lib/libgif.so\
        \ | tee /nav-build-metadata/giflib/installed-linkage.log\\\\n! grep -q \\\\\\'not found\\\\\\' /nav-build-metadata/giflib/installed-linkage.log\\\
        \\ntest -f /usr/include/gif_lib.h\\\\nls -l /usr/lib/libgif.so* > /nav-build-metadata/giflib/installed-version.log\\\
        \\nprintf \\\\\\'NAV_GIFLIB_51_51_INSTALLED_TRANSITIONAL\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf giflib-6.1.3\\\
        \\n\\')\\nINNER\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"\
        $LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind\
        \ \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts\
        \ -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\
        \\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath\
        \ /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"\
        $LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set\
        \ -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\
        \\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2\
        \ LC_ALL=POSIX /bin/bash --noprofile --norc /sources/gif-stage.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env\
        \ -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test\
        \ \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\
        \\'\\nNAV_MOUNT_BUILD\\nsudo rm -f \"$LFS/sources/gif-stage.sh\" \"$LFS/sources/\"*.tar.*\\nsudo chown -hR \"$(id\
        \ -u):$(id -g)\" \"$LFS\"\\nsudo chown root:root \"$LFS/usr/bin/fusermount3\"\\nsudo chmod 4755 \"$LFS/usr/bin/fusermount3\"\
        \\ntest \"$(du -sb \"$LFS\" | cut -f1)\" -lt 5368709120\\nprintf \\'NAV_GIFLIB_TRANSITIONAL_INSTALL_COMPLETE\\\\n\\\
        '\\n\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash',\
        \ str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True, preexec_fn=lambda : os.sched_setaffinity(0,\
        \ sorted(os.sched_getaffinity(0))[:2]))\ntry:\n    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n\
        \        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start\
        \ > 315 * 60:\n            raise RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds':\
        \ round(time.monotonic() - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n   \
        \     time.sleep(20)\n    if proc.returncode:\n        raise RuntimeError('source-build failed with status ' + str(proc.returncode))\n\
        finally:\n    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n\
        \        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n\
        \    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n\
        \    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK',\
        \ 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON',\
        \ 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE',\
        \ 'NAV_PORTAL'])))))\n    import base64\n    for f in sorted(pathlib.Path('/mnt/nav-lfs/nav-build-metadata/giflib').glob('*')):\n\
        \        if f.is_file():\n            data = f.read_bytes()\n            for i in range(0, len(data), 3000):\n   \
        \             print('NAV_GIFLIB_' + f.name.replace('.', '_').upper() + '_B64', base64.b64encode(data[i:i + 3000]).decode(),\
        \ flush=True)\nNAV_GUARD\n"
    - name: Fail closed on free-cache worst-case capacity before save
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python3 - <<''BUDGET''

        import urllib.request,json,os,subprocess

        root=int(subprocess.check_output([''du'',''-sb'',''/mnt/nav-lfs'']).split()[0])

        assert root<5120*1024**2,root

        request=urllib.request.Request(''https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/actions/caches?per_page=100'',headers={''Authorization'':''Bearer
        ''+os.environ[''GITHUB_TOKEN''],''Accept'':''application/vnd.github+json'',''X-GitHub-Api-Version'':''2022-11-28''})

        with urllib.request.urlopen(request,timeout=60)as r:data=json.load(r)

        assert data[''total_count'']==len(data[''actions_caches'']) and data[''total_count'']<=100

        keys={x[''key'']for x in data[''actions_caches'']}

        assert ''nav-blfs13.1-x86_64-highway-open-v1'' not in keys

        assert ''nav-blfs13.1-x86_64-cms-open-v1'' not in keys

        assert ''nav-blfs13.1-x86_64-rust-open-v1'' not in keys

        assert ''nav-blfs13.1-x86_64-git-open-v1'' in keys

        assert ''nav-blfs13.1-x86_64-giflib-open-v1'' not in keys

        required=[''final-gcc'',''gcc-test-runtime'',''gcc-test-cxx'',''gcc-test-c'',''access-tools'',''final-math'']

        assert all(''nav-lfs13.1-x86_64-''+x+''-v1'' in keys for x in required)

        total=sum(x[''size_in_bytes'']for x in data[''actions_caches''])

        worst=5184*1024**2

        print(''NAV_CACHE_BUDGET'',{''existing'':total,''root_apparent_bytes'':root,''new_cache_maximum'':worst,''worst_total'':total+worst,''limit'':10*1024**3},flush=True)

        assert total+worst<10*1024**3

        BUDGET

        '
    - name: Preserve transitional checkpoint with all gaps OPEN
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-giflib-open-v1
