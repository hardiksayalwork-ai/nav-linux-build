 C. Sharedmime17 configured tests. Pixbuf23 configured executables;18original disabled-fixture skips plus6OPEN XPM gaps, never pass. Mandatory XPM closure after source Rust1.97.1 LittleCMS Glycin2.1.5 and pixbuf rebuild, verified in booted VM. Bubblewrap built NOT runtime verified; mandatory functional acceptance in booted NAV VM before ISO delivery. Valgrind runtime built for seccomp only; own4unwaived failures remain. Documentsportal/CoreAddons/full desktop/ISO unfinished.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\n\\')\\nINNER_SCRIPT\\n# Load the ordinary host interfaces; capability absence is not a product pass.\\nsudo modprobe fuse\\nsudo modprobe cuse\\nls -l /dev/fuse /dev/cuse\\nsudo chmod a+rw /dev/fuse /dev/cuse\\ntest -c /dev/fuse\\ntest -c /dev/cuse\\n# No further host namespace-policy changes; runtime gate deferred to booted NAV VM.\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/portal-json.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.whl \"$LFS/sources/\"*.zip \"$LFS/sources/\"*.ttf \"$LFS/sources/\"*.tar.* \"$LFS/sources/portal-json.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\ntry:\n    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start > 315 * 60:\n            raise RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds': round(time.monotonic() - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n        time.sleep(20)\n    if proc.returncode:\n        raise RuntimeError('source-build failed with status ' + str(proc.returncode))\nfinally:\n    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK', 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON', 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE'])))))\nNAV_GUARD\n"
    - name: Fail closed on free-cache worst-case capacity before save
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python3 - <<''BUDGET''

        import urllib.request,json,os,subprocess

        root=int(subprocess.check_output([''du'',''-sb'',''/mnt/nav-lfs'']).split()[0])

        assert root<4800*1024**2,root

        request=urllib.request.Request(''https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/actions/caches?per_page=100'',headers={''Authorization'':''Bearer ''+os.environ[''GITHUB_TOKEN''],''Accept'':''application/vnd.github+json'',''X-GitHub-Api-Version'':''2022-11-28''})

        with urllib.request.urlopen(request,timeout=60)as r:data=json.load(r)

        assert data[''total_count'']==len(data[''actions_caches'']) and data[''total_count'']<=100

        keys={x[''key'']for x in data[''actions_caches'']}

        assert ''nav-blfs13.1-x86_64-portal-gstreamer-v1'' in keys

        assert ''nav-blfs13.1-x86_64-portal-images-v1'' not in keys

        required=[''final-gcc'',''gcc-test-runtime'',''gcc-test-cxx'',''gcc-test-c'',''access-tools'',''final-math'']

        assert all(''nav-lfs13.1-x86_64-''+x+''-v1'' in keys for x in required)

        total=sum(x[''size_in_bytes'']for x in data[''actions_caches''])

        worst=4864*1024**2

        print(''NAV_CACHE_BUDGET'',{''existing'':total,''root_apparent_bytes'':root,''new_cache_maximum'':worst,''worst_total'':total+worst,''limit'':10*1024**3},flush=True)

        assert total+worst<10*1024**3

        BUDGET

        '
    - name: Preserve audited GStreamer portal prerequisites
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-images-v1
