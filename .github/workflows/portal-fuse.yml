name: NAV transitional image prerequisite checkpoint with open VM gates
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-gstreamer-v1
        fail-on-cache-miss: true
    - name: Build real FUSE with native root and user test evidence
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"fuse-3.18.2.tar.gz\", \"url\": \"https://github.com/libfuse/libfuse/releases/download/fuse-3.18.2/fuse-3.18.2.tar.gz\", \"bytes\": 4933779, \"sha256\": \"f01de85717e20adf5f98aff324acd85dd73d61a5ca3834d573dcf0bd6e54a298\"}, {\"filename\": \"pytest-9.2.0-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/51/39/1f5d8c8877a0fa327db959c19341d4be61660de1ab6b7391f9eb805bcd67/pytest-9.2.0-py3-none-any.whl\", \"bytes\": 411776, \"sha256\": \"07acdcf88ec174f907dc01af70bf52d49b014bbab03faeeade31c96b18c2e588\"}, {\"filename\": \"iniconfig-2.3.1-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/56/43/4ca9e49d27a1fcf6bece6f6aec0ea46bb9112489b93d4b688fb415457bdb/iniconfig-2.3.1-py3-none-any.whl\", \"bytes\": 7552, \"sha256\": \"9121e2c1fdb355232495be3194c8dfe87ccc2d5dee45947b78e68f499790d7a7\"}, {\"filename\": \"packaging-26.3-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl\", \"bytes\": 129956, \"sha256\": \"d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c\"}, {\"filename\": \"pluggy-1.7.0-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/40/9e/2b38731e0fc536806f16490e1a12d7f0dc2a1235aa8cc07bcc75416a7daa/pluggy-1.7.0-py3-none-any.whl\", \"bytes\": 27082, \"sha256\": \"7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec\"}, {\"filename\": \"pygments-2.21.0-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/71/46/17f022dd3e953bf20a04a028a21ec746d942f8d2af30fa0f124fa0e6a684/pygments-2.21.0-py3-none-any.whl\", \"bytes\": 1250147, \"sha256\": \"2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9\"}, {\"filename\": \"py-1.11.0-py2.py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/f6/f0/10642828a8dfb741e5f3fbaac830550a518a775c7fff6f04a007259b0548/py-1.11.0-py2.py3-none-any.whl\", \"bytes\": 98708, \"sha256\": \"607c53218732647dff4acdfcd50cb62615cedf612e72d1724fb1a0cc6405b378\"}, {\"filename\": \"looseversion-1.3.0-py2.py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/4e/74/d5405b9b3b12e9176dff223576d7090bc161092878f533fd0dc23dd6ae1d/looseversion-1.3.0-py2.py3-none-any.whl\", \"bytes\": 8237, \"sha256\": \"781ef477b45946fc03dd4c84ea87734b21137ecda0e1e122bcb3c8d16d2a56e0\"}, {\"filename\": \"which-2.25.tar.gz\", \"url\": \"https://ftp.gnu.org/gnu/which/which-2.25.tar.gz\", \"bytes\": 203191, \"sha256\": \"1cb83e4f702e60b8211ab5ec4c2afbab1b1dec80209456a7d2faf7584ed225ea\"}, {\"filename\": \"libseccomp-2.6.1.tar.gz\", \"url\": \"https://github.com/seccomp/libseccomp/releases/download/v2.6.1/libseccomp-2.6.1.tar.gz\", \"bytes\": 656231, \"sha256\": \"501f66c667225d53791b97e1d7cf85ab764c297d04881f60f38f451c4b0ee1be\"}, {\"filename\": \"bubblewrap-0.11.2.tar.xz\", \"url\": \"https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz\", \"bytes\": 116336, \"sha256\": \"69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6\"}, {\"filename\": \"cython-3.2.9-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/00/ec/e61deec9bcfbb0e1b36f8b5ba75cb44644419b4bfd0fdd666bffd21d9579/cython-3.2.9-py3-none-any.whl\", \"bytes\": 1259272, \"sha256\": \"a2b0e87f6b80790c929308ca0831d686f7a180feab684fe8cd4a4380bd96aaca\"}, {\"filename\": \"valgrind-3.27.1.tar.bz2\", \"url\": \"https://sourceware.org/pub/valgrind/valgrind-3.27.1.tar.bz2\", \"bytes\": 17372682, \"sha256\": \"5d589152eb8071c02feab8ce6ab719e431a1fbc3e2b1700f5432632a8b9264dc\"}, {\"filename\": \"shared-mime-info-2.5.1.tar.gz\", \"url\": \"https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/2.5.1/shared-mime-info-2.5.1.tar.gz\", \"bytes\": 8873027, \"sha256\": \"ea248ea157b7fa0165f4fe282c84919fa84c3f175553642f229c8f1ab7539128\"}, {\"filename\": \"gdk-pixbuf-2.44.7.tar.xz\", \"url\": \"https://download.gnome.org/sources/gdk-pixbuf/2.44/gdk-pixbuf-2.44.7.tar.xz\", \"bytes\": 6037644, \"sha256\": \"172f80e3626ec31520a970400f1a3694e04718f6c2cd2885f75250fb5a6995a4\"}, {\"filename\": \"xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f.tar.gz\", \"url\": \"https://gitlab.freedesktop.org/xdg/xdgmime/-/archive/a3d6162494270676fdfeb923cb0900517c4bd72f/xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f.tar.gz\", \"bytes\": 55601, \"sha256\": \"6686d8ac9d47a48cbd22d35fb175f7d483df67078a477006a925806ad9aa07f5\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/usr/bin:/usr/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE TEST_WITH_VALGRIND\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/fuse /nav-build-metadata/tests\\\\ncd /sources\\\\npython3 -m pip install --no-index --no-deps --no-build-isolation ./*.whl\\\\npython3 -c \\\\\\'import pytest,packaging,py,looseversion; print(\"NAV_FUSE_PYTHON_DEPS_OK\",pytest.__version__)\\\\\\'\\\\ntar -xf which-2.25.tar.gz\\\\n(cd which-2.25; ./configure --prefix=/usr; make -j2; make install)\\\\ntest \"$(which sh)\" = /usr/bin/sh\\\\nprintf \\\\\\'GNU Which 2.25 upstream has no test suite; path lookup smoke only.\\\\\\\\n\\\\\\' > /nav-build-metadata/fuse/which-test-scope.txt\\\\ntar -xf fuse-3.18.2.tar.gz\\\\ncd fuse-3.18.2\\\\nsed -i \\\\\\'/^udev/,$ s/^/#/\\\\\\' util/meson.build\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true\\\\nninja -C build -j2\\\\nninja -C build install\\\\nchmod u+s /usr/bin/fusermount3 build/util/fusermount3\\\\nldconfig\\\\nchown -R tester build/test build/example\\\\n# Original suite\\\\\\'s root and non-root conditions are preserved and compared.\\\\nfor who in root tester; do\\\\n chown -R tester build/.pytest_cache 2>/dev/null || true\\\\n set +e\\\\n if [ \"$who\" = root ]; then\\\\n  (cd build; python3 -m pytest --junitxml=/nav-build-metadata/fuse/root.xml) > /nav-build-metadata/tests/fuse-root.log 2>&1\\\\n else\\\\n  su tester -c \\\\\\'cd /sources/fuse-3.18.2/build; python3 -m pytest --junitxml=/tmp/fuse-tester.xml\\\\\\' > /nav-build-metadata/tests/fuse-tester.log 2>&1\\\\n  user_rc=$?\\\\n  cp /tmp/fuse-tester.xml /nav-build-metadata/fuse/tester.xml\\\\n fi\\\\n rc=$?\\\\n if [ \"$who\" = tester ]; then rc=\"$user_rc\"; fi\\\\n set -e\\\\n cat /nav-build-metadata/tests/fuse-$who.log\\\\n NAV_FUSE_WHO=\"$who\" NAV_FUSE_RC=\"$rc\" python3 - <<\\\\\\'FUSE_LOG\\\\\\'\\\\nfrom pathlib import Path\\\\nimport os,base64,xml.etree.ElementTree as ET\\\\nwho=os.environ[\\\\\\'NAV_FUSE_WHO\\\\\\'];p=Path(\\\\\\'/nav-build-metadata/tests/fuse-\\\\\\'+who+\\\\\\'.log\\\\\\');b=p.read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_FUSE_\\\\\\'+who.upper()+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\np=Path(\\\\\\'/nav-build-metadata/fuse\\\\\\')/(who+\\\\\\'.xml\\\\\\')\\\\nif p.exists():\\\\n r=ET.parse(p).getroot();cs=r.findall(\\\\\\'.//testcase\\\\\\');print(\\\\\\'NAV_FUSE_CASES\\\\\\',who,len(cs),\\\\\\'failed\\\\\\',sum(c.find(\\\\\\'failure\\\\\\')is not None or c.find(\\\\\\'error\\\\\\')is not None for c in cs),\\\\\\'skipped\\\\\\',[(c.get(\\\\\\'name\\\\\\'),c.find(\\\\\\'skipped\\\\\\').get(\\\\\\'message\\\\\\'))for c in cs if c.find(\\\\\\'skipped\\\\\\')is not None],flush=True)\\\\nprint(\\\\\\'NAV_FUSE_EXIT\\\\\\',who,os.environ[\\\\\\'NAV_FUSE_RC\\\\\\'],flush=True)\\\\nFUSE_LOG\\\\ndone\\\\n\\\\npython3 - <<\\\\\\'FUSE_AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport xml.etree.ElementTree as ET,json,shutil\\\\np=Path(\\\\\\'/nav-build-metadata/fuse\\\\\\');runs={w:{c.get(\\\\\\'name\\\\\\'):c for c in ET.parse(p/(w+\\\\\\'.xml\\\\\\')).getroot().findall(\\\\\\'.//testcase\\\\\\')}for w in [\\\\\\'root\\\\\\',\\\\\\'tester\\\\\\']}\\\\nassert set(runs[\\\\\\'root\\\\\\'])==set(runs[\\\\\\'tester\\\\\\']) and len(runs[\\\\\\'root\\\\\\'])==67\\\\nuncovered=[]\\\\nfor name in runs[\\\\\\'root\\\\\\']:\\\\n cs=[runs[w][name]for w in runs]\\\\n assert all(c.find(\\\\\\'failure\\\\\\')is None and c.find(\\\\\\'error\\\\\\')is None for c in cs),name\\\\n if all(c.find(\\\\\\'skipped\\\\\\')is not None for c in cs):\\\\n  assert name.startswith(\\\\\\'test_passthrough[\\\\\\')and name.endswith(\\\\\\'-True]\\\\\\'),name\\\\n  assert all(c.find(\\\\\\'skipped\\\\\\').get(\\\\\\'message\\\\\\')==\\\\\\'example does not support writeback caching\\\\\\'for c in cs)\\\\n  uncovered.append(name)\\\\nassert len(uncovered)==8\\\\nshutil.copyfile(\\\\\\'test/test_examples.py\\\\\\',p/\\\\\\'upstream-test_examples.py\\\\\\')\\\\n(p/\\\\\\'combined-coverage.json\\\\\\').write_text(json.dumps({\\\\\\'unique_cases\\\\\\':67,\\\\\\'passed_in_at_least_one_privilege\\\\\\':59,\\\\\\'original_skips_preserved\\\\\\':uncovered,\\\\\\'classification\\\\\\':\\\\\\'intentional unsupported example-option combinations, never counted as passes\\\\\\',\\\\\\'root_and_user_original_xml_retained\\\\\\':True},indent=2))\\\\nprint(\\\\\\'NAV_FUSE_RECONCILED\\\\\\',59,\\\\\\'unique pass\\\\\\',8,\\\\\\'intentional original skips\\\\\\',flush=True)\\\\nFUSE_AUDIT\\\\ncd /sources\\\\n# Real instrumentation runtime for seccomp checks, not a Valgrind suite pass.\\\\ntar -xf valgrind-3.27.1.tar.bz2\\\\ncd valgrind-3.27.1\\\\nsed -i \\\\\\'s|/doc/valgrind||\\\\\\' docs/Makefile.in\\\\n./configure --prefix=/usr --datadir=/usr/share/doc/valgrind-3.27.1 --enable-only64bit\\\\nmake -j2\\\\nmake install\\\\nvalgrind --version\\\\nprintf \\\\\\'Native Valgrind built for libseccomp instrumentation. Its own regression suite NOT rerun here; four prior unwaived failures remain open.\\\\\\\\n\\\\\\' > /nav-build-metadata/tests/valgrind-scope.txt\\\\ncd /sources\\\\nrm -rf valgrind-3.27.1\\\\ntar -xf libseccomp-2.6.1.tar.gz\\\\ncd libseccomp-2.6.1\\\\nsed \\\\\\'s/env python/&3/\\\\\\' -i tests/regression\\\\n./configure --prefix=/usr --enable-python\\\\nmake -j2\\\\nchown -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'make -C tests -j2 check-build && cd tests && ./regression -a -j 2 && ./regression -T live -j 2\\\\\\' > /nav-build-metadata/tests/seccomp.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/seccomp.log\\\\npython3 - <<\\\\\\'SECCOMP_LOG\\\\\\'\\\\nfrom pathlib import Path\\\\nimport base64\\\\nb=Path(\\\\\\'/nav-build-metadata/tests/seccomp.log\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_FUSE_SECCOMP_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nSECCOMP_LOG\\\\ntest \"$rc\" = 0\\\\npython3 - <<\\\\\\'SECCOMP_AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport re,collections,json,shutil\\\\ns=Path(\\\\\\'/nav-build-metadata/tests/seccomp.log\\\\\\').read_text();mode=\\\\\\'\\\\\\';rs=[]\\\\nfor line in s.splitlines():\\\\n m=re.match(r\\\\\\' test mode:  (.*)\\\\\\',line)\\\\n if m:mode=m[1]\\\\n m=re.match(r\\\\\\'Test (\\\\\\\\S+) result:\\\\\\\\s+(SUCCESS|SKIPPED|FAILURE|ERROR)(.*)\\\\\\',line)\\\\n if m:rs.append((mode,*m.groups()))\\\\nassert rs and not any(r in [\\\\\\'FAILURE\\\\\\',\\\\\\'ERROR\\\\\\']for mo,n,r,d in rs)\\\\nreasons=collections.Counter(d.strip()for mo,n,r,d in rs if r==\\\\\\'SKIPPED\\\\\\');assert reasons=={\\\\\\'(architecture difference)\\\\\\':70,\\\\\\'(only valid in native/c mode)\\\\\\':42,\\\\\\'(must specify live tests)\\\\\\':22},reasons\\\\ncs={n for mo,n,r,d in rs if mo==\\\\\\'c\\\\\\' and r==\\\\\\'SUCCESS\\\\\\'}\\\\nassert all(n in cs for mo,n,r,d in rs if r==\\\\\\'SKIPPED\\\\\\' and \\\\\\'native/c\\\\\\' in d)\\\\nlive=s.rsplit(\\\\\\'Regression Test Summary\\\\\\',1)[-1]\\\\nassert \\\\\\'tests passed: 22\\\\\\' in live and \\\\\\'tests skipped: 0\\\\\\' in live\\\\np=Path(\\\\\\'/nav-build-metadata/libseccomp\\\\\\');p.mkdir(exist_ok=True)\\\\nshutil.copyfile(\\\\\\'tests/regression\\\\\\',p/\\\\\\'upstream-regression\\\\\\')\\\\nfor f in Path(\\\\\\'tests\\\\\\').glob(\\\\\\'*.tests\\\\\\'):shutil.copyfile(f,p/f.name)\\\\n(p/\\\\\\'cross-coverage.json\\\\\\').write_text(json.dumps({\\\\\\'success_results\\\\\\':sum(r==\\\\\\'SUCCESS\\\\\\'for mo,n,r,d in rs),\\\\\\'original_skip_reasons\\\\\\':dict(reasons),\\\\\\'python_native_only_ids\\\\\\':[n for mo,n,r,d in rs if r==\\\\\\'SKIPPED\\\\\\'and \\\\\\'native/c\\\\\\'in d],\\\\\\'native_only_matching_C_SUCCESS\\\\\\':42,\\\\\\'separate_live_success\\\\\\':22,\\\\\\'architecture_exclusions\\\\\\':\\\\\\'70 original out-of-target simulator selections, not pass\\\\\\',\\\\\\'original_live_skips\\\\\\':\\\\\\'22 covered separately, original records retained\\\\\\'},indent=2))\\\\nprint(\\\\\\'NAV_FUSE_SECCOMP_RECONCILED\\\\\\',sum(r==\\\\\\'SUCCESS\\\\\\'for mo,n,r,d in rs),dict(reasons),flush=True)\\\\nSECCOMP_AUDIT\\\\nmake install\\\\nldconfig\\\\npython3 -c \\\\\\'import seccomp; print(\"NAV_FUSE_SECCOMP_IMPORT_OK\")\\\\\\'\\\\ncd /sources\\\\ntar -xf bubblewrap-0.11.2.tar.xz\\\\ncd bubblewrap-0.11.2\\\\nsed \\\\\\'s@symlink usr/lib64@ro-bind-try /lib64@\\\\\\' -i tests/libtest.sh\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true\\\\nninja -C build -j2\\\\nchown -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'dbus-run-session -- meson test -C build --num-processes 2 --print-errorlogs\\\\\\' > /nav-build-metadata/tests/bubblewrap.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/bubblewrap.log\\\\npython3 - <<\\\\\\'BWRAP_LOG\\\\\\'\\\\nfrom pathlib import Path\\\\nimport base64,json\\\\np=Path(\\\\\\'/nav-build-metadata/bubblewrap\\\\\\');p.mkdir(exist_ok=True)\\\\nfor ext in [\\\\\\'txt\\\\\\',\\\\\\'json\\\\\\']:(p/(\\\\\\'testlog.\\\\\\'+ext)).write_bytes(Path(\\\\\\'build/meson-logs/testlog.\\\\\\'+ext).read_bytes())\\\\nb=(p/\\\\\\'testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_FUSE_BWRAP_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(x)for x in (p/\\\\\\'testlog.json\\\\\\').read_text().splitlines()if x.strip()];print(\\\\\\'NAV_FUSE_BWRAP_RESULTS\\\\\\',[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nBWRAP_LOG\\\\nprintf \\\\\\'NAV_FUSE_BWRAP_DIAGNOSTIC_EXIT %s\\\\\\\\n\\\\\\' \"$rc\"\\\\n\\\\nninja -C build install\\\\nprintf \\\\\\'Bubblewrap built, NOT runtime verified. CI denied unprivileged namespaces even after scoped profile. Three shell suites and six nested seccomp cases unexecuted. Mandatory booted NAV VM functional sandbox acceptance before ISO delivery.\\\\\\\\n\\\\\\' > /nav-build-metadata/bubblewrap/mandatory-vm-gate.txt\\\\ncd /sources\\\\ntar -xf shared-mime-info-2.5.1.tar.gz\\\\ntar -xf xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f.tar.gz\\\\nmv xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f shared-mime-info-2.5.1/subprojects/xdgmime\\\\nfor module in shared-mime-info-2.5.1 gdk-pixbuf-2.44.7; do\\\\n cd /sources\\\\n if [ \"$module\" = gdk-pixbuf-2.44.7 ]; then tar -xf \"$module.tar.xz\"; fi\\\\n cd \"$module\"\\\\n if [ \"$module\" = shared-mime-info-2.5.1 ]; then\\\\n  meson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dupdate-mimedb=true -Dbuild-tests=true -Dbuild-spec=false\\\\n else\\\\n  meson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true -Dpng=enabled -Djpeg=enabled -Dgif=enabled -Dtiff=enabled -Dothers=enabled -Dlegacy_xpm=enabled -Dglycin=disabled -Dman=false\\\\n fi\\\\n ninja -C build -j2\\\\n chown -R tester .\\\\n set +e\\\\n su tester -c \\\\\\'dbus-run-session -- meson test -C build --num-processes 2 --print-errorlogs\\\\\\' > \"/nav-build-metadata/tests/$module.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$module.log\"\\\\n NAV_IMAGE_MODULE=\"$module\" python3 - <<\\\\\\'IMAGE_LOG\\\\\\'\\\\nfrom pathlib import Path\\\\nimport base64,json,os,re\\\\nmodule=os.environ[\\\\\\'NAV_IMAGE_MODULE\\\\\\'];p=Path(\\\\\\'/nav-build-metadata\\\\\\')/module;p.mkdir(exist_ok=True)\\\\nfor ext in [\\\\\\'txt\\\\\\',\\\\\\'json\\\\\\']:(p/(\\\\\\'testlog.\\\\\\'+ext)).write_bytes(Path(\\\\\\'build/meson-logs/testlog.\\\\\\'+ext).read_bytes())\\\\nb=(p/\\\\\\'testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_FUSE_IMAGE_\\\\\\'+module.split(\\\\\\'-\\\\\\')[0].upper()+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(x)for x in (p/\\\\\\'testlog.json\\\\\\').read_text().splitlines()if x.strip()];print(\\\\\\'NAV_FUSE_IMAGE_RESULTS\\\\\\',module,[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nassert r and all(x[\\\\\\'result\\\\\\']==\\\\\\'OK\\\\\\'for x in r)\\\\nskips=[]\\\\nfor x in r:\\\\n for k in [\\\\\\'stdout\\\\\\',\\\\\\'stderr\\\\\\']:\\\\n  t=x.get(k,\\\\\\'\\\\\\');assert not re.search(r\\\\\\'^not ok|#\\\\\\\\s*TODO|status: (SKIP|FAIL|ERROR)\\\\\\',t,re.M|re.I),(x[\\\