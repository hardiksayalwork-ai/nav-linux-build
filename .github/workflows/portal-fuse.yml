name: NAV color management image test prerequisites original suites
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-rust-open-v1
        fail-on-cache-miss: true
    - name: Build Little CMS GoogleTest Highway with full original configured suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1]\
        \ for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count()\
        \ >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\n\
        p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -f \"\
        $LFS/nav-build-metadata/rust/RUST-TRANSITIONAL-OPEN.json\"\\ntest -x \"$LFS/opt/rustc/bin/rustc\"\\npython3 - <<\\\
        'DOWNLOADS\\'\\nfrom pathlib import Path\\nimport urllib.request,hashlib,json\\nlock=json.loads(\"[{\\\\\"filename\\\
        \\\": \\\\\"lcms2-2.19.1.tar.gz\\\\\", \\\\\"url\\\\\": \\\\\"https://github.com/mm2/Little-CMS/releases/download/lcms2.19.1/lcms2-2.19.1.tar.gz\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"bfc54f7bab59fbc921012014a8032e4cba4abd46db47d46b76416a8c0b2815c8\\\\\", \\\\\"md5\\\
        \\\": \\\\\"541978f73749499e9e0277bfe5a3c868\\\\\"}, {\\\\\"filename\\\\\": \\\\\"highway-1.4.0.tar.gz\\\\\", \\\\\
        \"url\\\\\": \\\\\"https://github.com/google/highway/archive/1.4.0/highway-1.4.0.tar.gz\\\\\", \\\\\"sha256\\\\\"\
        : \\\\\"e72241ac9524bb653ae52ced768b508045d4438726a303f10181a38f764a453c\\\\\", \\\\\"md5\\\\\": \\\\\"9d335797777e17f827c7980b8313a34b\\\
        \\\"}, {\\\\\"filename\\\\\": \\\\\"googletest-1.18.0.tar.gz\\\\\", \\\\\"url\\\\\": \\\\\"https://github.com/google/googletest/archive/refs/tags/v1.18.0.tar.gz\\\
        \\\", \\\\\"sha256\\\\\": \\\\\"6e3191c1455468b3fc35a417fb565c1c5071aee1b7e7f85e30cf48a98d37d8b5\\\\\", \\\\\"md5\\\
        \\\": \\\\\"ae87634285dbe148a7abc6d19c4c05bd\\\\\"}]\")\\nfor x in lock:\\n p=Path(\\'/mnt/nav-lfs/sources\\')/x[\\\
        'filename\\']\\n with urllib.request.urlopen(x[\\'url\\'],timeout=120)as r,p.open(\\'wb\\')as f:\\n  while q:=r.read(1024*1024):f.write(q)\\\
        n assert hashlib.file_digest(p.open(\\'rb\\'),\\'sha256\\').hexdigest()==x[\\'sha256\\']\\n print(\\'SOURCE_SHA256_OK\\\
        ',x[\\'filename\\'],flush=True)\\nPath(\\'/mnt/nav-lfs/sources/image-cms-jxl-source-lock.json\\').write_text(json.dumps(lock,indent=2))\\\
        nDOWNLOADS\\npython3 - <<\\'INNER\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/cms-stage.sh\\').write_text(\\\
        'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin\
        \ LANG=C.UTF-8 CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir\
        \ -p /nav-build-metadata/cms /nav-build-metadata/tests\\\\ncd /sources\\\\nprintf \\\\\\'NAV_CMS_PREREQUISITES\\\\\
        \\\\n\\\\\\'\\\\npkg-config --modversion libjpeg libtiff-4 libpng libbrotlidec\\\\nrustc --version\\\\ncp /sources/image-cms-jxl-source-lock.json\
        \ /nav-build-metadata/cms/\\\\n# Real original GoogleTest suites supply test support, no external downloads.\\\\ntar\
        \ -xf googletest-1.18.0.tar.gz\\\\ncd googletest-1.18.0\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr\
        \ -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -Dgtest_build_tests=ON -Dgmock_build_tests=ON -DCMAKE_CXX_STANDARD=17\\\
        \\ncmake --build build --parallel 2\\\\nchown -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin;\
        \ cd /sources/googletest-1.18.0/build; ctest --output-on-failure -j2\\\\\\' > /nav-build-metadata/tests/googletest.log\
        \ 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/googletest.log\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\'\
        \ \"$rc\" > /nav-build-metadata/cms/googletest.exit\\\\ncp build/Testing/Temporary/LastTest.log /nav-build-metadata/cms/googletest-original.log\\\
        \\ncp build/CMakeCache.txt /nav-build-metadata/cms/googletest-config.txt\\\\ntest \"$rc\" = 0\\\\ncmake --install\
        \ build\\\\nldconfig\\\\ncd /sources\\\\nrm -rf googletest-1.18.0\\\\n# BLFS Little CMS with JPEG/TIFF tools and unmodified\
        \ testbed.\\\\ntar -xf lcms2-2.19.1.tar.gz\\\\ncd lcms2-2.19.1\\\\nmeson setup build --prefix=/usr --buildtype=release\
        \ -Dutils=true -Dtests=enabled -Djpeg=enabled -Dtiff=enabled\\\\nninja -C build -j2\\\\nchown -R tester .\\\\nset\
        \ +e\\\\nsu tester -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin; cd /sources/lcms2-2.19.1; meson test -C build\
        \ --print-errorlogs --no-rebuild --num-processes 2\\\\\\' > /nav-build-metadata/tests/lcms2.log 2>&1\\\\nrc=$?\\\\\
        nset -e\\\\ncat /nav-build-metadata/tests/lcms2.log\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/cms/lcms2.exit\\\
        \\ncp build/meson-logs/testlog.* /nav-build-metadata/cms/\\\\ncp build/meson-info/intro-tests.json /nav-build-metadata/cms/lcms2-tests.json\\\
        \\ntest \"$rc\" = 0\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\nrm -rf lcms2-2.19.1\\\\n# Highway\
        \ builds full upstream tests with installed real GoogleTest.\\\\ntar -xf highway-1.4.0.tar.gz\\\\ncd highway-1.4.0\\\
        \\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=ON\
        \ -DHWY_ENABLE_TESTS=ON -DHWY_SYSTEM_GTEST=ON -DCMAKE_CXX_STANDARD=17\\\\ncmake --build build --parallel 2\\\\nchown\
        \ -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin; cd /sources/highway-1.4.0/build;\
        \ ctest --output-on-failure -j2\\\\\\' > /nav-build-metadata/tests/highway.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/highway.log\\\
        \\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/cms/highway.exit\\\\ncp build/Testing/Temporary/LastTest.log\
        \ /nav-build-metadata/cms/highway-original.log\\\\ncp build/CMakeCache.txt /nav-build-metadata/cms/highway-config.txt\\\
        \\ntest \"$rc\" = 0\\\\ncmake --install build\\\\nldconfig\\\\ncd /sources\\\\nrm -rf highway-1.4.0\\\\npkg-config\
        \ --modversion lcms2 libhwy gtest\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,re\\\
        \\np=Path(\\\\\\'/nav-build-metadata\\\\\\');counts={}\\\\nfor n in [\\\\\\'googletest\\\\\\',\\\\\\'highway\\\\\\\
        ']:\\\\n t=(p/\\\\\\'tests\\\\\\'/f\\\\\\'{n}.log\\\\\\').read_text();assert (p/\\\\\\'cms\\\\\\'/f\\\\\\'{n}.exit\\\
        \\\\').read_text().strip()==\\\\\\'0\\\\\\'\\\\n m=re.search(r\\\\\\'(\\\\\\\\d+)% tests passed, (\\\\\\\\d+) tests\
        \ failed out of (\\\\\\\\d+)\\\\\\',t);assert m and m[1]==\\\\\\'100\\\\\\' and m[2]==\\\\\\'0\\\\\\' and int(m[3])>0\\\
        \\n assert not re.search(r\\\\\\'(?i)SIGSEGV|segmentation fault|Subprocess aborted|\\\\\\\\*\\\\\\\\*\\\\\\\\*Exception\\\
        \\\\',t)\\\\n counts[n]={\\\\\\'original_ctest_total\\\\\\':int(m[3]),\\\\\\'failed\\\\\\':0,\\\\\\'skip_lines\\\\\
        \\':[x for x in t.splitlines()if re.search(r\\\\\\'(?i)skip|not run|disabled\\\\\\',x)]}\\\\nrows=[json.loads(l)for\
        \ l in (p/\\\\\\'cms\\\\\\'/\\\\\\'testlog.json\\\\\\').read_text().splitlines()if l.strip()];assert rows and all(r[\\\
        \\\\'result\\\\\\']==\\\\\\'OK\\\\\\'for r in rows)\\\\ncounts[\\\\\\'lcms2\\\\\\']={\\\\\\'meson_total\\\\\\':len(rows),\\\
        \\\\'results\\\\\\':[{\\\\\\'name\\\\\\':r[\\\\\\'name\\\\\\'],\\\\\\'result\\\\\\':r[\\\\\\'result\\\\\\'],\\\\\\\
        'stdout\\\\\\':r[\\\\\\'stdout\\\\\\']}for r in rows]}\\\\nfor r in rows:assert not re.search(r\\\\\\'(?i)SIGSEGV|segmentation\
        \ fault\\\\\\',r[\\\\\\'stdout\\\\\\'])\\\\n(p/\\\\\\'cms\\\\\\'/\\\\\\'CMS-TESTS-OPEN.json\\\\\\').write_text(json.dumps({\\\
        \\\\'counts\\\\\\':counts,\\\\\\'classification\\\\\\':\\\\\\'Original configured suites passed, not full OS acceptance.\
        \ All inherited Rust/portal/image/VM/Valgrind gaps remain OPEN. Every skipped, disabled or unsupported case remains\
        \ OPEN.\\\\\\',\\\\\\'rust_inherited_audit\\\\\\':\\\\\\'/nav-build-metadata/rust/RUST-TRANSITIONAL-OPEN.json\\\\\\\
        ',\\\\\\'remaining\\\\\\':\\\\\\'JPEG XL,HEIF,SVG,Glycin/GTK image chain unfinished\\\\\\'},indent=2))\\\\nprint(\\\
        \\\\'NAV_CMS_AUDIT\\\\\\',json.dumps(counts),flush=True)\\\\nAUDIT\\\\nprintf \\\\\\'NAV_CMS_ORIGINAL_SUITES_COMPLETE\\\
        \\\\\\n\\\\\\'\\\\n\\')\\nINNER\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\\
        nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\\
        nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t\
        \ devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs\
        \ \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d\
        \ -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot\
        \ --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile\
        \ --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke;\
        \ printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin\
        \ MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/cms-stage.sh\\nchroot --userspec=101:101\
        \ \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\\
        'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\
        \\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n#\
        \ ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"\
        *.whl \"$LFS/sources/\"*.zip \"$LFS/sources/\"*.ttf \"$LFS/sources/\"*.tar.* \"$LFS/sources/cms-stage.sh\"\\nsudo\
        \ chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\nsudo\
        \ rm -f \"$LFS/sources/cms-stage.sh\" \"$LFS/sources/image-cms-jxl-source-lock.json\"\\n# Recursive packaging ownership\
        \ resets setuid. Restore upstream fusermount3 mode.\\nsudo chown root:root \"$LFS/usr/bin/fusermount3\"\\nsudo chmod\
        \ 4755 \"$LFS/usr/bin/fusermount3\"\\ntest \"$(du -sb \"$LFS\" | cut -f1)\" -lt 5368709120\\n')\nstart = time.monotonic()\n\
        log = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT,\
        \ start_new_session=True, preexec_fn=lambda : os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:2]))\ntry:\n\
        \    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n        available = mem()\n      \
        \  if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start > 315 * 60:\n            raise\
        \ RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds': round(time.monotonic()\
        \ - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n        time.sleep(20)\n  \
        \  if proc.returncode:\n        raise RuntimeError('source-build failed with status ' + str(proc.returncode))\nfinally:\n\
        \    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n\
        \        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n\
        \    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n\
        \    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK',\
        \ 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON',\
        \ 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE',\
        \ 'NAV_PORTAL'])))))\n    import base64\n    for name in ['googletest', 'lcms2', 'highway']:\n        f = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/tests/'\
        \ + name + '.log')\n        if f.exists():\n            data = f.read_bytes()\n            for i in range(0, len(data),\
        \ 3000):\n                print('NAV_CMS_' + name.upper() + '_B64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\n\
        \    f = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/cms/CMS-TESTS-OPEN.json')\n    if f.exists():\n        print('NAV_CMS_AUDIT_JSON_B64',\
        \ base64.b64encode(f.read_bytes()).decode(), flush=True)\nNAV_GUARD\n"
    - name: Fail closed on free-cache worst-case capacity before save
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python3 - <<''BUDGET''

        import urllib.request,json,os,subprocess

        root=int(subprocess.check_output([''du'',''-sb'',''/mnt/nav-lfs'']).split()[0])

        assert root<5120*1024**2,root

        request=urllib.request.Request(''https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/actions/caches?per_page=100'',headers={''Authorization'':''Bearer
        ''+os.environ[''GITHUB_TOKEN''],''Accept'':''application/vnd.github+json'',''X-GitHub-Api-Version'':''2022-11-28''})

        with urllib.request.urlopen(request,timeout=60)as r:data=json.load(r)

        assert data[''total_count'']==len(data[''actions_caches'']) and data[''total_count'']<=100

        keys={x[''key'']for x in data[''actions_caches'']}

        assert ''nav-blfs13.1-x86_64-rust-open-v1'' in keys

        assert ''nav-blfs13.1-x86_64-cms-open-v1'' not in keys

        required=[''final-gcc'',''gcc-test-runtime'',''gcc-test-cxx'',''gcc-test-c'',''access-tools'',''final-math'']

        assert all(''nav-lfs13.1-x86_64-''+x+''-v1'' in keys for x in required)

        total=sum(x[''size_in_bytes'']for x in data[''actions_caches''])

        worst=5184*1024**2

        print(''NAV_CACHE_BUDGET'',{''existing'':total,''root_apparent_bytes'':root,''new_cache_maximum'':worst,''worst_total'':total+worst,''limit'':10*1024**3},flush=True)

        assert total+worst<10*1024**3

        BUDGET

        '
    - name: Preserve transitional checkpoint with all gaps OPEN
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-cms-open-v1
