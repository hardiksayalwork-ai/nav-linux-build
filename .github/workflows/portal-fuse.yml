name: NAV Highway GCC GC bounded no-save diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-cms-open-v1
        fail-on-cache-miss: true
    - name: No-save Highway GCC GC original full-suite diagnostic
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1]\
        \ for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count()\
        \ >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\n\
        p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -f \"\
        $LFS/nav-build-metadata/cms/CMS-TESTS-OPEN.json\"\\npython3 - <<\\'DOWNLOADS\\'\\nfrom pathlib import Path\\nimport\
        \ urllib.request,hashlib,json\\nlock=json.loads(\"[{\\\\\"filename\\\\\": \\\\\"highway-1.4.0.tar.gz\\\\\", \\\\\"\
        url\\\\\": \\\\\"https://github.com/google/highway/archive/1.4.0/highway-1.4.0.tar.gz\\\\\", \\\\\"sha256\\\\\": \\\
        \\\"e72241ac9524bb653ae52ced768b508045d4438726a303f10181a38f764a453c\\\\\", \\\\\"md5\\\\\": \\\\\"9d335797777e17f827c7980b8313a34b\\\
        \\\"}]\")\\nfor x in lock:\\n p=Path(\\'/mnt/nav-lfs/sources\\')/x[\\'filename\\']\\n with urllib.request.urlopen(x[\\\
        'url\\'],timeout=120)as r,p.open(\\'wb\\')as f:\\n  while q:=r.read(1024*1024):f.write(q)\\n assert hashlib.file_digest(p.open(\\\
        'rb\\'),\\'sha256\\').hexdigest()==x[\\'sha256\\']\\n print(\\'SOURCE_SHA256_OK\\',x[\\'filename\\'],flush=True)\\\
        nDOWNLOADS\\npython3 - <<\\'INNER\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/highway-gc.sh\\').write_text(\\\
        'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin\
        \ LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/highway-gc\\\
        \\ncd /sources\\\\n{ command -v gcc g++\\\\ngcc --version\\\\ng++ --version\\\\ng++ -Q --help=params | grep -E \\\\\
        \\'ggc-min-(expand|heapsize)\\\\\\'\\\\ng++ -Q --param=ggc-min-expand=10 --param=ggc-min-heapsize=4096 --help=params\
        \ | grep -E \\\\\\'ggc-min-(expand|heapsize)\\\\\\'\\\\npkg-config --modversion gtest\\\\nulimit -a\\\\nlscpu; } >\
        \ /nav-build-metadata/highway-gc/preflight.log 2>&1\\\\ncat /nav-build-metadata/highway-gc/preflight.log\\\\n# Fresh\
        \ unchanged upstream source, default Release optimization, all upstream target selection unchanged.\\\\ntar -xf highway-1.4.0.tar.gz\\\
        \\ncd highway-1.4.0\\\\nset +e\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release\
        \ -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=\"--param=ggc-min-expand=10 --param=ggc-min-heapsize=4096\"\
        \ -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=ON -DHWY_ENABLE_TESTS=ON -DHWY_ENABLE_CONTRIB=ON -DHWY_ENABLE_EXAMPLES=ON\
        \ -DHWY_SYSTEM_GTEST=ON -DCMAKE_CXX_STANDARD=17 > /nav-build-metadata/highway-gc/config.log 2>&1\\\\nrc=$?\\\\nset\
        \ -e\\\\ncat /nav-build-metadata/highway-gc/config.log\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/highway-gc/config.exit\\\
        \\ntest \"$rc\" = 0\\\\ncp build/CMakeCache.txt /nav-build-metadata/highway-gc/CMakeCache.txt\\\\nset +e\\\\ncmake\
        \ --build build --parallel 2 > /nav-build-metadata/highway-gc/build.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ntail -100 /nav-build-metadata/highway-gc/build.log\\\
        \\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/highway-gc/build.exit\\\\ntest \"$rc\" = 0\\\\nchown\
        \ -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'export PATH=/usr/bin:/usr/sbin:/bin:/sbin; cd /sources/highway-1.4.0/build;\
        \ ctest --no-tests=error --output-on-failure -j2\\\\\\' > /nav-build-metadata/highway-gc/tests.log 2>&1\\\\nrc=$?\\\
        \\nset -e\\\\ncat /nav-build-metadata/highway-gc/tests.log\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/highway-gc/tests.exit\\\
        \\ncp build/Testing/Temporary/LastTest.log /nav-build-metadata/highway-gc/original.log\\\\ntest \"$rc\" = 0\\\\nprintf\
        \ \\\\\\'NAV_HIGHWAY_GC_FULL_SUITE_COMPLETE_NO_SAVE_NO_INSTALL\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf highway-1.4.0\\\
        \\n\\')\\nINNER\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"\
        $LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind\
        \ \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts\
        \ -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\
        \\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath\
        \ /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"\
        $LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set\
        \ -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\
        \\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2\
        \ LC_ALL=POSIX /bin/bash --noprofile --norc /sources/highway-gc.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env\
        \ -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test\
        \ \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\
        \\'\\nNAV_MOUNT_BUILD\\nsudo rm -f \"$LFS/sources/highway-gc.sh\" \"$LFS/sources/highway-1.4.0.tar.gz\"\\nprintf \\\
        'NAV_HIGHWAY_DIAGNOSTIC_NO_SAVE_NO_INSTALL\\n\\'\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log',\
        \ 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True, preexec_fn=lambda\
        \ : os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:2]))\ntry:\n    while proc.poll() is None:\n        free\
        \ = shutil.disk_usage('/mnt').free\n        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 *\
        \ 1024 ** 2 or time.monotonic() - start > 315 * 60:\n            raise RuntimeError('resource or stage-time safety\
        \ floor reached')\n        print(json.dumps({'elapsed_seconds': round(time.monotonic() - start), 'free_disk_bytes':\
        \ free, 'available_memory_kib': available}), flush=True)\n        time.sleep(20)\n    if proc.returncode:\n      \
        \  raise RuntimeError('source-build failed with status ' + str(proc.returncode))\nfinally:\n    if proc.poll() is\
        \ None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n        except\
        \ subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n    log.close()\n\
        \    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n    print('\\n'.join(lines[-80:]))\n\
        \    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK', 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE',\
        \ 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON', 'NAV_TESTER', 'NAV_KF6', 'Totals:',\
        \ 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE', 'NAV_PORTAL'])))))\n    import base64\n\
        \    f = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/cms/CMS-TESTS-OPEN.json')\n    import base64\n    for f in\
        \ sorted(pathlib.Path('/mnt/nav-lfs/nav-build-metadata/highway-gc').glob('*')):\n        if f.is_file():\n       \
        \     data = f.read_bytes()\n            for i in range(0, len(data), 3000):\n                print('NAV_HIGHWAY_GC_'\
        \ + f.name.replace('.', '_').upper() + '_B64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\nNAV_GUARD\n"
