name: NAV Git original full tests no-save diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-highway-open-v1
        fail-on-cache-miss: true
    - name: Git source original suites JPEG XL harness prerequisite no-save
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1]\
        \ for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count()\
        \ >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\n\
        p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -f \"\
        $LFS/nav-build-metadata/highway-gc/HIGHWAY-TRANSITIONAL-OPEN.json\"\\npython3 - <<\\'DOWNLOADS\\'\\nfrom pathlib import\
        \ Path\\nimport urllib.request,hashlib,json\\nlock=json.loads(\"[{\\\\\"filename\\\\\": \\\\\"git-2.55.0.tar.xz\\\\\
        \", \\\\\"url\\\\\": \\\\\"https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz\\\\\", \\\\\"sha256\\\\\"\
        : \\\\\"457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357\\\\\", \\\\\"md5\\\\\": \\\\\"758c02a1b621cc0868ee0a0d99573e6b\\\
        \\\"}]\")\\nfor x in lock:\\n p=Path(\\'/mnt/nav-lfs/sources\\')/x[\\'filename\\']\\n with urllib.request.urlopen(x[\\\
        'url\\'],timeout=120)as r,p.open(\\'wb\\')as f:\\n  while q:=r.read(1024*1024):f.write(q)\\n assert hashlib.file_digest(p.open(\\\
        'rb\\'),\\'sha256\\').hexdigest()==x[\\'sha256\\']\\n print(\\'SOURCE_SHA256_OK\\',x[\\'filename\\'],flush=True)\\\
        nPath(\\'/mnt/nav-lfs/nav-build-metadata/git\\').mkdir(exist_ok=True)\\nPath(\\'/mnt/nav-lfs/nav-build-metadata/git/source-lock.json\\\
        ').write_text(json.dumps(lock,indent=2))\\nDOWNLOADS\\npython3 - <<\\'INNER\\'\\nfrom pathlib import Path\\nPath(\\\
        '/mnt/nav-lfs/sources/git-stage.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport\
        \ MAKEFLAGS=-j2 PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin LANG=C.UTF-8 CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2\\\
        \\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/git\\\\ncd /sources\\\\ntar\
        \ -xf git-2.55.0.tar.xz\\\\ncd git-2.55.0\\\\n{ gcc --version; rustc --version; cargo --version; python3 --version;\
        \ perl -v; pkg-config --modversion libcurl libpcre2-8 expat zlib; ulimit -a; } > /nav-build-metadata/git/preflight.log\
        \ 2>&1\\\\ncat /nav-build-metadata/git/preflight.log\\\\nset +e\\\\n./configure --prefix=/usr --with-gitconfig=/etc/gitconfig\
        \ --with-python=python3 --with-libpcre2 > /nav-build-metadata/git/config.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/git/config.log\\\
        \\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/git/config.exit\\\\ntest \"$rc\" = 0\\\\ncp config.mak.autogen\
        \ /nav-build-metadata/git/\\\\nset +e\\\\nmake -j2 > /nav-build-metadata/git/build.log 2>&1\\\\nrc=$?\\\\nset -e\\\
        \\ntail -100 /nav-build-metadata/git/build.log\\\\nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/git/build.exit\\\
        \\ntest \"$rc\" = 0\\\\nchown -R tester .\\\\nset +e\\\\nsu -s /bin/bash tester -c \\\\\\'export PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin\
        \ CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2; cd /sources/git-2.55.0/t; scripts=(t[0-9][0-9][0-9][0-9]-*.sh); test \"\
        ${#scripts[@]}\" = 1046; printf \"NAV_GIT_ORIGINAL_SCRIPT_TARGETS %s\\\\\\\\n\" \"${#scripts[@]}\"; GIT_UNZIP=nonexist\
        \ GIT_TEST_EXT_CHAIN_LINT=0 make -j2 -k test-lint check-chainlint check-meson unit-tests \"${scripts[@]}\"\\\\\\'\
        \ > /nav-build-metadata/git/tests.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ntail -100 /nav-build-metadata/git/tests.log\\\\\
        nprintf \\\\\\'%s\\\\\\\\n\\\\\\' \"$rc\" > /nav-build-metadata/git/tests.exit\\\\nmake -C t aggregate-results > /nav-build-metadata/git/aggregate.log\
        \ 2>&1 || true\\\\ncat /nav-build-metadata/git/aggregate.log\\\\npython3 - <<\\\\\\'LOGS\\\\\\'\\\\nfrom pathlib import\
        \ Path\\\\nimport json\\\\np=Path(\\\\\\'t/test-results\\\\\\');rows={}\\\\nfor f in sorted(p.glob(\\\\\\'*.counts\\\
        \\\\')):rows[f.name]=f.read_text(errors=\\\\\\'replace\\\\\\')\\\\nPath(\\\\\\'/nav-build-metadata/git/original-counts.json\\\
        \\\\').write_text(json.dumps(rows,indent=2))\\\\nLOGS\\\\ntar -czf /nav-build-metadata/git/original-results.tar.gz\
        \ -C t test-results\\\\ntest \"$rc\" = 0\\\\nprintf \\\\\\'NAV_GIT_ORIGINAL_SUITES_COMPLETE_NO_INSTALL_NO_SAVE\\\\\
        \\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf git-2.55.0\\\\n\\')\\nINNER\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown\
        \ -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\\
        '\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev\
        \ \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount\
        \ -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\"\
        \ ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\
        \\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash\
        \ --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke;\
        \ printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin\
        \ MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/git-stage.sh\\nchroot --userspec=101:101\
        \ \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\\
        'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\
        \\n\"\\'\\nNAV_MOUNT_BUILD\\nsudo rm -f \"$LFS/sources/git-stage.sh\" \"$LFS/sources/\"*.tar.*\\nprintf \\'NAV_GIT_DIAGNOSTIC_NO_SAVE_NO_INSTALL\\\
        \\n\\'\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash',\
        \ str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True, preexec_fn=lambda : os.sched_setaffinity(0,\
        \ sorted(os.sched_getaffinity(0))[:2]))\ntry:\n    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n\
        \        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start\
        \ > 315 * 60:\n            raise RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds':\
        \ round(time.monotonic() - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n   \
        \     time.sleep(20)\n    if proc.returncode:\n        raise RuntimeError('source-build failed with status ' + str(proc.returncode))\n\
        finally:\n    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n\
        \        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n\
        \    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n\
        \    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK',\
        \ 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON',\
        \ 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE',\
        \ 'NAV_PORTAL'])))))\n    import base64\n    for f in sorted(pathlib.Path('/mnt/nav-lfs/nav-build-metadata/git').glob('*')):\n\
        \        if f.is_file():\n            data = f.read_bytes()\n            for i in range(0, len(data), 3000):\n   \
        \             print('NAV_GIT_' + f.name.replace('.', '_').upper() + '_B64', base64.b64encode(data[i:i + 3000]).decode(),\
        \ flush=True)\nNAV_GUARD\n"
