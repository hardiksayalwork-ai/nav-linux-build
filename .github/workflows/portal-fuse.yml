name: NAV FUSE and real sandbox prerequisite diagnostic no save
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-gstreamer-v1
        fail-on-cache-miss: true
    - name: Build real FUSE with native root and user test evidence
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"fuse-3.18.2.tar.gz\", \"url\": \"https://github.com/libfuse/libfuse/releases/download/fuse-3.18.2/fuse-3.18.2.tar.gz\", \"bytes\": 4933779, \"sha256\": \"f01de85717e20adf5f98aff324acd85dd73d61a5ca3834d573dcf0bd6e54a298\"}, {\"filename\": \"pytest-9.2.0-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/51/39/1f5d8c8877a0fa327db959c19341d4be61660de1ab6b7391f9eb805bcd67/pytest-9.2.0-py3-none-any.whl\", \"bytes\": 411776, \"sha256\": \"07acdcf88ec174f907dc01af70bf52d49b014bbab03faeeade31c96b18c2e588\"}, {\"filename\": \"iniconfig-2.3.1-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/56/43/4ca9e49d27a1fcf6bece6f6aec0ea46bb9112489b93d4b688fb415457bdb/iniconfig-2.3.1-py3-none-any.whl\", \"bytes\": 7552, \"sha256\": \"9121e2c1fdb355232495be3194c8dfe87ccc2d5dee45947b78e68f499790d7a7\"}, {\"filename\": \"packaging-26.3-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl\", \"bytes\": 129956, \"sha256\": \"d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c\"}, {\"filename\": \"pluggy-1.7.0-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/40/9e/2b38731e0fc536806f16490e1a12d7f0dc2a1235aa8cc07bcc75416a7daa/pluggy-1.7.0-py3-none-any.whl\", \"bytes\": 27082, \"sha256\": \"7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec\"}, {\"filename\": \"pygments-2.21.0-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/71/46/17f022dd3e953bf20a04a028a21ec746d942f8d2af30fa0f124fa0e6a684/pygments-2.21.0-py3-none-any.whl\", \"bytes\": 1250147, \"sha256\": \"2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9\"}, {\"filename\": \"py-1.11.0-py2.py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/f6/f0/10642828a8dfb741e5f3fbaac830550a518a775c7fff6f04a007259b0548/py-1.11.0-py2.py3-none-any.whl\", \"bytes\": 98708, \"sha256\": \"607c53218732647dff4acdfcd50cb62615cedf612e72d1724fb1a0cc6405b378\"}, {\"filename\": \"looseversion-1.3.0-py2.py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/4e/74/d5405b9b3b12e9176dff223576d7090bc161092878f533fd0dc23dd6ae1d/looseversion-1.3.0-py2.py3-none-any.whl\", \"bytes\": 8237, \"sha256\": \"781ef477b45946fc03dd4c84ea87734b21137ecda0e1e122bcb3c8d16d2a56e0\"}, {\"filename\": \"which-2.25.tar.gz\", \"url\": \"https://ftp.gnu.org/gnu/which/which-2.25.tar.gz\", \"bytes\": 203191, \"sha256\": \"1cb83e4f702e60b8211ab5ec4c2afbab1b1dec80209456a7d2faf7584ed225ea\"}, {\"filename\": \"libseccomp-2.6.1.tar.gz\", \"url\": \"https://github.com/seccomp/libseccomp/releases/download/v2.6.1/libseccomp-2.6.1.tar.gz\", \"bytes\": 656231, \"sha256\": \"501f66c667225d53791b97e1d7cf85ab764c297d04881f60f38f451c4b0ee1be\"}, {\"filename\": \"bubblewrap-0.11.2.tar.xz\", \"url\": \"https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz\", \"bytes\": 116336, \"sha256\": \"69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6\"}, {\"filename\": \"cython-3.2.9-py3-none-any.whl\", \"url\": \"https://files.pythonhosted.org/packages/00/ec/e61deec9bcfbb0e1b36f8b5ba75cb44644419b4bfd0fdd666bffd21d9579/cython-3.2.9-py3-none-any.whl\", \"bytes\": 1259272, \"sha256\": \"a2b0e87f6b80790c929308ca0831d686f7a180feab684fe8cd4a4380bd96aaca\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport MAKEFLAGS=-j2 PATH=/usr/bin:/usr/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE TEST_WITH_VALGRIND\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/fuse /nav-build-metadata/tests\\\\ncd /sources\\\\npython3 -m pip install --no-index --no-deps --no-build-isolation ./*.whl\\\\npython3 -c \\\\\\'import pytest,packaging,py,looseversion; print(\"NAV_FUSE_PYTHON_DEPS_OK\",pytest.__version__)\\\\\\'\\\\ntar -xf which-2.25.tar.gz\\\\n(cd which-2.25; ./configure --prefix=/usr; make -j2; make install)\\\\ntest \"$(which sh)\" = /usr/bin/sh\\\\nprintf \\\\\\'GNU Which 2.25 upstream has no test suite; path lookup smoke only.\\\\\\\\n\\\\\\' > /nav-build-metadata/fuse/which-test-scope.txt\\\\ntar -xf fuse-3.18.2.tar.gz\\\\ncd fuse-3.18.2\\\\nsed -i \\\\\\'/^udev/,$ s/^/#/\\\\\\' util/meson.build\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true\\\\nninja -C build -j2\\\\nninja -C build install\\\\nchmod u+s /usr/bin/fusermount3 build/util/fusermount3\\\\nldconfig\\\\nchown -R tester build/test build/example\\\\n# Original suite\\\\\\'s root and non-root conditions are preserved and compared.\\\\nfor who in root tester; do\\\\n chown -R tester build/.pytest_cache 2>/dev/null || true\\\\n set +e\\\\n if [ \"$who\" = root ]; then\\\\n  (cd build; python3 -m pytest --junitxml=/nav-build-metadata/fuse/root.xml) > /nav-build-metadata/tests/fuse-root.log 2>&1\\\\n else\\\\n  su tester -c \\\\\\'cd /sources/fuse-3.18.2/build; python3 -m pytest --junitxml=/tmp/fuse-tester.xml\\\\\\' > /nav-build-metadata/tests/fuse-tester.log 2>&1\\\\n  user_rc=$?\\\\n  cp /tmp/fuse-tester.xml /nav-build-metadata/fuse/tester.xml\\\\n fi\\\\n rc=$?\\\\n if [ \"$who\" = tester ]; then rc=\"$user_rc\"; fi\\\\n set -e\\\\n cat /nav-build-metadata/tests/fuse-$who.log\\\\n NAV_FUSE_WHO=\"$who\" NAV_FUSE_RC=\"$rc\" python3 - <<\\\\\\'FUSE_LOG\\\\\\'\\\\nfrom pathlib import Path\\\\nimport os,base64,xml.etree.ElementTree as ET\\\\nwho=os.environ[\\\\\\'NAV_FUSE_WHO\\\\\\'];p=Path(\\\\\\'/nav-build-metadata/tests/fuse-\\\\\\'+who+\\\\\\'.log\\\\\\');b=p.read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_FUSE_\\\\\\'+who.upper()+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\np=Path(\\\\\\'/nav-build-metadata/fuse\\\\\\')/(who+\\\\\\'.xml\\\\\\')\\\\nif p.exists():\\\\n r=ET.parse(p).getroot();cs=r.findall(\\\\\\'.//testcase\\\\\\');print(\\\\\\'NAV_FUSE_CASES\\\\\\',who,len(cs),\\\\\\'failed\\\\\\',sum(c.find(\\\\\\'failure\\\\\\')is not None or c.find(\\\\\\'error\\\\\\')is not None for c in cs),\\\\\\'skipped\\\\\\',[(c.get(\\\\\\'name\\\\\\'),c.find(\\\\\\'skipped\\\\\\').get(\\\\\\'message\\\\\\'))for c in cs if c.find(\\\\\\'skipped\\\\\\')is not None],flush=True)\\\\nprint(\\\\\\'NAV_FUSE_EXIT\\\\\\',who,os.environ[\\\\\\'NAV_FUSE_RC\\\\\\'],flush=True)\\\\nFUSE_LOG\\\\ndone\\\\n\\\\npython3 - <<\\\\\\'FUSE_AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport xml.etree.ElementTree as ET,json,shutil\\\\np=Path(\\\\\\'/nav-build-metadata/fuse\\\\\\');runs={w:{c.get(\\\\\\'name\\\\\\'):c for c in ET.parse(p/(w+\\\\\\'.xml\\\\\\')).getroot().findall(\\\\\\'.//testcase\\\\\\')}for w in [\\\\\\'root\\\\\\',\\\\\\'tester\\\\\\']}\\\\nassert set(runs[\\\\\\'root\\\\\\'])==set(runs[\\\\\\'tester\\\\\\']) and len(runs[\\\\\\'root\\\\\\'])==67\\\\nuncovered=[]\\\\nfor name in runs[\\\\\\'root\\\\\\']:\\\\n cs=[runs[w][name]for w in runs]\\\\n assert all(c.find(\\\\\\'failure\\\\\\')is None and c.find(\\\\\\'error\\\\\\')is None for c in cs),name\\\\n if all(c.find(\\\\\\'skipped\\\\\\')is not None for c in cs):\\\\n  assert name.startswith(\\\\\\'test_passthrough[\\\\\\')and name.endswith(\\\\\\'-True]\\\\\\'),name\\\\n  assert all(c.find(\\\\\\'skipped\\\\\\').get(\\\\\\'message\\\\\\')==\\\\\\'example does not support writeback caching\\\\\\'for c in cs)\\\\n  uncovered.append(name)\\\\nassert len(uncovered)==8\\\\nshutil.copyfile(\\\\\\'test/test_examples.py\\\\\\',p/\\\\\\'upstream-test_examples.py\\\\\\')\\\\n(p/\\\\\\'combined-coverage.json\\\\\\').write_text(json.dumps({\\\\\\'unique_cases\\\\\\':67,\\\\\\'passed_in_at_least_one_privilege\\\\\\':59,\\\\\\'original_skips_preserved\\\\\\':uncovered,\\\\\\'classification\\\\\\':\\\\\\'intentional unsupported example-option combinations, never counted as passes\\\\\\',\\\\\\'root_and_user_original_xml_retained\\\\\\':True},indent=2))\\\\nprint(\\\\\\'NAV_FUSE_RECONCILED\\\\\\',59,\\\\\\'unique pass\\\\\\',8,\\\\\\'intentional original skips\\\\\\',flush=True)\\\\nFUSE_AUDIT\\\\ncd /sources\\\\ntar -xf libseccomp-2.6.1.tar.gz\\\\ncd libseccomp-2.6.1\\\\nsed \\\\\\'s/env python/&3/\\\\\\' -i tests/regression\\\\n./configure --prefix=/usr --enable-python\\\\nmake -j2\\\\nchown -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'make -j2 check\\\\\\' > /nav-build-metadata/tests/seccomp.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/seccomp.log\\\\npython3 - <<\\\\\\'SECCOMP_LOG\\\\\\'\\\\nfrom pathlib import Path\\\\nimport base64\\\\nb=Path(\\\\\\'/nav-build-metadata/tests/seccomp.log\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_FUSE_SECCOMP_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nSECCOMP_LOG\\\\ntest \"$rc\" = 0\\\\nmake install\\\\nldconfig\\\\npython3 -c \\\\\\'import seccomp; print(\"NAV_FUSE_SECCOMP_IMPORT_OK\")\\\\\\'\\\\ncd /sources\\\\ntar -xf bubblewrap-0.11.2.tar.xz\\\\ncd bubblewrap-0.11.2\\\\nsed \\\\\\'s@symlink usr/lib64@ro-bind-try /lib64@\\\\\\' -i tests/libtest.sh\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback -Dtests=true\\\\nninja -C build -j2\\\\nchown -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'dbus-run-session -- meson test -C build --num-processes 2 --print-errorlogs\\\\\\' > /nav-build-metadata/tests/bubblewrap.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/bubblewrap.log\\\\npython3 - <<\\\\\\'BWRAP_LOG\\\\\\'\\\\nfrom pathlib import Path\\\\nimport base64,json\\\\np=Path(\\\\\\'/nav-build-metadata/bubblewrap\\\\\\');p.mkdir(exist_ok=True)\\\\nfor ext in [\\\\\\'txt\\\\\\',\\\\\\'json\\\\\\']:(p/(\\\\\\'testlog.\\\\\\'+ext)).write_bytes(Path(\\\\\\'build/meson-logs/testlog.\\\\\\'+ext).read_bytes())\\\\nb=(p/\\\\\\'testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_FUSE_BWRAP_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(x)for x in (p/\\\\\\'testlog.json\\\\\\').read_text().splitlines()if x.strip()];print(\\\\\\'NAV_FUSE_BWRAP_RESULTS\\\\\\',[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nBWRAP_LOG\\\\nprintf \\\\\\'NAV_FUSE_BWRAP_DIAGNOSTIC_EXIT %s\\\\\\\\n\\\\\\' \"$rc\"\\\\n\\')\\nINNER_SCRIPT\\n# Load the ordinary host interfaces; capability absence is not a product pass.\\nsudo modprobe fuse\\nsudo modprobe cuse\\nls -l /dev/fuse /dev/cuse\\nsudo chmod a+rw /dev/fuse /dev/cuse\\ntest -c /dev/fuse\\ntest -c /dev/cuse\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/portal-json.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.zip \"$LFS/sources/\"*.ttf \"$LFS/sources/\"*.tar.* \"$LFS/sources/portal-json.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\ntry:\n    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start > 315 * 60:\n            raise RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds': round(time.monotonic() - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n        time.sleep(20)\n    if proc.returncode:\n        raise RuntimeError('source-build failed with status ' + str(proc.returncode))\nfinally:\n    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK', 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON', 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST', 'NAV_FUSE'])))))\nNAV_GUARD\n"
