        for x in LOCK:\n with urllib.request.urlopen(x['url'],timeout=120)as r:b=r.read()\n assert hashlib.sha256(b).hexdigest()==x['sha256']\n\
        \ p=Path('/mnt/nav-lfs/sources')/x['filename'];p.write_bytes(b)\n with tarfile.open(p)as t:\n  for m in\
