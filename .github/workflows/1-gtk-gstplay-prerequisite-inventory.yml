        \\nmeson introspect --tests build > \"$A/opus-discovery.json\"\\nmeson introspect --buildoptions build >\
        \ \"$A/opus-options.json\"\\npython3 - <<\\'SAME\\'\\nfrom pathlib import Path\\nimport json\\nA=Path(\\\
        '/sources/nav-opusbase-evidence\\');assert json.loads((A/\\'opus-discovery.json\\').read_text())==json.loads((A/\\\
        'original-opus/discovery.json\\').read_text());assert json.loads((A/\\'opus-options.json\\').read_text())==json.loads((A/\\\
        'original-opus/options.json\\').read_text());print(\\'NAV_OPUSBASE_OPUS_SAME_CONFIG_DISCOVERY_NO_REPLAY\\\
