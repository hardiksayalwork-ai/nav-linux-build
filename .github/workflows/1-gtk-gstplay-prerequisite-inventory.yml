        \ pathlib import Path\nimport os,posixpath,subprocess\nroot=Path('/mnt/nav-lfs');rel='/etc/resolv.conf';seen=[]\n\
        for i in range(20):\n parts=rel.strip('/').split('/');changed=False\n for n in range(1,len(parts)+1):\n\
        \  p=root.joinpath(*parts[:n])\n  if p.is_symlink():\n   link=os.readlink(p);tail='/'.join(parts[n:]);base=link\
        \ if link.startswith('/')else posixpath.join('/'+'/'.join(parts[:n-1]),link);rel=posixpath.normpath(posixpath.join(base,tail));seen.append({'path':'/'+'/'.join(parts[:n]),'link':link});changed=True;break\n\
        \ if not changed:break\nelse:raise RuntimeError('resolver symlink loop')\nassert rel.startswith('/')and\
        \ rel not in ['/','/etc','/run'];target=root/rel.lstrip('/');target.parent.mkdir(parents=True,exist_ok=True);target.touch(exist_ok=True)\n\
        subprocess.run(['mount','--bind','/etc/resolv.conf',str(target)],check=True);subprocess.run(['mount','-o','remount,bind,ro',str(target)],check=True)\n\
        print('NAV_THEORA_RUNTIME_RESOLVER_MOUNT',rel,seen,flush=True)\nRESOLVER\nif [ -h \"$LFS/dev/shm\" ];then\
