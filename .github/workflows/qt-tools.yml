name: NAV QtTools linguist native configured tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  qt-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qt-extras-v1
        fail-on-cache-miss: true
    - name: Build QtTools with all configured tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"qttools-everywhere-src-6.11.2.tar.xz\", \"url\": \"https://download.qt.io/archive/qt/6.11/6.11.2/submodules/qttools-everywhere-src-6.11.2.tar.xz\", \"bytes\": 10226452, \"sha256\": \"9ea75af35c512f7e09e61c8c3af3997f13b4d43bb099cf43fcec470126b4041e\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/qt-extras.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 LC_ALL=POSIX PATH=/opt/qt6/bin:/usr/bin:/usr/sbin\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/qt-extras\\\\n/opt/qt6/bin/qmake -query QT_VERSION\\\\nXvfb :98 -screen 0 1024x768x24 -nolisten tcp -ac > /nav-build-metadata/tests/qt-extras-xvfb.log 2>&1 &\\\\nxv=$!\\\\ntrap \\\\\\'kill \"$xv\" 2>/dev/null || true\\\\\\' EXIT\\\\nfor n in $(seq 1 100); do test -S /tmp/.X11-unix/X98 && break; sleep .1; done\\\\ntest -S /tmp/.X11-unix/X98\\\\ninstall -d -m 0700 -o tester -g tester /tmp/nav-qt-extras-runtime\\\\nfor module in qttools; do\\\\n cd /sources\\\\n tar -xf \"$module-everywhere-src-6.11.2.tar.xz\"\\\\n cd \"$module-everywhere-src-6.11.2\"\\\\n /opt/qt6/bin/qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_BUILD_TESTS=ON -DQT_BUILD_TESTS_BY_DEFAULT=ON -DQT_BUILD_EXAMPLES=OFF\\\\n cmake --build build --parallel 2\\\\n cd build\\\\n ctest --show-only=json-v1 > \"/nav-build-metadata/qt-extras/$module-manifest.json\"\\\\n cmake --install .\\\\n ldconfig\\\\n chown -R tester ..\\\\n set +e\\\\n su tester -c \"dbus-run-session -- env DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-qt-extras-runtime LIBGL_ALWAYS_SOFTWARE=1 TZ=UTC TESTARGS=\\\\\\'-o nav-result.xml,junitxml -o -,txt\\\\\\' ctest --parallel 2 --output-on-failure --timeout 240 --no-tests=error --output-junit /tmp/nav-$module.xml\" > \"/nav-build-metadata/tests/$module.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$module.log\"\\\\n cat Testing/Temporary/LastTest.log\\\\n cp \"/tmp/nav-$module.xml\" \"/nav-build-metadata/tests/$module.xml\"\\\\n MODULE=\"$module\" python3 - <<\\\\\\'AUDIT\\\\\\'\\\\nimport os,json,xml.etree.ElementTree as E,shutil\\\\nfrom pathlib import Path\\\\nn=os.environ[\\\\\\'MODULE\\\\\\'];m=json.loads(Path(\\\\\\'/nav-build-metadata/qt-extras/\\\\\\'+n+\\\\\\'-manifest.json\\\\\\').read_text())[\\\\\\'tests\\\\\\'];c=E.parse(\\\\\\'/tmp/nav-\\\\\\'+n+\\\\\\'.xml\\\\\\').getroot().findall(\\\\\\'.//testcase\\\\\\')\\\\nassert len(m)==len(c) and len(c)>=1,(len(m),len(c))\\\\nassert all(x.find(\\\\\\'failure\\\\\\')is None and x.find(\\\\\\'error\\\\\\')is None and x.find(\\\\\\'skipped\\\\\\')is None for x in c)\\\\npaths=list(Path(\\\\\\'tests/auto\\\\\\').rglob(\\\\\\'nav-result.xml\\\\\\'));assert len(paths)>=1\\\\nfor i,f in enumerate(paths):\\\\n root=E.parse(f).getroot();cases=root.findall(\\\\\\'.//testcase\\\\\\');assert cases\\\\n fail=[x for x in cases if x.find(\\\\\\'failure\\\\\\')is not None or x.find(\\\\\\'error\\\\\\')is not None];skip=[x for x in cases if x.find(\\\\\\'skipped\\\\\\')is not None]\\\\n print(\\\\\\'NAV_QT_EXTRA_CASE_AUDIT\\\\\\',n,str(f),len(cases),\\\\\\'cases\\\\\\',len(fail),\\\\\\'failed\\\\\\',len(skip),\\\\\\'skipped\\\\\\',flush=True)\\\\n assert not fail and not skip\\\\n shutil.copy(f,\\\\\\'/nav-build-metadata/tests/\\\\\\'+n+\\\\\\'-\\\\\\'+str(i)+\\\\\\'-cases.xml\\\\\\')\\\\nprint(\\\\\\'NAV_QT_EXTRA_ALL_CONFIGURED_TESTS_PASS\\\\\\',n,len(c),\\\\\\'executables/CMake tests\\\\\\',flush=True)\\\\nAUDIT\\\\n test \"$rc\" = 0\\\\n cd /sources\\\\n rm -rf \"$module-everywhere-src-6.11.2\"\\\\n printf \\\\\\'NAV_QT_EXTRA_INSTALLED %s\\\\\\\\n\\\\\\' \"$module\"\\\\ndone\\\\ntest -x /opt/qt6/bin/lrelease\\\\ntest -x /opt/qt6/bin/lupdate\\\\ntest -f /opt/qt6/lib/libQt6UiTools.so\\\\n/opt/qt6/bin/lrelease -version\\\\n/opt/qt6/bin/lupdate -version\\\\nprintf \\\\\\'QtTools6.11.2 installed and all configured test cases checked. Earlier QtQuick five selected suites not full regression; native glass technical smoke on llvmpipe not HP/compositor integration. Valgrind4failed separate unresolved. Desktop/ISO not finished.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_QT_EXTRAS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/qt-extras.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/qt-extras.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER','NAV_QT_EXTRA','Totals:','FAIL!','SKIP','platform plugin','could not connect'])))\nNAV_GUARD\n"
    - name: Preserve tested Qt desktop extras
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qt-tools-v1
