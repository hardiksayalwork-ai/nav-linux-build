name: NAV LFS base services strict test stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  base-services:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-init-system-v1
        fail-on-cache-miss: true
    - name: Build DBus man-db procps configured suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"dbus-1.16.2.tar.xz\", \"url\": \"https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz\", \"bytes\": 1115644, \"book_md5\": \"97832e6f0a260936d28536e5349c22e5\", \"sha256\": \"0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2\"\
        }, {\"filename\": \"man-db-2.13.1.tar.xz\", \"url\": \"https://download.savannah.gnu.org/releases/man-db/man-db-2.13.1.tar.xz\", \"bytes\": 2110328, \"book_md5\": \"b6335533cbeac3b24cd7be31fdee8c83\", \"sha256\": \"8afebb6f7eb6bb8542929458841f5c7e6f240e30c86358c1fbcefbea076c87d9\"}, {\"filename\": \"procps-ng-4.0.7.tar.xz\", \"url\": \"https://sourceforge.net/projects/procps-ng/files/Production/procps-ng-4.0.7.tar.xz\", \"bytes\": 1588352, \"book_md5\": \"d47bdda51c4bd595a1ab21b8e538bcb3\", \"sha256\": \"9d2021f47a4501c667862c9942a92d1953694b21d11bcd1702e83eb594e3d67d\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\\
        npathlib.Path(\\'/mnt/nav-lfs/sources/base-services.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf dbus-1.16.2.tar.xz\\\
        \\ncd dbus-1.16.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE dbus-1.16.2\\\\\\\\n\\\\\\'\\\\nmkdir build\\\\ncd    build\\\\n\\\\nmeson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback ..\\\\nninja\\\\nrun_test dbus meson test --num-processes 2 --print-errorlogs\\\\nninja install\\\\nln -sfv /etc/machine-id /var/lib/dbus\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE dbus-1.16.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- dbus-1.16.2\\\\ncd /sources\\\\ntar -xf man-db-2.13.1.tar.xz\\\\ncd man-db-2.13.1\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE man-db-2.13.1\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr                         \\\\\\\\\\\\n            --docdir=/usr/share/doc/man-db-2.13.1 \\\\\\\\\\\\n            --sysconfdir=/etc                     \\\\\\\\\\\\n            --disable-setuid                      \\\\\\\\\\\\n            --enable-cache-owner=bin              \\\\\\\\\\\\n            --with-browser=/usr/bin/lynx          \\\\\\\\\\\\n            --with-vgrind=/usr/bin/vgrind\
        \         \\\\\\\\\\\\n            --with-grap=/usr/bin/grap\\\\nmake\\\\nrun_test man-db make -j2 check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE man-db-2.13.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- man-db-2.13.1\\\\ncd /sources\\\\ntar -xf procps-ng-4.0.7.tar.xz\\\\ncd procps-ng-4.0.7\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE procps-ng-4.0.7\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr                           \\\\\\\\\\\\n            --docdir=/usr/share/doc/procps-ng-4.0.7 \\\\\\\\\\\\n            --disable-static                        \\\\\\\\\\\\n            --disable-kill                          \\\\\\\\\\\\n            --enable-watch8bit                      \\\\\\\\\\\\n            --with-systemd\\\\nmake\\\\nchown -R tester .\\\\nrun_test procps-ng su tester -c \"PATH=$PATH LC_ALL=en_US.UTF-8 make -j2 check\"\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE procps-ng-4.0.7\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- procps-ng-4.0.7\\\\ndbus-daemon\
        \ --version\\\\nmandb --version\\\\nps --version\\\\nps -o pid,comm -p $$\\\\nprintf \\\\\\'NAV_BASE_SERVICES_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'DBus configured reduced LFS suite; man-db and procps suites; installed CLI smoke. No kernel/boot/desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_BASE_SERVICES_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath\
        \ /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/base-services.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets\
        \ root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/base-services.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n\
        \ log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_BASE','NAV_TEST','NAV_PACKAGE','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested base services checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-base-services-v1
