name: NAV Graphene ISOcodes hicolor original full diagnostic staged no save
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-gtk-prereq-diagnostic
  cancel-in-progress: false
jobs:
  prerequisites:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-rsvg-root.tar.zst; do\n test ! -e \"$bundle\"\n sudo install -o \"$(id -u)\" -g \"$(id -g)\"\
        \ -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\\
        n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\" proof\n zstd -t \"$bundle\"\n tar --zstd\
        \ -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\" \"$probe/recovered\"\n # Match actions/cache\
        \ extraction semantics, not only bundle writer access.\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test\
        \ ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n relative_bundle=$(realpath --relative-to=\"$PWD\"\
        \ \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\" -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n\
        \ env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program unzstd\
        \ > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n set -e\n test \"$negative_rc\" = 2\n test ! -s\
        \ \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\n TAR_OPTIONS=--overwrite\
        \ /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program unzstd\n cmp \"$probe/expected-bundle\"\
        \ \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n test \"$(stat -c\
        \ '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_RSVG_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_RSVG_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_RSVG_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_RSVG_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore newest verified librsvg TRANSITIONAL root
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-rsvg-root.tar.zst
        key: nav-blfs13.1-x86_64-librsvg-transitional-open-v1
        fail-on-cache-miss: true
    - name: Verify newest saved root archive
      shell: bash
      run: 'set -euo pipefail

        printf ''b18303bde2a0da1f126fd595f21fd56ae353e1f2561adc0616337c380f21d2de  /mnt/nav-rsvg-root.tar.zst

        '' | sha256sum -c -

        zstd -t /mnt/nav-rsvg-root.tar.zst

        tar --zstd -xf /mnt/nav-rsvg-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/librsvg/RSVG-TRANSITIONAL-OPEN.json

        '
    - name: Lock original Graphene mutest ISOcodes hicolor sources no network fallback no patches
      shell: bash
      run: "set -euo pipefail\npython3 - <<'SETUP'\nfrom pathlib import Path\nimport urllib.request,tarfile,hashlib,json,shutil\n\
        LOCK=[{'filename': 'graphene-1.10.8.tar.xz', 'url': 'https://download.gnome.org/sources/graphene/1.10/graphene-1.10.8.tar.xz',\
        \ 'md5': '169e3c507b5a5c26e9af492412070b81', 'sha256': 'a37bb0e78a419dcbeaa9c7027bcff52f5ec2367c25ec859da31dfde2928f279a',\
        \ 'top': 'graphene-1.10.8'}, {'filename': 'hicolor-icon-theme-0.18.tar.xz', 'url': 'https://icon-theme.freedesktop.org/releases/hicolor-icon-theme-0.18.tar.xz',\
        \ 'md5': 'ef14f3af03bcde9ed134aad626bdbaad', 'sha256': 'db0e50a80aa3bf64bb45cbca5cf9f75efd9348cf2ac690b907435238c3cf81d7',\
        \ 'top': 'hicolor-icon-theme-0.18'}, {'filename': 'iso-codes-v4.20.1.tar.gz', 'url': 'https://salsa.debian.org/iso-codes-team/iso-codes/-/archive/v4.20.1/iso-codes-v4.20.1.tar.gz',\
        \ 'md5': 'a8f16a62662ec13e55ca255a7c036ee3', 'sha256': '2d7d9f6084ab9ce6c534ce71a3dd5144b6e474f3c97616459a88f73f44a64bff',\
        \ 'top': 'iso-codes-v4.20.1'}, {'filename': 'mutest-18a20071773f7c4b75e82a931ef9b916b273b3e5.tar.gz', 'url':\
        \ 'https://api.github.com/repos/ebassi/mutest/tarball/18a20071773f7c4b75e82a931ef9b916b273b3e5', 'sha256':\
        \ '7a69e0956f312ee95751ef26101f8017719bd68194b737e5e03011c2ed26b9b1', 'commit': '18a20071773f7c4b75e82a931ef9b916b273b3e5',\
        \ 'top': 'ebassi-mutest-18a2007'}]\nA=Path('/mnt/nav-lfs/sources/gtk-prereq-evidence');A.mkdir(parents=True,exist_ok=True)\n\
        (A/'source-lock.json').write_text(json.dumps(LOCK,sort_keys=True))\nfor x in LOCK:\n with urllib.request.urlopen(x['url'],timeout=120)as\
        \ r:b=r.read()\n assert hashlib.sha256(b).hexdigest()==x['sha256'],x['filename']\n p=Path('/mnt/nav-lfs/sources')/x['filename'];p.write_bytes(b)\n\
        \ with tarfile.open(p)as t:\n  for m in t:assert not m.name.startswith('/')and '..'not in Path(m.name).parts\n\
        \  t.extractall(p.parent)\n print('NAV_GTK_PREREQ_SOURCE_LOCK_OK',x['filename'],len(b),flush=True)\nmutest=next(x\
        \ for x in LOCK if x['top'].startswith('ebassi-mutest-'))\nshutil.move(str(Path('/mnt/nav-lfs/sources')/mutest['top']),'/mnt/nav-lfs/sources/graphene-1.10.8/subprojects/mutest')\n\
        Path('/mnt/nav-lfs/sources/nav-gtk-prereq-inner.sh').write_text('set -euo pipefail\\numask 022\\nulimit\
        \ -v 4194304\\nexport MAKEFLAGS=-j2\\nA=/sources/gtk-prereq-evidence\\nP=/sources/gtk-prereq-payload\\nmkdir\
        \ -p \"$A\" \"$P\"\\ncd /sources/graphene-1.10.8\\nmeson setup --prefix=/usr --buildtype=release --wrap-mode=nodownload\
        \ -Dintrospection=enabled build 2>&1 | tee \"$A/graphene-configure.log\"\\nmeson introspect --tests build\
        \ > \"$A/graphene-discovery.json\"\\npython3 /sources/nav-gtk-prereq-verify.py discover graphene \"$A/graphene-discovery.json\"\
        \\nninja -C build -j2 2>&1 | tee \"$A/graphene-build.log\"\\nset +e\\nmeson test -C build --no-rebuild --num-processes\
        \ 2 --print-errorlogs 2>&1 | tee \"$A/graphene-test.log\"\\nrc=${PIPESTATUS[0]}\\nset -e\\ncp build/meson-logs/testlog.json\
        \ \"$A/graphene-testlog.json\"\\ncp build/meson-logs/testlog.txt \"$A/graphene-testlog.txt\"\\nprintf \\\
        '%s\\\\n\\' \"$rc\" > \"$A/graphene-test-exit.txt\"\\npython3 /sources/nav-gtk-prereq-verify.py recount\
        \ graphene \"$A/graphene-testlog.json\"\\ntest \"$rc\" = 0\\nDESTDIR=\"$P\" ninja -C build install 2>&1\
        \ | tee \"$A/graphene-stage.log\"\\ncd /sources/iso-codes-v4.20.1\\nmeson setup --prefix=/usr --wrap-mode=nodownload\
        \ build 2>&1 | tee \"$A/iso-codes-configure.log\"\\nmeson introspect --tests build > \"$A/iso-codes-discovery.json\"\
        \\npython3 /sources/nav-gtk-prereq-verify.py discover iso-codes \"$A/iso-codes-discovery.json\"\\nninja\
        \ -C build -j2 2>&1 | tee \"$A/iso-codes-build.log\"\\nset +e\\nmeson test -C build --no-rebuild --num-processes\
        \ 2 --print-errorlogs 2>&1 | tee \"$A/iso-codes-test.log\"\\nrc=${PIPESTATUS[0]}\\nset -e\\ncp build/meson-logs/testlog.json\
        \ \"$A/iso-codes-testlog.json\"\\ncp build/meson-logs/testlog.txt \"$A/iso-codes-testlog.txt\"\\nprintf\
        \ \\'%s\\\\n\\' \"$rc\" > \"$A/iso-codes-test-exit.txt\"\\npython3 /sources/nav-gtk-prereq-verify.py recount\
        \ iso-codes \"$A/iso-codes-testlog.json\"\\ntest \"$rc\" = 0\\nDESTDIR=\"$P\" ninja -C build install 2>&1\
        \ | tee \"$A/iso-codes-stage.log\"\\ncd /sources/hicolor-icon-theme-0.18\\nmeson setup --prefix=/usr --buildtype=release\
        \ --wrap-mode=nodownload build 2>&1 | tee \"$A/hicolor-configure.log\"\\nmeson introspect --tests build\
        \ > \"$A/hicolor-discovery.json\"\\npython3 /sources/nav-gtk-prereq-verify.py discover hicolor \"$A/hicolor-discovery.json\"\
        \\nninja -C build -j2 2>&1 | tee \"$A/hicolor-build.log\"\\n# Original package declares no tests. Run Meson\
        \ so the empty-suite result is explicit.\\nmeson test -C build --no-rebuild --num-processes 2 2>&1 | tee\
        \ \"$A/hicolor-test.log\"\\n: > \"$A/hicolor-testlog.json\"\\npython3 /sources/nav-gtk-prereq-verify.py\
        \ recount hicolor \"$A/hicolor-testlog.json\"\\nDESTDIR=\"$P\" ninja -C build install 2>&1 | tee \"$A/hicolor-stage.log\"\
        \\npython3 /sources/nav-gtk-prereq-verify.py source\\npython3 /sources/nav-gtk-prereq-verify.py payload\\\
        n')\nPath('/mnt/nav-lfs/sources/nav-gtk-prereq-verify.py').write_text(\"from pathlib import Path\\nimport\
        \ json,hashlib,tarfile,os,sys,collections\\nA=Path('/sources/gtk-prereq-evidence');P=Path('/sources/gtk-prereq-payload');A.mkdir(exist_ok=True)\\\
        nmode=sys.argv[1]\\nif mode=='discover':\\n name=sys.argv[2];d=json.loads(Path(sys.argv[3]).read_text());names=[x['name']for\
        \ x in d];assert len(names)==len(set(names)),names\\n if name=='graphene':\\n  units=['box','euler','frustum','matrix','plane','point','point3d','quad','quaternion','ray','rect','simd','size','sphere','triangle','vec2','vec3','vec4','introspection.py'];assert\
        \ len(d)==22,(len(d),names)\\n  assert all(any(y.split(':')[-1].split(' / ')[-1]==x for y in names)for x\
        \ in units),names\\n  assert all(any(y.split(':')[-1].split(' / ')[-1]==x for y in names)for x in ['general','hooks','types']),names\\\
        n elif name=='iso-codes':assert len(d)==8,(len(d),names)\\n elif name=='hicolor':assert d==[],d\\n else:raise\
        \ AssertionError(name)\\n print('NAV_GTK_PREREQ_ORIGINAL_DISCOVERY '+name+' '+json.dumps(names),flush=True)\\\
        nelif mode=='recount':\\n name=sys.argv[2];d=json.loads((A/(name+'-discovery.json')).read_text());rows=[json.loads(x)for\
        \ x in Path(sys.argv[3]).read_text().splitlines()if x.strip()];expected=collections.Counter(x['name']for\
        \ x in d);actual=collections.Counter(x['name'].split(' / ')[-1]for x in rows)\\n # Meson puts subproject\
        \ suite prefixes in the log name but not introspection names.\\n normalize=lambda s:s.split(':')[-1].split('\
        \ / ')[-1]\\n assert collections.Counter(normalize(x)for x in expected.elements())==collections.Counter(normalize(x['name'])for\
        \ x in rows),(expected,actual)\\n statuses=collections.Counter(x['result']for x in rows);out={'program_count':len(rows),'status_counts':dict(statuses),'names':[x['name']for\
        \ x in rows],'nested_tap_plan_and_skip_lines':{x['name']:[l for l in x.get('stdout','').splitlines()if l.startswith('1..')or'#\
        \ SKIP'in l or'# TODO'in l or'Bail out!'in l]for x in rows},'raw_log':name+'-testlog.json'}\\n (A/(name+'-recount.json')).write_text(json.dumps(out,sort_keys=True));print('NAV_GTK_PREREQ_RECOUNT_JSON\
        \ '+name+' '+json.dumps(out,sort_keys=True),flush=True);assert all(k=='OK'for k in statuses),statuses\\\
        nelif mode=='source':\\n counts={}\\n for x in json.loads((A/'source-lock.json').read_text()):\\n  root=Path('/sources')/x['top'];n=links=0\\\
        n  if x['top'].startswith('ebassi-mutest-'):root=Path('/sources/graphene-1.10.8/subprojects/mutest')\\n\
        \  with tarfile.open('/sources/'+x['filename'])as t:\\n   for m in t:\\n    rel=Path(m.name).relative_to(x['top']);f=root/rel\\\
        n    if m.isfile():assert not f.is_symlink()and hashlib.sha256(f.read_bytes()).digest()==hashlib.sha256(t.extractfile(m).read()).digest(),str(f);n+=1\\\
        n    elif m.issym():assert os.readlink(f)==m.linkname;links+=1\\n  counts[x['top']]={'files_exact':n,'symlinks_exact':links}\\\
        n (A/'source-integrity.json').write_text(json.dumps(counts,sort_keys=True));print('NAV_GTK_PREREQ_SOURCE_EXACT\
        \ '+json.dumps(counts,sort_keys=True),flush=True)\\nelif mode=='payload':\\n files={}\\n for f in sorted(P.rglob('*')):\\\
        n  if f.is_file()and not f.is_symlink():files[str(f.relative_to(P))]={'bytes':f.stat().st_size,'sha256':hashlib.file_digest(f.open('rb'),'sha256').hexdigest()}\\\
        n  elif f.is_symlink():files[str(f.relative_to(P))]={'symlink':os.readlink(f)}\\n assert not any('mutest'in\
        \ x for x in files),'Disposable static test subproject must not be shipped'\\n assert (P/'usr/share/icons/hicolor/index.theme').is_file()\\\
        n assert (P/'usr/share/iso-codes/json/iso_3166-1.json').is_file()\\n a={'classification':'Original full\
        \ prerequisite suites only. All inherited OPEN gaps retained. Adwaita and shaderc not included yet. No NAV\
        \ root checkpoint mutation or cache saves.','sources':json.loads((A/'source-integrity.json').read_text()),'tests':{x:json.loads((A/(x+'-recount.json')).read_text())for\
        \ x in ['graphene','iso-codes','hicolor']},'payload':files}\\n (A/'audit.json').write_text(json.dumps(a,sort_keys=True));print('NAV_GTK_PREREQUISITE_BUILD_AUDIT_JSON\
        \ '+json.dumps(a,sort_keys=True),flush=True)\\nelse:raise AssertionError(mode)\\n\")\nSETUP\n"
    - name: Original full Graphene22 including mutest3 GI1 and ISO8 hicolor0 diagnostic staged only
      shell: bash
      run: 'set -euo pipefail

        sudo chown -hR root:root /mnt/nav-lfs

        sudo env LFS=/mnt/nav-lfs unshare --mount --propagation private /bin/bash <<''MOUNT''

        set -euo pipefail

        mount --bind "$LFS" "$LFS"

        mount --bind /dev "$LFS/dev"

        mount -t devpts devpts -o gid=5,mode=0620 "$LFS/dev/pts"

        mount -t proc proc "$LFS/proc"

        mount -t sysfs -o ro sysfs "$LFS/sys"

        mount -t tmpfs -o nosuid,nodev tmpfs "$LFS/run"

        if [ -h "$LFS/dev/shm" ];then install -d -m1777 "$LFS$(realpath /dev/shm)";else mount -t tmpfs -o nosuid,nodev
        tmpfs "$LFS/dev/shm";fi

        chroot "$LFS" /usr/bin/env -i HOME=/root LC_ALL=C PATH=/usr/bin:/usr/sbin:/bin:/sbin MAKEFLAGS=-j2 /bin/bash
        /sources/nav-gtk-prereq-inner.sh

        MOUNT

        '
    - name: Measure staged payload bundle only no cache save no root mutation
      shell: bash
      run: 'set -euo pipefail

        sudo tar --format=pax --zstd -cf /tmp/nav-gtk-prereq-payload.tar.zst -C /mnt/nav-lfs/sources/gtk-prereq-payload
        .

        zstd -t /tmp/nav-gtk-prereq-payload.tar.zst

        sha256sum /tmp/nav-gtk-prereq-payload.tar.zst

        stat -c ''NAV_GTK_PREREQ_PAYLOAD_BYTES %s'' /tmp/nav-gtk-prereq-payload.tar.zst

        '
    - name: Always export exact source discovery raw test and staged payload audit evidence
      if: always()
      shell: bash
      run: "set -euo pipefail\nsudo python3 - <<'EXPORT'\nfrom pathlib import Path\nimport base64,gzip,hashlib,json\n\
        A=Path('/mnt/nav-lfs/sources/gtk-prereq-evidence');m={}\nif A.exists():\n for f in sorted(A.iterdir()):\n\
        \  if not f.is_file():continue\n  b=f.read_bytes();name=f.name.replace('.','_').upper();m[name]={'file':f.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()};z=gzip.compress(b,mtime=0)\n\
        \  for i in range(0,len(z),3000):print('NAV_GTKPRE_'+name+'_GZB64 '+base64.b64encode(z[i:i+3000]).decode(),flush=True)\n\
        print('NAV_GTKPRE_EXPORT_MANIFEST_JSON '+json.dumps(m,sort_keys=True),flush=True)\nEXPORT\n"
