name: NAV source GLib introspection MIME strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  glib:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-glib-prep-v1
        fail-on-cache-miss: true
    - name: Build GLib introspection desktop MIME strict suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"glib-2.88.3.tar.xz\", \"url\": \"https://download.gnome.org/sources/glib/2.88/glib-2.88.3.tar.xz\", \"bytes\": 5794356, \"book_md5\": \"b61c04cfbf55b0d24fbe64e4ac9e9d56\", \"sha256\": \"ab24d24e698dfa1e408b7bcdb508f4aafc906185a8b8ce72fdf79bbbdc9b383b\"\
        }, {\"filename\": \"gobject-introspection-1.86.0.tar.xz\", \"url\": \"https://download.gnome.org/sources/gobject-introspection/1.86/gobject-introspection-1.86.0.tar.xz\", \"bytes\": 1083172, \"book_md5\": \"fa0f2ae76868bf35ff725f940d75ec16\", \"sha256\": \"920d1a3fcedeadc32acff95c2e203b319039dd4b4a08dd1a2dfd283d19c0b9ae\"}, {\"filename\": \"desktop-file-utils-0.28.tar.xz\", \"url\": \"https://www.freedesktop.org/software/desktop-file-utils/releases/desktop-file-utils-0.28.tar.xz\", \"bytes\": 81620, \"book_md5\": \"dec5d7265c802db1fde3980356931b7b\", \"sha256\": \"4401d4e231d842c2de8242395a74a395ca468cd96f5f610d822df33594898a70\"}, {\"filename\": \"shared-mime-info-2.5.1.tar.gz\", \"url\": \"https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/2.5.1/shared-mime-info-2.5.1.tar.gz\", \"bytes\": 8873027, \"book_md5\": \"5f8baa7bac254ea9e65782f754a2880b\", \"sha256\": \"ea248ea157b7fa0165f4fe282c84919fa84c3f175553642f229c8f1ab7539128\"}, {\"filename\": \"xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f.tar.gz\"\
        , \"url\": \"https://gitlab.freedesktop.org/xdg/xdgmime/-/archive/a3d6162494270676fdfeb923cb0900517c4bd72f/xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f.tar.gz\", \"bytes\": 55601, \"sha256\": \"6686d8ac9d47a48cbd22d35fb175f7d483df67078a477006a925806ad9aa07f5\", \"commit\": \"a3d6162494270676fdfeb923cb0900517c4bd72f\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/glib.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n\
        \ \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log -o -name testlog.txt | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf glib-2.88.3.tar.xz\\\\ncd glib-2.88.3\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dintrospection=disabled -Dglib_debug=disabled -Dman-pages=enabled -Dsysprof=disabled\\\\nninja -C build\\\\nninja -C build install\\\
        \\nldconfig\\\\ncd /sources\\\\ntar -xf gobject-introspection-1.86.0.tar.xz\\\\ncd gobject-introspection-1.86.0\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload\\\\nninja -C build\\\\nchown -R tester:tester .\\\\nrun_test gobject-introspection su tester -c \\\\\\'meson test -C build --print-errorlogs --num-processes 2\\\\\\'\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources/glib-2.88.3\\\\nmeson configure build -Dintrospection=enabled\\\\nninja -C build\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf desktop-file-utils-0.28.tar.xz\\\\ncd desktop-file-utils-0.28\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload\\\\nninja -C build\\\\nninja -C build install\\\\ninstall -vdm755 /usr/share/applications\\\\nupdate-desktop-database /usr/share/applications\\\\n# No upstream test suite; validate a real desktop entry and rebuild its MIME cache.\\\\nmkdir -p /tmp/nav-desktop-entry\\\\nprintf \\\\\\'[Desktop\
        \ Entry]\\\\\\\\nType=Application\\\\\\\\nName=NAV Smoke\\\\\\\\nExec=/usr/bin/true\\\\\\\\nMimeType=text/plain;\\\\\\\\n\\\\\\' > /tmp/nav-desktop-entry/nav-smoke.desktop\\\\ndesktop-file-validate /tmp/nav-desktop-entry/nav-smoke.desktop\\\\nupdate-desktop-database /tmp/nav-desktop-entry\\\\ngrep -q nav-smoke.desktop /tmp/nav-desktop-entry/mimeinfo.cache\\\\nprintf \\\\\\'NAV_DESKTOP_FILE_NO_UPSTREAM_SUITE_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\ntar -xf shared-mime-info-2.5.1.tar.gz\\\\ncd shared-mime-info-2.5.1\\\\ntar -xf /sources/xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f.tar.gz -C subprojects\\\\nmv subprojects/xdgmime-a3d6162494270676fdfeb923cb0900517c4bd72f subprojects/xdgmime\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dupdate-mimedb=true -Dbuild-tests=true -Dbuild-spec=false\\\\nninja -C build\\\\nninja -C build install\\\\nchown -R tester:tester .\\\\nrun_test shared-mime-info su tester -c \\\\\\'meson test -C build --print-errorlogs\
        \ --num-processes 2\\\\\\'\\\\ncd /sources/glib-2.88.3\\\\nchown -R tester:tester .\\\\nrun_test glib su tester -c \\\\\\'LC_ALL=C TZ=UTC meson test -C build --print-errorlogs --num-processes 2\\\\\\'\\\\nninja -C build install\\\\nldconfig\\\\npkg-config --modversion glib-2.0 gio-2.0 gobject-introspection-1.0\\\\npython3 - <<\\\\\\'GLIB_SMOKE\\\\\\'\\\\nimport subprocess\\\\nx=subprocess.check_output([\\\\\\'gio\\\\\\',\\\\\\'mime\\\\\\',\\\\\\'text/plain\\\\\\'],text=True);assert \\\\\\'text/plain\\\\\\' in x\\\\nGLIB_SMOKE\\\\nprintf \\\\\\'NAV_GLIB_STAGE_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf glib-2.88.3 gobject-introspection-1.86.0 desktop-file-utils-0.28 shared-mime-info-2.5.1\\\\nprintf \\\\\\'BLFS13.1 GLib GObjectIntrospection shared-mime strict configured suites nonroot; desktop-file-utils no upstream suite, desktop+cache smoke.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_GLIB_STAGE_COMPLETE\\\
        \\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env\
        \ -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/glib.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/glib.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n\
        \  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_GLIB','NAV_DESKTOP','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested GLib stack
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-glib-v1
