name: NAV FFmpeg9.0.1 native BUILD and genuine FATE discovery ONLY no tests install save
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
    - name: Live public standard runner free compute cache17exact and upstream rsync reachability
      shell: bash
      run: 'set -euo pipefail

        command -v rsync

        rsync --version | head -3

        python3 - <<''PREFLIGHT''

        import urllib.request,json,time

        start=time.monotonic();base=''https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build'';req=lambda
        u:json.load(urllib.request.urlopen(u,timeout=30))

        r=req(base+''?t=''+str(time.time_ns()));assert r[''private''] is False

        c=req(base+''/actions/caches?per_page=100&t=''+str(time.time_ns()));expected={''10818008081'': {''key'':
        ''nav-theora-basetheora-install-only-open-v1'', ''bytes'': 1665268}, ''10816097588'': {''key'': ''nav-gstmatroska-original-tested-install-only-open-v1'',
        ''bytes'': 283419}, ''10813815026'': {''key'': ''nav-opus-baseopus-install-only-open-v1'', ''bytes'': 512022},
        ''10810498235'': {''key'': ''nav-gstgood-narrow-install-only-transitional-open-v1'', ''bytes'': 901348},
        ''10803318199'': {''key'': ''nav-blfs13.1-x86_64-librsvg-transitional-open-v1'', ''bytes'': 1477765679},
        ''10805037408'': {''key'': ''nav-graphene-isocodes-hicolor-install-only-open-v1'', ''bytes'': 6895265},
        ''10804828520'': {''key'': ''nav-linux7.1.8-userns-udmabuf-compiled-open-v1'', ''bytes'': 17602045}, ''10790873772'':
        {''key'': ''nav-blfs13.1-x86_64-aom-static-repair-open-v1'', ''bytes'': 1414253410}, ''10710908926'': {''key'':
        ''nav-blfs13.1-x86_64-jxl-open-v1'', ''bytes'': 1404400214}, ''10700939007'': {''key'': ''nav-blfs13.1-x86_64-giflib-open-v1'',
        ''bytes'': 1374812746}, ''10696846187'': {''key'': ''nav-blfs13.1-x86_64-git-open-v1'', ''bytes'': 1374122764},
        ''10516363617'': {''key'': ''nav-lfs13.1-x86_64-final-gcc-v1'', ''bytes'': 1413472049}, ''10515953327'':
        {''key'': ''nav-lfs13.1-x86_64-gcc-test-runtime-v1'', ''bytes'': 148732}, ''10511354384'': {''key'': ''nav-lfs13.1-x86_64-gcc-test-cxx-v1'',
        ''bytes'': 1030391}, ''10508735204'': {''key'': ''nav-lfs13.1-x86_64-gcc-test-c-v1'', ''bytes'': 1021068},
        ''10480998516'': {''key'': ''nav-lfs13.1-x86_64-access-tools-v1'', ''bytes'': 909038418}, ''10480209539'':
        {''key'': ''nav-lfs13.1-x86_64-final-math-v1'', ''bytes'': 901878016}}

        actual={str(z[''id'']):{''key'':z[''key''],''bytes'':z[''size_in_bytes'']}for z in c[''actions_caches'']};assert
        c[''total_count'']==len(actual)==len(expected)and actual==expected

