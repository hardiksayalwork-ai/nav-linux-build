        PREFLIGHT

        rsync --list-only --recursive --stats --timeout=30 --contimeout=20 rsync://fate-suite.ffmpeg.org/fate-suite/
        > /tmp/ffmpeg-rsync-hosted-list.log

        tail -18 /tmp/ffmpeg-rsync-hosted-list.log

