        \ gawk-5.4.1\\\\n\\'\\nsed -i \\'s/extras//\\' Makefile.in\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            --build=$(build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE gawk-5.4.1\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- gawk-5.4.1\\n\\ncd /mnt/nav-build/sources\\ntar -xf grep-3.12.tar.xz\\ncd grep-3.12\\nprintf \\'BEGIN_PACKAGE grep-3.12\\\\n\\'\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            --build=$(./build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE grep-3.12\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- grep-3.12\\n\\ncd /mnt/nav-build/sources\\ntar -xf gzip-1.14.tar.xz\\ncd gzip-1.14\\nprintf \\'BEGIN_PACKAGE gzip-1.14\\\\n\\'\\n./configure --prefix=/usr --host=$LFS_TGT\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE gzip-1.14\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- gzip-1.14\\n\\ncd /mnt/nav-build/sources\\\
        ntar -xf make-4.4.1.tar.gz\\ncd make-4.4.1\\nprintf \\'BEGIN_PACKAGE make-4.4.1\\\\n\\'\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            --build=$(build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE make-4.4.1\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- make-4.4.1\\n\\ncd /mnt/nav-build/sources\\ntar -xf patch-2.8.tar.xz\\ncd patch-2.8\\nprintf \\'BEGIN_PACKAGE patch-2.8\\\\n\\'\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            --build=$(build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE patch-2.8\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- patch-2.8\\n\\ncd /mnt/nav-build/sources\\ntar -xf sed-4.10.tar.xz\\ncd sed-4.10\\nprintf \\'BEGIN_PACKAGE sed-4.10\\\\n\\'\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            --build=$(./build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE sed-4.10\\\
        \\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- sed-4.10\\n\\ncd /mnt/nav-build/sources\\ntar -xf tar-1.35.tar.xz\\ncd tar-1.35\\nprintf \\'BEGIN_PACKAGE tar-1.35\\\\n\\'\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            --build=$(build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE tar-1.35\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- tar-1.35\\n\\ncd /mnt/nav-build/sources\\ntar -xf xz-5.8.3.tar.xz\\ncd xz-5.8.3\\nprintf \\'BEGIN_PACKAGE xz-5.8.3\\\\n\\'\\n./configure --prefix=/usr                     \\\\\\n            --host=$LFS_TGT                   \\\\\\n            --build=$(build-aux/config.guess) \\\\\\n            --disable-static                  \\\\\\n            --docdir=/usr/share/doc/xz-5.8.3\\nmake\\nmake DESTDIR=$LFS install\\nrm -v $LFS/usr/lib/liblzma.la\\nprintf \\'DONE_PACKAGE xz-5.8.3\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- xz-5.8.3\\n\\ncd /mnt/nav-build/sources\\ntar -xf binutils-2.47.tar.xz\\\
        ncd binutils-2.47\\nprintf \\'BEGIN_PACKAGE binutils-2.47\\\\n\\'\\nsed \\'6031s/$add_dir//\\' -i ltmain.sh\\nmkdir -v build\\ncd       build\\n../configure                   \\\\\\n    --prefix=/usr              \\\\\\n    --build=$(../config.guess) \\\\\\n    --host=$LFS_TGT            \\\\\\n    --disable-nls              \\\\\\n    --enable-shared            \\\\\\n    --enable-gprofng=no        \\\\\\n    --disable-werror           \\\\\\n    --enable-64-bit-bfd        \\\\\\n    --enable-new-dtags         \\\\\\n    --enable-default-hash-style=gnu\\nmake\\nmake DESTDIR=$LFS install\\nrm -v $LFS/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la}\\nprintf \\'DONE_PACKAGE binutils-2.47\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- binutils-2.47\\n\\ncd /mnt/nav-build/sources\\ntar -xf gcc-16.2.0.tar.xz\\ncd gcc-16.2.0\\nprintf \\'BEGIN_PACKAGE gcc-16.2.0\\\\n\\'\\ntar -xf ../mpfr-4.2.2.tar.xz\\nmv -v mpfr-4.2.2 mpfr\\ntar -xf ../gmp-6.3.0.tar.xz\\nmv -v gmp-6.3.0 gmp\\ntar\
        \ -xf ../mpc-1.4.1.tar.xz\\nmv -v mpc-1.4.1 mpc\\ncase $(uname -m) in\\n  x86_64)\\n    sed -e \\'/m64=/s/lib64/lib/\\' \\\\\\n        -i.orig gcc/config/i386/t-linux64\\n  ;;\\nesac\\nmkdir -v build\\ncd       build\\n../configure                   \\\\\\n    --build=$(../config.guess) \\\\\\n    --host=$LFS_TGT            \\\\\\n    --target=$LFS_TGT          \\\\\\n    --prefix=/usr              \\\\\\n    --with-build-sysroot=$LFS  \\\\\\n    --enable-default-pie       \\\\\\n    --enable-default-ssp       \\\\\\n    --disable-fixincludes      \\\\\\n    --disable-nls              \\\\\\n    --disable-multilib         \\\\\\n    --disable-libatomic        \\\\\\n    --disable-libgomp          \\\\\\n    --disable-libquadmath      \\\\\\n    --disable-libsanitizer     \\\\\\n    --disable-libssp           \\\\\\n    --disable-libvtv           \\\\\\n    --enable-languages=c,c++   \\\\\\n    CXX_FOR_TARGET=\"$LFS_TGT-gcc -nostdinc++\" \\\\\\n    LDFLAGS_FOR_TARGET=-L$PWD/$LFS_TGT/libgcc\
