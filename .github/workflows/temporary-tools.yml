name: NAV LFS temporary tools stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  temporary-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore exact chapter5 checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-chapter5-v1
        fail-on-cache-miss: true
    - name: Guarded source-built temporary userspace and native tools
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LFS_TGT=x86_64-lfs-linux-gnu LC_ALL=POSIX\\nexport PATH=\"$LFS/tools/bin:/usr/bin:/bin\"\\nexport CONFIG_SITE=\"$LFS/usr/share/config.site\"\\nexport MAKEFLAGS=-j2\\nulimit -v 4194304\\numask 022\\ntest -f \"$LFS/nav-build-metadata/stage2-hashes.txt\"\\nsudo mkdir -p /mnt/nav-build\\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-build\\nsudo ln -sf bash /bin/sh\\nmkdir -p /mnt/nav-build/sources \"$LFS/usr/share\"\\ncd /mnt/nav-build/sources\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\"\
        , \"sources\": [{\"filename\": \"m4-1.4.21.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.xz\", \"bytes\": 2080016, \"book_md5\": \"8051eef7239b2f187791f2ab0034d6b7\", \"sha256\": \"f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66\"}, {\"filename\": \"ncurses-6.6.tar.gz\", \"url\": \"https://invisible-mirror.net/archives/ncurses/ncurses-6.6.tar.gz\", \"bytes\": 3791150, \"book_md5\": \"dd45bf6854430af403452a7a6a40652c\", \"sha256\": \"355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11\"}, {\"filename\": \"bash-5.3.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz\", \"bytes\": 11355854, \"book_md5\": \"977c8c0c5ae6309191e7768e28ebc951\", \"sha256\": \"0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba\"}, {\"filename\": \"coreutils-9.11.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/coreutils/coreutils-9.11.tar.xz\", \"bytes\": 6562420, \"book_md5\": \"e52e9857e4aa9ae38ef32f8ed6a27604\", \"sha256\": \"\
        394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3\"}, {\"filename\": \"diffutils-3.12.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/diffutils/diffutils-3.12.tar.xz\", \"bytes\": 1938800, \"book_md5\": \"d1b18b20868fb561f77861cd90b05de4\", \"sha256\": \"7c8b7f9fc8609141fdea9cece85249d308624391ff61dedaf528fcb337727dfd\"}, {\"filename\": \"file-5.48.tar.gz\", \"url\": \"https://astron.com/pub/file/file-5.48.tar.gz\", \"bytes\": 2693209, \"book_md5\": \"423686e97f731d8c24e9cd1a22b03dec\", \"sha256\": \"ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283\"}, {\"filename\": \"findutils-4.11.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/findutils/findutils-4.11.0.tar.xz\", \"bytes\": 2451424, \"book_md5\": \"512c6875ed84034dca240c4bc9380b96\", \"sha256\": \"bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd\"}, {\"filename\": \"gawk-5.4.1.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gawk/gawk-5.4.1.tar.xz\", \"bytes\": 3838416, \"book_md5\"\
        : \"d379c2110e7a3e15347dd5559a41ad64\", \"sha256\": \"07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37\"}, {\"filename\": \"grep-3.12.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/grep/grep-3.12.tar.xz\", \"bytes\": 1918448, \"book_md5\": \"5d9301ed9d209c4a88c8d3a6fd08b9ac\", \"sha256\": \"2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9\"}, {\"filename\": \"gzip-1.14.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gzip/gzip-1.14.tar.xz\", \"bytes\": 885748, \"book_md5\": \"4bf5a10f287501ee8e8ebe00ef62b2c2\", \"sha256\": \"01a7b881bd220bfdf615f97b8718f80bdfd3f6add385b993dcf6efd14e8c0ac6\"}, {\"filename\": \"make-4.4.1.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/make/make-4.4.1.tar.gz\", \"bytes\": 2348200, \"book_md5\": \"c8469a3713cbbe04d955d4ae4be23eeb\", \"sha256\": \"dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3\"}, {\"filename\": \"patch-2.8.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/patch/patch-2.8.tar.xz\", \"bytes\"\
        : 907208, \"book_md5\": \"149327a021d41c8f88d034eab41c039f\", \"sha256\": \"f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3\"}, {\"filename\": \"sed-4.10.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/sed/sed-4.10.tar.xz\", \"bytes\": 1732800, \"book_md5\": \"c70dc5372db95c816442ffedf77a0d0f\", \"sha256\": \"b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7\"}, {\"filename\": \"tar-1.35.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/tar/tar-1.35.tar.xz\", \"bytes\": 2317208, \"book_md5\": \"a2d8042658cfd8ea939e6d911eaf4152\", \"sha256\": \"4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16\"}, {\"filename\": \"xz-5.8.3.tar.xz\", \"url\": \"https://github.com//tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz\", \"bytes\": 1548064, \"book_md5\": \"a02753f34e5546d20213b87f876a0933\", \"sha256\": \"fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6\"}, {\"filename\": \"binutils-2.47.tar.xz\", \"url\": \"https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz\"\
        , \"bytes\": 29034716, \"book_md5\": \"d772acfbd55a81644e9fe7b8189cd2a5\", \"sha256\": \"154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff\"}, {\"filename\": \"gcc-16.2.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz\", \"bytes\": 107200820, \"book_md5\": \"19b777fb19ea4982731392481306f0d3\", \"sha256\": \"e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e\"}, {\"filename\": \"mpfr-4.2.2.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/mpfr/mpfr-4.2.2.tar.xz\", \"bytes\": 1505596, \"book_md5\": \"7c32c39b8b6e3ae85f25156228156061\", \"sha256\": \"b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01\"}, {\"filename\": \"gmp-6.3.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz\", \"bytes\": 2094196, \"book_md5\": \"956dc04e864001a9c22429f761f2c283\", \"sha256\": \"a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898\"}, {\"filename\": \"mpc-1.4.1.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/mpc/mpc-1.4.1.tar.xz\"\
        , \"bytes\": 531992, \"book_md5\": \"40c5fba305125279ea46041160e81daf\", \"sha256\": \"91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\n\\ncd /mnt/nav-build/sources\\ntar -xf m4-1.4.21.tar.xz\\ncd m4-1.4.21\\nprintf \\'BEGIN_PACKAGE m4-1.4.21\\\\n\\'\\ncat > $LFS/usr/share/config.site << EOF\\nac_cv_func_posix_spawn_file_actions_addchdir=yes\\nac_cv_func_posix_spawn_file_actions_addfchdir=yes\\nEOF\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            --build=$(build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE m4-1.4.21\\\\n\\'\\ncd\
        \ /mnt/nav-build/sources\\nrm -rf -- m4-1.4.21\\n\\ncd /mnt/nav-build/sources\\ntar -xf ncurses-6.6.tar.gz\\ncd ncurses-6.6\\nprintf \\'BEGIN_PACKAGE ncurses-6.6\\\\n\\'\\nmkdir build\\npushd build\\n  ../configure --prefix=$LFS/tools AWK=gawk\\n  make -C include\\n  make -C progs tic\\n  install progs/tic $LFS/tools/bin\\npopd\\n./configure --prefix=/usr                \\\\\\n            --host=$LFS_TGT              \\\\\\n            --build=$(./config.guess)    \\\\\\n            --mandir=/usr/share/man      \\\\\\n            --with-manpage-format=normal \\\\\\n            --with-shared                \\\\\\n            --without-normal             \\\\\\n            --with-cxx-shared            \\\\\\n            --without-debug              \\\\\\n            --without-ada                \\\\\\n            --disable-stripping          \\\\\\n            AWK=gawk\\nmake\\nmake DESTDIR=$LFS install\\nln -sv libncursesw.so $LFS/usr/lib/libncurses.so\\nsed -e \\'s/^#if.*XOPEN.*$/#if\
