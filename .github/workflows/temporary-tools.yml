        nmake\\nmake DESTDIR=$LFS install\\nmv -v $LFS/usr/bin/chroot              $LFS/usr/sbin\\nmkdir -pv $LFS/usr/share/man/man8\\nmv -v $LFS/usr/share/man/man1/chroot.1 $LFS/usr/share/man/man8/chroot.8\\nsed -i \\'s/\"1\"/\"8\"/\\'                    $LFS/usr/share/man/man8/chroot.8\\nprintf \\'DONE_PACKAGE coreutils-9.11\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- coreutils-9.11\\n\\ncd /mnt/nav-build/sources\\ntar -xf diffutils-3.12.tar.xz\\ncd diffutils-3.12\\nprintf \\'BEGIN_PACKAGE diffutils-3.12\\\\n\\'\\n./configure --prefix=/usr   \\\\\\n            --host=$LFS_TGT \\\\\\n            gl_cv_func_strcasecmp_works=yes \\\\\\n            --build=$(./build-aux/config.guess)\\nmake\\nmake DESTDIR=$LFS install\\nprintf \\'DONE_PACKAGE diffutils-3.12\\\\n\\'\\ncd /mnt/nav-build/sources\\nrm -rf -- diffutils-3.12\\n\\ncd /mnt/nav-build/sources\\ntar -xf file-5.48.tar.gz\\ncd file-5.48\\nprintf \\'BEGIN_PACKAGE file-5.48\\\\n\\'\\nmkdir build\\npushd build\\n  ../configure --disable-bzlib\
