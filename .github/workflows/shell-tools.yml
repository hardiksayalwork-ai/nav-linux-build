name: NAV LFS shell and build tools tested stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  shell-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-terminal-tools-v1
        fail-on-cache-miss: true
    - name: Build Bash Libtool GDBM Gperf Expat Inetutils Less Perl and audit tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"bash-5.3.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz\", \"bytes\": 11355854, \"book_md5\": \"977c8c0c5ae6309191e7768e28ebc951\", \"sha256\": \"0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba\"\
        }, {\"filename\": \"libtool-2.6.2.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/libtool/libtool-2.6.2.tar.xz\", \"bytes\": 1093564, \"book_md5\": \"87743862e6cabfb9e76651bc64e31e5c\", \"sha256\": \"2ef1067c16c97db930fd740cc9bc3d3ba9a583804ae5ac42cc3e8719e49e191e\"}, {\"filename\": \"gdbm-1.26.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/gdbm/gdbm-1.26.tar.gz\", \"bytes\": 1226591, \"book_md5\": \"aaa600665bc89e2febb3c7bd90679115\", \"sha256\": \"6a24504a14de4a744103dcb936be976df6fbe88ccff26065e54c1c47946f4a5e\"}, {\"filename\": \"gperf-3.3.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/gperf/gperf-3.3.tar.gz\", \"bytes\": 1831294, \"book_md5\": \"31753b021ea78a21f154bf9eecb8b079\", \"sha256\": \"fd87e0aba7e43ae054837afd6cd4db03a3f2693deb3619085e6ed9d8d9604ad8\"}, {\"filename\": \"expat-2.8.3.tar.xz\", \"url\": \"https://github.com/libexpat/libexpat/releases/download/R_2_8_3/expat-2.8.3.tar.xz\", \"bytes\": 517264, \"book_md5\": \"1747f5a57b191f0373baeb5adc8078ca\", \"sha256\"\
        : \"f6256df90c906773d344da084402b7d3e4f22ed41b1a59c989098a83d3ea0c85\"}, {\"filename\": \"inetutils-2.8.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/inetutils/inetutils-2.8.tar.gz\", \"bytes\": 2985957, \"book_md5\": \"f0f9ad13045a67da9c882148f9efae6b\", \"sha256\": \"57b3cf4f77555992881e5ba2a09a63b05aa2c56342a60ed4305b5f45938390b5\"}, {\"filename\": \"less-704.tar.gz\", \"url\": \"https://www.greenwoodsoftware.com/less/less-704.tar.gz\", \"bytes\": 996650, \"book_md5\": \"c4c9eea5b1862783b078c67ca67c9185\", \"sha256\": \"20a0b0a2bb2525fa53c7eee9beb854b4c9cf172eabb209af7020743547bfe9fb\"}, {\"filename\": \"perl-5.44.0.tar.xz\", \"url\": \"https://www.cpan.org/src/5.0/perl-5.44.0.tar.xz\", \"bytes\": 14919940, \"book_md5\": \"55761cf1543af326492fd194647796d1\", \"sha256\": \"505cf43912e9480495c344c70260452e32aa2a73c546a026b3f100053b23ce91\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\\
        n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/shell-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){ local name=\"$1\";shift; \"$@\" 2>&1 | tee \"/nav-build-metadata/tests/$name.log\"; printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"; }\\\\ncd /sources\\\\ntar -xf bash-5.3.tar.gz\\\\ncd bash-5.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE bash-5.3\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr             \\\\\\\\\\\\n            --without-bash-malloc     \\\\\\\\\\\\n            --with-installed-readline \\\\\\\\\\\\n            --docdir=/usr/share/doc/bash-5.3\\\\nmake\\\\nchown -R tester\
        \ .\\\\n# Match book terminal ownership, not a piped non-terminal run.\\\\nlocaledef -i zh_TW -f BIG5 zh_TW.BIG5\\\\n# glibc deliberately warns this non-ASCII-compatible encoding; verify result.\\\\nset +e\\\\nlocaledef -i ja_JP -f SHIFT_JIS ja_JP.SJIS\\\\nlocale_rc=$?\\\\nset -e\\\\ntest \"$locale_rc\" -le 1\\\\nlocale -a | grep -qi \\\\\\'^ja_JP.sjis$\\\\\\'\\\\ncat > /tmp/nav-bash-suite.exp <<\\\\\\'EXPECT\\\\\\'\\\\nset timeout -1\\\\nspawn make tests\\\\nexpect eof\\\\nlassign [wait] _ _ _ value\\\\nexit $value\\\\nEXPECT\\\\nrun_test bash-raw env LC_ALL=C.UTF-8 su -s /usr/bin/expect tester /tmp/nav-bash-suite.exp\\\\nrm /tmp/nav-bash-suite.exp\\\\npython3 - <<\\\\\\'BASH_AUDIT\\\\\\'\\\\nimport pathlib,re,json\\\\ntext=pathlib.Path(\\\\\\'/nav-build-metadata/tests/bash-raw.log\\\\\\').read_text(errors=\\\\\\'replace\\\\\\')\\\\nmanifest=[\\\\\\'run-alias\\\\\\', \\\\\\'run-appendop\\\\\\', \\\\\\'run-arith\\\\\\', \\\\\\'run-arith-for\\\\\\', \\\\\\'run-array\\\\\\', \\\\\\\
        'run-array2\\\\\\', \\\\\\'run-assoc\\\\\\', \\\\\\'run-attr\\\\\\', \\\\\\'run-braces\\\\\\', \\\\\\'run-builtins\\\\\\', \\\\\\'run-case\\\\\\', \\\\\\'run-casemod\\\\\\', \\\\\\'run-complete\\\\\\', \\\\\\'run-comsub\\\\\\', \\\\\\'run-comsub-eof\\\\\\', \\\\\\'run-comsub-posix\\\\\\', \\\\\\'run-comsub2\\\\\\', \\\\\\'run-cond\\\\\\', \\\\\\'run-coproc\\\\\\', \\\\\\'run-cprint\\\\\\', \\\\\\'run-dbg-support\\\\\\', \\\\\\'run-dbg-support2\\\\\\', \\\\\\'run-dirstack\\\\\\', \\\\\\'run-dollars\\\\\\', \\\\\\'run-dynvar\\\\\\', \\\\\\'run-errors\\\\\\', \\\\\\'run-execscript\\\\\\', \\\\\\'run-exp-tests\\\\\\', \\\\\\'run-exportfunc\\\\\\', \\\\\\'run-extglob\\\\\\', \\\\\\'run-extglob2\\\\\\', \\\\\\'run-extglob3\\\\\\', \\\\\\'run-func\\\\\\', \\\\\\'run-getopts\\\\\\', \\\\\\'run-glob-bracket\\\\\\', \\\\\\'run-glob-test\\\\\\', \\\\\\'run-globstar\\\\\\', \\\\\\'run-heredoc\\\\\\', \\\\\\'run-herestr\\\\\\', \\\\\\'run-histexpand\\\\\\', \\\\\\'run-history\\\\\\', \\\\\\'run-ifs\\\
        \\\\', \\\\\\'run-ifs-posix\\\\\\', \\\\\\'run-input-test\\\\\\', \\\\\\'run-intl\\\\\\', \\\\\\'run-invert\\\\\\', \\\\\\'run-invocation\\\\\\', \\\\\\'run-iquote\\\\\\', \\\\\\'run-jobs\\\\\\', \\\\\\'run-lastpipe\\\\\\', \\\\\\'run-mapfile\\\\\\', \\\\\\'run-more-exp\\\\\\', \\\\\\'run-nameref\\\\\\', \\\\\\'run-new-exp\\\\\\', \\\\\\'run-nquote\\\\\\', \\\\\\'run-nquote1\\\\\\', \\\\\\'run-nquote2\\\\\\', \\\\\\'run-nquote3\\\\\\', \\\\\\'run-nquote4\\\\\\', \\\\\\'run-nquote5\\\\\\', \\\\\\'run-parser\\\\\\', \\\\\\'run-posix2\\\\\\', \\\\\\'run-posixexp\\\\\\', \\\\\\'run-posixexp2\\\\\\', \\\\\\'run-posixpat\\\\\\', \\\\\\'run-posixpipe\\\\\\', \\\\\\'run-precedence\\\\\\', \\\\\\'run-printf\\\\\\', \\\\\\'run-procsub\\\\\\', \\\\\\'run-quote\\\\\\', \\\\\\'run-quotearray\\\\\\', \\\\\\'run-read\\\\\\', \\\\\\'run-redir\\\\\\', \\\\\\'run-rhs-exp\\\\\\', \\\\\\'run-rsh\\\\\\', \\\\\\'run-set-e\\\\\\', \\\\\\'run-set-x\\\\\\', \\\\\\'run-shopt\\\\\\', \\\\\\'run-strip\\\\\\\
        ', \\\\\\'run-test\\\\\\', \\\\\\'run-tilde\\\\\\', \\\\\\'run-tilde2\\\\\\', \\\\\\'run-trap\\\\\\', \\\\\\'run-type\\\\\\', \\\\\\'run-varenv\\\\\\', \\\\\\'run-vredir\\\\\\']\\\\nlines=text.splitlines()\\\\nfor name in manifest:assert sum(x==name for x in lines)==1,(\\\\\\'missing/duplicate Bash suite\\\\\\',name)\\\\n# Upstream run-all exits0 even when diff fails, so exit code alone is insufficient.\\\\ndiffs=[x for x in lines if re.match(r\\\\\\'^[<>] \\\\\\',x) or re.fullmatch(r\\\\\\'\\\\\\\\d+(?:,\\\\\\\\d+)?[acd]\\\\\\\\d+(?:,\\\\\\\\d+)?\\\\\\',x)]\\\\nassert not diffs,(\\\\\\'Bash output differences require review\\\\\\',diffs[:100])\\\\nassert not re.search(r\\\\\\'(?:^|\\\\\\\\n)(?:FAIL|ERROR):\\\\\\',text),text[-4000:]\\\\npathlib.Path(\\\\\\'/nav-build-metadata/tests/bash-audit.json\\\\\\').write_text(json.dumps({\\\\\\'run_scripts\\\\\\':manifest,\\\\\\'unexpected_diffs\\\\\\':diffs},indent=2)+\\\\\\'\\\\\\\\n\\\\\\')\\\\nprint(\\\\\\'NAV_BASH_ALL_86_RUN_SCRIPTS_NO_DIFF_OK\\\
        \\\\',flush=True)\\\\nBASH_AUDIT\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE bash-5.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- bash-5.3\\\\ncd /sources\\\\ntar -xf libtool-2.6.2.tar.xz\\\\ncd libtool-2.6.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE libtool-2.6.2\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nrun_test libtool make check\\\\nmake install\\\\nrm -fv /usr/lib/libltdl.a\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE libtool-2.6.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- libtool-2.6.2\\\\ncd /sources\\\\ntar -xf gdbm-1.26.tar.gz\\\\ncd gdbm-1.26\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE gdbm-1.26\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --enable-libgdbm-compat\\\\nmake\\\\nrun_test gdbm make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gdbm-1.26\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- gdbm-1.26\\\\ncd /sources\\\\ntar -xf gperf-3.3.tar.gz\\\\ncd gperf-3.3\\\\nprintf\
        \ \\\\\\'BEGIN_FINAL_PACKAGE gperf-3.3\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr --docdir=/usr/share/doc/gperf-3.3\\\\nmake\\\\nrun_test gperf make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gperf-3.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- gperf-3.3\\\\ncd /sources\\\\ntar -xf expat-2.8.3.tar.xz\\\\ncd expat-2.8.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE expat-2.8.3\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/expat-2.8.3\\\\nmake\\\\nrun_test expat make check\\\\nmake install\\\\ninstall -v -m644 doc/*.{html,css} /usr/share/doc/expat-2.8.3\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE expat-2.8.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- expat-2.8.3\\\\ncd /sources\\\\ntar -xf inetutils-2.8.tar.gz\\\\ncd inetutils-2.8\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE inetutils-2.8\\\\\\\\n\\\\\\'\\\\nsed -i \\\\\\'s/def HAVE_TERMCAP_TGETENT/ 1/\\\\\\' telnet/telnet.c\\\\n./configure\
        \ --prefix=/usr        \\\\\\\\\\\\n            --bindir=/usr/bin    \\\\\\\\\\\\n            --localstatedir=/var \\\\\\\\\\\\n            --disable-logger     \\\\\\\\\\\\n            --disable-whois      \\\\\\\\\\\\n            --disable-rcp        \\\\\\\\\\\\n            --disable-rexec      \\\\\\\\\\\\n            --disable-rlogin     \\\\\\\\\\\\n            --disable-rsh        \\\\\\\\\\\\n            --disable-servers\\\\nmake\\\\nrun_test inetutils make check\\\\nmake install\\\\nmv -v /usr/{,s}bin/ifconfig\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE inetutils-2.8\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- inetutils-2.8\\\\ncd /sources\\\\ntar -xf less-704.tar.gz\\\\ncd less-704\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE less-704\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr --sysconfdir=/etc\\\\nmake\\\\nrun_test less make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE less-704\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- less-704\\\\ncd /sources\\\\ntar -xf perl-5.44.0.tar.xz\\\
        \\ncd perl-5.44.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE perl-5.44.0\\\\\\\\n\\\\\\'\\\\nexport BUILD_ZLIB=False\\\\nexport BUILD_BZIP2=0\\\\nsh Configure -des                                          \\\\\\\\\\\\n             -D prefix=/usr                                \\\\\\\\\\\\n             -D vendorprefix=/usr                          \\\\\\\\\\\\n             -D privlib=/usr/lib/perl5/5.44/core_perl      \\\\\\\\\\\\n             -D archlib=/usr/lib/perl5/5.44/core_perl      \\\\\\\\\\\\n             -D sitelib=/usr/lib/perl5/5.44/site_perl      \\\\\\\\\\\\n             -D sitearch=/usr/lib/perl5/5.44/site_perl     \\\\\\\\\\\\n             -D vendorlib=/usr/lib/perl5/5.44/vendor_perl  \\\\\\\\\\\\n             -D vendorarch=/usr/lib/perl5/5.44/vendor_perl \\\\\\\\\\\\n             -D man1dir=/usr/share/man/man1                \\\\\\\\\\\\n             -D man3dir=/usr/share/man/man3                \\\\\\\\\\\\n             -D pager=\"/usr/bin/less -isR\"                \
        \ \\\\\\\\\\\\n             -D useshrplib                                 \\\\\\\\\\\\n             -D usethreads\\\\nmake\\\\nTEST_JOBS=2 run_test perl make test_harness\\\\nmake install\\\\nunset BUILD_ZLIB BUILD_BZIP2\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE perl-5.44.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- perl-5.44.0\\\\nldconfig\\\\nbash -c \\\\\\'set -euo pipefail; a=(19 23); test \"$((a[0]+a[1]))\" = 42; diff <(printf nav) <(printf nav)\\\\\\'\\\\nperl -Mthreads -e \\\\\\'my $t=threads->create(sub{return 42}); exit($t->join()!=42)\\\\\\'\\\\nperl -MCompress::Zlib -MCompress::Raw::Bzip2 -e \\\\\\'print \"NAV_PERL_COMPRESSION_MODULES_OK\\\\\\\\n\"\\\\\\'\\\\nxmlwf -v\\\\nlibtool --version\\\\ngperf --version\\\\nless --version\\\\nprintf \\\\\\'NAV_SHELL_TOOLS_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 Bash Libtool GDBM Gperf Expat Inetutils Less Perl installed and test logs retained. No boot or desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\\
        nprintf \\\\\\'NAV_SHELL_TOOLS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\"\
        \ /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/shell-tools.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/shell-tools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n\
        \ while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_BASH','NAV_SHELL','NAV_PERL','NAV_BISON','NAV_TESTER'])))\n\
        NAV_GUARD\n"
    - name: Preserve tested shell and build tools checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-shell-tools-v1
