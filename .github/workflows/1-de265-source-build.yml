name: NAV libde2651.1.3 source default build installed API TRANSITIONAL
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-de265-source-build
  cancel-in-progress: false
jobs:
  de265:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-aom-root.tar.zst /mnt/nav-de265-root.tar.zst; do\n test ! -e \"$bundle\"\n sudo install -o\
        \ \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c '%u:%g:%a'\
        \ \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n printf\
        \ 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\" proof\n\
        \ zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\"\
        \ \"$probe/recovered\"\n # Match actions/cache extraction semantics, not only bundle writer access.\n test\
        \ \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n\
        \ relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\"\
        \ -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n\
        \ set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\
        \n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program\
        \ unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_DE265_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_DE265_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_DE265_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_DE265_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_DE265_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_DE265_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore verified libaom baseline
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-aom-root.tar.zst
        key: nav-blfs13.1-x86_64-aom-open-v1
        fail-on-cache-miss: true
    - name: Verify and extract libaom baseline
      shell: bash
      run: 'set -euo pipefail

        printf "e32ea5ff706784cbdb9cece011b3bf32381e425db3068015d6bc61f51c320a31  /mnt/nav-aom-root.tar.zst\n" |
        sha256sum -c -

        zstd -t /mnt/nav-aom-root.tar.zst

        tar --zstd -xf /mnt/nav-aom-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/aom/AOM-TRANSITIONAL-OPEN.json

        '
    - name: Build install libde265 original defaults, no upstream test suite, installed API checks
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda :\
        \ int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\n\
        assert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024\
        \ ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs\
        \ LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\nmkdir -p \"$LFS/nav-build-metadata/libde265\"\\npython3\
        \ - <<\\'DOWNLOAD\\'\\nfrom pathlib import Path,PurePosixPath\\nimport urllib.request,hashlib,tarfile,json\\\
        nsrc={\\'filename\\': \\'libde265-1.1.3.tar.gz\\', \\'url\\': \\'https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz\\\
        ', \\'sha256\\': \\'554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905\\', \\'md5\\': \\'71a05dbe69ce4042924cef4051d12b52\\\
        ', \\'top\\': \\'libde265-1.1.3\\'}\\np=Path(\\'/mnt/nav-lfs/sources\\')/src[\\'filename\\']\\nwith urllib.request.urlopen(src[\\\
        'url\\'],timeout=120)as r:p.write_bytes(r.read())\\nassert hashlib.file_digest(p.open(\\'rb\\'),\\'sha256\\\
        ').hexdigest()==src[\\'sha256\\']\\nwith tarfile.open(p)as t:\\n for m in t.getmembers():\\n  q=PurePosixPath(m.name);assert\
        \ not q.is_absolute()and \\'..\\'not in q.parts and q.parts[0]==src[\\'top\\']\\n  assert m.isfile()or m.isdir(),m.name\\\
        n t.extractall(p.parent,filter=\\'data\\')\\nPath(\\'/mnt/nav-lfs/nav-build-metadata/libde265/source-lock.json\\\
        ').write_text(json.dumps(src,indent=2))\\nprint(\\'NAV_DE265_SOURCE_SHA256_OK\\')\\nDOWNLOAD\\npython3 -\
        \ <<\\'INNER\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/libde265-stage.sh\\').write_text(\\\
        'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport PATH=/usr/bin:/usr/sbin:/bin:/sbin LANG=C.UTF-8\
        \ MAKEFLAGS=-j2\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\\nP=/nav-build-metadata/libde265\\\
        \\nmkdir -p \"$P\"\\\\ncd /sources/libde265-1.1.3\\\\ncmake -S . -B build -D CMAKE_INSTALL_PREFIX=/usr -D\
        \ CMAKE_BUILD_TYPE=Release > \"$P/configure.log\" 2>&1\\\\ncmake --build build -j2 > \"$P/build.log\" 2>&1\\\
        \\ncp build/CMakeCache.txt \"$P/CMakeCache.txt\"\\\\nctest --test-dir build --show-only=json-v1 > \"$P/test-discovery.json\"\
        \ 2> \"$P/test-discovery-stderr.log\"\\\\npython3 - <<\\\\\\'NOTEST\\\\\\'\\\\nimport json,re\\\\nfrom pathlib\
        \ import Path\\\\np=Path(\\\\\\'/nav-build-metadata/libde265\\\\\\');d=json.loads((p/\\\\\\'test-discovery.json\\\
        \\\\').read_text());assert d[\\\\\\'tests\\\\\\']==[]\\\\nfiles=list(Path(\\\\\\'.\\\\\\').rglob(\\\\\\\
        'CMakeLists.txt\\\\\\'))+list(Path(\\\\\\'.\\\\\\').rglob(\\\\\\'*.cmake\\\\\\'))\\\\nhits=[str(f) for f\
        \ in files if \\\\\\'build\\\\\\'not in f.parts and re.search(r\\\\\\'\\\\\\\\b(add_test|enable_testing)\\\
        \\\\\\s*\\\\\\\\(\\\\\\',f.read_text(),re.I)]\\\\nassert not hits,hits\\\\n(p/\\\\\\'test-classification.json\\\
        \\\\').write_text(json.dumps({\\\\\\'classification\\\\\\':\\\\\\'NO_UPSTREAM_TEST_SUITE, not a test pass\\\
        \\\\',\\\\\\'original_CTest_tests\\\\\\':0,\\\\\\'source_CMake_test_registrations\\\\\\':hits,\\\\\\'decoder_roundtrip\\\
        \\\\':\\\\\\'OPEN, cross-codec check follows x265 installation\\\\\\'},indent=2))\\\\nNOTEST\\\\ncmake --install\
        \ build > \"$P/install.log\" 2>&1\\\\nldconfig\\\\npkg-config --modversion libde265 > \"$P/installed-version.log\"\
        \\\\ntest \"$(cat \"$P/installed-version.log\")\" = 1.1.3\\\\ntest -f /usr/include/libde265/de265.h\\\\\
        ntest -f /usr/lib/libde265.so\\\\nldd /usr/bin/dec265 > \"$P/installed-linkage.log\" 2>&1\\\\n! grep -q\
        \ \\\\\\'not found\\\\\\' \"$P/installed-linkage.log\"\\\\n/usr/bin/dec265 --help > \"$P/installed-cli-help.log\"\
        \ 2>&1\\\\ncat > /tmp/nav-de265-api.c <<\\\\\\'API\\\\\\'\\\\n#include <libde265/de265.h>\\\\n#include <stdio.h>\\\
        \\n#include <string.h>\\\\nint main(void) {\\\\n  if (strcmp(de265_get_version(), \"1.1.3\")) return 1;\\\
        \\n  de265_decoder_context *ctx = de265_new_decoder();\\\\n  if (!ctx) return 2;\\\\n  if (de265_free_decoder(ctx)\
        \ != DE265_OK) return 3;\\\\n  puts(\"NAV_DE265_INSTALLED_API_VERSION_CONTEXT_FREE_PASS\");\\\\n  return\
        \ 0;\\\\n}\\\\nAPI\\\\ncc /tmp/nav-de265-api.c $(pkg-config --cflags --libs libde265) -o /tmp/nav-de265-api\\\
        \\n/tmp/nav-de265-api > \"$P/installed-api.log\" 2>&1\\\\nrm /tmp/nav-de265-api.c /tmp/nav-de265-api\\\\\
        npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json\\\\np=Path(\\\\\\'/nav-build-metadata/libde265\\\
        \\\\');a={\\\\\\'classification\\\\\\':\\\\\\'TRANSITIONAL ONLY, not OS acceptance; all inherited gaps remain\
        \ OPEN\\\\\\',\\\\\\'version\\\\\\':\\\\\\'1.1.3\\\\\\',\\\\\\'source_patches\\\\\\':[],\\\\\\'build\\\\\
        \\':\\\\\\'PASS, book Release shared defaults\\\\\\',\\\\\\'upstream_test_suite\\\\\\':\\\\\\'NONE, not\
        \ a suite pass\\\\\\',\\\\\\'installed_version_linkage_cli_API\\\\\\':\\\\\\'PASS\\\\\\',\\\\\\'decoder_roundtrip\\\
        \\\\':\\\\\\'OPEN, follows x265\\\\\\',\\\\\\'inherited_audit\\\\\\':\\\\\\'/nav-build-metadata/aom/AOM-TRANSITIONAL-OPEN.json\\\
        \\\\',\\\\\\'jobs\\\\\\':2,\\\\\\'memory_cap_KiB\\\\\\':4194304}\\\\n(p/\\\\\\'LIBDE265-TRANSITIONAL-OPEN.json\\\
        \\\\').write_text(json.dumps(a,indent=2));(p/\\\\\\'BUNDLE-NOTES.txt\\\\\\').write_text(\\\\\\'TRANSITIONAL\
        \ ONLY. NOT OS ACCEPTANCE. All inherited gaps remain OPEN.\\\\\\\\nlibde2651.1.3 has no upstream CMake test\
        \ suite; zero tests are not a pass. Installed version/linkage/CLI/API checked. Decoder roundtrip remains\
        \ OPEN until x265 cross-codec validation.\\\\\\\\n\\\\\\')\\\\nprint(\\\\\\'NAV_DE265_BUILD_INSTALL_API_PASS_TRANSITIONAL_NO_SUITE\\\
        \\\\')\\\\nAUDIT\\\\n\\')\\nINNER\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\
        \\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT\\'\\nset -euo pipefail\\\
        nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\\
        nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t\
        \ sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\"\
        \ ];then install -d -m1777 \"$LFS$(realpath /dev/shm)\";else mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\
        ;fi\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 LC_ALL=POSIX\
        \ /bin/bash --noprofile --norc /sources/libde265-stage.sh\\nNAV_MOUNT\\nsudo python3 - <<\\'CLEAN\\'\\nfrom\
        \ pathlib import Path\\nimport shutil\\nroot=Path(\\'/mnt/nav-lfs/sources\\');p=root/\\'libde265-1.1.3\\\
        ';assert p.is_dir()and not p.is_symlink();shutil.rmtree(p)\\nfor name in [\\'libde265-stage.sh\\',\\'libde265-1.1.3.tar.gz\\\
        ']:(root/name).unlink()\\nassert not (root/\\'numpy-tooling-prefix\\').exists()\\nCLEAN\\nsudo chown -hR\
        \ \"$(id -u):$(id -g)\" \"$LFS\"\\nsudo chown root:root \"$LFS/usr/bin/fusermount3\"\\nsudo chmod 4755 \"\
        $LFS/usr/bin/fusermount3\"\\ntest \"$(du -sb \"$LFS\"|cut -f1)\" -lt 5368709120\\n')\nstart = time.monotonic()\n\
        log = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT,\
        \ start_new_session=True, preexec_fn=lambda : os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:2]))\n\
        try:\n    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n        available =\
        \ mem()\n        if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start > 315\
        \ * 60:\n            raise RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds':\
        \ round(time.monotonic() - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n\
        \        time.sleep(20)\n    if proc.returncode:\n        raise RuntimeError('source-build failed with status\
        \ ' + str(proc.returncode))\nfinally:\n    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n\
        \        try:\n            proc.wait(timeout=10)\n        except subprocess.TimeoutExpired:\n          \
        \  os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n\
        \    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK',\
        \ 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST',\
        \ 'NAV_BISON', 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect',\
        \ 'NAV_GST', 'NAV_FUSE', 'NAV_PORTAL'])))))\n    import base64, gzip, subprocess, os, hashlib, json\n  \
        \  mode = 'build'\n    p = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/libde265')\n    manifest = {'mode':\
        \ mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\n\n    def emit(name, data):\n        data\
        \ = gzip.compress(data, mtime=0)\n        for i in range(0, len(data), 3000):\n            print('NAV_DE265_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\n    try:\n        listing\
        \ = subprocess.check_output(['sudo', 'find', str(p), '-type', 'f', '-print0']).split(b'\\x00')\n    except\
        \ Exception as ex:\n        listing = []\n        manifest['errors'].append({'area': str(p), 'error': repr(ex)})\n\
        \    for item in sorted((x for x in listing if x)):\n        f = pathlib.Path(os.fsdecode(item))\n     \
        \   rel = str(f.relative_to(p))\n        wanted = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/')))\
        \ or (mode == 'shard' and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list')))\
        \ or (mode == 'examples' and rel.startswith('original-examples'))\n        if wanted:\n            try:\n\
        \                data = subprocess.check_output(['sudo', 'cat', str(f)])\n                name = rel.replace('/',\
        \ '-').replace('.', '_').upper()\n                manifest['files'][name] = {'source': rel, 'bytes': len(data),\
        \ 'sha256': hashlib.sha256(data).hexdigest()}\n                emit(name, data)\n            except Exception\
        \ as ex:\n                manifest['errors'].append({'file': rel, 'error': repr(ex)})\n    emit('EXPORT-MANIFEST_JSON',\
        \ json.dumps(manifest, indent=2).encode())\n    if manifest['errors']:\n        raise RuntimeError('independent\
        \ evidence export errors: ' + repr(manifest['errors']))\n\nNAV_GUARD\n"
    - name: Verify complete root and live conservative cache budget no pruning
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        root=$(du -sb /mnt/nav-lfs | cut -f1)

        test "$root" -lt 5368709120

        test -f /mnt/nav-lfs/nav-build-metadata/libde265/LIBDE265-TRANSITIONAL-OPEN.json

        tar --zstd -cf /mnt/nav-de265-root.tar.zst -C /mnt/nav-lfs .

        zstd -t /mnt/nav-de265-root.tar.zst

        tar --zstd -tf /mnt/nav-de265-root.tar.zst > /tmp/nav-aom-archive-members

        ! grep -Eq ''^./sources/(numpy-tooling-prefix|libaom-3.15.3/|aom-testdata/|libde265-1.1.3/)''  /tmp/nav-aom-archive-members

        grep -qx ''./usr/include/libde265/de265.h'' /tmp/nav-aom-archive-members

        python3 - <<''BUDGET''

        import ctypes,ctypes.util,urllib.request,json,os,hashlib

        from pathlib import Path

        p=Path(''/mnt/nav-de265-root.tar.zst'');size=p.stat().st_size

        z=ctypes.CDLL(ctypes.util.find_library(''zstd''));z.ZSTD_compressBound.argtypes=[ctypes.c_size_t];z.ZSTD_compressBound.restype=ctypes.c_size_t

        # Cache contains this one fixed-size regular file. One MiB covers tar/PAX headers and end blocks; 64MiB
        covers frame/chunk protocol overhead.

        worst=z.ZSTD_compressBound(size+1024**2)+64*1024**2

        req=urllib.request.Request(''https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/actions/caches?per_page=100'',headers={''Authorization'':''Bearer
        ''+os.environ[''GITHUB_TOKEN''],''Accept'':''application/vnd.github+json''})

        with urllib.request.urlopen(req,timeout=60)as r:data=json.load(r)

        assert data[''total_count'']==len(data[''actions_caches''])<=100

        keys={x[''key'']for x in data[''actions_caches'']}

        for key in [''nav-blfs13.1-x86_64-git-open-v1'',''nav-blfs13.1-x86_64-giflib-open-v1'']+[''nav-lfs13.1-x86_64-''+x+''-v1''for
        x in [''final-gcc'',''gcc-test-runtime'',''gcc-test-cxx'',''gcc-test-c'',''access-tools'',''final-math'']]:assert
        key in keys,key

        assert ''nav-blfs13.1-x86_64-jxl-open-v1''in keys

        assert ''nav-aom-3.15.3-disposable-source-tests-v1''not in keys

        assert ''nav-blfs13.1-x86_64-aom-open-v1''in keys

        assert ''nav-blfs13.1-x86_64-de265-open-v1''not in keys

        existing=sum(x[''size_in_bytes'']for x in data[''actions_caches'']);print(''NAV_DE265_ROOT_MEASURED_CACHE_GATE'',json.dumps({''existing'':existing,''bundle_bytes'':size,''bundle_sha256'':hashlib.file_digest(p.open(''rb''),''sha256'').hexdigest(),''new_cache_upper'':worst,''worst_total'':existing+worst,''limit'':10*1024**3}),flush=True)

        assert existing+worst<10*1024**3

        BUDGET

        '
    - name: Save TRANSITIONAL libde265 root with inherited gaps OPEN
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-de265-root.tar.zst
        key: nav-blfs13.1-x86_64-de265-open-v1
