name: NAV source glslang Vulkan foundation strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  vulkan-prep:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-spirv-v1
        fail-on-cache-miss: true
    - name: Build glslang Vulkan foundation strict tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"glslang-16.5.0.tar.gz\", \"url\": \"https://github.com/KhronosGroup/glslang/archive/16.5.0/glslang-16.5.0.tar.gz\", \"bytes\": 4590436, \"sha256\": \"01af17195fbeb59e39e31e9506de35bb39dfd35807ea0c9a1a99d7d1183ddd45\", \"book_md5\"\
        : \"79e949d6d50cc167e7d5307afb04c41a\"}, {\"filename\": \"Vulkan-Headers-vulkan-sdk-1.4.357.0.tar.gz\", \"url\": \"https://github.com/KhronosGroup/Vulkan-Headers/archive/vulkan-sdk-1.4.357.0/Vulkan-Headers-vulkan-sdk-1.4.357.0.tar.gz\", \"bytes\": 3376379, \"sha256\": \"e87dce08116151f6b6d7de6b6faf41498e87e6cf848ff16fa3bd5402190ad4a3\", \"book_md5\": \"64a23bb12e95a2017004d72569132929\"}, {\"filename\": \"Vulkan-Loader-vulkan-sdk-1.4.357.0.tar.gz\", \"url\": \"https://github.com/KhronosGroup/Vulkan-Loader/archive/vulkan-sdk-1.4.357.0/Vulkan-Loader-vulkan-sdk-1.4.357.0.tar.gz\", \"bytes\": 1820868, \"sha256\": \"54f2537df22313768da0317dda2abdaaab7711b4081c48c869a79db343d0ae70\", \"book_md5\": \"ce35f16bee47e9faf0a50d682a2db77d\"}, {\"filename\": \"googletest-1.14.0.tar.gz\", \"url\": \"https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz\", \"bytes\": 867764, \"sha256\": \"8ad598c73ad796e0d8280b082cebd82a630d73e73cd3c70057938a6501bba5d7\", \"upstream_pin\": \"v1.14.0\
        \ from glslang16.5.0 and Vulkan-Loader1.4.357.0 known_good.json\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/vulkan-prep.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\\
        n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n tail -80 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nulimit -c 0\\\\npkg-config --modversion wayland-client wayland-protocols libdrm\\\\nllvm-config --version\\\\ncd /sources\\\\ntar -xf glslang-16.5.0.tar.gz\\\\ncd glslang-16.5.0\\\\nmkdir -p External/googletest\\\\ntar -xf /sources/googletest-1.14.0.tar.gz -C External/googletest --strip-components=1\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \\\\\\\\\\\\n -DALLOW_EXTERNAL_SPIRV_TOOLS=ON -DBUILD_SHARED_LIBS=ON\
        \ -DGLSLANG_TESTS=ON \\\\\\\\\\\\n -DFETCHCONTENT_FULLY_DISCONNECTED=ON\\\\nninja -C build -j2\\\\ntest -x build/gtests/glslangtests\\\\nchown -R tester:tester .\\\\nrun_test glslang su tester -c \\\\\\'ulimit -c 0; TZ=UTC ctest --test-dir build --output-on-failure --no-tests=error -j2 --timeout 300\\\\\\'\\\\nninja -C build install\\\\nldconfig\\\\nglslang --version\\\\ncat > /tmp/nav-shader.vert <<\\\\\\'GLSL_SMOKE\\\\\\'\\\\n#version 450\\\\nvoid main(){ gl_Position=vec4(0.0,0.0,0.0,1.0); }\\\\nGLSL_SMOKE\\\\nglslang -V /tmp/nav-shader.vert -o /tmp/nav-shader.spv\\\\nspirv-val /tmp/nav-shader.spv\\\\nprintf \\\\\\'NAV_GLSLANG_SHADER_VALIDATION_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf glslang-16.5.0\\\\ntar -xf Vulkan-Headers-vulkan-sdk-1.4.357.0.tar.gz\\\\ncd Vulkan-Headers-vulkan-sdk-1.4.357.0\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DVULKAN_HEADERS_ENABLE_TESTS=ON\\\\nninja -C build -j2\\\\nchown -R tester:tester .\\\\nrun_test vulkan-headers\
        \ su tester -c \\\\\\'ulimit -c 0; TZ=UTC ctest --test-dir build --output-on-failure --no-tests=error -j2 --timeout 300\\\\\\'\\\\nninja -C build install\\\\ncd /sources\\\\nrm -rf Vulkan-Headers-vulkan-sdk-1.4.357.0\\\\ntar -xf googletest-1.14.0.tar.gz\\\\ntar -xf Vulkan-Loader-vulkan-sdk-1.4.357.0.tar.gz\\\\ncd Vulkan-Loader-vulkan-sdk-1.4.357.0\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \\\\\\\\\\\\n -DCMAKE_SKIP_INSTALL_RPATH=ON -DBUILD_TESTS=ON -DUPDATE_DEPS=OFF \\\\\\\\\\\\n -DGOOGLETEST_INSTALL_DIR=/sources/googletest-1.14.0 -DFETCHCONTENT_FULLY_DISCONNECTED=ON\\\\nninja -C build -j2\\\\ntest -x build/tests/test_regression\\\\ntest -x build/tests/test_fuzzing\\\\ntest -x build/tests/test_threading\\\\nchown -R tester:tester .\\\\nrun_test vulkan-loader su tester -c \\\\\\'ulimit -c 0; TZ=UTC ctest --test-dir build --output-on-failure --no-tests=error -j2 --timeout 300\\\\\\'\\\\nninja -C build install\\\\nldconfig\\\\npkg-config\
        \ --modversion vulkan\\\\ncat > /tmp/nav-vulkan.c <<\\\\\\'VULKAN_SMOKE\\\\\\'\\\\n#include <vulkan/vulkan.h>\\\\n#include <stdio.h>\\\\nint main(void) { uint32_t version=0; VkResult rc=vkEnumerateInstanceVersion(&version); if(rc!=VK_SUCCESS || version<VK_API_VERSION_1_3) return 1; printf(\"NAV_VULKAN_LOADER_API_SMOKE_OK %u.%u.%u\\\\\\\\n\",VK_API_VERSION_MAJOR(version),VK_API_VERSION_MINOR(version),VK_API_VERSION_PATCH(version)); return 0; }\\\\nVULKAN_SMOKE\\\\ngcc /tmp/nav-vulkan.c -o /tmp/nav-vulkan $(pkg-config --cflags --libs vulkan)\\\\n/tmp/nav-vulkan\\\\ncd /sources\\\\nrm -rf Vulkan-Loader-vulkan-sdk-1.4.357.0 googletest-1.14.0\\\\nprintf \\\\\\'BLFS13.1 glslang16.5.0 Vulkan-Headers1.4.357.0 and Vulkan-Loader1.4.357.0 configured strict nonroot suites, pinned upstream googletest1.14.0. Shader compile-validation and loader version API smoke only, no real GPU or rendering claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm\
        \ -rf -- {} +\\\\nprintf \\\\\\'NAV_VULKAN_PREP_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf\
        \ \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/vulkan-prep.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/vulkan-prep.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 3584\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n\
        try:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_VULKAN','NAV_GLSLANG','NAV_TEST','NAV_BISON','NAV_TESTER'])))\n\
        NAV_GUARD\n"
    - name: Preserve tested Vulkan foundation
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-vulkan-prep-v1
