name: NAV source certificate trust strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  trust-base:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-build-libs-v1
        fail-on-cache-miss: true
    - name: Build libtasn1 p11kit and Mozilla trust store
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"libtasn1-4.21.0.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/libtasn1/libtasn1-4.21.0.tar.gz\", \"bytes\": 1816537, \"book_md5\": \"2ee1d9f3aa66f1e308c46a283aa9a8c2\", \"sha256\": \"1d8a444a223cc5464240777346e125de51d8e6abf0b8bac742ac84609167dc87\"\
        }, {\"filename\": \"p11-kit-0.26.5.tar.xz\", \"url\": \"https://github.com/p11-glue/p11-kit/releases/download/0.26.5/p11-kit-0.26.5.tar.xz\", \"bytes\": 1082584, \"book_md5\": \"308306e889850bff08fae74ae7897a21\", \"sha256\": \"f2cc09111e44bf3fea58f023180b33acea90aa82d042d6fbb623fbc5ba033bb7\"}, {\"filename\": \"make-ca-1.16.1.tar.gz\", \"url\": \"https://github.com/lfs-book/make-ca/archive/v1.16.1/make-ca-1.16.1.tar.gz\", \"bytes\": 38185, \"book_md5\": \"bf9cea2d24fc5344d4951b49f275c595\", \"sha256\": \"98c7e6fded1938b972d0177b5d5e925d318be87f84ee9e4cad680656a8c29414\"}, {\"filename\": \"mozilla-certdata.txt\", \"url\": \"https://hg-edge.mozilla.org/projects/nss/raw-file/tip/lib/ckfw/builtins/certdata.txt\", \"bytes\": 1338990, \"sha256\": \"6d177e33ab54b338edfee24dc3868585833636716a320a725137ab4a15927292\", \"retrieved\": \"2026-11-15\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\\
        n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/trust-base.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE\
        \ %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf libtasn1-4.21.0.tar.gz\\\\ncd libtasn1-4.21.0\\\\n./configure --prefix=/usr --disable-static\\\\nmake -j2\\\\nrun_test libtasn1 make -j2 check\\\\nmake install\\\\ncd /sources\\\\nrm -rf libtasn1-4.21.0\\\\ntar -xf p11-kit-0.26.5.tar.xz\\\\ncd p11-kit-0.26.5\\\\nsed \\\\\\'20,$ d\\\\\\' -i trust/trust-extract-compat &&\\\\n\\\\ncat >> trust/trust-extract-compat << \"EOF\"\\\\n# Copy existing anchor modifications to /etc/ssl/local\\\\n/usr/libexec/make-ca/copy-trust-modifications\\\\n\\\\n# Update trust stores\\\\n/usr/sbin/make-ca -r\\\\nEOF\\\\nmkdir p11-build &&\\\\ncd    p11-build &&\\\\n\\\\nmeson setup ..            \\\\\\\\\\\\n      --prefix=/usr       \\\\\\\\\\\\n      --buildtype=release \\\\\\\\\\\\n      -D trust_paths=/etc/pki/anchors\
        \ &&\\\\nninja\\\\nrun_test p11-kit meson test --print-errorlogs --num-processes 2\\\\nninja install\\\\nln -sf /usr/libexec/p11-kit/trust-extract-compat /usr/bin/update-ca-certificates\\\\ncd /sources\\\\nrm -rf p11-kit-0.26.5\\\\ntar -xf make-ca-1.16.1.tar.gz\\\\ncd make-ca-1.16.1\\\\nsed \\\\\\'/mktemp/s/-t //\\\\\\' -i make-ca\\\\nmake install\\\\ninstall -vdm755 /etc/ssl/local\\\\nmake-ca -f -C /sources/mozilla-certdata.txt\\\\nldconfig\\\\ntest -s /etc/pki/tls/certs/ca-bundle.crt\\\\nopenssl crl2pkcs7 -nocrl -certfile /etc/pki/tls/certs/ca-bundle.crt | openssl pkcs7 -print_certs -noout >/tmp/nav-trust-certs\\\\npython3 - <<\\\\\\'TRUST_CHECK\\\\\\'\\\\nfrom pathlib import Path\\\\nimport ssl\\\\np=Path(\\\\\\'/tmp/nav-trust-certs\\\\\\').read_text();assert p.count(\\\\\\'subject=\\\\\\')>100\\\\nctx=ssl.create_default_context();assert ctx.cert_store_stats()[\\\\\\'x509_ca\\\\\\']>100\\\\nprint(\\\\\\'NAV_TRUST_ANCHORS_OK\\\\\\',ctx.cert_store_stats())\\\\nTRUST_CHECK\\\\nmkdir\
        \ -p /nav-build-metadata/trust\\\\nsha256sum /sources/mozilla-certdata.txt /etc/pki/tls/certs/ca-bundle.crt > /nav-build-metadata/trust/source-and-bundle.sha256\\\\nprintf \\\\\\'NAV_TRUST_BASE_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf make-ca-1.16.1\\\\nrm mozilla-certdata.txt\\\\nprintf \\\\\\'BLFS13.1 libtasn1+p11-kit suites strict; make-ca store from pinned Mozilla certdata. PythonSSL trust load and >100 CA smoke passed.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_TRUST_BASE_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\
        \\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/trust-base.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"\
        NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/trust-base.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise\
        \ RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_TRUST','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested certificate trust
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-trust-base-v1
