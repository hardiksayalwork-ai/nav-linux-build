name: NAV source Cairo rendering smoke
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  cairo:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-xorg-libs-v1
        fail-on-cache-miss: true
    - name: Build Cairo and verify native rendering
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"cairo-1.18.4.tar.xz\", \"url\": \"https://www.cairographics.org/releases/cairo-1.18.4.tar.xz\", \"bytes\": 32578804, \"book_md5\": \"db575fb41bbda127e0147e401f36f8ac\", \"sha256\": \"445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb\"\
        }]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/cairo.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC\
        \ $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf cairo-1.18.4.tar.xz\\\\ncd cairo-1.18.4\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dglib=enabled -Dfontconfig=enabled -Dfreetype=enabled -Dxlib=enabled -Dxcb=enabled -Dxlib-xcb=enabled -Dpng=enabled -Dzlib=enabled\\\\nninja -C build\\\\n# BLFS13.1 explicitly states Cairo has no working upstream test suite.\\\\n# This build uses a limited native offscreen rendering/API smoke, not a suite pass.\\\\nninja -C build install\\\\nldconfig\\\\ncat > /tmp/nav-cairo-smoke.c <<\\\\\\'C\\\\\\'\\\\n#include <cairo.h>\\\\n#include <cairo-pdf.h>\\\\n#include <cairo-svg.h>\\\\\
        n#include <stdio.h>\\\\nstatic void draw(cairo_t *c){\\\\n cairo_set_source_rgb(c,0.94,0.95,0.97);cairo_paint(c);\\\\n cairo_set_source_rgb(c,0.10,0.18,0.28);cairo_rectangle(c,32,28,256,144);cairo_fill(c);\\\\n cairo_set_source_rgb(c,0.3,0.65,0.84);cairo_arc(c,160,100,48,0,6.283185307179586);cairo_fill(c);\\\\n cairo_set_source_rgb(c,1,1,1);cairo_set_line_width(c,6);cairo_move_to(c,136,102);cairo_line_to(c,153,119);cairo_line_to(c,186,79);cairo_stroke(c);\\\\n}\\\\nint main(void){\\\\n cairo_surface_t*s=cairo_image_surface_create(CAIRO_FORMAT_ARGB32,320,200);cairo_t*c=cairo_create(s);draw(c);if(cairo_status(c)||cairo_surface_status(s))return 1;\\\\n if(cairo_surface_write_to_png(s,\"/nav-build-metadata/tests/cairo-smoke.png\"))return 2;cairo_destroy(c);cairo_surface_destroy(s);\\\\n s=cairo_pdf_surface_create(\"/nav-build-metadata/tests/cairo-smoke.pdf\",320,200);c=cairo_create(s);draw(c);cairo_show_page(c);if(cairo_status(c))return 3;cairo_destroy(c);cairo_surface_finish(s);if(cairo_surface_status(s))return\
        \ 4;cairo_surface_destroy(s);\\\\n s=cairo_svg_surface_create(\"/nav-build-metadata/tests/cairo-smoke.svg\",320,200);c=cairo_create(s);draw(c);if(cairo_status(c))return 5;cairo_destroy(c);cairo_surface_finish(s);if(cairo_surface_status(s))return 6;cairo_surface_destroy(s);puts(\"NAV_CAIRO_RENDER_OK\");return 0;\\\\n}\\\\nC\\\\ngcc /tmp/nav-cairo-smoke.c $(pkg-config --cflags --libs cairo cairo-pdf cairo-svg) -o /tmp/nav-cairo-smoke\\\\n/tmp/nav-cairo-smoke\\\\npkg-config --modversion cairo cairo-gobject cairo-xlib cairo-xcb cairo-ft\\\\npython3 - <<\\\\\\'PY\\\\\\'\\\\nimport base64,struct\\\\nfrom pathlib import Path\\\\nb=Path(\\\\\\'/nav-build-metadata/tests/cairo-smoke.png\\\\\\').read_bytes()\\\\nassert b[:8]==b\\\\\\'\\\\\\\\x89PNG\\\\\\\\r\\\\\\\\n\\\\\\\\x1a\\\\\\\\n\\\\\\'\\\\nassert struct.unpack(\\\\\\'>II\\\\\\',b[16:24])==(320,200)\\\\np=Path(\\\\\\'/nav-build-metadata/tests/cairo-smoke.pdf\\\\\\').read_bytes();assert p.startswith(b\\\\\\'%PDF-\\\\\\')\\\\ns=Path(\\\\\
        \\'/nav-build-metadata/tests/cairo-smoke.svg\\\\\\').read_text();assert \\\\\\'<svg\\\\\\' in s\\\\nprint(\\\\\\'NAV_CAIRO_PNG_BASE64\\\\\\',base64.b64encode(b).decode())\\\\nPY\\\\ncd /sources\\\\nrm -rf cairo-1.18.4\\\\nprintf \\\\\\'Cairo BLFS13.1 build; book explicitly says no working upstream suite. Limited native PNG/PDF/SVG vector rendering and enabled backend API smoke only. No display or font rasterization acceptance yet.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_CAIRO_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount\
        \ -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/cairo.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\
        \\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/cairo.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build\
        \ failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_CAIRO','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve Cairo rendering checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-cairo-v1
