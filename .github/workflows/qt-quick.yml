name: NAV QtQuick selected tests and native real glass render
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  qt-quick:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qt-shadertools-v1
        fail-on-cache-miss: true
    - name: Build QtQuick selected upstream tests and native live-background glass smoke
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"qtdeclarative-everywhere-src-6.11.2.tar.xz\", \"url\": \"https://download.qt.io/archive/qt/6.11/6.11.2/submodules/qtdeclarative-everywhere-src-6.11.2.tar.xz\", \"bytes\": 38780392, \"sha256\": \"215b7b70517e380123eabc6b92243f3c47b6f016a91d126057dbe53551c6b430\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/qt-quick.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 LC_ALL=POSIX PATH=/opt/qt6/bin:/usr/bin:/usr/sbin\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/qtquick\\\\ncd /sources\\\\ntar -xf qtdeclarative-everywhere-src-6.11.2.tar.xz\\\\ncd qtdeclarative-everywhere-src-6.11.2\\\\n/opt/qt6/bin/qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_BUILD_TESTS=ON -DQT_BUILD_TESTS_BY_DEFAULT=OFF -DQT_BUILD_EXAMPLES=OFF\\\\ncmake --build build --parallel 2\\\\ncmake --build build --parallel 2 --target tst_qjsprimitivevalue tst_qqmlerror tst_geometry tst_qquicktransform tst_qquickshadereffect\\\\ncd build\\\\nctest --show-only=json-v1 > /nav-build-metadata/qtquick/configured-tests.json\\\\ncmake --install .\\\\nldconfig\\\\nXvfb :98 -screen 0 1024x768x24 -nolisten tcp -ac > /nav-build-metadata/tests/qtquick-xvfb.log 2>&1 &\\\\nxv=$!\\\\ntrap \\\\\\'kill \"$xv\" 2>/dev/null || true\\\\\\' EXIT\\\\nfor n in $(seq 1 100); do test -S /tmp/.X11-unix/X98 && break; sleep .1; done\\\\ntest -S /tmp/.X11-unix/X98\\\\ninstall -d -m 0700 -o tester -g tester /tmp/nav-qtquick-runtime\\\\nchown -R tester /sources/qtdeclarative-everywhere-src-6.11.2\\\\nset +e\\\\nsu tester -c \\\\\\'dbus-run-session -- env DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-qtquick-runtime LIBGL_ALWAYS_SOFTWARE=1 TZ=UTC TESTARGS=\"-o result.xml,junitxml -o -,txt\" ctest --parallel 2 --output-on-failure --timeout 180 --no-tests=error --output-junit /tmp/nav-qtquick-selected.xml -R \"^(tst_qjsprimitivevalue|tst_qqmlerror|tst_geometry|tst_qquicktransform|tst_qquickshadereffect)$\"\\\\\\' > /nav-build-metadata/tests/qtquick-selected.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/qtquick-selected.log\\\\ncat Testing/Temporary/LastTest.log\\\\ncp /tmp/nav-qtquick-selected.xml /nav-build-metadata/tests/qtquick-selected.xml\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nimport json,xml.etree.ElementTree as E,shutil\\\\nfrom pathlib import Path\\\\nexpected={\\\\\\'tst_qquickshadereffect\\\\\\', \\\\\\'tst_geometry\\\\\\', \\\\\\'tst_qqmlerror\\\\\\', \\\\\\'tst_qquicktransform\\\\\\', \\\\\\'tst_qjsprimitivevalue\\\\\\'}\\\\nc=E.parse(\\\\\\'/tmp/nav-qtquick-selected.xml\\\\\\').getroot().findall(\\\\\\'.//testcase\\\\\\')\\\\nassert len(c)==5 and {x.attrib[\\\\\\'name\\\\\\'] for x in c}==expected\\\\nassert all(x.find(\\\\\\'failure\\\\\\')is None and x.find(\\\\\\'error\\\\\\')is None and x.find(\\\\\\'skipped\\\\\\')is None for x in c)\\\\npaths=list(Path(\\\\\\'tests/auto\\\\\\').rglob(\\\\\\'result.xml\\\\\\'));assert len(paths)==5,paths\\\\nfor f in paths:\\\\n root=E.parse(f).getroot();cases=root.findall(\\\\\\'.//testcase\\\\\\');assert cases\\\\n assert all(x.find(\\\\\\'failure\\\\\\')is None and x.find(\\\\\\'error\\\\\\')is None and x.find(\\\\\\'skipped\\\\\\')is None for x in cases),f\\\\n shutil.copy(f,\\\\\\'/nav-build-metadata/tests/qtquick-\\\\\\'+f.parent.name+\\\\\\'.xml\\\\\\')\\\\n print(\\\\\\'NAV_QTQUICK_SELECTED_CASE_AUDIT\\\\\\',f.parent.name,len(cases),\\\\\\'PASS zero failures/errors/skips\\\\\\')\\\\nprint(\\\\\\'NAV_QTQUICK_FIVE_SELECTED_TEST_EXECUTABLES_PASS_NOT_FULL_SUITE\\\\\\')\\\\nAUDIT\\\\ntest \"$rc\" = 0\\\\ncd /sources/nav-glass-smoke\\\\n/opt/qt6/bin/qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release\\\\ncmake --build build --parallel 2\\\\nchown -R tester /sources/nav-glass-smoke\\\\nsu tester -c \\\\\\'dbus-run-session -- env DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-qtquick-runtime LIBGL_ALWAYS_SOFTWARE=1 QSG_RHI_BACKEND=opengl QSG_INFO=1 /sources/nav-glass-smoke/build/nav-glass-smoke\\\\\\'\\\\ncp /tmp/nav-qtquick-{glass,control,live}.png /nav-build-metadata/qtquick/\\\\ncp glass.qml main.cpp CMakeLists.txt /nav-build-metadata/qtquick/\\\\npython3 - <<\\\\\\'SCREENSHOTS\\\\\\'\\\\nfrom pathlib import Path\\\\nimport base64\\\\nfor name in [\\\\\\'glass\\\\\\',\\\\\\'control\\\\\\',\\\\\\'live\\\\\\']:\\\\n print(\\\\\\'NAV_QTQUICK_\\\\\\'+name.upper()+\\\\\\'_PNG_BASE64 \\\\\\'+base64.b64encode(Path(\\\\\\'/tmp/nav-qtquick-\\\\\\'+name+\\\\\\'.png\\\\\\').read_bytes()).decode())\\\\nSCREENSHOTS\\\\ncd /sources\\\\nrm -rf qtdeclarative-everywhere-src-6.11.2 nav-glass-smoke\\\\nprintf \\\\\\'QtDeclarative6.11.2 installed; five selected upstream executable tests and native live-background QML lens/RGB/rim OpenGL smoke. Not full Qt regression, not chosen UI, not system compositor, not HP GPU. Valgrind4 failed stage separate unresolved. Desktop/ISO not finished.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_QTQUICK_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\npython3 - <<\\'QUICK_ASSETS\\'\\nfrom pathlib import Path\\nimport base64\\np=Path(\\'/mnt/nav-lfs/sources/nav-glass-smoke\\');p.mkdir(exist_ok=True)\\n(p/\\'glass.qml\\').write_text(\\'import QtQuick\\\\nItem {\\\\n    id: root\\\\n    width: 960; height: 600\\\\n    property bool glassActive: true\\\\n    Item {\\\\n        id: backdrop\\\\n        anchors.fill: parent\\\\n        Image { anchors.fill: parent; source: \"file:///sources/nav-glass-smoke/backdrop.png\"; smooth: true }\\\\n        Rectangle { id: probe; objectName: \"probe\"; x: 110; y: 280; width: 140; height: 18; radius: 4; color: \"#fff2ba\" }\\\\n    }\\\\n    ShaderEffectSource { id: backgroundTexture; sourceItem: backdrop; textureSize: Qt.size(960,600); live: true; hideSource: false; visible: false }\\\\n    Image { id: lens; source: \"file:///sources/nav-glass-smoke/lens.png\"; visible: false; smooth: true }\\\\n    ShaderEffect {\\\\n        x: 180; y: 150; width: 600; height: 300\\\\n        visible: root.glassActive\\\\n        property vector2d surfaceSize: Qt.vector2d(width,height)\\\\n        property vector2d backgroundSize: Qt.vector2d(960,600)\\\\n        property vector2d sourceOrigin: Qt.vector2d(x,y)\\\\n        property real cornerRadius: 56\\\\n        property var background: backgroundTexture\\\\n        property var lensMap: lens\\\\n        fragmentShader: \"file:///nav-build-metadata/shadertools/nav-glass.frag.qsb\"\\\\n    }\\\\n}\\\\n\\')\\n(p/\\'main.cpp\\').write_text(\\'#ifdef NDEBUG\\\\n#undef NDEBUG\\\\n#endif\\\\n#include <QGuiApplication>\\\\n#include <QQuickView>\\\\n#include <QQuickItem>\\\\n#include <QTimer>\\\\n#include <QImage>\\\\n#include <QSGRendererInterface>\\\\n#include <QOpenGLContext>\\\\n#include <QOpenGLFunctions>\\\\n#include <cassert>\\\\n#include <cstdio>\\\\n#include <atomic>\\\\nstatic std::atomic<bool> badShader{false};\\\\nstatic void logMessage(QtMsgType, const QMessageLogContext&,const QString&s){\\\\n fprintf(stderr,\"QT_DIAGNOSTIC %s\\\\\\\\n\",s.toUtf8().constData());\\\\n if(s.contains(\"shader\",Qt::CaseInsensitive)&&(s.contains(\"fail\",Qt::CaseInsensitive)||s.contains(\"error\",Qt::CaseInsensitive)))badShader=true;\\\\n}\\\\nstatic int different(const QImage&a,const QImage&b){assert(a.size()==b.size());int n=0;for(int y=160;y<440;y++)for(int x=190;x<770;x++){auto c=a.pixelColor(x,y),d=b.pixelColor(x,y);if(abs(c.red()-d.red())+abs(c.green()-d.green())+abs(c.blue()-d.blue())>20)n++;}return n;}\\\\nint main(int argc,char**argv){\\\\n qInstallMessageHandler(logMessage);\\\\n QGuiApplication app(argc,argv);\\\\n QQuickWindow::setGraphicsApi(QSGRendererInterface::OpenGL);\\\\n QQuickView view;\\\\n std::atomic<bool> rendered{false};\\\\n QObject::connect(&view,&QQuickWindow::afterRendering,&view,[&](){auto c=QOpenGLContext::currentContext();if(c&&!rendered.exchange(true)){auto f=c->functions();f->initializeOpenGLFunctions();printf(\"NAV_QTQUICK_GL_RENDERER %s\\\\\\\\n\",f->glGetString(GL_RENDERER));}},Qt::DirectConnection);\\\\n view.setSource(QUrl::fromLocalFile(\"/sources/nav-glass-smoke/glass.qml\"));assert(view.status()==QQuickView::Ready);view.resize(960,600);view.show();\\\\n QImage glass,plain,moved;\\\\n QTimer::singleShot(1800,[&](){assert(view.isExposed());assert(rendered);assert(view.rendererInterface()->graphicsApi()==QSGRendererInterface::OpenGL);assert(!badShader);glass=view.grabWindow();assert(!glass.isNull()&&glass.size()==QSize(960,600));assert(glass.save(\"/tmp/nav-qtquick-glass.png\"));assert(view.rootObject()->setProperty(\"glassActive\",false));});\\\\n QTimer::singleShot(2600,[&](){plain=view.grabWindow();assert(plain.save(\"/tmp/nav-qtquick-control.png\"));const int n=different(glass,plain);printf(\"NAV_QTQUICK_GLASS_VS_CONTROL_CHANGED_PIXELS %d\\\\\\\\n\",n);assert(n>1000);assert(view.rootObject()->setProperty(\"glassActive\",true));auto p=view.rootObject()->findChild<QQuickItem*>(\"probe\");assert(p);p->setX(580);});\\\\n QTimer::singleShot(3400,[&](){assert(!badShader);moved=view.grabWindow();assert(moved.save(\"/tmp/nav-qtquick-live.png\"));const int n=different(glass,moved);printf(\"NAV_QTQUICK_LIVE_BACKGROUND_CHANGED_PIXELS %d\\\\\\\\n\",n);assert(n>1000);puts(\"NAV_QTQUICK_NATIVE_GLASS_RENDER_SMOKE_PASS_NOT_COMPOSITOR_INTEGRATION_NOT_HARDWARE_GPU\");app.quit();});\\\\n return app.exec();\\\\n}\\\\n\\')\\n(p/\\'CMakeLists.txt\\').write_text(\\'cmake_minimum_required(VERSION 3.16)\\\\nproject(NAVGlassSmoke LANGUAGES CXX)\\\\nfind_package(Qt6 REQUIRED COMPONENTS Quick OpenGL)\\\\nqt_add_executable(nav-glass-smoke main.cpp)\\\\ntarget_link_libraries(nav-glass-smoke PRIVATE Qt6::Quick Qt6::OpenGL)\\\\n\\')\\n(p/\\'backdrop.png\\').write_bytes(base64.b64decode(\\'\\\
        '))\\n(p/\\'lens.png\\').write_bytes(base64.b64decode(\\'\\'))\\nQUICK_ASSETS\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/qt-quick.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/qt-quick.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER','NAV_QTQUICK_','Totals:','FAIL!','SKIP','platform plugin','could not connect'])))\nNAV_GUARD\n"
    - name: Preserve tested QtQuick and real native glass render evidence
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qt-quick-v1
