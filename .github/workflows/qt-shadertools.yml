name: NAV Qt ShaderTools native tests and real refraction shader bake
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  qt-shadertools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qtbase-v1
        fail-on-cache-miss: true
    - name: Build ShaderTools, all configured tests, bake Qt6 refractive shader
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"qtshadertools-everywhere-src-6.11.2.tar.xz\", \"url\": \"https://download.qt.io/archive/qt/6.11/6.11.2/submodules/qtshadertools-everywhere-src-6.11.2.tar.xz\", \"bytes\": 1216816, \"sha256\": \"805046b8b7757665586890b375940047e874ae3ab00adb6d3f2b38fc6b200b1c\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/qt-shadertools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 LC_ALL=POSIX PATH=/opt/qt6/bin:/usr/bin:/usr/sbin\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/shadertools\\\\ncd /sources\\\\ntar -xf qtshadertools-everywhere-src-6.11.2.tar.xz\\\\ncd qtshadertools-everywhere-src-6.11.2\\\\n/opt/qt6/bin/qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_BUILD_TESTS=ON -DQT_BUILD_TESTS_BY_DEFAULT=ON -DQT_BUILD_EXAMPLES=OFF\\\\ncmake --build build --parallel 2\\\\ncd build\\\\nctest --show-only=json-v1 > /nav-build-metadata/shadertools/test-manifest.json\\\\nchown -R tester ..\\\\nXvfb :98 -screen 0 1024x768x24 -nolisten tcp -ac > /nav-build-metadata/tests/shadertools-xvfb.log 2>&1 &\\\\nxv=$!\\\\ntrap \\\\\\'kill \"$xv\" 2>/dev/null || true\\\\\\' EXIT\\\\nfor n in $(seq 1 100); do test -S /tmp/.X11-unix/X98 && break; sleep .1; done\\\\ntest -S /tmp/.X11-unix/X98\\\\ninstall -d -m 0700 -o tester -g tester /tmp/nav-shadertools-runtime\\\\nset +e\\\\nsu tester -c \\\\\\'dbus-run-session -- env DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-shadertools-runtime LIBGL_ALWAYS_SOFTWARE=1 TZ=UTC ctest --parallel 2 --output-on-failure --timeout 180 --no-tests=error --output-junit /tmp/nav-shadertools.xml\\\\\\' > /nav-build-metadata/tests/shadertools.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/shadertools.log\\\\ntest -f Testing/Temporary/LastTest.log && cat Testing/Temporary/LastTest.log\\\\nfind tests/auto -type f -name \\\\\\'*.txt\\\\\\' -size -128k -exec grep -H -E \\\\\\'FAIL!|SKIP|Totals:|could not connect|platform plugin\\\\\\' {} + || true\\\\ncp /tmp/nav-shadertools.xml /nav-build-metadata/tests/shadertools.xml\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nimport json,xml.etree.ElementTree as E\\\\nfrom pathlib import Path\\\\nm=json.loads(Path(\\\\\\'/nav-build-metadata/shadertools/test-manifest.json\\\\\\').read_text())[\\\\\\'tests\\\\\\'];c=E.parse(\\\\\\'/tmp/nav-shadertools.xml\\\\\\').getroot().findall(\\\\\\'.//testcase\\\\\\')\\\\nassert len(m)==len(c) and len(c)>=3,(len(m),len(c))\\\\nassert all(x.find(\\\\\\'failure\\\\\\')is None and x.find(\\\\\\'error\\\\\\')is None and x.find(\\\\\\'skipped\\\\\\')is None for x in c)\\\\nprint(\\\\\\'NAV_QT_SHADERTOOLS_ALL_CONFIGURED_TESTS_PASS\\\\\\',len(c))\\\\nAUDIT\\\\ntest \"$rc\" = 0\\\\ncmake --install .\\\\nldconfig\\\\n/opt/qt6/bin/qsb --qt6 -o /nav-build-metadata/shadertools/nav-glass.frag.qsb /sources/nav-glass-qt6.frag\\\\n/opt/qt6/bin/qsb --dump /nav-build-metadata/shadertools/nav-glass.frag.qsb > /nav-build-metadata/shadertools/nav-glass-qsb-dump.txt\\\\ncat /nav-build-metadata/shadertools/nav-glass-qsb-dump.txt\\\\nprintf \\\\\\'NAV_QT_GLASS_QSB_COMPILE_PASS_NOT_RENDER_TEST\\\\\\\\n\\\\\\'\\\\ncp /sources/nav-glass-qt6.frag /nav-build-metadata/shadertools/nav-glass.frag\\\\ncd /sources\\\\nrm -rf qtshadertools-everywhere-src-6.11.2 nav-qtbase-smoke.cpp nav-glass-qt6.frag\\\\nprintf \\\\\\'QtShaderTools6.11.2 all configured tests passed; real refraction lens/RGB/rim shader baked by qsb, not yet QtQuick rendered/integrated. Qtbase six selected upstream tests, not full suite. Valgrind4failed stage separate unresolved. Desktop/ISO not finished.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_QT_SHADERTOOLS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\npython3 - <<\\'SMOKE_SOURCE\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/nav-qtbase-smoke.cpp\\').write_text(\\'#ifdef NDEBUG\\\\n#undef NDEBUG\\\\n#endif\\\\n#include <QApplication>\\\\n#include <QWidget>\\\\n#include <QPainter>\\\\n#include <QScreen>\\\\n#include <QTimer>\\\\n#include <QJsonDocument>\\\\n#include <QJsonObject>\\\\n#include <QSqlDatabase>\\\\n#include <QSqlQuery>\\\\n#include <QSslSocket>\\\\n#include <QDBusConnection>\\\\n#include <QOpenGLContext>\\\\n#include <QOffscreenSurface>\\\\n#include <QOpenGLFunctions>\\\\n#include <QFontDatabase>\\\\n#include <QImageWriter>\\\\n#include <QImageReader>\\\\n#include <QProcess>\\\\n#include <QVariant>\\\\n#include <QPixmap>\\\\n#include <cassert>\\\\n#include <cstdio>\\\\nclass Panel:public QWidget{\\\\n void paintEvent(QPaintEvent*) override{\\\\n  QPainter p(this);p.setRenderHint(QPainter::Antialiasing);\\\\n  QLinearGradient bg(0,0,width(),height());bg.setColorAt(0,QColor(\"#101f42\"));bg.setColorAt(1,QColor(\"#235d6b\"));p.fillRect(rect(),bg);\\\\n  p.setPen(QPen(QColor(255,255,255,90),1));p.setBrush(QColor(255,255,255,24));p.drawRoundedRect(QRectF(42,38,556,284),26,26);\\\\n  p.setPen(Qt::white);p.setFont(QFont(p.font().family(),23,QFont::Bold));p.drawText(QRect(74,68,480,48),\"NAV - Qt toolkit check\");\\\\n  p.setFont(QFont(p.font().family(),12));p.setPen(QColor(\"#c9e9f4\"));p.drawText(QRect(74,125,470,32),\"Native source build / XCB software display\");\\\\n  p.setPen(Qt::NoPen);p.setBrush(QColor(\"#63ebc6\"));p.drawRoundedRect(QRect(74,185,32,32),8,8);\\\\n  p.setBrush(QColor(\"#86bcff\"));p.drawRoundedRect(QRect(120,185,32,32),8,8);\\\\n  p.setPen(Qt::white);p.drawText(QRect(74,240,470,34),\"Library verification, not the finished desktop\");\\\\n }\\\\n};\\\\nint main(int argc,char**argv){\\\\n QApplication app(argc,argv);\\\\n assert(QGuiApplication::platformName()==\"xcb\");\\\\n const int f=QFontDatabase::addApplicationFont(\"/sources/qtbase-everywhere-src-6.11.2/tests/auto/shared/resources/testfont.ttf\");assert(f>=0);\\\\n const auto families=QFontDatabase::applicationFontFamilies(f);assert(!families.empty());app.setFont(QFont(families[0],12));\\\\n QJsonDocument j(QJsonObject{{\"answer\",42},{\"os\",\"NAV\"}});assert(QJsonDocument::fromJson(j.toJson()).object()[\"answer\"].toInt()==42);\\\\n auto sql=QSqlDatabase::addDatabase(\"QSQLITE\");sql.setDatabaseName(\":memory:\");assert(sql.open());QSqlQuery q;assert(q.exec(\"SELECT 19+23\"));assert(q.next()&&q.value(0).toInt()==42);\\\\n assert(QSslSocket::supportsSsl());assert(QDBusConnection::sessionBus().isConnected());\\\\n assert(QProcess::execute(\"/usr/bin/true\",{})==0);\\\\n QImage image(32,24,QImage::Format_RGB32);image.fill(QColor(\"#63ebc6\"));assert(image.save(\"/tmp/nav-qt-png.png\"));assert(!QImage(\"/tmp/nav-qt-png.png\").isNull());assert(image.save(\"/tmp/nav-qt-jpeg.jpg\"));assert(!QImage(\"/tmp/nav-qt-jpeg.jpg\").isNull());\\\\n QOpenGLContext gl;assert(gl.create());QOffscreenSurface surface;surface.setFormat(gl.format());surface.create();assert(surface.isValid());assert(gl.makeCurrent(&surface));\\\\n auto funcs=gl.functions();funcs->initializeOpenGLFunctions();const char*renderer=(const char*)funcs->glGetString(GL_RENDERER);assert(renderer);printf(\"NAV_QT_SMOKE OpenGL renderer: %s\\\\\\\\n\",renderer);gl.doneCurrent();\\\\n Panel w;w.resize(640,360);w.show();\\\\n QTimer::singleShot(800,[&](){assert(w.isVisible()&&w.windowHandle());QPixmap pix=w.screen()->grabWindow(w.winId());assert(!pix.isNull()&&pix.size()==QSize(640,360));const auto im=pix.toImage();assert(im.pixelColor(90,201).green()>180);assert(pix.save(\"/tmp/nav-qtbase-screen.png\"));puts(\"NAV_QT_SMOKE JSON SQLite TLS DBus process PNG JPEG OpenGL XCB screen-capture PASS; targeted smoke only\");app.quit();});\\\\n return app.exec();\\\\n}\\\\n\\')\\nSMOKE_SOURCE\\npython3 - <<\\'GLASS_SOURCE\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/nav-glass-qt6.frag\\').write_text(\\'#version 440\\\\nlayout(location=0) in vec2 qt_TexCoord0;\\\\nlayout(location=0) out vec4 fragColor;\\\\nlayout(std140,binding=0) uniform buf {\\\\n mat4 qt_Matrix;\\\\n float qt_Opacity;\\\\n vec2 surfaceSize;\\\\n vec2 backgroundSize;\\\\n vec2 sourceOrigin;\\\\n float cornerRadius;\\\\n};\\\\nlayout(binding=1) uniform sampler2D background;\\\\nlayout(binding=2) uniform sampler2D lensMap;\\\\nfloat sdRoundBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return min(max(q.x,q.y),0.)+length(max(q,0.))-r;}\\\\nvoid main(){\\\\n vec2 local=qt_TexCoord0*surfaceSize;\\\\n vec2 p=local-surfaceSize*.5;\\\\n float d=sdRoundBox(p,surfaceSize*.5,cornerRadius);\\\\n vec2 pos=(sourceOrigin+local)/backgroundSize;\\\\n vec2 bend=(texture(lensMap,qt_TexCoord0).rg-vec2(.5))/backgroundSize;\\\\n vec3 color=vec3(texture(background,pos+bend*60.).r,texture(background,pos+bend*44.).g,texture(background,pos+bend*28.).b);\\\\n vec2 e=vec2(.5,0.);\\\\n vec2 n=normalize(vec2(sdRoundBox(p+e.xy,surfaceSize*.5,cornerRadius)-sdRoundBox(p-e.xy,surfaceSize*.5,cornerRadius),sdRoundBox(p+e.yx,surfaceSize*.5,cornerRadius)-sdRoundBox(p-e.yx,surfaceSize*.5,cornerRadius))+vec2(.00001));\\\\n float rim=exp(-pow(max(-d,0.)/20.,1.6));\\\\n float shine=pow(max(dot(n,normalize(vec2(-.65,-.8))),0.),5.);\\\\n float bevel=exp(-pow((d+1.5)/1.1,2.));\\\\n color=mix(color,vec3(.74,.88,1.),.09)+vec3(.75,.87,1.)*pow(rim,2.8)*.13+bevel*(shine*.9+.09);\\\\n float a=(1.-smoothstep(-.6,.8,d))*qt_Opacity;\\\\n fragColor=vec4(color*a,a);\\\\n}\\\\n\\')\\nGLASS_SOURCE\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/qt-shadertools.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/qt-shadertools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER','Totals:','FAIL!','SKIP','platform plugin','could not connect'])))\nNAV_GUARD\n"
    - name: Preserve tested ShaderTools and baked glass shader
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qt-shadertools-v1
