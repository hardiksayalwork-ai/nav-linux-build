        ', \\\\\\'gcc.target/i386/memcpy-pr120683-2.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-3.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-4.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-5.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-6.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-7.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-13.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-17.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-18.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-19.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-20.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-21.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-22.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-23.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr70308-1a.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr70308-1b.c\\\\\\', \\\\\\'gcc.target/i386/pr111657-1.c\\\\\\', \\\\\\'gcc.target/i386/pr115102.c\\\\\\', \\\\\\'gcc.target/i386/pr116896.c\\\\\\', \\\\\\'gcc.target/i386/pr120881-2a.c\\\\\
        \\', \\\\\\'gcc.target/i386/pr122343-4a.c\\\\\\', \\\\\\'gcc.target/i386/pr125355-2.c\\\\\\', \\\\\\'gcc.target/i386/pr125355.c\\\\\\', \\\\\\'gcc.target/i386/shift-gf2p8affine-2.c\\\\\\', \\\\\\'gcc.target/i386/xchg-4.c\\\\\\'])\\\\n# Source: LFS13.1 chapter08/gcc.html plus official i7-14700K test log.\\\\npatterns=[\\\\\\'gcc.dg/lto/toplevel-*-asm-*\\\\\\',\\\\\\'gcc.dg/plugin/crash-test-nested-*.c\\\\\\',\\\\\\'gcc.target/i386/builtin-memmove-*.c\\\\\\',\\\\\\'gcc.target/i386/memcpy-pr120683-*.c\\\\\\',\\\\\\'gcc.target/i386/memset-pr120683-*.c\\\\\\',\\\\\\'g++.target/i386/mv-symbols*.C\\\\\\',\\\\\\'g++.target/i386/mvc-symbols*.C\\\\\\',\\\\\\'g++.dg/gomp/deprecate-1.C\\\\\\']\\\\ncounts={};bad=[];allowed=[];files=list(pathlib.Path(\\\\\\'.\\\\\\').rglob(\\\\\\'*.sum\\\\\\'));assert files,\\\\\\'No GCC test summaries\\\\\\'\\\\ndest=pathlib.Path(\\\\\\'/nav-build-metadata/tests/gcc-sums\\\\\\')\\\\nfor f in files:\\\\n text=f.read_text(errors=\\\\\\'replace\\\\\\');out=dest/f;out.parent.mkdir(parents=True,exist_ok=True);out.write_text(text)\\\
