        \\\\',json.dumps(counts,sort_keys=True),flush=True)\\\\nprint(\\\\\\'NAV_GCC_KNOWN_RESULTS\\\\\\',json.dumps(allowed),flush=True)\\\\nprint(\\\\\\'NAV_GCC_UNEXPECTED_RESULTS\\\\\\',json.dumps({\\\\\\'count\\\\\\':len(bad),\\\\\\'first\\\\\\':bad[:25]}),flush=True)\\\\nassert not bad,(\\\\\\'new GCC test failures\\\\\\',len(bad),bad[:5])\\\\nfor n,minimum in {\\\\\\'gcc\\\\\\':190000,\\\\\\'g++\\\\\\':240000,\\\\\\'libstdc++\\\\\\':16000,\\\\\\'libgomp\\\\\\':5000,\\\\\\'libatomic\\\\\\':50,\\\\\\'libitm\\\\\\':40}.items():\\\\n assert n in counts and counts[n][\\\\\\'expected passes\\\\\\']>=minimum,(\\\\\\'incomplete suite\\\\\\',n,counts.get(n))\\\\nassert len(allowed)<160,(\\\\\\'excess known-test failures\\\\\\',len(allowed))\\\\nassert int(sys.argv[1]) in (0,2) and (int(sys.argv[1])==0 or allowed),(\\\\\\'unexpected check status\\\\\\',sys.argv[1])\\\\nwith open(\\\\\\'/nav-build-metadata/tests/gcc-check.log\\\\\\',\\\\\\'rb\\\\\\') as a,gzip.open(\\\\\\'/nav-build-metadata/tests/gcc-check.log.gz\\\
        \\\\',\\\\\\'wb\\\\\\') as b:shutil.copyfileobj(a,b)\\\\npathlib.Path(\\\\\\'/nav-build-metadata/tests/gcc-check.log\\\\\\').unlink()\\\\npathlib.Path(\\\\\\'/nav-build-metadata/tests/gcc-audit.json\\\\\\').write_text(json.dumps({\\\\\\'counts\\\\\\':counts,\\\\\\'known_results\\\\\\':allowed,\\\\\\'unexpected_results\\\\\\':bad,\\\\\\'asan\\\\\\':\\\\\\'upstream harness skips with virtual-memory limit\\\\\\'},indent=2))\\\\nprint(\\\\\\'NAV_GCC_AUDITED_SUITES_OK_ASAN_UNSUPPORTED_UNDER_MEMORY_CAP\\\\\\',flush=True)\\\\nGCC_AUDIT\\\\nmake install\\\\nchown -v -R root:root $(gcc -print-file-name=include){,-fixed}\\\\nln -svr /usr/bin/cpp /usr/lib\\\\nln -sv gcc.1 /usr/share/man/man1/cc.1\\\\nln -sfvr $(gcc -print-prog-name=liblto_plugin.so) /usr/lib/bfd-plugins/\\\\nprintf \\\\\\'int main(){}\\\\\\\\n\\\\\\' | cc -x c - -v -Wl,--verbose > /nav-build-metadata/tests/gcc-link-sanity.log 2>&1\\\\nreadelf -l a.out | tee /nav-build-metadata/tests/gcc-elf.txt\\\\ngrep -q \\\\\\'/lib64/ld-linux-x86-64.so.2\\\
        \\\\' /nav-build-metadata/tests/gcc-elf.txt\\\\n./a.out\\\\npython3 - <<\\\\\\'GCC_LINK_AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport re\\\\ntext=Path(\\\\\\'/nav-build-metadata/tests/gcc-link-sanity.log\\\\\\').read_text()\\\\nfor name in [\\\\\\'Scrt1.o\\\\\\',\\\\\\'crti.o\\\\\\',\\\\\\'crtn.o\\\\\\']:\\\\n assert any(\\\\\\'/usr/lib/\\\\\\' in x and name+\\\\\\' succeeded\\\\\\' in x for x in text.splitlines()),(\\\\\\'start file\\\\\\',name)\\\\nassert re.search(r\\\\\\'^ /usr/include$\\\\\\',text,re.M),\\\\\\'headers\\\\\\'\\\\nassert \\\\\\'/usr/lib/libc.so.6 succeeded\\\\\\' in text,\\\\\\'libc\\\\\\'\\\\nassert \\\\\\'found ld-linux-x86-64.so.2 at /usr/lib/ld-linux-x86-64.so.2\\\\\\' in text,\\\\\\'loader\\\\\\'\\\\nassert \\\\\\'SEARCH_DIR(\"/usr/lib\")\\\\\\' in text,\\\\\\'linker paths\\\\\\'\\\\nassert \\\\\\'/tools/\\\\\\' not in text,\\\\\\'temporary toolchain contamination\\\\\\'\\\\nprint(\\\\\\'NAV_GCC_LINK_SANITY_OK\\\\\\',flush=True)\\\\nGCC_LINK_AUDIT\\\
        \\nrm a.out\\\\nmkdir -pv /usr/share/gdb/auto-load/usr/lib\\\\nmv -v /usr/lib/*gdb.py /usr/share/gdb/auto-load/usr/lib\\\\nldconfig\\\\ncat > /tmp/nav-gcc.cc <<\\\\\\'CPP\\\\\\'\\\\n#include <gmpxx.h>\\\\n#include <thread>\\\\n#include <iostream>\\\\nint main(){int x=0;std::thread t([&]{try{throw 19;}catch(int n){x=n;}});t.join();mpz_class n=x;n+=23;std::cout<<n<<std::endl;}\\\\nCPP\\\\ng++ -std=c++20 -O2 -flto -pthread /tmp/nav-gcc.cc -lgmpxx -lgmp -o /tmp/nav-gcc\\\\ntest \"$(/tmp/nav-gcc)\" = 42\\\\nreadelf -h /tmp/nav-gcc | grep -q \\\\\\'DYN (Position-Independent Executable file)\\\\\\'\\\\nrm /tmp/nav-gcc /tmp/nav-gcc.cc\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gcc-16.2.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf gcc-16.2.0\\\\nprintf \\\\\\'NAV_FINAL_GCC_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 final GCC16.2.0 built and normal check target audited. ASan tests unsupported with retained virtual-memory cap. Base incomplete; no boot/desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\
        \\nprintf \\\\\\'NAV_FINAL_GCC_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\n# The host uses /dev/ptmx -> pts/ptmx. A fresh devpts node defaults to\\n# mode0000; prove the old non-root behavior, then use the kernel-doc option.\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\nset +e\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/python3 -c \\'import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\\'\\nold_pty_rc=$?\\nset -e\\nprintf \\'NAV_GCC_ORIGINAL_PTY_STATUS %s\\\\n\\' \"$old_pty_rc\"\\nmount -o remount,gid=5,mode=0620,ptmxmode=0666 \"$LFS/dev/pts\"\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\n\\nmount -t proc proc \"$LFS/proc\"\\\
