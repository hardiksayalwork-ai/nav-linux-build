name: NAV source LLVM graphics core strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  llvm-core:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-mesa-prep-v1
        fail-on-cache-miss: true
    - name: Build LLVM graphics core strict tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"llvm-project-22.1.8.src.tar.xz\", \"url\": \"https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz\", \"bytes\": 167061596, \"sha256\": \"922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888\"\
        , \"book_md5\": \"69065494ebcb1150b2a329c1b3db7584\"}, {\"filename\": \"llvm-22.1.8-upstream_fix-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/blfs/13.1/llvm-22.1.8-upstream_fix-1.patch\", \"bytes\": 161404, \"sha256\": \"4a2084f9714f2f3babc0ed58065c3a6b83cd2828ea19aec1518995a6d2376187\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/llvm-core.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"\
        /nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nsed \\\\\\'s/^/NAV_TEST_DIAGNOSTIC previous-libdrm /\\\\\\' /nav-build-metadata/tests/libdrm.log\\\\nulimit -c 0\\\\ncd /sources\\\\ntar -xf llvm-project-22.1.8.src.tar.xz\\\\ncd llvm-project-22.1.8.src\\\\npatch --dry-run --fuzz=0 -Np1 -i ../llvm-22.1.8-upstream_fix-1.patch\\\\npatch --fuzz=0 -Np1 -i ../llvm-22.1.8-upstream_fix-1.patch\\\
        \\nmkdir -p /nav-build-metadata/patches\\\\ncp /sources/llvm-22.1.8-upstream_fix-1.patch /nav-build-metadata/patches/\\\\ngrep -rl \\\\\\'#!.*python$\\\\\\' | xargs -r sed -i \\\\\\'1s/python$/python3/\\\\\\'\\\\nsed \\\\\\'s/utility/tool/\\\\\\' -i llvm/utils/FileCheck/CMakeLists.txt\\\\nmkdir -p /etc/clang\\\\nprintf \\\\\\'%s\\\\n\\\\\\' \\\\\\'-fstack-protector-strong\\\\\\' > /etc/clang/clang.cfg\\\\ncp /etc/clang/clang.cfg /etc/clang/clang++.cfg\\\\nCC=gcc CXX=g++ cmake -S llvm -B build -G Ninja  -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_SKIP_INSTALL_RPATH=ON  -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_FFI=ON  -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON  -DLLVM_ENABLE_RTTI=ON \\\\\\'-DLLVM_TARGETS_TO_BUILD=X86;AMDGPU\\\\\\'  -DLLVM_ENABLE_PROJECTS=clang -DLLVM_ENABLE_RUNTIMES=\\\\\\'\\\\\\' -DCLANG_LINK_CLANG_DYLIB=ON -DCLANG_DEFAULT_PIE_ON_LINUX=ON -DCLANG_CONFIG_FILE_SYSTEM_DIR=/etc/clang  -DLLVM_BINUTILS_INCDIR=/usr/include -DLLVM_INCLUDE_BENCHMARKS=OFF  -DLLVM_INCLUDE_TESTS=ON\
        \ -DLLVM_BUILD_TESTS=ON  -DLLVM_PARALLEL_COMPILE_JOBS=2 -DLLVM_PARALLEL_LINK_JOBS=1  \\\\\\'-DLLVM_LIT_ARGS=-v -j 2 --timeout=120\\\\\\'  \\\\\\'-DCMAKE_EXE_LINKER_FLAGS=-Wl,--no-keep-memory\\\\\\'  \\\\\\'-DCMAKE_SHARED_LINKER_FLAGS=-Wl,--no-keep-memory\\\\\\'\\\\nninja -C build -j2\\\\nchown -R tester:tester .\\\\nrun_test llvm-core su tester -c \"ulimit -c 0; TZ=UTC ninja -C build -j2 check-all\"\\\\nninja -C build -j2 install\\\\nldconfig\\\\nclang --version\\\\nprintf \\\\\\'int main(void){return 0;}\\\\n\\\\\\' > /tmp/nav-clang.c\\\\nclang /tmp/nav-clang.c -o /tmp/nav-clang\\\\n/tmp/nav-clang\\\\nllvm-config --version\\\\nllvm-config --targets-built\\\\nllvm-config --shared-mode\\\\ntest \"$(llvm-config --shared-mode)\" = shared\\\\ncat > /tmp/nav-core.ll <<\\\\\\'LLVM_IR\\\\\\'\\\\ndefine i32 @main() {\\\\n  ret i32 42\\\\n}\\\\nLLVM_IR\\\\nllvm-as /tmp/nav-core.ll -o /tmp/nav-core.bc\\\\nopt -passes=\\\\\\'default<O2>\\\\\\' /tmp/nav-core.bc -o /tmp/nav-core-opt.bc\\\\nset\
        \ +e\\\\nlli /tmp/nav-core-opt.bc\\\\nrc=$?\\\\nset -e\\\\ntest \"$rc\" = 42\\\\nllc -filetype=obj /tmp/nav-core-opt.bc -o /tmp/nav-core.o\\\\ngcc /tmp/nav-core.o -o /tmp/nav-core-native\\\\nset +e\\\\n/tmp/nav-core-native\\\\nrc=$?\\\\nset -e\\\\ntest \"$rc\" = 42\\\\nprintf \\\\\\'NAV_LLVM_CORE_JIT_NATIVE_SMOKE_OK\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf llvm-project-22.1.8.src\\\\nprintf \\\\\\'LLVM core 22.1.8 X86+AMDGPU for Mesa, official BLFS wrong-code patch applied clean fuzz0. Configured core check-all strict nonroot; upstream unsupported/skipped preserved. Clang included for Mesa Intel CLC; compiler-rt not built or claimed. JIT+native IR compile execute smoke.\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_LLVM_CORE_STAGE_COMPLETE\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation\
        \ private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/llvm-core.sh\\nchroot --userspec=101:101\
        \ \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/llvm-core.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource\
        \ or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_LLVM_CORE','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested LLVM graphics core
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-llvm-core-v1
