name: NAV LFS crypto and build foundation tested stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  crypto-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-shell-tools-v1
        fail-on-cache-miss: true
    - name: Build Autoconf Automake OpenSSL Libelf Libffi SQLite mpdecimal and test
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"autoconf-2.73.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/autoconf/autoconf-2.73.tar.xz\", \"bytes\": 1417428, \"book_md5\": \"9cbad9a116ef845bafeed8e7bc771bf4\", \"sha256\": \"9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e\"\
        }, {\"filename\": \"automake-1.18.1.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/automake/automake-1.18.1.tar.xz\", \"bytes\": 1652392, \"book_md5\": \"cea31dbf1120f890cbf2a3032cfb9a68\", \"sha256\": \"168aa363278351b89af56684448f525a5bce5079d0b6842bd910fdd3f1646887\"}, {\"filename\": \"openssl-4.0.1.tar.gz\", \"url\": \"https://github.com/openssl/openssl/releases/download/openssl-4.0.1/openssl-4.0.1.tar.gz\", \"bytes\": 55079428, \"book_md5\": \"07e316afe26b61e72206b81706b497bb\", \"sha256\": \"2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09\"}, {\"filename\": \"elfutils-0.195.tar.bz2\", \"url\": \"https://mirrors.kernel.org/sources.redhat.com/elfutils/0.195/elfutils-0.195.tar.bz2\", \"bytes\": 12032640, \"book_md5\": \"3e8ef51c43beceddbbb74879549cf72c\", \"sha256\": \"37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026\"}, {\"filename\": \"libffi-3.8.0.tar.gz\", \"url\": \"https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz\"\
        , \"bytes\": 1581626, \"book_md5\": \"96fe46f2a7bb82559b35a268a2c000ba\", \"sha256\": \"7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4\"}, {\"filename\": \"sqlite-autoconf-3530400.tar.gz\", \"url\": \"https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz\", \"bytes\": 3283177, \"book_md5\": \"ee54db5a5b04e77d4883ce0c051a1eba\", \"sha256\": \"0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c\"}, {\"filename\": \"mpdecimal-4.0.1.tar.gz\", \"url\": \"https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-4.0.1.tar.gz\", \"bytes\": 316268, \"book_md5\": \"3d4412579b1edc1047efab151889cca9\", \"sha256\": \"96d33abb4bb0070c7be0fed4246cd38416188325f820468214471938545b1ac8\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\\
        n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/crypto-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\
        \\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf autoconf-2.73.tar.xz\\\\ncd autoconf-2.73\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE autoconf-2.73\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nrun_test autoconf make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE autoconf-2.73\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- autoconf-2.73\\\\ncd /sources\\\\ntar -xf automake-1.18.1.tar.xz\\\\ncd automake-1.18.1\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE automake-1.18.1\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr --docdir=/usr/share/doc/automake-1.18.1\\\\nmake\\\\nrun_test automake make -j2 check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE automake-1.18.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- automake-1.18.1\\\\ncd /sources\\\\ntar -xf openssl-4.0.1.tar.gz\\\\ncd openssl-4.0.1\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE openssl-4.0.1\\\\\\\\n\\\\\\'\\\\n./config --prefix=/usr         \\\\\\\
        \\\\\\n         --openssldir=/etc/ssl \\\\\\\\\\\\n         --libdir=lib          \\\\\\\\\\\\n         shared                \\\\\\\\\\\\n         zlib-dynamic\\\\nmake\\\\nHARNESS_JOBS=2 run_test openssl make test\\\\nmake INSTALL_LIBS= MANSUFFIX=ssl install\\\\nmv -v /usr/share/doc/openssl /usr/share/doc/openssl-4.0.1\\\\ncp -vfr doc/* /usr/share/doc/openssl-4.0.1\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE openssl-4.0.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- openssl-4.0.1\\\\ncd /sources\\\\ntar -xf elfutils-0.195.tar.bz2\\\\ncd elfutils-0.195\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE elfutils-0.195\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr        \\\\\\\\\\\\n            --disable-debuginfod \\\\\\\\\\\\n            --enable-libdebuginfod=dummy\\\\nmake -C lib\\\\nmake -C libelf\\\\nrun_test libelf make -k check\\\\nmake -C libelf install\\\\ninstall -vm644 config/libelf.pc /usr/lib/pkgconfig\\\\nrm /usr/lib/libelf.a\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE elfutils-0.195\\\\\\\\\
        n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- elfutils-0.195\\\\ncd /sources\\\\ntar -xf libffi-3.8.0.tar.gz\\\\ncd libffi-3.8.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE libffi-3.8.0\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --without-gcc-arch\\\\nmake\\\\nrun_test libffi make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE libffi-3.8.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- libffi-3.8.0\\\\ncd /sources\\\\ntar -xf sqlite-autoconf-3530400.tar.gz\\\\ncd sqlite-autoconf-3530400\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE sqlite-autoconf-3530400\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr     \\\\\\\\\\\\n            --disable-static  \\\\\\\\\\\\n            --enable-fts{4,5} \\\\\\\\\\\\n            CPPFLAGS=\"-D SQLITE_ENABLE_COLUMN_METADATA=1 \\\\\\\\\\\\n                      -D SQLITE_ENABLE_UNLOCK_NOTIFY=1   \\\\\\\\\\\\n                      -D SQLITE_ENABLE_DBSTAT_VTAB=1     \\\\\\\\\\\\n       \
        \               -D SQLITE_SECURE_DELETE=1\"\\\\nmake LDFLAGS.rpath=\"\"\\\\nmake install\\\\ntest \"$(sqlite3 :memory: \\\\\\'select 19+23;\\\\\\')\" = 42\\\\ncat > /tmp/nav-sqlite.sql <<\\\\\\'SQL\\\\\\'\\\\ncreate virtual table docs using fts5(body);\\\\ninsert into docs values (\\\\\\'nav linux\\\\\\');\\\\nselect count(*) from docs where docs match \\\\\\'nav\\\\\\';\\\\nSQL\\\\ntest \"$(sqlite3 :memory: < /tmp/nav-sqlite.sql)\" = 1\\\\nrm /tmp/nav-sqlite.sql\\\\nprintf \\\\\\'NAV_SQLITE_NO_UPSTREAM_SUITE_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE sqlite-autoconf-3530400\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- sqlite-autoconf-3530400\\\\ncd /sources\\\\ntar -xf mpdecimal-4.0.1.tar.gz\\\\ncd mpdecimal-4.0.1\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE mpdecimal-4.0.1\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/mpdecimal-4.0.1\\\\nmake\\\\nrun_test mpdecimal make check_local\\\
        \\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE mpdecimal-4.0.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- mpdecimal-4.0.1\\\\nldconfig\\\\nautoconf --version\\\\nautomake --version\\\\nopenssl version\\\\ntest \"$(printf abc | openssl dgst -sha256 | awk \\\\\\'{print $NF}\\\\\\')\" = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad\\\\ntest \"$(sqlite3 :memory: \\\\\\'select 6*7;\\\\\\')\" = 42\\\\npkg-config --modversion libelf libffi libmpdec\\\\nprintf \\\\\\'NAV_CRYPTO_TOOLS_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 Autoconf Automake OpenSSL Libelf Libffi SQLite mpdecimal installed. Suites strict; SQLite has no upstream suite in release archive, SQL+FTS smoke. Libffi generic portable arch. No boot or desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_CRYPTO_TOOLS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"\
        $LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/crypto-tools.sh\\nchroot --userspec=101:101\
        \ \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/crypto-tools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource\
        \ or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_CRYPTO','NAV_SQLITE','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested crypto and build foundation checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-crypto-tools-v1
