name: NAV GstPlay ONLY six priorfailed corrected codecs original13PASS excluded
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
    - name: Live public standard runner all19protected exact no save delete
