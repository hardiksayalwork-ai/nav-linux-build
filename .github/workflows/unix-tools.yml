name: NAV LFS Unix utilities strict test stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  unix-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-system-tools-v1
        fail-on-cache-miss: true
    - name: Build and test Unix shell networking documentation utilities
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"diffutils-3.12.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/diffutils/diffutils-3.12.tar.xz\", \"bytes\": 1938800, \"book_md5\": \"d1b18b20868fb561f77861cd90b05de4\", \"sha256\": \"7c8b7f9fc8609141fdea9cece85249d308624391ff61dedaf528fcb337727dfd\"\
        }, {\"filename\": \"findutils-4.11.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/findutils/findutils-4.11.0.tar.xz\", \"bytes\": 2451424, \"book_md5\": \"512c6875ed84034dca240c4bc9380b96\", \"sha256\": \"bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd\"}, {\"filename\": \"groff-1.24.1.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/groff/groff-1.24.1.tar.gz\", \"bytes\": 9005760, \"book_md5\": \"d9d996af3d05ebab934380be708ea584\", \"sha256\": \"74e2819795b6aff431aeac983d63a9c8968eeaba2a2eba7df8ba4c7b41e7cfd8\"}, {\"filename\": \"gzip-1.14.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gzip/gzip-1.14.tar.xz\", \"bytes\": 885748, \"book_md5\": \"4bf5a10f287501ee8e8ebe00ef62b2c2\", \"sha256\": \"01a7b881bd220bfdf615f97b8718f80bdfd3f6add385b993dcf6efd14e8c0ac6\"}, {\"filename\": \"iproute2-7.1.0.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.1.0.tar.xz\", \"bytes\": 964700, \"book_md5\": \"4f322144fb9a0877c5f9ef71b2f11180\", \"\
        sha256\": \"fd9fa1b95809417157ca83dd72957e3261bdbce896353cb936f80af0b33a4b5c\"}, {\"filename\": \"kbd-2.10.0.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/utils/kbd/kbd-2.10.0.tar.xz\", \"bytes\": 1788500, \"book_md5\": \"77ff950dfa4c34fdf41125547bfa831a\", \"sha256\": \"6e5ca4f8d76ee9e3a8db700b667f13e12aac9933828a64e1aaad93d26be9b479\"}, {\"filename\": \"libpipeline-1.5.8.tar.gz\", \"url\": \"https://download.savannah.gnu.org/releases/libpipeline/libpipeline-1.5.8.tar.gz\", \"bytes\": 1070254, \"book_md5\": \"17ac6969b2015386bcb5d278a08a40b5\", \"sha256\": \"1b1203ca152ccd63983c3f2112f7fe6fa5afd453218ede5153d1b31e11bb8405\"}, {\"filename\": \"make-4.4.1.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/make/make-4.4.1.tar.gz\", \"bytes\": 2348200, \"book_md5\": \"c8469a3713cbbe04d955d4ae4be23eeb\", \"sha256\": \"dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3\"}, {\"filename\": \"patch-2.8.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/patch/patch-2.8.tar.xz\"\
        , \"bytes\": 907208, \"book_md5\": \"149327a021d41c8f88d034eab41c039f\", \"sha256\": \"f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3\"}, {\"filename\": \"tar-1.35.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/tar/tar-1.35.tar.xz\", \"bytes\": 2317208, \"book_md5\": \"a2d8042658cfd8ea939e6d911eaf4152\", \"sha256\": \"4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16\"}, {\"filename\": \"texinfo-7.3.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/texinfo/texinfo-7.3.tar.xz\", \"bytes\": 6940392, \"book_md5\": \"915a09fcdfc2bf0f5ecf9e556d5698ff\", \"sha256\": \"51f74eb0f51cfa9873b85264dfdd5d46e8957ec95b88f0fb762f63d9e164c72e\"}, {\"filename\": \"kbd-2.10.0-backspace-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/kbd-2.10.0-backspace-1.patch\", \"bytes\": 12640, \"book_md5\": \"f75cca16a38da6caa7d52151f7136895\", \"sha256\": \"8be28dcb11420624a500f2ea4fe975f771174bffee50e54ec8cd295a2dec104e\"}, {\"filename\": \"tar-1.35-acl_fix-1.patch\"\
        , \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/tar-1.35-acl_fix-1.patch\", \"bytes\": 4333, \"book_md5\": \"dbab49e317105539611866dac5dd54f6\", \"sha256\": \"51cadccfcb2f29cfdb4ec18015360100aa167179a72ece040a6a8612aeec5081\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/unix-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n\
