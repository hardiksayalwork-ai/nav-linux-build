        .at:28\\\\\\\\)$\\\\\\',s,re.M);assert failed==[\\\\\\'233\\\\\\'],failed\\\\nassert re.findall(r\\\\\\'^.*: FAILED .*$\\\\\\',s,re.M)==[\\\\\\'233. capabs_raw01.at:25: 233. capabilities: binary store/restore (capabs_raw01.at:25): FAILED (capabs_raw01.at:28)\\\\\\']\\\\nassert \\\\\\'233. capabs_raw01.at:25: 233. capabilities: binary store/restore (capabs_raw01.at:25): FAILED (capabs_raw01.at:28)\\\\\\' in s\\\\n# Audit the only failing group\\\\\\'s raw output and expected-output diff.\\\\np=pathlib.Path(\\\\\\'tests/testsuite.dir/at-groups/233\\\\\\')\\\\nassert p.exists(),list(pathlib.Path(\\\\\\'tests/testsuite.dir\\\\\\').iterdir())\\\\nassert (p/\\\\\\'stdout\\\\\\').read_text()==\\\\\\'dir/file cap_chown=ei\\\\\\\\n\\\\\\\\n\\\\\\',repr((p/\\\\\\'stdout\\\\\\').read_text())\\\\nassert not (p/\\\\\\'stderr\\\\\\').read_text(),repr((p/\\\\\\'stderr\\\\\\').read_text())\\\\nassert \\\\\\'-dir/file = cap_chown=ei\\\\\\\\n+dir/file cap_chown=ei\\\\\\\\n \\\\\\' in s\\\\nchanged=[x\
