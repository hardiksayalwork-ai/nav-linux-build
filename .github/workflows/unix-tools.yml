        ':counts},indent=2)+\\\\\\'\\\\\\\\n\\\\\\')\\\\nprint(\\\\\\'NAV_FINDUTILS_EXACT_LFS_KNOWN_FAILURE_NOT_PASSED\\\\\\',failed,counts,flush=True)\\\\nFINDUTILS_AUDIT\\\\nelse\\\\nprintf \"NAV_PACKAGE_TEST_PASS findutils\\\\\\\\n\"\\\\nfi\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE findutils-4.11.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- findutils-4.11.0\\\\ncd /sources\\\\ntar -xf groff-1.24.1.tar.gz\\\\ncd groff-1.24.1\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE groff-1.24.1\\\\\\\\n\\\\\\'\\\\nPAGE=A4 ./configure --prefix=/usr\\\\nmake -j1\\\\nPATH=\"$PWD:$PATH\" run_test groff make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE groff-1.24.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- groff-1.24.1\\\\ncd /sources\\\\ntar -xf gzip-1.14.tar.xz\\\\ncd gzip-1.14\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE gzip-1.14\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nrun_test gzip make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gzip-1.14\\\\\\\
