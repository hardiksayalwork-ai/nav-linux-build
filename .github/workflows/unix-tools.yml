        \ findutils-4.11.0.tar.xz\\\\ncd findutils-4.11.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE findutils-4.11.0\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr --localstatedir=/var/lib/locate\\\\nmake\\\\nset +e\\\\nchown -R tester .\\\\nsu tester -c \"PATH=$PATH make check -k\" < /dev/null\\\\ncheck_rc=$?\\\\nset -e\\\\nif [ \"$check_rc\" -ne 0 ]; then\\\\npython3 - \"$check_rc\" <<\\\\\\'FINDUTILS_AUDIT\\\\\\'\\\\nimport pathlib,re,json,sys\\\\nassert int(sys.argv[1])==2\\\\nroot=pathlib.Path(\\\\\\'.\\\\\\')\\\\ntrs=list(root.rglob(\\\\\\'*.trs\\\\\\'));assert len(trs)>450,len(trs)\\\\nfailed=[];counts={}\\\\nfor p in trs:\\\\n s=p.read_text();m=re.search(r\\\\\\'^:test-result: (\\\\\\\\S+)$\\\\\\',s,re.M);assert m,(str(p),s)\\\\n result=m.group(1);counts[result]=counts.get(result,0)+1\\\\n if result==\\\\\\'FAIL\\\\\\':failed.append(str(p))\\\\n else:assert result in [\\\\\\'PASS\\\\\\',\\\\\\'SKIP\\\\\\',\\\\\\'XFAIL\\\\\\'],(str(p),s)\\\\nassert failed==[\\\\\\'gnulib-tests/test-regex-el.trs\\\
