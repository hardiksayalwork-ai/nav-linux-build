        b''not found''not in(D/''native-ldd.stdout'').read_bytes()\n  chroot([''ldd'',''/usr/bin/nav-files''],''native-files-ldd'',30);assert
        b''not found''not in(D/''native-files-ldd.stdout'').read_bytes()\n  chroot([''ldd'',''/usr/bin/nav-calculator''],''native-calculator-ldd'',30);assert
