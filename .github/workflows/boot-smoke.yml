name: NAV first real kernel systemd QEMU boot acceptance
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  boot-smoke:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-kernel-v1
        fail-on-cache-miss: true
    - name: Configure source base and boot isolated QEMU disk
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/boot-smoke.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\ncat > /etc/os-release <<\\\\\\'OS\\\\\\'\\\\nNAME=\"NAV Linux\"\\\\nID=nav\\\\nPRETTY_NAME=\"NAV Linux source-built development\"\\\\nVERSION_ID=\"0.1\"\\\\nOS\\\\nprintf \\\\\\'nav-dev\\\\\\\\n\\\\\\' > /etc/hostname\\\\nprintf\
        \ \\\\\\'127.0.0.1 localhost\\\\\\\\n::1 localhost\\\\\\\\n127.0.1.1 nav-dev\\\\\\\\n\\\\\\' > /etc/hosts\\\\nprintf \\\\\\'LANG=en_US.UTF-8\\\\\\\\n\\\\\\' > /etc/locale.conf\\\\nprintf \\\\\\'KEYMAP=us\\\\\\\\n\\\\\\' > /etc/vconsole.conf\\\\nmkdir -p /etc/sysconfig\\\\nprintf \\\\\\'KEYMAP_CORRECTIONS=\"\"\\\\\\\\n\\\\\\' > /etc/sysconfig/console\\\\nln -sfn /usr/share/zoneinfo/Asia/Kolkata /etc/localtime\\\\nprintf \\\\\\'0.0 0 0.0\\\\\\\\n0\\\\\\\\nUTC\\\\\\\\n\\\\\\' >/etc/adjtime\\\\n: > /etc/machine-id\\\\nmkdir -p /etc/systemd/network\\\\ncat > /etc/systemd/network/20-wired.network <<\\\\\\'NET\\\\\\'\\\\n[Match]\\\\nName=en* eth*\\\\n[Network]\\\\nDHCP=yes\\\\nNET\\\\nsystemctl enable systemd-networkd.service systemd-resolved.service\\\\nln -sfn /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf\\\\nsystemctl set-default multi-user.target\\\\nldconfig\\\\nprintf \\\\\\'NAV_BASE_CONFIG_OK\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo\
        \ chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2\
        \ LC_ALL=POSIX /bin/bash --noprofile --norc /sources/boot-smoke.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n\\n# Cached roots are runner-owned. Canonicalize for this disk, then restore known\\n# service identity and package privilege bits before booting it.\\nsudo chown -R root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo chown root:18 \"$LFS/usr/libexec/dbus-daemon-launch-helper\"\\nsudo chmod 4110 \"$LFS/usr/libexec/dbus-daemon-launch-helper\"\\nsudo chmod 4755 \"$LFS/usr/bin/\"{chage,chfn,chsh,gpasswd,newgrp,passwd,su}\\nsudo chmod 1777 \"$LFS/tmp\" \"$LFS/var/tmp\"\\nsudo rm -f \"$LFS/sources/boot-smoke.sh\"\\nsudo apt-get update\\nsudo apt-get install --no-install-recommends -y qemu-system-x86\\nsudo\
        \ truncate -s 3G /mnt/nav-boot-smoke.ext4\\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-boot-smoke.ext4\\nsudo mkfs.ext4 -q -F -L NAVBOOT -d \"$LFS\" /mnt/nav-boot-smoke.ext4\\nmkdir -p /tmp/nav-boot-mount\\nsudo mount -o loop /mnt/nav-boot-smoke.ext4 /tmp/nav-boot-mount\\nsudo tee /tmp/nav-boot-mount/etc/fstab <<\\'FSTAB\\'\\n/dev/vda / ext4 defaults 0 1\\nFSTAB\\nsudo tee /tmp/nav-boot-mount/usr/local/sbin/nav-boot-smoke <<\\'GUEST\\'\\n#!/bin/bash\\nset -euxo pipefail\\nexec > /dev/ttyS0 2>&1\\ntrap \\'echo NAV_BOOT_GUEST_FAILED; systemctl --no-pager --failed; journalctl -b -p warning --no-pager; systemctl poweroff --no-block\\' ERR\\nprintf \\'NAV_BOOT_GUEST_START\\\\n\\'\\ntest \"$(cat /proc/1/comm)\" = systemd\\nuname -a\\ngrep -q \\'7.1.8-nav1\\' /proc/version\\nfindmnt /\\nsystemctl is-active systemd-journald.service systemd-udevd.service dbus.service systemd-logind.service\\nudevadm settle --timeout=30\\npython3 - <<\\'PYTEST\\'\\nimport ssl,sqlite3,decimal,ctypes,subprocess\\\
        nassert sqlite3.connect(\\':memory:\\').execute(\\'select 6*7\\').fetchone()==(42,)\\nassert subprocess.check_output([\\'bash\\',\\'-c\\',\\'printf boot\\'])==b\\'boot\\'\\nprint(\\'NAV_BOOT_PYTHON_OK\\')\\nPYTEST\\nprintf \\'#include <stdio.h>\\\\nint main(){puts(\"NAV_BOOT_NATIVE_C_OK\");}\\\\n\\' >/tmp/native.c\\ngcc /tmp/native.c -o /tmp/native\\n/tmp/native\\nprintf \\'#include <iostream>\\\\nint main(){std::cout<<42; }\\\\n\\' >/tmp/native.cc\\ndate -Ins\\ntimeout 180 g++ -v /tmp/native.cc -o /tmp/native-cxx\\ndate -Ins\\ntest \"$(/tmp/native-cxx)\" = 42\\nsystemctl --no-pager --failed\\nfailed=$(systemctl --failed --no-legend --plain | wc -l)\\ntest \"$failed\" = 0\\njournalctl -b --no-pager -n40\\nprintf \\'NAV_BOOT_ACCEPTANCE_OK kernel7.1.8-nav1 systemd-pid1 dbus-udev-journal-logind native-C-CXX Python zero-failed-units\\\\n\\'\\nsync\\nsystemctl poweroff --no-block\\nGUEST\\nsudo chmod 755 /tmp/nav-boot-mount/usr/local/sbin/nav-boot-smoke\\nsudo tee /tmp/nav-boot-mount/etc/systemd/system/nav-boot-smoke.service\
        \ <<\\'SERVICE\\'\\n[Unit]\\nDescription=NAV disposable VM acceptance\\nAfter=systemd-user-sessions.service dbus.service systemd-logind.service\\nWants=dbus.service systemd-logind.service\\n[Service]\\nType=oneshot\\nExecStart=/usr/local/sbin/nav-boot-smoke\\nTimeoutStartSec=600\\nStandardOutput=journal+console\\n[Install]\\nWantedBy=multi-user.target\\nSERVICE\\nsudo ln -s ../nav-boot-smoke.service /tmp/nav-boot-mount/etc/systemd/system/multi-user.target.wants/nav-boot-smoke.service\\nsudo ln -s /dev/null /tmp/nav-boot-mount/etc/systemd/system/serial-getty@ttyS0.service\\nsudo umount /tmp/nav-boot-mount\\nset +e\\ntimeout 900 qemu-system-x86_64 -accel tcg -machine q35 -cpu max -smp 1 -m 1536 -nographic -no-reboot -kernel \"$LFS/boot/vmlinuz-7.1.8-nav1\" -append \\'root=/dev/vda rw console=ttyS0,115200 systemd.show_status=yes clocksource=acpi_pm\\' -drive file=/mnt/nav-boot-smoke.ext4,format=raw,if=virtio -netdev user,id=net0 -device virtio-net-pci,netdev=net0 > /tmp/nav-qemu-serial.log\
        \ 2>&1\\nrc=$?\\nset -e\\ncat /tmp/nav-qemu-serial.log\\ntest \"$rc\" = 0\\ngrep -q \\'^NAV_BOOT_ACCEPTANCE_OK \\' /tmp/nav-qemu-serial.log\\n! grep -q \\'^NAV_BOOT_GUEST_FAILED\\' /tmp/nav-qemu-serial.log\\nsudo mkdir -p \"$LFS/nav-build-metadata/boot\"\\nsudo cp /tmp/nav-qemu-serial.log \"$LFS/nav-build-metadata/boot/serial.log\"\\nprintf \\'NAV_QEMU_BOOT_STAGE_COMPLETE\\\\n\\'\\nsudo rm /mnt/nav-boot-smoke.ext4\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\nsudo chmod u+r \"$LFS/usr/libexec/dbus-daemon-launch-helper\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor\
        \ reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_BASE','NAV_BOOT','NAV_QEMU','NAV_TEST','NAV_PACKAGE','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve QEMU-tested configured source base
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-boot-smoke-v1
