name: NAV GStreamer portal prerequisites native configured tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-gstreamer:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-pipewire-journal-v2
        fail-on-cache-miss: true
    - name: Build GStreamer core and base plugins for real Documents portal
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda : int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\nassert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024 ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"gstreamer-1.28.6.tar.xz\", \"url\": \"https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.28.6.tar.xz\", \"bytes\": 1955504, \"sha256\": \"62b6b9f0ad3147a6dd6420ac64a91180b14e990695bddd353b96041611d052ca\", \"blfs_md5\": \"3d16d7912727ea85ab90b9e5f3bc6e8a\"}, {\"filename\": \"gst-plugins-base-1.28.6.tar.xz\", \"url\": \"https://gstreamer.freedesktop.org/src/gst-plugins-base/gst-plugins-base-1.28.6.tar.xz\", \"bytes\": 2553864, \"sha256\": \"0ba699c7c6c66f4ba640be78cb38a24715add9683f3e3a199f5369dc5a4f04ac\", \"blfs_md5\": \"cd0b2bd13e8196d5bfb20459c12a5d9b\"}, {\"filename\": \"gst-devtools-1.28.6.tar.xz\", \"url\": \"https://gstreamer.freedesktop.org/src/gst-devtools/gst-devtools-1.28.6.tar.xz\", \"bytes\": 1645656, \"sha256\": \"14d41faae03619251f95959d3d57bf65c6106838b3b54218dc95c7135e1eba13\"}, {\"filename\": \"libogg-1.3.6.tar.xz\", \"url\": \"https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.xz\", \"bytes\": 439952, \"sha256\": \"5c8253428e181840cd20d41f3ca16557a9cc04bad4a3d04cce84808677fa1061\", \"blfs_md5\": \"529275432dff072f63d4ed0f1f961384\"}, {\"filename\": \"libvorbis-1.3.7.tar.xz\", \"url\": \"https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz\", \"bytes\": 1203792, \"sha256\": \"b33cc4934322bcbf6efcbacf49e3ca01aadbea4114ec9589d1b1e9d20f72954b\", \"blfs_md5\": \"50902641d358135f06a8392e61c9ac77\"}, {\"filename\": \"gst-plugins-good-1.28.6.tar.xz\", \"url\": \"https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.6.tar.xz\", \"bytes\": 5999116, \"sha256\": \"b0c620a4b18b6ee931b4c43bbf1760d308666dc37f730a7e7f1ad327e59ce2df\", \"blfs_md5\": \"d84c17388909e98e7f7d81bb2717327c\"}, {\"filename\": \"gst-plugins-bad-1.28.6.tar.xz\", \"url\": \"https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.6.tar.xz\", \"bytes\": 8343524, \"sha256\": \"6636f2c2289ceda52c4aba971338c81e2b5780d3381bd3673c1c116ec87587c3\", \"blfs_md5\": \"cdc3c30609d2d235d9322a676a5d4474\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 CMAKE_BUILD_PARALLEL_LEVEL=2 PATH=/opt/qt6/bin:/usr/bin:/usr/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE GST_CHECKS GST_CHECKS_IGNORE\\\\nmkdir -p /nav-build-metadata/gst-devtools /nav-build-metadata/gstreamer /nav-build-metadata/gst-plugins-base /nav-build-metadata/tests\\\\npython3 - <<\\\\\\'INHERITED\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,re\\\\nfor name,expected in [(\\\\\\'portal\\\\\\',17),(\\\\\\'pipewire\\\\\\',50)]:\\\\n r=[json.loads(x)for x in (Path(\\\\\\'/nav-build-metadata\\\\\\')/name/\\\\\\'testlog.json\\\\\\').read_text().splitlines()if x.strip()]\\\\n assert len(r)==expected and all(x[\\\\\\'result\\\\\\']==\\\\\\'OK\\\\\\'for x in r),(name,len(r))\\\\n if name==\\\\\\'pipewire\\\\\\':\\\\n  text=\\\\\\'\\\\\\\\n\\\\\\'.join(x.get(k,\\\\\\'\\\\\\')for x in r for k in [\\\\\\'stdout\\\\\\',\\\\\\'stderr\\\\\\'])\\\\n  assert re.findall(r\\\\\\'- name: \"([^\"]+)\"\\\\\\\\n\\\\\\\\s+status: SKIP\\\\\\',text)==[\\\\\\'compat_sigabbrev_np\\\\\\']\\\\n  assert not re.search(r\\\\\\'status: (FAIL|ERROR)\\\\\\',text)\\\\n  for test in [\\\\\\'logger_journal\\\\\\',\\\\\\'logger_journal_chain\\\\\\']:\\\\n   assert re.search(r\\\\\\'- name: \"\\\\\\'+test+r\\\\\\'\"\\\\\\\\n\\\\\\\\s+status: PASS\\\\\\',text),test\\\\n print(\\\\\\'NAV_GST_INHERITED_OK\\\\\\',name,len(r),flush=True)\\\\nINHERITED\\\\ninstall -d -m0700 -o tester -g tester /tmp/nav-gst-runtime\\\\nXvfb :98 -screen 0 1280x800x24 -nolisten tcp -ac -noreset > /tmp/nav-gst-xvfb.log 2>&1 &\\\\nxv=$!\\\\ntrap \\\\\\'cat /tmp/nav-gst-xvfb.log; kill \"$xv\" 2>/dev/null || true\\\\\\' EXIT\\\\nfor n in $(seq 1 100); do test -S /tmp/.X11-unix/X98 && break; sleep .1; done\\\\nkill -0 \"$xv\"\\\\ntest -S /tmp/.X11-unix/X98\\\\n# Real Ogg/Vorbis encoder dependencies, native upstream checks unchanged.\\\\nfor package in libogg-1.3.6 libvorbis-1.3.7; do\\\\n cd /sources\\\\n tar -xf \"$package.tar.xz\"\\\\n cd \"$package\"\\\\n ./configure --prefix=/usr --disable-static\\\\n make -j2\\\\n set +e\\\\n make -j1 check > \"/nav-build-metadata/tests/$package.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$package.log\"\\\\n test \"$rc\" = 0\\\\n if grep -Ei \\\\\\'(^|[[:space:]])(SKIP|XFAIL|FAIL|XPASS|ERROR):[[:space:]]+[1-9]|^SKIP:|^FAIL:|^ERROR:\\\\\\' \"/nav-build-metadata/tests/$package.log\"; then exit 1; fi\\\\n make install\\\\n ldconfig\\\\n cd /sources\\\\n rm -rf \"$package\"\\\\ndone\\\\nfor module in gstreamer gst-plugins-base; do\\\\n cd /sources\\\\n tar -xf \"$module-1.28.6.tar.xz\"\\\\n cd \"$module-1.28.6\"\\\\n if [ \"$module\" = gstreamer ]; then\\\\n  meson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dtests=enabled -Dcheck=enabled -Ddoc=disabled\\\\n elif [ \"$module\" = gst-plugins-base ]; then\\\\n  meson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dtests=enabled -Ddoc=disabled\\\\n else\\\\n  meson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dvalidate=enabled -Dtests=enabled -Ddoc=disabled -Ddots_viewer=disabled\\\\n fi\\\\n ninja -C build -j2\\\\n chown -R tester .\\\\n # Provisional install only, no checkpoint until every unchanged suite passes.\\\\n\\\\n ninja -C build install\\\\n ldconfig\\\\n if [ \"$module\" = gstreamer ]; then pkg-config --modversion gstreamer-1.0; elif [ \"$module\" = gst-plugins-base ]; then pkg-config --modversion gstreamer-pbutils-1.0; else pkg-config --modversion gstreamer-validate-1.0; fi\\\\n cd /sources\\\\n\\\\ndone\\\\nfor module in gst-plugins-good gst-plugins-bad; do\\\\n cd /sources\\\\n tar -xf \"$module-1.28.6.tar.xz\"\\\\n cd \"$module-1.28.6\"\\\\n meson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dtests=enabled -Ddoc=disabled\\\\n if [ \"$module\" = gst-plugins-good ]; then\\\\n  target=gst/debugutils/libgstdebug.so\\\\n else\\\\n  target=gst/debugutils/libgstdebugutilsbad.so\\\\n fi\\\\n ninja -C build -j2 \"$target\"\\\\n install -m0755 \"build/$target\" /usr/lib/gstreamer-1.0/\\\\n if [ \"$module\" = gst-plugins-bad ]; then\\\\n  ninja -C build -j2 gst-libs/gst/transcoder/libgsttranscoder-1.0.so.0\\\\n  install -m0755 build/gst-libs/gst/transcoder/libgsttranscoder-1.0.so.0 /usr/lib/\\\\n  ln -sf libgsttranscoder-1.0.so.0 /usr/lib/libgsttranscoder-1.0.so\\\\n  install -d /usr/include/gstreamer-1.0/gst/transcoder\\\\n  install -m0644 gst-libs/gst/transcoder/{gsttranscoder.h,transcoder-prelude.h,gsttranscoder-signal-adapter.h} build/gst-libs/gst/transcoder/transcoder-enumtypes.h /usr/include/gstreamer-1.0/gst/transcoder/\\\\n  install -m0644 build/meson-private/gstreamer-transcoder-1.0.pc /usr/lib/pkgconfig/\\\\n  ldconfig\\\\n  pkg-config --modversion gstreamer-transcoder-1.0\\\\n fi\\\\n printf \\\\\\'NAV_GST_TEST_SUPPORT_ONLY %s %s full good/bad package suites NOT RUN, not claimed passed\\\\\\\\n\\\\\\' \"$module\" \"$target\"\\\\ndone\\\\ncd /sources\\\\ntar -xf gst-devtools-1.28.6.tar.xz\\\\ncd gst-devtools-1.28.6\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dvalidate=enabled -Dtests=enabled -Ddoc=disabled -Ddots_viewer=disabled\\\\nninja -C build -j2\\\\nchown -R tester .\\\\nninja -C build install\\\\nldconfig\\\\ntest -x /usr/bin/gst-validate-transcoding-1.0\\\\npkg-config --modversion gstreamer-validate-1.0\\\\n# The real validation tool depends on installed core/base libraries. Now rerun\\\\n# all configured suites unchanged with the real tool and plugin available.\\\\nfind /usr/lib/gstreamer-1.0 -maxdepth 1 -name \\\\\\'*validate*.so\\\\\\' -print\\\\ntest -x /usr/bin/gst-validate-1.0\\\\nfor module in gstreamer gst-plugins-base gst-devtools; do\\\\n cd \"/sources/$module-1.28.6\"\\\\n set +e\\\\n su tester -c \\\\\\'dbus-run-session -- env -u LC_ALL -u LANGUAGE -u GST_CHECKS -u GST_CHECKS_IGNORE LANG=C.UTF-8 DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-gst-runtime LIBGL_ALWAYS_SOFTWARE=1 GST_CHECK_XML=1 meson test -C build --num-processes 2 --print-errorlogs\\\\\\' > \"/nav-build-metadata/tests/$module.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$module.log\"\\\\n cp build/meson-logs/testlog.{txt,json} \"/nav-build-metadata/$module/\"\\\\n NAV_GST_MODULE=\"$module\" python3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,re,base64,os,xml.etree.ElementTree as ET,shutil\\\\nmodule=os.environ[\\\\\\'NAV_GST_MODULE\\\\\\'];metadata=Path(\\\\\\'/nav-build-metadata\\\\\\')/module\\\\nb=Path(\\\\\\'build/meson-logs/testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_GST_\\\\\\'+module.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(x)for x in Path(\\\\\\'build/meson-logs/testlog.json\\\\\\').read_text().splitlines()if x.strip()]\\\\nprint(\\\\\\'NAV_GST_RESULTS\\\\\\',module,[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nerrors=[]\\\\nfor x in r:\\\\n if x[\\\\\\'result\\\\\\']!=\\\\\\'OK\\\\\\':errors.append((x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\']))\\\\n for key in [\\\\\\'stdout\\\\\\',\\\\\\'stderr\\\\\\']:\\\\n  if re.search(r\\\\\\'^not ok|#\\\\\\\\s*(SKIP|TODO)|status: (SKIP|FAIL|ERROR)\\\\\\',x.get(key,\\\\\\'\\\\\\'),re.M|re.I):errors.append((x[\\\\\\'name\\\\\\'],key,\\\\\\'nested status\\\\\\'))\\\\nxmls=list(Path(\\\\\\'.\\\\\\').rglob(\\\\\\'*check.xml\\\\\\'));total=0;bad=[]\\\\nfor p in xmls:\\\\n root=ET.parse(p).getroot();cases=root.findall(\\\\\\'.//{*}test\\\\\\')\\\\n for c in cases:\\\\n  total+=1\\\\n  if c.get(\\\\\\'result\\\\\\')!=\\\\\\'success\\\\\\':bad.append((str(p),c.get(\\\\\\'result\\\\\\')))\\\\n target=metadata/\\\\\\'check-xml\\\\\\'/p;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)\\\\nxb=__import__(\\\\\\'io\\\\\\').BytesIO()\\\\nimport tarfile\\\\nwith tarfile.open(fileobj=xb,mode=\\\\\\'w:gz\\\\\\')as tar:\\\\n for xp in (metadata/\\\\\\'check-xml\\\\\\').rglob(\\\\\\'*.xml\\\\\\'):tar.add(xp,arcname=str(xp.relative_to(metadata/\\\\\\'check-xml\\\\\\')))\\\\nfor i in range(0,len(xb.getvalue()),3000):print(\\\\\\'NAV_GST_\\\\\\'+module.upper().replace(\\\\\\'-\\\\\\',\\\\\\'_\\\\\\')+\\\\\\'_XML_B64\\\\\\',base64.b64encode(xb.getvalue()[i:i+3000]).decode(),flush=True)\\\\nprint(\\\\\\'NAV_GST_XML\\\\\\',module,{\\\\\\'files\\\\\\':len(xmls),\\\\\\'cases\\\\\\':total,\\\\\\'bad\\\\\\':bad},flush=True)\\\\nassert r and len(xmls)>0 and total>0,(module,\\\\\\'missing detailed Check XML\\\\\\')\\\\nassert not errors and not bad,(errors,bad)\\\\nAUDIT\\\\n test \"$rc\" = 0\\\\ndone\\\\ncd /sources\\\\nrm -rf gstreamer-1.28.6 gst-plugins-base-1.28.6 gst-devtools-1.28.6 gst-plugins-good-1.28.6 gst-plugins-bad-1.28.6\\\\npkg-config --modversion gstreamer-pbutils-1.0\\\\nprintf \\\\\\'GStreamer core/base and real validator configured suites audited with software X display. Good/bad debug support plugins and Bad transcoder API library built only; their full package suites NOT RUN, not claimed passed. Optional codecs are auto-detected, not complete multimedia or physical-device coverage. Documents portal, CoreAddons, KWin desktop, ISO and four Valgrind failures remain open.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_GST_PORTAL_PREREQUISITES_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/portal-json.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/portal-json.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart = time.monotonic()\nlog = open('/tmp/nav-source-stage.log', 'w')\nproc = subprocess.Popen(['bash', str(p)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\ntry:\n    while proc.poll() is None:\n        free = shutil.disk_usage('/mnt').free\n        available = mem()\n        if free < 4 * 1024 ** 3 or available < 2 * 1024 ** 2 or time.monotonic() - start > 315 * 60:\n            raise RuntimeError('resource or stage-time safety floor reached')\n        print(json.dumps({'elapsed_seconds': round(time.monotonic() - start), 'free_disk_bytes': free, 'available_memory_kib': available}), flush=True)\n        time.sleep(20)\n    if proc.returncode:\n        raise RuntimeError('source-build failed with status ' + str(proc.returncode))\nfinally:\n    if proc.poll() is None:\n        os.killpg(proc.pid, signal.SIGTERM)\n        try:\n            proc.wait(timeout=10)\n        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid, signal.SIGKILL)\n            proc.wait()\n    log.close()\n    lines = pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n    print('\\n'.join(lines[-80:]))\n    print('\\n'.join((x for x in lines if any((k in x for k in ['SOURCE_SHA256_OK', 'BEGIN_FINAL_PACKAGE', 'DONE_FINAL_PACKAGE', 'NAV_PACKAGE', 'NAV_INPUT', 'NAV_QT', 'NAV_DISPLAY', 'NAV_TEST', 'NAV_BISON', 'NAV_TESTER', 'NAV_KF6', 'Totals:', 'FAIL!', 'SKIP', 'platform plugin', 'could not connect', 'NAV_GST'])))))\nNAV_GUARD\n"
    - name: Fail closed on free-cache worst-case capacity before save
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python3 - <<''BUDGET''

        import urllib.request,json,os,subprocess

        root=int(subprocess.check_output([''du'',''-sb'',''/mnt/nav-lfs'']).split()[0])

        assert root<4800*1024**2,root

        request=urllib.request.Request(''https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/actions/caches?per_page=100'',headers={''Authorization'':''Bearer ''+os.environ[''GITHUB_TOKEN''],''Accept'':''application/vnd.github+json'',''X-GitHub-Api-Version'':''2022-11-28''})

        with urllib.request.urlopen(request,timeout=60)as r:data=json.load(r)

        assert data[''total_count'']==len(data[''actions_caches'']) and data[''total_count'']<=100

        keys={x[''key'']for x in data[''actions_caches'']}

        assert ''nav-blfs13.1-x86_64-portal-pipewire-journal-v2'' in keys

        assert ''nav-blfs13.1-x86_64-portal-gstreamer-v1'' not in keys

        required=[''final-gcc'',''gcc-test-runtime'',''gcc-test-cxx'',''gcc-test-c'',''access-tools'',''final-math'']

        assert all(''nav-lfs13.1-x86_64-''+x+''-v1'' in keys for x in required)

        total=sum(x[''size_in_bytes'']for x in data[''actions_caches''])

        worst=4864*1024**2

        print(''NAV_CACHE_BUDGET'',{''existing'':total,''root_apparent_bytes'':root,''new_cache_maximum'':worst,''worst_total'':total+worst,''limit'':10*1024**3},flush=True)

        assert total+worst<10*1024**3

        BUDGET

        '
    - name: Preserve audited GStreamer portal prerequisites
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-gstreamer-v1
