        \ a[\\\\\\'original_ctest_exit\\\\\\']==0\\\\ncache=(s/\\\\\\'build-production/CMakeCache.txt\\\\\\').read_text();assert\
        \ \\\\\\'WITH_AOM_ENCODER:BOOL=ON\\\\\\'in cache and \\\\\\'WITH_AOM_DECODER:BOOL=ON\\\\\\'in cache and\
        \ \\\\\\'WITH_REDUCED_VISIBILITY:BOOL=ON\\\\\\'in cache\\\\nPath(\\\\\\'/nav-build-metadata/libheif/restore-gate.json\\\
        \\\\').write_text(json.dumps({\\\\\\'original_source_files_exact\\\\\\':len(original),\\\\\\'compiled_paths_exact\\\
        \\\\':len(compiled),\\\\\\'recount_original_scopes_exact\\\\\\':True,\\\\\\'test_repeats\\\\\\':False,\\\
        \\\\'source_patches\\\\\\':[]},indent=2));print(\\\\\\'NAV_HEIF_RESTORED_EXACT_SOURCE_FIXTURES_COMPILED_TREES_AND_ORIGINAL_SCOPE_GATE\\\
        \\\\',len(original),len(compiled))\\\\nGATE\\\\ncmake --install /sources/libheif-1.23.7/build-production\
