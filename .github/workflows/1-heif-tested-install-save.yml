        \\\\');(p/\\\\\\'HEIF-TRANSITIONAL-OPEN.json\\\\\\').write_text(json.dumps(a,indent=2));(p/\\\\\\'installed-lossless-pixels.json\\\
        \\\\').write_text(json.dumps(a[\\\\\\'installed_roundtrips\\\\\\'],indent=2));(p/\\\\\\'BUNDLE-NOTES.txt\\\
        \\\\').write_text(\\\\\\'TRANSITIONAL ONLY. NOT OS acceptance. All inherited gaps OPEN. Originalfull89units391cases370PASS21SKIP;\
        \ production52units182cases163PASS19SKIP; zeroFAIL/unknown. Upstream hidden~5GBcase OPEN above unchanged4GiBcap.\
