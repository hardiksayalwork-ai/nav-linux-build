        \\\\ntest \"$(cat \"$P/installed-version.log\")\" = 1.23.7\\\\nldd /usr/lib/libheif.so /usr/bin/heif-enc\
        \ /usr/bin/heif-dec > \"$P/installed-linkage.log\" 2>&1\\\\n! grep -q \\\\\\'not found\\\\\\' \"$P/installed-linkage.log\"\
        \\\\ngrep -q \\\\\\'libaom.so.3\\\\\\' \"$P/installed-linkage.log\"\\\\ngrep -q \\\\\\'libde265.so\\\\\\\
        ' \"$P/installed-linkage.log\"\\\\ngrep -q \\\\\\'libx265.so\\\\\\' \"$P/installed-linkage.log\"\\\\nmkdir\
        \ /tmp/nav-heif-installed\\\\ncc /sources/heif-installed-smoke.c $(pkg-config --cflags --libs libheif) -o\
        \ /tmp/nav-heif-installed/smoke > \"$P/smoke-build.log\" 2>&1\\\\n/tmp/nav-heif-installed/smoke heic /tmp/nav-heif-installed/out.heic\
        \ > \"$P/installed-heic-lossless.log\" 2>&1\\\\n/tmp/nav-heif-installed/smoke avif /tmp/nav-heif-installed/out.avif\
        \ > \"$P/installed-avif-lossless.log\" 2>&1\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import\
        \ Path\\\\nimport json,hashlib\\\\np=Path(\\\\\\'/nav-build-metadata/libheif\\\\\\');d=Path(\\\\\\'/tmp/nav-heif-installed\\\
