        \ char *p=heif_image_get_plane(im,(enum heif_channel)c,&stride);if(!p)return 4;for(int y=0;y<h;y++)for(int\
        \ x=0;x<w;x++)p[y*stride+x]=val(c,x,y);}ok(heif_context_encode_image(ctx,im,enc,0,&handle));ok(heif_context_write_to_file(ctx,argv[2]));heif_image_handle_release(handle);heif_encoder_release(enc);heif_image_release(im);heif_context_free(ctx);ctx=heif_context_alloc();ok(heif_context_read_from_file(ctx,argv[2],0));ok(heif_context_get_primary_image_handle(ctx,&handle));ok(heif_decode_image(handle,&decoded,heif_colorspace_YCbCr,heif_chroma_420,0));size_t\
