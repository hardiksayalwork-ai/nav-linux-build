        'NAV_HEIF_INSTALLED_heic_LOSSLESS_PIXELS_EXACT 6144\\\\\\'in(p/\\\\\\'installed-heic-lossless.log\\\\\\\
        ').read_text();assert \\\\\\'NAV_HEIF_INSTALLED_avif_LOSSLESS_PIXELS_EXACT 6144\\\\\\'in(p/\\\\\\'installed-avif-lossless.log\\\
        \\\\').read_text()\\\\nfiles={f.name:{\\\\\\'bytes\\\\\\':f.stat().st_size,\\\\\\'sha256\\\\\\':hashlib.file_digest(f.open(\\\
