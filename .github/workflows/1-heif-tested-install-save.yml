name: NAV libheif original tested production install HEIC AVIF pixels TRANSITIONAL
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-heif-tested-production-save
  cancel-in-progress: false
jobs:
  save:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-aomrepair-root.tar.zst /mnt/nav-heif-tooling.tar.zst /mnt/nav-heif-root.tar.zst; do\n test\
        \ ! -e \"$bundle\"\n sudo install -o \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w\
        \ \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp\
        \ -d /tmp/nav-aom-bundle-probe.XXXXXX)\n printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar\
        \ --zstd -cf \"$bundle\" -C \"$probe\" proof\n zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof >\
        \ \"$probe/recovered\"\n cmp \"$probe/proof\" \"$probe/recovered\"\n # Match actions/cache extraction semantics,\
        \ not only bundle writer access.\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"\
        $bundle\" \"$probe/expected-bundle\"\n relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n\
        \ tar --zstd -cf \"$probe/cache.tzst\" -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS\
        \ /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\"\
        \ 2>&1\n negative_rc=$?\n set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open:\
        \ File exists' \"$probe/default-restore.log\"\n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat\
        \ -c '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n\
        \ test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS %s\\n' \"$bundle\"\n : > \"\
        $bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_HEIFSAVE_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_HEIFSAVE_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_HEIFSAVE_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_HEIFSAVE_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_HEIFSAVE_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_HEIFSAVE_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore independently verified corrected AOM root
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-aomrepair-root.tar.zst
        key: nav-blfs13.1-x86_64-aom-static-repair-open-v1
        fail-on-cache-miss: true
    - name: Verify corrected root and extract
      shell: bash
      run: 'set -euo pipefail

        printf "d28cadb0d6b7014f6b83f57fa5d136ead9448456bd640d211a31fa676b37e129  /mnt/nav-aomrepair-root.tar.zst\n"
        | sha256sum -c -

        zstd -t /mnt/nav-aomrepair-root.tar.zst

        tar --zstd -xf /mnt/nav-aomrepair-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/aom-repair/AOMREPAIR-TRANSITIONAL-OPEN.json

        '
    - name: Restore exact original tested libheif compiled trees only
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-heif-tooling.tar.zst
        key: nav-libheif-1.23.7-disposable-source-tests-v1
        fail-on-cache-miss: true
    - name: Verify source tooling bundle hash and extract
      shell: bash
      run: 'set -euo pipefail

        printf ''f0ae54e8624dd78035d72acb5cf5922fbf5af9d2742a799d5b74504a723a5e53  /mnt/nav-heif-tooling.tar.zst\n''
        | sha256sum -c -

        zstd -t /mnt/nav-heif-tooling.tar.zst

        tar --zstd -xf /mnt/nav-heif-tooling.tar.zst -C /mnt/nav-lfs

        '
    - name: Original tested production install no reruns, version/linkage and installed HEIC AVIF lossless pixels
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda :\
        \ int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\n\
        assert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024\
        \ ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs\
        \ LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\nmkdir -p \"$LFS/nav-build-metadata/libheif\"\\npython3\
        \ - <<\\'INNER\\'\\nfrom pathlib import Path\\nimport gzip,base64\\nPath(\\'/mnt/nav-lfs/sources/heif-install-stage.sh\\\
        ').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport PATH=/usr/bin:/usr/sbin:/bin:/sbin\
        \ LANG=C.UTF-8 MAKEFLAGS=-j2\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\\nP=/nav-build-metadata/libheif\\\
        \\nmkdir -p \"$P\"\\\\npython3 - <<\\\\\\'GATE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,hashlib,os\\\
        \\ns=Path(\\\\\\'/sources/libheif-1.23.7\\\\\\');p=Path(\\\\\\'/nav-build-metadata/heif-tooling\\\\\\');original=json.loads((p/\\\
        \\\\'original-source-files-sha256.json\\\\\\').read_text());compiled=json.loads((p/\\\\\\'tooling-files-sha256.json\\\
        \\\\').read_text())\\\\nfor rel,x in original.items():\\\\n f=s/rel;assert f.is_file()and f.stat().st_size==x[\\\
        \\\\'bytes\\\\\\']and hashlib.file_digest(f.open(\\\\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest()==x[\\\
        \\\\'sha256\\\\\\'],rel\\\\nfor rel,x in compiled.items():\\\\n f=Path(\\\\\\'/\\\\\\')/rel\\\\n if \\\\\
        \\'symlink\\\\\\'in x:assert f.is_symlink()and os.readlink(f)==x[\\\\\\'symlink\\\\\\'],rel\\\\n else:assert\
        \ f.is_file()and not f.is_symlink()and f.stat().st_size==x[\\\\\\'bytes\\\\\\']and hashlib.file_digest(f.open(\\\
        \\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest()==x[\\\\\\'sha256\\\\\\'],rel\\\\nfor mode,counts,units\
        \ in [(\\\\\\'full\\\\\\',{\\\\\\'cases\\\\\\':391,\\\\\\'PASS\\\\\\':370,\\\\\\'FAIL\\\\\\':0,\\\\\\'SKIP\\\
        \\\\':21,\\\\\\'XFAIL\\\\\\':0},89),(\\\\\\'production\\\\\\',{\\\\\\'cases\\\\\\':182,\\\\\\'PASS\\\\\\\
        ':163,\\\\\\'FAIL\\\\\\':0,\\\\\\'SKIP\\\\\\':19,\\\\\\'XFAIL\\\\\\':0},52)]:\\\\n a=json.loads((p/mode/\\\
        \\\\'recount-audit.json\\\\\\').read_text());assert a[\\\\\\'case_totals\\\\\\']==counts and a[\\\\\\'registered_CTest_units\\\
