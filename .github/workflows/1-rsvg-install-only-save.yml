        manifest(root):\n out={}\n for f in Path(root).rglob(''*''):\n  s=f.lstat();x={''mode'':stat.S_IMODE(s.st_mode)}\n  if
        f.is_symlink():x[''symlink'']=os.readlink(f)\n  elif f.is_file():x.update(bytes=s.st_size,sha256=sha(f))\n  elif
        f.is_dir():continue\n  else:raise AssertionError(''unsupported stagedfile ''+str(f))\n  out[str(f.relative_to(root))]=x\n
        return out\nif sys.argv[1]==''compiled'':\n n,l=source();old=json.loads((P/''original-repro/new-compiled-runtime-files-sha256.json'').read_text());names=[''build/rsvg/librsvg-2.so.2.62.4'',''build/rsvg_convert/rsvg-convert''];new={}\n
        for rel in names:\n  f=S/rel;x={''bytes'':f.stat().st_size,''sha256'':sha(f)};assert x==old[rel],{''runtime_hash_diff'':rel};new[rel]=x\n
        (P/''compiled-runtime-files-sha256.json'').write_text(json.dumps(new,indent=2));print(''NAV_RSVG_INSTALL_ORIGINAL_SOURCE_LINKS_AND_COMPILED_RUNTIME_HASHES_EXACT'',n,l)\nelif
        sys.argv[1]==''staged'':\n m=manifest(''/tmp/nav-rsvg-stage'');assert m and all(x.startswith(''usr/'')for
        x in m);assert ''usr/bin/rsvg-convert''in m and ''usr/lib/librsvg-2.so.2.62.4''in m\n assert not any(''loaders.cache''in
        x or ''/gdk-pixbuf-''in x for x in m),''legacy SVGloader unexpectedly installed''\n (P/''staged-install-manifest.json'').write_text(json.dumps(m,indent=2));print(''NAV_RSVG_STAGED_ALL_PAYLOADS_HASHED'',len(m))\nelif
