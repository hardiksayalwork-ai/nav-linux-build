        PYTHONHASHSEED=4908\nunset LC_ALL LANGUAGE\nchmod 1777 /tmp /var/tmp\nS=/sources/librsvg-2.62.4\nP=/nav-build-metadata/librsvg\nmkdir
        -p "$P" "$CARGO_HOME"\nchown -R tester:tester "$S" "$CARGO_HOME"\nsu tester -c \''export PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin
        CARGO_HOME=/tmp/nav-librsvg-cargo-home PYTHONHASHSEED=4908 CARGO_BUILD_JOBS=2;cd /sources/librsvg-2.62.4;meson
        setup --prefix=/usr --buildtype=release build\'' > "$P/install-only-configure.log" 2>&1\nsu tester -c \''export
        PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin CARGO_HOME=/tmp/nav-librsvg-cargo-home PYTHONHASHSEED=4908
        CARGO_BUILD_JOBS=2;cd /sources/librsvg-2.62.4;ninja -C build -j2\'' > "$P/install-only-build.log" 2>&1\npython3
        /sources/rsvg-install-verify.py compiled\nDESTDIR=/tmp/nav-rsvg-stage meson install -C "$S/build" --no-rebuild
        > "$P/staged-install.log" 2>&1\npython3 /sources/rsvg-install-verify.py staged\ncp -a /tmp/nav-rsvg-stage/usr/.
        /usr/\nldconfig\npkg-config --modversion librsvg-2.0 > "$P/installed-version.log"\nrsvg-convert --version
        >> "$P/installed-version.log"\nldd /usr/lib/librsvg-2.so /usr/bin/rsvg-convert > "$P/installed-linkage.log"
        2>&1\n! grep -q \''not found\'' "$P/installed-linkage.log"\ncc /sources/rsvg-render-investigation.c $(pkg-config
        --cflags --libs librsvg-2.0 pangocairo pangoft2 fontconfig) -o /tmp/rsvg-installed-render > "$P/installed-render-build.log"
        2>&1\n/tmp/rsvg-installed-render "$S/rsvg/tests/fixtures/reftests/svg1.1/text-text-03-b.svg" "$S/rsvg/tests/resources"
        "$S/rsvg/tests/fixtures/reftests/svg1.1/text-text-03-b-ref.png" "$P/original-investigation/upstream-new-reference.png"
        "$P/installed-render.png" > "$P/installed-render-comparison.log" 2>&1\npython3 /sources/rsvg-install-verify.py
        final\n'')

        Path(''/mnt/nav-lfs/sources/rsvg-install-verify.py'').write_text("from pathlib import Path\nimport json,hashlib,os,sys,stat\nP=Path(''/nav-build-metadata/librsvg'');S=Path(''/sources/librsvg-2.62.4'')\ndef
