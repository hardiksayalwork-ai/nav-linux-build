        f:f.write(json.dumps(row)+''\\n'')\n argv=[a.qemu,''-machine'',''q35,accel=''+(''tcg''if a.fixture else ''kvm''),''-cpu'',''qemu64''if
        a.fixture else ''host'',''-smp'',''1''if a.fixture else ''2'',''-m'',''256''if a.fixture else ''3072'',''-no-reboot'',''-no-shutdown'',''-boot'',''order=d,strict=on'',''-nic'',''none'',''-display'',''none'',''-vga'',''none'',''-device'',''virtio-vga,xres=1280,yres=720'',''-drive'',''file=''+str(iso)+'',media=cdrom,readonly=on,format=raw,if=ide'',''-serial'',''file:''+str(E/''serial.log''),''-qmp'',''unix:''+str(sockpath)+'',server=on,wait=off'',''-monitor'',''none'',''-S'']\n
        if a.fixture:argv+=[''-L'',str(F/''qemu'')]\n if not a.fixture:argv+=[''-drive'',''file=/mnt/nav-ui-evidence.ext4,format=raw,if=virtio'']\n
