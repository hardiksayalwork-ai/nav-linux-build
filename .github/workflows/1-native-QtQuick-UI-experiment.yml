        (D/''disk-readback'').mkdir()\n run([''debugfs'',''-R'',''rdump / ''+str(D/''disk-readback''),''/mnt/nav-ui-evidence.ext4''],''evidence-disk-readback'',60)\n
        marker=D/''disk-readback/shell-test/result.json'';L[''shell_test'']=json.loads(marker.read_text())if marker.exists()else
        {''state'':''MISSING''};L[''state'']=''CAPTURED_PENDING_VISUAL_REVIEW'';assert sha(ISO)==''09cf7f18940f8f84b9301050d98ee004a401a212a18c1abbadb18a547db83467''\nexcept
        Exception:L[''state'']=''FAIL'';L[''exception'']=traceback.format_exc();raise\nfinally:\n L[''seconds'']=time.monotonic()-start;save()\n")

