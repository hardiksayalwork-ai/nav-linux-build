        this task'',''private_artwork'':''none; explicit placeholder'',''own_scene_glass_only'':True,''steps'':{}}\ndef sha(p):\n
        h=hashlib.sha256()\n with pathlib.Path(p).open(''rb'')as f:\n  for b in iter(lambda:f.read(1048576),b''''):h.update(b)\n
        return h.hexdigest()\ndef save():(D/''target-ledger.json'').write_text(json.dumps(L,indent=2))\ndef cap():resource.setrlimit(resource.RLIMIT_AS,(4294967296,4294967296))\ndef
        run(argv,name,timeout=120,capped=False):\n t=time.monotonic()\n with(D/(name+''.stdout'')).open(''wb'')as o,(D/(name+''.stderr'')).open(''wb'')as
        e:p=subprocess.run(argv,stdout=o,stderr=e,timeout=timeout,preexec_fn=cap if capped else None,env={k:v for k,v in os.environ.items()if
        k not in [''GH_TOKEN'',''GITHUB_TOKEN'']})\n L[''steps''][name]={''argv'':argv,''exit'':p.returncode,''seconds'':time.monotonic()-t};save();assert
