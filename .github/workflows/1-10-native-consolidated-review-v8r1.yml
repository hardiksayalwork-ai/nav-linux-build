name: NAV consolidated review build
'on':
  workflow_dispatch:
    inputs:
      art_release_id:
        description: Pinned private draft input release ID
        required: true
        type: string
      art_asset_id:
        description: Pinned private artwork ZIP asset ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  nativeUI:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Exact45 free public one-shot preflight
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_RUN_NUMBER\" = 1\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\npython3 - <<'PREFLIGHT'\n\
        import urllib.request, urllib.error, json, time, os\nstart = time.monotonic()\nbase = 'https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build'\n\
        token = os.environ['GH_TOKEN']\nassert token\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\n    def redirect_request(self,\
        \ req, fp, code, msg, headers, newurl):\n        raise urllib.error.HTTPError(req.full_url, code, 'redirect refused\
        \ for scoped authenticated preflight', headers, fp)\nopener = urllib.request.build_opener(NoRedirect())\n\ndef req(u):\n\
        \    assert u.startswith(base)\n    q = urllib.request.Request(u, headers={'Authorization': 'Bearer ' + token, 'Accept':\
        \ 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Cache-Control': 'no-store'})\n    with opener.open(q,\
        \ timeout=30) as response:\n        return json.load(response)\nr = req(base + '?t=' + str(time.time_ns()))\nassert\
        \ r['private'] is False\nc = req(base + '/actions/caches?per_page=100&t=' + str(time.time_ns()))\nimport pathlib,\
        \ hashlib, urllib.request, importlib.util\nfor (url, dest, digest) in [('https://raw.githubusercontent.com/hardiksayalwork-ai/nav-linux-build/82ecdb920190e8773d7cdad577ea0d8c331b531e/build/attestations/4-nav-build-manifest45-v1.json',\
        \ '/tmp/nav-build-manifest-v1.json', '678ed61b4bdb6eb2cee53cbd2d7b0a2cdebd4d169d59d55c2652cd5fc7b75cc5'), ('https://raw.githubusercontent.com/hardiksayalwork-ai/nav-linux-build/556ab36848748407e42c6cca865caf2eca03b8d4/build/attestations/2-nav-build-verify-v1.py',\
        \ '/tmp/nav-build-verify-v1.py', '36c19d80ab45a7cffd34fcf09e278c8948678b554e92ae864658a1afd93f2375')]:\n    b = urllib.request.urlopen(url,\
        \ timeout=60).read()\n    assert hashlib.sha256(b).hexdigest() == digest\n    pathlib.Path(dest).write_bytes(b)\n\
        spec = importlib.util.spec_from_file_location('nav_readonly_verifier', '/tmp/nav-build-verify-v1.py')\nverifier =\
        \ importlib.util.module_from_spec(spec)\nspec.loader.exec_module(verifier)\naccepted = verifier.load_manifest('/tmp/nav-build-manifest-v1.json',\
        \ '678ed61b4bdb6eb2cee53cbd2d7b0a2cdebd4d169d59d55c2652cd5fc7b75cc5')\nexpected = accepted['protected_caches']\nactual\
        \ = {str(z['id']): {'key': z['key'], 'bytes': z['size_in_bytes']} for z in c['actions_caches']}\nassert c['total_count']\
        \ == len(actual) == len(expected) and actual == expected\nassert sum((z['bytes'] for z in actual.values())) < 10 *\
        \ 1024 ** 3\nprint('NAV_FFMPEG_PUBLIC_STANDARD_RUNNER_FREE_CACHE_EXACT ' + json.dumps({'public': True, 'standard_runner':\
        \ 'ubuntu-24.04', 'cache_count': len(actual), 'cache_bytes': sum((z['bytes'] for z in actual.values())), 'no_cache_save_or_delete':\
        \ True, 'elapsed': time.monotonic() - start}), flush=True)\nprint('NAV_MANIFEST43_READONLY_VERIFIED ' + json.dumps(verifier.verify_inventory(accepted,\
        \ c), sort_keys=True), flush=True)\nPREFLIGHT\n"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Ephemeral host tools only, no target distro binaries
      run: 'set -euo pipefail

        test $(df --output=avail -B1 /mnt | tail -1) -ge 15032385536

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios python3-pil xorriso squashfs-tools e2fsprogs
        ffmpeg tesseract-ocr tesseract-ocr-eng

        '
    - name: Fetch exact draft asset only
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 - <<'FETCH'\nimport json,subprocess,pathlib,hashlib\nrepo='hardiksayalwork-ai/nav-linux-build';release=453724002;asset=775726636;expected='09cf7f18940f8f84b9301050d98ee004a401a212a18c1abbadb18a547db83467'\n\
        r=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/'+str(release)],timeout=45));assert r['draft']is\
        \ True and r['published_at']is None and r['tag_name']=='nav-development-packaging-44910263539';a=next(x for x in r['assets']if\
        \ x['id']==asset);assert a['name']=='NAV-development-001.iso' and a['size']==1734334464 and a['digest']=='sha256:'+expected\
        \ and a['state']=='uploaded'\np=pathlib.Path('/tmp/NAV-development-001.iso')\nwith p.open('wb')as f:subprocess.run(['gh','api','repos/'+repo+'/releases/assets/'+str(asset),'-H','Accept:\
        \ application/octet-stream'],stdout=f,check=True,timeout=240)\nh=hashlib.sha256()\nwith p.open('rb')as f:\n for b\
        \ in iter(lambda:f.read(1048576),b''):h.update(b)\nassert p.stat().st_size==1734334464 and h.hexdigest()==expected;p.chmod(0o444);print(json.dumps({'exact_retained_asset':asset,'bytes':p.stat().st_size,'sha256':h.hexdigest(),'draft':True}))\n\
        \nFETCH\n"
    - name: Read exact allowlisted private artwork from unpublished draft only
      env:
        GH_TOKEN: ${{ github.token }}
        ART_RELEASE_ID: ${{ inputs.art_release_id }}
        ART_ASSET_ID: ${{ inputs.art_asset_id }}
      run: "python3 - <<'ARTINPUT'\n# Authenticated draft-input-only read. No private bytes, URLs or archive contents in logs.\n\
        import pathlib,os,json,subprocess,hashlib,zipfile,io\nALLOWLIST={'apps.png': {'bytes': 5253, 'sha256': '7ae17f7627fca989d19bc7ba5f4b33c940040b1dec0160d4ebb3d1ea3c5e5102'},\
        \ 'browser.png': {'bytes': 5302, 'sha256': 'bce8bfb09026a5e0253da80faebbf12a3717cffc612c86d4daca991bdf83ee42'}, 'calendar.png':\
        \ {'bytes': 5138, 'sha256': '667caea12bb9ed7a4e4622f23d836db585b27661020139b07978e8ed3e987cf9'}, 'card-shadow.png':\
        \ {'bytes': 8907, 'sha256': 'e0c9594bc15c2ab6660ba69692d9fdfba66e9a73cd5dedeaa96443bbc990b4c4'}, 'demo.png': {'bytes':\
        \ 5360, 'sha256': '62462cd9dc98a41cc8f8243434df149067c27913f05fccc44cd582679a94e668'}, 'glyph-connect.png': {'bytes':\
        \ 774, 'sha256': '68b330169c910465850d0cf1d84f0bee40e1082c2acc40173718d7598ddba541'}, 'glyph-create.png': {'bytes':\
        \ 962, 'sha256': '23aba5f96326a7c9fdf1fde79b9626a215517281ef3e6aae3d0f5e28a96489b8'}, 'glyph-learn.png': {'bytes':\
        \ 1015, 'sha256': '7e7a5f7ef6768de5e49e878195285677e2cba2543ecc4c123f770931a54762f5'}, 'glyph-mark.png': {'bytes':\
        \ 1605, 'sha256': '95a98ffa11247c9b516a883b982323f35677690c78e2dbff22310d4d82a29f33'}, 'glyph-play.png': {'bytes':\
        \ 950, 'sha256': 'b9f025f1f1fb2089d07dbc95815d7709c5807b6b5d99036b4bb469ec8b6aeaaa'}, 'glyph-utilities.png': {'bytes':\
        \ 982, 'sha256': '387ec32f41ba1f3d7c0b39b0b3f14544a6815b085dd596e35a20aeb25e777ad0'}, 'glyph-work.png': {'bytes':\
        \ 645, 'sha256': 'fb6818c20a5701a71dd72bcd6b95f4fcba684eed298960ec5de7b3fdca54eaee'}, 'mail.png': {'bytes': 4593,\
        \ 'sha256': 'e8a03d4e16725530c537c844209bc4cf0681b719c017122cb028d07691e04833'}, 'music.png': {'bytes': 5182, 'sha256':\
        \ 'bb1d4486a4c311a3c2668956a43a569505d3c64de7e9efdbe535e93a644151f3'}, 'nav-mark.png': {'bytes': 1051, 'sha256': '13d7641c4610d1d0f292a5cf13575451ef33c16ab06ae8e92b986f605dfa12dd'},\
        \ 'nav.png': {'bytes': 4787, 'sha256': 'a1f1296839b9f1a1131d2a74f8b1261a979d3f972471fb4c26f3dac295c2274a'}, 'nova.png':\
        \ {'bytes': 4145, 'sha256': '0ebf557fe09274aa97b4c23c0c0a483f26c0ba3373934f71bf9d46622e541c68'}, 'panel-shadow.png':\
        \ {'bytes': 13536, 'sha256': 'fe2e3ce156bd86283963f010c3761d8b0ddcfe6080675a6330259a1e08038dee'}, 'photos.png': {'bytes':\
        \ 5262, 'sha256': '6193defa3aed344635625ba3791b0d6339bf5658253628cb1c8839f405f34819'}, 'settings.png': {'bytes': 4837,\
        \ 'sha256': '4a028448e3c87a3d6a8b0bb2f790494cc253827e676338eb8e5ab0a94c159c22'}, 'wallpaper.png': {'bytes': 151710,\
        \ 'sha256': '631d224b392517c961bc635155a9fe36bc101030139ec8be9504fa2fed151dd4'}}\nrelease=os.environ['ART_RELEASE_ID'];asset=os.environ['ART_ASSET_ID'];assert\
        \ release.isdecimal()and asset.isdecimal();repo='hardiksayalwork-ai/nav-linux-build';expected='3c85aac8476eacf21cac2dbea0e4e7bf8042237432d472d301f307dd9d9c8212'\n\
        r=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/'+release],timeout=30));assert r['draft']is\
        \ True and r['published_at']is None and r['name']=='PRIVATE INPUT: NAV reference-matched shell review';a=next(x for\
        \ x in r['assets']if str(x['id'])==asset);assert a['name']=='NAV-reference-matched-input.zip'and a['size']==234737\
        \ and a['state']=='uploaded'and a['digest']=='sha256:'+expected\np=pathlib.Path('/tmp/nav-private-artwork.zip')\n\
        with p.open('wb')as f:subprocess.run(['gh','api','repos/'+repo+'/releases/assets/'+asset,'-H','Accept: application/octet-stream'],stdout=f,check=True,timeout=90)\n\
        b=p.read_bytes();assert len(b)==234737 and hashlib.sha256(b).hexdigest()==expected\nD=pathlib.Path('/tmp/nav-artwork-input');D.mkdir()\n\
        with zipfile.ZipFile(io.BytesIO(b))as z:\n expected_names=set(ALLOWLIST)|{'intake-manifest.json'};assert len(z.infolist())==len(expected_names)and\
        \ set(z.namelist())==expected_names;assert sum(x.file_size for x in z.infolist())<16*1024**2\n for name in sorted(ALLOWLIST):\n\
        \  v=ALLOWLIST[name];data=z.read(name);assert len(data)==v['bytes']and hashlib.sha256(data).hexdigest()==v['sha256'];assert\
        \ data.startswith(b'\\x89PNG\\r\\n\\x1a\\n');(D/name).write_bytes(data)\n manifest=z.read('intake-manifest.json');j=json.loads(manifest);assert\
        \ j['files']==ALLOWLIST;(D/'intake-manifest.json').write_bytes(manifest)\n# Output only an audit status, never image\
        \ bytes or candidate artwork/source.\nprint('NAV_ART_DRAFT_INPUT_VERIFIED '+json.dumps({'draft':True,'archive_bytes':len(b),'archive_sha256':expected,'allowlist_exact':True,'files':len(ALLOWLIST),'status':'reference-matched\
        \ user-approved direction, reconstructed wallpaper and extracted icons'}),flush=True)\n\nARTINPUT\n"
    - name: Stage verified source chunk 1 of 10
      run: 'python3 - <<''CHUNK''

        from pathlib import Path

        with Path(''/tmp/nav-stage.b64'').open(''xb'') as f:f.write(b'''')

        CHUNK

        '
    - name: Stage verified source chunk 2 of 10
      run: 'python3 - <<''CHUNK''

        from pathlib import Path

        with Path(''/tmp/nav-stage.b64'').open(''ab'') as f:f.write(b'''')

