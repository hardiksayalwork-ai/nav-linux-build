name: NAV source Mesa Python prerequisites
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  mesa-prep:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-libdrm-v1
        fail-on-cache-miss: true
    - name: Build source pytest bootstrap Mako PyYAML
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"vcs_versioning-2.2.4.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/v/vcs_versioning/vcs_versioning-2.2.4.tar.gz\", \"bytes\": 145243, \"book_md5\": \"4379f311792d41c845f9b86975b1be18\", \"sha256\": \"ed718fdee42170e128a8add6f23f53aa64dc7d9ab2de87d3083a691df881a809\"\
        }, {\"filename\": \"setuptools_scm-10.1.2.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/s/setuptools_scm/setuptools_scm-10.1.2.tar.gz\", \"bytes\": 66674, \"book_md5\": \"fc7dfeae0b61636e3705547acc9f3276\", \"sha256\": \"24079818acc46e99aae0d65b8d511fafe965970d9cbd060c7b9f7275ded520fb\"}, {\"filename\": \"iniconfig-2.3.0.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/i/iniconfig/iniconfig-2.3.0.tar.gz\", \"bytes\": 20503, \"book_md5\": \"5c1d9c21275feb3da71400bf716edd72\", \"sha256\": \"c76315c77db068650d49c5b56314774a7804df16fee4402c1f19d6d15d8c4730\"}, {\"filename\": \"pluggy-1.6.0.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/p/pluggy/pluggy-1.6.0.tar.gz\", \"bytes\": 69412, \"book_md5\": \"54391218af778acb006c2d915085d469\", \"sha256\": \"7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3\"}, {\"filename\": \"pathspec-1.1.1.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/p/pathspec/pathspec-1.1.1.tar.gz\"\
        , \"bytes\": 135180, \"book_md5\": \"c762d0a00d6cfc9de003e02d5072b26a\", \"sha256\": \"17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a\"}, {\"filename\": \"poetry_core-2.4.1.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/p/poetry_core/poetry_core-2.4.1.tar.gz\", \"bytes\": 413699, \"book_md5\": \"6c4fb726467b1e270892f51c54c392ba\", \"sha256\": \"89dceb6c10e9c6d8650a16183400e3c9ff9ddee13b0a81023b5575334a2b3744\"}, {\"filename\": \"tomlkit-0.15.1.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/t/tomlkit/tomlkit-0.15.1.tar.gz\", \"bytes\": 180129, \"book_md5\": \"8e5245fd4099c9a6f99774b24a4591ae\", \"sha256\": \"e25bbf38843005246210a12982776f27f99cb9be67160e14434d0c0d21ee1e97\"}, {\"filename\": \"trove_classifiers-2026.6.1.19.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/t/trove_classifiers/trove_classifiers-2026.6.1.19.tar.gz\", \"bytes\": 17059, \"book_md5\": \"fb231b2e9492a5d34fb9bec0250f0f55\", \"sha256\"\
        : \"c5132b4b61a829d11cfbd2d72e97f20a45ed6edb95e45c5efdeb5e00836b2745\"}, {\"filename\": \"hatchling-1.32.0.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/h/hatchling/hatchling-1.32.0.tar.gz\", \"bytes\": 57783, \"book_md5\": \"e5870c28ce4403c12b3d9a4a4f8866fe\", \"sha256\": \"0bdbde4a52b06c37e3eca395f85a762bf0ef06fe374fd8ae429dc6be10230f5f\"}, {\"filename\": \"pygments-2.20.0.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/P/Pygments/pygments-2.20.0.tar.gz\", \"bytes\": 4955991, \"book_md5\": \"358297d0a1db8e4beff8eebc0620960e\", \"sha256\": \"6757cd03768053ff99f3039c1a36d6c0aa0b263438fcab17520b30a303a82b5f\"}, {\"filename\": \"pytest-9.1.1.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/p/pytest/pytest-9.1.1.tar.gz\", \"bytes\": 1636369, \"book_md5\": \"31f635913c0b1bce9438be52d44398a8\", \"sha256\": \"1088fbde8f2b49d95a549a195707afa7a76a3ce9bcadc26b6d71f0ffda5fe313\"}, {\"filename\": \"mako-1.4.1.tar.gz\", \"url\": \"\
        https://files.pythonhosted.org/packages/source/M/Mako/mako-1.4.1.tar.gz\", \"bytes\": 410165, \"book_md5\": \"9c09a897c23a34df7ba614ec2d7229e1\", \"sha256\": \"d7904710b662996425a21627710c4777c45053146942cf8a7aebf757c92b8c27\"}, {\"filename\": \"pyyaml-6.0.3.tar.gz\", \"url\": \"https://files.pythonhosted.org/packages/source/P/PyYAML/pyyaml-6.0.3.tar.gz\", \"bytes\": 130960, \"book_md5\": \"dbc6f815cd75160ccf12e470be1c8d6e\", \"sha256\": \"d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/mesa-prep.sh\\').write_text(\\\
        'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nprintf \\\\\\'NAV_PREVIOUS_LIBDRM_TEST_LOG_BEGIN\\\\n\\\\\\'\\\\ncat /nav-build-metadata/tests/libdrm.log\\\\\
        nprintf \\\\\\'NAV_PREVIOUS_LIBDRM_TEST_LOG_END\\\\n\\\\\\'\\\\nexport PIP_NO_INDEX=1\\\\nexport PIP_DISABLE_PIP_VERSION_CHECK=1\\\\nexport PYYAML_FORCE_LIBYAML=0\\\\ncd /sources\\\\ntar -xf vcs_versioning-2.2.4.tar.gz\\\\ncd vcs_versioning-2.2.4\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED vcs_versioning (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf vcs_versioning-2.2.4\\\\ntar -xf setuptools_scm-10.1.2.tar.gz\\\\ncd setuptools_scm-10.1.2\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED setuptools_scm (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf setuptools_scm-10.1.2\\\\ntar -xf iniconfig-2.3.0.tar.gz\\\\ncd iniconfig-2.3.0\\\\\
        npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED iniconfig (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf iniconfig-2.3.0\\\\ntar -xf pluggy-1.6.0.tar.gz\\\\ncd pluggy-1.6.0\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED pluggy (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf pluggy-1.6.0\\\\ntar -xf pathspec-1.1.1.tar.gz\\\\ncd pathspec-1.1.1\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED pathspec (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf pathspec-1.1.1\\\\\
        ntar -xf poetry_core-2.4.1.tar.gz\\\\ncd poetry_core-2.4.1\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED poetry_core (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf poetry_core-2.4.1\\\\ntar -xf tomlkit-0.15.1.tar.gz\\\\ncd tomlkit-0.15.1\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED tomlkit (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf tomlkit-0.15.1\\\\ntar -xf trove_classifiers-2026.6.1.19.tar.gz\\\\ncd trove_classifiers-2026.6.1.19\\\\nsed -i \\\\\\'/calver/s/^/#/;$iversion=\"2026.6.1.19\"\\\\\\' setup.py\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist\
        \ --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED trove_classifiers (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf trove_classifiers-2026.6.1.19\\\\ntar -xf hatchling-1.32.0.tar.gz\\\\ncd hatchling-1.32.0\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED hatchling (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf hatchling-1.32.0\\\\ntar -xf pygments-2.20.0.tar.gz\\\\ncd pygments-2.20.0\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED pygments (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf pygments-2.20.0\\\\ntar -xf pytest-9.1.1.tar.gz\\\\ncd pytest-9.1.1\\\\npip3 wheel -w dist --no-build-isolation\
        \ --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nprintf \\\\\\'NAV_BUILD_TOOL_INSTALLED pytest (no full upstream suite claim)\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf pytest-9.1.1\\\\ntar -xf mako-1.4.1.tar.gz\\\\ncd mako-1.4.1\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nchown -R tester:tester .\\\\nrun_test mako su tester -c \"python3 -m pytest -ra\"\\\\ncd /sources\\\\nrm -rf mako-1.4.1\\\\ntar -xf pyyaml-6.0.3.tar.gz\\\\ncd pyyaml-6.0.3\\\\npip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir \"$PWD\"\\\\npip3 install --no-index --find-links dist --no-user --no-deps dist/*.whl\\\\nchown -R tester:tester .\\\\nrun_test pyyaml su tester -c \"python3 -m pytest -ra\"\\\\ncd /sources\\\\nrm -rf pyyaml-6.0.3\\\\npython3 - <<\\\\\\'PYTHON_SMOKE\\\\\\'\\\\nfrom mako.template import Template\\\
        \\nimport yaml,pytest\\\\nassert Template(\\\\\\'NAV ${n}\\\\\\').render(n=42)==\\\\\\'NAV 42\\\\\\'\\\\nassert yaml.safe_load(\\\\\\'nav: [1, 2]\\\\\\')=={\\\\\\'nav\\\\\\':[1,2]}\\\\nassert not getattr(yaml,\\\\\\'__with_libyaml__\\\\\\',False)\\\\nprint(\\\\\\'NAV_MESA_PREP_SMOKE_OK\\\\\\',pytest.__version__,yaml.__version__)\\\\nPYTHON_SMOKE\\\\nprintf \\\\\\'Mako and pure-Python PyYAML strict pytest suites; YAML C accelerator deferred. Source-built pytest and packaging bootstrap exercised by these suites, not full upstream suites of every build tool.\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_MESA_PREP_STAGE_COMPLETE\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"\
        /{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/mesa-prep.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\\
        'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/mesa-prep.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_MESA_PREP','NAV_PREVIOUS','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve Mesa Python prerequisites
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-mesa-prep-v1
