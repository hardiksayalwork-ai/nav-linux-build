        \ subprocess\n subprocess.run(['tar','--zstd','--same-owner','--same-permissions','-xpf',str(f),'-C',str(root)],check=True)\n\
        \ def manifest(root):\n  out={}\n  for p in[root]+sorted(root.rglob('*')):\n   s=p.lstat();z={'type':stat.S_IFMT(s.st_mode),'mode':stat.S_IMODE(s.st_mode),'uid':s.st_uid,'gid':s.st_gid,'mtime':s.st_mtime_ns}\n\
