      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-gstgood-prerequisites.tar.zst
        key: nav-gstgood-narrow-install-only-transitional-open-v1
        fail-on-cache-miss: true
    - name: Restore exact verified opusbase narrow original-tested bundle OPEN gaps retained
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-opusbase-prerequisites.tar.zst
        key: nav-opus-baseopus-install-only-open-v1
        fail-on-cache-miss: true
    - name: Authenticate proof hashes full bundle replay all paths and original immutable123exports
