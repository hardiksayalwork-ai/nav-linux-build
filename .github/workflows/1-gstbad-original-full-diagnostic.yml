        \ m['BUNDLE-PROOF_JSON']==x['expected_proof'];parts=[]\n for l in raw.splitlines():\n  l=re.sub(r'^\\S+Z\
        \ ','',l)\n  if l.startswith(prefix+'BUNDLE-PROOF_JSON_GZB64 '):parts.append(base64.b64decode(l.split('\
