        \ 'key': 'nav-gstgood-narrow-install-only-transitional-open-v1', 'archive': '/mnt/nav-gstgood-prerequisites.tar.zst'},\
        \ {'label': 'opusbase', 'job': 135899642946, 'expected_proof': {'bytes': 30579, 'file': 'bundle-proof.json',\
        \ 'sha256': 'a9f48cc656b71ede3a8940a2c7b30eb274ea5719c2db128ca2f5a99a232c3e05'}, 'key': 'nav-opus-baseopus-install-only-open-v1',\
        \ 'archive': '/mnt/nav-opusbase-prerequisites.tar.zst'}]\nimport stat\nA=Path('/mnt/nav-lfs/sources/nav-gstbad-evidence');A.mkdir(parents=True,exist_ok=True)\n\
