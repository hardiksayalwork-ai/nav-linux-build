        \ l=re.sub(r'^\\S+Z ','',l)\n if l.startswith('NAV_GSTGOOD_')and'_GZB64 'in l:\n  k,v=l.split(' ',1);parts.setdefault(k,[]).append(base64.b64decode(v))\n\
        assert set(parts)=={'NAV_GSTGOOD_'+k+'_GZB64'for k in m}\nfor k,v in m.items():\n b=gzip.decompress(b''.join(parts['NAV_GSTGOOD_'+k+'_GZB64']));assert\
        \ len(b)==v['bytes']and hashlib.sha256(b).hexdigest()==v['sha256'];p=A/v['file'];assert p.is_relative_to(A);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)\n\
        import collections,xml.etree.ElementTree as E\nr=[json.loads(l)for l in(A/'testlog.json').read_text().splitlines()if\
        \ l.strip()];d=json.loads((A/'discovery.json').read_text());assert collections.Counter(x['name'].removeprefix('gst-plugins-good:')for\
        \ x in r)==collections.Counter(x['name']for x in d);assert len(r)==102 and collections.Counter(x['result']for\
        \ x in r)=={'OK':101,'FAIL':1};f=[x for x in r if x['result']=='FAIL'];assert f[0]['name']=='gst-plugins-good:elements_flvmux'and'Test\
        \ timeout expired'in f[0]['stdout']and'test_video_caps_late'in f[0]['stdout']\nc=json.loads((A/'coverage.json').read_text());assert\
        \ len(c['Check_XML'])==102 and sum(x['cases']for x in c['Check_XML'])==1187;assert sum(x['results'].get('success',0)for\
        \ x in c['Check_XML'])==1186 and sum(x['results'].get('error',0)for x in c['Check_XML'])==1;assert c['nested_warning_lines']==[];assert\
        \ json.loads((A/'source-integrity.json').read_text())['files_exact']==1774\n(A/'verified-export-manifest.json').write_text(json.dumps(m,sort_keys=True));ledger={'classification':'TRANSITIONAL\
        \ narrow Good prerequisite. Full original canonical 101OK1FAIL; flvmux test_video_caps_late timeout OPEN,\
        \ not replayed/waived/relabelled. flv excluded from payload. splitmuxsinktimecode zero cases OPEN. Optional\
        \ codec/hardware and inherited OPEN gaps retained. Rebuilt install-only binaries, original binary equivalence\
        \ NOT claimed.','original_run':'https://github.com/hardiksayalwork-ai/nav-linux-build/actions/runs/44605401634/job/135847639938','all117_exports_exact':True,'programs':{'OK':101,'FAIL':1},'XML':{'files':102,'cases':1187,'success':1186,'error':1},'payload_plugins':['audiofx','rtpmanager','rtp','udp','soup'],'canonical_tests_replayed':False};(A.parent/'canonical-ledger.json').write_text(json.dumps(ledger,sort_keys=True));print('NAV_GSTGOOD_INSTALL_ORIGINAL_LEDGER_JSON\
        \ '+json.dumps(ledger,sort_keys=True),flush=True)\n\nRECOVER\n"
    - name: Pinned untouched Good source and approved narrow install-only script
      shell: bash
      run: "set -euo pipefail\npython3 - <<'SETUP'\nfrom pathlib import Path\nimport urllib.request,tarfile,hashlib,json\n\
        x={'filename': 'gst-plugins-good-1.28.6.tar.xz', 'url': 'https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.6.tar.xz',\
