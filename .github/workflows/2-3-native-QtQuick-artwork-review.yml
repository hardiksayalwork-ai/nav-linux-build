        before={p.relative_to(R).as_posix():sha(p)for p in [R/''usr/bin/nav-shell-prototype'',R/''opt/nav-shell-prototype/lens.png'',R/''usr/share/glib-2.0/schemas/gschemas.compiled'']+list(fixtures.iterdir())};L[''added_payload_hashes'']=before;save()\n
        new=pathlib.Path(''/mnt/nav-ui-filesystem.squashfs'');run([''mksquashfs'',str(R),str(new),''-comp'',''zstd'',''-Xcompression-level'',''9'',''-processors'',''2'',''-mem'',''1G'',''-noappend'',''-xattrs''],''new-squashfs'',480)\n
        shutil.rmtree(R)\n run([''xorriso'',''-indev'',str(ISO),''-outdev'',str(C),''-boot_image'',''any'',''replay'',''-hfsplus'',''off'',''-overwrite'',''on'',''-map'',str(new),''/live/filesystem.squashfs'',''-commit''],''new-candidate-ISO'',180)\n
        run([''xorriso'',''-osirrox'',''on'',''-indev'',str(C),''-extract'',''/live/filesystem.squashfs'',''/mnt/nav-ui-squash-readback''],''candidate-readback'',180);assert
