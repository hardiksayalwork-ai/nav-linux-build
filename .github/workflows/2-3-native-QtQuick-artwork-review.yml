        this task'',''private_artwork'':''regenerated review candidates from exact private draft input; never approved for
        delivered builds'',''own_scene_glass_only'':True,''steps'':{}}\ndef sha(p):\n h=hashlib.sha256()\n with pathlib.Path(p).open(''rb'')as
        f:\n  for b in iter(lambda:f.read(1048576),b''''):h.update(b)\n return h.hexdigest()\ndef save():(D/''target-ledger.json'').write_text(json.dumps(L,indent=2))\ndef
        cap():resource.setrlimit(resource.RLIMIT_AS,(4294967296,4294967296))\ndef run(argv,name,timeout=120,capped=False):\n
        t=time.monotonic()\n with(D/(name+''.stdout'')).open(''wb'')as o,(D/(name+''.stderr'')).open(''wb'')as e:p=subprocess.run(argv,stdout=o,stderr=e,timeout=timeout,preexec_fn=cap
        if capped else None,env={k:v for k,v in os.environ.items()if k not in [''GH_TOKEN'',''GITHUB_TOKEN'']})\n L[''steps''][name]={''argv'':argv,''exit'':p.returncode,''seconds'':time.monotonic()-t};save();assert
        p.returncode==0,(name,p.returncode)\ndef chroot(argv,name,timeout=120):run([''chroot'',str(R),''/usr/bin/env'',''PATH=/opt/qt6/bin:/usr/bin:/usr/sbin:/bin:/sbin'',''LD_LIBRARY_PATH=/opt/qt6/lib'',''HOME=/tmp'',''LC_ALL=C.UTF-8'']+argv,name,timeout,True)\ntry:\n
        assert os.getuid()==0 and ISO.stat().st_size==1734334464 and sha(ISO)==''09cf7f18940f8f84b9301050d98ee004a401a212a18c1abbadb18a547db83467'';assert
        os.access(''/dev/kvm'',os.R_OK|os.W_OK)\n T.mkdir();(T/''live'').mkdir();(T/''boot/grub'').mkdir(parents=True)\n for
        path in [''live/filesystem.squashfs'',''boot/vmlinuz'',''boot/initramfs.gz'',''boot/grub/grub.cfg'']:run([''xorriso'',''-osirrox'',''on'',''-indev'',str(ISO),''-extract'',''/''+path,str(T/path)],''extract-''+path.replace(''/'',''_''),240)\n
        run([''unsquashfs'',''-processors'',''2'',''-d'',str(R),str(T/''live/filesystem.squashfs'')],''extract-root'',240)\n
        (T/''live/filesystem.squashfs'').unlink()\n for n in [''opt/qt6/include/QtTest/QTest'',''opt/qt6/include/QtQuick/QQuickWindow'',''opt/qt6/bin/qsb'',''opt/qt6/lib/cmake/Qt6/Qt6Config.cmake'',''usr/bin/g++'',''usr/bin/cmake'',''usr/bin/ninja'',''usr/bin/mutter'',''usr/bin/python3'']:\n  assert(R/n).is_file(),n\n
        # Fresh public-safe input archive is embedded by the workflow generator.\n S=R/''tmp/nav-ui-source'';S.mkdir();fixtures=R/''opt/nav-ui-fixture'';fixtures.mkdir()\n
        for name,data in INPUTS.items():\n  assert ''/''not in name and name not in [''.'',''..'']\n  if name.startswith(''fixture-''):(fixtures/name[8:]).write_bytes(base64.b64decode(data))\n  else:(S/name).write_bytes(base64.b64decode(data))\n
        A=pathlib.Path(''/tmp/nav-artwork-input'');art=R/''opt/nav-shell-prototype/artwork'';art.mkdir(parents=True)\n record=json.loads((A/''intake-manifest.json'').read_text());L[''artwork_status'']=record[''status''];L[''artwork_hashes'']=record[''files'']\n
        for name,v in record[''files''].items():\n  assert ''/''not in name and name.endswith(''.png'');src=A/name;assert
        src.stat().st_size==v[''bytes'']and sha(src)==v[''sha256''];shutil.copy2(src,art/name);assert sha(art/name)==v[''sha256'']\n
        save()\n run([''mount'',''-t'',''tmpfs'',''-o'',''mode=0755,nosuid,noexec'',''tmpfs'',str(R/''dev'')],''build-dev-mount'')\n
        run([''mount'',''-t'',''proc'',''-o'',''nosuid,nodev,noexec'',''proc'',str(R/''proc'')],''build-proc-mount'')\n try:\n  for
        name,minor in [(''null'',3),(''zero'',5),(''random'',8),(''urandom'',9)]:os.mknod(R/''dev''/name,stat.S_IFCHR|0o666,os.makedev(1,minor))\n  chroot([''glib-compile-schemas'',''--strict'',''/usr/share/glib-2.0/schemas''],''native-schema-rebuild'',30)\n  chroot([''env'',''GSETTINGS_SCHEMA_DIR=/usr/share/glib-2.0/schemas'',''XDG_DATA_DIRS=/usr/local/share:/usr/share'',''gsettings'',''list-schemas''],''native-schema-enumerate'',30)\n  required={''org.gnome.mutter'',''org.gnome.mutter.wayland'',''org.gnome.desktop.interface'',''org.gnome.desktop.wm.preferences''};assert
