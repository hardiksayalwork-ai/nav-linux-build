        assert not any(os.path.ismount(R/n)for n in [''dev'',''proc'',''sys'',''run''])\n for name in [''nav-ui-evidence.service'',''nav-ui-session.service'']:shutil.copy2(fixtures/name,R/''etc/systemd/system''/name)\n
