name: NAV source Valgrind strict full configured regression
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  valgrind:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-input-debug-v1
        fail-on-cache-miss: true
    - name: Build Valgrind and run full configured regtest
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"valgrind-3.27.1.tar.bz2\", \"url\": \"https://sourceware.org/pub/valgrind/valgrind-3.27.1.tar.bz2\", \"bytes\": 17372682, \"sha256\": \"5d589152eb8071c02feab8ce6ab719e431a1fbc3e2b1700f5432632a8b9264dc\", \"book_md5\": \"9b819b1aa88fc5936373fc624aa75723\"}, {\"filename\"\
        : \"valgrind-3.27.1-debug-location.patch\", \"url\": \"https://sourceware.org/git/?p=valgrind.git;a=patch;h=44f0352b04d1b4ff68f3900406e6f9beed938b44\", \"bytes\": 860, \"sha256\": \"ea39a08d696ffb52ac4056eac59377a8f37f3c98a55ca89a662bc76026768449\"}, {\"filename\": \"coreutils-9.11-cat-pipe-close.patch\", \"url\": \"https://github.com/coreutils/coreutils/commit/45e98f93b302451b9b27cc56b1c0af07d8f97e67.patch\", \"bytes\": 3195, \"sha256\": \"91a2b2aa1fcfd86fb0630f4cc8dad3917bb68caa957d5e72573a0c533f308a7e\"}, {\"filename\": \"coreutils-9.11.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/coreutils/coreutils-9.11.tar.xz\", \"bytes\": 6562420, \"book_md5\": \"e52e9857e4aa9ae38ef32f8ed6a27604\", \"sha256\": \"394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3\"}, {\"filename\": \"coreutils-9.11-i18n-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/coreutils-9.11-i18n-1.patch\", \"bytes\": 67821, \"book_md5\": \"900d64d9936516b68613271c9ebc0059\", \"\
        sha256\": \"7c2aecf9ae24b87b019595e382b9f41d2c96de7f95abe95ad8cacc7e2ce1bbcc\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/valgrind.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"\
        $rc\"\\\\n  test ! -f build/meson-logs/testlog.txt || tail -1000 build/meson-logs/testlog.txt | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log -o -name test-suite-overall.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  find . -name \"*.diff\" -type f -size +0c | while read -r d; do printf \"NAV_TEST_EXACT_DIFF %s\\\\\\\\n\" \"$d\"; sed \"s/^/NAV_TEST_EXACT /\" \"$d\"; done\\\\n  for d in gdbserver_tests/hgtls.stderrB.out gdbserver_tests/hgtls.stdoutB.out drd/tests/pth_detached3.stderr.out; do test ! -f \"$d\" || sed \"s/^/NAV_TEST_RAW /\" \"$d\"; done\\\\n  exit \"$rc\"\\\\n fi\\\\n tail -80 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n printf\
        \ \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\n\\\\n\\\\n\\\\n\\\\nulimit -c 0\\\\nexport MAKEFLAGS=-j2\\\\ncd /sources\\\\ntar -xf coreutils-9.11.tar.xz\\\\ncd coreutils-9.11\\\\npatch -Np1 -i ../coreutils-9.11-i18n-1.patch\\\\npatch -Np1 -i ../coreutils-9.11-cat-pipe-close.patch\\\\nautoreconf -fv\\\\nautomake -af\\\\nFORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr\\\\nmake -j2\\\\nrun_test coreutils-catfix-root make NON_ROOT_USERNAME=tester check-root\\\\ngroupadd -g 102 dummy -U tester\\\\nchown -R tester .\\\\nrun_test coreutils-catfix-user su tester -c \\\\\\'make -j2 -k RUN_EXPENSIVE_TESTS=yes check\\\\\\' < /dev/null\\\\ngroupdel dummy\\\\nmake install\\\\nmv -v /usr/bin/chroot /usr/sbin\\\\nmv -v /usr/share/man/man1/chroot.1 /usr/share/man/man8/chroot.8\\\\nsed -i \\\\\\'s/\"1\"/\"8\"/\\\\\\' /usr/share/man/man8/chroot.8\\\\ncd /sources\\\\nrm -rf coreutils-9.11\\\\ntar -xf valgrind-3.27.1.tar.bz2\\\\ncd valgrind-3.27.1\\\\npatch -Np1 -i ../valgrind-3.27.1-debug-location.patch\\\
        \\nsed -i \\\\\\'s|/doc/valgrind||\\\\\\' docs/Makefile.in\\\\n# The PROCMAP_QUERY regression requires a nonempty ELF build ID.\\\\n./configure --prefix=/usr --datadir=/usr/share/doc/valgrind-3.27.1 LDFLAGS=\\\\\\'-Wl,--build-id=sha1\\\\\\' \\\\nmake -j2\\\\nchown -R tester:tester .\\\\n# Full configured standard regtest, no prereq edits or test exclusions.\\\\n# Outer stage resource/time guards remain active if a test hangs.\\\\n# Prove the test executable actually has the prerequisite build ID.\\\\nmake -C memcheck/tests/linux ioctl_procmap_query\\\\nreadelf -n memcheck/tests/linux/ioctl_procmap_query | tee /nav-build-metadata/tests/valgrind-procmap-buildid.log\\\\ngrep -q \\\\\\'Build ID:\\\\\\' /nav-build-metadata/tests/valgrind-procmap-buildid.log\\\\nrun_test valgrind su tester -c \\\\\\'make -j2 regtest\\\\\\'\\\\nfind . -name test-suite-overall.log -o -name testsuite.log | while read -r log; do\\\\n cp \"$log\" /nav-build-metadata/tests/valgrind-overall.log\\\\n cat \"$log\"\
        \\\\ndone\\\\nmake install\\\\nldconfig\\\\nvalgrind --version\\\\nprintf \\\\\\'int main(void){return 0;}\\\\\\\\n\\\\\\' > /tmp/nav-vg.c\\\\ngcc -g -o /tmp/nav-vg /tmp/nav-vg.c\\\\nrun_test valgrind-installed-smoke valgrind --error-exitcode=99 --leak-check=full /tmp/nav-vg\\\\ncd /sources\\\\nrm -rf valgrind-3.27.1 /tmp/nav-vg /tmp/nav-vg.c\\\\nprintf \\\\\\'Valgrind source built with standard configured full regtest. Separate optional LTP checks not run; upstream reports broken with this kernel/glibc generation. No libinput/physicalinput/desktop acceptance yet.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_VALGRIND_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev\
        \ \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/valgrind.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" =\
        \ 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/valgrind.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve strict Valgrind checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-valgrind-v1
