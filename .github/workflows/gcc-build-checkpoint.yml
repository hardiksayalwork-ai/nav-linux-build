name: NAV GCC build-only checkpoint pending full tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  gcc-build-checkpoint:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-access-tools-v1
        fail-on-cache-miss: true
    - name: Build compiler and save pending-test tree
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"gcc-16.2.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz\", \"bytes\": 107200820, \"book_md5\": \"19b777fb19ea4982731392481306f0d3\", \"sha256\": \"e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e\"\
        }]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-gcc.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests\\\\nstat -c \\\\\\'NAV_GCC_TMP_BEFORE %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\nchmod 1777 /tmp /var/tmp\\\\nstat -c \\\\\\'NAV_GCC_TMP_AFTER %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\ncat > /tmp/nav-nonroot-preflight.sh <<\\\\\\'NONROOT\\\\\\'\\\\nset -euo pipefail\\\\nd=$(mktemp -d)\\\\ntrap \\\\\\'rm -rf \"$d\"\\\\\\' EXIT\\\\nmkfifo \"$d/fifo\"\\\\nprintf \\\\\\'int main(){return 0;}\\\\\\\\n\\\\\\' > \"$d/probe.c\"\
        \\\\ngcc \"$d/probe.c\" -o \"$d/probe\"\\\\n\"$d/probe\"\\\\nprintf \\\\\\'NAV_GCC_NONROOT_TMP_FIFO_COMPILE_RUN_OK\\\\\\\\n\\\\\\'\\\\nNONROOT\\\\nsu tester -c \\\\\\'bash /tmp/nav-nonroot-preflight.sh\\\\\\'\\\\nrm /tmp/nav-nonroot-preflight.sh\\\\n\\\\nsu tester -c \\\\\\'set -eu; python3 -c \"import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\"\\\\\\'\\\\ncat > /tmp/nav-expect-preflight.exp <<\\\\\\'EXPECT\\\\\\'\\\\nset timeout 10\\\\nspawn /usr/bin/echo NAV_EXPECT_NONROOT_OK\\\\nexpect {\\\\n NAV_EXPECT_NONROOT_OK {exit 0}\\\\n timeout {exit 1}\\\\n eof {exit 2}\\\\n}\\\\nEXPECT\\\\nsu tester -c \\\\\\'set -eu; expect /tmp/nav-expect-preflight.exp\\\\\\'\\\\nrm /tmp/nav-expect-preflight.exp\\\\nprintf \\\\\\'NAV_GCC_NONROOT_PTY_PREFLIGHT_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\ntar -xf gcc-16.2.0.tar.xz\\\\ncd gcc-16.2.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE gcc-16.2.0\\\\\\\\n\\\\\\'\\\\ncase $(uname -m) in\\\\n  x86_64)\\\\n    sed -e \\\\\\'/m64=/s/lib64/lib/\\\\\\\
        ' \\\\\\\\\\\\n        -i.orig gcc/config/i386/t-linux64\\\\n  ;;\\\\nesac\\\\nmkdir -v build\\\\ncd       build\\\\n../configure --prefix=/usr            \\\\\\\\\\\\n             LD=ld                    \\\\\\\\\\\\n             --enable-languages=c,c++ \\\\\\\\\\\\n             --enable-default-pie     \\\\\\\\\\\\n             --enable-default-ssp     \\\\\\\\\\\\n             --enable-host-pie        \\\\\\\\\\\\n             --enable-targets=all     \\\\\\\\\\\\n             --disable-multilib       \\\\\\\\\\\\n             --disable-bootstrap      \\\\\\\\\\\\n             --disable-fixincludes    \\\\\\\\\\\\n             --with-system-zlib\\\\nmake\\\\nulimit -s -H unlimited\\\\nchown -R tester .\\\\n# A small ordinary torture execution test must pass before the full suite.\\\\nset +e\\\\nsu tester -c \\\\\\'set -eu; PATH=/usr/bin:/usr/sbin make -C gcc -k check-gcc RUNTESTFLAGS=\"execute.exp=20000112-1.c\"\\\\\\' > /nav-build-metadata/tests/gcc-quick.log 2>&1\\\\nquick_rc=$?\\\
        \\nset -e\\\\npython3 - \"$quick_rc\" <<\\\\\\'QUICK_AUDIT\\\\\\'\\\\nimport pathlib,re,sys\\\\ntext=pathlib.Path(\\\\\\'/nav-build-metadata/tests/gcc-quick.log\\\\\\').read_text(errors=\\\\\\'replace\\\\\\')\\\\nfor line in text.splitlines()[-40:]:print(\\\\\\'NAV_GCC_QUICK_LOG\\\\\\',line,flush=True)\\\\nf=pathlib.Path(\\\\\\'gcc/testsuite/gcc/gcc.sum\\\\\\');s=f.read_text(errors=\\\\\\'replace\\\\\\') if f.exists() else \\\\\\'\\\\\\'\\\\nassert int(sys.argv[1])==0 and re.search(r\\\\\\'# of expected passes\\\\\\\\s+[1-9]\\\\\\',s) and not re.search(r\\\\\\'^(FAIL|XPASS|UNRESOLVED|ERROR):\\\\\\',s,re.M),(\\\\\\'quick regression failed\\\\\\',sys.argv[1],s[-2000:])\\\\nprint(\\\\\\'NAV_GCC_QUICK_REGRESSION_OK\\\\\\',flush=True)\\\\nQUICK_AUDIT\\\\nprintf \\\\\\'Final GCC build tree and 16-test execution probe complete. Full suites still pending; compiler NOT accepted or installed.\\\\\\\\n\\\\\\' > /nav-build-metadata/gcc-pending.txt\\\\nprintf \\\\\\'NAV_GCC_BUILD_CHECKPOINT_PENDING_FULL_TESTS\\\
        \\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\n# The host uses /dev/ptmx -> pts/ptmx. A fresh devpts node defaults to\\n# mode0000; prove the old non-root behavior, then use the kernel-doc option.\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\nset +e\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/python3 -c \\'import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\\'\\nold_pty_rc=$?\\nset -e\\nprintf \\'NAV_GCC_ORIGINAL_PTY_STATUS %s\\\\n\\' \"$old_pty_rc\"\\nmount -o remount,gid=5,mode=0620,ptmxmode=0666 \"$LFS/dev/pts\"\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\n\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount\
        \ -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/final-gcc.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Save numeric ownership and permissions\
        \ inside a compressed archive. Full\\n# compiler source/build tree retained so test groups need not rebuild.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/final-gcc.sh\"\\nsudo mkdir -p /mnt/nav-gcc-checkpoint\\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-gcc-checkpoint\\nsudo tar --numeric-owner -C \"$LFS\" -cf - . | zstd -T2 -3 -o /mnt/nav-gcc-checkpoint/root.tar.zst\\nzstd -t /mnt/nav-gcc-checkpoint/root.tar.zst\\npython3 - <<\\'PACK_CHECK\\'\\nimport pathlib,hashlib,json\\np=pathlib.Path(\\'/mnt/nav-gcc-checkpoint/root.tar.zst\\');n=p.stat().st_size\\nassert n<3500*1024**2,(\\'checkpoint exceeds free-cache allocation\\',n)\\nh=hashlib.sha256()\\nwith p.open(\\'rb\\') as f:\\n for b in iter(lambda:f.read(8*1024**2),b\\'\\'):h.update(b)\\nmeta={\\'file\\':\\'root.tar.zst\\',\\'bytes\\':n,\\'sha256\\':h.hexdigest(),\\'source\\':\\'gcc16.2.0 LFS13.1\\',\\'status\\':\\'build-only; full compiler suites pending\\'}\\n(p.parent/\\'manifest.json\\').write_text(json.dumps(meta,indent=2)+\\\
        '\\\\n\\')\\nprint(\\'NAV_GCC_CHECKPOINT_ARCHIVE\\',json.dumps(meta),flush=True)\\nPACK_CHECK\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n\
        \ print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_GCC','NAV_FINAL_GCC','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Cache build-only compiler tree (NOT full-test acceptance)
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-gcc-checkpoint
        key: nav-lfs13.1-x86_64-gcc-build-tree-v1
