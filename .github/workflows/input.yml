name: NAV source input library strict uinput tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  input:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-input-prep-v1
        fail-on-cache-miss: true
    - name: Build Check and libevdev full root suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"check-0.15.2.tar.gz\", \"url\": \"https://github.com/libcheck/check/releases/download/0.15.2/check-0.15.2.tar.gz\", \"bytes\": 774985, \"sha256\": \"a8de4e0bacfb4d76dd1c618ded263523b53b85d92a146d8835eb1a52932fa20a\"}, {\"filename\": \"libevdev-1.13.6.tar.xz\", \"url\"\
        : \"https://www.freedesktop.org/software/libevdev/libevdev-1.13.6.tar.xz\", \"bytes\": 472152, \"book_md5\": \"4202ff132e3efe95fe9ca2c4f8f119f7\", \"sha256\": \"73f215eccbd8233f414737ac06bca2687e67c44b97d2d7576091aa9718551110\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/input.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"\
        /nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  test ! -f build/meson-logs/testlog.txt || tail -1000 build/meson-logs/testlog.txt | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n tail -80 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\n\\\\n\\\\nulimit -c 0\\\\nexport MAKEFLAGS=-j2\\\\nprintf \\\\\\'NAV_CORE_POLICY_DIAGNOSTIC\\\\\\\\n\\\\\\'\\\\ncat /proc/sys/kernel/core_pattern\\\\nulimit -Sc\\\
        \\nulimit -Hc\\\\nprintf \\\\\\'NAV_INPUT_HOST_CAPABILITIES\\\\\\\\n\\\\\\'\\\\nls -ld /dev/input /dev/uinput\\\\n[ -c /dev/uinput ]\\\\ncd /sources\\\\ntar -xf check-0.15.2.tar.gz\\\\ncd check-0.15.2\\\\n# This 2020 release uses pre-C23 declarations; preserve its intended C dialect.\\\\n./configure --prefix=/usr --disable-static CFLAGS=\\\\\\'-O2 -std=gnu17\\\\\\'\\\\nmake -j2\\\\nchown -R tester:tester .\\\\nrun_test check su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nmake install\\\\nldconfig\\\\ncd /sources\\\\nrm -rf check-0.15.2\\\\ntar -xf libevdev-1.13.6.tar.xz\\\\ncd libevdev-1.13.6\\\\nmeson setup build --prefix=/usr --buildtype=release -Ddocumentation=disabled -Dtests=enabled\\\\nninja -C build -j2\\\\nrun_test libevdev meson test -C build --print-errorlogs --num-processes 1\\\\ncp build/meson-logs/testlog.json /nav-build-metadata/tests/libevdev-testlog.json\\\\npython3 - <<\\\\\\'EVDEV_RESULTS\\\\\\'\\\\nimport json,collections,pathlib\\\\nrows=[json.loads(x)for x in\
        \ pathlib.Path(\\\\\\'build/meson-logs/testlog.json\\\\\\').read_text().splitlines()if x.strip()]\\\\nprint(\\\\\\'NAV_INPUT_LIBEVDEV_RESULTS\\\\\\',dict(collections.Counter(r[\\\\\\'result\\\\\\']for r in rows)))\\\\nassert len(rows)==6 and all(r[\\\\\\'result\\\\\\']==\\\\\\'OK\\\\\\'for r in rows),rows\\\\nEVDEV_RESULTS\\\\nninja -C build install\\\\nldconfig\\\\npkg-config --modversion check libevdev\\\\ncd /sources\\\\nrm -rf libevdev-1.13.6\\\\nprintf \\\\\\'Source Check and libevdev with strict configured suites. libevdev root uinput kernel tests all required OK. No Valgrind test setup yet. No physical input/desktop acceptance yet.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_INPUT_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\"\
        \ \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/input.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash\
        \ --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/input.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested input library checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-input-v1
