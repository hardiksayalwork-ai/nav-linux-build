name: NAV LFS chroot temporary system stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  chroot-temporary:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore exact chapter6 checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-chapter6-v1
        fail-on-cache-miss: true
    - name: Guarded native chroot additional temporary tools
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"gettext-1.0.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gettext/gettext-1.0.tar.xz\", \"bytes\": 10721600, \"book_md5\": \"dc8b2911535929cec1e263706b0a13a1\", \"sha256\": \"71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7\"\
        }, {\"filename\": \"bison-3.8.2.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/bison/bison-3.8.2.tar.xz\", \"bytes\": 2817324, \"book_md5\": \"c28f119f405a2304ff0a7ccdcc629713\", \"sha256\": \"9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2\"}, {\"filename\": \"perl-5.44.0.tar.xz\", \"url\": \"https://www.cpan.org/src/5.0/perl-5.44.0.tar.xz\", \"bytes\": 14919940, \"book_md5\": \"55761cf1543af326492fd194647796d1\", \"sha256\": \"505cf43912e9480495c344c70260452e32aa2a73c546a026b3f100053b23ce91\"}, {\"filename\": \"zlib-1.3.2.tar.gz\", \"url\": \"https://zlib.net/fossils/zlib-1.3.2.tar.gz\", \"bytes\": 1502830, \"book_md5\": \"a1e6c958597af3c67d162995a342138a\", \"sha256\": \"bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16\"}, {\"filename\": \"mpdecimal-4.0.1.tar.gz\", \"url\": \"https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-4.0.1.tar.gz\", \"bytes\": 316268, \"book_md5\": \"3d4412579b1edc1047efab151889cca9\", \"sha256\": \"96d33abb4bb0070c7be0fed4246cd38416188325f820468214471938545b1ac8\"\
        }, {\"filename\": \"Python-3.14.7.tar.xz\", \"url\": \"https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz\", \"bytes\": 24053924, \"book_md5\": \"a4c4c2991b4126e227073c2d9445f432\", \"sha256\": \"3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81\"}, {\"filename\": \"texinfo-7.3.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/texinfo/texinfo-7.3.tar.xz\", \"bytes\": 6940392, \"book_md5\": \"915a09fcdfc2bf0f5ecf9e556d5698ff\", \"sha256\": \"51f74eb0f51cfa9873b85264dfdd5d46e8957ec95b88f0fb762f63d9e164c72e\"}, {\"filename\": \"util-linux-2.42.2.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz\", \"bytes\": 10658220, \"book_md5\": \"1d70131b70abda3dec3b37e282a20c96\", \"sha256\": \"03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\\
        'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/chroot-temporary.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -pv /{boot,home,mnt,opt,srv}\\\\nmkdir -pv /etc/{opt,sysconfig}\\\\nmkdir -pv /lib/firmware\\\\nmkdir -pv /media/{floppy,cdrom}\\\\nmkdir -pv /usr/{,local/}{include,src}\\\\nmkdir -pv /usr/lib/locale\\\\nmkdir -pv /usr/local/{bin,lib,sbin}\\\\nmkdir -pv /usr/{,local/}share/{color,dict,doc,info,locale,man}\\\\nmkdir -pv /usr/{,local/}share/{misc,terminfo,zoneinfo}\\\\nmkdir -pv /usr/{,local/}share/man/man{1..8}\\\\nmkdir -pv /var/{cache,local,log,mail,opt,spool}\\\\nmkdir -pv /var/lib/{color,misc,locate}\\\\n\\\\nln -sfv /run /var/run\\\\nln -sfv /run/lock /var/lock\\\\n\\\\ninstall -dv -m\
        \ 0750 /root\\\\ninstall -dv -m 1777 /tmp /var/tmp\\\\nln -sv /proc/self/mounts /etc/mtab\\\\ncat > /etc/hosts << EOF\\\\n127.0.0.1  localhost navbuild\\\\n::1        localhost\\\\nEOF\\\\ncat > /etc/passwd << \"EOF\"\\\\nroot:x:0:0:root:/root:/bin/bash\\\\nbin:x:1:1:bin:/dev/null:/usr/bin/false\\\\ndaemon:x:6:6:Daemon User:/dev/null:/usr/bin/false\\\\nmessagebus:x:18:18:D-Bus Message Daemon User:/run/dbus:/usr/bin/false\\\\nsystemd-journal-gateway:x:73:73:systemd Journal Gateway:/:/usr/bin/false\\\\nsystemd-journal-remote:x:74:74:systemd Journal Remote:/:/usr/bin/false\\\\nsystemd-journal-upload:x:75:75:systemd Journal Upload:/:/usr/bin/false\\\\nsystemd-network:x:76:76:systemd Network Management:/:/usr/bin/false\\\\nsystemd-resolve:x:77:77:systemd Resolver:/:/usr/bin/false\\\\nsystemd-timesync:x:78:78:systemd Time Synchronization:/:/usr/bin/false\\\\nsystemd-coredump:x:79:79:systemd Core Dumper:/:/usr/bin/false\\\\nuuidd:x:80:80:UUID Generation Daemon User:/dev/null:/usr/bin/false\\\
        \\nsystemd-oom:x:81:81:systemd Out Of Memory Daemon:/:/usr/bin/false\\\\nnobody:x:65534:65534:Unprivileged User:/dev/null:/usr/bin/false\\\\nEOF\\\\ncat > /etc/group << \"EOF\"\\\\nroot:x:0:\\\\nbin:x:1:daemon\\\\nsys:x:2:\\\\nkmem:x:3:\\\\ntape:x:4:\\\\ntty:x:5:\\\\ndaemon:x:6:\\\\nfloppy:x:7:\\\\ndisk:x:8:\\\\nlp:x:9:\\\\ndialout:x:10:\\\\naudio:x:11:\\\\nvideo:x:12:\\\\nutmp:x:13:\\\\nclock:x:14:\\\\ncdrom:x:15:\\\\nadm:x:16:\\\\nmessagebus:x:18:\\\\nsystemd-journal:x:23:\\\\ninput:x:24:\\\\nmail:x:34:\\\\nkvm:x:61:\\\\nsystemd-journal-gateway:x:73:\\\\nsystemd-journal-remote:x:74:\\\\nsystemd-journal-upload:x:75:\\\\nsystemd-network:x:76:\\\\nsystemd-resolve:x:77:\\\\nsystemd-timesync:x:78:\\\\nsystemd-coredump:x:79:\\\\nuuidd:x:80:\\\\nsystemd-oom:x:81:\\\\nwheel:x:97:\\\\nusers:x:999:\\\\nnogroup:x:65534:\\\\nEOF\\\\necho \"tester:x:101:101::/home/tester:/bin/bash\" >> /etc/passwd\\\\necho \"tester:x:101:\" >> /etc/group\\\\ninstall -o tester -d /home/tester\\\\ntouch /var/log/{btmp,lastlog,faillog,wtmp}\\\
        \\nchgrp -v utmp /var/log/lastlog\\\\nchmod -v 664  /var/log/lastlog\\\\nchmod -v 600  /var/log/btmp\\\\ncd /sources\\\\ntar -xf gettext-1.0.tar.xz\\\\ncd gettext-1.0\\\\nprintf \\\\\\'BEGIN_PACKAGE gettext-1.0\\\\\\\\n\\\\\\'\\\\n./configure --disable-shared\\\\nmake\\\\ncp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} /usr/bin\\\\nprintf \\\\\\'DONE_PACKAGE gettext-1.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- gettext-1.0\\\\ncd /sources\\\\ntar -xf bison-3.8.2.tar.xz\\\\ncd bison-3.8.2\\\\nprintf \\\\\\'BEGIN_PACKAGE bison-3.8.2\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr \\\\\\\\\\\\n            --docdir=/usr/share/doc/bison-3.8.2\\\\nmake\\\\nmake install\\\\nprintf \\\\\\'DONE_PACKAGE bison-3.8.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- bison-3.8.2\\\\ncd /sources\\\\ntar -xf perl-5.44.0.tar.xz\\\\ncd perl-5.44.0\\\\nprintf \\\\\\'BEGIN_PACKAGE perl-5.44.0\\\\\\\\n\\\\\\'\\\\nsh Configure -des                                         \\\\\\\\\\\\n             -D\
        \ prefix=/usr                               \\\\\\\\\\\\n             -D vendorprefix=/usr                         \\\\\\\\\\\\n             -D useshrplib                                \\\\\\\\\\\\n             -D privlib=/usr/lib/perl5/5.44/core_perl     \\\\\\\\\\\\n             -D archlib=/usr/lib/perl5/5.44/core_perl     \\\\\\\\\\\\n             -D sitelib=/usr/lib/perl5/5.44/site_perl     \\\\\\\\\\\\n             -D sitearch=/usr/lib/perl5/5.44/site_perl    \\\\\\\\\\\\n             -D vendorlib=/usr/lib/perl5/5.44/vendor_perl \\\\\\\\\\\\n             -D vendorarch=/usr/lib/perl5/5.44/vendor_perl\\\\nmake\\\\nmake install\\\\nprintf \\\\\\'DONE_PACKAGE perl-5.44.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- perl-5.44.0\\\\ncd /sources\\\\ntar -xf zlib-1.3.2.tar.gz\\\\ncd zlib-1.3.2\\\\nprintf \\\\\\'BEGIN_PACKAGE zlib-1.3.2\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nmake install\\\\nrm -fv /usr/lib/libz.a\\\\nprintf \\\\\\'DONE_PACKAGE zlib-1.3.2\\\\\\\\\
        n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- zlib-1.3.2\\\\ncd /sources\\\\ntar -xf mpdecimal-4.0.1.tar.gz\\\\ncd mpdecimal-4.0.1\\\\nprintf \\\\\\'BEGIN_PACKAGE mpdecimal-4.0.1\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/mpdecimal-4.0.1\\\\nmake\\\\nmake install\\\\nprintf \\\\\\'DONE_PACKAGE mpdecimal-4.0.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- mpdecimal-4.0.1\\\\ncd /sources\\\\ntar -xf Python-3.14.7.tar.xz\\\\ncd Python-3.14.7\\\\nprintf \\\\\\'BEGIN_PACKAGE Python-3.14.7\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr       \\\\\\\\\\\\n            --enable-shared     \\\\\\\\\\\\n            --without-ensurepip \\\\\\\\\\\\n            --without-static-libpython\\\\nmake\\\\nmake install\\\\nprintf \\\\\\'DONE_PACKAGE Python-3.14.7\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- Python-3.14.7\\\\ncd /sources\\\\ntar -xf texinfo-7.3.tar.xz\\\\ncd texinfo-7.3\\\\nprintf \\\\\\'BEGIN_PACKAGE\
        \ texinfo-7.3\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nmake install\\\\nprintf \\\\\\'DONE_PACKAGE texinfo-7.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- texinfo-7.3\\\\ncd /sources\\\\ntar -xf util-linux-2.42.2.tar.xz\\\\ncd util-linux-2.42.2\\\\nprintf \\\\\\'BEGIN_PACKAGE util-linux-2.42.2\\\\\\\\n\\\\\\'\\\\nmkdir -pv /var/lib/hwclock\\\\n./configure --libdir=/usr/lib     \\\\\\\\\\\\n            --runstatedir=/run    \\\\\\\\\\\\n            --disable-chfn-chsh   \\\\\\\\\\\\n            --disable-login       \\\\\\\\\\\\n            --disable-nologin     \\\\\\\\\\\\n            --disable-su          \\\\\\\\\\\\n            --disable-setpriv     \\\\\\\\\\\\n            --disable-runuser     \\\\\\\\\\\\n            --disable-pylibmount  \\\\\\\\\\\\n            --disable-static      \\\\\\\\\\\\n            --disable-liblastlog2 \\\\\\\\\\\\n            --without-python      \\\\\\\\\\\\n            ADJTIME_PATH=/var/lib/hwclock/adjtime \\\\\\\\\\\\n\
        \            --docdir=/usr/share/doc/util-linux-2.42.2\\\\nmake\\\\nmake install\\\\nprintf \\\\\\'DONE_PACKAGE util-linux-2.42.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- util-linux-2.42.2\\\\n\\\\n# Chapter7 tools must execute against this root, not host interpreter/libraries.\\\\npython3 - <<\\\\\\'PYTHON_SMOKE\\\\\\'\\\\nimport decimal,zlib,sys\\\\nassert decimal.Decimal(\\\\\\'0.1\\\\\\')+decimal.Decimal(\\\\\\'0.2\\\\\\')==decimal.Decimal(\\\\\\'0.3\\\\\\')\\\\nassert zlib.decompress(zlib.compress(b\\\\\\'NAV\\\\\\'))==b\\\\\\'NAV\\\\\\'\\\\nprint(\\\\\\'NAV_CHROOT_PYTHON_ZLIB_DECIMAL_OK\\\\\\',sys.version)\\\\nPYTHON_SMOKE\\\\nperl -e \\\\\\'print \"NAV_CHROOT_PERL_OK\\\\\\\\n\"\\\\\\'\\\\nbison --version | head -1\\\\nmakeinfo --version | head -1\\\\nmsgfmt --version | head -1\\\\nfindmnt /proc\\\\n# Root can switch to unprivileged tester for chapter8 suites.\\\\n\\\\nrm -rf /usr/share/{info,man,doc}/*\\\\nfind /usr/{lib,libexec} -name \\\\\\'*.la\\\\\\' -delete\\\\nrm\
        \ -rf /tools\\\\nprintf \\\\\\'LFS13.1 chapter7 temporary system complete; Python/Perl/tester smoke passed. Not final base or bootable OS. No chapter8 suites claimed.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'LFS_CHAPTER7_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash\
        \ --noprofile --norc /sources/chroot-temporary.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/chroot-temporary.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2\
        \ or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_PACKAGE','DONE_PACKAGE','NAV_CHROOT','NAV_TESTER','LFS_CHAPTER7_COMPLETE'])))\nNAV_GUARD\n"
    - name: Preserve native temporary system within free cache
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-chapter7-v1
