        assert all(x.split('':'')[1]==''!''for x in(R/''etc/shadow'').read_text().splitlines());assert not any((R/''home/tester'').iterdir());assert
        (R/''etc/pam.d/nav-live'').read_text()==''auth required pam_deny.so\\naccount required pam_permit.so\\npassword required
