name: NAV source font shaping strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  font-shaping:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-graphics-base-v1
        fail-on-cache-miss: true
    - name: Build HarfBuzz strict suite and FreeType integration
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"harfbuzz-14.3.1.tar.xz\", \"url\": \"https://github.com/harfbuzz/harfbuzz/releases/download/14.3.1/harfbuzz-14.3.1.tar.xz\", \"bytes\": 19826476, \"sha256\": \"9dae9538aae2ffdf70cec31f2c27bf68e2aaeeae3112688467697d5faf6194f7\"}, {\"\
        filename\": \"freetype-2.14.3.tar.xz\", \"url\": \"https://downloads.sourceforge.net/freetype/freetype-2.14.3.tar.xz\", \"bytes\": 2670220, \"book_md5\": \"5e78e6fdce5a61d3075e4c25e9852f84\", \"sha256\": \"36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/font-shaping.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\"\
        \ 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf harfbuzz-14.3.1.tar.xz\\\\ncd harfbuzz-14.3.1\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload -Dglib=enabled -Dgobject=enabled -Dicu=enabled -Dfreetype=enabled -Dintrospection=enabled -Dgraphite2=disabled -Dcairo=disabled\\\\nninja -C build\\\\nchown -R tester:tester .\\\\nrun_test harfbuzz\
        \ su tester -c \"meson test -C build --print-errorlogs --num-processes 2\"\\\\nninja -C build install\\\\nldconfig\\\\ncd /sources\\\\ntar -xf freetype-2.14.3.tar.xz\\\\ncd freetype-2.14.3\\\\nsed -ri \"s:.*(AUX_MODULES.*valid):\\\\\\\\1:\" modules.cfg &&\\\\n\\\\nsed -r \"s:.*(#.*SUBPIXEL_RENDERING) .*:\\\\\\\\1:\" \\\\\\\\\\\\n    -i include/freetype/config/ftoption.h   &&\\\\n\\\\n./configure --prefix=/usr            \\\\\\\\\\\\n            --disable-static         \\\\\\\\\\\\n            --enable-freetype-config \\\\\\\\\\\\n            --with-harfbuzz=dynamic  &&\\\\nmake\\\\nmake install\\\\nldconfig\\\\n# FreeType release has no upstream test suite; verify dynamic HarfBuzz linkage and both initializers.\\\\ngrep -q \\\\\\'^#define FT_CONFIG_OPTION_USE_HARFBUZZ_DYNAMIC\\\\\\' /usr/include/freetype2/freetype/config/ftoption.h\\\\nstrings /usr/lib/libfreetype.so | grep \\\\\\'libharfbuzz.so\\\\\\'\\\\ncat > /tmp/nav-shaping.c <<\\\\\\'C\\\\\\'\\\\n#include <hb.h>\\\\n#include\
        \ <hb-ft.h>\\\\n#include <ft2build.h>\\\\n#include FT_FREETYPE_H\\\\nint main(void){FT_Library l;if(FT_Init_FreeType(&l))return 1;hb_buffer_t*b=hb_buffer_create();hb_buffer_add_utf8(b,\"NAV\",-1,0,-1);hb_buffer_guess_segment_properties(b);if(hb_buffer_get_length(b)!=3)return 2;hb_buffer_destroy(b);FT_Done_FreeType(l);return 0;}\\\\nC\\\\ngcc /tmp/nav-shaping.c $(pkg-config --cflags --libs harfbuzz freetype2) -o /tmp/nav-shaping\\\\n/tmp/nav-shaping\\\\npkg-config --modversion harfbuzz harfbuzz-icu harfbuzz-gobject freetype2\\\\nprintf \\\\\\'NAV_FONT_SHAPING_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf harfbuzz-14.3.1 freetype-2.14.3\\\\nprintf \\\\\\'BLFS13.1 HarfBuzz configured strict tests; optional Graphite2/Cairo absent, FontTools-only comparisons may skip upstream. FreeType rebuilt with dynamic HarfBuzz, no upstream suite; linked API smoke.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_FONT_SHAPING_STAGE_COMPLETE\\\
        \\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env\
        \ -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/font-shaping.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/font-shaping.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll()\
        \ is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_FONT_SHAPING','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested font shaping
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-font-shaping-v1
