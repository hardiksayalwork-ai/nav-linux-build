name: NAV source SPIRV graphics tools strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  spirv:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-llvm-core-v1
        fail-on-cache-miss: true
    - name: Build SPIRV graphics tools strict tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"SPIRV-Headers-vulkan-sdk-1.4.357.0.tar.gz\", \"url\": \"https://github.com/KhronosGroup/SPIRV-Headers/archive/vulkan-sdk-1.4.357.0/SPIRV-Headers-vulkan-sdk-1.4.357.0.tar.gz\", \"bytes\": 571830, \"book_md5\": \"085dd07d487c165c0ca7713d726eb6de\"\
        , \"sha256\": \"4d703067a7e06331ccb37bdfed3f9b7879cc61969a2689ae95c95db34a47ff07\"}, {\"filename\": \"SPIRV-Tools-vulkan-sdk-1.4.357.0.tar.gz\", \"url\": \"https://github.com/KhronosGroup/SPIRV-Tools/archive/vulkan-sdk-1.4.357.0/SPIRV-Tools-vulkan-sdk-1.4.357.0.tar.gz\", \"bytes\": 3518451, \"book_md5\": \"c357eec1e33bc95e650aa4c8efdd3b13\", \"sha256\": \"d31e7109b6ef3559067e53e520870eafed7c9534d00db9728814b6df03fa4a5e\"}, {\"filename\": \"SPIRV-LLVM-Translator-22.1.5.tar.gz\", \"url\": \"https://github.com/KhronosGroup/SPIRV-LLVM-Translator/archive/v22.1.5/SPIRV-LLVM-Translator-22.1.5.tar.gz\", \"bytes\": 1884166, \"book_md5\": \"8bdf03a2f7d90da52e358ac78b3e9959\", \"sha256\": \"3c6dffb4b8d67f5c544370e0c869ec7d22c013d4bb798f24655ec903f26cc5d5\"}, {\"filename\": \"googletest-8240fa7d62f73e01c7af27d61ed965d6d66698fa.tar.gz\", \"url\": \"https://github.com/google/googletest/archive/8240fa7d62f73e01c7af27d61ed965d6d66698fa.tar.gz\", \"bytes\": 894733, \"sha256\": \"9fe33b5a82ff21f0eb99705af20a5446fd42b79a31d8189058a30ab4c899b026\"\
        , \"upstream_revision\": \"8240fa7d62f73e01c7af27d61ed965d6d66698fa\", \"test_dependency_for\": \"SPIRV-Tools\", \"extract_to\": \"external/googletest\"}, {\"filename\": \"effcee-910ed15722d5d05c9d71ecf36c1a22243cb79b02.tar.gz\", \"url\": \"https://github.com/google/effcee/archive/910ed15722d5d05c9d71ecf36c1a22243cb79b02.tar.gz\", \"bytes\": 41344, \"sha256\": \"f6852e768d212de5de7dc7f178a6cc21badaf1457b0ffaf2716d56f4696b40c6\", \"upstream_revision\": \"910ed15722d5d05c9d71ecf36c1a22243cb79b02\", \"test_dependency_for\": \"SPIRV-Tools\", \"extract_to\": \"external/effcee\"}, {\"filename\": \"re2-972a15cedd008d846f1a39b2e88ce48d7f166cbd.tar.gz\", \"url\": \"https://github.com/google/re2/archive/972a15cedd008d846f1a39b2e88ce48d7f166cbd.tar.gz\", \"bytes\": 398012, \"sha256\": \"cd4a75bdc0ec2e2506026ea4ccc9f0c429aceab8b6305b2cd30a1f4cc67644bc\", \"upstream_revision\": \"972a15cedd008d846f1a39b2e88ce48d7f166cbd\", \"test_dependency_for\": \"SPIRV-Tools\", \"extract_to\": \"external/re2\"\
        }, {\"filename\": \"abseil-cpp-db1bdc86effd20c9ac9c9939326c0d280c9ff733.tar.gz\", \"url\": \"https://github.com/abseil/abseil-cpp/archive/db1bdc86effd20c9ac9c9939326c0d280c9ff733.tar.gz\", \"bytes\": 2410635, \"sha256\": \"68efc4e25175294862ce3403763c210ce3ef7ef9ee6d67e046b4a03b11d6df4e\", \"upstream_revision\": \"db1bdc86effd20c9ac9c9939326c0d280c9ff733\", \"test_dependency_for\": \"SPIRV-Tools\", \"extract_to\": \"external/abseil_cpp\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/spirv.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod\
        \ 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n tail -80 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nulimit -c 0\\\\ncd /sources\\\\ntar -xf SPIRV-Headers-vulkan-sdk-1.4.357.0.tar.gz\\\
        \\ncd SPIRV-Headers-vulkan-sdk-1.4.357.0\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr\\\\nninja -C build -j2\\\\nninja -C build install\\\\ncd /sources\\\\nrm -rf SPIRV-Headers-vulkan-sdk-1.4.357.0\\\\ntar -xf SPIRV-Tools-vulkan-sdk-1.4.357.0.tar.gz\\\\ncd SPIRV-Tools-vulkan-sdk-1.4.357.0\\\\nmkdir -p external/googletest\\\\ntar -xf /sources/googletest-8240fa7d62f73e01c7af27d61ed965d6d66698fa.tar.gz -C external/googletest --strip-components=1\\\\nmkdir -p external/effcee\\\\ntar -xf /sources/effcee-910ed15722d5d05c9d71ecf36c1a22243cb79b02.tar.gz -C external/effcee --strip-components=1\\\\nmkdir -p external/re2\\\\ntar -xf /sources/re2-972a15cedd008d846f1a39b2e88ce48d7f166cbd.tar.gz -C external/re2 --strip-components=1\\\\nmkdir -p external/abseil_cpp\\\\ntar -xf /sources/abseil-cpp-db1bdc86effd20c9ac9c9939326c0d280c9ff733.tar.gz -C external/abseil_cpp --strip-components=1\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \\\\\\\
        \\\\\\n -DSPIRV_WERROR=OFF -DBUILD_SHARED_LIBS=ON -DSPIRV_TOOLS_BUILD_STATIC=OFF \\\\\\\\\\\\n -DSPIRV-Headers_SOURCE_DIR=/usr -DSPIRV_SKIP_TESTS=OFF -DSPIRV_SKIP_EXECUTABLES=OFF \\\\\\\\\\\\n -DFETCHCONTENT_FULLY_DISCONNECTED=ON\\\\nninja -C build -j2\\\\n# Fail closed if the upstream optional test dependency lookup omitted the unit suite.\\\\ntest -x build/test/test_spirv_unit_tests\\\\ntest -f build/external/effcee/effcee/libeffcee.a\\\\ntest -f build/external/effcee/third_party/re2/libre2.a\\\\nchown -R tester:tester .\\\\nrun_test spirv-tools su tester -c \\\\\\'ulimit -c 0; TZ=UTC ctest --test-dir build --output-on-failure --no-tests=error -j2 --timeout 120\\\\\\'\\\\nrun_test spirv-python su tester -c \\\\\\'ulimit -c 0; TZ=UTC ninja -C build spirv-tools-check-python-tests\\\\\\'\\\\nninja -C build install\\\\nldconfig\\\\nspirv-as --version\\\\nspirv-val --version\\\\ncat > /tmp/nav-shader.spvasm <<\\\\\\'NAV_SPIRV_SMOKE\\\\\\'\\\\nOpCapability Shader\\\\nOpMemoryModel Logical\
        \ GLSL450\\\\nOpEntryPoint Fragment %main \"main\"\\\\nOpExecutionMode %main OriginUpperLeft\\\\n%void = OpTypeVoid\\\\n%fn = OpTypeFunction %void\\\\n%main = OpFunction %void None %fn\\\\n%entry = OpLabel\\\\nOpReturn\\\\nOpFunctionEnd\\\\nNAV_SPIRV_SMOKE\\\\nspirv-as /tmp/nav-shader.spvasm -o /tmp/nav-shader.spv\\\\nspirv-val /tmp/nav-shader.spv\\\\nspirv-opt -O /tmp/nav-shader.spv -o /tmp/nav-shader-opt.spv\\\\nspirv-val /tmp/nav-shader-opt.spv\\\\nspirv-dis /tmp/nav-shader-opt.spv -o /tmp/nav-shader-dis.spvasm\\\\ngrep -q OpEntryPoint /tmp/nav-shader-dis.spvasm\\\\nprintf \\\\\\'NAV_SPIRV_TOOLS_ASSEMBLE_VALIDATE_OPTIMIZE_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf SPIRV-Tools-vulkan-sdk-1.4.357.0\\\\ntar -xf SPIRV-LLVM-Translator-22.1.5.tar.gz\\\\ncd SPIRV-LLVM-Translator-22.1.5\\\\ncmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \\\\\\\\\\\\n -DBUILD_SHARED_LIBS=ON -DCMAKE_SKIP_INSTALL_RPATH=ON \\\\\\\\\\\\n -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR=/usr\
        \ -DLLVM_SPIRV_INCLUDE_TESTS=OFF \\\\\\\\\\\\n -DFETCHCONTENT_FULLY_DISCONNECTED=ON\\\\nninja -C build -j2\\\\nninja -C build install\\\\nldconfig\\\\nllvm-spirv --version\\\\ncat > /tmp/nav-opencl.ll <<\\\\\\'NAV_OPENCL_SMOKE\\\\\\'\\\\ntarget datalayout = \"e-p:64:64-i64:64-v16:16-v24:32-v32:32-v48:64-v96:128-v192:256-v256:256-v512:512-v1024:1024\"\\\\ntarget triple = \"spir64-unknown-unknown\"\\\\ndefine spir_kernel void @nav_kernel(ptr addrspace(1) %out) {\\\\nentry:\\\\n  store i32 42, ptr addrspace(1) %out, align 4\\\\n  ret void\\\\n}\\\\nNAV_OPENCL_SMOKE\\\\nllvm-as /tmp/nav-opencl.ll -o /tmp/nav-opencl.bc\\\\nllvm-spirv /tmp/nav-opencl.bc -o /tmp/nav-opencl.spv\\\\nspirv-val /tmp/nav-opencl.spv\\\\nllvm-spirv -r /tmp/nav-opencl.spv -o /tmp/nav-opencl-return.bc\\\\nllvm-dis /tmp/nav-opencl-return.bc -o /tmp/nav-opencl-return.ll\\\\ngrep -q nav_kernel /tmp/nav-opencl-return.ll\\\\nprintf \\\\\\'NAV_SPIRV_LLVM_OPENCL_ROUNDTRIP_SMOKE_OK\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm\
        \ -rf SPIRV-LLVM-Translator-22.1.5\\\\nprintf \\\\\\'BLFS13.1 SPIRV-Headers1.4.357.0 no upstream suite; SPIRV-Tools1.4.357.0 strict configured CTest+Python nonroot with pinned upstream DEPS googletest/effcee/re2/abseil present. Fuzzer/protobuf excluded by upstream default. Test-dependency own full suites not claimed. Translator22.1.5 book no suite, OpenCL LLVM/SPIRV roundtrip smoke only, no execution/hardware claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_SPIRV_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc\
        \ \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/spirv.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\
        \\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/spirv.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed\
        \ with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_SPIRV','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested SPIRV graphics tools
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-spirv-v1
