name: NAV Qt image prerequisites source native tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  qt-images:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-coreutils-fix-v1
        fail-on-cache-miss: true
    - name: Build NASM double-conversion JPEG TIFF WebP and native tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"nasm-3.02.tar.xz\", \"url\": \"https://www.nasm.us/pub/nasm/releasebuilds/3.02/nasm-3.02.tar.xz\", \"bytes\": 1531636, \"book_md5\": \"31ba022fff8de3065b5bc5ad5559188c\", \"sha256\": \"87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d\"}, {\"filename\":\
        \ \"double-conversion-3.4.0.tar.gz\", \"url\": \"https://github.com/google/double-conversion/archive/v3.4.0/double-conversion-3.4.0.tar.gz\", \"bytes\": 7035722, \"book_md5\": \"cb2e555c32614f680ba928e962dda9be\", \"sha256\": \"42fd4d980ea86426e457b24bdfa835a6f5ad9517ddb01cdb42b99ab9c8dd5dc9\"}, {\"filename\": \"libjpeg-turbo-3.2.0.tar.gz\", \"url\": \"https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz\", \"bytes\": 2537858, \"book_md5\": \"a80f9f1c735b57d3cdd66daed1ba6bb4\", \"sha256\": \"6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e\"}, {\"filename\": \"tiff-4.7.2.tar.gz\", \"url\": \"https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz\", \"bytes\": 4083368, \"book_md5\": \"a2a65ea450b8f469c667128848ffebfc\", \"sha256\": \"672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a\"}, {\"filename\": \"libwebp-1.6.0.tar.gz\", \"url\": \"https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz\"\
        , \"bytes\": 4296070, \"book_md5\": \"cceb6447180f961473b181c9ef38b630\", \"sha256\": \"e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/qt-images.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nexport MAKEFLAGS=-j2 LC_ALL=POSIX\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n tail -100 \"/nav-build-metadata/tests/$name.log\"\
        \\\\n if [ \"$rc\" -ne 0 ];then\\\\n  cat \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name LastTest.log -type f -exec tail -500 {} \\\\\\\\;\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_TEST_EXECUTION_OK %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nctest_nonroot(){\\\\n local name=\"$1\"\\\\n chown -R tester ..\\\\n run_test \"$name\" su tester -c \\\\\\'ctest --parallel 2 --output-on-failure --no-tests=error\\\\\\'\\\\n grep -Eq \\\\\\'100% tests passed, 0 tests failed out of [1-9][0-9]*\\\\\\' \"/nav-build-metadata/tests/$name.log\"\\\\n if grep -Eq \\\\\\'\\\\\\\\*\\\\\\\\*\\\\\\\\*Skipped|Not Run|DISABLED\\\\\\' \"/nav-build-metadata/tests/$name.log\";then\\\\n  printf \\\\\\'NAV_TEST_UNEXPECTED_SKIP %s\\\\\\\\n\\\\\\' \"$name\";exit 1\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf\
        \ nasm-3.02.tar.xz\\\\ncd nasm-3.02\\\\n./configure --prefix=/usr\\\\nmake -j2\\\\nmake travis/test/_version.stdout\\\\nchown -R tester .\\\\nrun_test nasm-regression su tester -c \\\\\\'python3 travis/nasm-t.py run --stop=n\\\\\\'\\\\npython3 - <<\\\\\\'NASM_AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\ns=Path(\\\\\\'/nav-build-metadata/tests/nasm-regression.log\\\\\\').read_text()\\\\nassert s.count(\\\\\\' PASS ===\\\\\\')==301\\\\nassert s.count(\\\\\\' SKIP ===\\\\\\')==1 and \\\\\\'=== Test ./travis/test/time.1 SKIP ===\\\\\\' in s\\\\nassert not any(x in s for x in [\\\\\\' FAIL ===\\\\\\',\\\\\\' ABORT ===\\\\\\',\\\\\\' ERROR OVER ===\\\\\\'])\\\\nprint(\\\\\\'NAV_TEST_NASM 301 PASS 0 FAIL 1 UPSTREAM_DISABLED_TIME_MACROS; not full clock coverage\\\\\\')\\\\nNASM_AUDIT\\\\n# Upstream disables time.asm because its output is not constant. Validate it\\\\n# separately against actual UTC/local clock bounds, without editing the suite.\\\\npython3 - <<\\\\\\'NASM_TIME\\\\\\'\\\\\
        nimport subprocess,time,struct,datetime,os\\\\nfrom pathlib import Path\\\\nos.environ[\\\\\\'TZ\\\\\\']=\\\\\\'UTC\\\\\\';time.tzset()\\\\na=int(time.time())\\\\nsubprocess.run([\\\\\\'./nasm\\\\\\',\\\\\\'-f\\\\\\',\\\\\\'bin\\\\\\',\\\\\\'-o\\\\\\',\\\\\\'/tmp/nav-nasm-time.bin\\\\\\',\\\\\\'travis/test/time.asm\\\\\\'],check=True)\\\\nb=int(time.time());actual=Path(\\\\\\'/tmp/nav-nasm-time.bin\\\\\\').read_bytes()\\\\ndef expected(ts):\\\\n d=datetime.datetime.fromtimestamp(ts,datetime.timezone.utc)\\\\n head=(d.strftime(\\\\\\'%Y-%m-%d\\\\\\\\r\\\\\\\\n%H:%M:%S\\\\\\\\r\\\\\\\\n\\\\\\')*2).encode()\\\\n head+=b\\\\\\'\\\\\\\\x90\\\\\\'*((-len(head))%4)\\\\n return head+struct.pack(\\\\\\'<IIIII\\\\\\',int(d.strftime(\\\\\\'%Y%m%d\\\\\\')),int(d.strftime(\\\\\\'%H%M%S\\\\\\')),int(d.strftime(\\\\\\'%Y%m%d\\\\\\')),int(d.strftime(\\\\\\'%H%M%S\\\\\\')),ts)\\\\nassert any(actual==expected(ts) for ts in range(a,b+1)),(actual,a,b)\\\\nprint(\\\\\\'NAV_TEST_NASM_CLOCK_BOUND_SMOKE_PASS;\
        \ distinct from upstream-disabled golden comparison\\\\\\')\\\\nNASM_TIME\\\\nmake install\\\\ncd /sources\\\\nrm -rf nasm-3.02\\\\n\\\\ntar -xf double-conversion-3.4.0.tar.gz\\\\ncd double-conversion-3.4.0\\\\ncmake -S . -B build -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_INSTALL_LIBDIR=lib -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -D BUILD_SHARED_LIBS=ON -D BUILD_TESTING=ON\\\\ncmake --build build --parallel 2\\\\ncd build\\\\nctest_nonroot double-conversion\\\\ncmake --install .\\\\ncd /sources\\\\nrm -rf double-conversion-3.4.0\\\\n\\\\ntar -xf libjpeg-turbo-3.2.0.tar.gz\\\\ncd libjpeg-turbo-3.2.0\\\\ncmake -S . -B build -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_BUILD_TYPE=RELEASE -D ENABLE_STATIC=FALSE -D CMAKE_INSTALL_DEFAULT_LIBDIR=lib -D CMAKE_SKIP_INSTALL_RPATH=ON -D CMAKE_INSTALL_DOCDIR=/usr/share/doc/libjpeg-turbo-3.2.0 -D WITH_SIMD=ON\\\\ncmake --build build --parallel 2\\\\ncd build\\\\nctest_nonroot libjpeg-turbo\\\\ncmake --install .\\\\ncd /sources\\\\nrm -rf libjpeg-turbo-3.2.0\\\
        \\n\\\\n# First WebP pass makes its codec available to TIFF. Rebuild its tools after\\\\n# TIFF to enable TIFF import too. No disabled suite: upstream ships fuzzers,\\\\n# not a standalone autotools test suite. A native lossless API check follows.\\\\ntar -xf libwebp-1.6.0.tar.gz\\\\ncd libwebp-1.6.0\\\\n./configure --prefix=/usr --enable-libwebpmux --enable-libwebpdemux --enable-libwebpdecoder --enable-libwebpextras --enable-swap-16bit-csp --disable-static\\\\nmake -j2\\\\nmake install\\\\nldconfig\\\\ncd /sources\\\\n\\\\ntar -xf tiff-4.7.2.tar.gz\\\\ncd tiff-4.7.2\\\\ncmake -S . -B build -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_BUILD_TYPE=Release -D CMAKE_INSTALL_LIBDIR=lib -D tiff-tests=ON -D webp=ON -W no-author -G Ninja\\\\ncmake --build build --parallel 2\\\\ncd build\\\\nctest_nonroot tiff\\\\ncmake --install .\\\\nmv -v /usr/share/doc/tiff{,-4.7.2}\\\\ncd /sources\\\\nrm -rf tiff-4.7.2\\\\nldconfig\\\\ncd libwebp-1.6.0\\\\nmake distclean\\\\n./configure --prefix=/usr --enable-libwebpmux\
        \ --enable-libwebpdemux --enable-libwebpdecoder --enable-libwebpextras --enable-swap-16bit-csp --disable-static\\\\nmake -j2\\\\ngrep -q \"^#define WEBP_HAVE_TIFF 1\" src/webp/config.h\\\\ngrep -q \"^#define WEBP_HAVE_JPEG 1\" src/webp/config.h\\\\ngrep -q \"^#define WEBP_HAVE_PNG 1\" src/webp/config.h\\\\nmake install\\\\ncd /sources\\\\nrm -rf libwebp-1.6.0\\\\nldconfig\\\\ncat > /tmp/nav-codec-smoke.c <<\\\\\\'C_SMOKE\\\\\\'\\\\n#include <assert.h>\\\\n#include <stdio.h>\\\\n#include <stdlib.h>\\\\n#include <string.h>\\\\n#include <tiffio.h>\\\\n#include <webp/encode.h>\\\\n#include <webp/decode.h>\\\\nint main(void){\\\\n enum{W=32,H=24,STRIDE=W*3};\\\\n unsigned char src[H*STRIDE],row[STRIDE];\\\\n for(int y=0;y<H;y++)for(int x=0;x<W;x++)for(int c=0;c<3;c++)src[y*STRIDE+x*3+c]=(x*5+y*3+c*25)%256;\\\\n unsigned char *enc=NULL;size_t size=WebPEncodeLosslessRGB(src,W,H,STRIDE,&enc);assert(size>0&&enc);\\\\n int w=0,h=0;unsigned char *dec=WebPDecodeRGB(enc,size,&w,&h);assert(dec&&w==W&&h==H&&!memcmp(src,dec,sizeof\
        \ src));WebPFree(dec);WebPFree(enc);\\\\n const int codecs[]={COMPRESSION_NONE,COMPRESSION_LZW,COMPRESSION_ADOBE_DEFLATE,COMPRESSION_JPEG,COMPRESSION_WEBP};\\\\n for(size_t k=0;k<sizeof(codecs)/sizeof(codecs[0]);k++){\\\\n  assert(TIFFIsCODECConfigured(codecs[k]));\\\\n  char fn[128];snprintf(fn,sizeof fn,\"/tmp/nav-codec-%d.tif\",codecs[k]);\\\\n  TIFF*t=TIFFOpen(fn,\"w\");assert(t);\\\\n  assert(TIFFSetField(t,TIFFTAG_IMAGEWIDTH,W));assert(TIFFSetField(t,TIFFTAG_IMAGELENGTH,H));\\\\n  assert(TIFFSetField(t,TIFFTAG_SAMPLESPERPIXEL,3));assert(TIFFSetField(t,TIFFTAG_BITSPERSAMPLE,8));\\\\n  assert(TIFFSetField(t,TIFFTAG_ORIENTATION,ORIENTATION_TOPLEFT));assert(TIFFSetField(t,TIFFTAG_PLANARCONFIG,PLANARCONFIG_CONTIG));\\\\n  assert(TIFFSetField(t,TIFFTAG_PHOTOMETRIC,PHOTOMETRIC_RGB));assert(TIFFSetField(t,TIFFTAG_ROWSPERSTRIP,H));\\\\n  assert(TIFFSetField(t,TIFFTAG_COMPRESSION,codecs[k]));\\\\n  if(codecs[k]==COMPRESSION_WEBP)assert(TIFFSetField(t,TIFFTAG_WEBP_LOSSLESS,1));\\\\n \
        \ if(codecs[k]==COMPRESSION_JPEG)assert(TIFFSetField(t,TIFFTAG_JPEGQUALITY,95));\\\\n  for(int y=0;y<H;y++)assert(TIFFWriteScanline(t,src+y*STRIDE,y,0)==1);\\\\n  TIFFClose(t);t=TIFFOpen(fn,\"r\");assert(t);\\\\n  uint32_t tw=0,th=0;assert(TIFFGetField(t,TIFFTAG_IMAGEWIDTH,&tw));assert(TIFFGetField(t,TIFFTAG_IMAGELENGTH,&th));assert(tw==W&&th==H);\\\\n  unsigned long err=0;\\\\n  for(int y=0;y<H;y++){\\\\n   assert(TIFFReadScanline(t,row,y,0)==1);\\\\n   for(int x=0;x<STRIDE;x++){int d=(int)row[x]-(int)src[y*STRIDE+x];err+=abs(d);}\\\\n  }\\\\n  TIFFClose(t);\\\\n  if(codecs[k]==COMPRESSION_JPEG)assert(err<sizeof(src)*5);else assert(err==0);\\\\n  printf(\"NAV_TEST_CODEC TIFF compression%d dimensions32x24 absolute-error%lu PASS\\\\\\\\n\",codecs[k],err);\\\\n }\\\\n puts(\"NAV_TEST_CODEC WEBP lossless exact RGB roundtrip PASS\");\\\\n return 0;\\\\n}\\\\nC_SMOKE\\\\ngcc -Wall -Wextra -Werror /tmp/nav-codec-smoke.c -o /tmp/nav-codec-smoke $(pkg-config --cflags --libs libwebp libtiff-4)\\\
        \\nrun_test image-codec-roundtrip su tester -c /tmp/nav-codec-smoke\\\\nfor pc in double-conversion libjpeg libturbojpeg libtiff-4 libwebp libwebpdemux libwebpmux;do pkg-config --modversion \"$pc\";done\\\\nprintf \\\\\\'NASM301pass0fail1upstreamdisabledtime + separate clock smoke. Double-conversion/JPEG/TIFF native configured suites passed. WebP no standalone upstream suite; custom lossless API and TIFF codec roundtrips passed. Valgrind4fail remains separate unresolved. Desktop/ISO acceptance outstanding.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_QT_IMAGES_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"\
        $LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/qt-images.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke;\
        \ printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/qt-images.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise\
        \ RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT_IMAGES','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve Qt image prerequisites checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qt-images-v1
