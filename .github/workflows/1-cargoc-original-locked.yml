        \ x in names if x[1]==\\'test\\'];b=[x[0]for x in names if x[1]==\\'benchmark\\']\\\\n  if len(n)!=len(set(n))or\
        \ len(b)!=len(set(b))or len(n)!=tests or len(b)!=benches:unknown.append({\\'header\\':g[\\'header\\'],\\\
        'reason\\':\\'discovery name/count mismatch\\'})\\\\n  if benches:unknown.append({\\'header\\':g[\\'header\\\
