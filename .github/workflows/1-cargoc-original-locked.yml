name: NAV cargo-c original locked full tests exact scope and source install gate
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-cargoc-original-locked
  cancel-in-progress: false
jobs:
  cargoc:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-heif-root.tar.zst /mnt/nav-cargoc-root.tar.zst; do\n test ! -e \"$bundle\"\n sudo install\
        \ -o \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c\
        \ '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n\
        \ printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\"\
        \ proof\n zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\"\
        \ \"$probe/recovered\"\n # Match actions/cache extraction semantics, not only bundle writer access.\n test\
        \ \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n\
        \ relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\"\
        \ -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n\
        \ set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\
        \n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program\
        \ unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_CARGOC_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_CARGOC_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_CARGOC_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_CARGOC_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_CARGOC_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_CARGOC_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore verified libheif checkpoint
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-heif-root.tar.zst
        key: nav-blfs13.1-x86_64-heif-open-v1
        fail-on-cache-miss: true
    - name: Verify exact heif root
      shell: bash
      run: 'set -euo pipefail

        printf "b9e2f16d5521e12531f5c2a89651a6d68b16f58e4bd60bd43a376504413bf689  /mnt/nav-heif-root.tar.zst\n"
        | sha256sum -c -

        zstd -t /mnt/nav-heif-root.tar.zst

        tar --zstd -xf /mnt/nav-heif-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/libheif/HEIF-TRANSITIONAL-OPEN.json

        '
    - name: Original cargo build and test locked, exact discovery recount, conditional clean install
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os, pathlib, shutil, subprocess, time, signal, json\nmem = lambda :\
        \ int(next((x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))))\n\
        assert os.cpu_count() >= 4\nassert mem() > 8 * 1024 ** 2\nassert shutil.disk_usage('/mnt').free > 12 * 1024\
        \ ** 3\np = pathlib.Path('/tmp/nav-source-stage.sh')\np.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs\
        \ LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\nmkdir -p \"$LFS/nav-build-metadata/cargo-c\"\\npython3\
        \ - <<\\'DOWNLOAD\\'\\nfrom pathlib import Path,PurePosixPath\\nimport urllib.request,hashlib,tarfile,json\\\
        np=Path(\\'/mnt/nav-lfs/sources/cargo-c-0.10.24.tar.gz\\');url=\\'https://github.com/lu-zero/cargo-c/archive/v0.10.24/cargo-c-0.10.24.tar.gz\\\
        '\\nwith urllib.request.urlopen(url,timeout=120)as r:p.write_bytes(r.read())\\nassert hashlib.file_digest(p.open(\\\
        'rb\\'),\\'sha256\\').hexdigest()==\\'91c6e0be34aa0ad26b7ef21ce21a390c95635e4e6e00b7a6ff07323f9af8550b\\\
        '\\nwith tarfile.open(p)as t:\\n for m in t.getmembers():\\n  q=PurePosixPath(m.name);assert not q.is_absolute()and\
        \ \\'..\\'not in q.parts and q.parts[0]==\\'cargo-c-0.10.24\\';assert m.isfile()or m.isdir(),m.name\\n t.extractall(p.parent,filter=\\\
        'data\\')\\ns=p.parent/\\'cargo-c-0.10.24\\';lock=s/\\'Cargo.lock\\'\\nwith urllib.request.urlopen(\\'https://github.com/lu-zero/cargo-c/releases/download/v0.10.24/Cargo.lock\\\
        ',timeout=120)as r:lock.write_bytes(r.read())\\nassert hashlib.file_digest(lock.open(\\'rb\\'),\\'sha256\\\
        ').hexdigest()==\\'0cbf346afe2c77fec7b39f8954b9de0639ced04234764240c8290dbec8d45e82\\'\\noriginal={str(f.relative_to(s)):{\\\
        'bytes\\':f.stat().st_size,\\'sha256\\':hashlib.file_digest(f.open(\\'rb\\'),\\'sha256\\').hexdigest()}for\
        \ f in s.rglob(\\'*\\')if f.is_file()and not f.is_symlink()};Path(\\'/mnt/nav-lfs/nav-build-metadata/cargo-c/original-source-files-sha256.json\\\
        ').write_text(json.dumps(original,indent=2));print(\\'NAV_CARGOC_SOURCE_AND_RELEASE_LOCK_SHA256_OK\\',len(original))\\\
        nDOWNLOAD\\npython3 - <<\\'INNER\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/cargo-c-stage.sh\\\
        ').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nexport PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin\
        \ LANG=C.UTF-8 MAKEFLAGS=-j2 CARGO_BUILD_JOBS=2\\\\nunset LC_ALL LANGUAGE\\\\nchmod 1777 /tmp /var/tmp\\\
        \\nP=/nav-build-metadata/cargo-c\\\\nmkdir -p \"$P\"\\\\nexport LIBSSH2_SYS_USE_PKG_CONFIG=1 LIBSQLITE3_SYS_USE_PKG_CONFIG=1\\\
        \\nexport CARGO_HOME=/tmp/nav-cargo-c-home\\\\nmkdir \"$CARGO_HOME\"\\\\ncd /sources/cargo-c-0.10.24\\\\\
        nprintf \\\\\\'0cbf346afe2c77fec7b39f8954b9de0639ced04234764240c8290dbec8d45e82  Cargo.lock\\\\\\\\n\\\\\
        \\' | sha256sum -c -\\\\npkg-config --modversion libssh2 sqlite3 openssl > \"$P/required-versions.log\"\\\
        \\nrustc --version > \"$P/rustc-version.log\"\\\\ncargo --version > \"$P/cargo-version.log\"\\\\npython3\
        \ /sources/cargo-c-recount.py selftest > \"$P/recount-selftest.log\"\\\\nchown -R tester:tester /sources/cargo-c-0.10.24\
        \ \"$CARGO_HOME\" \"$P\"\\\\n# Full original upstream release build; --locked pins the separately verified\
        \ upstream release lock.\\\\nsu tester -c \\\\\\'export PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin;cd\
        \ /sources/cargo-c-0.10.24 && CARGO_BUILD_JOBS=2 CARGO_HOME=/tmp/nav-cargo-c-home LIBSSH2_SYS_USE_PKG_CONFIG=1\
        \ LIBSQLITE3_SYS_USE_PKG_CONFIG=1 cargo build --release --locked\\\\\\' > \"$P/build.log\" 2>&1\\\\nsu tester\
        \ -c \\\\\\'export PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin;cd /sources/cargo-c-0.10.24 && CARGO_BUILD_JOBS=2\
        \ CARGO_HOME=/tmp/nav-cargo-c-home LIBSSH2_SYS_USE_PKG_CONFIG=1 LIBSQLITE3_SYS_USE_PKG_CONFIG=1 cargo test\
        \ --release --locked -- --list\\\\\\' > \"$P/original-cargo-discovery.log\" 2>&1\\\\nset +e\\\\nsu tester\
        \ -c \\\\\\'export PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin;cd /sources/cargo-c-0.10.24 && CARGO_BUILD_JOBS=2\
        \ CARGO_HOME=/tmp/nav-cargo-c-home LIBSSH2_SYS_USE_PKG_CONFIG=1 LIBSQLITE3_SYS_USE_PKG_CONFIG=1 cargo test\
        \ --release --locked\\\\\\' > \"$P/original-cargo-test.log\" 2>&1\\\\nrc=$?\\\\nset -e\\\\nprintf \\\\\\\
        '%s\\\\\\\\n\\\\\\' \"$rc\" > \"$P/original-cargo-test.exit\"\\\\npython3 /sources/cargo-c-recount.py recount\
        \ \"$P\"\\\\nprintf \\\\\\'0cbf346afe2c77fec7b39f8954b9de0639ced04234764240c8290dbec8d45e82  Cargo.lock\\\
        \\\\\\n\\\\\\' | sha256sum -c -\\\\npython3 - <<\\\\\\'GATE\\\\\\'\\\\nfrom pathlib import Path\\\\nimport\
        \ json,hashlib\\\\np=Path(\\\\\\'/nav-build-metadata/cargo-c\\\\\\');a=json.loads((p/\\\\\\'test-recount-audit.json\\\
        \\\\').read_text());assert a[\\\\\\'original_exit\\\\\\']==0 and a[\\\\\\'exact_scope_reconciled\\\\\\']\
        \ and not a[\\\\\\'unknown\\\\\\'],a\\\\ncounts=a[\\\\\\'execution\\\\\\'][\\\\\\'totals\\\\\\'];assert\
        \ counts[\\\\\\'PASS\\\\\\']>0 and counts[\\\\\\'FAIL\\\\\\']==counts[\\\\\\'IGNORED\\\\\\']==counts[\\\\\
        \\'MEASURED\\\\\\']==counts[\\\\\\'FILTERED\\\\\\']==0,counts\\\\noriginal=json.loads((p/\\\\\\'original-source-files-sha256.json\\\
        \\\\').read_text());s=Path(\\\\\\'/sources/cargo-c-0.10.24\\\\\\')\\\\nfor rel,x in original.items():\\\\\
        n f=s/rel;assert f.is_file()and f.stat().st_size==x[\\\\\\'bytes\\\\\\']and hashlib.file_digest(f.open(\\\
        \\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest()==x[\\\\\\'sha256\\\\\\'],rel\\\\n(p/\\\\\\'install-gate.json\\\
        \\\\').write_text(json.dumps({\\\\\\'all_original_discovery_execution_exact\\\\\\':True,\\\\\\'no_fail_ignored_unknown_filtered\\\
        \\\\':True,\\\\\\'source_and_release_lock_unchanged\\\\\\':True,\\\\\\'files\\\\\\':len(original),\\\\\\\
        'original_test_counts\\\\\\':counts},indent=2));print(\\\\\\'NAV_CARGOC_ORIGINAL_FULL_SUITE_EXACT_NAMES_STATUS_AND_SOURCE_INSTALL_GATE\\\
        \\\\',counts)\\\\nGATE\\\\ninstall -vm755 target/release/cargo-{capi,cbuild,cinstall,ctest} /usr/bin/ >\
        \ \"$P/install.log\" 2>&1\\\\nunset LIB{SSH2,SQLITE3}_SYS_USE_PKG_CONFIG\\\\nfor name in capi cbuild cinstall\
        \ ctest;do /usr/bin/cargo-$name --version;done > \"$P/installed-versions.log\" 2>&1\\\\nfor name in capi\
        \ cbuild cinstall ctest;do ldd /usr/bin/cargo-$name;done > \"$P/installed-linkage.log\" 2>&1\\\\n! grep\
        \ -q \\\\\\'not found\\\\\\' \"$P/installed-linkage.log\"\\\\npython3 - <<\\\\\\'INSTALLED\\\\\\'\\\\nfrom\
        \ pathlib import Path\\\\nimport hashlib,json\\\\np=Path(\\\\\\'/nav-build-metadata/cargo-c\\\\\\');v=(p/\\\
        \\\\'installed-versions.log\\\\\\').read_text();assert v.count(\\\\\\'0.10.24\\\\\\')==4,v\\\\nx={n:{\\\\\
        \\'bytes\\\\\\':Path(\\\\\\'/usr/bin/\\\\\\'+n).stat().st_size,\\\\\\'sha256\\\\\\':hashlib.file_digest(Path(\\\
        \\\\'/usr/bin/\\\\\\'+n).open(\\\\\\'rb\\\\\\'),\\\\\\'sha256\\\\\\').hexdigest()}for n in [\\\\\\'cargo-capi\\\
        \\\\',\\\\\\'cargo-cbuild\\\\\\',\\\\\\'cargo-cinstall\\\\\\',\\\\\\'cargo-ctest\\\\\\']};a={\\\\\\'classification\\\
        \\\\':\\\\\\'TRANSITIONAL only, not OSacceptance. AllinheritedgapsOPEN\\\\\\',\\\\\\'version\\\\\\':\\\\\
        \\'0.10.24+cargo-0.98.0\\\\\\',\\\\\\'source_patches\\\\\\':[],\\\\\\'Cargo_lock\\\\\\':\\\\\\'upstreamreleaseexact0cbf346afe2c77fec7b39f8954b9de0639ced04234764240c8290dbec8d45e82\\\
        \\\\',\\\\\\'test_audit\\\\\\':json.loads((p/\\\\\\'test-recount-audit.json\\\\\\').read_text()),\\\\\\\
        'installed_versions_and_linkage\\\\\\':\\\\\\'PASS\\\\\\',\\\\\\'installed_binaries\\\\\\':x,\\\\\\'inherited_audit\\\
        \\\\':\\\\\\'/nav-build-metadata/libheif/HEIF-TRANSITIONAL-OPEN.json\\\\\\',\\\\\\'memory_cap_KiB\\\\\\\
        ':4194304,\\\\\\'jobs\\\\\\':2,\\\\\\'root_saved\\\\\\':False};(p/\\\\\\'CARGOC-TRANSITIONAL-OPEN.json\\\
        \\\\').write_text(json.dumps(a,indent=2));(p/\\\\\\'installed-checks.json\\\\\\').write_text(json.dumps(x,indent=2));(p/\\\
        \\\\'BUNDLE-NOTES.txt\\\\\\').write_text(\\\\\\'TRANSITIONAL ONLY. AllinheritedgapsOPEN. Original cargo\
        \ test release locked, nofilters/noignored, exactdiscoveryexecution names andstatuses, source+releaselock\
        \ unchanged. FourinstalledCLIs version/linkage PASS. NotOSacceptance.\\\\\\\\n\\\\\\');print(\\\\\\'NAV_CARGOC_INSTALLED_FOUR_CLI_VERSIONS_LINKAGE_PASS\\\
        \\\\',json.dumps(x))\\\\nINSTALLED\\\\n\\')\\nPath(\\'/mnt/nav-lfs/sources/cargo-c-recount.py\\').write_text(\"\
        from pathlib import Path\\\\nimport json,re,collections,sys\\\\n\\\\nHEADER=re.compile(r\\'^\\\\\\\\s*(Running\
        \ (?:unittests|tests/)|Doc-tests\\\\\\\\s+)(.*)$\\')\\\\ndef groups(text):\\\\n out=[];current=None\\\\\
        n for line in text.splitlines():\\\\n  if HEADER.match(line):\\\\n   if current is not None:out.append(current)\\\
        \\n   current={\\'header\\':line.strip(),\\'identity\\':line.strip().split(\\' (\\',1)[0],\\'lines\\':[]}\\\
        \\n  elif current is not None:current[\\'lines\\'].append(line)\\\\n if current is not None:out.append(current)\\\
        \\n return out\\\\n\\\\ndef discover(text):\\\\n out=[];unknown=[]\\\\n for g in groups(text):\\\\n  t=\\\
        '\\\\\\\\n\\'.join(g.pop(\\'lines\\'));names=re.findall(r\\'^(.+?): (test|benchmark)$\\',t,re.M);summaries=re.findall(r\\\
