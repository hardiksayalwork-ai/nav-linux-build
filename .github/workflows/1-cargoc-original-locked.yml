        \ for n,_ in names)) and all(named[k]==counts[k]for k in [\\'PASS\\',\\'FAIL\\',\\'IGNORED\\'])\\\\n  g.update(status=status,counts=counts,case_lines=names,case_lines_count=len(names),named_case_counts_exact=exact)\\\
        \\n  if not exact:unknown.append({\\'header\\':g[\\'header\\'],\\'reason\\':\\'individual named-case statuses\
        \ differ from summary\\',\\'named\\':dict(named),\\'summary\\':counts})\\\\n  if counts[\\'FILTERED\\']or\
        \ counts[\\'MEASURED\\']:unknown.append({\\'header\\':g[\\'header\\'],\\'reason\\':\\'unexpected filtered/measured\
        \ cases\\'})\\\\n  tot.update(counts);out.append(g)\\\\n return {\\'groups\\':out,\\'totals\\':dict(tot),\\\
        'unknown\\':unknown,\\'group_count\\':len(gg)}\\\\n\\\\ndef reconcile(discovery,execution):\\\\n a=discover(discovery);b=parse(execution);unknown=a[\\\
        'unknown\\']+b[\\'unknown\\'];left={g[\\'identity\\']:g for g in a[\\'groups\\']};right={g[\\'identity\\\
        ']:g for g in b[\\'groups\\']}\\\\n if len(left)!=len(a[\\'groups\\'])or len(right)!=len(b[\\'groups\\']):unknown.append({\\\
        'reason\\':\\'duplicate harness identity\\'})\\\\n if left.keys()!=right.keys():unknown.append({\\'reason\\\
        ':\\'harness discovery/execution differ\\',\\'only_discovery\\':sorted(left.keys()-right.keys()),\\'only_execution\\\
        ':sorted(right.keys()-left.keys())})\\\\n for k in left.keys()&right.keys():\\\\n  if set(left[k][\\'names\\\
        '])!=set(n for n,_ in right[k][\\'case_lines\\']):unknown.append({\\'header\\':k,\\'reason\\':\\'exact discovered/executed\
        \ names differ\\'})\\\\n return {\\'discovery\\':a,\\'execution\\':b,\\'unknown\\':unknown,\\'exact_scope_reconciled\\\
        ':not unknown}\\\\n\\\\nif __name__==\\'__main__\\':\\\\n if sys.argv[1]==\\'selftest\\':\\\\n  h=\\'  \
        \  Running unittests src/lib.rs (target/release/deps/foo)\\\\\\\\n\\';d=h+\\'a: test\\\\\\\\nb: test\\\\\
        \\\\nc: test\\\\\\\\n3 tests, 0 benchmarks\\\\\\\\n   Doc-tests foo\\\\\\\\n0 tests, 0 benchmarks\\\\\\\\\
        n\\';e=h+\\'running 3 tests\\\\\\\\ntest a ... ok\\\\\\\\ntest b ... FAILED\\\\\\\\ntest c ... ignored,\
        \ needs device\\\\\\\\ntest result: FAILED. 1 passed; 1 failed; 1 ignored; 0 measured; 0 filtered out; finished\
        \ in 0.00s\\\\\\\\n   Doc-tests foo\\\\\\\\nrunning 0 tests\\\\\\\\ntest result: ok. 0 passed; 0 failed;\
        \ 0 ignored; 0 measured; 0 filtered out; finished in 0.00s\\\\\\\\n\\'\\\\n  a=reconcile(d,e);assert a[\\\
        'exact_scope_reconciled\\']and a[\\'execution\\'][\\'totals\\']=={\\'PASS\\':1,\\'FAIL\\':1,\\'IGNORED\\\
        ':1,\\'MEASURED\\':0,\\'FILTERED\\':0}\\\\n  assert not reconcile(d,e.replace(\\'test b ... FAILED\\',\\\
