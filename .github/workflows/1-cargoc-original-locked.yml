      shell: bash
      run: "set -euo pipefail\nroot=$(du -sb /mnt/nav-lfs|cut -f1)\ntest \"$root\" -lt 5368709120\ntar --zstd -cf\
        \ /mnt/nav-cargoc-root.tar.zst -C /mnt/nav-lfs .\nzstd -t /mnt/nav-cargoc-root.tar.zst\ntar --zstd -tf /mnt/nav-cargoc-root.tar.zst\
        \ > /tmp/nav-cargoc-members\n! grep -Eq '^./sources/(numpy-tooling-prefix|libaom-3.15.3/|aom-testdata/|libde265-1.1.3/|x265_4.2/|libheif-1.23.7/|cargo-c-0.10.24/)'\
        \ /tmp/nav-cargoc-members\ngrep -qx './usr/bin/cargo-capi' /tmp/nav-cargoc-members\nsudo mkdir /mnt/nav-cargoc-replay\n\
        sudo tar --zstd -xf /mnt/nav-cargoc-root.tar.zst -C /mnt/nav-cargoc-replay\nsudo python3 - <<'INDEPENDENT'\n\
        from pathlib import Path\nimport os,stat,hashlib,json\n\ndef manifest(root):\n root=Path(root);out={}\n\
        \ for d,dirs,files in os.walk(root,followlinks=False):\n  for p in [Path(d)]+[Path(d)/n for n in files]+[Path(d)/n\
        \ for n in dirs if (Path(d)/n).is_symlink()]:\n   s=p.lstat();x={'type':stat.S_IFMT(s.st_mode),'mode':stat.S_IMODE(s.st_mode),'uid':s.st_uid,'gid':s.st_gid,'mtime':int(s.st_mtime)}\n\
        \   if stat.S_ISREG(s.st_mode):x.update(bytes=s.st_size,sha256=hashlib.file_digest(p.open('rb'),'sha256').hexdigest())\n\
        \   elif stat.S_ISLNK(s.st_mode):x['link']=os.readlink(p)\n   elif not stat.S_ISDIR(s.st_mode):x['rdev']=s.st_rdev\n\
        \   out[str(p.relative_to(root))]=x\n return out\nleft=manifest('/mnt/nav-lfs');right=manifest('/mnt/nav-cargoc-replay');assert\
