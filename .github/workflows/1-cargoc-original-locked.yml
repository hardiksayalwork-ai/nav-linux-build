        \\n return {\\'groups\\':out,\\'unknown\\':unknown}\\\\n\\\\ndef parse(text):\\\\n out=[];tot=collections.Counter();unknown=[];gg=groups(text)\\\
        \\n for g in gg:\\\\n  t=\\'\\\\\\\\n\\'.join(g.pop(\\'lines\\'));s=re.findall(r\\'^test result: (ok|FAILED)\\\
        \\\\\\. (\\\\\\\\d+) passed; (\\\\\\\\d+) failed; (\\\\\\\\d+) ignored; (\\\\\\\\d+) measured; (\\\\\\\\\
        d+) filtered out;?\\',t,re.M)\\\\n  if len(s)!=1:unknown.append({\\'header\\':g[\\'header\\'],\\'reason\\\
