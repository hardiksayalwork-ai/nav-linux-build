name: NAV source Xorg bootstrap strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  xorg-bootstrap:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-font-shaping-v1
        fail-on-cache-miss: true
    - name: Build Xorg protocols authorization and XCB strict suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"check-0.15.2.tar.gz\", \"url\": \"https://github.com/libcheck/check/releases/download/0.15.2/check-0.15.2.tar.gz\", \"bytes\": 774985, \"sha256\": \"a8de4e0bacfb4d76dd1c618ded263523b53b85d92a146d8835eb1a52932fa20a\"}, {\"filename\"\
        : \"util-macros-1.20.2.tar.xz\", \"url\": \"https://www.x.org/pub/individual/util/util-macros-1.20.2.tar.xz\", \"bytes\": 83592, \"book_md5\": \"5f683a1966834b0a6ae07b3680bcb863\", \"sha256\": \"9ac269eba24f672d7d7b3574e4be5f333d13f04a7712303b1821b2a51ac82e8e\"}, {\"filename\": \"xorgproto-2025.1.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/proto/xorgproto-2025.1.tar.xz\", \"bytes\": 766932, \"book_md5\": \"15534fa6fb13a6a70afe7561c1424f3c\", \"sha256\": \"56898c716c0578df8a2d828c9c3e5c528277705c0484381a81960fe1a67668e8\"}, {\"filename\": \"libXau-1.0.12.tar.xz\", \"url\": \"https://www.x.org/pub/individual/lib/libXau-1.0.12.tar.xz\", \"bytes\": 282624, \"book_md5\": \"4c9f81acf00b62e5de56a912691bd737\", \"sha256\": \"74d0e4dfa3d39ad8939e99bda37f5967aba528211076828464d2777d477fc0fb\"}, {\"filename\": \"libXdmcp-1.1.5.tar.xz\", \"url\": \"https://www.x.org/pub/individual/lib/libXdmcp-1.1.5.tar.xz\", \"bytes\": 297596, \"book_md5\": \"ce0af51de211e4c99a111e64ae1df290\"\
        , \"sha256\": \"d8a5222828c3adab70adf69a5583f1d32eb5ece04304f7f8392b6a353aa2228c\"}, {\"filename\": \"xcb-proto-1.17.0.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/proto/xcb-proto-1.17.0.tar.xz\", \"bytes\": 151748, \"book_md5\": \"c415553d2ee1a8cea43c3234a079b53f\", \"sha256\": \"2c1bacd2110f4799f74de6ebb714b94cf6f80fb112316b1219480fd22562148c\"}, {\"filename\": \"libxcb-1.17.0.tar.xz\", \"url\": \"https://xorg.freedesktop.org/archive/individual/lib/libxcb-1.17.0.tar.xz\", \"bytes\": 455208, \"book_md5\": \"96565523e9f9b701fcb35d31f1d4086e\", \"sha256\": \"599ebf9996710fea71622e6e184f3a8ad5b43d0e5fa8c4e407123c88a59a6d55\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\\
        '],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/xorg-bootstrap.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS\
        \ %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nexport XORG_PREFIX=/usr\\\\nexport XORG_CONFIG=\"--prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static\"\\\\ncd /sources\\\\ntar -xf check-0.15.2.tar.gz\\\\ncd check-0.15.2\\\\n./configure --prefix=/usr --disable-static\\\\nmake\\\\nchown -R tester:tester .\\\\nrun_test check su tester -c \"make check\"\\\\nmake install\\\\ncd /sources\\\\nrm -rf check-0.15.2\\\\ntar -xf util-macros-1.20.2.tar.xz\\\\ncd util-macros-1.20.2\\\\n./configure $XORG_CONFIG\\\\nmake install\\\\ncd /sources\\\\nrm -rf util-macros-1.20.2\\\\ntar -xf xorgproto-2025.1.tar.xz\\\\ncd xorgproto-2025.1\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nodownload\\\\nninja -C build\\\\nninja -C build install\\\\nmv /usr/share/doc/xorgproto /usr/share/doc/xorgproto-2025.1\\\\ncd /sources\\\\nrm -rf xorgproto-2025.1\\\\nfor package in libXau-1.0.12 libXdmcp-1.1.5 xcb-proto-1.17.0 libxcb-1.17.0; do\\\\n cd /sources\\\\n tar -xf \"$package.tar.xz\"\
        \\\\n cd \"$package\"\\\\n case \"$package\" in\\\\n libxcb-*) ./configure $XORG_CONFIG --without-doxygen --docdir=/usr/share/doc/libxcb-1.17.0; grep -q \\\\\\'^CHECK_LIBS = .*lcheck\\\\\\' Makefile ;;\\\\n *) PYTHON=python3 ./configure $XORG_CONFIG ;;\\\\n esac\\\\n LC_ALL=en_US.UTF-8 make\\\\n chown -R tester:tester .\\\\n run_test \"$package\" su tester -c \"LC_ALL=en_US.UTF-8 make check\"\\\\n make install\\\\n cd /sources\\\\n rm -rf \"$package\"\\\\n ldconfig\\\\ndone\\\\npkg-config --modversion xorg-macros xproto xau xdmcp xcb xcb-proto check\\\\npython3 -c \\\\\\'import xcbgen,xml.etree.ElementTree as E; r=E.parse(\"/usr/share/xcb/xproto.xml\").getroot(); assert r.tag==\"xcb\" and r.attrib[\"header\"]==\"xproto\"; print(\"NAV_XCBGEN_PACKAGE_SCHEMA_OK\")\\\\\\'\\\\ncat > /tmp/nav-xcb-smoke.c <<\\\\\\'C\\\\\\'\\\\n#include <xcb/xcb.h>\\\\n#include <X11/Xauth.h>\\\\n#include <X11/Xdmcp.h>\\\\nint main(void){xcb_auth_info_t a={0}; Xauth x={0}; XdmcpBuffer b={0}; return a.namelen+x.family+b.size;}\\\
        \\nC\\\\ngcc /tmp/nav-xcb-smoke.c $(pkg-config --cflags --libs xcb xau xdmcp) -o /tmp/nav-xcb-smoke\\\\n/tmp/nav-xcb-smoke\\\\nprintf \\\\\\'NAV_XORG_BOOTSTRAP_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'Xorg bootstrap: Check, libXau, libXdmcp, xcb-proto, libxcb configured suites strict nonroot; Check dependency required and asserted for libxcb tests. util-macros and xorgproto have no upstream suite. Native API/import smoke; no display server acceptance yet.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_XORG_BOOTSTRAP_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620\
        \ \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/xorg-bootstrap.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke;\
        \ printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/xorg-bootstrap.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise\
        \ RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_XORG_BOOTSTRAP','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested Xorg bootstrap
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-xorg-bootstrap-v1
