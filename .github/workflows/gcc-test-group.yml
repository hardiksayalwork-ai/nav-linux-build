name: NAV GCC serial complete test group
'on':
  workflow_dispatch:
    inputs:
      group:
        description: One serial complete suite group. Install remains blocked until all three audited.
        type: choice
        required: true
        options:
        - c
        - cxx
        - runtime
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  gcc-test-group:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'mkdir -p /mnt/nav-gcc-checkpoint

        '
    - name: Restore immutable build-only archive
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-gcc-checkpoint
        key: nav-lfs13.1-x86_64-gcc-build-tree-v1
        fail-on-cache-miss: true
    - name: Full selected test group and strict audit
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nos.environ[\"NAV_GCC_TEST_GROUP\"]=os.environ[\"SELECTED_GROUP\"]\nassert os.environ[\"NAV_GCC_TEST_GROUP\"] in (\"c\",\"cxx\",\"runtime\")\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\npython3 - <<\\'ARCHIVE_VERIFY\\'\\nimport pathlib,json,hashlib\\np=pathlib.Path(\\'/mnt/nav-gcc-checkpoint\\');m=json.loads((p/\\'manifest.json\\').read_text());h=hashlib.sha256()\\nwith (p/\\'root.tar.zst\\').open(\\'rb\\') as f:\\n for b in iter(lambda:f.read(8*1024**2),b\\'\\'):h.update(b)\\nassert m[\\'sha256\\']==h.hexdigest() and m[\\'bytes\\']==(p/\\'root.tar.zst\\').stat().st_size\\\
        nprint(\\'NAV_GCC_TEST_ARCHIVE_SHA256_OK\\',h.hexdigest(),flush=True)\\nARCHIVE_VERIFY\\nsudo mkdir -p \"$LFS\"\\nzstd -dc /mnt/nav-gcc-checkpoint/root.tar.zst | sudo tar --numeric-owner --same-owner -C \"$LFS\" -xf -\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-gcc.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests\\\\nstat -c \\\\\\'NAV_GCC_TMP_BEFORE %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\nchmod 1777 /tmp /var/tmp\\\\nstat -c \\\\\\'NAV_GCC_TMP_AFTER %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\ncat > /tmp/nav-nonroot-preflight.sh <<\\\\\\'NONROOT\\\\\\'\\\\nset -euo pipefail\\\\nd=$(mktemp -d)\\\\ntrap \\\\\\'rm -rf \"$d\"\\\\\\' EXIT\\\\nmkfifo \"$d/fifo\"\\\\nprintf \\\\\\'int main(){return 0;}\\\\\\\\n\\\\\\' > \"$d/probe.c\"\\\\ngcc \"$d/probe.c\" -o \"$d/probe\"\\\\n\"$d/probe\"\\\\nprintf \\\\\\'NAV_GCC_NONROOT_TMP_FIFO_COMPILE_RUN_OK\\\\\\\\n\\\\\\'\\\\nNONROOT\\\\nsu tester\
        \ -c \\\\\\'bash /tmp/nav-nonroot-preflight.sh\\\\\\'\\\\nrm /tmp/nav-nonroot-preflight.sh\\\\n\\\\nsu tester -c \\\\\\'set -eu; python3 -c \"import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\"\\\\\\'\\\\ncat > /tmp/nav-expect-preflight.exp <<\\\\\\'EXPECT\\\\\\'\\\\nset timeout 10\\\\nspawn /usr/bin/echo NAV_EXPECT_NONROOT_OK\\\\nexpect {\\\\n NAV_EXPECT_NONROOT_OK {exit 0}\\\\n timeout {exit 1}\\\\n eof {exit 2}\\\\n}\\\\nEXPECT\\\\nsu tester -c \\\\\\'set -eu; expect /tmp/nav-expect-preflight.exp\\\\\\'\\\\nrm /tmp/nav-expect-preflight.exp\\\\nprintf \\\\\\'NAV_GCC_NONROOT_PTY_PREFLIGHT_OK\\\\\\\\n\\\\\\'\\\\ncd /sources/gcc-16.2.0/build\\\\nulimit -s -H unlimited\\\\nchown -R tester .\\\\n# These are the exact native language targets used by gcc/ check. The runtime\\\\n# group invokes all top-level default check targets except the separately run\\\\n# check-gcc aggregate. No RUNTESTFLAGS filtering is applied to any full group.\\\\npython3 - <<\\\\\\'CHECK_COVERAGE\\\\\
        \\'\\\\nfrom pathlib import Path\\\\nimport re\\\\ns=Path(\\\\\\'gcc/Makefile\\\\\\').read_text();m=re.search(r\\\\\\'^CHECK_TARGETS\\\\\\\\s*=\\\\\\\\s*(.*)$\\\\\\',s,re.M);assert m\\\\nv=set(m[1].split());assert v and v<={\\\\\\'check-c\\\\\\',\\\\\\'check-c++\\\\\\',\\\\\\'check-lto\\\\\\'},v\\\\nprint(\\\\\\'NAV_GCC_DEFAULT_LANGUAGE_TARGETS\\\\\\',sorted(v),flush=True)\\\\nCHECK_COVERAGE\\\\ncase \"$NAV_GCC_TEST_GROUP\" in\\\\n c) command=\\\\\\'make -C gcc -k check-c\\\\\\';;\\\\n cxx) command=\\\\\\'make -C gcc -k check-c++\\\\\\';;\\\\n runtime) command=\\\\\\'make -k -o check-gcc check-host check-target\\\\\\';;\\\\n *) exit 1;;\\\\nesac\\\\n# Remove the saved 16-case probe summaries so they cannot count as full suites.\\\\nfind . -name \\\\\\'*.sum\\\\\\' -delete\\\\nfind . -name \\\\\\'*.sum.sep\\\\\\' -delete\\\\nset +e\\\\nsu tester -c \"set -eu; PATH=/usr/bin:/usr/sbin $command\" > /nav-build-metadata/tests/gcc-check.log 2>&1\\\\ncheck_rc=$?\\\\nif [ \"$NAV_GCC_TEST_GROUP\"\
        \ = runtime ]; then\\\\n su tester -c \\\\\\'set -eu; PATH=/usr/bin:/usr/sbin make -C gcc check-lto\\\\\\' >> /nav-build-metadata/tests/gcc-check.log 2>&1\\\\n lto_rc=$?\\\\n test \"$lto_rc\" = 0 || check_rc=1\\\\nfi\\\\nset -e\\\\nprintf \\\\\\'NAV_GCC_GROUP_CHECK_STATUS %s %s\\\\\\\\n\\\\\\' \"$NAV_GCC_TEST_GROUP\" \"$check_rc\"\\\\ntail -60 /nav-build-metadata/tests/gcc-check.log\\\\n../contrib/test_summary -t > /nav-build-metadata/tests/gcc-summary.txt\\\\ncat /nav-build-metadata/tests/gcc-summary.txt\\\\npython3 - \"$check_rc\" \"$NAV_GCC_TEST_GROUP\" <<\\\\\\'GCC_AUDIT\\\\\\'\\\\nimport pathlib,re,sys,json,fnmatch,shutil,gzip\\\\ngroup=sys.argv[2]\\\\nknown=set([\\\\\\'g++.target/i386/memset-pr108585-1a.C\\\\\\', \\\\\\'g++.target/i386/memset-pr108585-1b.C\\\\\\', \\\\\\'g++.target/i386/mv-symbols1.C\\\\\\', \\\\\\'g++.target/i386/mv-symbols3.C\\\\\\', \\\\\\'g++.target/i386/mv-symbols4.C\\\\\\', \\\\\\'g++.target/i386/mv-symbols5.C\\\\\\', \\\\\\'g++.target/i386/mvc-symbols1.C\\\
        \\\\', \\\\\\'g++.target/i386/mvc-symbols3.C\\\\\\', \\\\\\'g++.target/i386/pr112824-2.C\\\\\\', \\\\\\'g++.target/i386/pr116896-1.C\\\\\\', \\\\\\'gcc.dg/ipa/pr122458.c\\\\\\', \\\\\\'gcc.dg/lto/toplevel-extended-asm-1\\\\\\', \\\\\\'gcc.dg/lto/toplevel-simple-asm-1\\\\\\', \\\\\\'gcc.dg/plugin/crash-test-nested-ice.c\\\\\\', \\\\\\'gcc.dg/plugin/crash-test-nested-write-through-null.c\\\\\\', \\\\\\'gcc.target/i386/auto-init-padding-9.c\\\\\\', \\\\\\'gcc.target/i386/builtin-memmove-12.c\\\\\\', \\\\\\'gcc.target/i386/builtin-memmove-13.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-2.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-3.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-4.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-5.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-6.c\\\\\\', \\\\\\'gcc.target/i386/memcpy-pr120683-7.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-13.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-17.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-18.c\\\
        \\\\', \\\\\\'gcc.target/i386/memset-pr120683-19.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-20.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-21.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-22.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr120683-23.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr70308-1a.c\\\\\\', \\\\\\'gcc.target/i386/memset-pr70308-1b.c\\\\\\', \\\\\\'gcc.target/i386/pr111657-1.c\\\\\\', \\\\\\'gcc.target/i386/pr115102.c\\\\\\', \\\\\\'gcc.target/i386/pr116896.c\\\\\\', \\\\\\'gcc.target/i386/pr120881-2a.c\\\\\\', \\\\\\'gcc.target/i386/pr122343-4a.c\\\\\\', \\\\\\'gcc.target/i386/pr125355-2.c\\\\\\', \\\\\\'gcc.target/i386/pr125355.c\\\\\\', \\\\\\'gcc.target/i386/shift-gf2p8affine-2.c\\\\\\', \\\\\\'gcc.target/i386/xchg-4.c\\\\\\'])\\\\n# Source: LFS13.1 chapter08/gcc.html plus official i7-14700K test log.\\\\npatterns=[\\\\\\'gcc.dg/lto/toplevel-*-asm-*\\\\\\',\\\\\\'gcc.dg/plugin/crash-test-nested-*.c\\\\\\',\\\\\\'gcc.target/i386/builtin-memmove-*.c\\\\\
        \\',\\\\\\'gcc.target/i386/memcpy-pr120683-*.c\\\\\\',\\\\\\'gcc.target/i386/memset-pr120683-*.c\\\\\\',\\\\\\'g++.target/i386/mv-symbols*.C\\\\\\',\\\\\\'g++.target/i386/mvc-symbols*.C\\\\\\',\\\\\\'g++.dg/gomp/deprecate-1.C\\\\\\']\\\\ncounts={};bad=[];allowed=[];files=list(pathlib.Path(\\\\\\'.\\\\\\').rglob(\\\\\\'*.sum\\\\\\'));files=[f for f in files if not (f.suffixes[-2:]==[\\\\\\'.sum\\\\\\',\\\\\\'.sep\\\\\\'])];assert files,\\\\\\'No GCC test summaries\\\\\\'\\\\ndest=pathlib.Path(\\\\\\'/nav-build-metadata/tests/gcc-sums\\\\\\')\\\\nfor f in files:\\\\n text=f.read_text(errors=\\\\\\'replace\\\\\\');out=dest/f;out.parent.mkdir(parents=True,exist_ok=True);out.write_text(text)\\\\n name=f.stem\\\\n c={k:sum(map(int,re.findall(r\\\\\\'# of \\\\\\'+k+r\\\\\\'\\\\\\\\s+(\\\\\\\\d+)\\\\\\',text))) for k in [\\\\\\'expected passes\\\\\\',\\\\\\'unexpected failures\\\\\\',\\\\\\'unexpected successes\\\\\\',\\\\\\'unresolved testcases\\\\\\',\\\\\\'unsupported tests\\\\\\']}\\\
        \\n if name not in counts or c[\\\\\\'expected passes\\\\\\']>counts[name][\\\\\\'expected passes\\\\\\']:counts[name]=c\\\\n for line in text.splitlines():\\\\n  if not line.startswith((\\\\\\'FAIL:\\\\\\',\\\\\\'XPASS:\\\\\\',\\\\\\'UNRESOLVED:\\\\\\',\\\\\\'ERROR:\\\\\\')):continue\\\\n  parts=line.split();test=parts[1] if len(parts)>1 else \\\\\\'\\\\\\'\\\\n  allowed_type=line.startswith(\\\\\\'FAIL:\\\\\\') or (line.startswith(\\\\\\'XPASS:\\\\\\') and test.startswith(\\\\\\'gcc.dg/plugin/crash-test-nested-\\\\\\'))\\\\n  if allowed_type and (test in known or any(fnmatch.fnmatchcase(test,p) for p in patterns)):allowed.append(line)\\\\n  else:bad.append(line)\\\\nprint(\\\\\\'NAV_GCC_SUITE_COUNTS\\\\\\',json.dumps(counts,sort_keys=True),flush=True)\\\\nprint(\\\\\\'NAV_GCC_KNOWN_RESULTS\\\\\\',json.dumps(allowed),flush=True)\\\\nprint(\\\\\\'NAV_GCC_UNEXPECTED_RESULTS\\\\\\',json.dumps({\\\\\\'count\\\\\\':len(bad),\\\\\\'first\\\\\\':bad[:25]}),flush=True)\\\\nassert not bad,(\\\
        \\\\'new GCC test failures\\\\\\',len(bad),bad[:5])\\\\nfor n,minimum in ({\\\\\\'c\\\\\\':{\\\\\\'gcc\\\\\\':190000},\\\\\\'cxx\\\\\\':{\\\\\\'g++\\\\\\':240000},\\\\\\'runtime\\\\\\':{\\\\\\'libstdc++\\\\\\':16000,\\\\\\'libgomp\\\\\\':5000,\\\\\\'libatomic\\\\\\':50,\\\\\\'libitm\\\\\\':40}}[group]).items():\\\\n assert n in counts and counts[n][\\\\\\'expected passes\\\\\\']>=minimum,(\\\\\\'incomplete suite\\\\\\',n,counts.get(n))\\\\nassert len(allowed)<160,(\\\\\\'excess known-test failures\\\\\\',len(allowed))\\\\nassert int(sys.argv[1]) in (0,2) and (int(sys.argv[1])==0 or allowed),(\\\\\\'unexpected check status\\\\\\',sys.argv[1])\\\\nwith open(\\\\\\'/nav-build-metadata/tests/gcc-check.log\\\\\\',\\\\\\'rb\\\\\\') as a,gzip.open(\\\\\\'/nav-build-metadata/tests/gcc-check.log.gz\\\\\\',\\\\\\'wb\\\\\\') as b:shutil.copyfileobj(a,b)\\\\npathlib.Path(\\\\\\'/nav-build-metadata/tests/gcc-check.log\\\\\\').unlink()\\\\npathlib.Path(\\\\\\'/nav-build-metadata/tests/gcc-audit.json\\\
        \\\\').write_text(json.dumps({\\\\\\'counts\\\\\\':counts,\\\\\\'known_results\\\\\\':allowed,\\\\\\'unexpected_results\\\\\\':bad,\\\\\\'asan\\\\\\':\\\\\\'upstream harness skips with virtual-memory limit\\\\\\',\\\\\\'group\\\\\\':group},indent=2))\\\\nprint(\\\\\\'NAV_GCC_GROUP_AUDITED\\\\\\',group,flush=True)\\\\nGCC_AUDIT\\\\nprintf \\\\\\'NAV_GCC_GROUP_COMPLETE %s\\\\\\\\n\\\\\\' \"$NAV_GCC_TEST_GROUP\"\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" NAV_GCC_TEST_GROUP=\"$NAV_GCC_TEST_GROUP\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\n# The host uses /dev/ptmx -> pts/ptmx. A fresh devpts node defaults to\\n# mode0000; prove the old non-root behavior, then use the kernel-doc option.\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\nset +e\\nchroot --userspec=101:101\
        \ \"$LFS\" /usr/bin/python3 -c \\'import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\\'\\nold_pty_rc=$?\\nset -e\\nprintf \\'NAV_GCC_ORIGINAL_PTY_STATUS %s\\\\n\\' \"$old_pty_rc\"\\nmount -o remount,gid=5,mode=0620,ptmxmode=0666 \"$LFS/dev/pts\"\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\n\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX\
        \ NAV_GCC_TEST_GROUP=\"$NAV_GCC_TEST_GROUP\" /bin/bash --noprofile --norc /sources/final-gcc.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\nmkdir -p /mnt/nav-gcc-report\\nsudo cp -a \"$LFS/nav-build-metadata/tests/gcc-sums\" /mnt/nav-gcc-report/\\nsudo cp -a \"$LFS/nav-build-metadata/tests/gcc-audit.json\" \"$LFS/nav-build-metadata/tests/gcc-summary.txt\" \"$LFS/nav-build-metadata/tests/gcc-check.log.gz\" /mnt/nav-gcc-report/\\ncp /mnt/nav-gcc-checkpoint/manifest.json /mnt/nav-gcc-report/build-manifest.json\\nsudo chown -R \"$(id -u):$(id -g)\" /mnt/nav-gcc-report\\npython3 - <<\\'REPORT_CAP\\'\\nimport pathlib\\nn=sum(f.stat().st_size for f in pathlib.Path(\\'/mnt/nav-gcc-report\\').rglob(\\'*\\') if f.is_file());assert n<100*1024**2,n\\\
        nprint(\\'NAV_GCC_GROUP_REPORT_BYTES\\',n,flush=True)\\nREPORT_CAP\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n root=pathlib.Path('/mnt/nav-lfs/sources/gcc-16.2.0/build')\n for\
        \ f in root.rglob('*.sum'):\n  lines=f.read_text(errors='replace').splitlines()\n  print('NAV_GCC_SUMMARY_TAIL',str(f),'\\n'.join(lines[-12:]),flush=True)\n check=pathlib.Path('/mnt/nav-lfs/nav-build-metadata/tests/gcc-check.log')\n if check.exists():\n  with check.open('rb') as f:\n   f.seek(0,2);f.seek(max(0,f.tell()-12000));print('NAV_GCC_LIVE_LOG_TAIL',f.read().decode(errors='replace'),flush=True)\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_GCC','NAV_FINAL_GCC','NAV_TESTER'])))\nNAV_GUARD\n"
      env:
