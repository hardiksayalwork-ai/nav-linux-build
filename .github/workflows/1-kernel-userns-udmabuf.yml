        \ '10480998516': {'key': 'nav-lfs13.1-x86_64-access-tools-v1', 'ref': 'refs/heads/main', 'size_in_bytes':\
        \ 909038418, 'version': '14acf6db514597b2f82ceda42a47a939f1bd119af73d5ded953f7d51f3e580b5'}, '10508735204':\
        \ {'key': 'nav-lfs13.1-x86_64-gcc-test-c-v1', 'ref': 'refs/heads/main', 'size_in_bytes': 1021068, 'version':\
        \ 'e15aff5375d0e86d1aaef9fe181e558b39f1a1f784dccea28a3079ab10645ef8'}, '10511354384': {'key': 'nav-lfs13.1-x86_64-gcc-test-cxx-v1',\
        \ 'ref': 'refs/heads/main', 'size_in_bytes': 1030391, 'version': 'e15aff5375d0e86d1aaef9fe181e558b39f1a1f784dccea28a3079ab10645ef8'},\
        \ '10515953327': {'key': 'nav-lfs13.1-x86_64-gcc-test-runtime-v1', 'ref': 'refs/heads/main', 'size_in_bytes':\
        \ 148732, 'version': 'e15aff5375d0e86d1aaef9fe181e558b39f1a1f784dccea28a3079ab10645ef8'}, '10516363617':\
        \ {'key': 'nav-lfs13.1-x86_64-final-gcc-v1', 'ref': 'refs/heads/main', 'size_in_bytes': 1413472049, 'version':\
        \ '14acf6db514597b2f82ceda42a47a939f1bd119af73d5ded953f7d51f3e580b5'}, '10696846187': {'key': 'nav-blfs13.1-x86_64-git-open-v1',\
        \ 'ref': 'refs/heads/main', 'size_in_bytes': 1374122764, 'version': '14acf6db514597b2f82ceda42a47a939f1bd119af73d5ded953f7d51f3e580b5'},\
        \ '10700939007': {'key': 'nav-blfs13.1-x86_64-giflib-open-v1', 'ref': 'refs/heads/main', 'size_in_bytes':\
        \ 1374812746, 'version': '14acf6db514597b2f82ceda42a47a939f1bd119af73d5ded953f7d51f3e580b5'}, '10710908926':\
        \ {'key': 'nav-blfs13.1-x86_64-jxl-open-v1', 'ref': 'refs/heads/main', 'size_in_bytes': 1404400214, 'version':\
        \ '554507abaeca91255ad1a6f15da321ec0e5bfea6c40ae80755a6e2b33b37debe'}, '10790873772': {'key': 'nav-blfs13.1-x86_64-aom-static-repair-open-v1',\
        \ 'ref': 'refs/heads/main', 'size_in_bytes': 1414253410, 'version': '69e54c818e6d1830d476051f7c8862dd31fd9fdd162e849ebefc672993823dee'},\
        \ '10803318199': {'key': 'nav-blfs13.1-x86_64-librsvg-transitional-open-v1', 'ref': 'refs/heads/main', 'size_in_bytes':\
        \ 1477765679, 'version': '8d333d49a8f4916a9c92ad0c11bd049e8b23c56e739635178878f341b0359d6f'}}\npre=inventory();assert\
        \ pre==EXPECTED,'Protected inventory changed, no save'\na=json.loads(Path('/tmp/nav-kernel-bundle-proof.json').read_text());p=Path('/mnt/nav-kernel-userns-udmabuf.tar.zst');assert\
        \ hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==a['bundle_sha256']\nz=ctypes.CDLL(ctypes.util.find_library('zstd'));z.ZSTD_compressBound.argtypes=[ctypes.c_size_t];z.ZSTD_compressBound.restype=ctypes.c_size_t\n\
