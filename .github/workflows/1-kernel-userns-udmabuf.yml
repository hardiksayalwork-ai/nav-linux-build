        \ and core['remaining']>=250 and core['reset']>time.time()\nout={'before':pre,'upper_bytes':upper,'bundle_sha256':a['bundle_sha256'],'health':core,'no_deletions':True}\n\
        Path('/tmp/nav-kernel-presave.json').write_text(json.dumps(out,sort_keys=True));print('NAV_KERNEL_PRESAVE_JSON\
