    - name: Verify onlysmallnewcache saved all11protected exact and budget
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'POST'\nimport os,json,urllib.request,hashlib,ctypes,ctypes.util,time\n\
        from pathlib import Path\nTOKEN=os.environ['GH_TOKEN'];assert TOKEN\nBASE='https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/'\n\
