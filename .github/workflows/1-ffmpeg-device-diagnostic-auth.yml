      run: "set -euo pipefail\nmkdir -p /mnt/nav-lfs/sources/nav-gstbad-evidence\nsudo --preserve-env=GH_TOKEN python3\
        \ - <<'RECOVER'\nimport os,json,time,urllib.request,hashlib,base64,gzip,re\nfrom pathlib import Path\nTOKEN=os.environ['GH_TOKEN'];assert\
