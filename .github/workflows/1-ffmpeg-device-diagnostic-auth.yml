name: NAV disposable device diagnostic repair AUTH read NO tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Live public standard runner free compute cache17exact and upstream rsync reachability
      shell: bash
      run: "test \"$GITHUB_RUN_NUMBER\" = 1\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\ndate +%s > /tmp/nav-shard-job-start\n\
        set -euo pipefail\ncommand -v rsync\nrsync --version | head -3\npython3 - <<'PREFLIGHT'\nimport urllib.request,urllib.error,json,time,os\n\
        start=time.monotonic();base='https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build';token=os.environ['GH_TOKEN'];assert\
        \ token\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,req,fp,code,msg,headers,newurl):raise\
        \ urllib.error.HTTPError(req.full_url,code,'redirect refused for scoped authenticated preflight',headers,fp)\n\
        opener=urllib.request.build_opener(NoRedirect())\ndef req(u):\n assert u.startswith(base)\n q=urllib.request.Request(u,headers={'Authorization':'Bearer\
        \ '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Cache-Control':'no-store'})\n\
        \ with opener.open(q,timeout=30)as response:return json.load(response)\nr=req(base+'?t='+str(time.time_ns()));assert\
        \ r['private'] is False\nc=req(base+'/actions/caches?per_page=100&t='+str(time.time_ns()));expected={'10818008081':\
        \ {'key': 'nav-theora-basetheora-install-only-open-v1', 'bytes': 1665268}, '10816097588': {'key': 'nav-gstmatroska-original-tested-install-only-open-v1',\
        \ 'bytes': 283419}, '10813815026': {'key': 'nav-opus-baseopus-install-only-open-v1', 'bytes': 512022}, '10810498235':\
        \ {'key': 'nav-gstgood-narrow-install-only-transitional-open-v1', 'bytes': 901348}, '10803318199': {'key':\
        \ 'nav-blfs13.1-x86_64-librsvg-transitional-open-v1', 'bytes': 1477765679}, '10805037408': {'key': 'nav-graphene-isocodes-hicolor-install-only-open-v1',\
        \ 'bytes': 6895265}, '10804828520': {'key': 'nav-linux7.1.8-userns-udmabuf-compiled-open-v1', 'bytes': 17602045},\
        \ '10790873772': {'key': 'nav-blfs13.1-x86_64-aom-static-repair-open-v1', 'bytes': 1414253410}, '10710908926':\
        \ {'key': 'nav-blfs13.1-x86_64-jxl-open-v1', 'bytes': 1404400214}, '10700939007': {'key': 'nav-blfs13.1-x86_64-giflib-open-v1',\
        \ 'bytes': 1374812746}, '10696846187': {'key': 'nav-blfs13.1-x86_64-git-open-v1', 'bytes': 1374122764},\
        \ '10516363617': {'key': 'nav-lfs13.1-x86_64-final-gcc-v1', 'bytes': 1413472049}, '10515953327': {'key':\
        \ 'nav-lfs13.1-x86_64-gcc-test-runtime-v1', 'bytes': 148732}, '10511354384': {'key': 'nav-lfs13.1-x86_64-gcc-test-cxx-v1',\
        \ 'bytes': 1030391}, '10508735204': {'key': 'nav-lfs13.1-x86_64-gcc-test-c-v1', 'bytes': 1021068}, '10480998516':\
        \ {'key': 'nav-lfs13.1-x86_64-access-tools-v1', 'bytes': 909038418}, '10480209539': {'key': 'nav-lfs13.1-x86_64-final-math-v1',\
        \ 'bytes': 901878016}}\nactual={str(z['id']):{'key':z['key'],'bytes':z['size_in_bytes']}for z in c['actions_caches']};assert\
        \ c['total_count']==len(actual)==len(expected)and actual==expected\nassert sum(z['bytes']for z in actual.values())<10*1024**3\n\
        print('NAV_FFMPEG_PUBLIC_STANDARD_RUNNER_FREE_CACHE_EXACT '+json.dumps({'public':True,'standard_runner':'ubuntu-24.04','cache_count':len(actual),'cache_bytes':sum(z['bytes']for\
        \ z in actual.values()),'no_cache_save_or_delete':True,'elapsed':time.monotonic()-start}),flush=True)\n\
        PREFLIGHT\n"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-rsvg-root.tar.zst /mnt/nav-gstmatroska-prerequisites.tar.zst /mnt/nav-theorabase-prerequisites.tar.zst\
        \ /mnt/nav-gstgood-prerequisites.tar.zst /mnt/nav-opusbase-prerequisites.tar.zst; do\n test ! -e \"$bundle\"\
        \n sudo install -o \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test\
        \ \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n\
        \ printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\"\
        \ proof\n zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\"\
        \ \"$probe/recovered\"\n # Match actions/cache extraction semantics, not only bundle writer access.\n test\
        \ \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n\
        \ relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\"\
        \ -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n\
        \ set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\
        \n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program\
        \ unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_RSVG_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_RSVG_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_RSVG_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_RSVG_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
