    - name: Prove disposable device defect and repair NONTEST only
      run: "set -euo pipefail\nsudo python3 - <<'DEVICE'\nfrom pathlib import Path\nimport os,stat,json,subprocess,hashlib,gzip,base64,traceback\n\
        root=Path('/mnt/nav-lfs');out=root/'nav-build-metadata/ffmpeg-device-diagnostic';out.mkdir();manifest={};errors=[]\n\
