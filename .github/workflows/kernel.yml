name: NAV Linux source kernel compile and config audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  kernel:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-base-strip-v1
        fail-on-cache-miss: true
    - name: Compile pinned Linux kernel and audit config
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"linux-7.1.8.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/kernel/v7.x/linux-7.1.8.tar.xz\", \"bytes\": 158434924, \"book_md5\": \"807584f564568b40162e9e4a72bf191f\", \"sha256\": \"ff01dcb449279d5b4cfccdb01fee639cf5ff1803f1749a77844dd33915422c49\"\
        }]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/kernel.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\ncd /sources\\\\ntar -xf linux-7.1.8.tar.xz\\\\ncd linux-7.1.8\\\\nmake mrproper\\\\nmake x86_64_defconfig\\\\nscripts/config --enable PSI\\\\nscripts/config --enable CGROUPS\\\\nscripts/config --enable MEMCG\\\\nscripts/config --enable CGROUP_SCHED\\\\nscripts/config --enable RELOCATABLE\\\\nscripts/config --enable RANDOMIZE_BASE\\\\nscripts/config --enable STACKPROTECTOR\\\\nscripts/config --enable STACKPROTECTOR_STRONG\\\\nscripts/config --enable\
        \ NET\\\\nscripts/config --enable INET\\\\nscripts/config --enable IPV6\\\\nscripts/config --enable DEVTMPFS\\\\nscripts/config --enable DEVTMPFS_MOUNT\\\\nscripts/config --enable DMIID\\\\nscripts/config --enable SYSFB_SIMPLEFB\\\\nscripts/config --enable TTY\\\\nscripts/config --enable DRM\\\\nscripts/config --enable DRM_PANIC\\\\nscripts/config --enable DRM_FBDEV_EMULATION\\\\nscripts/config --enable DRM_SIMPLEDRM\\\\nscripts/config --enable FRAMEBUFFER_CONSOLE\\\\nscripts/config --enable INOTIFY_USER\\\\nscripts/config --enable TMPFS\\\\nscripts/config --enable TMPFS_POSIX_ACL\\\\nscripts/config --enable X86_X2APIC\\\\nscripts/config --enable PCI\\\\nscripts/config --enable PCI_MSI\\\\nscripts/config --enable IOMMU_SUPPORT\\\\nscripts/config --enable IRQ_REMAP\\\\nscripts/config --enable BLK_DEV_NVME\\\\nscripts/config --enable EFI\\\\nscripts/config --enable EFI_STUB\\\\nscripts/config --enable EFI_PARTITION\\\\nscripts/config --enable VFAT_FS\\\\nscripts/config --enable EFIVAR_FS\\\
        \\nscripts/config --enable NLS_CODEPAGE_437\\\\nscripts/config --enable NLS_ISO8859_1\\\\nscripts/config --enable BLK_DEV_INITRD\\\\nscripts/config --enable RD_GZIP\\\\nscripts/config --enable RD_XZ\\\\nscripts/config --enable RD_ZSTD\\\\nscripts/config --enable SQUASHFS\\\\nscripts/config --enable SQUASHFS_XZ\\\\nscripts/config --enable SQUASHFS_ZSTD\\\\nscripts/config --enable OVERLAY_FS\\\\nscripts/config --enable EXT4_FS\\\\nscripts/config --enable EXT4_FS_POSIX_ACL\\\\nscripts/config --enable EXT4_FS_SECURITY\\\\nscripts/config --enable ISO9660_FS\\\\nscripts/config --enable JOLIET\\\\nscripts/config --enable UDF_FS\\\\nscripts/config --enable DEVTMPFS_SAFE\\\\nscripts/config --enable VIRTIO\\\\nscripts/config --enable VIRTIO_PCI\\\\nscripts/config --enable VIRTIO_BLK\\\\nscripts/config --enable VIRTIO_NET\\\\nscripts/config --enable VIRTIO_CONSOLE\\\\nscripts/config --enable VIRTIO_BALLOON\\\\nscripts/config --enable SCSI_VIRTIO\\\\nscripts/config --enable NET_9P\\\\nscripts/config\
        \ --enable NET_9P_VIRTIO\\\\nscripts/config --enable 9P_FS\\\\nscripts/config --enable 9P_FS_POSIX_ACL\\\\nscripts/config --enable DRM_VIRTIO_GPU\\\\nscripts/config --enable DRM_BOCHS\\\\nscripts/config --enable SERIAL_8250\\\\nscripts/config --enable SERIAL_8250_CONSOLE\\\\nscripts/config --enable UNIX\\\\nscripts/config --enable SCSI\\\\nscripts/config --enable BLK_DEV_SD\\\\nscripts/config --enable ATA\\\\nscripts/config --enable SATA_AHCI\\\\nscripts/config --enable USB_SUPPORT\\\\nscripts/config --enable USB\\\\nscripts/config --enable USB_XHCI_HCD\\\\nscripts/config --enable USB_EHCI_HCD\\\\nscripts/config --enable USB_OHCI_HCD\\\\nscripts/config --enable USB_STORAGE\\\\nscripts/config --enable HID_GENERIC\\\\nscripts/config --enable USB_HID\\\\nscripts/config --enable INPUT_EVDEV\\\\nscripts/config --enable INPUT_KEYBOARD\\\\nscripts/config --enable KEYBOARD_ATKBD\\\\nscripts/config --enable INPUT_MOUSE\\\\nscripts/config --enable MOUSE_PS2\\\\nscripts/config --enable UNIX98_PTYS\\\
        \\nscripts/config --disable WERROR\\\\nscripts/config --disable PSI_DEFAULT_DISABLED\\\\nscripts/config --disable IKHEADERS\\\\nscripts/config --disable RT_GROUP_SCHED\\\\nscripts/config --disable EXPERT\\\\nscripts/config --disable UEVENT_HELPER\\\\nscripts/config --disable FW_LOADER_USER_HELPER\\\\nscripts/config --disable LEGACY_TIOCSTI\\\\nscripts/config --disable DEBUG_INFO\\\\nscripts/config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT\\\\nscripts/config --disable DEBUG_INFO_BTF\\\\nscripts/config --set-str DRM_PANIC_SCREEN kmsg\\\\nscripts/config --set-str LOCALVERSION -nav1\\\\nscripts/config --disable LOCALVERSION_AUTO\\\\nscripts/config --enable DEBUG_INFO_NONE\\\\nmake olddefconfig\\\\npython3 - <<\\\\\\'CHECK_CONFIG\\\\\\'\\\\nfrom pathlib import Path\\\\n[\\\\\\'PSI\\\\\\', \\\\\\'CGROUPS\\\\\\', \\\\\\'MEMCG\\\\\\', \\\\\\'CGROUP_SCHED\\\\\\', \\\\\\'RELOCATABLE\\\\\\', \\\\\\'RANDOMIZE_BASE\\\\\\', \\\\\\'STACKPROTECTOR\\\\\\', \\\\\\'STACKPROTECTOR_STRONG\\\\\\',\
        \ \\\\\\'NET\\\\\\', \\\\\\'INET\\\\\\', \\\\\\'IPV6\\\\\\', \\\\\\'DEVTMPFS\\\\\\', \\\\\\'DEVTMPFS_MOUNT\\\\\\', \\\\\\'DMIID\\\\\\', \\\\\\'SYSFB_SIMPLEFB\\\\\\', \\\\\\'TTY\\\\\\', \\\\\\'DRM\\\\\\', \\\\\\'DRM_PANIC\\\\\\', \\\\\\'DRM_FBDEV_EMULATION\\\\\\', \\\\\\'DRM_SIMPLEDRM\\\\\\', \\\\\\'FRAMEBUFFER_CONSOLE\\\\\\', \\\\\\'INOTIFY_USER\\\\\\', \\\\\\'TMPFS\\\\\\', \\\\\\'TMPFS_POSIX_ACL\\\\\\', \\\\\\'X86_X2APIC\\\\\\', \\\\\\'PCI\\\\\\', \\\\\\'PCI_MSI\\\\\\', \\\\\\'IOMMU_SUPPORT\\\\\\', \\\\\\'IRQ_REMAP\\\\\\', \\\\\\'BLK_DEV_NVME\\\\\\', \\\\\\'EFI\\\\\\', \\\\\\'EFI_STUB\\\\\\', \\\\\\'EFI_PARTITION\\\\\\', \\\\\\'VFAT_FS\\\\\\', \\\\\\'EFIVAR_FS\\\\\\', \\\\\\'NLS_CODEPAGE_437\\\\\\', \\\\\\'NLS_ISO8859_1\\\\\\', \\\\\\'BLK_DEV_INITRD\\\\\\', \\\\\\'RD_GZIP\\\\\\', \\\\\\'RD_XZ\\\\\\', \\\\\\'RD_ZSTD\\\\\\', \\\\\\'SQUASHFS\\\\\\', \\\\\\'SQUASHFS_XZ\\\\\\', \\\\\\'SQUASHFS_ZSTD\\\\\\', \\\\\\'OVERLAY_FS\\\\\\', \\\\\\'EXT4_FS\\\\\\', \\\\\\'EXT4_FS_POSIX_ACL\\\\\\\
        ', \\\\\\'EXT4_FS_SECURITY\\\\\\', \\\\\\'ISO9660_FS\\\\\\', \\\\\\'JOLIET\\\\\\', \\\\\\'UDF_FS\\\\\\', \\\\\\'DEVTMPFS_SAFE\\\\\\', \\\\\\'VIRTIO\\\\\\', \\\\\\'VIRTIO_PCI\\\\\\', \\\\\\'VIRTIO_BLK\\\\\\', \\\\\\'VIRTIO_NET\\\\\\', \\\\\\'VIRTIO_CONSOLE\\\\\\', \\\\\\'VIRTIO_BALLOON\\\\\\', \\\\\\'SCSI_VIRTIO\\\\\\', \\\\\\'NET_9P\\\\\\', \\\\\\'NET_9P_VIRTIO\\\\\\', \\\\\\'9P_FS\\\\\\', \\\\\\'9P_FS_POSIX_ACL\\\\\\', \\\\\\'DRM_VIRTIO_GPU\\\\\\', \\\\\\'DRM_BOCHS\\\\\\', \\\\\\'SERIAL_8250\\\\\\', \\\\\\'SERIAL_8250_CONSOLE\\\\\\', \\\\\\'UNIX\\\\\\', \\\\\\'SCSI\\\\\\', \\\\\\'BLK_DEV_SD\\\\\\', \\\\\\'ATA\\\\\\', \\\\\\'SATA_AHCI\\\\\\', \\\\\\'USB_SUPPORT\\\\\\', \\\\\\'USB\\\\\\', \\\\\\'USB_XHCI_HCD\\\\\\', \\\\\\'USB_EHCI_HCD\\\\\\', \\\\\\'USB_OHCI_HCD\\\\\\', \\\\\\'USB_STORAGE\\\\\\', \\\\\\'HID_GENERIC\\\\\\', \\\\\\'USB_HID\\\\\\', \\\\\\'INPUT_EVDEV\\\\\\', \\\\\\'INPUT_KEYBOARD\\\\\\', \\\\\\'KEYBOARD_ATKBD\\\\\\', \\\\\\'INPUT_MOUSE\\\\\\', \\\\\\'MOUSE_PS2\\\\\\\
        ', \\\\\\'UNIX98_PTYS\\\\\\']\\\\nwanted=[\\\\\\'PSI\\\\\\', \\\\\\'CGROUPS\\\\\\', \\\\\\'MEMCG\\\\\\', \\\\\\'CGROUP_SCHED\\\\\\', \\\\\\'RELOCATABLE\\\\\\', \\\\\\'RANDOMIZE_BASE\\\\\\', \\\\\\'STACKPROTECTOR\\\\\\', \\\\\\'STACKPROTECTOR_STRONG\\\\\\', \\\\\\'NET\\\\\\', \\\\\\'INET\\\\\\', \\\\\\'IPV6\\\\\\', \\\\\\'DEVTMPFS\\\\\\', \\\\\\'DEVTMPFS_MOUNT\\\\\\', \\\\\\'DMIID\\\\\\', \\\\\\'SYSFB_SIMPLEFB\\\\\\', \\\\\\'TTY\\\\\\', \\\\\\'DRM\\\\\\', \\\\\\'DRM_PANIC\\\\\\', \\\\\\'DRM_FBDEV_EMULATION\\\\\\', \\\\\\'DRM_SIMPLEDRM\\\\\\', \\\\\\'FRAMEBUFFER_CONSOLE\\\\\\', \\\\\\'INOTIFY_USER\\\\\\', \\\\\\'TMPFS\\\\\\', \\\\\\'TMPFS_POSIX_ACL\\\\\\', \\\\\\'X86_X2APIC\\\\\\', \\\\\\'PCI\\\\\\', \\\\\\'PCI_MSI\\\\\\', \\\\\\'IOMMU_SUPPORT\\\\\\', \\\\\\'IRQ_REMAP\\\\\\', \\\\\\'BLK_DEV_NVME\\\\\\', \\\\\\'EFI\\\\\\', \\\\\\'EFI_STUB\\\\\\', \\\\\\'EFI_PARTITION\\\\\\', \\\\\\'VFAT_FS\\\\\\', \\\\\\'EFIVAR_FS\\\\\\', \\\\\\'NLS_CODEPAGE_437\\\\\\', \\\\\\'NLS_ISO8859_1\\\\\\',\
        \ \\\\\\'BLK_DEV_INITRD\\\\\\', \\\\\\'RD_GZIP\\\\\\', \\\\\\'RD_XZ\\\\\\', \\\\\\'RD_ZSTD\\\\\\', \\\\\\'SQUASHFS\\\\\\', \\\\\\'SQUASHFS_XZ\\\\\\', \\\\\\'SQUASHFS_ZSTD\\\\\\', \\\\\\'OVERLAY_FS\\\\\\', \\\\\\'EXT4_FS\\\\\\', \\\\\\'EXT4_FS_POSIX_ACL\\\\\\', \\\\\\'EXT4_FS_SECURITY\\\\\\', \\\\\\'ISO9660_FS\\\\\\', \\\\\\'JOLIET\\\\\\', \\\\\\'UDF_FS\\\\\\', \\\\\\'DEVTMPFS_SAFE\\\\\\', \\\\\\'VIRTIO\\\\\\', \\\\\\'VIRTIO_PCI\\\\\\', \\\\\\'VIRTIO_BLK\\\\\\', \\\\\\'VIRTIO_NET\\\\\\', \\\\\\'VIRTIO_CONSOLE\\\\\\', \\\\\\'VIRTIO_BALLOON\\\\\\', \\\\\\'SCSI_VIRTIO\\\\\\', \\\\\\'NET_9P\\\\\\', \\\\\\'NET_9P_VIRTIO\\\\\\', \\\\\\'9P_FS\\\\\\', \\\\\\'9P_FS_POSIX_ACL\\\\\\', \\\\\\'DRM_VIRTIO_GPU\\\\\\', \\\\\\'DRM_BOCHS\\\\\\', \\\\\\'SERIAL_8250\\\\\\', \\\\\\'SERIAL_8250_CONSOLE\\\\\\', \\\\\\'UNIX\\\\\\', \\\\\\'SCSI\\\\\\', \\\\\\'BLK_DEV_SD\\\\\\', \\\\\\'ATA\\\\\\', \\\\\\'SATA_AHCI\\\\\\', \\\\\\'USB_SUPPORT\\\\\\', \\\\\\'USB\\\\\\', \\\\\\'USB_XHCI_HCD\\\\\\', \\\\\\'USB_EHCI_HCD\\\
        \\\\', \\\\\\'USB_OHCI_HCD\\\\\\', \\\\\\'USB_STORAGE\\\\\\', \\\\\\'HID_GENERIC\\\\\\', \\\\\\'USB_HID\\\\\\', \\\\\\'INPUT_EVDEV\\\\\\', \\\\\\'INPUT_KEYBOARD\\\\\\', \\\\\\'KEYBOARD_ATKBD\\\\\\', \\\\\\'INPUT_MOUSE\\\\\\', \\\\\\'MOUSE_PS2\\\\\\', \\\\\\'UNIX98_PTYS\\\\\\']\\\\ncfg=Path(\\\\\\'.config\\\\\\').read_text().splitlines()\\\\nfor k in wanted:assert \\\\\\'CONFIG_\\\\\\'+k+\\\\\\'=y\\\\\\' in cfg,k\\\\nfor k in [\\\\\\'WERROR\\\\\\', \\\\\\'PSI_DEFAULT_DISABLED\\\\\\', \\\\\\'IKHEADERS\\\\\\', \\\\\\'RT_GROUP_SCHED\\\\\\', \\\\\\'EXPERT\\\\\\', \\\\\\'UEVENT_HELPER\\\\\\', \\\\\\'FW_LOADER_USER_HELPER\\\\\\', \\\\\\'LEGACY_TIOCSTI\\\\\\', \\\\\\'DEBUG_INFO\\\\\\', \\\\\\'DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT\\\\\\', \\\\\\'DEBUG_INFO_BTF\\\\\\']:assert \\\\\\'CONFIG_\\\\\\'+k+\\\\\\'=y\\\\\\' not in cfg,k\\\\nprint(\\\\\\'NAV_KERNEL_CONFIG_AUDIT_OK\\\\\\',len(wanted),\\\\\\'required builtin options\\\\\\')\\\\nCHECK_CONFIG\\\\nmake -j2\\\\nmake modules_install\\\\ninstall\
        \ -m644 arch/x86/boot/bzImage /boot/vmlinuz-7.1.8-nav1\\\\ninstall -m644 System.map /boot/System.map-7.1.8-nav1\\\\ninstall -m644 .config /boot/config-7.1.8-nav1\\\\nmkdir -p /nav-build-metadata/kernel\\\\ncp .config /nav-build-metadata/kernel/config\\\\nmake kernelrelease > /nav-build-metadata/kernel/release\\\\nreadelf -h vmlinux > /nav-build-metadata/kernel/elf-header\\\\nsha256sum /boot/vmlinuz-7.1.8-nav1 > /nav-build-metadata/kernel/sha256\\\\nfile /boot/vmlinuz-7.1.8-nav1\\\\nfile /boot/vmlinuz-7.1.8-nav1 | grep \\\\\\'7.1.8-nav1\\\\\\'\\\\ntest \"$(cat /nav-build-metadata/kernel/release)\" = 7.1.8-nav1\\\\ntest -d /usr/lib/modules/7.1.8-nav1\\\\ndepmod -a 7.1.8-nav1\\\\nprintf \\\\\\'NAV_KERNEL_COMPILE_INSTALL_OK\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf linux-7.1.8\\\\nprintf \\\\\\'Kernel7.1.8-nav1 compiled from pinned source, config audit and install passed. NOT boot-tested yet.\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_KERNEL_STAGE_COMPLETE\\\\n\\\\\
        \\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root\
        \ TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/kernel.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/kernel.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n\
        \  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_KERNEL','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve compiled kernel checkpoint not boot tested
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-kernel-v1
