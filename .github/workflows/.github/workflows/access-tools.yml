name: NAV LFS access libraries and user tools tested stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  access-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-math-v1
        fail-on-cache-miss: true
    - name: Build access libraries Shadow and Gawk with audited tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"attr-2.6.0.tar.gz\", \"url\": \"https://download.savannah.gnu.org/releases/attr/attr-2.6.0.tar.gz\", \"bytes\": 506247, \"book_md5\": \"910a09c3ae0a211569d180586371cf7e\", \"sha256\": \"d42fa374513180bb48cb11a46696f488240e5124ff1e6ad88b0abff706985612\"\
        }, {\"filename\": \"acl-2.4.0.tar.xz\", \"url\": \"https://download.savannah.gnu.org/releases/acl/acl-2.4.0.tar.xz\", \"bytes\": 384828, \"book_md5\": \"e289f370161698a96f50b2a3fdadf411\", \"sha256\": \"e661131456d2708a01c614a0f400e11d7d1bfaeb6f3e74b75bb980b72f0161a3\"}, {\"filename\": \"libcap-2.78.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.78.tar.xz\", \"bytes\": 201040, \"book_md5\": \"0ff11419aa4813c0a0f84fe67bf3b39e\", \"sha256\": \"0d621e562fd932ccf67b9660fb018e468a683d7b827541df27813228c996bb11\"}, {\"filename\": \"libxcrypt-4.5.2.tar.xz\", \"url\": \"https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz\", \"bytes\": 669820, \"book_md5\": \"25e888919ddcd153a07daa95224fa436\", \"sha256\": \"71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071\"}, {\"filename\": \"shadow-4.20.2.tar.xz\", \"url\": \"https://github.com/shadow-maint/shadow/releases/download/4.20.2/shadow-4.20.2.tar.xz\"\
        , \"bytes\": 2291052, \"book_md5\": \"f52e717bd330818c67bd57c897ec5a8e\", \"sha256\": \"b89f432b75ae55a2d852b446d0365484795fdf533ab97d550e325fa15594a224\"}, {\"filename\": \"gawk-5.4.1.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/gawk/gawk-5.4.1.tar.xz\", \"bytes\": 3838416, \"book_md5\": \"d379c2110e7a3e15347dd5559a41ad64\", \"sha256\": \"07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/access-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests\\\
        \\nrun_test(){ local name=\"$1\";shift; \"$@\" 2>&1 | tee \"/nav-build-metadata/tests/$name.log\"; printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"; }\\\\ncd /sources\\\\ntar -xf attr-2.6.0.tar.gz\\\\ncd attr-2.6.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE attr-2.6.0\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr     \\\\\\\\\\\\n            --disable-static  \\\\\\\\\\\\n            --sysconfdir=/etc \\\\\\\\\\\\n            --docdir=/usr/share/doc/attr-2.6.0\\\\nmake\\\\nrun_test attr make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE attr-2.6.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- attr-2.6.0\\\\ncd /sources\\\\ntar -xf acl-2.4.0.tar.xz\\\\ncd acl-2.4.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE acl-2.4.0\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/acl-2.4.0\\\\nmake\\\\nset +e\\\\nmake check > /nav-build-metadata/tests/acl.log 2>&1\\\\ncheck_rc=$?\\\\nset\
        \ -e\\\\ncat /nav-build-metadata/tests/acl.log\\\\npython3 - \"$check_rc\" <<\\\\\\'ACL_AUDIT\\\\\\'\\\\nimport pathlib,re,sys\\\\ntext=pathlib.Path(\\\\\\'/nav-build-metadata/tests/acl.log\\\\\\').read_text()\\\\nfail=re.findall(r\\\\\\'^FAIL: (.+)$\\\\\\',text,re.M)\\\\nassert all(x==\\\\\\'test/cp.run\\\\\\' for x in fail),(\\\\\\'unexpected ACL failures\\\\\\',fail)\\\\nassert not re.findall(r\\\\\\'^(?:XPASS|ERROR): (.+)$\\\\\\',text,re.M),(\\\\\\'ACL errors\\\\\\',text[-4000:])\\\\nassert sum(map(int,re.findall(r\\\\\\'# PASS:\\\\\\\\s+(\\\\\\\\d+)\\\\\\',text)))>0,\\\\\\'ACL suite incomplete\\\\\\'\\\\nassert int(sys.argv[1])==0 or (int(sys.argv[1])==2 and fail==[\\\\\\'test/cp.run\\\\\\']),(\\\\\\'ACL status\\\\\\',sys.argv[1],fail)\\\\nprint(\\\\\\'NAV_ACL_AUDITED\\\\\\',{\\\\\\'known_cp_failure\\\\\\':bool(fail)},flush=True)\\\\nACL_AUDIT\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE acl-2.4.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- acl-2.4.0\\\\ncd /sources\\\
        \\ntar -xf libcap-2.78.tar.xz\\\\ncd libcap-2.78\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE libcap-2.78\\\\\\\\n\\\\\\'\\\\nsed -i \\\\\\'/install -m.*STA/d\\\\\\' libcap/Makefile\\\\nmake prefix=/usr lib=lib\\\\nrun_test libcap make test\\\\nmake prefix=/usr lib=lib install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE libcap-2.78\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- libcap-2.78\\\\ncd /sources\\\\ntar -xf libxcrypt-4.5.2.tar.xz\\\\ncd libxcrypt-4.5.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE libxcrypt-4.5.2\\\\\\\\n\\\\\\'\\\\nsed -i \\\\\\'/strchr/s/const//\\\\\\' lib/crypt-{sm3,gost}-yescrypt.c\\\\n./configure --prefix=/usr                \\\\\\\\\\\\n            --enable-hashes=strong,glibc \\\\\\\\\\\\n            --enable-obsolete-api=no     \\\\\\\\\\\\n            --disable-static             \\\\\\\\\\\\n            --disable-failure-tokens\\\\nmake\\\\nrun_test libxcrypt make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE libxcrypt-4.5.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\
        \\nrm -rf -- libxcrypt-4.5.2\\\\ncd /sources\\\\ntar -xf shadow-4.20.2.tar.xz\\\\ncd shadow-4.20.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE shadow-4.20.2\\\\\\\\n\\\\\\'\\\\nfind man -name Makefile.in -exec sed -i \\\\\\'s/getspnam\\\\\\\\.3 / /\\\\\\' {} \\\\\\\\;\\\\nfind man -name Makefile.in -exec sed -i \\\\\\'s/passwd\\\\\\\\.5 / /\\\\\\'   {} \\\\\\\\;\\\\nsed -e \\\\\\'s:#ENCRYPT_METHOD SHA512:ENCRYPT_METHOD YESCRYPT:\\\\\\' \\\\\\\\\\\\n    -e \\\\\\'s:/var/spool/mail:/var/mail:\\\\\\'                      \\\\\\\\\\\\n    -e \\\\\\'/PATH=/{s@/sbin:@@;s@/bin:@@}\\\\\\'                     \\\\\\\\\\\\n    -i etc/login.defs\\\\ntouch /usr/bin/passwd\\\\n./configure --sysconfdir=/etc   \\\\\\\\\\\\n            --disable-static    \\\\\\\\\\\\n            --with-{b,yes}crypt \\\\\\\\\\\\n            --without-libbsd    \\\\\\\\\\\\n            --disable-logind    \\\\\\\\\\\\n            --with-group-name-max-length=32\\\\nmake\\\\nmake exec_prefix=/usr install\\\\nmake -C man\
        \ install-man\\\\npwconv\\\\ngrpconv\\\\nmkdir -p /etc/default\\\\nuseradd -D --gid 999\\\\ntouch /etc/sub{u,g}id\\\\npasswd -l root\\\\nprintf \\\\\\'NAV_SHADOW_NO_UPSTREAM_SUITE_ROOT_LOCKED\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE shadow-4.20.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- shadow-4.20.2\\\\ncd /sources\\\\ntar -xf gawk-5.4.1.tar.xz\\\\ncd gawk-5.4.1\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE gawk-5.4.1\\\\\\\\n\\\\\\'\\\\nsed -i \\\\\\'s/extras//\\\\\\' Makefile.in\\\\n./configure --prefix=/usr\\\\nmake\\\\nchown -R tester .\\\\nrun_test gawk su tester -c \\\\\\'set -eu; PATH=/usr/bin:/usr/sbin make check\\\\\\' \\\\nrm -f /usr/bin/gawk-5.4.1\\\\nmake install\\\\nln -sv gawk.1 /usr/share/man/man1/awk.1\\\\ninstall -vDm644 doc/{awkforai.txt,*.{eps,pdf,jpg}} -t /usr/share/doc/gawk-5.4.1\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gawk-5.4.1\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- gawk-5.4.1\\\\nldconfig\\\\nprintf 42 > /tmp/nav-access-probe\\\\nsetfattr -n\
        \ user.nav -v source-built /tmp/nav-access-probe\\\\ntest \"$(getfattr --only-values -n user.nav /tmp/nav-access-probe)\" = source-built\\\\nsetfacl -m u:tester:r /tmp/nav-access-probe\\\\ngetfacl -cp /tmp/nav-access-probe | grep -qx \\\\\\'user:tester:r--\\\\\\'\\\\nsetcap cap_net_bind_service=ep /tmp/nav-access-probe\\\\ngetcap /tmp/nav-access-probe | grep -q cap_net_bind_service=ep\\\\nsetcap -r /tmp/nav-access-probe\\\\nrm /tmp/nav-access-probe\\\\ntest \"$(printf \\\\\\'19 23\\\\\\\\n\\\\\\' | gawk \\\\\\'{print $1+$2}\\\\\\')\" = 42\\\\npython3 - <<\\\\\\'SHADOW_AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nroot=next(x.split(\\\\\\':\\\\\\') for x in Path(\\\\\\'/etc/shadow\\\\\\').read_text().splitlines() if x.startswith(\\\\\\'root:\\\\\\'))\\\\nassert root[1].startswith((\\\\\\'!\\\\\\',\\\\\\'*\\\\\\')),\\\\\\'root must remain locked\\\\\\'\\\\nassert \\\\\\'ENCRYPT_METHOD YESCRYPT\\\\\\' in Path(\\\\\\'/etc/login.defs\\\\\\').read_text()\\\\nassert Path(\\\\\\'/etc/subuid\\\
        \\\\').exists() and Path(\\\\\\'/etc/subgid\\\\\\').exists()\\\\nprint(\\\\\\'NAV_SHADOW_CONFIGURATION_OK\\\\\\',flush=True)\\\\nSHADOW_AUDIT\\\\nprintf \\\\\\'NAV_ACCESS_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 access libraries, Shadow and Gawk installed. Package suites audited; Shadow has no upstream suite. No boot or desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_ACCESS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777\
        \ \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/access-tools.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next\
        \ native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/access-tools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 3072\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except\
        \ subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_ACL','NAV_SHADOW','NAV_ACCESS','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested access libraries and tools checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-access-tools-v1
