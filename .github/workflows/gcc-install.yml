name: NAV final GCC install from three audited suites
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  gcc-final-install:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'sudo mkdir -p /mnt/nav-gcc-checkpoint /mnt/nav-audits/{c,cxx,runtime}

        sudo chown -R "$(id -u):$(id -g)" /mnt/nav-gcc-checkpoint /mnt/nav-audits

        '
    - name: Restore immutable build-only archive
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-gcc-checkpoint
        key: nav-lfs13.1-x86_64-gcc-build-tree-v1
        fail-on-cache-miss: true
    - name: Restore audited c evidence
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-gcc-report
        key: nav-lfs13.1-x86_64-gcc-test-c-v1
        fail-on-cache-miss: true
    - name: Stage c audit
      shell: bash
      run: 'sudo cp -a /mnt/nav-gcc-report/. /mnt/nav-audits/c/

        rm -rf /mnt/nav-gcc-report

        '
    - name: Restore audited cxx evidence
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-gcc-report
        key: nav-lfs13.1-x86_64-gcc-test-cxx-v1
        fail-on-cache-miss: true
    - name: Stage cxx audit
      shell: bash
      run: 'sudo cp -a /mnt/nav-gcc-report/. /mnt/nav-audits/cxx/

        rm -rf /mnt/nav-gcc-report

        '
    - name: Restore audited runtime evidence
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-gcc-report
        key: nav-lfs13.1-x86_64-gcc-test-runtime-v1
        fail-on-cache-miss: true
    - name: Stage runtime audit
      shell: bash
      run: 'sudo cp -a /mnt/nav-gcc-report/. /mnt/nav-audits/runtime/

        rm -rf /mnt/nav-gcc-report

        '
    - name: Verify all audits install and prove final compiler
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nos.environ[\"NAV_GCC_TEST_GROUP\"]=\"runtime\"\nassert os.environ[\"NAV_GCC_TEST_GROUP\"] in (\"c\",\"cxx\",\"runtime\")\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\npython3 - <<\\'ARCHIVE_VERIFY\\'\\nimport pathlib,json,hashlib\\np=pathlib.Path(\\'/mnt/nav-gcc-checkpoint\\');m=json.loads((p/\\'manifest.json\\').read_text());h=hashlib.sha256()\\nwith (p/\\'root.tar.zst\\').open(\\'rb\\') as f:\\n for b in iter(lambda:f.read(8*1024**2),b\\'\\'):h.update(b)\\nassert m[\\'sha256\\']==h.hexdigest() and m[\\'bytes\\']==(p/\\'root.tar.zst\\').stat().st_size\\nprint(\\'NAV_GCC_TEST_ARCHIVE_SHA256_OK\\\
        ',h.hexdigest(),flush=True)\\nARCHIVE_VERIFY\\npython3 - <<\\'ALL_AUDITS\\'\\nimport pathlib,json\\nbase=pathlib.Path(\\'/mnt/nav-gcc-checkpoint\\');m=json.loads((base/\\'manifest.json\\').read_text())\\nassert m[\\'sha256\\']==\\'78af1874f9b7dd7e9ea6d99d4e67a3fde38873dd920aaaaec7a3b308eae9f814\\'\\nminimums={\\'c\\':{\\'gcc\\':190000},\\'cxx\\':{\\'g++\\':240000},\\'runtime\\':{\\'libstdc++\\':16000,\\'libgomp\\':5000,\\'libatomic\\':50,\\'libitm\\':40}}\\nfor group,mins in minimums.items():\\n d=pathlib.Path(\\'/mnt/nav-audits\\')/group\\n assert json.loads((d/\\'build-manifest.json\\').read_text())==m,(\\'different compiler tree\\',group)\\n a=json.loads((d/\\'gcc-audit.json\\').read_text());assert a[\\'unexpected_results\\']==[]\\n # Older C audit predates explicit sanitizer field, but has same source tree.\\n assert a[\\'group\\']==group\\n for name,n in mins.items():assert a[\\'counts\\'][name][\\'expected passes\\']>=n and a[\\'counts\\'][name][\\'unresolved testcases\\']==0\\\
        n assert len(a[\\'known_results\\'])<160\\n env=a.get(\\'tsan_environment_unsupported\\',[])\\n if env:\\n  assert group==\\'cxx\\' and len(env)==2\\n  for opt in [\\'-O0\\',\\'-O2\\']:\\n   e=[x for x in env if opt in x[\\'test\\']];assert len(e)==1\\n   assert e[0][\\'test\\'].split()[1]==\\'g++.dg/tsan/pthread_cond_clockwait.C\\'\\n   assert all(s in e[0][\\'runtime\\'] for s in [\"WARNING: Program is run with limited virtual address space, which wouldn\\'t work with ThreadSanitizer.\",\\'Re-execing with unlimited virtual address space.\\',\\'ERROR: ThreadSanitizer setrlimit() failed 22\\'])\\n print(\\'NAV_GCC_ALL_GROUP_GATE_OK\\',group,json.dumps(a[\\'counts\\'],sort_keys=True),flush=True)\\nprint(\\'NAV_GCC_SANITIZER_CAVEAT ASan and TSAN not certified: environment-unsupported under4GiB address-space cap\\',flush=True)\\nALL_AUDITS\\nsudo mkdir -p \"$LFS\"\\nzstd -dc /mnt/nav-gcc-checkpoint/root.tar.zst | sudo tar --numeric-owner --same-owner -C \"$LFS\" -xf -\\nsudo python3\
        \ - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-gcc.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests\\\\nstat -c \\\\\\'NAV_GCC_TMP_BEFORE %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\nchmod 1777 /tmp /var/tmp\\\\nstat -c \\\\\\'NAV_GCC_TMP_AFTER %a %u:%g %n\\\\\\' /tmp /var/tmp\\\\ncat > /tmp/nav-nonroot-preflight.sh <<\\\\\\'NONROOT\\\\\\'\\\\nset -euo pipefail\\\\nd=$(mktemp -d)\\\\ntrap \\\\\\'rm -rf \"$d\"\\\\\\' EXIT\\\\nmkfifo \"$d/fifo\"\\\\nprintf \\\\\\'int main(){return 0;}\\\\\\\\n\\\\\\' > \"$d/probe.c\"\\\\ngcc \"$d/probe.c\" -o \"$d/probe\"\\\\n\"$d/probe\"\\\\nprintf \\\\\\'NAV_GCC_NONROOT_TMP_FIFO_COMPILE_RUN_OK\\\\\\\\n\\\\\\'\\\\nNONROOT\\\\nsu tester -c \\\\\\'bash /tmp/nav-nonroot-preflight.sh\\\\\\'\\\\nrm /tmp/nav-nonroot-preflight.sh\\\\n\\\\nsu tester -c \\\\\\'set -eu; python3 -c \"import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\"\\\\\\'\\\\ncat > /tmp/nav-expect-preflight.exp\
        \ <<\\\\\\'EXPECT\\\\\\'\\\\nset timeout 10\\\\nspawn /usr/bin/echo NAV_EXPECT_NONROOT_OK\\\\nexpect {\\\\n NAV_EXPECT_NONROOT_OK {exit 0}\\\\n timeout {exit 1}\\\\n eof {exit 2}\\\\n}\\\\nEXPECT\\\\nsu tester -c \\\\\\'set -eu; expect /tmp/nav-expect-preflight.exp\\\\\\'\\\\nrm /tmp/nav-expect-preflight.exp\\\\nprintf \\\\\\'NAV_GCC_NONROOT_PTY_PREFLIGHT_OK\\\\\\\\n\\\\\\'\\\\ncd /sources/gcc-16.2.0/build\\\\nmake install\\\\nchown -v -R root:root $(gcc -print-file-name=include){,-fixed}\\\\nln -svr /usr/bin/cpp /usr/lib\\\\nln -sv gcc.1 /usr/share/man/man1/cc.1\\\\nln -sfvr $(gcc -print-prog-name=liblto_plugin.so) /usr/lib/bfd-plugins/\\\\nprintf \\\\\\'int main(){}\\\\\\\\n\\\\\\' | cc -x c - -v -Wl,--verbose > /nav-build-metadata/tests/gcc-link-sanity.log 2>&1\\\\nreadelf -l a.out | tee /nav-build-metadata/tests/gcc-elf.txt\\\\ngrep -q \\\\\\'/lib64/ld-linux-x86-64.so.2\\\\\\' /nav-build-metadata/tests/gcc-elf.txt\\\\n./a.out\\\\npython3 - <<\\\\\\'GCC_LINK_AUDIT\\\\\\'\\\\nfrom\
        \ pathlib import Path\\\\nimport re\\\\ntext=Path(\\\\\\'/nav-build-metadata/tests/gcc-link-sanity.log\\\\\\').read_text()\\\\nfor name in [\\\\\\'Scrt1.o\\\\\\',\\\\\\'crti.o\\\\\\',\\\\\\'crtn.o\\\\\\']:\\\\n assert any(\\\\\\'/usr/lib/\\\\\\' in x and name+\\\\\\' succeeded\\\\\\' in x for x in text.splitlines()),(\\\\\\'start file\\\\\\',name)\\\\nassert re.search(r\\\\\\'^ /usr/include$\\\\\\',text,re.M),\\\\\\'headers\\\\\\'\\\\nassert \\\\\\'/usr/lib/libc.so.6 succeeded\\\\\\' in text,\\\\\\'libc\\\\\\'\\\\nassert \\\\\\'found ld-linux-x86-64.so.2 at /usr/lib/ld-linux-x86-64.so.2\\\\\\' in text,\\\\\\'loader\\\\\\'\\\\nassert \\\\\\'SEARCH_DIR(\"/usr/lib\")\\\\\\' in text,\\\\\\'linker paths\\\\\\'\\\\nassert \\\\\\'/tools/\\\\\\' not in text,\\\\\\'temporary toolchain contamination\\\\\\'\\\\nprint(\\\\\\'NAV_GCC_LINK_SANITY_OK\\\\\\',flush=True)\\\\nGCC_LINK_AUDIT\\\\nrm a.out\\\\nmkdir -pv /usr/share/gdb/auto-load/usr/lib\\\\nmv -v /usr/lib/*gdb.py /usr/share/gdb/auto-load/usr/lib\\\
        \\nldconfig\\\\ncat > /tmp/nav-gcc.cc <<\\\\\\'CPP\\\\\\'\\\\n#include <gmpxx.h>\\\\n#include <thread>\\\\n#include <iostream>\\\\nint main(){int x=0;std::thread t([&]{try{throw 19;}catch(int n){x=n;}});t.join();mpz_class n=x;n+=23;std::cout<<n<<std::endl;}\\\\nCPP\\\\ng++ -std=c++20 -O2 -flto -pthread /tmp/nav-gcc.cc -lgmpxx -lgmp -o /tmp/nav-gcc\\\\ntest \"$(/tmp/nav-gcc)\" = 42\\\\nreadelf -h /tmp/nav-gcc | grep -q \\\\\\'DYN (Position-Independent Executable file)\\\\\\'\\\\nrm /tmp/nav-gcc /tmp/nav-gcc.cc\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE gcc-16.2.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf gcc-16.2.0\\\\nprintf \\\\\\'NAV_FINAL_GCC_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'LFS13.1 final GCC16.2.0 built and all three default-check partitions audited. ASan and exact two TSAN execution cases environment-unsupported under retained virtual-memory cap. Base incomplete; no boot/desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_FINAL_GCC_STAGE_COMPLETE\\\
        \\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo mkdir -p \"$LFS/nav-build-metadata/tests/gcc-groups\"\\nfor group in c cxx runtime; do\\n sudo cp -a \"/mnt/nav-audits/$group\" \"$LFS/nav-build-metadata/tests/gcc-groups/$group\"\\ndone\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" NAV_GCC_TEST_GROUP=\"$NAV_GCC_TEST_GROUP\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\n# The host uses /dev/ptmx -> pts/ptmx. A fresh devpts node defaults to\\n# mode0000; prove the old non-root behavior, then use the kernel-doc option.\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\nset +e\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/python3 -c \\'import os,pty; a,b=pty.openpty(); os.close(a); os.close(b)\\'\\nold_pty_rc=$?\\nset -e\\nprintf \\'NAV_GCC_ORIGINAL_PTY_STATUS %s\\\\n\\' \"$old_pty_rc\"\\\
        nmount -o remount,gid=5,mode=0620,ptmxmode=0666 \"$LFS/dev/pts\"\\nls -ld \"$LFS/dev/ptmx\" \"$LFS/dev/pts/ptmx\"\\n\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX NAV_GCC_TEST_GROUP=\"$NAV_GCC_TEST_GROUP\" /bin/bash --noprofile --norc /sources/final-gcc.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin\
        \ /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Root-owned tree is cached as the next tested base. Ownership restored on use.\\nsudo rm -f \"$LFS/sources/final-gcc.sh\"\\nsudo du -sh \"$LFS\"\\ntest \"$(sudo du -sm \"$LFS\" | cut -f1)\" -lt 3584\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\nprintf \\'NAV_FINAL_GCC_TESTED_ROOT_CHECKPOINT_READY\\\\n\\'\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n root=pathlib.Path('/mnt/nav-lfs/sources/gcc-16.2.0/build')\n for f in root.rglob('*.sum'):\n  lines=f.read_text(errors='replace').splitlines()\n  print('NAV_GCC_SUMMARY_TAIL',str(f),'\\n'.join(lines[-12:]),flush=True)\n check=pathlib.Path('/mnt/nav-lfs/nav-build-metadata/tests/gcc-check.log')\n if check.exists():\n  with check.open('rb') as f:\n   f.seek(0,2);f.seek(max(0,f.tell()-12000));print('NAV_GCC_LIVE_LOG_TAIL',f.read().decode(errors='replace'),flush=True)\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_GCC','NAV_FINAL_GCC','NAV_TESTER'])))\n\
        NAV_GUARD\n"
    - name: Cache final installed tested compiler root
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-gcc-v1
