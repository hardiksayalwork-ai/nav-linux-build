name: NAV KDE core libraries source native configured tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  kf6-core:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-kf6-foundation-v1
        fail-on-cache-miss: true
    - name: Build Plasma protocols and KF6 core native configured tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"name\": \"plasma-wayland-protocols\", \"filename\": \"plasma-wayland-protocols-1.21.0.tar.xz\", \"url\": \"https://download.kde.org/stable/plasma-wayland-protocols/plasma-wayland-protocols-1.21.0.tar.xz\", \"bytes\": 49704, \"sha256\": \"698a7b28b711270314e396e248ae86087cfeaed01372009063995be6e1dc85ba\"}, {\"name\": \"kcoreaddons\", \"filename\": \"kcoreaddons-6.29.0.tar.xz\", \"url\": \"https://download.kde.org/stable/frameworks/6.29/kcoreaddons-6.29.0.tar.xz\", \"bytes\": 2524816, \"sha256\": \"771f7fee754a356fa284d0ad7b8b159b890cbbfac082e49ce441b43d4943027e\"}, {\"name\": \"kdbusaddons\", \"filename\": \"kdbusaddons-6.29.0.tar.xz\", \"url\": \"https://download.kde.org/stable/frameworks/6.29/kdbusaddons-6.29.0.tar.xz\", \"bytes\": 46816, \"sha256\": \"a3d2de669bfad5de3f86cc8c6448a02f7567e4ad04aa6099ccfaa2df5f07e8f8\"}, {\"name\": \"kwidgetsaddons\", \"filename\": \"kwidgetsaddons-6.29.0.tar.xz\", \"url\": \"https://download.kde.org/stable/frameworks/6.29/kwidgetsaddons-6.29.0.tar.xz\", \"bytes\": 4229840, \"sha256\": \"76285d03cdc06f0647afbbc89f31ab5aa766cbc3c6eb177e3f8a0441444e3068\"}, {\"name\": \"kguiaddons\", \"filename\": \"kguiaddons-6.29.0.tar.xz\", \"url\": \"https://download.kde.org/stable/frameworks/6.29/kguiaddons-6.29.0.tar.xz\", \"bytes\": 97096, \"sha256\": \"6d0c4a4ddc7d4833ae537b1bf146896beba76135ec4b8bcf2a9525e33e39b3a4\"}, {\"name\": \"kitemviews\", \"filename\": \"kitemviews-6.29.0.tar.xz\", \"url\": \"https://download.kde.org/stable/frameworks/6.29/kitemviews-6.29.0.tar.xz\", \"bytes\": 2185124, \"sha256\": \"9e6355cf1264756d3b38254181e46e3103e531f0f1613ae1c158d4f9e541576e\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/kf6-core.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 CMAKE_BUILD_PARALLEL_LEVEL=2 CTEST_PARALLEL_LEVEL=2 LC_ALL=POSIX PATH=/opt/qt6/bin:/usr/bin:/usr/sbin\\\\nexport CMAKE_PREFIX_PATH=/opt/qt6:/usr\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/kf6\\\\nXvfb :98 -screen 0 1024x768x24 -nolisten tcp -ac > /nav-build-metadata/tests/kf6-xvfb.log 2>&1 &\\\\nxv=$!\\\\ntrap \\\\\\'kill \"$xv\" 2>/dev/null || true\\\\\\' EXIT\\\\nfor n in $(seq 1 100); do test -S /tmp/.X11-unix/X98 && break; sleep .1; done\\\\ntest -S /tmp/.X11-unix/X98\\\\ninstall -d -m 0700 -o tester -g tester /tmp/nav-kf6-runtime\\\\nfor module in plasma-wayland-protocols kcoreaddons kdbusaddons kwidgetsaddons kguiaddons kitemviews; do\\\\n cd /sources\\\\n version=6.29.0\\\\n if [ \"$module\" = plasma-wayland-protocols ]; then version=1.21.0; fi\\\\n tar -xf \"$module-$version.tar.xz\"\\\\n cd \"$module-$version\"\\\\n cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_WITH_QT6=ON -DBUILD_QCH=OFF -DBUILD_DOC=OFF -DKDE_INSTALL_USE_QT_SYS_PATHS=OFF\\\\n cmake --build build --parallel 2\\\\n cmake --install build\\\\n ldconfig\\\\n cd build\\\\n ctest --show-only=json-v1 > \"/nav-build-metadata/kf6/$module-manifest.json\"\\\\n chown -R tester ..\\\\n set +e\\\\n su tester -c \"dbus-run-session -- env -u LC_ALL -u LANGUAGE LANG=C.UTF-8 PATH=/opt/qt6/bin:/usr/bin:/usr/sbin DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-kf6-runtime LIBGL_ALWAYS_SOFTWARE=1 QT_FORCE_STDERR_LOGGING=1 TZ=UTC CMAKE_BUILD_PARALLEL_LEVEL=2 CTEST_PARALLEL_LEVEL=2 CMAKE_PREFIX_PATH=/opt/qt6:/usr ctest -C Release --test-output-size-passed 10485760 --test-output-size-failed 10485760 --parallel 2 --output-on-failure --timeout 240 --no-tests=error --output-junit /tmp/nav-$module.xml\" > \"/nav-build-metadata/tests/$module.log\" 2>&1\\\\n rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$module.log\"\\\\n MODULE=\"$module\" python3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport os,json,xml.etree.ElementTree as E,base64,re\\\\nn=os.environ[\\\\\\'MODULE\\\\\\'];log=Path(\\\\\\'/nav-build-metadata/tests/\\\\\\'+n+\\\\\\'.log\\\\\\').read_bytes()\\\\nfor i in range(0,len(log),3000):print(\\\\\\'NAV_KF6_CTEST_LOG_B64\\\\\\',n,base64.b64encode(log[i:i+3000]).decode(),flush=True)\\\\nroot=E.parse(\\\\\\'/tmp/nav-\\\\\\'+n+\\\\\\'.xml\\\\\\').getroot();c=root.findall(\\\\\\'.//testcase\\\\\\');assert c\\\\nm=json.loads(Path(\\\\\\'/nav-build-metadata/kf6/\\\\\\'+n+\\\\\\'-manifest.json\\\\\\').read_text())[\\\\\\'tests\\\\\\'];assert len(c)==len(m),(len(c),len(m))\\\\nf=[x for x in c if x.find(\\\\\\'failure\\\\\\')is not None or x.find(\\\\\\'error\\\\\\')is not None];s=[x for x in c if x.find(\\\\\\'skipped\\\\\\')is not None]\\\\nprint(\\\\\\'NAV_KF6_CONFIGURED_TEST_AUDIT\\\\\\',n,len(c),\\\\\\'tests\\\\\\',len(f),\\\\\\'failed\\\\\\',len(s),\\\\\\'skipped\\\\\\',flush=True)\\\\nassert not f and not s\\\\n# Audit embedded QtTest totals, including skipped cases, without injecting QtTest arguments into other frameworks.\\\\nfor x in c:\\\\n text=x.findtext(\\\\\\'system-out\\\\\\',\\\\\\'\\\\\\')\\\\n for line in text.splitlines():\\\\n  if any(k in line for k in [\\\\\\'Totals:\\\\\\',\\\\\\'SKIP\\\\\\',\\\\\\'FAIL!\\\\\\',\\\\\\'XFAIL\\\\\\']):print(\\\\\\'NAV_KF6_TEST_DETAIL\\\\\\',n,x.attrib.get(\\\\\\'name\\\\\\'),line,flush=True)\\\\n  match=re.search(r\\\\\\'Totals: (\\\\\\\\d+) passed, (\\\\\\\\d+) failed, (\\\\\\\\d+) skipped\\\\\\',line)\\\\n  if match:assert int(match[2])==0 and int(match[3])==0,(n,x.attrib.get(\\\\\\'name\\\\\\'),line)\\\\nPath(\\\\\\'/nav-build-metadata/tests/\\\\\\'+n+\\\\\\'.xml\\\\\\').write_bytes(Path(\\\\\\'/tmp/nav-\\\\\\'+n+\\\\\\'.xml\\\\\\').read_bytes())\\\\nAUDIT\\\\n test \"$rc\" = 0\\\\n printf \\\\\\'NAV_KF6_TESTED_INSTALLED %s\\\\\\\\n\\\\\\' \"$module\"\\\\n cd /sources\\\\n rm -rf \"$module-$version\"\\\\ndone\\\\ntest -f /usr/share/ECM/cmake/ECMConfig.cmake\\\\ntest -f /usr/share/cmake/PlasmaWaylandProtocols/PlasmaWaylandProtocolsConfig.cmake\\\\nfor lib in CoreAddons DBusAddons WidgetsAddons GuiAddons ItemViews; do test -f \"/usr/lib/libKF6$lib.so\"; done\\\\nprintf \\\\\\'KF6 core stage source-built and all configured CTest suites audited. Earlier QtQuick native glass is technical proof not system compositor integration or HP GPU measurement. Valgrind4fails separate unresolved. Full desktop and ISO unfinished.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_KF6_CORE_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/kf6-core.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/kf6-core.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER','NAV_KF6','Totals:','FAIL!','SKIP','platform plugin','could not connect'])))\nNAV_GUARD\n"
    - name: Preserve tested KDE core libraries
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-kf6-core-v1
