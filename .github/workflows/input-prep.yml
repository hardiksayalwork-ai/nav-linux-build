name: NAV input prerequisites and display evidence audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  input-prep:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-display-v1
        fail-on-cache-miss: true
    - name: Audit display and build input prerequisites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"mtdev-1.1.7.tar.bz2\", \"url\": \"https://bitmath.org/code/mtdev/mtdev-1.1.7.tar.bz2\", \"bytes\": 301994, \"book_md5\": \"483ed7fdf7c1e7b7375c05a62848cce7\", \"sha256\": \"a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e\"\
        }, {\"filename\": \"libunwind-1.8.3.tar.gz\", \"url\": \"https://github.com/libunwind/libunwind/releases/download/v1.8.3/libunwind-1.8.3.tar.gz\", \"bytes\": 981017, \"book_md5\": \"13bc7b41462ac6ea157d350eaf6c1503\", \"sha256\": \"be30d910e67f58d82e753231f1357f326a1a088acf126b21ff77e60aab19b90b\"}, {\"filename\": \"libunwind-1.8.3-pipe-race.patch\", \"url\": \"https://github.com/libunwind/libunwind/commit/346fefe1845c528541fc0b6e3b5dada259b11598.patch\", \"bytes\": 2350, \"book_md5\": null, \"sha256\": \"1b067c02968312f3437ae36a39d342286b08b098cb20e89a18016a6072e18410\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\\
        npathlib.Path(\\'/mnt/nav-lfs/sources/input-prep.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  test ! -f build/meson-logs/testlog.txt || tail -1000 build/meson-logs/testlog.txt | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\
        \\\\n fi\\\\n tail -80 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\n\\\\nulimit -c 0\\\\nexport MAKEFLAGS=-j2\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,collections\\\\np=Path(\\\\\\'/nav-build-metadata/tests\\\\\\')\\\\nfor pkg in [\\\\\\'xorg-server\\\\\\',\\\\\\'libxkbcommon\\\\\\',\\\\\\'xkeyboard-config\\\\\\',\\\\\\'libepoxy\\\\\\']:\\\\n f=p/(pkg+\\\\\\'-testlog.json\\\\\\');assert f.is_file(),f\\\\n rows=[json.loads(l)for l in f.read_text().splitlines()if l.strip()]\\\\n print(\\\\\\'NAV_DISPLAY_AUDIT\\\\\\',pkg,len(rows),dict(collections.Counter(r[\\\\\\'result\\\\\\']for r in rows)))\\\\n for r in rows:\\\\n  if r[\\\\\\'result\\\\\\']!=\\\\\\'OK\\\\\\':print(\\\\\\'NAV_DISPLAY_AUDIT_EXCEPTION\\\\\\',pkg,r[\\\\\\'name\\\\\\'],r[\\\\\\'result\\\\\\'],r.get(\\\\\\'stdout\\\\\\',\\\\\\'\\\\\\'),r.get(\\\\\\'stderr\\\\\\\
        ',\\\\\\'\\\\\\'))\\\\nfor pkg in [\\\\\\'xkeyboard-config\\\\\\',\\\\\\'libepoxy-x11-display\\\\\\']:\\\\n f=p/(pkg+\\\\\\'.log\\\\\\');assert f.is_file(),f\\\\n print(\\\\\\'NAV_DISPLAY_AUDIT_LOG_BEGIN\\\\\\',pkg)\\\\n for line in f.read_text().splitlines():print(\\\\\\'NAV_TEST_AUDIT_DETAIL\\\\\\',pkg,line)\\\\n print(\\\\\\'NAV_DISPLAY_AUDIT_LOG_END\\\\\\',pkg)\\\\nAUDIT\\\\nprintf \\\\\\'NAV_INPUT_HOST_CAPABILITIES\\\\\\\\n\\\\\\'\\\\nuname -a\\\\nls -ld /dev/input /dev/uinput 2>&1 || true\\\\nif [ -c /dev/uinput ]; then printf \\\\\\'NAV_INPUT_UINPUT_NODE_PRESENT\\\\\\\\n\\\\\\'; else printf \\\\\\'NAV_INPUT_UINPUT_NODE_ABSENT\\\\\\\\n\\\\\\'; fi\\\\nfind /boot -maxdepth 1 -type f -name \\\\\\'*config*\\\\\\' -print\\\\ncd /sources\\\\ntar -xf mtdev-1.1.7.tar.bz2\\\\ncd mtdev-1.1.7\\\\n./configure --prefix=/usr --disable-static\\\\nmake -j2\\\\n# No upstream automated suite; verify compiled release samples and installed API.\\\\nmake install\\\\npkg-config --modversion mtdev\\\
        \\nprintf \\\\\\'NAV_MTDEV_NO_UPSTREAM_SUITE_INSTALLED\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf mtdev-1.1.7\\\\ntar -xf libunwind-1.8.3.tar.gz\\\\ncd libunwind-1.8.3\\\\npatch -Np1 -i ../libunwind-1.8.3-pipe-race.patch\\\\n# Backport upstream thread_local spelling to this release\\\\\\'s headers.\\\\nsed -i \\\\\\'/#include \"libunwind_i.h\"/a #include <threads.h>\\\\\\' src/mi/Gaddress_validator.c\\\\nsed -i \\\\\\'/func.s/s/s//\\\\\\' tests/Gtest-nomalloc.c\\\\n./configure --prefix=/usr --disable-static\\\\nmake -j2\\\\nchown -R tester:tester .\\\\nrun_test libunwind su tester -c \\\\\\'make -j2 check\\\\\\'\\\\nrun_test libunwind-concurrent-repeat su tester -c \\\\\\'for n in $(seq 1 20); do ./tests/Gtest-concurrent || exit $?; ./tests/Ltest-concurrent || exit $?; done\\\\\\'\\\\nfind . -name test-suite.log -o -name testsuite.log | while read -r log; do cat \"$log\"; done\\\\nmake install\\\\nldconfig\\\\npkg-config --modversion libunwind\\\\ncd /sources\\\\nrm -rf libunwind-1.8.3\\\
        \\nprintf \\\\\\'Source mtdev and libunwind input prerequisites. Libunwind strict nonroot suite; mtdev has no upstream automated suite. Display saved test evidence audited. No libevdev/libinput installation or input/hardware/desktop acceptance yet.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_INPUT_PREP_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"\
        $LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/input-prep.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native\
        \ build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/input-prep.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n\
        \ log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested input prerequisites
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-input-prep-v1
