name: NAV librsvg bounded reproducibility OLD hash identity seed linkorder ELF section comparison NO INSTALL
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-rsvg-repro-investigation
  cancel-in-progress: false
jobs:
  rsvg:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-recovery-root.tar.zst; do\n test ! -e \"$bundle\"\n sudo install -o \"$(id -u)\" -g \"$(id\
        \ -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\"\
        \ = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\\
        n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\" proof\n zstd -t \"$bundle\"\n tar --zstd\
        \ -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\" \"$probe/recovered\"\n # Match actions/cache\
        \ extraction semantics, not only bundle writer access.\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test\
        \ ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n relative_bundle=$(realpath --relative-to=\"$PWD\"\
        \ \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\" -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n\
        \ env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program unzstd\
        \ > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n set -e\n test \"$negative_rc\" = 2\n test ! -s\
        \ \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\n TAR_OPTIONS=--overwrite\
        \ /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program unzstd\n cmp \"$probe/expected-bundle\"\
        \ \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n test \"$(stat -c\
        \ '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_RSVG_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_RSVG_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_RSVG_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_RSVG_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore verified combined heif cargo-c checkpoint
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-recovery-root.tar.zst
        key: nav-blfs13.1-x86_64-heif-cargoc-recovery-open-v1
        fail-on-cache-miss: true
    - name: Verify exact combined checkpoint
      shell: bash
      run: 'set -euo pipefail

        printf "b9d323687756afb4ba55c3147eeef988b69b4e8bf9f3455893cb9a25f694b25c  /mnt/nav-recovery-root.tar.zst\n"
        | sha256sum -c -

        zstd -t /mnt/nav-recovery-root.tar.zst

        tar --zstd -xf /mnt/nav-recovery-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/recovery/RECOVERY-TRANSITIONAL-OPEN.json

        '
    - name: Prepare bounded seed search and ELF section/link commands retention helpers
      shell: bash
      run: 'python3 - <<''HELPERS''

        from pathlib import Path

        Path(''/mnt/nav-lfs/sources/rsvg-stage.sh'').write_text(''set -euo pipefail\numask 022\nulimit -v 4194304\nexport
        PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin LANG=C.UTF-8 MAKEFLAGS=-j2 CARGO_BUILD_JOBS=2 CARGO_HOME=/tmp/nav-librsvg-cargo-home\nunset
        LC_ALL LANGUAGE\nchmod 1777 /tmp /var/tmp\nS=/sources/librsvg-2.62.4\nP=/nav-build-metadata/rsvg-repro\nmkdir
        -p "$P" "$CARGO_HOME"\nchown -R tester:tester "$S" "$P" "$CARGO_HOME"\npython3 /sources/rsvg-repro-seeds.py
        > "$P/seed-search.log" 2>&1\nseed=$(cat "$P/old-seed.txt")\nsu tester -c "export PYTHONHASHSEED=$seed PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin
        CARGO_HOME=/tmp/nav-librsvg-cargo-home CARGO_BUILD_JOBS=2;cd /sources/librsvg-2.62.4;meson setup --prefix=/usr
        --buildtype=release build" > "$P/old-configure.log" 2>&1\nsu tester -c "export PYTHONHASHSEED=$seed PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin
        CARGO_HOME=/tmp/nav-librsvg-cargo-home CARGO_BUILD_JOBS=2;cd /sources/librsvg-2.62.4;ninja -C build -j2"
        > "$P/old-build.log" 2>&1\npython3 /sources/rsvg-repro-audit.py old\nseed=$(cat "$P/failed-seed.txt")\nsu
        tester -c "export PYTHONHASHSEED=$seed PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin CARGO_HOME=/tmp/nav-librsvg-cargo-home
        CARGO_BUILD_JOBS=2;cd /sources/librsvg-2.62.4;meson setup --reconfigure --prefix=/usr --buildtype=release
        build" > "$P/new-configure.log" 2>&1\nsu tester -c "export PYTHONHASHSEED=$seed PATH=/opt/rustc/bin:/usr/bin:/usr/sbin:/bin:/sbin
        CARGO_HOME=/tmp/nav-librsvg-cargo-home CARGO_BUILD_JOBS=2;cd /sources/librsvg-2.62.4;ninja -C build -j2"
        > "$P/new-build.log" 2>&1\npython3 /sources/rsvg-repro-audit.py new\nexport PKG_CONFIG_PATH="$S/build/meson-uninstalled"\ncc
        /sources/rsvg-render-investigation.c $(pkg-config --cflags --libs librsvg-2.0-uninstalled pangocairo pangoft2
        fontconfig) -Wl,-rpath,"$S/build/rsvg" -o /tmp/rsvg-repro-render > "$P/render-build.log" 2>&1\nfor variant
        in old new;do\n mkdir -p "/tmp/rsvg-$variant-lib"\n cp "$P/$variant-librsvg-2.so.2.62.4" "/tmp/rsvg-$variant-lib/librsvg-2.so.2"\n
        LD_LIBRARY_PATH="/tmp/rsvg-$variant-lib" /tmp/rsvg-repro-render "$S/rsvg/tests/fixtures/reftests/svg1.1/text-text-03-b.svg"
        "$S/rsvg/tests/resources" "$S/rsvg/tests/fixtures/reftests/svg1.1/text-text-03-b-ref.png" /sources/upstream-new-ref.png
        "$P/$variant-render.png" > "$P/$variant-render.log" 2>&1\ndone\npython3 /sources/rsvg-repro-audit.py final\n'')

        Path(''/mnt/nav-lfs/sources/rsvg-repro-seeds.py'').write_text("from pathlib import Path\nimport ast,subprocess,os,sys,json,concurrent.futures,re\nS=Path(''/sources/librsvg-2.62.4'');P=Path(''/nav-build-metadata/rsvg-repro'')\n#
        Query exact installed rustc as upstream does, then run only the unchanged pure parser function in seeded
        interpreters.\ntree=ast.parse((S/''meson/query-rustc.py'').read_text());names=[''removeprefix_fallback'',''removesuffix_fallback'',''retrieve_native_static_libs_from_output''];nodes=[n
        for n in tree.body if isinstance(n,ast.FunctionDef)and n.name in names];assert len(nodes)==3\nr=subprocess.run([''/opt/rustc/bin/rustc'',''--print=native-static-libs'',''--crate-type'',''staticlib'',''/dev/null'',''-o'',''/tmp/rsvg-query.a''],capture_output=True,text=True,check=True);(P/''native-static-libs-original-stderr.txt'').write_text(r.stderr)\ncode=''import
        re,sys\\n''+ast.unparse(ast.Module(body=nodes,type_ignores=[]))+''\\nretrieve_native_static_libs_from_output(''+repr(r.stderr)+'')\\n'';f=P/''seed-parser-function.py'';f.write_text(code)\nwanted={''old'':''c
        util dl pthread m rt gcc_s'',''failed'':''gcc_s m c dl rt util pthread''}\ndef check(seed):\n x=subprocess.run([''/usr/bin/python3'',str(f)],env=dict(os.environ,PYTHONHASHSEED=str(seed)),capture_output=True,text=True,check=True).stdout.strip();return
        seed,x\nfound={}\nwith concurrent.futures.ThreadPoolExecutor(max_workers=2)as pool:\n for start in range(0,32768,64):\n  for
        seed,value in pool.map(check,range(start,start+64)):\n   for name,order in wanted.items():\n    if name
        not in found and value==order:found[name]=seed\n  if len(found)==2:break\nassert len(found)==2,{''bounded_seed_search_unresolved'':found}\nfor
        name,seed in found.items():\n x=subprocess.run([''/usr/bin/python3'',str(S/''meson/query-rustc.py''),''/opt/rustc/bin/rustc'',''--query=native-static-libs''],env=dict(os.environ,PYTHONHASHSEED=str(seed)),capture_output=True,text=True,check=True);assert
        x.stdout.strip()==wanted[name],{''full_original_helper_disagrees'':name};(P/(name+''-seed.txt'')).write_text(str(seed));print(''NAV_RSVG_REPRO_ORIGINAL_HELPER_SEED'',name,seed,x.stdout.strip(),flush=True)\n(P/''seed-search-proof.json'').write_text(json.dumps({''maximum_seeds'':32768,''selected'':found,''orders'':wanted,''source_parser_ast_exact'':True,''verified_full_unchanged_helper'':True},indent=2))\n")

        Path(''/mnt/nav-lfs/sources/rsvg-repro-audit.py'').write_text("from pathlib import Path\nimport hashlib,json,os,sys,subprocess,struct,shutil\nP=Path(''/nav-build-metadata/rsvg-repro'');S=Path(''/sources/librsvg-2.62.4'')\ndef
        sha(p):return hashlib.file_digest(Path(p).open(''rb''),''sha256'').hexdigest()\ndef sections(p):\n b=Path(p).read_bytes();assert
        b[:6]==b''\\x7fELF\\x02\\x01'';off=struct.unpack_from(''<Q'',b,40)[0];size,num,names=struct.unpack_from(''<HHH'',b,58);rows=[struct.unpack_from(''<IIQQQQIIQQ'',b,off+i*size)for
        i in range(num)];n=rows[names];st=b[n[4]:n[4]+n[5]];out={}\n for r in rows:\n  name=st[r[0]:].split(b''\\0'',1)[0].decode();data=b[r[4]:r[4]+r[5]]if
        r[1]!=8 else b'''';out[name]={''type'':r[1],''flags'':r[2],''address'':r[3],''offset'':r[4],''size'':r[5],''sha256'':hashlib.sha256(data).hexdigest()}\n
        return out\nv=sys.argv[1]\nif v in [''old'',''new'']:\n files={''library'':''build/rsvg/librsvg-2.so.2.62.4'',''cli'':''build/rsvg_convert/rsvg-convert''};out={}\n
        for name,rel in files.items():\n  p=S/rel;out[rel]={''bytes'':p.stat().st_size,''sha256'':sha(p)};target=P/(v+''-''+(''librsvg-2.so.2.62.4''if
        name==''library''else''rsvg-convert''));shutil.copy2(p,target)\n  (P/(v+''-''+name+''-sections.json'')).write_text(json.dumps(sections(p),indent=2))\n  for
        flag,label in [(''-aW'',''readelf''),(''-dW'',''dynamic''),(''-nW'',''notes''),(''-lW'',''segments'')]:\n   x=subprocess.run([''readelf'',flag,str(p)],capture_output=True,text=True,check=True);(P/(v+''-''+name+''-''+label+''.txt'')).write_text(x.stdout)\n
        outpath=P/(v+''-compiled-runtime-files-sha256.json'');outpath.write_text(json.dumps(out,indent=2));cmd=subprocess.check_output([''ninja'',''-C'',str(S/''build''),''-t'',''commands'',''rsvg/librsvg-2.so.2.62.4''],text=True);(P/(v+''-ninja-commands.txt'')).write_text(cmd);shutil.copy2(S/''build/build.ninja'',P/(v+''-build.ninja''));shutil.copy2(S/''build/meson-logs/meson-log.txt'',P/(v+''-meson-log.txt''))\n
        inputs={str(p.relative_to(S)):{''bytes'':p.stat().st_size,''sha256'':sha(p)}for p in(S/''build'').rglob(''*'')if
        p.is_file()and not p.is_symlink()and p.suffix in[''.a'',''.o'']};(P/(v+''-link-inputs.json'')).write_text(json.dumps(inputs,indent=2))\n
        if v==''old'':\n  expected={''build/rsvg/librsvg-2.so.2.62.4'':{''bytes'':7044152,''sha256'':''b3edc3745f22ac7ab49e0a954cb82c6c988c3f4f384f40dace709d7446ca01d4''},''build/rsvg_convert/rsvg-convert'':{''bytes'':7874216,''sha256'':''3062e688de7fc28b4ce155589cd11d29cb2978698a39d8b087ebf5ee03b99e02''}};assert
        out==expected,{''old_identity_not_reproduced_STOP'':out}\n print(''NAV_RSVG_REPRO_''+v.upper()+''_COMPILED_RETAINED
        ''+json.dumps(out),flush=True)\nelif v==''final'':\n old=json.loads((P/''old-link-inputs.json'').read_text());new=json.loads((P/''new-link-inputs.json'').read_text());assert
        old==new,''compiled inputs differ beyond link ordering''\n a=json.loads((P/''old-library-sections.json'').read_text());b=json.loads((P/''new-library-sections.json'').read_text());assert
        a.keys()==b.keys();diff={k:{''old'':a[k],''new'':b[k]}for k in a if a[k]!=b[k]};(P/''library-section-differences.json'').write_text(json.dumps(diff,indent=2))\n
        for mode in[''old'',''new'']:\n  t=(P/(mode+''-render.log'')).read_text();assert ''upstream_reference_only_fix
        changed_pixels=0 maximum_channel_difference=0''in t and ''pinned_original_reference changed_pixels=12 maximum_channel_difference=255
        bounds=39,139,216,140''in t\n original=json.loads((P/''original-source-files-sha256.json'').read_text())\n
        for rel,x in original.items():\n  p=S/rel;assert p.is_file()and not p.is_symlink()and p.stat().st_size==x[''bytes'']and
        sha(p)==x[''sha256''],rel\n links=json.loads((P/''original-source-symlinks.json'').read_text())\n for rel,target
        in links.items():assert(S/rel).is_symlink()and os.readlink(S/rel)==target,rel\n audit={''classification'':''NO-INSTALL
        reproducibility investigation. Originalold library and CLI hashes reproduced; linkinput compiled objects/archives
        identical across order variants. Sectionanalysis requires parent review beforebenignclassification/install.'',''old_identity_anchor_exact'':True,''compiled_link_inputs_identical'':len(old),''source_regular_files_exact'':len(original),''source_symlinks_exact'':len(links),''section_differences'':diff,''old_new_render_equal_upstream_corrected'':True,''canonical_tests_replayed'':False,''installed'':False,''cache_mutations'':False,''memory_cap_KiB'':4194304,''jobs'':2};(P/''repro-investigation-audit.json'').write_text(json.dumps(audit,indent=2));print(''NAV_RSVG_REPRO_OLD_IDENTITY_SOURCE_INPUTS_RENDER_VERIFIED_SECTION_DIFFS'',list(diff),flush=True)\nelse:raise
        SystemExit(2)\n")

        Path(''/mnt/nav-lfs/sources/rsvg-render-investigation.c'').write_text(''#include <librsvg/rsvg.h>\n#include
        <pango/pangocairo.h>\n#include <pango/pangofc-fontmap.h>\n#include <fontconfig/fontconfig.h>\n#include <cairo.h>\n#include
        <stdio.h>\n#include <stdlib.h>\n#include <stdint.h>\n#include <string.h>\nstatic void check(int ok,const
        char *msg){if(!ok){fprintf(stderr,"INVESTIGATION_ERROR %s\\n",msg);exit(2);}}\nstatic void compare(cairo_surface_t
        *actual,const char *path,const char *name){\n cairo_surface_t *ref=cairo_image_surface_create_from_png(path);check(cairo_surface_status(ref)==CAIRO_STATUS_SUCCESS,"load
        comparison PNG");\n check(cairo_image_surface_get_width(ref)==480&&cairo_image_surface_get_height(ref)==360,"reference
        geometry");cairo_surface_flush(actual);cairo_surface_flush(ref);\n unsigned char*a=cairo_image_surface_get_data(actual),*b=cairo_image_surface_get_data(ref);int
        as=cairo_image_surface_get_stride(actual),bs=cairo_image_surface_get_stride(ref);long count=0;int max=0,x0=480,y0=360,x1=-1,y1=-1;\n
        for(int y=0;y<360;y++)for(int x=0;x<480;x++){int changed=0;for(int c=0;c<4;c++){int d=abs(a[y*as+4*x+c]-b[y*bs+4*x+c]);if(d){changed=1;if(d>max)max=d;}}if(changed){count++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}\n
        printf("COMPARISON %s changed_pixels=%ld maximum_channel_difference=%d bounds=%d,%d,%d,%d\\n",name,count,max,x0,y0,x1,y1);cairo_surface_destroy(ref);\n}\nint
        main(int argc,char**argv){check(argc==6,"args sourceSVG testFontsDir oldPNG newPNG outputPNG");\n setenv("LANGUAGE","de:en_US:en:",1);setenv("LC_ALL","de:en_US:en:",1);\n
        FcConfig *config=FcConfigCreate();check(config!=NULL,"FcConfigCreate");check(FcConfigSetCurrent(config),"FcConfigSetCurrent");char
        path[4096];snprintf(path,sizeof(path),"%s/fonts.conf",argv[2]);check(FcConfigParseAndLoad(config,(const
        FcChar8*)path,1),"fontconfig fixture config");check(FcConfigAppFontAddDir(config,(const FcChar8*)argv[2]),"fixture
        fonts");\n PangoFontMap*map=pango_cairo_font_map_new_for_font_type(CAIRO_FONT_TYPE_FT);check(map!=NULL,"fixture
        fontmap");pango_fc_font_map_set_config(PANGO_FC_FONT_MAP(map),config);pango_cairo_font_map_set_default(PANGO_CAIRO_FONT_MAP(map));FcConfigDestroy(config);\n
        GError *error=NULL;RsvgHandle*h=rsvg_handle_new_from_file(argv[1],&error);check(h!=NULL,error?error->message:"load
        SVG");rsvg_handle_internal_set_testing(h,TRUE);rsvg_handle_set_dpi(h,72.0);\n cairo_surface_t*frame=cairo_image_surface_create(CAIRO_FORMAT_ARGB32,574,454);cairo_t*cr=cairo_create(frame);cairo_translate(cr,47,47);RsvgRectangle
        viewport={0,0,480,360};check(rsvg_handle_render_document(h,cr,&viewport,&error),error?error->message:"render
        SVG");cairo_destroy(cr);\n cairo_surface_t*out=cairo_image_surface_create(CAIRO_FORMAT_ARGB32,480,360);cr=cairo_create(out);cairo_set_source_surface(cr,frame,-47,-47);cairo_paint(cr);cairo_destroy(cr);check(cairo_surface_write_to_png(out,argv[5])==CAIRO_STATUS_SUCCESS,"write
        actual PNG");\n printf("RENDER_ONLY_INVESTIGATION originalSVG fixturefonts testmode DPI72 frame47, no upstream
        test driver invoked\\n");compare(out,argv[3],"pinned_original_reference");compare(out,argv[4],"upstream_reference_only_fix");cairo_surface_destroy(out);cairo_surface_destroy(frame);g_object_unref(h);g_object_unref(map);return
        0;\n}\n'')

        HELPERS

        '
    - name: Prepare untouched original release source namespace no install
      shell: bash
