name: NAV PipeWire real journal diagnostic nested case audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-pipewire:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-json-v1
        fail-on-cache-miss: true
    - name: Build PipeWire portal prerequisite and replay JSON test evidence
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"pipewire-1.6.8.tar.bz2\", \"url\": \"https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.8/pipewire-1.6.8.tar.bz2\", \"bytes\": 2062635, \"sha256\": \"efbaedf80450e5b08bb3196a4ca7ea17850d4a71ec1a8ae321e8937a7c95779e\", \"blfs_md5\": \"9ae75812a76951c93210a26272c90ef3\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 CMAKE_BUILD_PARALLEL_LEVEL=2 PATH=/opt/qt6/bin:/usr/bin:/usr/sbin LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE\\\\npython3 - <<\\\\\\'AUDIT_JSON\\\\\\'\\\\nimport json,base64,re\\\\nfrom pathlib import Path\\\\np=Path(\\\\\\'/nav-build-metadata/portal\\\\\\')\\\\nr=[json.loads(x)for x in (p/\\\\\\'testlog.json\\\\\\').read_text().splitlines()if x.strip()]\\\\nprint(\\\\\\'NAV_KF6_PORTAL_JSON_REPLAY_RESULTS\\\\\\',[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nassert len(r)>=14 and all(x[\\\\\\'result\\\\\\']==\\\\\\'OK\\\\\\'for x in r)\\\\nfor x in r:\\\\n for k in [\\\\\\'stdout\\\\\\',\\\\\\'stderr\\\\\\']:\\\\n  assert not re.search(r\\\\\\'^not ok|#\\\\\\\\s*(SKIP|TODO)\\\\\\',x.get(k,\\\\\\'\\\\\\'),re.M|re.I),(x[\\\\\\'name\\\\\\'],k)\\\\nb=(p/\\\\\\'testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(b),3000):print(\\\\\\'NAV_KF6_PORTAL_JSON_REPLAY_B64\\\\\\',base64.b64encode(b[i:i+3000]).decode(),flush=True)\\\\nAUDIT_JSON\\\\nmkdir -p /nav-build-metadata/pipewire /nav-build-metadata/tests\\\\nprintf \\\\\\'NAV_KF6_PORTAL_HOST_PREFLIGHT\\\\\\\\n\\\\\\'\\\\nls -l /dev/fuse /dev/cuse || true\\\\nzgrep -E \\\\\\'CONFIG_(FUSE_FS|CUSE|USER_NS)=\\\\\\' /proc/config.gz || true\\\\ncd /sources\\\\ntar -xf pipewire-1.6.8.tar.bz2\\\\ncd pipewire-1.6.8\\\\nmeson setup build --prefix=/usr --buildtype=release -Dsession-managers=\\\\\\'[]\\\\\\' -Dtests=enabled -Ddocs=disabled -Dman=disabled\\\\nninja -C build -j2\\\\nchown -R tester .\\\\ninstall -d -m0700 -o tester -g tester /tmp/nav-pipewire-runtime\\\\n# Real journal daemon in this isolated build session, not a fake portal or logger.\\\\ninstall -d -m0755 /run/systemd/journal /run/log/journal /etc/systemd/journald.conf.d\\\\nprintf \\\\\\'[Journal]\\\\\\\\nStorage=volatile\\\\\\\\nRuntimeMaxUse=16M\\\\\\\\nForwardToSyslog=no\\\\\\\\n\\\\\\' > /etc/systemd/journald.conf.d/nav-test.conf\\\\nsystemd-machine-id-setup\\\\nusermod -a -G systemd-journal tester\\\\n/usr/lib/systemd/systemd-journald > /tmp/nav-journald.log 2>&1 &\\\\njournal_pid=$!\\\\ntrap \\\\\\'cat /tmp/nav-journald.log; kill \"$journal_pid\" 2>/dev/null || true; rm -f /etc/systemd/journald.conf.d/nav-test.conf\\\\\\' EXIT\\\\nfor n in $(seq 1 100); do test -S /run/systemd/journal/socket && break; sleep .1; done\\\\nkill -0 \"$journal_pid\"\\\\nprintf \\\\\\'NAV real journal preflight\\\\\\\\n\\\\\\' | systemd-cat -t nav-preflight\\\\njournalctl --sync\\\\n# Read permission on this disposable journal only, never the host journal.\\\\nchgrp -R systemd-journal /run/log/journal\\\\nfind /run/log/journal -type d -exec chmod 2755 {} +\\\\nfind /run/log/journal -type f -exec chmod 0640 {} +\\\\nls -ld /run/log/journal /run/log/journal/*\\\\nid tester\\\\nsu tester -c \\\\\\'journalctl --no-pager -n 3\\\\\\'\\\\nprintf \\\\\\'NAV_KF6_REAL_JOURNAL_READY\\\\\\\\n\\\\\\'\\\\nset +e\\\\nsu tester -c \\\\\\'dbus-run-session -- env -u LC_ALL -u LANGUAGE LANG=C.UTF-8 XDG_RUNTIME_DIR=/tmp/nav-pipewire-runtime meson test -C build --num-processes 2 --print-errorlogs\\\\\\' > /nav-build-metadata/tests/pipewire.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/pipewire.log\\\\ncp build/meson-logs/testlog.{txt,json} /nav-build-metadata/pipewire/\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,re,base64\\\\ns=Path(\\\\\\'build/meson-logs/testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(s),3000):print(\\\\\\'NAV_KF6_PIPEWIRE_LOG_B64\\\\\\',base64.b64encode(s[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(x)for x in Path(\\\\\\'build/meson-logs/testlog.json\\\\\\').read_text().splitlines()if x.strip()]\\\\nprint(\\\\\\'NAV_KF6_PIPEWIRE_RESULTS\\\\\\',[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nassert len(r)>=8 and all(x[\\\\\\'result\\\\\\']==\\\\\\'OK\\\\\\'for x in r)\\\\nfor x in r:\\\\n for key in [\\\\\\'stdout\\\\\\',\\\\\\'stderr\\\\\\']:\\\\n  assert not re.search(r\\\\\\'^not ok|#\\\\\\\\s*(SKIP|TODO)\\\\\\',x.get(key,\\\\\\'\\\\\\'),re.M|re.I),(x[\\\\\\'name\\\\\\'],key)\\\\n  skips=re.findall(r\\\\\\'- name: \\\\\\\\\"([^\\\\\\\\\"]+)\\\\\\\\\"\\\\\\\\n\\\\\\\\s+status: SKIP\\\\\\',x.get(key,\\\\\\'\\\\\\'))\\\\n  assert all(n==\\\\\\'compat_sigabbrev_np\\\\\\' for n in skips),(x[\\\\\\'name\\\\\\'],skips)\\\\n  assert not re.search(r\\\\\\'status: (FAIL|ERROR)\\\\\\',x.get(key,\\\\\\'\\\\\\')),x[\\\\\\'name\\\\\\']\\\\nprint(\\\\\\'NAV_KF6_PIPEWIRE_NESTED_STATUS_AUDITED_CONDITIONAL_LIBC_SKIP_NOT_COUNTED_AS_PASS\\\\\\',flush=True)\\\\nAUDIT\\\\ntest \"$rc\" = 0\\\\nmkdir -p /tmp/nav-fallback-check\\\\ncp test/pwtest-compat.c /tmp/nav-fallback-check/\\\\nprintf \\\\\\'\\\\\\' > /tmp/nav-fallback-check/config.h\\\\ncat > /tmp/nav-fallback-check/check.c <<\\\\\\'C\\\\\\'\\\\n#include <assert.h>\\\\n#include <string.h>\\\\n#include \"pwtest-compat.c\"\\\\nint main(void){assert(!strcmp(sigabbrev_np(SIGABRT),\"ABRT\"));assert(!strcmp(sigabbrev_np(SIGSEGV),\"SEGV\"));assert(!strcmp(sigabbrev_np(SIGSTOP),\"STOP\"));assert(!strcmp(sigabbrev_np(SIGCHLD),\"CHLD\"));assert(!strcmp(sigabbrev_np(SIGTERM),\"TERM\"));assert(!strcmp(sigabbrev_np(SIGKILL),\"KILL\"));assert(sigabbrev_np(12345)==NULL);return 0;}\\\\nC\\\\ncc /tmp/nav-fallback-check/check.c -o /tmp/nav-fallback-check/check\\\\n/tmp/nav-fallback-check/check\\\\nrm -rf /tmp/nav-fallback-check\\\\nprintf \\\\\\'NAV_KF6_LIBC_FALLBACK_SUPPLEMENT_PASS_ORIGINAL_CONDITIONAL_SKIP_REMAINS\\\\\\\\n\\\\\\'\\\\nninja -C build install\\\\nldconfig\\\\npkg-config --modversion libpipewire-0.3\\\\ncd /sources\\\\nrm -rf pipewire-1.6.8\\\\nprintf \\\\\\'PipeWire source built and all configured tests audited. Optional hardware/audio codecs auto-detected, no hardware test or complete multimedia stack claim. CoreAddons Documents portal pending, not waived; compositor and ISO unfinished; Valgrind4 unresolved.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nkill -0 \"$journal_pid\"\\\\nprintf \\\\\\'NAV_KF6_PIPEWIRE_JOURNAL_DIAGNOSTIC_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/portal-json.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/portal-json.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER','NAV_KF6','Totals:','FAIL!','SKIP','platform plugin','could not connect'])))\nNAV_GUARD\n"
