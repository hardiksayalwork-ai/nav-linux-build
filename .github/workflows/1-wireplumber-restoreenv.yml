name: NAV WirePlumber original once Lua restore ENV corrected scope unchanged
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
    - name: Exact22protected no save delete
      shell: bash
      run: "test \"$GITHUB_RUN_NUMBER\" = 1\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nset -euo pipefail\npython3 - <<'PREFLIGHT'\n\
        import urllib.request, urllib.error, json, time, os\nstart = time.monotonic()\nbase = 'https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build'\n\
        token = os.environ['GH_TOKEN']\nassert token\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\n\
        \    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        raise urllib.error.HTTPError(req.full_url,\
        \ code, 'redirect refused for scoped authenticated preflight', headers, fp)\nopener = urllib.request.build_opener(NoRedirect())\n\
        \ndef req(u):\n    assert u.startswith(base)\n    q = urllib.request.Request(u, headers={'Authorization':\
        \ 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Cache-Control':\
        \ 'no-store'})\n    with opener.open(q, timeout=30) as response:\n        return json.load(response)\nr\
        \ = req(base + '?t=' + str(time.time_ns()))\nassert r['private'] is False\nc = req(base + '/actions/caches?per_page=100&t='\
        \ + str(time.time_ns()))\nexpected = {'10827259500': {'key': 'nav-gstlibav1.28.6-install-only-5OK1FAIL-OPEN16channel-v1',\
        \ 'bytes': 526760}, '10826754060': {'key': 'nav-ffmpeg9.0.1-install-only-first5290-corrected31-open-v1',\
        \ 'bytes': 109875240}, '10818008081': {'key': 'nav-theora-basetheora-install-only-open-v1', 'bytes': 1665268},\
        \ '10816097588': {'key': 'nav-gstmatroska-original-tested-install-only-open-v1', 'bytes': 283419}, '10813815026':\
        \ {'key': 'nav-opus-baseopus-install-only-open-v1', 'bytes': 512022}, '10810498235': {'key': 'nav-gstgood-narrow-install-only-transitional-open-v1',\
        \ 'bytes': 901348}, '10803318199': {'key': 'nav-blfs13.1-x86_64-librsvg-transitional-open-v1', 'bytes':\
        \ 1477765679}, '10805037408': {'key': 'nav-graphene-isocodes-hicolor-install-only-open-v1', 'bytes': 6895265},\
        \ '10804828520': {'key': 'nav-linux7.1.8-userns-udmabuf-compiled-open-v1', 'bytes': 17602045}, '10790873772':\
        \ {'key': 'nav-blfs13.1-x86_64-aom-static-repair-open-v1', 'bytes': 1414253410}, '10710908926': {'key':\
        \ 'nav-blfs13.1-x86_64-jxl-open-v1', 'bytes': 1404400214}, '10700939007': {'key': 'nav-blfs13.1-x86_64-giflib-open-v1',\
        \ 'bytes': 1374812746}, '10696846187': {'key': 'nav-blfs13.1-x86_64-git-open-v1', 'bytes': 1374122764},\
        \ '10516363617': {'key': 'nav-lfs13.1-x86_64-final-gcc-v1', 'bytes': 1413472049}, '10515953327': {'key':\
        \ 'nav-lfs13.1-x86_64-gcc-test-runtime-v1', 'bytes': 148732}, '10511354384': {'key': 'nav-lfs13.1-x86_64-gcc-test-cxx-v1',\
        \ 'bytes': 1030391}, '10508735204': {'key': 'nav-lfs13.1-x86_64-gcc-test-c-v1', 'bytes': 1021068}, '10480998516':\
        \ {'key': 'nav-lfs13.1-x86_64-access-tools-v1', 'bytes': 909038418}, '10829907838': {'key': 'nav-gstbad1.28.6-install-only-original97OK5FAIL2SKIP-Play17PASS2OPEN-v1',\
        \ 'bytes': 6420637}, '10833464043': {'key': 'nav-pango1.58.2-introspection-only-original-ledger-unchanged-v1',\
        \ 'bytes': 179240}, '10843934869': {'key': 'nav-librsvg2.62.4-svg-pixbufloader-only-native5-decode-verified-original-ledgers-unchanged-v1',\
        \ 'bytes': 180383}, '10868593577': {'key': 'nav-lua5.4.8-zero-source-patch-O2-PIC-embedded-OPEN-main385-v1',\
        \ 'bytes': 314639}}\nactual = {str(z['id']): {'key': z['key'], 'bytes': z['size_in_bytes']} for z in c['actions_caches']}\n\
        assert c['total_count'] == len(actual) == len(expected) and actual == expected\nassert sum((z['bytes'] for\
