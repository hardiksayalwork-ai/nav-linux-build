name: NAV Graphene ISO hicolor install-only original tests retained smallbundle wait kernel no deletions
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: nav-gtk-prereq-install-only
  cancel-in-progress: false
jobs:
  prerequisites:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
    - name: Prepare owned isolated root and exact bundle files
      shell: bash
      run: "set -euo pipefail\nsudo mkdir -p /mnt/nav-lfs\nsudo chown \"$(id -u):$(id -g)\" /mnt/nav-lfs\nfor bundle\
        \ in /mnt/nav-rsvg-root.tar.zst /mnt/nav-gtk-prerequisites.tar.zst; do\n test ! -e \"$bundle\"\n sudo install\
        \ -o \"$(id -u)\" -g \"$(id -g)\" -m 0600 /dev/null \"$bundle\"\n test -w \"$bundle\"\n test \"$(stat -c\
        \ '%u:%g:%a' \"$bundle\")\" = \"$(id -u):$(id -g):600\"\n probe=$(mktemp -d /tmp/nav-aom-bundle-probe.XXXXXX)\n\
        \ printf 'NAV_AOM_EXACT_RUNNER_OUTPUT\\n' > \"$probe/proof\"\n tar --zstd -cf \"$bundle\" -C \"$probe\"\
        \ proof\n zstd -t \"$bundle\"\n tar --zstd -xOf \"$bundle\" proof > \"$probe/recovered\"\n cmp \"$probe/proof\"\
        \ \"$probe/recovered\"\n # Match actions/cache extraction semantics, not only bundle writer access.\n test\
        \ \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n cp \"$bundle\" \"$probe/expected-bundle\"\n\
        \ relative_bundle=$(realpath --relative-to=\"$PWD\" \"$bundle\")\n tar --zstd -cf \"$probe/cache.tzst\"\
        \ -P \"$relative_bundle\"\n : > \"$bundle\"\n set +e\n env -u TAR_OPTIONS /usr/bin/tar -xf \"$probe/cache.tzst\"\
        \ -P -C \"$PWD\" --use-compress-program unzstd > \"$probe/default-restore.log\" 2>&1\n negative_rc=$?\n\
        \ set -e\n test \"$negative_rc\" = 2\n test ! -s \"$bundle\"\n grep -F 'Cannot open: File exists' \"$probe/default-restore.log\"\
        \n TAR_OPTIONS=--overwrite /usr/bin/tar -xf \"$probe/cache.tzst\" -P -C \"$PWD\" --use-compress-program\
        \ unzstd\n cmp \"$probe/expected-bundle\" \"$bundle\"\n test \"$(stat -c '%u:%g:%a' \"$bundle\")\" = \"\
        $(id -u):$(id -g):600\"\n test \"$(stat -c '%U:%a' /mnt)\" = root:755\n test ! -w /mnt\n printf 'NAV_AOM_REAL_CACHE_RESTORE_OVERWRITE_SELFTEST_PASS\
        \ %s\\n' \"$bundle\"\n : > \"$bundle\"\ndone\nprintf 'NAV_AOM_EXACT_BUNDLE_PERMISSION_SELFTEST_PASS\\n'\n"
    - name: Actual root-owned failure evidence exporter selftest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'EXPORT_SELFTEST'\nimport pathlib,subprocess,tempfile,base64,gzip,json,hashlib\n\
        p=pathlib.Path(tempfile.mkdtemp(prefix='nav-aom-export-selftest-'))\nexpected={'shard-00.log':b'synthetic\
        \ failure evidence\\n','shard-00.xml':b'<testsuites><testsuite name=\"synthetic\"><testcase name=\"failed\"\
        ><failure message=\"synthetic\"/></testcase></testsuite></testsuites>'}\nfor name,data in expected.items():\n\
        \ f=p/name;f.write_bytes(data)\n subprocess.run(['sudo','chown','root:root',str(f)],check=True)\n subprocess.run(['sudo','chmod','600',str(f)],check=True)\n\
        code=\"import pathlib\\nimport base64, gzip, subprocess, os, hashlib, json\\nmode = 'shard'\\np = pathlib.Path('/mnt/nav-lfs/nav-build-metadata/aom-tooling')\\\
        nmanifest = {'mode': mode, 'files': {}, 'errors': [], 'runner_uid': os.getuid()}\\n\\ndef emit(name, data):\\\
        n    data = gzip.compress(data, mtime=0)\\n    for i in range(0, len(data), 3000):\\n        print('NAV_RSVG_'\
        \ + name + '_GZB64', base64.b64encode(data[i:i + 3000]).decode(), flush=True)\\ntry:\\n    listing = subprocess.check_output(['sudo',\
        \ 'find', str(p), '-type', 'f', '-print0']).split(b'\\\\x00')\\nexcept Exception as ex:\\n    listing =\
        \ []\\n    manifest['errors'].append({'area': str(p), 'error': repr(ex)})\\nfor item in sorted((x for x\
        \ in listing if x)):\\n    f = pathlib.Path(os.fsdecode(item))\\n    rel = str(f.relative_to(p))\\n    wanted\
        \ = mode == 'build' and (not (rel.endswith('.log') and rel.startswith('discovery/'))) or (mode == 'shard'\
        \ and '/' not in rel and rel.startswith(('shard-', 'run-status-', 'current-list'))) or (mode == 'examples'\
        \ and rel.startswith('original-examples'))\\n    if wanted:\\n        try:\\n            data = subprocess.check_output(['sudo',\
        \ 'cat', str(f)])\\n            name = rel.replace('/', '-').replace('.', '_').upper()\\n            manifest['files'][name]\
        \ = {'source': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\\n            emit(name,\
        \ data)\\n        except Exception as ex:\\n            manifest['errors'].append({'file': rel, 'error':\
        \ repr(ex)})\\nemit('EXPORT-MANIFEST_JSON', json.dumps(manifest, indent=2).encode())\\nif manifest['errors']:\\\
        n    raise RuntimeError('independent evidence export errors: ' + repr(manifest['errors']))\"\ncode=code.replace(\"\
        '/mnt/nav-lfs/nav-build-metadata/aom-tooling'\",repr(str(p)))\nr=subprocess.run(['python3','-c',code],capture_output=True,text=True)\n\
        assert r.returncode==0,r.stderr\nparts={}\nfor line in r.stdout.splitlines():\n if line.startswith('NAV_RSVG_'):\n\
        \  name,value=line.split();parts.setdefault(name,[]).append(base64.b64decode(value))\nm=json.loads(gzip.decompress(b''.join(parts['NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64'])))\n\
        assert not m['errors'] and len(m['files'])==len(expected)\nfor name,v in m['files'].items():\n b=gzip.decompress(b''.join(parts['NAV_RSVG_'+name+'_GZB64']))\n\
        \ assert b==expected[v['source']] and len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256']\n\
        missing=code.replace(repr(str(p)),repr(str(p/'missing-area')))\nr=subprocess.run(['python3','-c',missing],capture_output=True,text=True)\n\
        assert r.returncode!=0 and 'NAV_RSVG_EXPORT-MANIFEST_JSON_GZB64 'in r.stdout\nprint('NAV_RSVG_REAL_ROOT_OWNED_EXPORT_AND_MISSING_SOURCE_SELFTEST_PASS')\n\
        EXPORT_SELFTEST\n"
    - name: Restore newest verified librsvg TRANSITIONAL root
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      env:
        TAR_OPTIONS: --overwrite
      with:
        path: /mnt/nav-rsvg-root.tar.zst
        key: nav-blfs13.1-x86_64-librsvg-transitional-open-v1
        fail-on-cache-miss: true
    - name: Verify newest saved root archive
      shell: bash
      run: 'set -euo pipefail

        printf ''b18303bde2a0da1f126fd595f21fd56ae353e1f2561adc0616337c380f21d2de  /mnt/nav-rsvg-root.tar.zst

        '' | sha256sum -c -

        zstd -t /mnt/nav-rsvg-root.tar.zst

        tar --zstd -xf /mnt/nav-rsvg-root.tar.zst -C /mnt/nav-lfs

        test -f /mnt/nav-lfs/nav-build-metadata/librsvg/RSVG-TRANSITIONAL-OPEN.json

        '
    - name: Authenticated recovery verify original full evidence no canonical tests replay
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'RECOVER'\nimport os,json,time,urllib.request,hashlib,base64,gzip,re\n\
        from pathlib import Path\nTOKEN=os.environ['GH_TOKEN'];assert TOKEN\nBASE='https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/'\n\
        class SafeRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,req,fp,code,msg,headers,newurl):\n\
        \  new=super().redirect_request(req,fp,code,msg,headers,newurl)\n  if new is not None and not newurl.startswith('https://api.github.com/'):new.remove_header('Authorization')\n\
        \  return new\nOPENER=urllib.request.build_opener(SafeRedirect())\n_probe=urllib.request.Request('https://api.github.com/synthetic',headers={'Authorization':'Bearer\
        \ SYNTHETIC_NOT_A_SECRET'})\n_cross=SafeRedirect().redirect_request(_probe,None,302,'Found',{},'https://example.invalid/synthetic-log')\n\
        _same=SafeRedirect().redirect_request(_probe,None,302,'Found',{},'https://api.github.com/synthetic-next')\n\
        assert not _cross.has_header('Authorization') and _same.get_header('Authorization')=='Bearer SYNTHETIC_NOT_A_SECRET'\n\
        print('NAV_SAFE_REDIRECT_HEADER_SCOPE_SYNTHETIC_SELFTEST_PASS',flush=True)\ndef get(path):\n url=path if\
        \ path.startswith('https://api.github.com/')else BASE+path\n req=urllib.request.Request(url,headers={'Authorization':'Bearer\
        \ '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Cache-Control':'no-store'})\n\
        \ with OPENER.open(req,timeout=90)as r:return r.read()\ndef inventory():\n d=json.loads(get('actions/caches?per_page=100'));assert\
        \ d['total_count']==len(d['actions_caches']);return {str(x['id']):{k:x[k]for k in ['key','ref','version','size_in_bytes']}for\
        \ x in d['actions_caches']}\ndef unique_record(text,marker):\n rows=[]\n for l in text.splitlines():\n \
        \ l=re.sub(r'^\\S+Z ','',l)\n  if l.startswith(marker+' '):rows.append(json.loads(l.split(' ',1)[1]))\n\
        \ assert len(rows)==1,(marker,len(rows));return rows[0]\nraw=get('actions/jobs/135778672663/logs').decode();A=Path('/mnt/nav-lfs/nav-build-metadata/gtk-prerequisites/original');A.mkdir(parents=True,exist_ok=True)\n\
        manifest=unique_record(raw,'NAV_GTKPRE_EXPORT_MANIFEST_JSON');assert len(manifest)==26;parts={}\nfor l in\
        \ raw.splitlines():\n l=re.sub(r'^\\S+Z ','',l)\n if l.startswith('NAV_GTKPRE_')and'_GZB64 'in l:\n  k,v=l.split('\
        \ ',1);parts.setdefault(k,[]).append(base64.b64decode(v))\nfor k,v in manifest.items():\n b=gzip.decompress(b''.join(parts['NAV_GTKPRE_'+k+'_GZB64']));assert\
        \ len(b)==v['bytes']and hashlib.sha256(b).hexdigest()==v['sha256'];assert '/'not in v['file'];(A/v['file']).write_bytes(b)\n\
        rows=[json.loads(x)for x in(A/'graphene-testlog.json').read_text().splitlines()if x.strip()];assert len(rows)==22\
        \ and all(x['result']=='OK'for x in rows)\ncount=0\nfor x in rows:\n plans=re.findall(r'^1\\.\\.(\\d+)$',x['stdout'],re.M)\n\
        \ if plans:\n  assert len(plans)==1;n=int(plans[0]);assert len(re.findall(r'^ok(?:\\s|$)',x['stdout'],re.M))==n;assert\
        \ not re.search(r'^not ok(?:\\s|$)',x['stdout'],re.M);assert '# SKIP'not in x['stdout']and'# TODO'not in\
        \ x['stdout'];count+=n\nassert count==647\nmutest=[x for x in rows if x['name'].startswith('mutest:')];assert\
        \ len(mutest)==3\nsums=[]\nfor x in mutest:\n m=re.search(r'Total\\s+(\\d+) passing[^\\n]*\\n(\\d+) skipped\\\
        n(\\d+) failing',x['stdout']);assert m,x['name'];sums.append(tuple(map(int,m.groups())))\nassert sums==[(5,1,0),(4,0,0),(14,0,0)],sums\n\
        iso=[json.loads(x)for x in(A/'iso-codes-testlog.json').read_text().splitlines()if x.strip()];assert len(iso)==8\
        \ and all(x['result']=='OK'for x in iso)\nassert json.loads((A/'hicolor-discovery.json').read_text())==[]\n\
        a={'original_run':'https://github.com/hardiksayalwork-ai/nav-linux-build/actions/runs/44585917474/job/135778672663','all26_original_exports_exact':True,'graphene_meson_programs_OK':22,'graphene_native_plus_GI_TAP_expectations_OK':647,'mutest_nested_expectations_passed':23,'mutest_original_demonstration_skip_OPEN':1,'iso_original_programs_OK':8,'hicolor_original_tests':0,'original_run_final_audit_FAILED':'Spare\
        \ external mutest source moved into already-bundled mutest directory, audit expected parent; not a canonical\
        \ test failure.','canonical_tests_replayed_in_this_continuation':False,'original_unexported_binary_equivalence_NOT_CLAIMED':True}\n\
        (A.parent/'original-coverage.json').write_text(json.dumps(a,sort_keys=True));print('NAV_GTK_PREREQ_ORIGINAL_COVERAGE_JSON\
        \ '+json.dumps(a,sort_keys=True),flush=True)\n\nRECOVER\n"
    - name: Untouched release tar sources INCLUDING bundled mutest no extra fetch no move
      shell: bash
      run: "set -euo pipefail\npython3 - <<'SETUP'\nfrom pathlib import Path\nimport urllib.request,tarfile,hashlib,json\n\
        LOCK=[{'filename': 'graphene-1.10.8.tar.xz', 'url': 'https://download.gnome.org/sources/graphene/1.10/graphene-1.10.8.tar.xz',\
        \ 'md5': '169e3c507b5a5c26e9af492412070b81', 'sha256': 'a37bb0e78a419dcbeaa9c7027bcff52f5ec2367c25ec859da31dfde2928f279a',\
        \ 'top': 'graphene-1.10.8'}, {'filename': 'hicolor-icon-theme-0.18.tar.xz', 'url': 'https://icon-theme.freedesktop.org/releases/hicolor-icon-theme-0.18.tar.xz',\
        \ 'md5': 'ef14f3af03bcde9ed134aad626bdbaad', 'sha256': 'db0e50a80aa3bf64bb45cbca5cf9f75efd9348cf2ac690b907435238c3cf81d7',\
        \ 'top': 'hicolor-icon-theme-0.18'}, {'filename': 'iso-codes-v4.20.1.tar.gz', 'url': 'https://salsa.debian.org/iso-codes-team/iso-codes/-/archive/v4.20.1/iso-codes-v4.20.1.tar.gz',\
        \ 'md5': 'a8f16a62662ec13e55ca255a7c036ee3', 'sha256': '2d7d9f6084ab9ce6c534ce71a3dd5144b6e474f3c97616459a88f73f44a64bff',\
        \ 'top': 'iso-codes-v4.20.1'}]\nA=Path('/mnt/nav-lfs/sources/gtk-prereq-evidence');A.mkdir(parents=True,exist_ok=True)\n\
        (A/'source-lock.json').write_text(json.dumps(LOCK,sort_keys=True))\nfor x in LOCK:\n with urllib.request.urlopen(x['url'],timeout=120)as\
        \ r:b=r.read()\n assert hashlib.sha256(b).hexdigest()==x['sha256'],x['filename']\n p=Path('/mnt/nav-lfs/sources')/x['filename'];p.write_bytes(b)\n\
        \ with tarfile.open(p)as t:\n  for m in t:assert not m.name.startswith('/')and '..'not in Path(m.name).parts\n\
        \  t.extractall(p.parent)\n print('NAV_GTK_PREREQ_SOURCE_LOCK_OK',x['filename'],len(b),flush=True)\nPath('/mnt/nav-lfs/sources/nav-gtk-prereq-inner.sh').write_text('set\
        \ -euo pipefail\\numask 022\\nulimit -v 4194304\\nexport MAKEFLAGS=-j2\\nA=/sources/gtk-prereq-evidence\\\
        nP=/sources/gtk-prereq-payload\\nmkdir -p \"$A\" \"$P\"\\ncd /sources/graphene-1.10.8\\nmeson setup --prefix=/usr\
        \ --buildtype=release --wrap-mode=nodownload -Dintrospection=enabled build 2>&1 | tee \"$A/graphene-configure.log\"\
        \\nmeson introspect --tests build > \"$A/graphene-discovery.json\"\\npython3 /sources/nav-gtk-prereq-verify.py\
        \ discover graphene \"$A/graphene-discovery.json\"\\nninja -C build -j2 2>&1 | tee \"$A/graphene-build.log\"\
        \\nDESTDIR=\"$P\" ninja -C build install 2>&1 | tee \"$A/graphene-stage.log\"\\ncd /sources/iso-codes-v4.20.1\\\
        nmeson setup --prefix=/usr --wrap-mode=nodownload build 2>&1 | tee \"$A/iso-codes-configure.log\"\\nmeson\
        \ introspect --tests build > \"$A/iso-codes-discovery.json\"\\npython3 /sources/nav-gtk-prereq-verify.py\
        \ discover iso-codes \"$A/iso-codes-discovery.json\"\\nninja -C build -j2 2>&1 | tee \"$A/iso-codes-build.log\"\
        \\nDESTDIR=\"$P\" ninja -C build install 2>&1 | tee \"$A/iso-codes-stage.log\"\\ncd /sources/hicolor-icon-theme-0.18\\\
        nmeson setup --prefix=/usr --buildtype=release --wrap-mode=nodownload build 2>&1 | tee \"$A/hicolor-configure.log\"\
        \\nmeson introspect --tests build > \"$A/hicolor-discovery.json\"\\npython3 /sources/nav-gtk-prereq-verify.py\
        \ discover hicolor \"$A/hicolor-discovery.json\"\\nninja -C build -j2 2>&1 | tee \"$A/hicolor-build.log\"\
        \\nDESTDIR=\"$P\" ninja -C build install 2>&1 | tee \"$A/hicolor-stage.log\"\\n# Separate installed-payload\
        \ API smoke, NOT a replay of original unit tests.\\nLD_LIBRARY_PATH=\"$P/usr/lib\" GI_TYPELIB_PATH=\"$P/usr/lib/girepository-1.0\"\
        \ python3 - <<\\'SMOKE\\' | tee \"$A/staged-GI-smoke.log\"\\nimport gi\\nassert gi.__version__==\\'3.56.3\\\
        '\\ngi.require_version(\\'Graphene\\',\\'1.0\\')\\nfrom gi.repository import Graphene\\nv=Graphene.Vec3();v.init(1.0,2.0,3.0)\\\
        nassert (v.get_x(),v.get_y(),v.get_z())==(1.0,2.0,3.0)\\nprint(\\'NAV_GRAPHENE_SEPARATE_STAGED_GI_API_SMOKE_PASS\\\
        ')\\nSMOKE\\nPKG_CONFIG_PATH=\"$P/usr/lib/pkgconfig:$P/usr/share/pkgconfig\" pkg-config --modversion graphene-gobject-1.0\
        \ iso-codes default-icon-theme | tee \"$A/staged-pkgconfig-versions.log\"\\npython3 /sources/nav-gtk-prereq-verify.py\
        \ source\\npython3 /sources/nav-gtk-prereq-verify.py payload\\nmkdir -p \"$P/nav-build-metadata/gtk-prerequisites\"\
        \\ncp -a /nav-build-metadata/gtk-prerequisites/original \"$P/nav-build-metadata/gtk-prerequisites/\"\\ncp\
        \ /nav-build-metadata/gtk-prerequisites/original-coverage.json \"$P/nav-build-metadata/gtk-prerequisites/\"\
        \\ncp -a \"$A\" \"$P/nav-build-metadata/gtk-prerequisites/install-only-evidence\"\\n')\nPath('/mnt/nav-lfs/sources/nav-gtk-prereq-verify.py').write_text(\"\
        from pathlib import Path\\nimport json,hashlib,tarfile,os,sys,collections\\nA=Path('/sources/gtk-prereq-evidence');P=Path('/sources/gtk-prereq-payload');A.mkdir(exist_ok=True)\\\
        nmode=sys.argv[1]\\nif mode=='discover':\\n name=sys.argv[2];d=json.loads(Path(sys.argv[3]).read_text());names=[x['name']for\
        \ x in d];assert len(names)==len(set(names)),names\\n if name=='graphene':\\n  units=['box','euler','frustum','matrix','plane','point','point3d','quad','quaternion','ray','rect','simd','size','sphere','triangle','vec2','vec3','vec4','introspection.py'];assert\
        \ len(d)==22,(len(d),names)\\n  assert all(any(y.split(':')[-1].split(' / ')[-1]==x for y in names)for x\
