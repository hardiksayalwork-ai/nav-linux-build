name: NAV LFS storage tools strict test stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  storage-tools:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-base-services-v1
        fail-on-cache-miss: true
    - name: Build util-linux nonroot and e2fsprogs full suite
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"util-linux-2.42.2.tar.xz\", \"url\": \"https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz\", \"bytes\": 10658220, \"book_md5\": \"1d70131b70abda3dec3b37e282a20c96\", \"sha256\": \"03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a\"\
        }, {\"filename\": \"e2fsprogs-1.47.4.tar.gz\", \"url\": \"https://downloads.sourceforge.net/project/e2fsprogs/e2fsprogs/v1.47.4/e2fsprogs-1.47.4.tar.gz\", \"bytes\": 10106395, \"book_md5\": \"733a93bc688314834ff2d10530ff4dc4\", \"sha256\": \"2cec05f39c20ee621f14926195664e66e6017190ac8e4bbdb16d86082e43c5da\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/storage-tools.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\"\
        \ > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  find tests/diff -type f -maxdepth 3 -print -exec cat {} \\\\\\\\; || true\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf util-linux-2.42.2.tar.xz\\\\ncd util-linux-2.42.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE util-linux-2.42.2\\\\\\\\n\\\\\\'\\\\n./configure --bindir=/usr/bin     \\\\\\\\\\\\n            --libdir=/usr/lib\
        \     \\\\\\\\\\\\n            --runstatedir=/run    \\\\\\\\\\\\n            --sbindir=/usr/sbin   \\\\\\\\\\\\n            --disable-chfn-chsh   \\\\\\\\\\\\n            --disable-login       \\\\\\\\\\\\n            --disable-nologin     \\\\\\\\\\\\n            --disable-su          \\\\\\\\\\\\n            --disable-setpriv     \\\\\\\\\\\\n            --disable-runuser     \\\\\\\\\\\\n            --disable-pylibmount  \\\\\\\\\\\\n            --disable-liblastlog2 \\\\\\\\\\\\n            --disable-static      \\\\\\\\\\\\n            --without-python      \\\\\\\\\\\\n            ADJTIME_PATH=/var/lib/hwclock/adjtime \\\\\\\\\\\\n            --docdir=/usr/share/doc/util-linux-2.42.2\\\\nmake\\\\ntouch /etc/fstab\\\\nchown -R tester .\\\\nrun_test util-linux su tester -c \"LC_ALL=en_US.UTF-8 make -j2 -k check\"\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE util-linux-2.42.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- util-linux-2.42.2\\\\ncd /sources\\\\ntar -xf\
        \ e2fsprogs-1.47.4.tar.gz\\\\ncd e2fsprogs-1.47.4\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE e2fsprogs-1.47.4\\\\\\\\n\\\\\\'\\\\nmkdir -v build\\\\ncd       build\\\\n../configure --prefix=/usr       \\\\\\\\\\\\n             --sysconfdir=/etc   \\\\\\\\\\\\n             --enable-elf-shlibs \\\\\\\\\\\\n             --disable-libblkid  \\\\\\\\\\\\n             --disable-libuuid   \\\\\\\\\\\\n             --disable-uuidd     \\\\\\\\\\\\n             --disable-fsck\\\\nmake\\\\nrun_test e2fsprogs make -j2 check\\\\nmake install\\\\nrm -fv /usr/lib/{libcom_err,libe2p,libext2fs,libss}.a\\\\ngunzip -v /usr/share/info/libext2fs.info.gz\\\\ninstall-info --dir-file=/usr/share/info/dir /usr/share/info/libext2fs.info\\\\nmakeinfo -o      doc/com_err.info ../lib/et/com_err.texinfo\\\\ninstall -v -m644 doc/com_err.info /usr/share/info\\\\ninstall-info --dir-file=/usr/share/info/dir /usr/share/info/com_err.info\\\\nsed \\\\\\'s/metadata_csum_seed,//\\\\\\' -i /etc/mke2fs.conf\\\\nprintf \\\\\\\
        'DONE_FINAL_PACKAGE e2fsprogs-1.47.4\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- e2fsprogs-1.47.4\\\\nmount --version\\\\nlsblk --version\\\\nmke2fs -V\\\\ntruncate -s 32M /tmp/nav-ext4-smoke.img\\\\nmke2fs -q -t ext4 -F /tmp/nav-ext4-smoke.img\\\\ne2fsck -fn /tmp/nav-ext4-smoke.img\\\\nrm /tmp/nav-ext4-smoke.img\\\\nprintf \\\\\\'NAV_STORAGE_TOOLS_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'Util-linux nonroot suite only (root suite deliberately not run); e2fsprogs full suite and ext4-image fsck smoke. No kernel/boot/desktop claim.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_STORAGE_TOOLS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\\
        nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/storage-tools.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail;\
        \ test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/storage-tools.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_STORAGE','NAV_TEST','NAV_PACKAGE','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested storage tools checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-storage-tools-v1
