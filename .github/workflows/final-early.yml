name: NAV LFS final early libraries tested stage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  final-early:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore audited final libc checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-libc-v1
        fail-on-cache-miss: true
    - name: Build final libraries codecs and tools with upstream suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"LFS13.1-systemd\", \"sources\": [{\"filename\": \"zlib-1.3.2.tar.gz\", \"url\": \"https://zlib.net/fossils/zlib-1.3.2.tar.gz\", \"bytes\": 1502830, \"book_md5\": \"a1e6c958597af3c67d162995a342138a\", \"sha256\": \"bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16\"},\
        \ {\"filename\": \"bzip2-1.0.8.tar.gz\", \"url\": \"https://www.sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz\", \"bytes\": 810029, \"book_md5\": \"67e051268d0c475ea773822f7500d0e5\", \"sha256\": \"ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269\"}, {\"filename\": \"xz-5.8.3.tar.xz\", \"url\": \"https://github.com//tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz\", \"bytes\": 1548064, \"book_md5\": \"a02753f34e5546d20213b87f876a0933\", \"sha256\": \"fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6\"}, {\"filename\": \"lz4-1.10.0.tar.gz\", \"url\": \"https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz\", \"bytes\": 387114, \"book_md5\": \"dead9f5f1966d9ae56e1e32761e4e675\", \"sha256\": \"537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b\"}, {\"filename\": \"zstd-1.5.7.tar.gz\", \"url\": \"https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz\", \"bytes\": 2434947, \"book_md5\": \"780fc1896922b1bc52a4e90980cdda48\"\
        , \"sha256\": \"eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3\"}, {\"filename\": \"file-5.48.tar.gz\", \"url\": \"https://astron.com/pub/file/file-5.48.tar.gz\", \"bytes\": 2693209, \"book_md5\": \"423686e97f731d8c24e9cd1a22b03dec\", \"sha256\": \"ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283\"}, {\"filename\": \"readline-8.3.tar.gz\", \"url\": \"https://ftpmirror.gnu.org/readline/readline-8.3.tar.gz\", \"bytes\": 3419642, \"book_md5\": \"25a73bfb2a3ad7146c5e9d4408d9f6cd\", \"sha256\": \"fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc\"}, {\"filename\": \"pcre2-10.47.tar.bz2\", \"url\": \"https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.bz2\", \"bytes\": 2145789, \"book_md5\": \"aded5840ab5a7d772dd4e16fc294b665\", \"sha256\": \"47fe8c99461250d42f89e6e8fdaeba9da057855d06eb7fc08d9ca03fd08d7bc7\"}, {\"filename\": \"m4-1.4.21.tar.xz\", \"url\": \"https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.xz\",\
        \ \"bytes\": 2080016, \"book_md5\": \"8051eef7239b2f187791f2ab0034d6b7\", \"sha256\": \"f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66\"}, {\"filename\": \"bc-7.0.3.tar.xz\", \"url\": \"https://github.com/gavinhoward/bc/releases/download/7.0.3/bc-7.0.3.tar.xz\", \"bytes\": 474800, \"book_md5\": \"ad4db5a0eb4fdbb3f6813be4b6b3da74\", \"sha256\": \"91eb74caed0ee6655b669711a4f350c25579778694df248e28363318e03c7fc4\"}, {\"filename\": \"bzip2-1.0.8-install_docs-1.patch\", \"url\": \"https://www.linuxfromscratch.org/patches/lfs/13.1/bzip2-1.0.8-install_docs-1.patch\", \"bytes\": 1684, \"book_md5\": \"6a5ac7e89b791aae556de0f745916f7f\", \"sha256\": \"35e3bbd9642af51fef2a8a83afba040d272da42d7e3a251d8e43255a7b496702\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\\
        'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/final-early.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/manifests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n \"$@\" 2>&1 | tee \"/nav-build-metadata/tests/$name.log\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf zlib-1.3.2.tar.gz\\\\ncd zlib-1.3.2\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE zlib-1.3.2\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nrun_test zlib make check\\\\nmake install\\\\nrm -fv /usr/lib/libz.a\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE zlib-1.3.2\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- zlib-1.3.2\\\\ncd /sources\\\\ntar -xf bzip2-1.0.8.tar.gz\\\\ncd bzip2-1.0.8\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE bzip2-1.0.8\\\
        \\\\\\n\\\\\\'\\\\npatch -Np1 -i ../bzip2-1.0.8-install_docs-1.patch\\\\nsed -i \\\\\\'s@\\\\\\\\(ln -s -f \\\\\\\\)$(PREFIX)/bin/@\\\\\\\\1@\\\\\\' Makefile\\\\nsed -i \"s@(PREFIX)/man@(PREFIX)/share/man@g\" Makefile\\\\nmake -f Makefile-libbz2_so\\\\nmake clean\\\\nmake\\\\nprintf \\\\\\'NAV_PACKAGE_TEST_PASS bzip2-make-integrated-tests\\\\\\\\n\\\\\\'\\\\nmake PREFIX=/usr install\\\\ncp -av libbz2.so.* /usr/lib\\\\nln -sfv libbz2.so.1.0.8 /usr/lib/libbz2.so\\\\nln -sfv libbz2.so.1.0.8 /usr/lib/libbz2.so.1\\\\ncp -v bzip2-shared /usr/bin/bzip2\\\\nfor i in /usr/bin/{bzcat,bunzip2}; do\\\\n  ln -sfv bzip2 $i\\\\ndone\\\\nrm -fv /usr/lib/libbz2.a\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE bzip2-1.0.8\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- bzip2-1.0.8\\\\ncd /sources\\\\ntar -xf xz-5.8.3.tar.xz\\\\ncd xz-5.8.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE xz-5.8.3\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --docdir=/usr/share/doc/xz-5.8.3\\\
        \\nmake\\\\nrun_test xz make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE xz-5.8.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- xz-5.8.3\\\\ncd /sources\\\\ntar -xf lz4-1.10.0.tar.gz\\\\ncd lz4-1.10.0\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE lz4-1.10.0\\\\\\\\n\\\\\\'\\\\nmake BUILD_STATIC=no PREFIX=/usr\\\\nrun_test lz4 make -j1 check\\\\nmake BUILD_STATIC=no PREFIX=/usr install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE lz4-1.10.0\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- lz4-1.10.0\\\\ncd /sources\\\\ntar -xf zstd-1.5.7.tar.gz\\\\ncd zstd-1.5.7\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE zstd-1.5.7\\\\\\\\n\\\\\\'\\\\nmake prefix=/usr\\\\nrun_test zstd make check\\\\nmake prefix=/usr install\\\\nrm -v /usr/lib/libzstd.a\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE zstd-1.5.7\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- zstd-1.5.7\\\\ncd /sources\\\\ntar -xf file-5.48.tar.gz\\\\ncd file-5.48\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE file-5.48\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\
        \\nmake\\\\nrun_test file make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE file-5.48\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- file-5.48\\\\ncd /sources\\\\ntar -xf readline-8.3.tar.gz\\\\ncd readline-8.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE readline-8.3\\\\\\\\n\\\\\\'\\\\nsed -i \\\\\\'/MV.*old/d\\\\\\' Makefile.in\\\\nsed -i \\\\\\'/{OLDSUFF}/c:\\\\\\' support/shlib-install\\\\nsed -i \\\\\\'s/-Wl,-rpath,[^ ]*//\\\\\\' support/shobj-conf\\\\nsed -e \\\\\\'270a\\\\\\\\\\\\n     else\\\\\\\\\\\\n       chars_avail = 1;\\\\\\'      \\\\\\\\\\\\n    -e \\\\\\'288i\\\\\\\\   result = -1;\\\\\\' \\\\\\\\\\\\n    -i.orig input.c\\\\n./configure --prefix=/usr    \\\\\\\\\\\\n            --disable-static \\\\\\\\\\\\n            --with-curses    \\\\\\\\\\\\n            --docdir=/usr/share/doc/readline-8.3\\\\nmake SHLIB_LIBS=\"-lncursesw\"\\\\nmake install\\\\nprintf \\\\\\'NAV_PACKAGE_NO_UPSTREAM_SUITE readline\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE\
        \ readline-8.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- readline-8.3\\\\ncd /sources\\\\ntar -xf pcre2-10.47.tar.bz2\\\\ncd pcre2-10.47\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE pcre2-10.47\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr                       \\\\\\\\\\\\n            --docdir=/usr/share/doc/pcre2-10.47 \\\\\\\\\\\\n            --enable-unicode                    \\\\\\\\\\\\n            --enable-jit                        \\\\\\\\\\\\n            --enable-pcre2-16                   \\\\\\\\\\\\n            --enable-pcre2-32                   \\\\\\\\\\\\n            --enable-pcre2grep-libz             \\\\\\\\\\\\n            --enable-pcre2grep-libbz2           \\\\\\\\\\\\n            --enable-pcre2test-libreadline      \\\\\\\\\\\\n            --disable-static\\\\nmake\\\\nrun_test pcre2 make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE pcre2-10.47\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- pcre2-10.47\\\\ncd /sources\\\\ntar -xf m4-1.4.21.tar.xz\\\
        \\ncd m4-1.4.21\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE m4-1.4.21\\\\\\\\n\\\\\\'\\\\n./configure --prefix=/usr\\\\nmake\\\\nrun_test m4 make check\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE m4-1.4.21\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- m4-1.4.21\\\\ncd /sources\\\\ntar -xf bc-7.0.3.tar.xz\\\\ncd bc-7.0.3\\\\nprintf \\\\\\'BEGIN_FINAL_PACKAGE bc-7.0.3\\\\\\\\n\\\\\\'\\\\nCC=\\\\\\'gcc -std=c99\\\\\\' ./configure --prefix=/usr -G -O3 -r\\\\nmake\\\\nrun_test bc make test\\\\nmake install\\\\nprintf \\\\\\'DONE_FINAL_PACKAGE bc-7.0.3\\\\\\\\n\\\\\\'\\\\ncd /sources\\\\nrm -rf -- bc-7.0.3\\\\n\\\\nldconfig\\\\nprintf \\\\\\'NAV roundtrip compression\\\\\\' > /tmp/nav-codec-input\\\\nfor tool in gzip bzip2 xz lz4 zstd; do\\\\n \"$tool\" -c /tmp/nav-codec-input > /tmp/nav-codec-packed\\\\n \"$tool\" -dc /tmp/nav-codec-packed > /tmp/nav-codec-output\\\\n cmp /tmp/nav-codec-input /tmp/nav-codec-output\\\\n printf \\\\\\'NAV_COMPRESSION_ROUNDTRIP_OK %s\\\\\\\\n\\\\\\'\
        \ \"$tool\"\\\\ndone\\\\ntest \"$(printf \\\\\\'19+23\\\\\\\\n\\\\\\' | bc)\" = 42\\\\nprintf \\\\\\'NAV_BC_ARITHMETIC_OK\\\\\\\\n\\\\\\'\\\\nfile /usr/bin/gcc\\\\nrm -f /tmp/nav-codec-{input,packed,output}\\\\nprintf \\\\\\'LFS13.1 final packages through Bc built with available upstream suites; final base incomplete; not bootable desktop.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_FINAL_EARLY_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount\
        \ -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/final-early.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/final-early.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n\
        try:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_COMPRESSION','NAV_BC','NAV_FINAL','NAV_TESTER'])))\n\
        NAV_GUARD\n"
    - name: Preserve tested final early packages checkpoint
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-lfs13.1-x86_64-final-early-v1
