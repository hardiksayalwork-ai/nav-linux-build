name: NAV Qtbase source native six selected tests and pixels
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  qtbase:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qt-images-v1
        fail-on-cache-miss: true
    - name: Build native Qtbase, six upstream test executables, XCB codec TLS DBus GL smoke
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"qtbase-everywhere-src-6.11.2.tar.xz\", \"url\": \"https://download.qt.io/archive/qt/6.11/6.11.2/submodules/qtbase-everywhere-src-6.11.2.tar.xz\", \"bytes\": 50582668, \"sha256\": \"5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22\"}]}\\')\\nfor r in lock[\\\
        'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/qtbase.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 LC_ALL=POSIX QT6PREFIX=/opt/qt6\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/qtbase\\\\ncd /sources\\\\ntar -xf qtbase-everywhere-src-6.11.2.tar.xz\\\\ncd qtbase-everywhere-src-6.11.2\\\\nmkdir build\\\\n# Session bus at configure time prevents silent omission of the DBus test tree.\\\\ndbus-run-session -- /bin/bash -se <<\\\\\\'QT_BUILD\\\\\\'\\\\nexport QT6PREFIX=/opt/qt6\\\\ncd build\\\\n../configure -prefix\
        \ \"$QT6PREFIX\" -release -sysconfdir /etc/xdg -dbus-linked -openssl-linked -system-sqlite -system-doubleconversion -system-freetype -system-harfbuzz -system-png -system-jpeg -icu -fontconfig -opengl desktop -xcb -egl -no-rpath -no-sbom -journald -nomake examples -- -DQT_BUILD_TESTS=ON -DQT_BUILD_TESTS_BY_DEFAULT=OFF -DQT_BUILD_EXAMPLES=OFF\\\\ncp config.summary /nav-build-metadata/qtbase/config.summary\\\\ncp CMakeCache.txt /nav-build-metadata/qtbase/CMakeCache.txt\\\\npython3 - <<\\\\\\'FEATURES\\\\\\'\\\\nfrom pathlib import Path\\\\ns=Path(\\\\\\'CMakeCache.txt\\\\\\').read_text()\\\\nfor name in [\\\\\\'xcb\\\\\\',\\\\\\'opengl\\\\\\',\\\\\\'egl\\\\\\',\\\\\\'dbus\\\\\\',\\\\\\'openssl_linked\\\\\\',\\\\\\'icu\\\\\\',\\\\\\'fontconfig\\\\\\',\\\\\\'system_jpeg\\\\\\',\\\\\\'system_png\\\\\\',\\\\\\'system_freetype\\\\\\',\\\\\\'system_harfbuzz\\\\\\',\\\\\\'system_doubleconversion\\\\\\',\\\\\\'sql_sqlite\\\\\\',\\\\\\'system_sqlite\\\\\\']:\\\\n assert any(f\\\\\\'QT_FEATURE_{name}:{kind}=ON\\\
        \\\\' in s for kind in [\\\\\\'INTERNAL\\\\\\',\\\\\\'BOOL\\\\\\']),name\\\\nprint(\\\\\\'NAV_QT_FEATURE_ASSERTIONS_PASS\\\\\\')\\\\nFEATURES\\\\ncmake --build . --parallel 2\\\\n# Build a named subset, not a fabricated full-suite claim. The complete\\\\n# configured manifest is kept so unexecuted coverage stays visible.\\\\ncmake --build . --parallel 2 --target tst_qbytearray tst_qstring tst_json tst_qhash tst_qlist tst_qimage\\\\nctest --show-only=json-v1 > /nav-build-metadata/qtbase/configured-tests.json\\\\ncmake --install .\\\\nfind \"$QT6PREFIX\" -name \\\\\\'*.prl\\\\\\' -exec sed -i \\\\\\'/^QMAKE_PRL_BUILD_DIR/d\\\\\\' {} \\\\\\\\;\\\\nmkdir -p /etc/ld.so.conf.d\\\\nprintf \\\\\\'/opt/qt6/lib\\\\\\\\n\\\\\\' > /etc/ld.so.conf.d/qt6.conf\\\\nldconfig\\\\nexport PATH=/opt/qt6/bin:$PATH\\\\nmkdir -p /tmp/nav-runtime\\\\nchown tester /tmp/nav-runtime\\\\nchmod 700 /tmp/nav-runtime\\\\nXvfb :98 -screen 0 1024x768x24 -nolisten tcp -ac > /nav-build-metadata/tests/qtbase-xvfb.log\
        \ 2>&1 &\\\\nxv=$!\\\\ntrap \\\\\\'kill \"$xv\" 2>/dev/null || true\\\\\\' EXIT\\\\nfor i in {1..30};do test ! -S /tmp/.X11-unix/X98 || break;sleep 1;done\\\\ntest -S /tmp/.X11-unix/X98\\\\nchown -R tester /sources/qtbase-everywhere-src-6.11.2\\\\nset +e\\\\nsu tester -c \\\\\\'dbus-run-session -- env DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-runtime LIBGL_ALWAYS_SOFTWARE=1 TZ=UTC ctest --parallel 2 --timeout 180 --output-on-failure --output-junit /tmp/nav-qtbase-selected.xml --no-tests=error -R \"^tst_(qbytearray|qstring|json|qhash|qlist|qimage)$\"\\\\\\' > /nav-build-metadata/tests/qtbase-selected.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/qtbase-selected.log\\\\ncp /tmp/nav-qtbase-selected.xml /nav-build-metadata/tests/qtbase-selected.xml\\\\npython3 - <<\\\\\\'TEST_AUDIT\\\\\\'\\\\nimport xml.etree.ElementTree as E\\\\nfrom pathlib import Path\\\\nj=E.parse(\\\\\\'/tmp/nav-qtbase-selected.xml\\\\\\').getroot()\\\\ncases=j.findall(\\\\\\'.//testcase\\\\\\');assert\
        \ len(cases)==6,len(cases)\\\\nfailed=[c.attrib.get(\\\\\\'name\\\\\\')for c in cases if c.find(\\\\\\'failure\\\\\\')is not None or c.find(\\\\\\'error\\\\\\')is not None]\\\\nskipped=[c.attrib.get(\\\\\\'name\\\\\\')for c in cases if c.find(\\\\\\'skipped\\\\\\')is not None]\\\\nprint(\\\\\\'NAV_QT_SELECTED_TEST_AUDIT\\\\\\',len(cases),\\\\\\'CASES\\\\\\',len(failed),\\\\\\'FAILED\\\\\\',len(skipped),\\\\\\'CTEST_SKIPPED\\\\\\',flush=True)\\\\nassert not failed and not skipped\\\\nfor c in cases:\\\\n out=c.findtext(\\\\\\'system-out\\\\\\',\\\\\\'\\\\\\')\\\\n for line in out.splitlines():\\\\n  if \\\\\\'Totals:\\\\\\' in line:print(\\\\\\'NAV_QT_SELECTED_DETAIL\\\\\\',c.attrib.get(\\\\\\'name\\\\\\'),line,flush=True)\\\\nTEST_AUDIT\\\\ntest \"$rc\" = 0\\\\nprintf \\\\\\'NAV_QT_SELECTED_SIX_TEST_EXECUTABLES_PASS_NOT_FULL_SUITE\\\\\\\\n\\\\\\'\\\\nmkdir -p /sources/nav-qt-smoke\\\\ncp /sources/nav-qtbase-smoke.cpp /sources/nav-qt-smoke/main.cpp\\\\ncat > /sources/nav-qt-smoke/CMakeLists.txt\
        \ <<\\\\\\'SMOKE_CMAKE\\\\\\'\\\\ncmake_minimum_required(VERSION 3.22)\\\\nproject(nav_qt_smoke LANGUAGES CXX)\\\\nset(CMAKE_CXX_STANDARD 17)\\\\nfind_package(Qt6 REQUIRED COMPONENTS Widgets Network Sql DBus OpenGL)\\\\nqt_add_executable(nav-qt-smoke main.cpp)\\\\ntarget_compile_options(nav-qt-smoke PRIVATE -UNDEBUG)\\\\ntarget_link_libraries(nav-qt-smoke PRIVATE Qt6::Widgets Qt6::Network Qt6::Sql Qt6::DBus Qt6::OpenGL)\\\\nSMOKE_CMAKE\\\\n/opt/qt6/bin/qt-cmake -S /sources/nav-qt-smoke -B /sources/nav-qt-smoke/build -G Ninja -DCMAKE_BUILD_TYPE=Release\\\\ncmake --build /sources/nav-qt-smoke/build --parallel 2\\\\nsu tester -c \\\\\\'dbus-run-session -- env DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/nav-runtime LIBGL_ALWAYS_SOFTWARE=1 /sources/nav-qt-smoke/build/nav-qt-smoke\\\\\\'\\\\ncp /tmp/nav-qtbase-screen.png /nav-build-metadata/qtbase/native-screen.png\\\\npython3 - <<\\\\\\'SCREENSHOT\\\\\\'\\\\nimport base64\\\\nfrom pathlib import Path\\\\nprint(\\\\\\'NAV_QT_PIXEL_BASE64 \\\\\\'+base64.b64encode(Path(\\\
        \\\\'/tmp/nav-qtbase-screen.png\\\\\\').read_bytes()).decode())\\\\nSCREENSHOT\\\\nQT_BUILD\\\\ncat > /etc/profile.d/qt6.sh <<\\\\\\'PROFILE\\\\\\'\\\\nQT6DIR=/opt/qt6\\\\npathappend \"$QT6DIR/bin\" PATH\\\\npathappend \"$QT6DIR/lib/pkgconfig\" PKG_CONFIG_PATH\\\\nexport QT6DIR\\\\nPROFILE\\\\ncd /sources\\\\nrm -rf qtbase-everywhere-src-6.11.2 nav-qt-smoke nav-qtbase-smoke.cpp\\\\nprintf \\\\\\'Qtbase6.11.2 native release build with six selected upstream test executables and native XCB software-display smoke. NOT full Qt regression suite, not compositor/session/physicalinput/hardwareGPU acceptance. Optional missing features retained in config summary. Valgrind4fail separate unresolved. Desktop/ISO not finished.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_QTBASE_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\npython3 - <<\\'SMOKE_SOURCE\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/nav-qtbase-smoke.cpp\\').write_text(\\'#ifdef NDEBUG\\\
        \\n#undef NDEBUG\\\\n#endif\\\\n#include <QApplication>\\\\n#include <QWidget>\\\\n#include <QPainter>\\\\n#include <QScreen>\\\\n#include <QTimer>\\\\n#include <QJsonDocument>\\\\n#include <QJsonObject>\\\\n#include <QSqlDatabase>\\\\n#include <QSqlQuery>\\\\n#include <QSslSocket>\\\\n#include <QDBusConnection>\\\\n#include <QOpenGLContext>\\\\n#include <QOffscreenSurface>\\\\n#include <QOpenGLFunctions>\\\\n#include <QFontDatabase>\\\\n#include <QImageWriter>\\\\n#include <QImageReader>\\\\n#include <QProcess>\\\\n#include <QVariant>\\\\n#include <QPixmap>\\\\n#include <cassert>\\\\n#include <cstdio>\\\\nclass Panel:public QWidget{\\\\n void paintEvent(QPaintEvent*) override{\\\\n  QPainter p(this);p.setRenderHint(QPainter::Antialiasing);\\\\n  QLinearGradient bg(0,0,width(),height());bg.setColorAt(0,QColor(\"#101f42\"));bg.setColorAt(1,QColor(\"#235d6b\"));p.fillRect(rect(),bg);\\\\n  p.setPen(QPen(QColor(255,255,255,90),1));p.setBrush(QColor(255,255,255,24));p.drawRoundedRect(QRectF(42,38,556,284),26,26);\\\
        \\n  p.setPen(Qt::white);p.setFont(QFont(p.font().family(),23,QFont::Bold));p.drawText(QRect(74,68,480,48),\"NAV - Qt toolkit check\");\\\\n  p.setFont(QFont(p.font().family(),12));p.setPen(QColor(\"#c9e9f4\"));p.drawText(QRect(74,125,470,32),\"Native source build / XCB software display\");\\\\n  p.setPen(Qt::NoPen);p.setBrush(QColor(\"#63ebc6\"));p.drawRoundedRect(QRect(74,185,32,32),8,8);\\\\n  p.setBrush(QColor(\"#86bcff\"));p.drawRoundedRect(QRect(120,185,32,32),8,8);\\\\n  p.setPen(Qt::white);p.drawText(QRect(74,240,470,34),\"Library verification, not the finished desktop\");\\\\n }\\\\n};\\\\nint main(int argc,char**argv){\\\\n QApplication app(argc,argv);\\\\n assert(QGuiApplication::platformName()==\"xcb\");\\\\n const int f=QFontDatabase::addApplicationFont(\"/sources/qtbase-everywhere-src-6.11.2/tests/auto/shared/resources/testfont.ttf\");assert(f>=0);\\\\n const auto families=QFontDatabase::applicationFontFamilies(f);assert(!families.empty());app.setFont(QFont(families[0],12));\\\
        \\n QJsonDocument j(QJsonObject{{\"answer\",42},{\"os\",\"NAV\"}});assert(QJsonDocument::fromJson(j.toJson()).object()[\"answer\"].toInt()==42);\\\\n auto sql=QSqlDatabase::addDatabase(\"QSQLITE\");sql.setDatabaseName(\":memory:\");assert(sql.open());QSqlQuery q;assert(q.exec(\"SELECT 19+23\"));assert(q.next()&&q.value(0).toInt()==42);\\\\n assert(QSslSocket::supportsSsl());assert(QDBusConnection::sessionBus().isConnected());\\\\n assert(QProcess::execute(\"/usr/bin/true\",{})==0);\\\\n QImage image(32,24,QImage::Format_RGB32);image.fill(QColor(\"#63ebc6\"));assert(image.save(\"/tmp/nav-qt-png.png\"));assert(!QImage(\"/tmp/nav-qt-png.png\").isNull());assert(image.save(\"/tmp/nav-qt-jpeg.jpg\"));assert(!QImage(\"/tmp/nav-qt-jpeg.jpg\").isNull());\\\\n QOpenGLContext gl;assert(gl.create());QOffscreenSurface surface;surface.setFormat(gl.format());surface.create();assert(surface.isValid());assert(gl.makeCurrent(&surface));\\\\n auto funcs=gl.functions();funcs->initializeOpenGLFunctions();const\
        \ char*renderer=(const char*)funcs->glGetString(GL_RENDERER);assert(renderer);printf(\"NAV_QT_SMOKE OpenGL renderer: %s\\\\\\\\n\",renderer);gl.doneCurrent();\\\\n Panel w;w.resize(640,360);w.show();\\\\n QTimer::singleShot(800,[&](){assert(w.isVisible()&&w.windowHandle());QPixmap pix=w.screen()->grabWindow(w.winId());assert(!pix.isNull()&&pix.size()==QSize(640,360));const auto im=pix.toImage();assert(im.pixelColor(90,201).green()>180);assert(pix.save(\"/tmp/nav-qtbase-screen.png\"));puts(\"NAV_QT_SMOKE JSON SQLite TLS DBus process PNG JPEG OpenGL XCB screen-capture PASS; targeted smoke only\");app.quit();});\\\\n return app.exec();\\\\n}\\\\n\\')\\nSMOKE_SOURCE\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts\
        \ -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/qtbase.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke;\
        \ printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/qtbase.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise\
        \ RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve Qtbase selected-test checkpoint, not full desktop acceptance
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-qtbase-v1
