name: NAV source Mesa graphics strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  mesa:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-vulkan-prep-v1
        fail-on-cache-miss: true
    - name: Build Mesa graphics strict nonroot tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"mesa-26.1.7.tar.xz\", \"url\": \"https://mesa.freedesktop.org/archive/mesa-26.1.7.tar.xz\", \"bytes\": 77799016, \"book_md5\": \"1a3ea044abc823e2db8c6041e5adcc4f\", \"sha256\": \"25e0a669e6638c3563e7be32a0a09f1888317e6eed0d047dc41d49dc8de26c7d\"\
        }]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\npathlib.Path(\\'/mnt/nav-lfs/sources/mesa.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  test ! -f build/meson-logs/testlog.txt || tail -1000 build/meson-logs/testlog.txt\
        \ | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n tail -80 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\nulimit -c 0\\\\npkg-config --modversion wayland-client wayland-protocols libdrm x11 xshmfence vulkan\\\\nllvm-config --version\\\\ncd /sources\\\\ntar -xf mesa-26.1.7.tar.xz\\\\ncd mesa-26.1.7\\\\nmeson setup build --prefix=/usr --buildtype=release --wrap-mode=nofallback \\\\\\\\\\\\n -Dplatforms=x11,wayland -Dgallium-drivers=iris,crocus,radeonsi,llvmpipe,softpipe,virgl,svga,nouveau \\\\\\\\\\\\n -Dvulkan-drivers=intel,intel_hasvk,amd,swrast\
        \ -Dllvm=enabled -Dshared-llvm=enabled \\\\\\\\\\\\n -Dvalgrind=disabled -Dlibunwind=disabled -Dvideo-codecs=[] \\\\\\\\\\\\n -Dgallium-va=disabled -Dgallium-rusticl=false -Dglvnd=disabled -Dbuild-tests=true\\\\nninja -C build -j2\\\\nchown -R tester:tester .\\\\npython3 - <<\\\\\\'TEST_MANIFEST\\\\\\'\\\\nimport json,pathlib\\\\ns=json.loads(pathlib.Path(\\\\\\'build/meson-info/intro-tests.json\\\\\\').read_text())\\\\nassert len(s)>0,\\\\\\'Mesa has zero configured tests\\\\\\'\\\\nprint(\\\\\\'NAV_MESA_CONFIGURED_TESTS\\\\\\',len(s))\\\\nfor t in s: print(\\\\\\'NAV_MESA_TEST_NAME\\\\\\',t[\\\\\\'name\\\\\\'])\\\\nTEST_MANIFEST\\\\nrun_test mesa su tester -c \\\\\\'ulimit -c 0; TZ=UTC meson test -C build --no-rebuild --print-errorlogs --num-processes 2\\\\\\'\\\\ncp build/meson-logs/testlog.json /nav-build-metadata/tests/mesa-testlog.json\\\\ncp build/meson-info/intro-tests.json /nav-build-metadata/tests/mesa-test-manifest.json\\\\ncp build/meson-info/intro-buildoptions.json /nav-build-metadata/mesa-buildoptions.json\\\
        \\nninja -C build install\\\\nldconfig\\\\npkg-config --modversion egl glesv2 gl gbm\\\\ncat > /tmp/nav-egl.c <<\\\\\\'EGL_SMOKE\\\\\\'\\\\n#include <EGL/egl.h>\\\\n#include <EGL/eglext.h>\\\\n#include <GLES2/gl2.h>\\\\n#include <stdio.h>\\\\n#include <string.h>\\\\nint main(void){\\\\n PFNEGLGETPLATFORMDISPLAYEXTPROC get_display=(void*)eglGetProcAddress(\"eglGetPlatformDisplayEXT\");\\\\n if(!get_display)return 1;\\\\n EGLDisplay d=get_display(EGL_PLATFORM_SURFACELESS_MESA,EGL_DEFAULT_DISPLAY,0);\\\\n EGLint major,minor,n; EGLConfig config;\\\\n EGLint attrs[]={EGL_SURFACE_TYPE,EGL_PBUFFER_BIT,EGL_RENDERABLE_TYPE,EGL_OPENGL_ES2_BIT,EGL_RED_SIZE,8,EGL_GREEN_SIZE,8,EGL_BLUE_SIZE,8,EGL_ALPHA_SIZE,8,EGL_NONE};\\\\n EGLint surfattrs[]={EGL_WIDTH,8,EGL_HEIGHT,8,EGL_NONE};\\\\n EGLint ctxattrs[]={EGL_CONTEXT_CLIENT_VERSION,2,EGL_NONE};\\\\n if(!eglInitialize(d,&major,&minor)||!eglChooseConfig(d,attrs,&config,1,&n)||n<1||!eglBindAPI(EGL_OPENGL_ES_API))return 2;\\\\n EGLSurface s=eglCreatePbufferSurface(d,config,surfattrs);\
        \ EGLContext c=eglCreateContext(d,config,EGL_NO_CONTEXT,ctxattrs);\\\\n if(s==EGL_NO_SURFACE||c==EGL_NO_CONTEXT||!eglMakeCurrent(d,s,s,c))return 3;\\\\n const char *renderer=(const char*)glGetString(GL_RENDERER);\\\\n if(!renderer||!strstr(renderer,\"llvmpipe\"))return 4;\\\\n glClearColor(1,0,0,1);glClear(GL_COLOR_BUFFER_BIT);glFinish();\\\\n unsigned char pixel[4]={0};glReadPixels(0,0,1,1,GL_RGBA,GL_UNSIGNED_BYTE,pixel);\\\\n if(glGetError()!=GL_NO_ERROR||pixel[0]<250||pixel[1]>5||pixel[2]>5||pixel[3]<250)return 5;\\\\n printf(\"NAV_MESA_EGL_SOFTWARE_PIXEL_SMOKE_OK EGL%d.%d %s pixel=%u,%u,%u,%u\\\\\\\\n\",major,minor,renderer,pixel[0],pixel[1],pixel[2],pixel[3]);\\\\n eglMakeCurrent(d,EGL_NO_SURFACE,EGL_NO_SURFACE,EGL_NO_CONTEXT);eglDestroyContext(d,c);eglDestroySurface(d,s);eglTerminate(d);return 0;\\\\n}\\\\nEGL_SMOKE\\\\ngcc /tmp/nav-egl.c -o /tmp/nav-egl $(pkg-config --cflags --libs egl glesv2)\\\\nrun_test mesa-egl-software su tester -c \\\\\\'LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe\
        \ /tmp/nav-egl\\\\\\'\\\\ncat > /tmp/nav-vk-device.c <<\\\\\\'VK_SMOKE\\\\\\'\\\\n#include <vulkan/vulkan.h>\\\\n#include <stdio.h>\\\\nint main(void){\\\\n VkInstanceCreateInfo info={.sType=VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO};VkInstance instance;\\\\n if(vkCreateInstance(&info,0,&instance)!=VK_SUCCESS)return 1;\\\\n uint32_t count=0;if(vkEnumeratePhysicalDevices(instance,&count,0)!=VK_SUCCESS||count<1)return 2;\\\\n VkPhysicalDevice devices[16];if(count>16)return 3;\\\\n if(vkEnumeratePhysicalDevices(instance,&count,devices)!=VK_SUCCESS)return 4;\\\\n int cpu=0;for(uint32_t i=0;i<count;i++){VkPhysicalDeviceProperties p;vkGetPhysicalDeviceProperties(devices[i],&p);printf(\"NAV_MESA_VULKAN_DEVICE %s type=%u api=%u.%u.%u\\\\\\\\n\",p.deviceName,p.deviceType,VK_API_VERSION_MAJOR(p.apiVersion),VK_API_VERSION_MINOR(p.apiVersion),VK_API_VERSION_PATCH(p.apiVersion));if(p.deviceType==VK_PHYSICAL_DEVICE_TYPE_CPU)cpu=1;}\\\\n vkDestroyInstance(instance,0);if(!cpu)return 5;printf(\"NAV_MESA_VULKAN_CPU_ENUMERATION_SMOKE_OK\\\
        \\\\\\n\");return 0;\\\\n}\\\\nVK_SMOKE\\\\ngcc /tmp/nav-vk-device.c -o /tmp/nav-vk-device $(pkg-config --cflags --libs vulkan)\\\\nlvp=$(find /usr/share/vulkan/icd.d -name \\\\\\'*lvp*.json\\\\\\' -print -quit)\\\\ntest -n \"$lvp\"\\\\nrun_test mesa-vulkan-software su tester -c \"VK_DRIVER_FILES=$lvp /tmp/nav-vk-device\"\\\\ncd /sources\\\\nrm -rf mesa-26.1.7\\\\nprintf \\\\\\'Mesa26.1.7 strict configured nonroot suite; software EGL pixel readback and Vulkan CPU enumeration smokes. X11+Wayland Intel/AMD/software and Gallium virtual/Nouveau drivers built; no NVIDIA Vulkan (Rust pending), no VAAPI, no proprietary codec enablement. No real GPU/display/compositor acceptance.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_MESA_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation\
        \ private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/mesa.sh\\nchroot --userspec=101:101\
        \ \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/mesa.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource\
        \ or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_MESA','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested Mesa graphics
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-mesa-v1
