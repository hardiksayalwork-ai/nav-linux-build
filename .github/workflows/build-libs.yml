name: NAV source desktop build libraries strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  build-libs:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-unicode-xml-v1
        fail-on-cache-miss: true
    - name: Build nghttp2 libuv libarchive strict suites
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"foundation\": \"BLFS13.1-systemd\", \"sources\": [{\"filename\": \"nghttp2-1.70.0.tar.xz\", \"url\": \"https://github.com/nghttp2/nghttp2/releases/download/v1.70.0/nghttp2-1.70.0.tar.xz\", \"bytes\": 2018996, \"book_md5\": \"3df2b4b51caa13b76032bfd2d11d4ab2\", \"sha256\": \"e05cb1388eaca3830aded4ccf20044b6e1ac1a61411dcca11b0437c4285c8bc2\"\
        }, {\"filename\": \"libuv-v1.52.1.tar.gz\", \"url\": \"https://dist.libuv.org/dist/v1.52.1/libuv-v1.52.1.tar.gz\", \"bytes\": 1354296, \"book_md5\": \"db711bbe3822dd4fe51fad0cd78baa57\", \"sha256\": \"66d511b9e6e334c0e62279eb234fbfb2b3110b1479c09b95b44c7afca8cff9e7\"}, {\"filename\": \"libarchive-3.8.9.tar.xz\", \"url\": \"https://github.com/libarchive/libarchive/releases/download/v3.8.9/libarchive-3.8.9.tar.xz\", \"bytes\": 6617696, \"book_md5\": \"535e3afec5f61d493f0b1b9e8bcf7539\", \"sha256\": \"888c934f9d95648ecb9163dc8e23ab80a476ecb81a8f1154704a227b5b676dde\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nimport pathlib\\\
        npathlib.Path(\\'/mnt/nav-lfs/sources/build-libs.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nmkdir -p /nav-build-metadata/tests\\\\nrun_test(){\\\\n local name=\"$1\";shift\\\\n set +e\\\\n \"$@\" > \"/nav-build-metadata/tests/$name.log\" 2>&1\\\\n local rc=$?\\\\n set -e\\\\n cat \"/nav-build-metadata/tests/$name.log\"\\\\n if [ \"$rc\" -ne 0 ]; then\\\\n  printf \\\\\\'NAV_TEST_FAILURE %s status%s\\\\\\\\n\\\\\\' \"$name\" \"$rc\"\\\\n  tail -500 \"/nav-build-metadata/tests/$name.log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  find . -name test-suite.log -o -name testsuite.log | while read -r log; do\\\\n   printf \\\\\\'NAV_TEST_DIAGNOSTIC_FILE %s %s\\\\\\\\n\\\\\\' \"$name\" \"$log\"\\\\n   tail -1000 \"$log\" | sed \"s/^/NAV_TEST_DIAGNOSTIC $name /\"\\\\n  done\\\\n  exit \"$rc\"\\\\n fi\\\\n printf \\\\\\'NAV_PACKAGE_TEST_PASS %s\\\\\\\\n\\\\\\' \"$name\"\\\\n}\\\\ncd /sources\\\\ntar -xf nghttp2-1.70.0.tar.xz\\\
        \\ncd nghttp2-1.70.0\\\\nprintf \"BEGIN_FINAL_PACKAGE nghttp2-1.70.0\\\\\\\\n\"\\\\n./configure --prefix=/usr     \\\\\\\\\\\\n            --disable-static  \\\\\\\\\\\\n            --enable-lib-only \\\\\\\\\\\\n            --docdir=/usr/share/doc/nghttp2-1.70.0 &&\\\\nmake\\\\nrun_test nghttp2 make -j2 check\\\\nmake install\\\\nprintf \"DONE_FINAL_PACKAGE nghttp2-1.70.0\\\\\\\\n\"\\\\ncd /sources\\\\nrm -rf -- nghttp2-1.70.0\\\\ncd /sources\\\\ntar -xf libuv-v1.52.1.tar.gz\\\\ncd libuv-v1.52.1\\\\nprintf \"BEGIN_FINAL_PACKAGE libuv-v1.52.1\\\\\\\\n\"\\\\nsh autogen.sh                              &&\\\\n./configure --prefix=/usr --disable-static &&\\\\nmake \\\\nchown -R tester:tester .\\\\nrun_test libuv su tester -c \"LC_ALL=en_US.UTF-8 make -j2 check\"\\\\nmake install\\\\nprintf \"DONE_FINAL_PACKAGE libuv-v1.52.1\\\\\\\\n\"\\\\ncd /sources\\\\nrm -rf -- libuv-v1.52.1\\\\ncd /sources\\\\ntar -xf libarchive-3.8.9.tar.xz\\\\ncd libarchive-3.8.9\\\\nprintf \"BEGIN_FINAL_PACKAGE\
        \ libarchive-3.8.9\\\\\\\\n\"\\\\n./configure --prefix=/usr --disable-static &&\\\\nmake\\\\nchown -R tester:tester .\\\\nrun_test libarchive su tester -c \"LC_ALL=en_US.UTF-8 make -j2 check\"\\\\nmake install\\\\nprintf \"DONE_FINAL_PACKAGE libarchive-3.8.9\\\\\\\\n\"\\\\ncd /sources\\\\nrm -rf -- libarchive-3.8.9\\\\nldconfig\\\\npkg-config --modversion libnghttp2 libuv libarchive\\\\nbsdtar --version\\\\nbsdunzip --version\\\\nprintf \\\\\\'NAV_BUILD_LIBS_SMOKE_OK\\\\\\\\n\\\\\\'\\\\nprintf \\\\\\'BLFS13.1 nghttp2 libuv libarchive configured suites passed, libuv/libarchive nonroot.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nfind /tmp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +\\\\nprintf \\\\\\'NAV_BUILD_LIBS_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind\
        \ \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/build-libs.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin\
        \ /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/build-libs.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 5120\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n\
        \  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_BUILD_LIBS','NAV_TEST','NAV_BISON','NAV_TESTER'])))\nNAV_GUARD\n"
    - name: Preserve tested build libraries
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-build-libs-v1
