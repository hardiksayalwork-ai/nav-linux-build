name: NAV real portal JSON prerequisite strict tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nav-source-build
  cancel-in-progress: false
jobs:
  portal-json:
    if: github.repository == 'hardiksayalwork-ai/nav-linux-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: Prepare owned isolated target directory
      shell: bash
      run: 'set -euo pipefail

        sudo mkdir -p /mnt/nav-lfs

        sudo chown "$(id -u):$(id -g)" /mnt/nav-lfs

        sudo modprobe uinput || true

        ls -ld /dev/input /dev/uinput || true

        '
    - name: Restore tested build infrastructure checkpoint
      id: cross
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-kf6-widgets-v1
        fail-on-cache-miss: true
    - name: Build JSON portal prerequisite all upstream configured tests
      shell: bash
      run: "python3 - <<'NAV_GUARD'\nimport os,pathlib,shutil,subprocess,time,signal,json\nmem=lambda: int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))\nassert os.cpu_count()>=4\nassert mem()>8*1024**2\nassert shutil.disk_usage('/mnt').free>12*1024**3\np=pathlib.Path('/tmp/nav-source-stage.sh');p.write_text('set -euo pipefail\\nexport LFS=/mnt/nav-lfs LC_ALL=POSIX\\nulimit -v 4194304\\numask 022\\ntest -x \"$LFS/usr/bin/gcc\"\\ntest -f \"$LFS/nav-build-metadata/stage.txt\"\\nmkdir -p \"$LFS/sources\"\\ncd \"$LFS/sources\"\\npython3 - <<\\'LOCKED_SOURCES\\'\\nimport urllib.request,hashlib,pathlib,json\\nlock=json.loads(\\'{\"sources\": [{\"filename\": \"json-glib-1.10.8.tar.xz\", \"url\": \"https://download.gnome.org/sources/json-glib/1.10/json-glib-1.10.8.tar.xz\", \"bytes\": 1294096, \"sha256\": \"55c5c141a564245b8f8fbe7698663c87a45a7333c2a2c56f06f811ab73b212dd\", \"blfs_md5\": \"95c3d5dd56d4ada808480739889b75bc\"}]}\\')\\nfor r in lock[\\'sources\\']:\\n with urllib.request.urlopen(r[\\'url\\'],timeout=90) as response:b=response.read(r[\\'bytes\\']+1)\\n assert len(b)==r[\\'bytes\\'] and hashlib.sha256(b).hexdigest()==r[\\'sha256\\'],r[\\'filename\\']\\n pathlib.Path(r[\\'filename\\']).write_bytes(b)\\n print(\\'SOURCE_SHA256_OK\\',r[\\'filename\\'],flush=True)\\nLOCKED_SOURCES\\npython3 - <<\\'INNER_SCRIPT\\'\\nfrom pathlib import Path\\nPath(\\'/mnt/nav-lfs/sources/portal-json.sh\\').write_text(\\'set -euo pipefail\\\\numask 022\\\\nulimit -v 4194304\\\\nchmod 1777 /tmp /var/tmp\\\\nexport MAKEFLAGS=-j2 CMAKE_BUILD_PARALLEL_LEVEL=2 PATH=/opt/qt6/bin:/usr/bin:/usr/sbin\\\\nexport LANG=C.UTF-8\\\\nunset LC_ALL LANGUAGE\\\\nmkdir -p /nav-build-metadata/tests /nav-build-metadata/portal\\\\ncd /sources\\\\ntar -xf json-glib-1.10.8.tar.xz\\\\ncd json-glib-1.10.8\\\\nmeson setup build --prefix=/usr --buildtype=release -Dtests=true -Dconformance=true -Ddocumentation=disabled -Dinstalled_tests=false\\\\nninja -C build -j2\\\\nchown -R tester .\\\\nset +e\\\\nsu tester -c \\\\\\'env -u LC_ALL -u LANGUAGE LANG=C.UTF-8 meson test -C build --num-processes 2 --print-errorlogs\\\\\\' > /nav-build-metadata/tests/portal-json.log 2>&1\\\\nrc=$?\\\\nset -e\\\\ncat /nav-build-metadata/tests/portal-json.log\\\\ncat build/meson-logs/testlog.txt\\\\ncp build/meson-logs/testlog.{txt,json} /nav-build-metadata/portal/\\\\npython3 - <<\\\\\\'AUDIT\\\\\\'\\\\nfrom pathlib import Path\\\\nimport json,re,base64\\\\ns=Path(\\\\\\'build/meson-logs/testlog.txt\\\\\\').read_bytes()\\\\nfor i in range(0,len(s),3000):print(\\\\\\'NAV_PORTAL_JSON_LOG_B64\\\\\\',base64.b64encode(s[i:i+3000]).decode(),flush=True)\\\\nr=[json.loads(x)for x in Path(\\\\\\'build/meson-logs/testlog.json\\\\\\').read_text().splitlines()if x.strip()]\\\\nprint(\\\\\\'NAV_PORTAL_JSON_RESULTS\\\\\\',[(x[\\\\\\'name\\\\\\'],x[\\\\\\'result\\\\\\'])for x in r],flush=True)\\\\nassert len(r)>=14 and all(x[\\\\\\'result\\\\\\']==\\\\\\'OK\\\\\\'for x in r)\\\\nfor x in r:\\\\n for key in [\\\\\\'stdout\\\\\\',\\\\\\'stderr\\\\\\']:\\\\n  assert not re.search(r\\\\\\'^not ok|#\\\\\\\\s*(SKIP|TODO)\\\\\\',x.get(key,\\\\\\'\\\\\\'),re.M|re.I),(x[\\\\\\'name\\\\\\'],key)\\\\nAUDIT\\\\ntest \"$rc\" = 0\\\\nninja -C build install\\\\nldconfig\\\\npkg-config --modversion json-glib-1.0\\\\ncd /sources\\\\nrm -rf json-glib-1.10.8\\\\nprintf \\\\\\'JSON-GLib source built; all configured upstream tests and TAP subcases strict. CoreAddons Documents portal still pending actual service, not waived. Full desktop compositor and ISO unfinished. Valgrind4 unresolved.\\\\\\\\n\\\\\\' > /nav-build-metadata/stage.txt\\\\nprintf \\\\\\'NAV_PORTAL_JSON_STAGE_COMPLETE\\\\\\\\n\\\\\\'\\\\n\\')\\nINNER_SCRIPT\\nsudo chown -hR root:root \"$LFS\"\\nsudo chown -R 101:101 \"$LFS/home/tester\"\\nsudo env LFS=\"$LFS\" unshare --mount --propagation private /bin/bash <<\\'NAV_MOUNT_BUILD\\'\\nset -euo pipefail\\nmount --bind \"$LFS\" \"$LFS\"\\nmkdir -p \"$LFS\"/{dev,proc,sys,run}\\nmount --bind /dev \"$LFS/dev\"\\nmount -t devpts devpts -o gid=5,mode=0620 \"$LFS/dev/pts\"\\nmount -t proc proc \"$LFS/proc\"\\nmount -t sysfs -o ro sysfs \"$LFS/sys\"\\nmount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/run\"\\nif [ -h \"$LFS/dev/shm\" ]; then\\n install -d -m 1777 \"$LFS$(realpath /dev/shm)\"\\nelse\\n mount -t tmpfs -o nosuid,nodev tmpfs \"$LFS/dev/shm\"\\nfi\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nchroot \"$LFS\" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/bin:/usr/sbin MAKEFLAGS=-j2 TESTSUITEFLAGS=-j2 LC_ALL=POSIX /bin/bash --noprofile --norc /sources/portal-json.sh\\nchroot --userspec=101:101 \"$LFS\" /usr/bin/env -i HOME=/home/tester TERM=dumb PATH=/usr/bin:/usr/sbin /bin/bash --noprofile --norc -c \\'set -euo pipefail; test \"$(id -u)\" = 101; touch /home/tester/nav-smoke; rm /home/tester/nav-smoke; printf \"NAV_TESTER_UID101_OK\\\\n\"\\'\\nNAV_MOUNT_BUILD\\n# Namespace exit unmounts virtual filesystems before checkpoint. Restore builder\\n# ownership only for readable cache packaging; next native build resets root ownership.\\nsudo rm -f \"$LFS/sources/\"*.tar.* \"$LFS/sources/portal-json.sh\"\\nsudo chown -hR \"$(id -u):$(id -g)\" \"$LFS\"\\ndu -sh \"$LFS\"\\ntest \"$(du -sm \"$LFS\" | cut -f1)\" -lt 4096\\n')\nstart=time.monotonic();log=open('/tmp/nav-source-stage.log','w');proc=subprocess.Popen(['bash',str(p)],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\ntry:\n while proc.poll() is None:\n  free=shutil.disk_usage('/mnt').free;available=mem()\n  if free<4*1024**3 or available<2*1024**2 or time.monotonic()-start>315*60:\n   raise RuntimeError('resource or stage-time safety floor reached')\n  print(json.dumps({'elapsed_seconds':round(time.monotonic()-start),'free_disk_bytes':free,'available_memory_kib':available}),flush=True)\n  time.sleep(20)\n if proc.returncode:raise RuntimeError('source-build failed with status '+str(proc.returncode))\nfinally:\n if proc.poll() is None:\n  os.killpg(proc.pid,signal.SIGTERM)\n  try:proc.wait(timeout=10)\n  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait()\n log.close()\n lines=pathlib.Path('/tmp/nav-source-stage.log').read_text(errors='replace').splitlines()\n print('\\n'.join(lines[-80:]));print('\\n'.join(x for x in lines if any(k in x for k in ['SOURCE_SHA256_OK','BEGIN_FINAL_PACKAGE','DONE_FINAL_PACKAGE','NAV_PACKAGE','NAV_INPUT','NAV_QT','NAV_DISPLAY','NAV_TEST','NAV_BISON','NAV_TESTER','NAV_KF6','Totals:','FAIL!','SKIP','platform plugin','could not connect'])))\nNAV_GUARD\n"
    - name: Preserve tested portal JSON prerequisite
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/nav-lfs
        key: nav-blfs13.1-x86_64-portal-json-v1
