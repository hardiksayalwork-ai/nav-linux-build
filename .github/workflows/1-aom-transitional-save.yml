    - name: Verify complete root bundle and measured cache headroom no pruning
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        root=$(du -sb /mnt/nav-lfs | cut -f1)

        test "$root" -lt 5368709120

        test -f /mnt/nav-lfs/nav-build-metadata/aom/AOM-TRANSITIONAL-OPEN.json

        tar --zstd -cf /mnt/nav-aom-root.tar.zst -C /mnt/nav-lfs .

        zstd -t /mnt/nav-aom-root.tar.zst

        tar --zstd -tf /mnt/nav-aom-root.tar.zst > /tmp/nav-aom-archive-members

        ! grep -Eq ''^./sources/(numpy-tooling-prefix|libaom-3.15.3/|aom-testdata/)''  /tmp/nav-aom-archive-members

        grep -qx ''./usr/include/aom/aom.h'' /tmp/nav-aom-archive-members

        python3 - <<''BUDGET''

        import ctypes,ctypes.util,urllib.request,json,os,hashlib

        from pathlib import Path

        p=Path(''/mnt/nav-aom-root.tar.zst'');size=p.stat().st_size

        z=ctypes.CDLL(ctypes.util.find_library(''zstd''));z.ZSTD_compressBound.argtypes=[ctypes.c_size_t];z.ZSTD_compressBound.restype=ctypes.c_size_t

        # Cache contains this one fixed-size regular file. One MiB covers tar/PAX headers and end blocks; 64MiB
        covers frame/chunk protocol overhead.

        worst=z.ZSTD_compressBound(size+1024**2)+64*1024**2

        req=urllib.request.Request(''https://api.github.com/repos/hardiksayalwork-ai/nav-linux-build/actions/caches?per_page=100'',headers={''Authorization'':''Bearer
        ''+os.environ[''GITHUB_TOKEN''],''Accept'':''application/vnd.github+json''})

        with urllib.request.urlopen(req,timeout=60)as r:data=json.load(r)

        assert data[''total_count'']==len(data[''actions_caches''])<=100

        keys={x[''key'']for x in data[''actions_caches'']}

        for key in [''nav-blfs13.1-x86_64-git-open-v1'',''nav-blfs13.1-x86_64-giflib-open-v1'']+[''nav-lfs13.1-x86_64-''+x+''-v1''for
        x in [''final-gcc'',''gcc-test-runtime'',''gcc-test-cxx'',''gcc-test-c'',''access-tools'',''final-math'']]:assert
        key in keys,key

        assert ''nav-blfs13.1-x86_64-jxl-open-v1''in keys

        assert ''nav-aom-3.15.3-disposable-source-tests-v1''in keys

        assert ''nav-blfs13.1-x86_64-aom-open-v1''not in keys

        existing=sum(x[''size_in_bytes'']for x in data[''actions_caches'']);print(''NAV_AOM_ROOT_MEASURED_CACHE_GATE'',json.dumps({''existing'':existing,''bundle_bytes'':size,''bundle_sha256'':hashlib.file_digest(p.open(''rb''),''sha256'').hexdigest(),''new_cache_upper'':worst,''worst_total'':existing+worst,''limit'':10*1024**3}),flush=True)

        assert existing+worst<10*1024**3

        BUDGET

        '
